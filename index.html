<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ พิชิตจักรวาลคณิตศาสตร์ ม.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff006e;
            --neon-purple: #b537f2;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --neon-orange: #ff6b35;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(15, 15, 35, 0.95);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --warrior-primary: #ff6b35;
            --warrior-secondary: #cc4400;
            --mage-primary: #b537f2;
            --mage-secondary: #7b2ff7;
            --rogue-primary: #39ff14;
            --rogue-secondary: #00b09b;
            --glow-blue: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 0, 110, 0.5);
            --glow-purple: 0 0 20px rgba(181, 55, 242, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #0a0a1a;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 110, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(181, 55, 242, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            90% {
                transform: translateX(-3px);
            }
            20%,
            80% {
                transform: translateX(3px);
            }
            30%,
            70% {
                transform: translateX(-3px);
            }
            40%,
            60% {
                transform: translateX(3px);
            }
            50% {
                transform: translateX(-3px);
            }
        }

        .screen-shake {
            animation: shake 0.5s ease-in-out;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        @keyframes attackShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-12px);
            }
            75% {
                transform: translateX(12px);
            }
        }
        .attacking {
            animation: attackShake 0.3s ease-in-out;
        }

        @keyframes hitFlash {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(2.5) saturate(2);
            }
        }
        .hit {
            animation: hitFlash 0.25s ease-in-out;
        }

        @keyframes bossDefeat {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.5;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
        .boss-defeated {
            animation: bossDefeat 0.8s ease-in forwards;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: particleFloat 1.5s ease-out forwards;
            font-weight: bold;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-shadow: 0 0 10px currentColor;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-60px) scale(1.3) rotate(180deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-120px) scale(0.8) rotate(360deg);
                opacity: 0;
            }
        }

        .main-container {
            width: 100%;
            max-width: 750px;
            position: relative;
            z-index: 1;
            padding: 10px;
        }

        .game-wrapper {
            background: var(--card-bg);
            border-radius: 24px;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2), 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            backdrop-filter: blur(20px);
            transition: box-shadow 0.3s;
        }

        .game-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-blue));
            border-radius: 26px;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes borderGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .game-header {
            padding: 20px 25px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
            border-bottom: 1px solid var(--glass-border);
        }

        .creator-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2), rgba(181, 55, 242, 0.2));
            border: 1px solid var(--neon-pink);
            padding: 8px 20px;
            border-radius: 20px;
            margin-bottom: 12px;
            animation: badgePulse 2s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 0, 110, 0.7);
            }
        }
        .creator-badge span {
            font-weight: 700;
            font-size: 13px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green), var(--neon-yellow), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        @keyframes titleShine {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.4);
            }
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .game-content {
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .game-content::-webkit-scrollbar {
            width: 6px;
        }
        .game-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .game-content::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 3px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.6);
        }
        .btn-success {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.6);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-outline:hover {
            background: rgba(0, 240, 255, 0.1);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 11px;
            border-radius: 8px;
        }

        /* Class selection */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .class-card {
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
        }
        .class-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.3);
        }
        .class-card.selected {
            border-color: var(--neon-green);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            background: rgba(57, 255, 20, 0.1);
        }
        .class-icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
        .class-name {
            font-weight: 700;
            color: white;
            font-size: 16px;
        }
        .class-desc {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            line-height: 1.4;
        }

        /* Chapter cards */
        .chapter-container {
            margin-bottom: 12px;
        }
        .chapter-header {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.08), rgba(181, 55, 242, 0.08));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }
        .chapter-header:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .chapter-header.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chapter-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .chapter-info {
            flex: 1;
        }
        .chapter-name {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }
        .chapter-progress {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        .level-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 8px 0 0 60px;
        }
        .level-btn {
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            text-align: center;
            font-family: 'Kanit', sans-serif;
        }
        .level-btn:hover:not(.locked) {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
            transform: translateY(-2px);
        }
        .level-btn.completed {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.15);
        }
        .level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .level-btn.current {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
            animation: pulseBorder 1.5s ease-in-out infinite;
        }
        @keyframes pulseBorder {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 230, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 230, 0, 0.7);
            }
        }

        /* Battle scene */
        .battle-scene {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(15, 15, 35, 0.9) 100%);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .battle-scene::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.5), transparent);
            pointer-events: none;
            z-index: 1;
        }
        .combatants-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: relative;
            z-index: 2;
        }
        .combatant {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .pixel-canvas {
            display: block;
            margin: 0 auto 8px;
            image-rendering: pixelated;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }
        .pixel-canvas.boss-canvas {
            box-shadow: 0 0 25px rgba(255, 0, 110, 0.6);
            animation: bossGlow 1.5s ease-in-out infinite;
        }
        @keyframes bossGlow {
            0%,
            100% {
                box-shadow: 0 0 25px rgba(255, 0, 110, 0.6);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 0, 110, 1);
            }
        }

        .hp-bar-outer {
            background: #1a1a2e;
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 6px;
        }
        .hp-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #00f0ff, #00c6ff);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .hp-bar-inner.boss-hp {
            background: linear-gradient(90deg, #ff006e, #ff4b2b);
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.5);
        }
        .hp-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 3px;
        }

        .vs-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 28px;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.7);
            animation: vsPulse 1s ease-in-out infinite;
        }
        @keyframes vsPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .question-panel {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }
        .question-display {
            font-size: 19px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .answer-input-row {
            display: flex;
            gap: 10px;
        }
        .answer-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: 'Kanit', sans-serif;
        }
        .answer-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .answer-input:disabled {
            opacity: 0.6;
        }

        .combo-display {
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            min-height: 24px;
            font-family: 'Press Start 2P', cursive;
        }
        .combo-display.active {
            color: var(--neon-yellow);
            animation: comboShake 0.5s ease-in-out;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
        }
        @keyframes comboShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            flex-wrap: wrap;
            gap: 5px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-value {
            font-weight: 700;
            color: var(--neon-blue);
        }

        .shop-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .shop-item:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(181, 55, 242, 0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .badge-warning {
            background: rgba(255, 230, 0, 0.2);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }
        .badge-success {
            background: rgba(57, 255, 20, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }
        .badge-info {
            background: rgba(0, 240, 255, 0.2);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }
        .badge-danger {
            background: rgba(255, 0, 110, 0.2);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 11px;
        }
        .text-lg {
            font-size: 18px;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-4 {
            margin-top: 16px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-4 {
            margin-bottom: 16px;
        }
        .w-full {
            width: 100%;
        }
        .progress-bar {
            background: #1a1a2e;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            transition: width 0.5s;
        }
        .skill-cooldown-indicator {
            font-size: 10px;
            color: var(--neon-yellow);
            text-align: center;
            margin-top: 2px;
            min-height: 14px;
        }

        @media (max-width: 600px) {
            .class-grid {
                grid-template-columns: 1fr;
            }
            .level-list {
                grid-template-columns: 1fr 1fr;
                padding-left: 0;
            }
            .combatants-row {
                flex-direction: column;
                gap: 5px;
            }
            .vs-badge {

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type = 'sine', duration = 0.15, vol = 0.08) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function drawPixelCharacter(canvas, pixels, scale = 4, primaryColor = '#00f0ff', secondaryColor = '#005580') {
            const ctx = canvas.getContext('2d');
            const size = 16;
            canvas.width = size * scale;
            canvas.height = size * scale;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = false;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const pixel = (pixels[y] && pixels[y][x] !== undefined) ? pixels[y][x] : 0;
                    if (pixel === 1) { ctx.fillStyle = primaryColor;
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 2) { ctx.fillStyle =
                            secondaryColor;
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 3) { ctx.fillStyle =
                            '#ffffff';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 4) { ctx.fillStyle =
                            '#ffcc00';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 5) { ctx.fillStyle =
                            '#ff4444';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 6) { ctx.fillStyle =
                            '#000000';
                        ctx.fillRect(x * scale, y * scale, scale, scale); }
                }
            }
        }

        // Player state

        function loadGame() {
            try {
                const saved = JSON.parse(localStorage.getItem('mathquest_tawan_v2'));
                if (saved) {
                    player.score = saved.score || 0;
                    player.maxCombo = saved.maxCombo || 0;
                    player.totalCorrect = saved.totalCorrect || 0;
                    player.totalWrong = saved.totalWrong || 0;
                    inventory = saved.inventory || { weapon: false, shield: false, orb: false, potion: 0 };
                    analytics = saved.analytics || {};
                    completedLevels = saved.completedLevels || {};
                    unlockedChapters = saved.unlockedChapters || [1];
                    player.name = saved.name || 'ผู้กล้า';
                    playerClass = saved.playerClass || 'warrior';
                    player.maxHp = getMaxHp();
                    player.hp = player.maxHp;
                }
            } catch (e) { console.log('No save found'); }
        }

        function saveGame() {
            const data = {
                score: player.score,
                maxCombo: player.maxCombo,
                totalCorrect: player.totalCorrect,
                totalWrong: player.totalWrong,
                inventory: inventory,
                analytics: analytics,
                completedLevels: completedLevels,
                unlockedChapters: unlockedChapters,
                name: player.name,
                playerClass: playerClass,
            };
            localStorage.setItem('mathquest_tawan_v2', JSON.stringify(data));
        }

        function isLevelCompleted(chapterId, levelId) {
            return completedLevels[chapterId] && completedLevels[chapterId].includes(levelId);
        }

        function isLevelUnlocked(chapterId, levelId) {
            if (levelId === 1) return unlockedChapters.includes(chapterId);
            return isLevelCompleted(chapterId, levelId - 1);
        }

        function getChapterProgress(chapterId) {
            const total = 3;
            const done = (completedLevels[chapterId] || []).length;
            return Math.round((done / total) * 100);
        }

        function unlockNextLevel(chapterId, levelId) {
            if (!completedLevels[chapterId]) completedLevels[chapterId] = [];
            if (!completedLevels[chapterId].includes(levelId)) {
                completedLevels[chapterId].push(levelId);
            }
            // If all 3 levels done, unlock next chapter
            if (completedLevels[chapterId].length >= 3) {
                const nextCh = chapterId + 1;
                if (nextCh <= 7 && !unlockedChapters.includes(nextCh)) {
                    unlockedChapters.push(nextCh);
                }
            }
            saveGame();
        }

        // ============================================
        // QUESTION GENERATOR
        // ============================================
        function generateQuestion(chapterId, difficulty) {
            let question, answer, hint;
            const ch = chapterId;
            const diff = difficulty || 1;

            switch (ch) {
                case 1: // Exponents
                    if (diff <= 1) {
                        const base = Math.floor(Math.random() * 3) + 2;
                        const exp1 = Math.floor(Math.random() * 2) + 2;
                        const exp2 = Math.floor(Math.random() * 2) + 1;
                        question =
                            `${base}<sup>${exp1}</sup> × ${base}<sup>${exp2}</sup> = ${base}<sup>?</sup> จงหาเลขชี้กำลังที่หายไป`;
                        answer = exp1 + exp2;
                        hint = 'สมบัติ: a^m × a^n = a^(m+n)';
                    } else if (diff === 2) {
                        const base = Math.floor(Math.random() * 3) + 3;
                        const exp = Math.floor(Math.random() * 2) + 2;
                        question = `(${base}^${exp})^2 = ${base}^? จงหา ?`;
                        answer = exp * 2;
                        hint = 'สมบัติ: (a^m)^n = a^(m×n)';
                    } else {
                        const base = Math.floor(Math.random() * 4) + 2;
                        const exp1 = Math.floor(Math.random() * 3) + 3;
                        const exp2 = Math.floor(Math.random() * 2) + 2;
                        question = `${base}^${exp1} ÷ ${base}^${exp2} = ${base}^?`;
                        answer = exp1 - exp2;
                        hint = 'สมบัติ: a^m ÷ a^n = a^(m-n)';
                    }
                    break;
                case 2: // Polynomials
                    if (diff <= 1) {
                        const a = Math.floor(Math.random() * 4) + 2;
                        const b = Math.floor(Math.random() * 4) + 1;
                        const x = Math.floor(Math.random() * 2) + 2;
                        question = `(${a}x + ${b}) + (${a*2}x - ${b}) เมื่อ x=${x} = ?`;
                        answer = (a * x + b) + (a * 2 * x - b);
                        hint = `แทนค่า x=${x}: (${a}×${x}+${b}) + (${a*2}×${x}-${b})`;
                    } else if (diff === 2) {
                        const a = Math.floor(Math.random() * 3) + 3;
                        const b = Math.floor(Math.random() * 3) + 2;
                        question = `(${a}x + ${b})(${a}x - ${b}) เมื่อ x=1 = ?`;
                        answer = (a + b) * (a - b);
                        hint = `แทนค่า x=1: (${a}+${b})(${a}-${b}) = ${a+b}×${a-b}`;
                    } else {
                        const a = Math.floor(Math.random() * 3) + 2;
                        const b = Math.floor(Math.random() * 3) + 2;
                        const c = Math.floor(Math.random() * 3) + 1;
                        question =
                            `(${a}x² + ${b}x + ${c}) + (${a*2}x² - ${b}x + ${c*2}) เมื่อ x=1 = ?`;
                        answer = (a + b + c) + (a * 2 - b + c * 2);
                        hint = `แทน x=1 แล้วรวมพจน์`;
                    }
                    break;
                case 3: // Factorization
                    if (diff <= 1) {
                        const n = Math.floor(Math.random() * 5) + 2;
                        question = `x² + ${2*n}x + ${n*n} = (x + ?)²`;
                        answer = n;
                        hint = `(x+a)² = x²+2ax+a² ดังนั้น a=${n}`;
                    } else if (diff === 2) {
                        const n = Math.floor(Math.random() * 5) + 2;
                        question = `x² - ${2*n}x + ${n*n} = (x - ?)²`;
                        answer = n;
                        hint = `(x-a)² = x²-2ax+a² ดังนั้น a=${n}`;
                    } else {
                        const n = Math.floor(Math.random() * 6) + 4;
                        question = `x² - ${n*n} = (x + ${n})(x - ?)`;
                        answer = n;
                        hint = `ผลต่างกำลังสอง: a²-b² = (a+b)(a-b)`;
                    }
                    break;
                case 4: // Congruence
                    if (diff <= 1) {
                        const side = Math.floor(Math.random() * 8) + 4;
                        question = `สามเหลี่ยมด้านเท่า มีด้านหนึ่งยาว ${side} ซม. ด้านที่เหลือยาวเท่าไร?`;
                        answer = side;
                        hint = 'สามเหลี่ยมด้านเท่า ทุกด้านเท่ากัน';
                    } else if (diff === 2) {
                        const angle = Math.floor(Math.random() * 30) + 40;
                        question =
                            `สามเหลี่ยมหน้าจั่วมีมุมยอด ${angle}° มุมที่ฐานกางมุมละกี่องศา?`;
                        answer = Math.round((180 - angle) / 2);
                        hint = `มุมในสามเหลี่ยมรวม 180°: (180-${angle})÷2`;
                    } else {
                        const a = Math.floor(Math.random() * 5) + 3;
                        const b = Math.floor(Math.random() * 5) + 3;
                        question =
                            `สามเหลี่ยมมุมฉากมีด้านประกอบฉาก ${a} และ ${b} หน่วย ด้านที่เหลือยาว?`;
                        answer = Math.round(Math.sqrt(a * a + b * b) * 10) / 10;
                        hint = `c² = ${a}² + ${b}² = ${a*a+b*b}, c=√${a*a+b*b}`;
                    }
                    break;
                case 5: // Pythagoras
                    const mult = Math.floor(Math.random() * 2) + diff;
                    const leg1 = 3 * mult;
                    const leg2 = 4 * mult;
                    question = `สามเหลี่ยมมุมฉากมีด้าน ${leg1} และ ${leg2} หน่วย ด้านตรงข้ามฉากยาว?`;
                    answer = 5 * mult;
                    hint = `c² = ${leg1}²+${leg2}² = ${leg1*leg1+leg2*leg2}, c=${answer}`;
                    break;
                case 6: // Statistics
                    if (diff <= 1) {
                        const nums = [Math.floor(Math.random() * 20) + 10, Math.floor(Math.random() * 20) + 30, Math
                            .floor(Math.random() * 20) + 50
                        ];
                        question = `ข้อมูล: ${nums.join(', ')} จงหาค่าเฉลี่ย`;
                        answer = Math.round((nums.reduce((s, v) => s + v, 0) / 3) * 10) / 10;
                        hint = `(${nums.join('+')}) ÷ 3`;
                    } else if (diff === 2) {
                        const nums = [Math.floor(Math.random() * 30) + 20, Math.floor(Math.random() * 30) + 40, Math
                            .floor(Math.random() * 30) + 60, Math.floor(Math.random() * 20) + 50, Math.floor(Math
                                .random() * 20) + 30
                        ];
                        question = `ข้อมูล: ${nums.join(', ')} จงหามัธยฐาน`;
                        const sorted = [...nums].sort((a, b) => a - b);
                        answer = sorted[2];
                        hint = `เรียงข้อมูลแล้วหาค่ากลาง: ${sorted.join(', ')}`;
                    } else {
                        const nums = [2, 3, 3, 4, 5, 5, 5, 6, 7, 8];
                        question = `ข้อมูล: ${nums.join(', ')} จงหาฐานนิยม`;
                        answer = 5;
                        hint = 'ฐานนิยมคือค่าที่ซ้ำมากที่สุด';
                    }
                    break;
                case 7: // Volume & Probability
                    if (diff <= 1) {
                        const r = 3;
                        const h = 7;
                        question = `ทรงกระบอก r=${r}, h=${h}, π=22/7 จงหาปริมาตร`;
                        answer = Math.round((22 / 7) * r * r * h);
                        hint = `πr²h = (22/7)×${r}²×${h}`;
                    } else if (diff === 2) {
                        question = `ทอยลูกเต๋า 2 ลูก ความน่าจะเป็นที่ผลรวมเป็น 7 (ตอบเป็นเศษส่วน a/b)`;
                        answer = '1/6';
                        hint = 'คู่ที่รวมได้ 7: (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) = 6/36 = 1/6';
                    } else {
                        const r = Math.floor(Math.random() * 3) + 3;
                        const h = Math.floor(Math.random() * 5) + 5;
                        question = `กรวย r=${r}, h=${h}, π=22/7 จงหาปริมาตร (ปัดเศษ)`;
                        answer = Math.round((1 / 3) * (22 / 7) * r * r * h);
                        hint = `⅓πr²h = ⅓×(22/7)×${r}²×${h}`;
                    }
                    break;
                default:
                    question = '5 + 3 × 2 = ?';
                    answer = 11;
                    hint = 'คูณก่อนบวก';
            }
            return { question, answer, hint };
        }

        // ============================================
        // SCREEN RENDERERS
        // ============================================
        function renderScreen(screenName) {
            const content = document.getElementById('gameContent');
            switch (screenName) {
                case 'menu':
                    content.innerHTML = renderMenu();
                    break;
                case 'classSelect':
                    content.innerHTML = renderClassSelect();
                    break;
                case 'chapters':
                    content.innerHTML = renderChapters();
                    break;
                case 'battle':
                    content.innerHTML = renderBattle();
                    setupBattleSprites();
                    setupBattle();
                    break;
                case 'shop':
                    content.innerHTML = renderShop();
                    break;
                case 'achievements':
                    content.innerHTML = renderAchievements();
                    break;
                case 'analytics':
                    content.innerHTML = renderAnalytics();
                    break;
                default:
                    content.innerHTML = renderMenu();
            }
            bindGlobalEvents();
        }

        function renderClassSelect() {
            let html = '<h3 style="color:white;text-align:center;margin-bottom:12px;">🎭 เลือกคลาสของคุณ</h3><div class="class-grid">';
            for (const [key, def] of Object.entries(classDefinitions)) {

                <div class="class-card ${playerClass === key ? 'selected' : ''}" onclick="selectClass('${key}')">
                    <span class="class-icon">${def.icon}</span>
                    <div class="class-name">${def.name}</div>

        function selectClass(key) {
            playerClass = key;
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            saveGame();
            renderScreen('classSelect');
        }

        function renderChapters() {
            let html = '<div class="flex-col" style="gap:8px;">';
            chapterData.forEach(ch => {
                const unlocked = unlockedChapters.includes(ch.id);
                const progress = getChapterProgress(ch.id);
                html += `
                <div class="chapter-container">
                    <div class="chapter-header ${!unlocked ? 'locked' : ''}" onclick="${unlocked ? `toggleChapterDetail(${ch.id})` : 'showLockedMessage()'}">
                        <div class="chapter-icon" style="border-color:${ch.color};">${ch.icon}</div>
                        <div class="chapter-info">
                            <div class="chapter-name">${ch.name}</div>
                            <div class="chapter-progress">${unlocked ? `ผ่านแล้ว ${completedLevels[ch.id]?.length || 0}/3 ด่าน` : '🔒 ยังไม่ปลดล็อค'}</div>
                            ${unlocked ? `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%;"></div></div>` : ''}
                        </div>
                        <span style="font-size:20px;">${unlocked ? (progress >= 100 ? '✅' : '🔓') : '🔒'}</span>
                    </div>
                    <div class="level-list" id="levelList-${ch.id}" style="display:none;">
                        ${[1,2,3].map(lv => {
                            const lvlUnlocked = isLevelUnlocked(ch.id, lv);
                            const lvlCompleted = isLevelCompleted(ch.id, lv);
                            const isBoss = lv === 3;
                            return `
                            <button class="level-btn ${lvlCompleted ? 'completed' : ''} ${!lvlUnlocked ? 'locked' : ''} ${lvlUnlocked && !lvlCompleted ? 'current' : ''}"
                                    onclick="startLevel(${ch.id}, ${lv})"
                                    ${!lvlUnlocked ? 'disabled' : ''}>
                                ${isBoss ? '👑 ' : ''}ด่าน ${lv}
                                <div class="text-sm">${isBoss ? 'BOSS' : lv === 1 ? 'ง่าย' : 'ปานกลาง'}</div>
                                ${lvlCompleted ? '✅' : ''}
                            </button>`;
                        }).join('')}
                    </div>
                </div>`;
            });
            html += '</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับหน้าหลัก</button>';
            return html;
        }

        function toggleChapterDetail(chapterId) {
            const list = document.getElementById('levelList-' + chapterId);
            if (list) list.style.display = list.style.display === 'none' ? 'grid' : 'none';
        }

            const ch = chapterData.find(c => c.id === player.currentChapter) || chapterData[0];
            const bossName = bossNames[(player.currentChapter - 1) % bossNames.length];
            const cd = getClassDef();
            return `
            <div class="battle-scene">
                <div class="stats-bar mb-4">
                    <span class="badge badge-info">${ch.icon} ${ch.name} - ด่าน ${player.currentLevel}</span>

                        <canvas id="playerSprite" class="pixel-canvas" width="64" height="64"></canvas>
                        <div style="color:white;font-weight:600;font-size:13px;">${player.name}</div>
                        <div class="hp-bar-outer"><div class="hp-bar-inner" id="playerHpBar" style="width:100%;"></div></div>
                        <div class="hp-text">❤️ <span id="playerHpText">${player.hp}/${player.maxHp}</span></div>
                        ${player.shield ? '<div class="badge badge-info mt-1">🛡️ มีเกราะ</div>' : ''}
                    </div>
                    <div class="vs-badge">VS</div>
                    <div class="combatant">
                        <canvas id="bossSprite" class="pixel-canvas boss-canvas" width="64" height="64"></canvas>
                        <div style="color:var(--neon-pink);font-weight:600;font-size:13px;">${bossName}</div>
                        <div class="hp-bar-outer"><div class="hp-bar-inner boss-hp" id="bossHpBar" style="width:100%;"></div></div>
                        <div class="hp-text">❤️ <span id="bossHpText">${player.bossHp}/${player.bossMaxHp}</span></div>
                    </div>
                </div>
            </div>
            <div class="question-panel">
                <div class="question-display" id="questionDisplay">กำลังโหลดโจทย์...</div>
                <div class="answer-input-row">
                    <input type="text" class="answer-input" id="answerInput" placeholder="พิมพ์คำตอบที่นี่..." autocomplete="off">
                    <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">⚡ โจมตี!</button>
                </div>
                <div class="combo-display" id="comboDisplay"></div>
                <div class="text-sm text-center mt-2" style="color:rgba(255,255,255,0.6);min-height:18px;" id="feedbackMsg"></div>
            </div>
            <div class="flex-row" style="gap:8px;">
                <button class="btn btn-sm btn-warning" onclick="useSkill('skill1')" id="btnSkill1">
                    ${cd.skill1.name} (${cd.skill1.cost}pts)
                </button>
                <button class="btn btn-sm btn-success" onclick="useSkill('skill2')" id="btnSkill2">
                    ${cd.skill2.name} (${cd.skill2.cost}pts)
                </button>
                <button class="btn btn-sm btn-danger" onclick="useSkill('skip')" id="btnSkip">⏩ ข้าม (-15HP)</button>
            </div>
            <div class="skill-cooldown-indicator" id="cooldownIndicator"></div>
            <button class="btn btn-outline w-full mt-2" onclick="fleeBattle()">🏃 หนีออกจากสนามรบ</button>`;
        }

        function setupBattleSprites() {
            setTimeout(() => {
                const playerCanvas = document.getElementById('playerSprite');
                const bossCanvas = document.getElementById('bossSprite');
                const colors = getPlayerColors();
                if (playerCanvas) drawPixelCharacter(playerCanvas, getPlayerPixels(), 4, colors.primary, colors
                    .secondary);
                if (bossCanvas && player.currentChapter) {
                    const bossPix = bossPixelsChapter[player.currentChapter] || bossPixelsChapter[1];
                    drawPixelCharacter(bossCanvas, bossPix, 4, '#ff006e', '#990044');
                }
            }, 100);
        }

        function setupBattle() {
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCooldowns = { skill1: 0, skill2: 0 };
            skillActive = { guaranteedCrit: false, dodge: false };
            const bossBaseHp = 100 + (player.currentChapter * 15) + (player.currentLevel * 20);
            player.bossMaxHp = bossBaseHp;
            player.bossHp = bossBaseHp;
            updateBattleUI();
            updateCooldownUI();
            nextQuestion();
            const input = document.getElementById('answerInput');
            if (input) setTimeout(() => input.focus(), 300);
        }

        let currentQuestion = null;

        function nextQuestion() {
            if (player.bossHp <= 0 || player.hp <= 0) { endBattle(); return; }
            currentQuestion = generateQuestion(player.currentChapter, player.currentLevel);
            const qDisplay = document.getElementById('questionDisplay');
            if (qDisplay) qDisplay.innerHTML = currentQuestion.question;
            const ansInput = document.getElementById('answerInput');
            if (ansInput) { ansInput.value = '';
                ansInput.disabled = false;
                setTimeout(() => ansInput.focus(), 100); }
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = false;
            const feedback = document.getElementById('feedbackMsg');
            if (feedback) feedback.textContent = '';
            const comboDisp = document.getElementById('comboDisplay');
            if (comboDisp) { comboDisp.textContent = '';
                comboDisp.classList.remove('active'); }
            updateCooldownUI();
        }

        function submitAnswer() {
            const input = document.getElementById('answerInput');
            if (!input || !currentQuestion) return;
            const userAnswer = input.value.trim();
            if (userAnswer === '') return;

            const correctAnswer = currentQuestion.answer.toString();
            let isCorrect = false;
            if (userAnswer === correctAnswer) isCorrect = true;
            else if (!isNaN(parseFloat(userAnswer)) && !isNaN(parseFloat(correctAnswer))) {
                isCorrect = Math.abs(parseFloat(userAnswer) - parseFloat(correctAnswer)) < 0.09;
            }

            input.disabled = true;
            document.getElementById('submitBtn').disabled = true;

            if (isCorrect) handleCorrectAnswer(input);
            else handleWrongAnswer(input);
        }

        function handleCorrectAnswer(inputElement) {
            sfxCorrect();
            player.combo++;
            player.totalCorrect++;
            if (player.combo > player.maxCombo) player.maxCombo = player.combo;

            if (!analytics[player.currentChapter]) analytics[player.currentChapter] = { correct: 0, wrong: 0, perfect: true };
            analytics[player.currentChapter].correct++;

            const cd = getClassDef();
            let damage = 25 + (player.combo * 5);
            damage = Math.round(damage * cd.baseDamageMultiplier);
            if (player.combo >= 5 && cd.comboBonus) damage = Math.round(damage * cd.comboBonus);

            let critChance = 0.1 + (cd.critChanceBonus || 0);
            if (inventory.orb) critChance += 0.2;
            let isCrit = Math.random() < critChance;
            if (skillActive.guaranteedCrit) { isCrit = true;
                skillActive.guaranteedCrit = false; }
            if (isCrit) {
                damage = Math.round(damage * (cd.critMultiplier || 3));
                sfxCrit();
            }

            // Weapon boost
            if (inventory.weapon) damage = Math.round(damage * 1.5);

            player.bossHp = Math.max(0, player.bossHp - damage);
            player.score += 50 + (player.combo * 10);

            const rect = inputElement.getBoundingClientRect();
            spawnParticle(rect.left + rect.width / 2, rect.top, isCrit ? `💥${damage} CRIT!` : `⚡${damage}`,
                isCrit ? '#ffe600' : '#00f0ff');

            const feedback = document.getElementById('feedbackMsg');
            if (feedback) {
                feedback.textContent = `✅ ถูกต้อง! ดาเมจ ${damage} ${isCrit ? '💥 คริติคอล!' : ''}`;
                feedback.style.color = 'var(--neon-green)';
            }

            if (player.combo >= 3) {
                const comboDisp = document.getElementById('comboDisplay');
                if (comboDisp) { comboDisp.textContent = `🔥 COMBO x${player.combo}! 🔥`;
                    comboDisp.classList.add('active'); }
                document.getElementById('comboBadge').textContent = `🔥 คอมโบ: ${player.combo}`;
            }

            // Attack animation
            const bossCanvas = document.getElementById('bossSprite');
            if (bossCanvas) { bossCanvas.classList.add('hit');
                setTimeout(() => bossCanvas.classList.remove('hit'), 300); }

            updateBattleUI();
            reduceCooldowns();
            setTimeout(nextQuestion, 1200);
        }

        function handleWrongAnswer(inputElement) {
            sfxWrong();
            player.combo = 0;
            player.totalWrong++;
            if (analytics[player.currentChapter]) { analytics[player.currentChapter].wrong++;
                analytics[player.currentChapter].perfect = false; }

            let damageTaken = 15 + (player.currentLevel * 3);
            if (skillActive.dodge) {
                skillActive.dodge = false;
                damageTaken = 0;
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent = '💨 หลบหลีกสำเร็จ! ไม่ได้รับดาเมจ';
                    fb.style.color = 'var(--neon-green)'; }
            } else if (player.shield) {
                player.shield = false;
                damageTaken = 0;
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent = '🛡️ เกราะป้องกันดาเมจไว้ได้!';
                    fb.style.color = 'var(--neon-purple)'; }
            } else {
                player.hp = Math.max(0, player.hp - damageTaken);
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent =
                        `❌ ผิด! คำตอบคือ ${currentQuestion.answer} (-${damageTaken} HP) | 💡 ${currentQuestion.hint}`;
                    fb.style.color = 'var(--neon-pink)'; }
            }

            if (damageTaken > 0) {
                const rect = inputElement.getBoundingClientRect();
                spawnParticle(rect.left + rect.width / 2, rect.top, `-${damageTaken}❤️`, '#ff006e');
                const playerCanvas = document.getElementById('playerSprite');
                if (playerCanvas) { playerCanvas.classList.add('hit');
                    setTimeout(() => playerCanvas.classList.remove('hit'), 300); }
            }

            document.getElementById('comboBadge').textContent = '🔥 คอมโบ: 0';
            updateBattleUI();
            reduceCooldowns();
            setTimeout(nextQuestion, 2000);
        }

        function reduceCooldowns() {
            if (skillCooldowns.skill1 > 0) skillCooldowns.skill1--;
            if (skillCooldowns.skill2 > 0) skillCooldowns.skill2--;
            updateCooldownUI();
        }

        function updateCooldownUI() {
            const indicator = document.getElementById('cooldownIndicator');
            if (!indicator) return;
            const cd = getClassDef();
            let text = '';
            if (skillCooldowns.skill1 > 0) text +=
                `${cd.skill1.name} ติดคูลดาวน์ ${skillCooldowns.skill1} เทิร์น `;
            if (skillCooldowns.skill2 > 0) text +=
                `${cd.skill2.name} ติดคูลดาวน์ ${skillCooldowns.skill2} เทิร์น `;
            indicator.textContent = text;
            const btn1 = document.getElementById('btnSkill1');
            const btn2 = document.getElementById('btnSkill2');
            if (btn1) btn1.disabled = skillCooldowns.skill1 > 0 || player.score < cd.skill1.cost;
            if (btn2) btn2.disabled = skillCooldowns.skill2 > 0 || player.score < cd.skill2.cost;
        }

        function updateBattleUI() {
            const playerHpBar = document.getElementById('playerHpBar');
            const bossHpBar = document.getElementById('bossHpBar');
            const playerHpText = document.getElementById('playerHpText');
            const bossHpText = document.getElementById('bossHpText');
            if (playerHpBar) playerHpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            if (bossHpBar) bossHpBar.style.width = Math.max(0, (player.bossHp / player.bossMaxHp) * 100) + '%';
            if (playerHpText) playerHpText.textContent = `${player.hp}/${player.maxHp}`;
            if (bossHpText) bossHpText.textContent = `${player.bossHp}/${player.bossMaxHp}`;
            document.getElementById('comboBadge').textContent = `🔥 คอมโบ: ${player.combo}`;
        }

        function useSkill(type) {
            const cd = getClassDef();
            if (type === 'skill1') {
                if (skillCooldowns.skill1 > 0) return;
                if (player.score < cd.skill1.cost) {
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = '⚠️ แต้มไม่พอ!';
                        fb.style.color = 'var(--neon-yellow)'; }
                    return;
                }
                player.score -= cd.skill1.cost;
                skillCooldowns.skill1 = cd.skill1.cooldown;
                sfxSkill();
                if (cd.skill1.type === 'guaranteed_crit') skillActive.guaranteedCrit = true;
                if (cd.skill1.type === 'damage_boost' || cd.skill1.type === 'crit_boost') {
                    // Bonus damage on next attack
                    const bonusDamage = Math.round(30 * (cd.skill1.multiplier || 2));
                    player.bossHp = Math.max(0, player.bossHp - bonusDamage);
                    const bossCanvas = document.getElementById('bossSprite');
                    if (bossCanvas) { bossCanvas.classList.add('hit');
                        setTimeout(() => bossCanvas.classList.remove('hit'), 300); }
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = `${cd.skill1.name}! ดาเมจ ${bonusDamage}`;
                        fb.style.color = 'var(--neon-orange)'; }
                    updateBattleUI();
                }
                saveGame();
            } else if (type === 'skill2') {
                if (skillCooldowns.skill2 > 0) return;
                if (player.score < cd.skill2.cost) {
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = '⚠️ แต้มไม่พอ!';
                        fb.style.color = 'var(--neon-yellow)'; }
                    return;
                }
                player.score -= cd.skill2.cost;
                skillCooldowns.skill2 = cd.skill2.cooldown;
                sfxSkill();
                if (cd.skill2.type === 'shield') { player.shield = true;
                    updateBattleUI(); }
                if (cd.skill2.type === 'heal') {
                    player.hp = Math.min(player.maxHp, player.hp + cd.skill2.healAmount);
                    updateBattleUI();
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = `💚 ฮีล +${cd.skill2.healAmount} HP!`;
                        fb.style.color = 'var(--neon-green)'; }
                }
                if (cd.skill2.type === 'dodge') skillActive.dodge = true;
                saveGame();
            } else if (type === 'skip') {
                if (player.hp > 15) {
                    player.hp -= 15;
                    player.combo = 0;
                    updateBattleUI();
                    reduceCooldowns();
                    nextQuestion();
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = '⏩ ข้ามข้อ เสีย 15 HP';
                        fb.style.color = 'var(--neon-orange)'; }
                }
            }
            updateCooldownUI();
        }

        function endBattle() {
            if (player.bossHp <= 0) {
                sfxWin();
                const bossCanvas = document.getElementById('bossSprite');
                if (bossCanvas) bossCanvas.classList.add('boss-defeated');
                screenShake();
                // Boss defeat particles
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const x = Math.random() * window.innerWidth;
                        const y = Math.random() * window.innerHeight * 0.5;
                        spawnParticle(x, y, ['💥', '⭐', '✨', '💎'][Math.floor(Math.random() * 4)],
                            ['#ffe600', '#ff006e', '#00f0ff', '#39ff14'][Math.floor(Math.random() * 4)]);
                    }, i * 60);
                }
                player.score += 200 + (player.currentLevel * 100);
                unlockNextLevel(player.currentChapter, player.currentLevel);
                if (analytics[player.currentChapter]) analytics[player.currentChapter].completed = true;
                saveGame();
                setTimeout(() => {
                    showModal('🎉 ชัยชนะ!',
                        `คุณพิชิตด่าน ${player.currentLevel} บทที่ ${player.currentChapter} สำเร็จ!\nได้รับโบนัส ${200 + player.currentLevel * 100} แต้ม\nคะแนนรวม: ${player.score.toLocaleString()}`,
                        () => renderScreen('chapters'));
                }, 800);
            } else if (player.hp <= 0) {
                saveGame();
                showModal('💀 พ่ายแพ้', 'คุณหมดพลังแล้ว! ลองใหม่อีกครั้ง', () => renderScreen('chapters'));
            }
        }

        function startLevel(chapterId, levelId) {
            if (!isLevelUnlocked(chapterId, levelId)) {
                showModal('🔒 ล็อคอยู่', 'คุณต้องผ่านด่านก่อนหน้าก่อน!', null);
                return;
            }
            player.currentChapter = chapterId;
            player.currentLevel = levelId;
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCooldowns = { skill1: 0, skill2: 0 };
            skillActive = { guaranteedCrit: false, dodge: false };
            renderScreen('battle');
        }

        function fleeBattle() {
            player.score = Math.max(0, player.score - 50);
            saveGame();
            renderScreen('chapters');
        }

        function renderShop() {
            return `
            <h3 style="color:white;text-align:center;margin-bottom:12px;">🛒 ร้านค้าผู้กล้า</h3>
            <div class="stats-bar mb-4"><span>⭐ แต้ม: <span style="color:var(--neon-yellow);font-weight:700;">${player.score.toLocaleString()}</span></span></div>
            <div class="shop-item">
                <div><b>⚔️ ดาบคริสตัล</b><div class="text-sm" style="color:rgba(255,255,255,0.5);">ดาเมจ +50% ถาวร</div></div>
                <button class="btn btn-sm ${inventory.weapon ? 'btn-success' : 'btn-primary'}" onclick="buyItem('weapon')" ${inventory.weapon ? 'disabled' : ''}>${inventory.weapon ? '✅ มีแล้ว' : '380 แต้ม'}</button>
            </div>
            <div class="shop-item">
                <div><b>🛡️ เกราะพลาสม่า</b><div class="text-sm" style="color:rgba(255,255,255,0.5);">ติดเกราะเมื่อเริ่มต่อสู้</div></div>
                <button class="btn btn-sm ${inventory.shield ? 'btn-success' : 'btn-primary'}" onclick="buyItem('shield')" ${inventory.shield ? 'disabled' : ''}>${inventory.shield ? '✅ มีแล้ว' : '250 แต้ม'}</button>
            </div>
            <div class="shop-item">
                <div><b>🔮 ลูกแก้วคริติคอล</b><div class="text-sm" style="color:rgba(255,255,255,0.5);">คริติคอล +20%</div></div>
                <button class="btn btn-sm ${inventory.orb ? 'btn-success' : 'btn-primary'}" onclick="buyItem('orb')" ${inventory.orb ? 'disabled' : ''}>${inventory.orb ? '✅ มีแล้ว' : '550 แต้ม'}</button>
            </div>
            <div class="shop-item">
                <div><b>🧪 โพชั่นฟื้นฟู</b><div class="text-sm" style="color:rgba(255,255,255,0.5);">ฟื้น HP เต็มในศึกถัดไป (ใช้ครั้งเดียว)</div></div>
                <button class="btn btn-sm btn-primary" onclick="buyItem('potion')">50 แต้ม (มี: ${inventory.potion || 0})</button>
            </div>
            <button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙 กลับ</button>`;
        }

        function buyItem(type) {
            const prices = { weapon: 380, shield: 250, orb: 550, potion: 50 };
            if (player.score >= prices[type]) {
                player.score -= prices[type];
                if (type === 'potion') inventory.potion = (inventory.potion || 0) + 1;
                else inventory[type] = true;
                sfxPurchase();
                saveGame();
                renderScreen('shop');
            } else {
                showModal('⚠️ แต้มไม่พอ', `คุณต้องการ ${prices[type]} แต้ม แต่มี ${player.score} แต้ม`, null);
            }
        }

        function renderAchievements() {
            const achList = [
                { id: 'first_win', name: 'ชัยชนะครั้งแรก', desc: 'ชนะด่านแรก', icon: '🏆', check: () => Object.values(
                        completedLevels).some(arr => arr.length > 0) },
                { id: 'combo5', name: 'ราชาคอมโบ', desc: 'คอมโบสูงสุดถึง 5', icon: '🔥', check: () => player.maxCombo >= 5 },
                { id: 'score1000', name: 'เศรษฐีคณิต', desc: 'สะสม 1,000 แต้ม', icon: '💰', check: () => player.score >=
                    1000 },
                { id: 'all_chapters', name: 'จบหลักสูตร', desc: 'ผ่านครบ 7 บท', icon: '🎓', check: () => unlockedChapters
                        .length >= 7 && chapterData.every(ch => getChapterProgress(ch.id) >= 100) },
                { id: 'perfect', name: 'ไร้ที่ติ', desc: 'ผ่าน 1 บทโดยไม่ตอบผิดเลย', icon: '💎', check: () => Object.values(
                        analytics).some(a => a.perfect) },
            ];
            let html =
                '<h3 style="color:white;text-align:center;margin-bottom:12px;">🏅 ความสำเร็จ</h3>';
            achList.forEach(ach => {
                const done = ach.check();
                html += `<div class="shop-item" style="opacity:${done ? '1' : '0.5'};"><div><b>${ach.icon} ${ach.name}</b><div class="text-sm" style="color:rgba(255,255,255,0.5);">${ach.desc}</div></div><span>${done ? '✅' : '🔒'}</span></div>`;
            });
            html += '<button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
            return html;
        }

        function renderAnalytics() {
            let html =
                '<h3 style="color:white;text-align:center;margin-bottom:12px;">📊 วิเคราะห์ผลการเรียน</h3>';
            chapterData.forEach(ch => {
                const data = analytics[ch.id] || { correct: 0, wrong: 0 };
                const total = (data.correct || 0) + (data.wrong || 0);
                const rate = total > 0 ? Math.round((data.correct / total) * 100) : 0;
                const color = rate >= 80 ? 'var(--neon-green)' : rate >= 50 ? 'var(--neon-yellow)' :
                    'var(--neon-pink)';
                html += `
                <div class="shop-item">
                    <div>
                        <b>${ch.icon} ${ch.name}</b>
                        <div class="text-sm" style="color:rgba(255,255,255,0.5);">
                            ถูก ${data.correct || 0} | ผิด ${data.wrong || 0} |
                            <span style="color:${color};font-weight:600;">${rate}%</span>
                            ${getChapterProgress(ch.id) >= 100 ? ' | ✅ ผ่านแล้ว' : ''}
                        </div>
                    </div>
                </div>`;
            });
            html += '<button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
            return html;
        }

        function changeName() {
            const newName = prompt('ใส่ชื่อใหม่:', player.name);
            if (newName && newName.trim()) { player.name = newName.trim();
                saveGame();
                renderScreen('menu'); }
        }

        function resetGame() {
            if (confirm('คุณแน่ใจหรือไม่ที่จะรีเซ็ตข้อมูลทั้งหมด?')) {
                localStorage.removeItem('mathquest_tawan_v2');
                player = { name: 'ผู้กล้า', hp: 100, maxHp: 100, score: 0, combo: 0, maxCombo: 0, totalCorrect: 0,
                    totalWrong: 0, shield: false, currentChapter: null, currentLevel: 1, bossHp: 150, bossMaxHp: 150 };
                playerClass = 'warrior';
                inventory = { weapon: false, shield: false, orb: false, potion: 0 };
                analytics = {};
                completedLevels = {};
                unlockedChapters = [1];
                skillCooldowns = { skill1: 0, skill2: 0 };
                skillActive = { guaranteedCrit: false, dodge: false };
                player.maxHp = getMaxHp();
                player.hp = player.maxHp;
                renderScreen('menu');
            }
        }

        function showLockedMessage() { showModal('🔒 ยังไม่ปลดล็อค',
            'คุณต้องผ่านด่านทั้งหมดของบทก่อนหน้านี้ก่อน!', null); }

        function showModal(title, message, callback) {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
            <div class="modal-overlay" onclick="closeModal(${callback ? 'true' : 'false'})">
                <div class="modal-content" onclick="event.stopPropagation()">
                    <h2 style="color:var(--neon-blue);margin-bottom:12px;">${title}</h2>
                    <p style="color:white;white-space:pre-line;margin-bottom:16px;">${message}</p>
                    <button class="btn btn-primary" onclick="closeModal(${callback ? 'true' : 'false'})">ตกลง</button>
                </div>
            </div>`;
            window._modalCallback = callback;
        }

        function closeModal(hasCallback) {
            document.getElementById('modalContainer').innerHTML = '';
            if (hasCallback === true || hasCallback === 'true') {
                const cb = window._modalCallback;
                if (cb && typeof cb === 'function') setTimeout(cb, 200);
            }
            window._modalCallback = null;
        }

        function bindGlobalEvents() {
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const answerInput = document.getElementById('answerInput');
                    if (answerInput && document.activeElement === answerInput) submitAnswer();
                }
            });
        }

        function init() {
            createStars();
            loadGame();
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            renderScreen('menu');
        }

        init();
    </script>
</body>
  </html>
