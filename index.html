<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Math Quest ม.2 - Ultimate Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--nb:#00f0ff;--np:#ff006e;--nu:#b537f2;--ng:#39ff14;--ny:#ffe600;--bg:#0a0a1a;--cb:rgba(15,15,35,0.92);--g:rgba(255,255,255,0.06);--gb:rgba(255,255,255,0.14);--tb:#fff;--td:#b0b0d0;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Kanit',sans-serif;background:var(--bg);background-image:radial-gradient(ellipse at 20% 10%,rgba(0,240,255,0.08) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(255,0,110,0.07) 0%,transparent 55%);color:var(--tb);min-height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{position:relative;z-index:2;display:flex;flex-direction:column;height:100dvh;padding-top:var(--st);}
.gw{background:var(--cb);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
.gh{padding:8px 14px;background:rgba(0,240,255,0.04);border-bottom:1px solid var(--gb);flex-shrink:0;}
.br{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.cb{display:inline-block;background:rgba(255,0,110,0.18);border:1px solid var(--np);padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;color:var(--np);letter-spacing:1.5px;}
.stg{background:transparent;border:1px solid var(--gb);color:var(--tb);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;}
.gt{font-family:'Orbitron',sans-serif;font-size:1.3em;font-weight:900;background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;line-height:1.15;margin-top:2px;text-align:center;}
.sb{color:var(--td);font-size:9px;letter-spacing:1px;text-align:center;}
.gc{padding:12px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding-bottom:85px;}
.gc::-webkit-scrollbar{width:4px;}
.gc::-webkit-scrollbar-thumb{background:var(--nu);border-radius:3px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:12px;cursor:pointer;transition:transform 0.12s,filter 0.2s;color:#fff;background:linear-gradient(135deg,#00c6ff,#0072ff);box-shadow:0 4px 15px rgba(0,114,255,0.28);touch-action:manipulation;}
.btn:active{transform:scale(0.96);filter:brightness(0.95);}
.btn:disabled{opacity:0.4;pointer-events:none;}
.btn-g{background:linear-gradient(135deg,#00b09b,#96c93d);}
.btn-r{background:linear-gradient(135deg,#ff416c,#ff4b2b);}
.btn-y{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;}
.btn-gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;}
.btn-p{background:linear-gradient(135deg,#ff006e,#ff4b8b);}
.btn-pur{background:linear-gradient(135deg,#b537f2,#7b2ff7);}
.btn-o{background:transparent;border:2px solid var(--nb);color:var(--nb);box-shadow:none;}
.btn-sm{min-height:42px;padding:8px 12px;font-size:12px;border-radius:10px;}
.btn-xs{min-height:36px;padding:5px 9px;font-size:11px;border-radius:8px;}
.sbar{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,0.4);border-radius:12px;margin-bottom:8px;font-size:12px;flex-wrap:wrap;gap:4px;border:1px solid var(--gb);}
.sv{font-weight:700;color:var(--nb);}
.sg{font-weight:700;color:var(--ny);}
.bdg{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:600;}
.bdg-gold{background:rgba(255,230,0,0.15);color:var(--ny);border:1px solid rgba(255,230,0,0.4);}
.bdg-g{background:rgba(57,255,20,0.15);color:var(--ng);border:1px solid rgba(57,255,20,0.4);}
.bdg-b{background:rgba(0,240,255,0.15);color:var(--nb);border:1px solid rgba(0,240,255,0.4);}
.bdg-r{background:rgba(255,0,110,0.15);color:var(--np);border:1px solid rgba(255,0,110,0.4);}
.bdg-p{background:rgba(181,55,242,0.15);color:var(--nu);border:1px solid rgba(181,55,242,0.4);}
.si{background:var(--g);border:1px solid var(--gb);border-radius:12px;padding:12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.si.col{flex-direction:column;align-items:stretch;}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.ccard{background:var(--g);border:2px solid var(--gb);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ccard.sel{border-color:var(--ng);background:rgba(57,255,20,0.08);}
.ccard.lk{opacity:0.55;}
.cemoji{font-size:38px;line-height:1;}
.cname{font-weight:700;font-size:14px;margin-top:2px;}
.cdesc{font-size:10px;color:var(--td);margin-top:4px;line-height:1.35;}
.chc{margin-bottom:8px;}
.chh{background:var(--g);border:1px solid var(--gb);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;}
.chi{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);flex-shrink:0;}
.chn{flex:1;min-width:0;}
.chname{font-weight:600;font-size:13px;}
.chprog{font-size:10px;color:var(--td);}
.llist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 0 0 50px;}
.lbtn{min-height:44px;padding:6px 4px;border-radius:9px;border:1px solid var(--gb);background:rgba(0,0,0,0.35);color:var(--tb);cursor:pointer;font-size:11px;font-family:'Kanit',sans-serif;font-weight:600;}
.lbtn.done{border-color:var(--ng);background:rgba(57,255,20,0.12);}
.bts{background:rgba(0,0,0,0.5);border-radius:14px;padding:12px;border:1px solid var(--gb);margin-bottom:10px;text-align:center;position:relative;}
.bts.sh{animation:sk 0.4s ease;}
@keyframes sk{0%,100%{transform:translate(0,0);}20%{transform:translate(-6px,3px);}40%{transform:translate(6px,-3px);}60%{transform:translate(-4px,-2px);}80%{transform:translate(4px,2px);}}
.ed{font-size:54px;display:inline-block;line-height:1;transition:transform 0.3s;}
.ed.hit{animation:eh 0.4s ease;}
.ed.crit{animation:ec 0.5s ease-out;}
@keyframes eh{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes ec{0%{transform:scale(1);}30%{transform:scale(1.6) rotate(-10deg);}60%{transform:scale(1.15) rotate(5deg);}100%{transform:scale(1) rotate(0);}}
.crow{display:flex;align-items:center;justify-content:space-around;gap:8px;flex-wrap:wrap;}
.cbat{text-align:center;min-width:95px;flex:1;max-width:130px;}
.cbname{font-weight:600;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbname.boss{color:var(--np);}
.hpo{background:#1a1a2e;border-radius:7px;height:10px;overflow:hidden;border:1px solid var(--gb);margin-top:4px;width:100%;}
.hpi{height:100%;border-radius:7px;transition:width 0.4s;background:linear-gradient(90deg,#00f0ff,#00c6ff);}
.hpi.bh{background:linear-gradient(90deg,#ff006e,#ff4b2b);}
.hpt{font-size:10px;color:var(--td);margin-top:2px;}
.vs{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;color:var(--ny);text-shadow:0 0 12px rgba(255,230,0,0.6);}
.tbo{background:#1a1a2e;border-radius:5px;height:9px;overflow:hidden;border:1px solid var(--gb);margin-top:8px;}
.tbi{height:100%;border-radius:5px;transition:width 0.15s linear;background:linear-gradient(90deg,var(--ng),var(--ny));}
.tbt{font-size:11px;color:var(--ny);font-weight:700;text-align:center;margin-top:3px;}
.qp{background:rgba(0,0,0,0.5);border-radius:14px;padding:14px;border:1px solid var(--gb);margin-bottom:10px;}
.qd{font-size:20px;font-weight:700;text-align:center;margin-bottom:10px;line-height:1.5;min-height:30px;word-break:break-word;}
.air{display:flex;gap:8px;}
.ai{flex:1;padding:12px 14px;font-size:16px;font-weight:600;text-align:center;border-radius:10px;border:2px solid var(--gb);background:rgba(0,0,0,0.5);color:var(--tb);outline:none;font-family:'Kanit',sans-serif;min-width:0;}
.ai.cf{border-color:var(--ng);background:rgba(57,255,20,0.1);}
.ai.wf{border-color:var(--np);background:rgba(255,0,110,0.1);}
.cdisp{text-align:center;font-weight:700;font-size:15px;margin-top:6px;min-height:20px;color:var(--ny);}
.fbm{font-size:12px;text-align:center;margin-top:4px;min-height:16px;color:var(--td);}
.fr{display:flex;gap:8px;}
.ft{position:fixed;pointer-events:none;font-weight:900;font-family:'Orbitron','Kanit',sans-serif;z-index:500;text-shadow:0 2px 8px rgba(0,0,0,0.9),0 0 12px currentColor;animation:fu 1.1s ease-out forwards;font-size:24px;white-space:nowrap;}
.ft.crit{font-size:34px;}.ft.miss{color:#888;font-size:20px;}.ft.heal{color:var(--ng);}.ft.dmg{color:var(--ny);}.ft.critdmg{color:var(--np);}.ft.gold{color:#ffd700;font-size:18px;}
@keyframes fu{0%{transform:translate(-50%,0) scale(0.6);opacity:0;}15%{transform:translate(-50%,-10px) scale(1.2);opacity:1;}100%{transform:translate(-50%,-90px) scale(1);opacity:0;}}
.so{position:fixed;inset:0;z-index:9000;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2a 50%,#0a1a2a 100%);display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity 0.4s;}
.so.hide{opacity:0;pointer-events:none;}
.sc{max-width:400px;width:100%;background:var(--cb);border:2px solid var(--nb);border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 0 50px rgba(0,240,255,0.3);}
.slogo{font-family:'Orbitron',sans-serif;font-size:2em;font-weight:900;background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;}
.ssub{color:var(--td);font-size:12px;margin:4px 0 20px;}
.sbtn{display:inline-block;min-height:56px;padding:14px 32px;font-size:16px;font-weight:700;border-radius:14px;border:none;background:linear-gradient(135deg,var(--ng),var(--nb));color:#0a1a0a;cursor:pointer;font-family:'Kanit',sans-serif;letter-spacing:1.5px;box-shadow:0 0 30px rgba(57,255,20,0.4);}
.sf{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--td);}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:3000;padding:20px;}
.mc{background:var(--cb);border-radius:20px;padding:22px;max-width:440px;width:100%;border:2px solid var(--nb);text-align:center;max-height:85vh;overflow-y:auto;}
.mt{font-size:20px;font-weight:700;margin-bottom:10px;}
.mb{font-size:14px;color:var(--td);line-height:1.55;margin-bottom:16px;text-align:left;}
.mb .step{padding:6px 10px;background:rgba(0,240,255,0.08);border-left:3px solid var(--nb);border-radius:4px;margin:6px 0;color:var(--tb);font-size:13px;}
.fc{display:flex;flex-direction:column;gap:8px;}
.tc{text-align:center;}.ts{font-size:11px;}.mt2{margin-top:8px;}.mt3{margin-top:12px;}.wf{width:100%;}
.mb2{margin-bottom:8px;}
.pb{background:#1a1a2e;border-radius:5px;height:5px;overflow:hidden;margin-top:3px;}
.pbf{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ng),var(--nb));transition:width 0.4s;}
h3{font-size:18px;margin-bottom:10px;}
.npc{flex-shrink:0;background:rgba(10,10,26,0.96);border-top:1px solid var(--gb);padding:8px;display:none;}
.npc.active{display:block;}
.npg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:560px;margin:0 auto;}
.npb{min-height:52px;padding:8px;font-size:20px;font-weight:700;font-family:'Orbitron','Kanit',sans-serif;border-radius:10px;border:1px solid var(--gb);background:rgba(0,240,255,0.08);color:var(--tb);cursor:pointer;touch-action:manipulation;}
.npb:active{transform:scale(0.94);background:rgba(0,240,255,0.25);}
.npb.op{background:rgba(181,55,242,0.15);color:var(--nu);}
.npb.submit{background:linear-gradient(135deg,var(--ng),#00b09b);color:#0a1a0a;font-size:18px;}
.npb.back{background:rgba(255,0,110,0.15);color:var(--np);font-size:18px;}
.mgrid{display:grid;grid-template-columns:1fr;gap:10px;}
.mcard{background:var(--g);border:2px solid var(--gb);border-radius:14px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;}
.mcard .me{font-size:38px;line-height:1;flex-shrink:0;}
.mcard .mi{flex:1;}
.mcard .mn{font-weight:700;font-size:15px;}
.mcard .md{font-size:11px;color:var(--td);margin-top:2px;}
.pcard{background:var(--g);border:2px solid var(--gb);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.pcard.eq{border-color:var(--ng);background:rgba(57,255,20,0.08);}
.pemoji{font-size:38px;line-height:1;}
.tp{background:rgba(0,0,0,0.5);border:1px solid var(--gb);border-radius:14px;padding:12px;margin-bottom:8px;}
.tt{text-align:center;font-family:'Orbitron',sans-serif;font-size:34px;font-weight:900;color:var(--ny);margin-bottom:8px;}
.te{background:rgba(0,0,0,0.6);border:1px dashed var(--gb);border-radius:10px;padding:10px;min-height:48px;text-align:center;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.es{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 6px;border-radius:6px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);font-family:'Orbitron',sans-serif;font-weight:700;}
.es.op{background:rgba(181,55,242,0.15);border-color:rgba(181,55,242,0.4);color:var(--nu);}
.es.empty{opacity:0.4;background:transparent;border-style:dashed;}
.th{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;}
.tile{aspect-ratio:1;min-height:60px;border-radius:10px;background:linear-gradient(135deg,rgba(0,240,255,0.2),rgba(181,55,242,0.15));border:2px solid var(--nb);color:var(--tb);font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.tile.used{opacity:0.3;background:rgba(0,0,0,0.3);border-color:var(--gb);cursor:not-allowed;}
.tile.coin{background:linear-gradient(135deg,rgba(255,215,0,0.3),rgba(255,170,0,0.2));border-color:var(--ny);color:var(--ny);font-size:19px;}
.tile.coin.plus{background:linear-gradient(135deg,rgba(57,255,20,0.3),rgba(0,176,155,0.2));border-color:var(--ng);color:var(--ng);}
.tile.coin.minus{background:linear-gradient(135deg,rgba(255,0,110,0.3),rgba(255,75,139,0.2));border-color:var(--np);color:var(--np);}
.to{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px;}
.ob{min-height:46px;border-radius:10px;background:rgba(181,55,242,0.15);border:1px solid rgba(181,55,242,0.4);color:var(--nu);font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;cursor:pointer;touch-action:manipulation;}
.ob:active{transform:scale(0.94);}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.pvs>div{padding:8px;border-radius:10px;text-align:center;font-weight:700;font-size:14px;}
.pvs .s1{background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.3);color:var(--nb);}
.pvs .s2{background:rgba(255,0,110,0.08);border:1px solid rgba(255,0,110,0.3);color:var(--np);}
.pvb{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;}
.pvp1{background:rgba(0,240,255,0.2);color:var(--nb);border:1px solid var(--nb);}
.pvp2{background:rgba(255,0,110,0.2);color:var(--np);border:1px solid var(--np);}
.pvt{text-align:center;font-size:13px;font-weight:700;margin-bottom:8px;padding:8px;border-radius:10px;}
.pvt.p1{background:rgba(0,240,255,0.12);color:var(--nb);border:1px solid rgba(0,240,255,0.5);}
.pvt.p2{background:rgba(255,0,110,0.12);color:var(--np);border:1px solid rgba(255,0,110,0.5);}
.duel-wrap{display:flex;flex-direction:column;gap:6px;height:100%;}
.duel-hdr{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,0.5);border-radius:12px;font-size:14px;font-weight:700;border:1px solid var(--gb);}
.duel-side{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px;border-radius:14px;border:2px solid;min-height:0;position:relative;}
.duel-p1{background:linear-gradient(180deg,rgba(0,240,255,0.1),transparent);border-color:var(--nb);}
.duel-p2{background:linear-gradient(0deg,rgba(255,0,110,0.1),transparent);border-color:var(--np);}
.duel-rotate{transform:rotate(180deg);width:100%;}
.duel-name{font-size:13px;font-weight:700;margin-bottom:4px;text-align:center;}
.duel-p1 .duel-name{color:var(--nb);}
.duel-p2 .duel-name{color:var(--np);}
.duel-q{font-size:24px;font-weight:900;font-family:'Orbitron','Kanit',sans-serif;text-align:center;margin:6px 0 8px;}
.duel-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.duel-btn{min-height:50px;font-size:19px;font-weight:900;font-family:'Orbitron','Kanit',sans-serif;border-radius:10px;border:2px solid var(--gb);background:rgba(0,0,0,0.4);color:var(--tb);cursor:pointer;}
.duel-btn.dis{opacity:0.3;pointer-events:none;}
.duel-p1 .duel-btn{border-color:rgba(0,240,255,0.5);background:rgba(0,240,255,0.08);}
.duel-p2 .duel-btn{border-color:rgba(255,0,110,0.5);background:rgba(255,0,110,0.08);}
.duel-badge{position:absolute;top:6px;left:6px;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:700;}
.duel-p1 .duel-badge{background:rgba(0,240,255,0.2);color:var(--nb);}
.duel-p2 .duel-badge{background:rgba(255,0,110,0.2);color:var(--np);}
.pattern-seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0;}
.pattern-num{min-width:52px;height:52px;padding:0 10px;background:linear-gradient(135deg,rgba(0,240,255,0.2),rgba(181,55,242,0.15));border:2px solid var(--nb);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;}
.pattern-num.q{background:rgba(255,230,0,0.15);border-color:var(--ny);color:var(--ny);}
.pattern-ans{display:flex;gap:8px;margin-top:12px;}
.pattern-ans input{flex:1;padding:14px;font-size:20px;text-align:center;border-radius:10px;border:2px solid var(--gb);background:rgba(0,0,0,0.5);color:var(--tb);font-family:'Orbitron',sans-serif;font-weight:700;}
.balance-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0;}
.balance-side{background:rgba(0,0,0,0.4);border:2px solid var(--gb);border-radius:12px;padding:12px;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.balance-side.lighter{border-color:var(--np);}
.balance-side.eq{border-color:var(--ng);}

<script>
"use strict";
/* ============================================================
   PART 2: CORE ENGINE (Audio, Particles, Save, Generators)
   ============================================================ */

/* ---------- 1. SAFETY LITE ---------- */
var __errs = [];
window.addEventListener('error', function(e) {
  __errs.push({t: Date.now(), m: e.message});
  try { console.warn('[ERR]', e.message); } catch(x) {}
});
window.__safety = { getErrors: () => __errs.slice(), clear: () => { __errs.length = 0; } };

/* ---------- 2. AUDIO SYSTEM ---------- */
var Audio = (function() {
  var ctx = null, mg = null, bg = null, en = true, mt = null, ms = 0;
  
  function init() {
    if(ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      mg = ctx.createGain(); mg.gain.value = 0.85; mg.connect(ctx.destination);
      bg = ctx.createGain(); bg.gain.value = 0.22; bg.connect(mg);
    } catch(e) {}
  }
  
  function resume() { try { if(ctx && ctx.state === 'suspended') ctx.resume(); } catch(e) {} }
  
  function tone(f, t, d, v, del) {
    if(!ctx || !en) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + (del || 0);
      o.type = t || 'sine';
      o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(v || 0.06, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(mg);
      o.start(t0); o.stop(t0 + d + 0.02);
    } catch(e) {}
  }
  
  function sweep(f1, f2, t, d, v) {
    if(!ctx || !en) return;
    try {
      var o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime;
      o.type = t;
      o.frequency.setValueAtTime(f1, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + d);
      g.gain.setValueAtTime(v, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(mg);
      o.start(t0); o.stop(t0 + d + 0.02);
    } catch(e) {}
  }
  
  function noise(d, v) {
    if(!ctx || !en) return;
    try {
      var b = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * d)), ctx.sampleRate);
      var ch = b.getChannelData(0);
      for(var i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
      var s = ctx.createBufferSource(), g = ctx.createGain();
      s.buffer = b; g.gain.value = v;
      s.connect(g); g.connect(mg); s.start();
    } catch(e) {}
  }
  
  var sfx = {
    click: () => tone(600, 'sine', 0.06, 0.08),
    correct: () => { tone(700, 'triangle', 0.12, 0.1); tone(1050, 'triangle', 0.14, 0.1, null, 0.07); tone(1400, 'sine', 0.16, 0.07, null, 0.14); },
    wrong: () => { tone(220, 'sawtooth', 0.16, 0.1); tone(150, 'sawtooth', 0.24, 0.1, null, 0.1); },
    crit: () => { sweep(500, 1400, 'square', 0.16, 0.14); tone(1800, 'square', 0.22, 0.11, null, 0.1); noise(0.16, 0.06); },
    level: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 'triangle', 0.2, 0.12, null, i * 0.08)); },
    win: () => { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 'triangle', 0.22, 0.13, null, i * 0.09)); },
    lose: () => { [420, 340, 270, 200, 150].forEach((f, i) => tone(f, 'sawtooth', 0.22, 0.1, null, i * 0.1)); },
    hit: () => { noise(0.08, 0.08); tone(160, 'square', 0.08, 0.08); },
    heal: () => { tone(880, 'sine', 0.14, 0.09); tone(1320, 'sine', 0.2, 0.09, null, 0.06); tone(1760, 'sine', 0.14, 0.06, null, 0.14); },
    gold: () => { tone(1400, 'triangle', 0.08, 0.08); tone(2100, 'triangle', 0.12, 0.08, null, 0.06); },
    combo: (n) => { var b = 500 + Math.min((n || 1) * 90, 1100); tone(b, 'square', 0.1, 0.08); tone(b * 1.5, 'square', 0.1, 0.06, null, 0.05); },
    skill: () => { sweep(200, 900, 'sawtooth', 0.2, 0.1); tone(1200, 'square', 0.15, 0.08, null, 0.15); },
    shield: () => { tone(400, 'sine', 0.2, 0.09); tone(600, 'sine', 0.25, 0.08, null, 0.08); },
    dodge: () => { sweep(900, 300, 'sine', 0.15, 0.09); noise(0.1, 0.05); },
    tick_low: () => tone(1800, 'square', 0.05, 0.07),
    bossRoar: () => { sweep(120, 60, 'sawtooth', 0.5, 0.15); noise(0.4, 0.1); },
    comboMilestone: () => { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 'square', 0.1, 0.09, null, i * 0.06)); },
    buttonError: () => { tone(300, 'square', 0.1, 0.1); tone(200, 'square', 0.15, 0.09, null, 0.06); },
    passive: () => { tone(1600, 'sine', 0.08, 0.06); tone(2000, 'sine', 0.1, 0.05, null, 0.05); }
  };
  
  var scale = [220, 246.94, 261.63, 293.66, 329.63, 349.23, 392.00, 440, 493.88];
  var bass = [110, 110, 164.81, 146.83, 110, 110, 98, 130.81];
  
  function startMusic(tempo) {
    if(!ctx || !en) return;
    ms = 0;
    var bpm = tempo || 110, stepMs = 60000 / bpm / 2;
    if(mt) clearInterval(mt);
    mt = setInterval(() => {
      if(!ctx || !en) return;
      var s = ms % 16;
      if(s % 2 === 0) { const i = (s/2) % scale.length; tone(scale[(i*3)%scale.length], 'square', 0.18, 0.10, bg); }
      if(s % 4 === 0) tone(scale[(s*5)%scale.length], 'triangle', 0.24, 0.08, bg);
      if(s % 8 === 2) tone(scale[(s*2+4)%scale.length], 'sine', 0.2, 0.06, bg);
      if(s % 4 === 0) tone(bass[(s/4)%bass.length], 'triangle', 0.42, 0.14, bg);
      if(s % 4 === 0) sweep(140, 50, 'sine', 0.1, 0.10);
      if(s % 2 === 1) noise(0.035, 0.020);
      ms++;
    }, stepMs);
  }
  
  function stopMusic() { if(mt) clearInterval(mt); mt = null; }
  function setEnabled(v) { en = v; if(mg) mg.gain.value = v ? 0.85 : 0; }
  
  return { init, resume, sfx, startMusic, stopMusic, setEnabled, isEnabled: () => en };
})();

/* ---------- 3. PARTICLES SYSTEM ---------- */
var Particles = (function() {
  var c = document.getElementById('bgCanvas'), cx = c.getContext('2d');
  var W = 0, H = 0, dpr = 1, p = [], st = [];
  
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
  }
  
  function initStars() {
    st.length = 0;
    var n = Math.floor(W * H / 12000);
    for(var i = 0; i < n; i++) {
      st.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+0.3, a: Math.random(), da: (Math.random()*0.02+0.005)*(Math.random()<0.5?-1:1) });
    }
  }
  
  function burst(x, y, o) {
    o = o || {};
    var n = o.count || 20, co = o.colors || ['#00f0ff','#ff006e','#ffe600','#39ff14','#b537f2'];
    for(var i = 0; i < n; i++) {
      if(p.length >= 300) break;
      var an = Math.random() * Math.PI * 2, sp = (o.speed || 4) * (0.5 + Math.random() * 0.8);
      p.push({ x, y, vx: Math.cos(an)*sp, vy: Math.sin(an)*sp, life: 1, decay: 0.015+Math.random()*0.02, size: 2+Math.random()*3, color: co[Math.floor(Math.random()*co.length)], g: 0.08 });
    }
  }
  
  function update() {
    for(var i = p.length - 1; i >= 0; i--) {
      var q = p[i];
      q.x += q.vx; q.y += q.vy; q.vy += q.g; q.vx *= 0.985; q.vy *= 0.985; q.life -= q.decay;
      if(q.life <= 0) p.splice(i, 1);
    }
    for(var j = 0; j < st.length; j++) {
      var s = st[j]; s.a += s.da;
      if(s.a <= 0 || s.a >= 1) s.da = -s.da;
      s.a = Math.max(0.05, Math.min(1, s.a));
    }
  }
  
  function draw() {
    cx.clearRect(0, 0, W, H);
    for(var i = 0; i < st.length; i++) {
      var s = st[i]; cx.beginPath(); cx.fillStyle = `rgba(180,220,255,${s.a*0.5})`; cx.arc(s.x, s.y, s.r, 0, Math.PI*2); cx.fill();
    }
    for(var j = 0; j < p.length; j++) {
      var q = p[j]; cx.globalAlpha = Math.max(0, q.life);
      var g = cx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.size*1.8);
      g.addColorStop(0, q.color); g.addColorStop(1, 'transparent');
      cx.fillStyle = g; cx.beginPath(); cx.arc(q.x, q.y, q.size*1.8, 0, Math.PI*2); cx.fill();
    }
    cx.globalAlpha = 1;
  }
  
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  window.addEventListener('resize', resize, {passive: true});
  resize();
  return { start: loop, burst };
})();

function floatText(x, y, t, c) {
  var el = document.createElement('div');
  el.className = 'ft ' + (c || '');
  el.textContent = t; el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => { try { el.remove(); } catch(e) {} }, 1200);
}

/* ---------- 4. SAVE SYSTEM ---------- */
var SAVE_KEY = 'mq_v8', SAVE_VERSION = 8;
var Save = {
  defaultState: function() {
    return {
      version: SAVE_VERSION,
      player: { name: 'ผู้กล้า', hp: 100, maxHp: 100, score: 0, gold: 200, combo: 0, maxCombo: 0, tc: 0, tw: 0, ch: 1, lv: 1, exp: 0, plv: 1, rebirth: 0, rbonus: 0, bossHp: 0, bossMaxHp: 0, shield: false, skillPoints: 0 },
      pclass: 'warrior', epet: null,
      inv: { w: 0, s: 0, h: 0, a: 0, p: 0, sh: 0 },
      skillTree: {}, rareItems: [], consumables: {},
      permanentBoosts: { crit: 0, cmul: 0, gold: 0, exp: 0, hp: 0, time: 0 },
      myPets: [], myGClasses: [],
      completed: {}, bossKills: [], stats: {},
      stats2: { maxDamage: 0, totalDamage: 0, patternsSolved: 0, balanceSolved: 0, comparisonsSolved: 0, twentyFourSolved: 0 },
      wrongLog: [], soundOn: true, createdAt: Date.now(), updatedAt: Date.now()
    };
  },
  validate: function(d) {
    if(!d || typeof d !== 'object') return false;
    if(d.version !== SAVE_VERSION) return false;
    if(!d.player) return false;
    if(typeof d.player.gold !== 'number') return false;
    if(!Array.isArray(d.myPets)) return false;
    if(!Array.isArray(d.myGClasses)) return false;
    return true;
  },
  load: function() {
    try {
      var r = localStorage.getItem(SAVE_KEY);
      if(!r) return null;
      var p = JSON.parse(r);
      if(!this.validate(p)) { localStorage.removeItem(SAVE_KEY); return null; }
      return p;
    } catch(e) { return null; }
  },
  write: function(s) { try { s.updatedAt = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(s)); return true; } catch(e) { return false; } },
  clear: function() { try { localStorage.removeItem(SAVE_KEY); } catch(e) {} }
};

/* ---------- 5. HELPERS ---------- */
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while(b) { const t = b; b = a % b; a = t; } return a; };
const simplify = (n, d) => { const g = gcd(n, d) || 1; return [n/g, d/g]; };
function parseFrac(s) { s = String(s).trim().replace(/\s+/g,''); var m = s.match(/^(-?\d+)\/(-?\d+)$/); if(m && parseFloat(m[2]) !== 0) return parseFloat(m[1])/parseFloat(m[2]); var m2 = s.match(/^(-?\d+)$/); if(m2) return parseFloat(s); return null; }
function parseRad(s) { s = String(s).trim().replace(/\s+/g,''); var m = s.match(/^(-?\d*)√(\d+)$/); if(!m) return null; var c; if(m[1] === '' || m[1] === '+') c = 1; else if(m[1] === '-') c = -1; else c = parseFloat(m[1]); if(isNaN(c)) return null; var r = parseFloat(m[2]); if(isNaN(r)) return null; return { value: c * Math.sqrt(r) }; }
function safeEval(expr) { if(!expr) return null; if(/[√,]/.test(expr)) return null; var js = String(expr).replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/−/g,'-'); if(!/^[\d\s\+\-\*\/\.\(\)]+$/.test(js)) return null; if(!/\d/.test(js)) return null; if(/\*{3,}/.test(js)) return null; try { var r = Function('"use strict";return (' + js + ')')(); if(typeof r !== 'number' || !isFinite(r)) return null; return r; } catch(e) { return null; } }
function answersMatch(user, correct) {
  if(user === undefined || user === null) return false;
  var ru = String(user).trim(), rc = String(correct).trim();
  if(!ru) return false;
  var u = ru.replace(/\s+/g,''), c = rc.replace(/\s+/g,'');
  var T = 0.011;
  if(u.toLowerCase() === c.toLowerCase()) return true;
  var ue = safeEval(u), ce = safeEval(c);
  if(ue !== null && ce !== null && Math.abs(ue - ce) <= T) return true;
  var un = /√/.test(u) ? NaN : parseFloat(u), cn = /√/.test(c) ? NaN : parseFloat(c);
  if(!isNaN(un) && !isNaN(cn) && Math.abs(un - cn) <= T) return true;
  var uf = parseFrac(u), cf = parseFrac(c);
  if(uf !== null && cf !== null && Math.abs(uf - cf) <= T) return true;
  if(uf !== null && !isNaN(cn) && Math.abs(uf - cn) <= T) return true;
  if(cf !== null && !isNaN(un) && Math.abs(cf - un) <= T) return true;
  var ur = parseRad(u), cr = parseRad(c);
  if(ur && cr && Math.abs(ur.value - cr.value) <= T) return true;
  if(ur && !isNaN(cn) && Math.abs(ur.value - cn) <= T) return true;
  if(cr && !isNaN(un) && Math.abs(cr.value - un) <= T) return true;
  if(ur && ce !== null && Math.abs(ur.value - ce) <= T) return true;
  if(cr && ue !== null && Math.abs(cr.value - ue) <= T) return true;
  return false;
}

var $ = id => document.getElementById(id);

/* ---------- 1. MODAL SYSTEM ---------- */
function showModal(title, body, buttons) {
  modalContainer.innerHTML = `<div class="mo"><div class="mc"><div class="mt">${title}</div><div class="mb">${body}</div><div class="fc">${(buttons || [{label:'ตกลง', cls:'btn', action:'closeModal()'}]).map(b => `<button class="btn ${b.cls||''}" onclick="${b.action||'closeModal()'}">${b.label}</button>`).join('')}</div></div></div>`;
}
function closeModal() { modalContainer.innerHTML = ''; }

/* ---------- 2. NAVIGATION & TAB BAR ---------- */
function go(screen) {
  // Clear timers/intervals
  if(typeof battleTimer !== 'undefined' && battleTimer) clearInterval(battleTimer);
  if(typeof skillTick !== 'undefined' && skillTick) clearInterval(skillTick);
  if(typeof clearTO === 'function') clearTO();
  closeModal();
  if(typeof hideNumpad === 'function') hideNumpad();
  
  if(typeof isSubmitting !== 'undefined') isSubmitting = false;
  currentScreen = screen;
  if(screen !== 'battle') { battleSession++; battleEnded = false; }

  // Handle Tab Bar visibility & active state
  const tabBar = $('tabBar');
  if(tabBar) {
    tabBar.style.display = (screen === 'battle') ? 'none' : 'flex';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    if(screen === 'menu') $('tab-home')?.classList.add('active');
    if(screen === 'menu_char' || screen === 'class' || screen === 'skillTree' || screen === 'inventory' || screen === 'upgrade' || screen === 'rebirth') $('tab-char')?.classList.add('active');
    if(screen === 'menu_shop' || screen === 'shop' || screen === 'petshop' || screen === 'gachaPet' || screen === 'gachaClass') $('tab-shop')?.classList.add('active');
    if(screen === 'menu_lib' || screen === 'chapters') $('tab-lib')?.classList.add('active');
    if(screen === 'settings') $('tab-set')?.classList.add('active');
  }

  // Route to renderers
  try {
    switch(screen) {
      case 'menu': renderMenu(); break;
      case 'menu_char': renderMenuChar(); break;
      case 'menu_shop': renderMenuShop(); break;
      case 'menu_lib': renderMenuLib(); break;
      case 'chapters': renderChapters(); break;
      case 'battle': if(typeof renderBattle === 'function') renderBattle(); break;
      case 'inventory': renderInventory(); break;
      case 'shop': renderShop('consumable'); break;
      case 'petshop': renderPetShop(); break;
      case 'gachaPet': renderGacha('pet'); break;
      case 'gachaClass': renderGacha('class'); break;
      case 'upgrade': renderUpgrade(); break;
      case 'class': renderClassSelect(); break;
      case 'skillTree': renderSkillTree(); break;
      case 'rebirth': renderRebirth(); break;
      case 'stats': renderStats(); break;
      case 'settings': renderSettings(); break;
      default: renderMenu();
    }
  } catch(e) {
    console.error('Render Error:', e);
    contentEl.innerHTML = `<div class="tc" style="padding:30px">เกิดข้อผิดพลาด: ${e.message}<br><button class="btn mt3" onclick="go('menu')">กลับเมนู</button></div>`;
  }
  contentEl.scrollTop = 0;
}

        <div class="chn">
          <div class="chname">บท ${ch.id}: ${ch.name}</div>
          <div class="chprog">${done}/5 · บอส ${ch.boss}</div>
          <div class="pb"><div class="pbf" style="width:${(done/5)*100}%"></div></div>
        </div>

      <div class="llist" id="ch-${ch.id}" style="display:none">

        }).join('')}

}

function toggleChapter(id) {
  var e = $('ch-' + id);
  if(e) e.style.display = e.style.display === 'none' ? 'grid' : 'none';
}
function isCompleted(ch, lv) {
  return (state.completed[ch] || []).indexOf(lv) > -1;
}

function renderShop(tab) {
  tab = tab || 'consumable';
  var cats = {consumable:'🧪 ไอเทม', boost:'💎 ถาวร', rare:'🌟 หายาก'};
  var h = '<h3>🛒 ร้านค้า</h3><div class="sbar"><span>🪙 <span class="sg">' + state.player.gold + '</span></span></div>';
  h += '<div style="display:flex;gap:4px;margin-bottom:10px">' + Object.keys(cats).map(k => `<button class="btn btn-xs ${tab===k?'btn-g':'btn-o'}" style="flex:1" onclick="renderShop('${k}')">${cats[k]}</button>`).join('') + '</div>';
  
  Object.values(SHOP_ITEMS).filter(it => it.cat === tab).forEach(it => {
    var owned = '';
    if(tab === 'consumable') owned = `<span class="bdg bdg-b">มี ${(state.consumables&&state.consumables[it.id])||0}</span>`;
    else if(tab === 'boost') owned = state.permanentBoosts && state.permanentBoosts[it.id] ? '<span class="bdg bdg-g">✅</span>' : '';
    else if(tab === 'rare') owned = state.rareItems && state.rareItems.indexOf(it.id) > -1 ? '<span class="bdg bdg-gold">✅</span>' : '';
    var hasIt = owned.indexOf('✅') > -1;
    h += `<div class="si"><div style="flex:1"><b>${it.name}</b><br><span class="ts" style="color:var(--td)">${it.desc}</span> ${owned}</div><button class="btn btn-sm" onclick="buyItem('${it.id}')" ${hasIt?'disabled':''}>${it.cost}🪙</button></div>`;
  });
  h += '<button class="btn btn-o wf mt3" onclick="go(\'menu_shop\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
}

function buyItem(id) {
  var it = SHOP_ITEMS[id];
  if(!it) return;
  if(state.player.gold < it.cost) { Audio.sfx.err(); return; }
  if(it.cat === 'consumable') {
    state.player.gold -= it.cost;
    if(!state.consumables) state.consumables = {};
    state.consumables[id] = (state.consumables[id] || 0) + 1;
  } else if(it.cat === 'boost') {
    if(state.permanentBoosts[id]) { Audio.sfx.err(); return; }
    state.player.gold -= it.cost;
    state.permanentBoosts[id] = 1;
    if(it.boost) for(var k in it.boost) state.permanentBoosts[k] = (state.permanentBoosts[k] || 0) + it.boost[k];
    state.player.maxHp = getMaxHp();
  } else if(it.cat === 'rare') {
    if(state.rareItems.indexOf(id) > -1) { Audio.sfx.err(); return; }
    state.player.gold -= it.cost;
    state.rareItems.push(id);
    state.player.maxHp = getMaxHp();
  }
  Audio.sfx.gold(); Save.write(state); renderShop(it.cat);
}

function renderPetShop() {
  var h = '<h3>🐾 ร้านสัตว์</h3><div class="sbar"><span>🪙 <span class="sg">' + state.player.gold + '</span></span></div><div class="cgrid">';
  for(var k in Pets) {
    var p = Pets[k]; if(!p.shop) continue;
    var owned = state.myPets.indexOf(k) > -1, eq = state.epet === k;
    h += `<div class="pcard ${eq?'eq':''}">
      <span class="pemoji">${p.emoji}</span>
      <div style="font-weight:700;font-size:13px">${p.name}</div>
      <div class="ts" style="color:var(--td)">${p.desc}</div>
      ${owned ? `<button class="btn btn-xs ${eq?'btn-g':'btn-o'}" onclick="equipPet('${k}')">${eq?'✅':'🎯'}</button>` : `<button class="btn btn-xs" onclick="buyPet('${k}')">${p.cost}🪙</button>`}
    </div>`;
  }
  h += '</div>';
  var owned2 = state.myPets.filter(k => Pets[k] && !Pets[k].shop);
  if(owned2.length) {
    h += '<h3 class="mt3">✨ หายาก</h3><div class="cgrid">';
    owned2.forEach(k => {
      var p = Pets[k], eq = state.epet === k;
      h += `<div class="pcard ${eq?'eq':''}"><span class="pemoji">${p.emoji}</span><div style="font-weight:700;font-size:13px">${p.name}</div><div class="ts" style="color:var(--td)">${p.desc}</div><button class="btn btn-xs ${eq?'btn-g':'btn-o'}" onclick="equipPet('${k}')">${eq?'✅':'🎯'}</button></div>`;
    });
    h += '</div>';
  }
  h += '<button class="btn btn-o wf mt3" onclick="go(\'menu_shop\')">🔙 กลับ</button>';

}

function buyPet(k) {
  var p = Pets[k];
  if(!p || state.myPets.indexOf(k) > -1) return;
  if(state.player.gold < p.cost) { Audio.sfx.err(); return; }
  state.player.gold -= p.cost;
  state.myPets.push(k);
  if(!state.epet) state.epet = k;
  Audio.sfx.gold(); Save.write(state); state.player.maxHp = getMaxHp(); renderPetShop();
}

function equipPet(k) {
  if(state.myPets.indexOf(k) < 0) return;
  state.epet = state.epet === k ? null : k;
  state.player.maxHp = getMaxHp(); Save.write(state); renderPetShop();
}

function renderGacha(type) {
  var isPet = type === 'pet', cost = isPet ? 200 : 500;

    <div class="sbar"><span>🪙 <span class="sg">${state.player.gold}</span></span></div>

    <button class="btn ${isPet?'btn-gold':'btn-p'} wf" onclick="doGacha('${type}')">🎰 สุ่ม 1 ครั้ง (${cost}🪙)</button>
    <button class="btn btn-o wf mt3" onclick="go('menu_shop')">🔙 กลับ</button>`;
}

function doGacha(type) {
  var isPet = type === 'pet', cost = isPet ? 200 : 500;
  if(state.player.gold < cost) { Audio.sfx.err(); return; }
  state.player.gold -= cost;
  var pool, picked;
  if(isPet) {
    pool = GachaPets.filter(k => state.myPets.indexOf(k) < 0);
    if(!pool.length) { state.player.gold += cost; alert('มีครบแล้ว!'); return; }
    picked = pick(pool); state.myPets.push(picked);
    if(!state.epet) state.epet = picked;
  } else {
    pool = GachaClasses.filter(k => state.myGClasses.indexOf(k) < 0);
    if(!pool.length) { state.player.gold += cost; alert('มีครบแล้ว!'); return; }
    picked = pick(pool); state.myGClasses.push(picked);
  }
  Audio.sfx.win(); Save.write(state);
  var data = isPet ? Pets[picked] : AdvanceClasses[picked];
  var gd = $('gd'); if(gd) gd.textContent = data.emoji;
  alert(`🎉 สุ่มได้: ${data.emoji} ${data.name}`);
  renderGacha(type);
}

function renderUpgrade() {
  var costs = {w:[0,300,700,1400,2500,4500,7000,10000,14000,19000,25000,32000,40000,50000,62000],s:[0,250,600,1200,2200,4000,6500,9500,13000,18000,24000,31000,39000,49000,61000],h:[0,200,500,1000,1800,3200,5200,7800,11000,15000,20000,26000,33000,42000,53000],a:[0,300,700,1400,2500,4500,7000,10000,14000,19000,25000,32000,40000,50000,62000],p:[0,250,600,1200,2200,4000,6500,9500,13000,18000,24000,31000,39000,49000,61000],sh:[0,350,800,1600,3000,5000,7500,10500,14000,18500,24000,31000,39000,49000,61000]};

  for(var k in EQUIP) {

}

function doUpgrade(t) {
  var costs = {w:[0,300,700,1400,2500,4500,7000,10000,14000,19000,25000,32000,40000,50000,62000],s:[0,250,600,1200,2200,4000,6500,9500,13000,18000,24000,31000,39000,49000,61000],h:[0,200,500,1000,1800,3200,5200,7800,11000,15000,20000,26000,33000,42000,53000],a:[0,300,700,1400,2500,4500,7000,10000,14000,19000,25000,32000,40000,50000,62000],p:[0,250,600,1200,2200,4000,6500,9500,13000,18000,24000,31000,39000,49000,61000],sh:[0,350,800,1600,3000,5000,7500,10500,14000,18500,24000,31000,39000,49000,61000]};
  var lv = state.inv[t]; if(lv >= 15) return;
  var price = costs[t][lv+1];
  if(state.player.gold < price) { Audio.sfx.err(); return; }
  state.player.gold -= price; state.inv[t]++; state.player.maxHp = getMaxHp();
  Audio.sfx.level(); Save.write(state); renderUpgrade();
}

function renderClassSelect() {
  var all = Object.assign({}, BaseClasses, AdvanceClasses);
  var h = '<h3>🔄 เลือกคลาส</h3><div class="cgrid">';
  for(var k in all) {
    var d = all[k], locked = (d.unlock !== undefined && state.myGClasses.indexOf(k) < 0 && d.unlock > state.player.plv), sel = state.pclass === k;
    h += `<div class="ccard ${sel?'sel':''} ${locked?'lk':''}" onclick="selectClass('${k}')"><span class="cemoji">${d.emoji}${locked?'🔒':''}</span><div class="cname">${d.name}</div><div class="cdesc">${d.desc}</div></div>`;
  }
  h += '</div><button class="btn btn-o wf mt3" onclick="go(\'menu_char\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
}

function selectClass(k) {
  var all = Object.assign({}, BaseClasses, AdvanceClasses); var d = all[k]; if(!d) return;
  if(d.unlock !== undefined && state.myGClasses.indexOf(k) < 0 && d.unlock > state.player.plv) { Audio.sfx.err(); return; }
  state.pclass = k; state.player.maxHp = getMaxHp(); state.player.hp = state.player.maxHp;
  Audio.sfx.click(); Save.write(state); renderClassSelect();
}

function renderSkillTree() {
  var h = '<h3>🌟 ต้นไม้ทักษะ</h3><div class="sbar"><span>SP<span class="sv">' + state.player.skillPoints + '</span></span><span>Lv.<span class="sg">' + state.player.plv + '</span></span></div><div class="cgrid">';
  for(var k in SKILL_TREE) {
    var n = SKILL_TREE[k], owned = (state.skillTree && state.skillTree[k]) || 0, maxed = owned >= n.max;
    h += `<div class="ccard ${owned>0?'sel':''}" onclick="${maxed?'':'upgradeSkillTree(\''+k+'\')'}" style="min-height:100px"><div style="font-size:26px">${n.icon}</div><div class="cname">${n.name} ${owned}/${n.max}</div><div class="cdesc">${n.desc}</div>${maxed?'<div class="bdg bdg-gold mt2">MAX</div>':`<div class="bdg bdg-b mt2">${n.cost} SP</div>`}</div>`;
  }
  h += '</div><button class="btn btn-o wf mt3" onclick="go(\'menu_char\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
}

function upgradeSkillTree(id) {
  var n = SKILL_TREE[id], owned = (state.skillTree && state.skillTree[id]) || 0;
  if(owned >= n.max) return;
  if(state.player.skillPoints < n.cost) { Audio.sfx.err(); return; }
  state.player.skillPoints -= n.cost;
  if(!state.skillTree) state.skillTree = {};
  state.skillTree[id] = owned + 1;
  Audio.sfx.level(); Save.write(state); renderSkillTree();
}

function renderRebirth() {
  var ab = state.bossKills.length >= 10, rg = 15000 + state.player.rebirth * 10000, rl = 25 + state.player.rebirth * 10;
  var hg = state.player.gold >= rg, hl = state.player.plv >= rl, can = ab && hg && hl;
  contentEl.innerHTML = `<h3>💀 เกิดใหม่</h3>
    <div class="si">${ab?'✅':'❌'} บอส 10 บท (${state.bossKills.length}/10)</div>
    <div class="si">${hg?'✅':'❌'} เหรียญ ${rg.toLocaleString()}</div>
    <div class="si">${hl?'✅':'❌'} Lv.${rl}+ (${state.player.plv})</div>
    <div class="ts mt2 tc" style="color:var(--td)">+25 HP ถาวร</div>
    ${can?'<button class="btn btn-r wf mt3" onclick="doRebirth()">💀 เกิดใหม่!</button>':'<button class="btn wf mt3" disabled>🔒 ยังไม่พร้อม</button>'}
    <button class="btn btn-o wf mt2" onclick="go('menu_char')">🔙 กลับ</button>`;
}

function renderStats() {
  var tc = 0, tw = 0;
  var rows = Chapters.map(ch => {
    var s = state.stats[ch.id] || {correct:0, wrong:0}, total = s.correct + s.wrong;
    var pct = total ? Math.round(s.correct / total * 100) : '-';
    tc += s.correct; tw += s.wrong;
    var done = (state.completed[ch.id] || []).length, pn = pct === '-' ? 0 : pct;
    return `<div class="si col"><div style="display:flex;justify-content:space-between"><span>${ch.icon} ${ch.name}</span><span class="bdg ${pn>=70?'bdg-g':pn>=40?'bdg-b':'bdg-r'}">${pct}%</span></div><div class="ts" style="color:var(--td)">✅${s.correct} ❌${s.wrong} ด่าน ${done}/5</div></div>`;
  }).join('');
  var total = tc + tw, acc = total ? Math.round(tc / total * 100 * 10) / 10 : '-';
  contentEl.innerHTML = `<h3>📈 สถิติ</h3>
    <div class="sbar"><span>✅ถูก <span class="sv">${tc}</span></span><span>❌ผิด <span class="sv" style="color:var(--np)">${tw}</span></span><span>🎯 <span class="sv">${acc}%</span></span></div>
    <div class="mt3">${rows}</div>
    <button class="btn btn-o wf mt3" onclick="go('menu')">🔙 กลับ</button>`;
}

function renderInventory() {
  var cd = getClass(), petInfo = state.epet && Pets[state.epet] ? Pets[state.epet].emoji + ' ' + Pets[state.epet].name : '-';
  var h = `<h3>🎒 กระเป๋า</h3><div class="si"><b>${cd.emoji} ${cd.name}</b></div><div class="si"><b>🐾 ${petInfo}</b></div>`;
  for(var slot in EQUIP) { var d = EQUIP[slot]; h += `<div class="si"><span>${d.name} Lv.${state.inv[slot]}</span><span class="ts">${d.per}</span></div>`; }
  if(state.consumables) for(var id in state.consumables) { if(state.consumables[id] > 0 && SHOP_ITEMS[id]) h += `<div class="si"><span>${SHOP_ITEMS[id].name}</span><span>${state.consumables[id]}</span></div>`; }
  if(state.rareItems && state.rareItems.length) { h += '<h3 class="mt3">🌟 หายาก</h3>'; state.rareItems.forEach(id => { var it = SHOP_ITEMS[id]; if(it) h += `<div class="si"><span>${it.name}</span><span class="ts">${it.desc}</span></div>`; }); }
  h += `<div class="ts mt3 tc" style="color:var(--td)">HP สูงสุด: ${getMaxHp()}</div><button class="btn btn-o wf mt3" onclick="go('menu_char')">🔙 กลับ</button>`;
  contentEl.innerHTML = h;
}

function renderSettings() {
  contentEl.innerHTML = `<h3>⚙️ ตั้งค่า</h3>
    <div class="si"><span>🔊 เสียง</span><button class="btn btn-sm ${state.soundOn?'btn-g':'btn-o'}" onclick="toggleSound()">${state.soundOn?'เปิด':'ปิด'}</button></div>
    <div class="si"><span>📤 ส่งออก</span><button class="btn btn-sm btn-o" onclick="exportSave()">คัดลอก</button></div>
    <div class="si"><span>📥 นำเข้า</span><button class="btn btn-sm btn-o" onclick="importSave()">วาง</button></div>
    <div class="si"><span>🗑️ ล้าง</span><button class="btn btn-sm btn-r" onclick="if(confirm('ลบเซฟทั้งหมด?')){Save.clear();location.reload();}">รีเซ็ต</button></div>
    <div class="ts mt3 tc" style="color:var(--td)">Version ${SAVE_VERSION}</div>
    <button class="btn btn-o wf mt3" onclick="go('menu')">🔙 กลับ</button>`;
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  Audio.setEnabled(state.soundOn);
  if(state.soundOn) { Audio.resume(); Audio.sfx.click(); }
  Save.write(state); renderSettings();
}

function exportSave() {
  try {
    var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    if(navigator.clipboard) navigator.clipboard.writeText(b64).then(() => alert('คัดลอกแล้ว')).catch(() => prompt('คัดลอก:', b64));
    else prompt('คัดลอก:', b64);
  } catch(e) { alert('ไม่สำเร็จ'); }
}

function importSave() {
  var b64 = prompt('วางข้อมูล:'); if(!b64) return;
  try {
    var data = JSON.parse(decodeURIComponent(escape(atob(b64.trim()))));
    if(!Save.validate(data)) { alert('ไม่ถูกต้อง'); return; }
    state = data; Save.write(state); alert('สำเร็จ'); go('menu');
  } catch(e) { alert('ไม่สำเร็จ'); }
}

<script>
"use strict";

   PART 5: BATTLE ENGINE & NUMPAD SYSTEM

var numpadContainer = $('numpadContainer');
var numpadGrid = $('numpadGrid');

/* ---------- 1. NUMPAD SYSTEM ---------- */
function buildNumpad() {
  var keys = [
    {k:'7',t:'7'},{k:'8',t:'8'},{k:'9',t:'9'},{k:'/',t:'÷',cls:'op',insert:'/'},{k:'√',t:'√',cls:'op',insert:'√'},
    {k:'4',t:'4'},{k:'5',t:'5'},{k:'6',t:'6'},{k:'*',t:'×',cls:'op',insert:'×'},{k:'^',t:'^',cls:'op',insert:'^'},
    {k:'1',t:'1'},{k:'2',t:'2'},{k:'3',t:'3'},{k:'-',t:'−',cls:'op',insert:'-'},{k:'+',t:'+',cls:'op',insert:'+'},
    {k:'0',t:'0'},{k:'.',t:'.',insert:'.'},{k:',',t:',',cls:'op',insert:','},{k:'back',t:'⌫',cls:'back'},{k:'submit',t:'✓',cls:'submit'}
  ];
  numpadGrid.innerHTML = keys.map(k => `<button class="npb ${k.cls||''}" data-key="${k.k}" data-insert="${k.insert||k.k}">${k.t}</button>`).join('');
}

buildNumpad();

numpadGrid.addEventListener('click', e => {
  var b = e.target.closest('.npb');
  if(!b || b.disabled) return;
  var key = b.dataset.key, insert = b.dataset.insert || key, inp = $('ansInp');
  if(!inp || inp.disabled) return;
  
  Audio.resume();
  if(key === 'back') {
    inp.value = inp.value.slice(0, -1);
  } else if(key === 'submit') {
    submitAnswer();
    return;
  } else {
    if(inp.value.length < 24) inp.value += insert;
  }
  Audio.sfx.click();
  updateNumpadSubmit();
}, {passive: false});

function updateNumpadSubmit() {
  var inp = $('ansInp'); if(!inp) return;
  var btn = numpadGrid.querySelector('[data-key="submit"]'); if(!btn) return;
  btn.disabled = !inp.value.trim() || inp.disabled;
}

function showNumpad(s) { numpadContainer.classList.toggle('active', !!s); }
function hideNumpad() { numpadContainer.classList.remove('active'); }

/* ---------- 2. BATTLE RENDERER ---------- */
function renderBattle() {
  var cd = getClass();
  var ch = Chapters.find(c => c.id === state.player.ch) || Chapters[0];
  var bossEmoji = state.player.lv === 5 ? ch.boss : '👾';
  
  contentEl.innerHTML = `
    <div class="bts" id="battleScene">
      <div class="sbar mb2"><span class="bdg bdg-b">${ch.icon} ด.${state.player.lv}</span><span class="bdg bdg-r" id="comboBadge">🔥0</span></div>
      <div class="crow">
        <div class="cbat">
          <div class="ed" id="pEmoji">${cd.emoji}</div>
          <div class="cbname">${state.player.name}</div>
          <div class="hpo"><div class="hpi" id="pHp" style="width:100%"></div></div>
          <div class="hpt">❤️<span id="pHpTxt">0/0</span></div>
        </div>
        <div class="vs">VS</div>
        <div class="cbat">
          <div class="ed" id="bEmoji">${bossEmoji}</div>
          <div class="cbname boss">บอส Lv.${state.player.lv}</div>
          <div class="hpo"><div class="hpi bh" id="bHp" style="width:100%"></div></div>
          <div class="hpt">❤️<span id="bHpTxt">0/0</span></div>
        </div>
      </div>
      <div class="tbo"><div class="tbi" id="tBar" style="width:100%"></div></div>
      <div class="tbt" id="tTxt">⏱30s</div>
    </div>
    <div class="qp">
      <div class="qd" id="qTxt">กำลังสร้าง...</div>
      <div class="air">
        <input class="ai" id="ansInp" placeholder="พิมพ์คำตอบ" inputmode="none" autocomplete="off">
        <button class="btn btn-g" id="subBtn" onclick="submitAnswer()" style="min-width:60px">✓</button>
      </div>
      <div class="cdisp" id="comboDisp"></div>
      <div class="fbm" id="fbMsg"></div>
    </div>
    <div class="fr" style="gap:6px">
      <button class="btn btn-sm btn-y" id="btnS1" onclick="useSkill('s1')"></button>
      <button class="btn btn-sm btn-g" id="btnS2" onclick="useSkill('s2')"></button>
      <button class="btn btn-sm btn-r" onclick="skipQuestion()">⏩</button>
    </div>
    <button class="btn btn-sm btn-o wf mt2" onclick="fleeBattle()">🏃 หนี</button>
  `;
  
  setupBattle();
  showNumpad(true);
  Audio.startMusic(state.player.lv === 5 ? 130 : 110);
}

/* ---------- 3. BATTLE LOGIC ---------- */
function setupBattle() {
  battleSession++;
  battleEnded = false;
  isSubmitting = false;
  clearTO();
  
  state.player.maxHp = getMaxHp();
  state.player.hp = state.player.maxHp;
  state.player.combo = 0;
  state.player.shield = false;
  skillCD = {s1: 0, s2: 0};
  activeEffects = {};
  state.player.__reviveUsed = false;
  
  // Boss scaling
  state.player.bossMaxHp = 150 + state.player.ch * 20 + state.player.lv * 50 + state.player.rebirth * 40;
  state.player.bossHp = state.player.bossMaxHp;
  state.player.turnCount = 0;
  
  if(skillTick) clearInterval(skillTick);
  skillTick = setInterval(() => {
    if(currentScreen !== 'battle' || battleEnded) {
      if(skillTick) { clearInterval(skillTick); skillTick = null; }
      return;
    }
    updateSkillBtns();
  }, 400);
  
  updateBattleUI();
  updateSkillBtns();
  nextQuestion();
}

function updateBattleUI() {
  var pHp = $('pHp'), bHp = $('bHp');
  if(!pHp) return;
  pHp.style.width = Math.max(0, state.player.hp / state.player.maxHp * 100) + '%';
  bHp.style.width = Math.max(0, state.player.bossHp / state.player.bossMaxHp * 100) + '%';
  $('pHpTxt').textContent = Math.max(0, Math.round(state.player.hp)) + '/' + state.player.maxHp;
  $('bHpTxt').textContent = Math.max(0, Math.round(state.player.bossHp)) + '/' + state.player.bossMaxHp;
  $('comboBadge').textContent = '🔥' + state.player.combo;
}

function updateSkillBtns() {
  var b1 = $('btnS1'), b2 = $('btnS2');
  if(!b1 || !b2) return;
  var cd = getClass();
  var s1 = SKILLS[cd.skills[0]] || SKILLS.slash;
  var s2 = SKILLS[cd.skills[1]] || SKILLS.guard;
  var now = Date.now();
  var r1 = Math.max(0, Math.ceil((skillCD.s1 - now) / 1000));
  var r2 = Math.max(0, Math.ceil((skillCD.s2 - now) / 1000));
  
  b1.innerHTML = s1.name + (r1 > 0 ? ' ⏳' + r1 + 's' : ' (' + s1.cost + '🪙)');
  b2.innerHTML = s2.name + (r2 > 0 ? ' ⏳' + r2 + 's' : ' (' + s2.cost + '🪙)');
  b1.disabled = r1 > 0 || state.player.gold < s1.cost;
  b2.disabled = r2 > 0 || state.player.gold < s2.cost;
}

function startTimer() {
  if(battleTimer) clearInterval(battleTimer);
  var ss = battleSession;
  var tt = {1: 60, 2: 55, 3: 50, 4: 45, 5: 40};
  timerMax = (tt[state.player.lv] || 60) + getTimeBonus();
  timerLeft = timerMax;
  
  var bar = $('tBar'), txt = $('tTxt');
  if(bar) bar.style.width = '100%';
  if(txt) txt.textContent = '⏱' + timerMax + 's';
  
  battleTimer = setInterval(() => {
    if(ss !== battleSession || battleEnded) { clearInterval(battleTimer); return; }
    timerLeft--;
    var pct = Math.max(0, timerLeft / timerMax * 100);
    if(bar) bar.style.width = pct + '%';
    if(txt) txt.textContent = '⏱' + Math.max(0, timerLeft) + 's';
    if(timerLeft <= 5 && timerLeft > 0) Audio.sfx.tick_low();
    if(timerLeft <= 0) { clearInterval(battleTimer); handleWrong(true); }
  }, 1000);
}

function nextQuestion() {
  if(battleEnded || currentScreen !== 'battle') return;
  if(state.player.bossHp <= 0 || state.player.hp <= 0) { endBattle(); return; }
  
  isSubmitting = false;
  currentQuest = generateQuestion(state.player.ch);
  
  var q = $('qTxt'); if(q) q.textContent = currentQuest.q;
  var inp = $('ansInp'); if(inp) { inp.value = ''; inp.disabled = false; inp.className = 'ai'; }
  var sb = $('subBtn'); if(sb) sb.disabled = false;
  var fb = $('fbMsg'); if(fb) { fb.textContent = ''; fb.style.color = 'var(--td)'; }
  var cd = $('comboDisp'); if(cd) cd.textContent = '';
  
  updateSkillBtns();
  updateNumpadSubmit();
  startTimer();
}

function submitAnswer() {
  if(isSubmitting || battleEnded) return;
  if(battleTimer) clearInterval(battleTimer);
  
  var inp = $('ansInp');
  if(!inp || !currentQuest) return;
  if(inp.disabled) return;
  var ua = inp.value.trim();
  if(!ua) return;
  
  isSubmitting = true;
  inp.disabled = true;
  var sb = $('subBtn'); if(sb) sb.disabled = true;
  updateNumpadSubmit();
  
  if(answersMatch(ua, currentQuest.a)) {
    inp.classList.add('cf');
    handleCorrect();
  } else {
    inp.classList.add('wf');
    handleWrong(false);
  }
}

function handleCorrect() {
  if(battleEnded || currentScreen !== 'battle') return;
  Audio.sfx.correct();
  
  state.player.combo++;
  state.player.turnCount++;
  if(state.player.combo > state.player.maxCombo) state.player.maxCombo = state.player.combo;
  state.player.tc++;
  
  var ch = state.player.ch;
  if(!state.stats[ch]) state.stats[ch] = {correct: 0, wrong: 0};
  state.stats[ch].correct++;
  
  if(state.player.combo === 5 || state.player.combo === 10 || state.player.combo === 20) {
    schedule(() => Audio.sfx.comboMilestone(), 250);
    floatText(window.innerWidth / 2, window.innerHeight * 0.25, '🔥COMBO x' + state.player.combo, 'critdmg');
  }
  
  var cd = getClass();
  var pb = getPetBonus();
  var base = 20 + state.player.combo * 5;
  var dmg = Math.round(base * (cd.dmg || 1) * getWeaponMul() * (1 + pb.dmg));
  
  if(state.player.combo >= 5 && cd.comboMul) dmg = Math.round(dmg * cd.comboMul);
  if(state.player.combo >= 5 && pb.combo) dmg = Math.round(dmg * (1 + pb.combo));
  
  var fs = getPassiveValue('firstStrike');
  if(fs > 0 && state.player.turnCount === 1) dmg = Math.round(dmg * (1 + fs));
  
  var cc = 0.06 + (cd.crit || 0) + pb.crit + ((state.permanentBoosts && state.permanentBoosts.crit) || 0);
  var isCrit = Math.random() < cc;
  if(activeEffects.gcrit) { isCrit = true; activeEffects.gcrit = false; }
  if(activeEffects.berserk) dmg = Math.round(dmg * 2);
  
  if(isCrit) {
    dmg = Math.round(dmg * ((cd.cmul || 3) + getPassiveValue('critDmg') + ((state.permanentBoosts && state.permanentBoosts.cmul) || 0)));
    Audio.sfx.crit();
    var be = $('bEmoji'); if(be) { be.classList.add('crit'); schedule(() => be.classList.remove('crit'), 500); }
    screenShake();
  } else {
    var be2 = $('bEmoji'); if(be2) { be2.classList.add('hit'); schedule(() => be2.classList.remove('hit'), 400); }
  }
  
  // Execute passive
  var ex = getPassiveValue('execute');
  if(ex > 0 && state.player.bossHp > 0) {
    var pct = state.player.bossHp / state.player.bossMaxHp * 100;
    if(pct < ex * 100) dmg = Math.round(state.player.bossHp);
  }
  
  // Multi Hit
  var mh = getPassiveValue('multiHit');
  var hits = 1;
  if(mh > 0 && Math.random() < mh) hits = 2;
  for(var i = 0; i < hits; i++) state.player.bossHp = Math.max(0, state.player.bossHp - dmg);
  
  // Lifesteal
  var ls = getPassiveValue('lifesteal');
  if(ls > 0) {
    var hl = Math.round(dmg * ls);
    if(hl > 0) {
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + hl);
      floatText(window.innerWidth / 2 - 80, window.innerHeight * 0.4, '+' + hl, 'heal');
    }
  }
  
  // HP Regen
  var hr = getPassiveValue('hpRegen');
  if(hr > 0) state.player.hp = Math.min(state.player.maxHp, state.player.hp + hr);
  
  // Stun
  var st = getPassiveValue('stunChance');
  if(st > 0 && Math.random() < st) {
    activeEffects.bossStun = true;
    floatText(window.innerWidth / 2, window.innerHeight * 0.3, '💫 สตัน', 'heal');
  }
  
  var gold = Math.round((12 + state.player.combo * 3 + state.player.lv * 3 + (isCrit ? 5 : 0)) * getGoldMul());
  state.player.gold += gold;
  state.player.score += Math.round(30 + state.player.combo * 5);
  
  var bx = window.innerWidth / 2 + 80, by = window.innerHeight * 0.35;
  if(isCrit) {
    floatText(bx, by, '💥' + dmg + (hits > 1 ? 'x' + hits : ''), 'critdmg');
    Particles.burst(bx, by, {count: 30, speed: 6});
  } else {
    floatText(bx, by, '-' + dmg + (hits > 1 ? 'x' + hits : ''), 'dmg');
    Particles.burst(bx, by, {count: 14, speed: 4});
  }
  floatText(bx, by + 30, '+' + gold + '🪙', 'gold');
  Audio.sfx.gold();
  
  var fb = $('fbMsg');
  if(fb) { fb.textContent = '✅ DMG ' + dmg + (hits > 1 ? 'x' + hits : '') + (isCrit ? ' 💥CRIT' : '') + ' +' + gold + '🪙'; fb.style.color = 'var(--ng)'; }
  
  updateBattleUI();
  Save.write(state);
  
  if(state.player.bossHp <= 0) {
    schedule(endBattle, 700);
  } else if(activeEffects.bossStun) {
    activeEffects.bossStun = false;
    schedule(nextQuestion, 850);
  } else {
    schedule(nextQuestion, 850);
  }
}

function handleWrong(timeUp) {
  if(battleEnded || currentScreen !== 'battle') return;
  Audio.sfx.wrong();
  
  var ck = getPassiveValue('comboKeep');
  if(ck > 0 && Math.random() < ck) {
    floatText(window.innerWidth / 2, window.innerHeight * 0.3, '🔥 รักษาคอมโบ', 'heal');
  } else {
    state.player.combo = 0;
  }
  
  state.player.tw++;
  var ch = state.player.ch;
  if(!state.stats[ch]) state.stats[ch] = {correct: 0, wrong: 0};
  state.stats[ch].wrong++;
  
  var dmg = 8 + state.player.lv * 2 + (timeUp ? 6 : 0);
  var blocked = false;
  
  if(activeEffects.dodge) {
    activeEffects.dodge = false; dmg = 0; blocked = true;
  } else if(state.player.shield) {
    state.player.shield = false; dmg = 0; blocked = true;
  } else if(state.inv.sh > 0 && Math.random() < state.inv.sh * 0.025) {
    dmg = 0; blocked = true;
  }
  
  if(!blocked) {
    state.player.hp = Math.max(0, state.player.hp - dmg);
    Audio.sfx.hit();
    screenShake();
    Particles.burst(window.innerWidth / 2 - 80, window.innerHeight * 0.35, {count: 12, speed: 3, colors: ['#ff006e', '#ff4b2b']});
  }
  
  var fb = $('fbMsg');
  if(fb) {
    fb.textContent = blocked ? '🛡️ ป้องกัน!' : ('❌ ผิด! เฉลย: ' + currentQuest.a + ' -' + dmg + 'HP');
    fb.style.color = blocked ? 'var(--nb)' : 'var(--np)';
  }
  
  updateBattleUI();
  Save.write(state);
  
  if(state.player.hp <= 0) {
    schedule(endBattle, blocked ? 700 : 900);
    return;
  }
  
  schedule(nextQuestion, blocked ? 900 : 1400);
}

function screenShake() {
  var s = $('battleScene'); if(!s) return;
  s.classList.remove('sh'); void s.offsetWidth; s.classList.add('sh');
  setTimeout(() => { try { s.classList.remove('sh'); } catch(e) {} }, 500);
}

function useSkill(slot) {
  if(battleEnded || currentScreen !== 'battle') return;
  var cd = getClass();
  var skillId = cd.skills[slot === 's1' ? 0 : 1];
  var skill = SKILLS[skillId];
  if(!skill) return;
  
  var now = Date.now();
  if(skillCD[slot] > now) return;
  
  var freeMana = getPassiveValue('mana');
  var cost = skill.cost;
  if(freeMana > 0 && Math.random() < freeMana) {
    cost = 0;
    floatText(window.innerWidth / 2, window.innerHeight * 0.3, '💧 ฟรี!', 'heal');
  }
  
  if(state.player.gold < cost) { Audio.sfx.err(); return; }
  state.player.gold -= cost;
  skillCD[slot] = now + skill.cd * 1000;
  
  Audio.sfx.skill();
  
  switch(skill.type) {
    case 'dmg':
      var d1 = Math.round(30 * (skill.mul || 2) * getWeaponMul());
      state.player.bossHp = Math.max(0, state.player.bossHp - d1);
      floatText(window.innerWidth / 2 + 80, window.innerHeight * 0.35, '⚔️' + d1, 'critdmg');
      break;
    case 'gcrit':
      activeEffects.gcrit = true;
      floatText(window.innerWidth / 2, window.innerHeight * 0.35, '✨ คริติคอล!', 'heal');
      break;
    case 'shield':
      state.player.shield = true;
      floatText(window.innerWidth / 2, window.innerHeight * 0.35, '🛡️ เกราะ', 'heal');
      break;
    case 'heal':
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + (skill.heal || 30));
      floatText(window.innerWidth / 2, window.innerHeight * 0.35, '💚+' + skill.heal, 'heal');
      break;
    case 'dmgheal':
      state.player.bossHp = Math.max(0, state.player.bossHp - Math.round(30 * (skill.mul || 2)));
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + (skill.heal || 30));
      break;
    case 'shieldheal':
      state.player.shield = true;
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + (skill.heal || 25));
      break;
    case 'dodge':
      activeEffects.dodge = true;
      break;
    case 'drain':
      var d2 = Math.round(30 * (skill.mul || 2));
      state.player.bossHp = Math.max(0, state.player.bossHp - d2);
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + Math.round(d2 * (skill.healPct || 0.5)));
      break;
    case 'berserk':
      activeEffects.berserk = true;
      break;
    case 'cboost':
      state.player.combo += (skill.comboAdd || 2);
      break;
  }
  
  updateBattleUI();
  updateSkillBtns();
  Save.write(state);
  if(state.player.bossHp <= 0) schedule(endBattle, 600);
}

function skipQuestion() {
  if(battleEnded || currentScreen !== 'battle') return;
  if(battleTimer) clearInterval(battleTimer);
  state.player.hp = Math.max(0, state.player.hp - 8);
  state.player.combo = 0;
  updateBattleUI();
  if(state.player.hp <= 0) endBattle(); else nextQuestion();
}

function endBattle() {
  if(battleEnded) return;
  battleEnded = true;
  clearTO();
  if(skillTick) clearInterval(skillTick);
  if(battleTimer) clearInterval(battleTimer);
  Audio.stopMusic();
  hideNumpad();
  isSubmitting = true;
  
  if(state.player.bossHp <= 0) {
    Audio.sfx.win();
    var gold = Math.round((35 + state.player.lv * 25) * getGoldMul());
    state.player.gold += gold;
    state.player.score += Math.round(100 + state.player.lv * 50);
    
    var ch = state.player.ch, lv = state.player.lv;
    if(!state.completed[ch]) state.completed[ch] = [];
    if(state.completed[ch].indexOf(lv) < 0) state.completed[ch].push(lv);
    if(lv === 5 && state.bossKills.indexOf(ch) < 0) state.bossKills.push(ch);
    
    addExp(lv === 5 ? 80 : 25);
    Particles.burst(window.innerWidth / 2, window.innerHeight / 2, {count: 60, speed: 8});
    Save.write(state);
    
    showModal('🎉 ชนะ!', `<div class="tc"><div style="font-size:56px">🏆</div><div>+${gold}🪙</div></div>`, [
      {label: 'เยี่ยม!', cls: 'btn-g', action: "closeModal();go('chapters')"}
    ]);
  } else {
    Audio.sfx.lose();
    state.player.gold = Math.max(0, state.player.gold - 10);
    Save.write(state);
    showModal('💀 พ่ายแพ้', `<div class="tc"><div style="font-size:56px">💀</div><div>-10🪙</div></div>`, [
      {label: 'ลองใหม่', cls: 'btn-r', action: "closeModal();go('chapters')"}
    ]);
  }
}

function fleeBattle() {
  if(battleTimer) clearInterval(battleTimer);
  if(skillTick) clearInterval(skillTick);
  battleSession++;
  battleEnded = true;
  Audio.stopMusic();
  state.player.gold = Math.max(0, state.player.gold - 10);
  Save.write(state);
  go('chapters');
}

function addExp(amount) {
  state.player.exp += amount;
  var need = state.player.plv * 80 + state.player.rebirth * 40;
  var safety = 0;
  while(state.player.exp >= need && safety < 100) {
    safety++;
    state.player.exp -= need;
    state.player.plv++;
    state.player.maxHp = getMaxHp();
    state.player.hp = state.player.maxHp;
    state.player.skillPoints = (state.player.skillPoints || 0) + 1;
    need = state.player.plv * 80 + state.player.rebirth * 40;
    Audio.sfx.level();
    floatText(window.innerWidth / 2, window.innerHeight * 0.35, '⭐ LV UP +1SP', 'heal');
  }
}

function startBattle(ch, lv) {
  state.player.ch = ch;
  state.player.lv = lv;
  state.player.maxHp = getMaxHp();
  state.player.hp = state.player.maxHp;
  go('battle');
}

/* ---------- 4. BOOT SEQUENCE ---------- */
function bootGame() {
  var loaded = Save.load();
  if(loaded) state = loaded;
  state.player.maxHp = getMaxHp();
  if(state.player.hp > state.player.maxHp) state.player.hp = state.player.maxHp;

  Particles.start();
  Audio.init();
  Audio.setEnabled(state.soundOn !== false);

  var soundToggle = $('soundToggle');
  if(soundToggle) {
    soundToggle.textContent = state.soundOn !== false ? '🔊' : '🔇';
    soundToggle.onclick = () => {
      state.soundOn = !state.soundOn;
      Audio.setEnabled(state.soundOn);
      if(state.soundOn) { Audio.resume(); Audio.sfx.click(); }
      soundToggle.textContent = state.soundOn ? '🔊' : '🔇';
      Save.write(state);
    };
  }

  var ov = $('startOverlay'), sb = $('startBtn');
  if(sb && ov) {
    sb.onclick = () => {
      try { Audio.resume(); Audio.sfx.win(); } catch(e) {}
      Particles.burst(window.innerWidth / 2, window.innerHeight / 2, {count: 50, speed: 7, colors: ['#00f0ff', '#39ff14', '#ffe600', '#ff006e', '#b537f2']});
      ov.classList.add('hide');
      setTimeout(() => { try { ov.remove(); } catch(e) {} }, 500);
      setTimeout(() => { if(state.soundOn) Audio.startMusic(100); }, 300);
      go('menu');
    };
  }

  setInterval(() => Save.write(state), 15000);

  document.addEventListener('keydown', e => {
    var inp = $('ansInp');
    if(inp && !inp.disabled && document.activeElement === inp && e.key === 'Enter') {
      e.preventDefault(); submitAnswer();
    }
  });
}

// Start
bootGame();
</script>
<script>
"use strict";
/* ============================================================
   EMERGENCY PATCH: HELPER FUNCTIONS & FIXES
   ============================================================ */

// 1. Helper Functions ที่หายไป
function getClass() {
  return BaseClasses[state.pclass] || AdvanceClasses[state.pclass] || BaseClasses.warrior;
}

function getPetBonus() {
  if(!state.epet || !Pets[state.epet]) return {dmg:0, crit:0, combo:0};
  var p = Pets[state.epet], b = {dmg:0, crit:0, combo:0};

  else if(p.bonus === 'all') { b.dmg = p.amt; b.crit = p.amt; b.combo = p.amt; }

function getTotalPassive(pid) {
  var t = 0, cd = getClass();
  if(cd.passives && cd.passives[pid]) t += cd.passives[pid];
  for(var slot in EQUIP) {

  var def = PASSIVES[pid];

      Audio.sfx.correct(); cmpState.score += 10; state.player.gold += 15; Save.write(state);
      cmpState.round++;
      if(cmpState.round > cmpState.max) { showModal('🏆 จบ!', `<div class="tc">คะแนน: ${cmpState.score}</div>`, [{label:'กลับ', cls:'btn-g', action:"closeModal();go('modes')"}]); cmpState = null; }
      else { cmpState.cur = genCmp(); renderCmp(); }
    } else { Audio.sfx.wrong(); floatText(window.innerWidth/2, window.innerHeight/2, '❌ ต้องเป็น ' + correct, 'critdmg'); }
  };

  /* ---------- 7. REBIRTH FIX ---------- */
  window.doRebirth = function() {
    var ab = state.bossKills.length >= 10;
    var rg = 15000 + state.player.rebirth * 10000;
    var rl = 25 + state.player.rebirth * 10;
    if(!(ab && state.player.gold >= rg && state.player.plv >= rl)) return;
    showModal('⚠️ ยืนยันเกิดใหม่?', '<div class="tc">รีเซ็ตเลเวล, เงิน, ด่านทั้งหมด<br>แลกกับ +25 HP ถาวร</div>', [
      {label:'❌ ยกเลิก', cls:'btn-o', action:'closeModal()'},
      {label:'💀 ยืนยัน', cls:'btn-r', action:'confirmRebirth()'}
    ]);
  };
  window.confirmRebirth = function() {
    closeModal();
    var cost = 15000 + state.player.rebirth * 10000;
    state.player.gold -= cost;
    state.player.rebirth++;
    state.player.rbonus = state.player.rebirth;
    state.player.plv = 1; state.player.exp = 0; state.player.score = Math.round(state.player.score * 0.3);
    state.player.ch = 1; state.player.lv = 1; state.completed = {}; state.bossKills = [];
    state.player.maxHp = window.getMaxHp(); state.player.hp = state.player.maxHp;
    Audio.sfx.level();
    Save.write(state);
    showModal('🌟 สำเร็จ!', `<div class="tc"><div style="font-size:56px">🌟</div><div>Rebirth ระดับ ${state.player.rebirth}</div></div>`, [{label:'ตกลง', cls:'btn-g', action:"closeModal();go('menu')"}]);
  };

  /* ---------- 8. TAB BAR WRAPPER FOR NEW SCREENS ---------- */
  var _oldGo = window.go;
  window.go = function(screen) {
    if(screen === 'duel') { window.startDuel(); return; }
    if(screen === 'target24') { window.startTarget24(); return; }
    if(screen === 'pattern') { window.startPattern(); return; }
    if(screen === 'greaterLesser') { window.startGreaterLesser(); return; }
    _oldGo(screen);
  };

  console.log('✅ PART 6: Minigames, Rebirth & Fixes Loaded!');
})();
</script>
</body>
