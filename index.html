<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Math Quest ม.2 — Ultimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--nb:#00f0ff;--np:#ff006e;--nu:#b537f2;--ng:#39ff14;--ny:#ffe600;--no:#ff8c00;--bg:#0a0a1a;--cb:rgba(15,15,35,0.92);--g:rgba(255,255,255,0.06);--gb:rgba(255,255,255,0.14);--tb:#fff;--td:#b0b0d0;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior:none;}
body{font-family:'Kanit',sans-serif;background:var(--bg);background-image:radial-gradient(ellipse at 20% 10%,rgba(0,240,255,0.08) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(255,0,110,0.07) 0%,transparent 55%),radial-gradient(ellipse at 50% 90%,rgba(181,55,242,0.08) 0%,transparent 55%);color:var(--tb);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:stretch;padding:0;overflow:hidden;position:relative;user-select:none;-webkit-user-select:none;}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{width:100%;max-width:820px;position:relative;z-index:2;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--st);padding-bottom:var(--sb);}
.gw{background:var(--cb);overflow:hidden;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);display:flex;flex-direction:column;flex:1;min-height:0;border-bottom:1px solid var(--gb);}
@media(min-width:640px){body{padding:12px;align-items:center;}.app{height:min(100dvh - 24px,900px);}.gw{border-radius:22px;border:1px solid var(--gb);box-shadow:0 0 30px rgba(0,240,255,0.18),0 20px 60px rgba(0,0,0,0.7);}}
.gh{padding:8px 14px;text-align:center;background:rgba(0,240,255,0.04);border-bottom:1px solid var(--gb);flex-shrink:0;position:relative;}
.br{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.cb{display:inline-block;background:rgba(255,0,110,0.18);border:1px solid var(--np);padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;color:var(--np);letter-spacing:1.5px;}
.stg{background:transparent;border:1px solid var(--gb);color:var(--tb);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;}
.gt{font-family:'Orbitron',sans-serif;font-size:1.35em;font-weight:900;background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;line-height:1.15;margin-top:2px;}
.sb{color:var(--td);font-size:9px;letter-spacing:1px;}
.gc{padding:12px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;}
.gc::-webkit-scrollbar{width:4px;}
.gc::-webkit-scrollbar-thumb{background:var(--nu);border-radius:3px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:12px;cursor:pointer;transition:transform 0.12s,box-shadow 0.2s,filter 0.2s;letter-spacing:0.4px;text-align:center;color:#fff;background:linear-gradient(135deg,#00c6ff,#0072ff);box-shadow:0 4px 15px rgba(0,114,255,0.28);touch-action:manipulation;position:relative;}
.btn:active{transform:scale(0.96);filter:brightness(0.95);}
.btn:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.btn-g{background:linear-gradient(135deg,#00b09b,#96c93d);box-shadow:0 4px 15px rgba(0,176,155,0.28);}
.btn-r{background:linear-gradient(135deg,#ff416c,#ff4b2b);box-shadow:0 4px 15px rgba(255,65,108,0.28);}
.btn-y{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;box-shadow:0 4px 15px rgba(247,151,30,0.28);}
.btn-gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;box-shadow:0 4px 15px rgba(255,215,0,0.28);}
.btn-p{background:linear-gradient(135deg,#ff006e,#ff4b8b);box-shadow:0 4px 15px rgba(255,0,110,0.28);}
.btn-pur{background:linear-gradient(135deg,#b537f2,#7b2ff7);box-shadow:0 4px 15px rgba(181,55,242,0.28);}
.btn-o{background:transparent;border:2px solid var(--nb);color:var(--nb);box-shadow:none;}
.btn-o:active{background:rgba(0,240,255,0.12);}
.btn-sm{min-height:42px;padding:8px 12px;font-size:12px;border-radius:10px;}
.btn-xs{min-height:36px;padding:5px 9px;font-size:11px;border-radius:8px;}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,0.4);border-radius:12px;margin-bottom:8px;font-size:12px;color:#e0e0f0;flex-wrap:wrap;gap:4px;border:1px solid var(--gb);}
.sv{font-weight:700;color:var(--nb);}
.sg{font-weight:700;color:var(--ny);}
.bdg{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:0.4px;}
.bdg-gold{background:rgba(255,230,0,0.15);color:var(--ny);border:1px solid rgba(255,230,0,0.4);}
.bdg-g{background:rgba(57,255,20,0.15);color:var(--ng);border:1px solid rgba(57,255,20,0.4);}
.bdg-b{background:rgba(0,240,255,0.15);color:var(--nb);border:1px solid rgba(0,240,255,0.4);}
.bdg-r{background:rgba(255,0,110,0.15);color:var(--np);border:1px solid rgba(255,0,110,0.4);}
.bdg-p{background:rgba(181,55,242,0.15);color:var(--nu);border:1px solid rgba(181,55,242,0.4);}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.ccard{background:var(--g);border:2px solid var(--gb);border-radius:14px;padding:12px 10px;cursor:pointer;transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;text-align:center;position:relative;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ccard:active{transform:scale(0.97);}
.ccard.sel{border-color:var(--ng);background:rgba(57,255,20,0.08);box-shadow:0 0 18px rgba(57,255,20,0.25);}
.ccard.lk{opacity:0.55;}
.cemoji{font-size:40px;display:block;margin-bottom:2px;line-height:1;}
.cname{font-weight:700;color:var(--tb);font-size:14px;}
.cdesc{font-size:10px;color:var(--td);margin-top:4px;line-height:1.35;}
.chc{margin-bottom:8px;}
.chh{background:var(--g);border:1px solid var(--gb);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all 0.2s;}
.chh:active{transform:scale(0.98);border-color:var(--nb);}
.chi{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);flex-shrink:0;}
.chn{flex:1;min-width:0;}
.chname{font-weight:600;color:var(--tb);font-size:13px;}
.chprog{font-size:10px;color:var(--td);}
.llist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 0 0 50px;}
.lbtn{min-height:44px;padding:6px 4px;border-radius:9px;border:1px solid var(--gb);background:rgba(0,0,0,0.35);color:var(--tb);cursor:pointer;font-size:11px;transition:all 0.2s;text-align:center;font-family:'Kanit',sans-serif;font-weight:600;}
.lbtn.done{border-color:var(--ng);background:rgba(57,255,20,0.12);}
.bts{background:rgba(0,0,0,0.5);border-radius:14px;padding:12px;border:1px solid var(--gb);margin-bottom:10px;text-align:center;position:relative;overflow:hidden;}
.bts.sh{animation:sk 0.4s ease;}
@keyframes sk{0%,100%{transform:translate(0,0);}20%{transform:translate(-6px,3px);}40%{transform:translate(6px,-3px);}60%{transform:translate(-4px,-2px);}80%{transform:translate(4px,2px);}}
.ed{font-size:54px;display:inline-block;transition:transform 0.3s;line-height:1;user-select:none;}
.ed.hit{animation:eh 0.4s ease;}
.ed.crit{animation:ec 0.5s ease-out;}
@keyframes eh{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes ec{0%{transform:scale(1);}30%{transform:scale(1.6) rotate(-10deg);}60%{transform:scale(1.15) rotate(5deg);}100%{transform:scale(1) rotate(0);}}
.crow{display:flex;align-items:center;justify-content:space-around;gap:8px;flex-wrap:wrap;}
.cbat{text-align:center;min-width:95px;flex:1;max-width:130px;}
.cbname{color:var(--tb);font-weight:600;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cbname.boss{color:var(--np);}
.hpo{background:#1a1a2e;border-radius:7px;height:10px;overflow:hidden;border:1px solid var(--gb);margin-top:4px;width:100%;}
.hpi{height:100%;border-radius:7px;transition:width 0.4s ease;background:linear-gradient(90deg,#00f0ff,#00c6ff);box-shadow:0 0 8px rgba(0,240,255,0.5);}
.hpi.bh{background:linear-gradient(90deg,#ff006e,#ff4b2b);box-shadow:0 0 8px rgba(255,0,110,0.5);}
.hpt{font-size:10px;color:var(--td);margin-top:2px;}
.vs{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;color:var(--ny);text-shadow:0 0 12px rgba(255,230,0,0.6);}
.tbo{background:#1a1a2e;border-radius:5px;height:9px;overflow:hidden;border:1px solid var(--gb);margin-top:8px;}
.tbi{height:100%;border-radius:5px;transition:width 0.15s linear;background:linear-gradient(90deg,var(--ng),var(--ny),var(--no));}
.tbt{font-size:11px;color:var(--ny);font-weight:700;text-align:center;margin-top:3px;}
.qp{background:rgba(0,0,0,0.5);border-radius:14px;padding:14px;border:1px solid var(--gb);margin-bottom:10px;}
.qd{font-size:20px;font-weight:700;color:var(--tb);text-align:center;margin-bottom:10px;line-height:1.5;min-height:30px;word-break:break-word;}
.air{display:flex;gap:8px;}
.ai{flex:1;padding:12px 14px;font-size:16px;font-weight:600;text-align:center;border-radius:10px;border:2px solid var(--gb);background:rgba(0,0,0,0.5);color:var(--tb);outline:none;transition:border-color 0.2s,box-shadow 0.2s;font-family:'Kanit',sans-serif;min-width:0;}
.ai:focus{border-color:var(--nb);box-shadow:0 0 14px rgba(0,240,255,0.25);}
.ai:disabled{opacity:0.6;}
.ai.cf{border-color:var(--ng)!important;box-shadow:0 0 18px rgba(57,255,20,0.5)!important;background:rgba(57,255,20,0.1)!important;}
.ai.wf{border-color:var(--np)!important;box-shadow:0 0 18px rgba(255,0,110,0.5)!important;background:rgba(255,0,110,0.1)!important;}
.cdisp{text-align:center;font-weight:700;font-size:15px;margin-top:6px;min-height:20px;color:var(--ny);text-shadow:0 0 10px rgba(255,230,0,0.5);}
.fbm{font-size:12px;text-align:center;margin-top:4px;min-height:16px;color:var(--td);}
.si{background:var(--g);border:1px solid var(--gb);border-radius:12px;padding:12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.si.col{flex-direction:column;align-items:stretch;}
.gc2{background:var(--g);border:2px solid var(--ny);border-radius:16px;padding:20px;text-align:center;box-shadow:0 0 25px rgba(255,230,0,0.2);}
.gr{font-size:56px;animation:ga 0.6s ease-out;line-height:1;}
@keyframes ga{0%{transform:scale(0) rotate(180deg);opacity:0;}60%{transform:scale(1.3) rotate(-8deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
.pcard{background:var(--g);border:2px solid var(--gb);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all 0.2s;width:100%;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.pcard.eq{border-color:var(--ng);background:rgba(57,255,20,0.08);box-shadow:0 0 15px rgba(57,255,20,0.25);}
.pemoji{font-size:38px;display:block;line-height:1;}
.npc{flex-shrink:0;background:rgba(10,10,26,0.96);border-top:1px solid var(--gb);padding:8px;display:none;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);}
.npc.active{display:block;}
.npg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:560px;margin:0 auto;}
.npb{min-height:52px;padding:8px;font-size:20px;font-weight:700;font-family:'Orbitron','Kanit',sans-serif;border-radius:10px;border:1px solid var(--gb);background:rgba(0,240,255,0.08);color:var(--tb);cursor:pointer;transition:transform 0.08s,background 0.15s;touch-action:manipulation;user-select:none;}
.npb:active{transform:scale(0.94);background:rgba(0,240,255,0.25);}
.npb.op{background:rgba(181,55,242,0.15);color:var(--nu);}
.npb.submit{background:linear-gradient(135deg,var(--ng),#00b09b);color:#0a1a0a;font-size:18px;}
.npb.back{background:rgba(255,0,110,0.15);color:var(--np);font-size:18px;}
.ft{position:fixed;pointer-events:none;font-weight:900;font-family:'Orbitron','Kanit',sans-serif;z-index:500;text-shadow:0 2px 8px rgba(0,0,0,0.9),0 0 12px currentColor;animation:fu 1.1s ease-out forwards;font-size:24px;white-space:nowrap;}
.ft.crit{font-size:34px;}
.ft.miss{color:#888;font-size:20px;}
.ft.heal{color:var(--ng);}
.ft.dmg{color:var(--ny);}
.ft.critdmg{color:var(--np);}
.ft.gold{color:#ffd700;font-size:18px;}
.ft.exp{color:var(--nb);font-size:20px;}
@keyframes fu{0%{transform:translate(-50%,0) scale(0.6);opacity:0;}15%{transform:translate(-50%,-10px) scale(1.2);opacity:1;}100%{transform:translate(-50%,-90px) scale(1);opacity:0;}}
.so{position:fixed;inset:0;z-index:9000;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2a 50%,#0a1a2a 100%);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;transition:opacity 0.4s;}
.so.hide{opacity:0;pointer-events:none;}
.sc{max-width:400px;width:100%;background:var(--cb);border:2px solid var(--nb);border-radius:24px;padding:32px 24px;box-shadow:0 0 50px rgba(0,240,255,0.3);}
.slogo{font-family:'Orbitron',sans-serif;font-size:2em;font-weight:900;background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;margin-bottom:4px;}
.ssub{color:var(--td);font-size:12px;margin-bottom:20px;}
.sbtn{display:inline-block;min-height:56px;padding:14px 32px;font-size:16px;font-weight:700;border-radius:14px;border:none;background:linear-gradient(135deg,var(--ng),var(--nb));color:#0a1a0a;cursor:pointer;font-family:'Kanit',sans-serif;letter-spacing:1.5px;box-shadow:0 0 30px rgba(57,255,20,0.4);animation:pg 2s ease-in-out infinite;}
@keyframes pg{0%,100%{box-shadow:0 0 30px rgba(57,255,20,0.4);}50%{box-shadow:0 0 50px rgba(57,255,20,0.7);}}
.sf{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--td);}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:3000;padding:20px;backdrop-filter:blur(5px);animation:fi 0.25s;}
@keyframes fi{from{opacity:0;}to{opacity:1;}}
.mc{background:var(--cb);border-radius:20px;padding:22px;max-width:440px;width:100%;border:2px solid var(--nb);box-shadow:0 0 40px rgba(0,240,255,0.28);text-align:center;max-height:85vh;overflow-y:auto;}
.mt{font-size:20px;font-weight:700;margin-bottom:10px;}
.mb{font-size:14px;color:var(--td);line-height:1.55;margin-bottom:16px;text-align:left;}
.mb .step{padding:6px 10px;background:rgba(0,240,255,0.08);border-left:3px solid var(--nb);border-radius:4px;margin:6px 0;color:var(--tb);font-size:13px;}
.fr{display:flex;gap:8px;flex-wrap:wrap;}
.fc{display:flex;flex-direction:column;gap:8px;}
.tc{text-align:center;}
.ts{font-size:11px;}
.mt1{margin-top:4px;}.mt2{margin-top:8px;}.mt3{margin-top:12px;}.mt4{margin-top:16px;}
.mb2{margin-bottom:8px;}
.wf{width:100%;}
.pb{background:#1a1a2e;border-radius:5px;height:5px;overflow:hidden;margin-top:3px;}
.pbf{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--ng),var(--nb));transition:width 0.4s;}
h3{font-size:18px;margin-bottom:10px;color:var(--tb);}
.co{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:2500;padding:16px;backdrop-filter:blur(8px);}
.cpn{background:var(--cb);border:2px solid var(--nb);border-radius:18px;padding:16px;max-width:360px;width:100%;box-shadow:0 0 40px rgba(0,240,255,0.35);}
.cd2{background:rgba(0,0,0,0.75);color:var(--ng);font-family:'Orbitron',monospace;font-size:26px;font-weight:700;text-align:right;padding:12px 14px;border-radius:12px;margin-bottom:10px;min-height:56px;word-break:break-all;border:1px solid var(--gb);}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.cb2{min-height:52px;font-size:19px;font-weight:700;font-family:'Orbitron','Kanit',sans-serif;border:1px solid var(--gb);border-radius:10px;background:rgba(0,240,255,0.08);color:var(--tb);cursor:pointer;transition:transform 0.08s,background 0.15s;touch-action:manipulation;}
.cb2:active{transform:scale(0.94);background:rgba(0,240,255,0.25);}
.cb2.op{background:rgba(181,55,242,0.15);color:var(--nu);}
.cb2.eq{background:linear-gradient(135deg,var(--ng),#00b09b);color:#0a1a0a;grid-column:span 2;}
.cb2.span2{grid-column:span 2;}
.ca{display:flex;gap:6px;}
.ca .btn{flex:1;}
.cf2{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--ng),#00b09b);color:#0a1a0a;border:none;border-radius:10px;padding:6px 10px;font-family:'Kanit',sans-serif;font-weight:700;font-size:11px;cursor:pointer;z-index:10;box-shadow:0 0 12px rgba(57,255,20,0.4);}
.tp{background:rgba(0,0,0,0.5);border:1px solid var(--gb);border-radius:14px;padding:12px;margin-bottom:8px;}
.tt{text-align:center;font-family:'Orbitron',sans-serif;font-size:34px;font-weight:900;color:var(--ny);text-shadow:0 0 20px rgba(255,230,0,0.6);margin-bottom:8px;letter-spacing:2px;}
.te{background:rgba(0,0,0,0.6);border:1px dashed var(--gb);border-radius:10px;padding:10px;min-height:48px;text-align:center;font-size:18px;font-weight:700;color:var(--tb);margin-bottom:8px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;}
.es{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 6px;border-radius:6px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);font-family:'Orbitron',sans-serif;font-weight:700;}
.es.op{background:rgba(181,55,242,0.15);border-color:rgba(181,55,242,0.4);color:var(--nu);}
.es.empty{opacity:0.4;background:transparent;border-style:dashed;}
.th{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;}
.tile{aspect-ratio:1;min-height:60px;border-radius:10px;background:linear-gradient(135deg,rgba(0,240,255,0.2),rgba(181,55,242,0.15));border:2px solid var(--nb);color:var(--tb);font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s,box-shadow 0.2s,opacity 0.2s;touch-action:manipulation;}
.tile:active{transform:scale(0.92);}
.tile.used{opacity:0.3;background:rgba(0,0,0,0.3);border-color:var(--gb);cursor:not-allowed;}
.tile.coin{background:linear-gradient(135deg,rgba(255,215,0,0.3),rgba(255,170,0,0.2));border-color:var(--ny);color:var(--ny);font-size:19px;}

/* =========================================================

const Audio=(()=>{let ctx=null,mg=null,bg=null,en=true,mo=false,mt=null,ms=0;
function init(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();mg=ctx.createGain();mg.gain.value=0.85;mg.connect(ctx.destination);bg=ctx.createGain();bg.gain.value=0.22;bg.connect(mg);}catch(e){}}

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

const simplify=(n,d)=>{const g=gcd(n,d)||1;return[n/g,d/g];};
function parseFraction(s){s=String(s).trim().replace(/\s+/g,'');const m=s.match(/^(-?\d+)\/(-?\d+)$/);if(m&&parseFloat(m[2])!==0)return parseFloat(m[1])/parseFloat(m[2]);const m2=s.match(/^(-?\d+)$/);if(m2)return parseFloat(s);return null;}
function parsePair(s){const p=String(s).split(',').map(x=>x.trim());if(p.length!==2)return null;const a=parseFloat(p[0]),b=parseFloat(p[1]);if(isNaN(a)||isNaN(b))return null;return[a,b];}
function parseRadical(s){s=String(s).trim().replace(/\s+/g,'');const m=s.match(/^(-?\d*)√(\d+)$/);if(!m)return null;let c;if(m[1]===''||m[1]==='+')c=1;else if(m[1]==='-')c=-1;else c=parseFloat(m[1]);if(isNaN(c))return null;const r=parseFloat(m[2]);if(isNaN(r))return null;return{coef:c,rad:r,value:c*Math.sqrt(r)};}
function safeEval(expr){if(!expr)return null;if(/[√,]/.test(expr))return null;let js=String(expr).replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/−/g,'-');if(!/^[\d\s\+\-\*\/\.\(\)]+$/.test(js))return null;if(!/\d/.test(js))return null;if(/\*{3,}/.test(js))return null;try{const r=Function('"use strict";return ('+js+')')();if(typeof r!=='number'||!isFinite(r))return null;return r;}catch(e){return null;}}
function answersMatch(user,correct){if(user===undefined||user===null)return false;const ru=String(user).trim(),rc=String(correct).trim();if(!ru)return false;const u=ru.replace(/\s+/g,''),c=rc.replace(/\s+/g,'');const T=0.011;if(u.toLowerCase()===c.toLowerCase())return true;const ue=safeEval(u),ce=safeEval(c);if(ue!==null&&ce!==null&&Math.abs(ue-ce)<=T)return true;const un=/√/.test(u)?NaN:parseFloat(u),cn=/√/.test(c)?NaN:parseFloat(c);if(!isNaN(un)&&!isNaN(cn)&&Math.abs(un-cn)<=T)return true;const uf=parseFraction(u),cf=parseFraction(c);if(uf!==null&&cf!==null&&Math.abs(uf-cf)<=T)return true;if(uf!==null&&!isNaN(cn)&&Math.abs(uf-cn)<=T)return true;if(cf!==null&&!isNaN(un)&&Math.abs(cf-un)<=T)return true;const ur=parseRadical(u),cr=parseRadical(c);if(ur&&cr&&Math.abs(ur.value-cr.value)<=T)return true;if(ur&&!isNaN(cn)&&Math.abs(ur.value-cn)<=T)return true;if(cr&&!isNaN(un)&&Math.abs(cr.value-un)<=T)return true;if(ur&&ce!==null&&Math.abs(ur.value-ce)<=T)return true;if(cr&&ue!==null&&Math.abs(cr.value-ue)<=T)return true;const up=parsePair(u),cp=parsePair(c);if(up&&cp&&Math.abs(up[0]-cp[0])<=T&&Math.abs(up[1]-cp[1])<=T)return true;return false;}

<script>
"use strict";
/* =========================================================
   PART 4: STATE + HELPERS + UI RENDERING (menu/chapters/shop/...)
   ========================================================= */
let state=Save.defaultState();
let currentScreen='menu';
let battleSession=0;
let battleEnded=false;
let battleTimer=null;
let timerLeft=0,timerMax=30;
let skillCooldownUntil={s1:0,s2:0};
let skillUses={s1:0,s2:0};
let skillTickInterval=null;
let activeEffects={};
let currentQuest=null;
let pendingTimeouts=[];
let modalAutoAdvanceId=null;
let isSubmitting=false;
let currentDuel=null;
let currentTreasure=null;
let currentAMath=null;
let currentChess=null;
let currentPattern=null;
let currentBalance=null;
let currentCmp=null;
let current24=null;

function schedule(fn,ms){const id=setTimeout(()=>{pendingTimeouts=pendingTimeouts.filter(t=>t!==id);try{fn();}catch(e){}},ms);pendingTimeouts.push(id);return id;}
function clearPendingTimeouts(){pendingTimeouts.forEach(t=>clearTimeout(t));pendingTimeouts=[];}
function clearModalAutoAdvance(){if(modalAutoAdvanceId){clearTimeout(modalAutoAdvanceId);modalAutoAdvanceId=null;}}

const $=id=>document.getElementById(id);
const contentEl=$('gameContent');
const numpadContainer=$('numpadContainer');
const numpadGrid=$('numpadGrid');
const modalContainer=$('modalContainer');

function getClass(){return BaseClasses[state.pclass]||AdvanceClasses[state.pclass]||BaseClasses.warrior;}

function getPetBonus(){if(!state.epet||!Pets[state.epet])return{dmg:0,crit:0,combo:0};const p=Pets[state.epet];const b={dmg:0,crit:0,combo:0};if(p.bonus==='dmg')b.dmg=p.amt;else if(p.bonus==='crit')b.crit=p.amt;else if(p.bonus==='combo')b.combo=p.amt;else if(p.bonus==='gold'||p.bonus==='exp'||p.bonus==='hp'){}else if(p.bonus==='both'){b.dmg=p.amt;b.crit=p.amt;}else if(p.bonus==='all'){b.dmg=p.amt;b.crit=p.amt;b.combo=p.amt;}return b;}

function getTotalPassive(passiveId){
  let total=0;
  const cd=getClass();
  if(cd&&cd.passives&&cd.passives[passiveId])total+=cd.passives[passiveId];
  if(state.epet&&Pets[state.epet]&&Pets[state.epet].special&&Pets[state.epet].special[passiveId])total+=Pets[state.epet].special[passiveId];
  for(const slot in EQUIPMENT_DEF){const def=EQUIPMENT_DEF[slot];const lv=(state.inv&&state.inv[slot])||0;
    if(def.passives)def.passives.forEach(p=>{if(lv>=p[0]&&p[1]===passiveId)total+=1;});}
  if(state.skillTree&&state.skillTree[passiveId])total+=state.skillTree[passiveId];
  if(state.rareItems)state.rareItems.forEach(itemId=>{const it=SHOP_ITEMS[itemId];if(it&&it.passive===passiveId)total+=1;});
  const def=PASSIVES[passiveId];
  return Math.min(total,def?def.max:99);
}
function getPassiveValue(passiveId){const lv=getTotalPassive(passiveId);const def=PASSIVES[passiveId];if(!def||lv<=0)return 0;return lv*def.per;}
function getPassiveDesc(passiveId){const lv=getTotalPassive(passiveId);const def=PASSIVES[passiveId];if(!def)return'';const val=(lv*def.per).toFixed(def.per<1?2:0);return def.desc.replace('{v}',val);}
function getClassSkill(slot){const cd=getClass();if(cd.skills&&Array.isArray(cd.skills)){const skillId=cd.skills[slot==='s1'?0:1];return SKILL_LIBRARY[skillId]||null;}if(cd[slot])return cd[slot];return null;}

function getSpecialBonus(){const b={treasureTime:0,treasureCoins:0,amathScore:1,amathRack:0,chessBonus:0};const cd=getClass();
if(cd&&cd.special){if(cd.special.treasureTime)b.treasureTime+=cd.special.treasureTime;if(cd.special.treasureCoins)b.treasureCoins+=cd.special.treasureCoins;if(cd.special.amathScore)b.amathScore*=cd.special.amathScore;if(cd.special.amathRack)b.amathRack+=cd.special.amathRack;if(cd.special.chessBonus)b.chessBonus+=cd.special.chessBonus;}
if(state.epet&&Pets[state.epet]&&Pets[state.epet].special){const ps=Pets[state.epet].special;if(ps.treasureTime)b.treasureTime+=ps.treasureTime;if(ps.treasureCoins)b.treasureCoins+=ps.treasureCoins;if(ps.amathScore)b.amathScore*=ps.amathScore;if(ps.amathRack)b.amathRack+=ps.amathRack;if(ps.chessBonus)b.chessBonus+=ps.chessBonus;}
b.treasureTime+=getPassiveValue('timeBonus')*2;
return b;}

function getMaxHp(){
  let extra=0;
  const p=state.epet&&Pets[state.epet];
  if(p&&p.bonus==='hp')extra=p.amt;
  const boostHp=(state.permanentBoosts&&state.permanentBoosts.hp)||0;
  return 100+(getClass().hp||0)+(state.player.plv-1)*5+state.inv.s*12+state.inv.h*5+state.inv.a*8+state.inv.p*6+state.player.rbonus*25+extra+boostHp;
}
function getWeaponMul(){return 1+state.inv.w*0.20;}
function getGoldMul(){let m=1+getPassiveValue('goldBonus');if(state.epet&&Pets[state.epet]&&Pets[state.epet].bonus==='gold')m+=Pets[state.epet].amt;if(state.permanentBoosts&&state.permanentBoosts.gold)m+=state.permanentBoosts.gold;return m;}
function getExpMul(){let m=1+getPassiveValue('expBonus');if(state.epet&&Pets[state.epet]&&Pets[state.epet].bonus==='exp')m+=Pets[state.epet].amt;if(state.permanentBoosts&&state.permanentBoosts.exp)m+=state.permanentBoosts.exp;return m;}
function getTimeBonusSec(){let t=getPassiveValue('timeBonus');if(state.permanentBoosts&&state.permanentBoosts.time)t+=state.permanentBoosts.time;return t;}

function buildNumpad(){const keys=[{k:'7',t:'7'},{k:'8',t:'8'},{k:'9',t:'9'},{k:'/',t:'÷',cls:'op',insert:'/'},{k:'√',t:'√',cls:'op',insert:'√'},{k:'4',t:'4'},{k:'5',t:'5'},{k:'6',t:'6'},{k:'*',t:'×',cls:'op',insert:'×'},{k:'^',t:'^',cls:'op',insert:'^'},{k:'1',t:'1'},{k:'2',t:'2'},{k:'3',t:'3'},{k:'-',t:'−',cls:'op',insert:'-'},{k:'+',t:'+',cls:'op',insert:'+'},{k:'0',t:'0'},{k:'.',t:'.',insert:'.'},{k:',',t:',',cls:'op',insert:','},{k:'back',t:'⌫',cls:'back'},{k:'submit',t:'✓',cls:'submit'}];numpadGrid.innerHTML=keys.map(k=>'<button class="npb '+(k.cls||'')+'" data-key="'+k.k+'" data-insert="'+(k.insert||k.k)+'">'+k.t+'</button>').join('');}
buildNumpad();
numpadGrid.addEventListener('click',e=>{const b=e.target.closest('.npb');if(!b||b.disabled)return;const key=b.dataset.key,insert=b.dataset.insert||key,inp=$('ansInp');if(!inp||inp.disabled)return;Audio.resume();if(key==='back')inp.value=inp.value.slice(0,-1);else if(key==='submit'){submitAnswer();return;}else{if(inp.value.length<24)inp.value+=insert;}Audio.sfx.click();updateNumpadSubmitState();},{passive:false});
function updateNumpadSubmitState(){const inp=$('ansInp');if(!inp)return;const btn=numpadGrid?numpadGrid.querySelector('[data-key="submit"]'):null;if(!btn)return;btn.disabled=!inp.value.trim()||inp.disabled;}
function showNumpad(s){numpadContainer.classList.toggle('active',!!s);}
function hideNumpad(){numpadContainer.classList.remove('active');}

function showModal(title,body,buttons){modalContainer.innerHTML='<div class="mo"><div class="mc"><div class="mt">'+title+'</div><div class="mb">'+body+'</div><div class="fc">'+(buttons||[{label:'ตกลง',cls:'btn',action:'closeModal()'}]).map(b=>'<button class="btn '+(b.cls||'')+' wf" onclick="'+(b.action||'closeModal()')+'">'+b.label+'</button>').join('')+'</div></div></div>';}
function closeModal(){modalContainer.innerHTML='';}

function go(screen){
  if(battleTimer){clearInterval(battleTimer);battleTimer=null;}
  if(skillTickInterval){clearInterval(skillTickInterval);skillTickInterval=null;}
  clearPendingTimeouts();clearModalAutoAdvance();closeModal();Audio.stopMusic();hideNumpad();isSubmitting=false;currentScreen=screen;
  if(screen!=='battle'){battleSession++;battleEnded=false;}
  try{switch(screen){
    case'menu':renderMenu();break;
    case'chapters':renderChapters();break;
    case'battle':renderBattle();break;
    case'inventory':renderInventory();break;
    case'shop':renderShop('consumable');break;
    case'petshop':renderPetShop();break;
    case'gachaPet':renderGacha('pet');break;
    case'gachaClass':renderGacha('class');break;
    case'upgrade':renderUpgrade();break;
    case'class':renderClassSelect();break;
    case'classDetail':renderClassDetail();break;
    case'petDetail':renderPetDetail();break;
    case'equipDetail':renderEquipDetail();break;
    case'skillTree':renderSkillTree();break;
    case'rebirth':renderRebirth();break;
    case'stats':renderStats();break;
    case'settings':renderSettings();break;
    case'modes':renderModeMenu();break;
    case'treasureSetup':renderTreasureSetup();break;
    case'treasure':if(currentTreasure)renderTreasure();break;
    case'amath':if(currentAMath)renderAMath();break;
    case'chess':if(currentChess)renderChess();break;
    case'pattern':if(currentPattern)renderPattern();break;
    case'balance':if(currentBalance)renderBalance();break;
    case'greaterLesser':if(currentCmp)renderGreaterLesser();break;
    case'target24':if(current24)renderTarget24();break;
    case'duel':if(currentDuel)renderDuel();break;
    default:renderMenu();
  }}catch(e){console.error('render error:',e);contentEl.innerHTML='<div class="tc" style="padding:30px">เกิดข้อผิดพลาด <button class="btn mt3" onclick="go(\'menu\')">กลับเมนู</button></div>';}
  contentEl.scrollTop=0;
}

function renderMenu(){
  const cd=getClass();
  const petInfo=state.epet&&Pets[state.epet]?Pets[state.epet].emoji+' '+Pets[state.epet].name:'ไม่มี';
  const totalCompleted=Object.values(state.completed).reduce((a,arr)=>a+((arr&&arr.length)||0),0);
  const wrongCount=(state.wrongLog||[]).length;
  contentEl.innerHTML=
    '<div class="tc mb2" style="font-size:14px"><b>'+cd.emoji+' '+cd.name+'</b> <span class="bdg bdg-b">เกิดใหม่ '+state.player.rebirth+'</span>'+(state.player.skillPoints>0?' <span class="bdg bdg-gold">SP '+state.player.skillPoints+'</span>':'')+'</div>'+
    '<div class="sbar"><span>⭐ <span class="sv">'+state.player.score+'</span></span><span>🪙 <span class="sg">'+state.player.gold+'</span></span><span>📊 Lv.<span class="sv">'+state.player.plv+'</span></span><span>🔥 <span class="sv">'+state.player.maxCombo+'</span></span></div>'+
    '<div class="sbar"><span>🎯 '+totalCompleted+'/50 ด่าน</span><span>👑 '+state.bossKills.length+'/10 บอส</span><span>🐾 '+petInfo+'</span></div>'+
    '<div class="pb mb2"><div class="pbf" style="width:'+(totalCompleted/50)*100+'%"></div></div>'+
    '<button class="btn btn-g wf" onclick="go(\'chapters\')">⚔️ ผจญภัย</button>'+
    '<button class="btn btn-pur wf mt2" onclick="go(\'modes\')">🎮 โหมดพิเศษ (8)</button>'+
    '<button class="btn btn-y wf mt2" onclick="go(\'skillTree\')">🌟 ต้นไม้ทักษะ'+(state.player.skillPoints>0?' ('+state.player.skillPoints+' SP)':'')+'</button>'+
    '<button class="btn btn-o wf mt2" onclick="go(\'inventory\')">🎒 กระเป๋า</button>'+
    '<button class="btn btn-y wf mt2" onclick="go(\'shop\')">🛒 ร้านค้า</button>'+
    '<button class="btn btn-o wf mt2" onclick="go(\'petshop\')">🐾 ร้านสัตว์เลี้ยง</button>'+
    '<button class="btn btn-gold wf mt2" onclick="go(\'gachaPet\')">🎰 กาชาสัตว์เลี้ยง (200🪙)</button>'+
    '<button class="btn btn-p wf mt2" onclick="go(\'gachaClass\')">💎 กาชาคลาส (500🪙)</button>'+
    '<button class="btn btn-o wf mt2" onclick="go(\'upgrade\')">🔧 อัพเกรดอุปกรณ์</button>'+
    '<button class="btn btn-o wf mt2" onclick="go(\'class\')">🔄 เปลี่ยนคลาส</button>'+
    '<button class="btn btn-o wf mt2" onclick="go(\'stats\')">📈 สถิติ (ผิด:'+wrongCount+')</button>'+
    '<button class="btn btn-r wf mt2" onclick="go(\'rebirth\')">💀 เกิดใหม่</button>'+
    '<button class="btn btn-o wf mt2" onclick="go(\'settings\')">⚙️ ตั้งค่า</button>';
}

function renderChapters(){let h='<h3>⚔️ แผนที่การเรียนรู้</h3>';Chapters.forEach(ch=>{const done=(state.completed[ch.id]||[]).length;h+='<div class="chc"><div class="chh" onclick="toggleChapter('+ch.id+')"><div class="chi" style="border-color:'+ch.color+';color:'+ch.color+'">'+ch.icon+'</div><div class="chn"><div class="chname">บทที่ '+ch.id+': '+ch.name+'</div><div class="chprog">'+done+'/5 ด่าน · บอส '+ch.boss+'</div><div class="pb"><div class="pbf" style="width:'+(done/5)*100+'%"></div></div></div></div><div class="llist" id="ch-'+ch.id+'" style="display:none">'+[1,2,3,4,5].map(l=>{const c=isCompleted(ch.id,l);return '<button class="lbtn '+(c?'done':'')+'" onclick="event.stopPropagation();startBattle('+ch.id+','+l+')">ด.'+l+(l===5?'👑':'')+'</button>';}).join('')+'</div></div>';});h+='<button class="btn btn-o wf mt3" onclick="go(\'menu\')">🔙 กลับ</button>';contentEl.innerHTML=h;}
function toggleChapter(id){const el=$('ch-'+id);if(el)el.style.display=el.style.display==='none'?'grid':'none';}
function isCompleted(ch,lv){return(state.completed[ch]||[]).includes(lv);}

/* ---------- SHOP (tabs) ---------- */
function renderShop(tab){
  tab=tab||'consumable';
  const cats={consumable:'🧪 ไอเทม',boost:'💎 ถาวร',rare:'🌟 หายาก'};
  let h='<h3>🛒 ร้านค้า</h3><div class="sbar"><span>🪙 <span class="sg">'+state.player.gold+'</span></span></div>';
  h+='<div class="tabs">'+Object.keys(cats).map(k=>'<div class="tab '+(tab===k?'active':'')+'" onclick="renderShop(\''+k+'\')">'+cats[k]+'</div>').join('')+'</div>';
  const items=Object.values(SHOP_ITEMS).filter(it=>it.cat===tab);
  items.forEach(it=>{
    let owned='';
    if(tab==='consumable')owned='<span class="bdg bdg-b">มี '+((state.consumables&&state.consumables[it.id])||0)+'</span>';
    else if(tab==='boost')owned=state.permanentBoosts&&state.permanentBoosts[it.id]?'<span class="bdg bdg-g">✅ มีแล้ว</span>':'';
    else if(tab==='rare')owned=state.rareItems&&state.rareItems.includes(it.id)?'<span class="bdg bdg-gold">✅ มีแล้ว</span>':'';
    h+='<div class="si"><div style="flex:1"><b>'+it.name+'</b><br><span class="ts" style="color:var(--td)">'+it.desc+'</span> '+owned+'</div><button class="btn btn-sm" onclick="buyItem(\''+it.id+'\')" '+((owned.indexOf('✅')>-1)?'disabled':'')+'>'+it.cost+'🪙</button></div>';
  });
  h+='<button class="btn btn-o wf mt3" onclick="go(\'menu\')">🔙 กลับ</button>';
  contentEl.innerHTML=h;
}
function buyItem(id){
  const it=SHOP_ITEMS[id];if(!it)return;
  if(state.player.gold<it.cost){Audio.sfx.buttonError();return;}
  if(it.cat==='consumable'){
    state.player.gold-=it.cost;
    if(!state.consumables)state.consumables={};
    state.consumables[id]=(state.consumables[id]||0)+1;

}

  const all={...BaseClasses,...AdvanceClasses};const k=window.__detailClass;const d=all[k];if(!d){go('class');return;}
  const locked=d.unlock!==undefined&&!state.myGClasses.includes(k)&&d.unlock>state.player.plv;
  let h='<h3>'+d.emoji+' '+d.name+'</h3>';
  h+='<div class="si col"><b>คำอธิบาย</b><div class="ts" style="color:var(--td);white-space:pre-line">'+d.desc.replace(/\n/g,'<br>')+'</div></div>';
  h+='<div class="si col"><b>ค่าพลังพื้นฐาน</b><div class="detail-row"><span class="detail-label">HP</span><span class="detail-value">'+(d.hp>=0?'+':'')+d.hp+'</span></div><div class="detail-row"><span class="detail-label">DMG</span><span class="detail-value">x'+d.dmg+'</span></div><div class="detail-row"><span class="detail-label">CRIT</span><span class="detail-value">'+(d.crit*100).toFixed(0)+'%</span></div><div class="detail-row"><span class="detail-label">CMUL</span><span class="detail-value">x'+d.cmul+'</span></div>'+(d.comboMul?'<div class="detail-row"><span class="detail-label">COMBO</span><span class="detail-value">x'+d.comboMul+'</span></div>':'')+'</div>';
  if(d.skills){h+='<div class="si col"><b>สกิล</b>';d.skills.forEach(sid=>{const s=SKILL_LIBRARY[sid];if(s)h+='<div class="detail-row"><span class="detail-label">'+s.name+'</span><span class="detail-value">CD '+s.cd+'s · '+s.cost+'🪙</span></div>';});h+='</div>';}
  if(d.passives){h+='<div class="si col"><b>พาสซีฟ</b>';for(const pid in d.passives){const p=PASSIVES[pid];if(p)h+='<div class="detail-row"><span class="detail-label">'+p.name+' Lv.'+d.passives[pid]+'</span><span class="detail-value">'+p.desc.replace('{v}',(d.passives[pid]*p.per).toFixed(2))+'</span></div>';}h+='</div>';}
  if(d.unlock)h+='<div class="si">🔒 ปลดล็อค Lv.'+d.unlock+' หรือกาชา</div>';
  h+='<button class="btn '+(locked?'btn-r':'btn-g')+' wf mt3" onclick="'+(locked?'Audio.sfx.buttonError()':"selectClass('"+k+"');go('class')")+'" '+(locked?'disabled':'')+'>'+(locked?'🔒 ล็อกอยู่':'✅ เลือกคลาสนี้')+'</button>';
  h+='<button class="btn btn-o wf mt2" onclick="go(\'class\')">🔙 กลับ</button>';
  contentEl.innerHTML=h;
}
function openPetDetail(k){window.__detailPet=k;go('petDetail');}
function renderPetDetail(){
  const k=window.__detailPet;const p=Pets[k];if(!p){go('petshop');return;}
  let h='<h3>'+p.emoji+' '+p.name+'</h3>';
  h+='<div class="si col"><b>ความสามารถ</b><div class="ts">'+p.desc+'</div></div>';
  h+='<div class="si col"><b>โบนัส</b><div class="detail-row"><span class="detail-label">ประเภท</span><span class="detail-value">'+p.bonus+'</span></div><div class="detail-row"><span class="detail-label">ค่า</span><span class="detail-value">'+(p.bonus==='hp'?p.amt:'x'+(1+p.amt).toFixed(2))+'</span></div></div>';
  if(p.special){h+='<div class="si col"><b>พาสซีฟพิเศษ</b>';for(const pid in p.special){const ps=PASSIVES[pid];if(ps)h+='<div class="detail-row"><span class="detail-label">'+ps.name+' Lv.'+p.special[pid]+'</span><span class="detail-value">'+ps.desc.replace('{v}',(p.special[pid]*ps.per).toFixed(2))+'</span></div>';}h+='</div>';}
  const owned=state.myPets.includes(k);
  h+='<button class="btn '+(owned?'btn-g':'btn-gold')+' wf mt3" onclick="'+(owned?"equipPet('"+k+"');go('petshop')":"buyPet('"+k+"');go('petshop')")+'">'+(owned?(state.epet===k?'✅ ใช้อยู่':'🎯 ใช้สัตว์นี้'):'🛒 ซื้อ '+p.cost+'🪙')+'</button>';
  h+='<button class="btn btn-o wf mt2" onclick="go(\'petshop\')">🔙 กลับ</button>';
  contentEl.innerHTML=h;
}
function openEquipDetail(slot){window.__detailSlot=slot;go('equipDetail');}
function renderEquipDetail(){
  const slot=window.__detailSlot;const d=EQUIPMENT_DEF[slot];if(!d){go('inventory');return;}
  const lv=state.inv[slot];
  let h='<h3>'+d.icon+' '+d.name+'</h3>';
  h+='<div class="si col"><div class="detail-row"><span class="detail-label">ระดับ</span><span class="detail-value">'+lv+'/'+d.max+'</span></div><div class="detail-row"><span class="detail-label">ผลต่อเลเวล</span><span class="detail-value">'+d.per+'</span></div></div>';
  h+='<div class="si col"><b>พาสซีฟที่ปลดล็อค</b>';
  d.passives.forEach(p=>{const unl=lv>=p[0];const ps=PASSIVES[p[1]];h+='<div class="detail-row"><span class="detail-label" style="color:'+(unl?'var(--ng)':'var(--td)')+'">'+(unl?'✅':'🔒')+' Lv.'+p[0]+'</span><span class="detail-value">'+(ps?ps.name:'?')+'</span></div>';});
  h+='</div>';
  const costs={w:[0,300,700,1400,2500,4500,7000,10000,14000,19000,25000,32000,40000,50000,62000],s:[0,250,600,1200,2200,4000,6500,9500,13000,18000,24000,31000,39000,49000,61000],h:[0,200,500,1000,1800,3200,5200,7800,11000,15000,20000,26000,33000,42000,53000],a:[0,300,700,1400,2500,4500,7000,10000,14000,19000,25000,32000,40000,50000,62000],p:[0,250,600,1200,2200,4000,6500,9500,13000,18000,24000,31000,39000,49000,61000],sh:[0,350,800,1600,3000,5000,7500,10500,14000,18500,24000,31000,39000,49000,61000]};
  if(lv<d.max){h+='<button class="btn btn-g wf mt3" onclick="doUpgrade(\''+slot+'\');renderEquipDetail();">อัพเกรด ('+costs[slot][lv+1]+'🪙)</button>';}
  else{h+='<div class="tc mt3"><span class="bdg bdg-gold">MAX LEVEL</span></div>';}
  h+='<button class="btn btn-o wf mt2" onclick="go(\'inventory\')">🔙 กลับ</button>';
  contentEl.innerHTML=h;
}
</script>
<script>
"use strict";
/* =========================================================
   PART 5: BATTLE SYSTEM (with skills, passives, lifesteal etc.)
   ========================================================= */
function renderBattle(){
  const cd=getClass();const ch=Chapters.find(c=>c.id===state.player.ch)||Chapters[0];
  const bossEmoji=state.player.lv===5?ch.boss:'👾';
  const petEmoji=state.epet&&Pets[state.epet]?'<span style="font-size:14px">'+Pets[state.epet].emoji+'</span>':'';
  contentEl.innerHTML=
    '<div class="bts" id="battleScene"><div class="sbar mb2"><span class="bdg bdg-b">'+ch.icon+' '+ch.name+' ด.'+state.player.lv+'</span><span class="bdg bdg-r" id="comboBadge">🔥0</span></div>'+
    '<div class="crow"><div class="cbat"><div class="ed" id="pEmoji">'+cd.emoji+'</div><div class="cbname">'+state.player.name+petEmoji+'</div><div class="hpo"><div class="hpi" id="pHp" style="width:100%"></div></div><div class="hpt">❤️ <span id="pHpTxt">0/0</span></div></div>'+
    '<div class="vs">VS</div>'+
    '<div class="cbat"><div class="ed" id="bEmoji">'+bossEmoji+'</div><div class="cbname boss">บอส Lv.'+state.player.lv+'</div><div class="hpo"><div class="hpi bh" id="bHp" style="width:100%"></div></div><div class="hpt">❤️ <span id="bHpTxt">0/0</span></div></div></div>'+
    '<div class="tbo"><div class="tbi" id="tBar" style="width:100%"></div></div><div class="tbt" id="tTxt">⏱ 30s</div>'+
    '<button class="cf2" onclick="openCalculator()">🧮 คิดเลข (5🪙)</button></div>'+
    '<div class="qp"><div class="qd" id="qTxt">กำลังสร้างโจทย์...</div><div class="air"><input class="ai" id="ansInp" placeholder="พิมพ์คำตอบ" inputmode="none" autocomplete="off"><button class="btn btn-g" id="subBtn" onclick="submitAnswer()" style="min-width:60px">✓</button></div><div class="cdisp" id="comboDisp"></div><div class="fbm" id="fbMsg"></div></div>'+
    '<div class="fr" style="gap:6px"><button class="btn btn-sm btn-y" id="btnS1" onclick="useSkill(\'s1\')"></button><button class="btn btn-sm btn-g" id="btnS2" onclick="useSkill(\'s2\')"></button><button class="btn btn-sm btn-r" onclick="skipQuestion()">⏩ ข้าม</button></div>'+
    '<div class="fr mt2" style="gap:6px" id="itemBtns"></div>'+
    '<button class="btn btn-sm btn-o wf mt2" onclick="fleeBattle()">🏃 หนี</button>';
  setupBattle();showNumpad(true);Audio.startMusic(state.player.lv===5?130:110);
}
function refreshItemButtons(){
  const box=$('itemBtns');if(!box)return;
  const cons=state.consumables||{};let h='';
  const inBattle=['potion','hpSmall','hpMed','elixir','sp','bomb','timePotion','reviveScroll','luckyCharm','goldPouch'];
  inBattle.forEach(id=>{
    if(cons[id]>0&&SHOP_ITEMS[id]){h+='<button class="btn btn-sm btn-o" style="flex:1" onclick="useItem(\''+id+'\')">'+SHOP_ITEMS[id].name+' ('+cons[id]+')</button>';}
  });
  box.innerHTML=h;
}
function setupBattle(){
  battleSession++;battleEnded=false;isSubmitting=false;clearPendingTimeouts();clearModalAutoAdvance();
  state.player.maxHp=getMaxHp();state.player.hp=state.player.maxHp;state.player.combo=0;state.player.shield=false;
  skillCooldownUntil={s1:0,s2:0};skillUses={s1:0,s2:0};activeEffects={};
  const shieldStart=getTotalPassive('shieldStart');
  if(shieldStart>0)state.player.shieldCharges=shieldStart;
  state.player.bossMaxHp=150+state.player.ch*20+state.player.lv*50+state.player.rebirth*40;
  state.player.bossHp=state.player.bossMaxHp;
  state.player.turnCount=0;
  const startGold=getTotalPassive('startGold')*15;
  if(startGold>0){state.player.gold+=startGold;floatText(window.innerWidth/2,window.innerHeight*0.55,'+'+startGold+'🪙 เริ่มด่าน','gold');}
  if(skillTickInterval){clearInterval(skillTickInterval);skillTickInterval=null;}
  skillTickInterval=setInterval(()=>{if(currentScreen!=='battle'||battleEnded){if(skillTickInterval){clearInterval(skillTickInterval);skillTickInterval=null;}return;}updateSkillButtons();},400);
  updateBattleUI();updateSkillButtons();refreshItemButtons();nextQuestion();
  const inp=$('ansInp');if(inp)inp.addEventListener('input',updateNumpadSubmitState);
  updateNumpadSubmitState();
}
function updateBattleUI(){
  const pHp=$('pHp'),bHp=$('bHp');if(!pHp)return;
  pHp.style.width=Math.max(0,(state.player.hp/state.player.maxHp)*100)+'%';
  bHp.style.width=Math.max(0,(state.player.bossHp/state.player.bossMaxHp)*100)+'%';
  $('pHpTxt').textContent=Math.max(0,Math.round(state.player.hp))+'/'+state.player.maxHp;
  $('bHpTxt').textContent=Math.max(0,Math.round(state.player.bossHp))+'/'+state.player.bossMaxHp;
  $('comboBadge').textContent='🔥'+state.player.combo;
}
function updateSkillButtons(){
  const cd=getClass();const b1=$('btnS1'),b2=$('btnS2');if(!b1||!b2)return;
  const s1=getClassSkill('s1'),s2=getClassSkill('s2');
  if(!s1||!s2)return;
  const now=Date.now();
  const r1=Math.max(0,Math.ceil((skillCooldownUntil.s1-now)/1000));
  const r2=Math.max(0,Math.ceil((skillCooldownUntil.s2-now)/1000));
  b1.innerHTML=s1.name+(r1>0?' ⏳'+r1+'s':' ('+s1.cost+'🪙)');
  b2.innerHTML=s2.name+(r2>0?' ⏳'+r2+'s':' ('+s2.cost+'🪙)');
  b1.disabled=r1>0||state.player.gold<s1.cost;
  b2.disabled=r2>0||state.player.gold<s2.cost;
}
function startTimer(){
  if(battleTimer)clearInterval(battleTimer);
  const ss=battleSession;
  const tt={1:60,2:55,3:50,4:45,5:40};timerMax=(tt[state.player.lv]||60)+getTimeBonusSec();
  timerLeft=timerMax;const bar=$('tBar'),txt=$('tTxt');
  if(bar)bar.style.width='100%';if(txt)txt.textContent='⏱ '+timerMax+'s';
  battleTimer=setInterval(()=>{
    if(ss!==battleSession||battleEnded){clearInterval(battleTimer);battleTimer=null;return;}
    timerLeft--;const pct=Math.max(0,(timerLeft/timerMax)*100);
    if(bar)bar.style.width=pct+'%';if(txt)txt.textContent='⏱ '+Math.max(0,timerLeft)+'s';
    if(timerLeft<=5&&timerLeft>0)Audio.sfx.tick_low();
    if(timerLeft<=0){clearInterval(battleTimer);battleTimer=null;timeUp();}
  },1000);
}
function timeUp(){if(battleEnded)return;const inp=$('ansInp'),sb=$('subBtn');if(inp)inp.disabled=true;if(sb)sb.disabled=true;handleWrong(true);}
function nextQuestion(){
  if(battleEnded||currentScreen!=='battle')return;
  if(state.player.bossHp<=0||state.player.hp<=0){endBattle();return;}
  isSubmitting=false;currentQuest=generateQuestion(state.player.ch,state.player.lv);
  const q=$('qTxt');if(q)q.textContent=currentQuest.q;
  const inp=$('ansInp');if(inp){inp.value='';inp.disabled=false;inp.className='ai';try{inp.focus();}catch(e){}}
  const sb=$('subBtn');if(sb)sb.disabled=false;
  const fb=$('fbMsg');if(fb){fb.textContent='';fb.style.color='var(--td)';}
  const cdisp=$('comboDisp');if(cdisp)cdisp.textContent='';
  updateSkillButtons();updateNumpadSubmitState();startTimer();
}
function submitAnswer(){
  if(isSubmitting||battleEnded)return;
  if(battleTimer){clearInterval(battleTimer);battleTimer=null;}
  const inp=$('ansInp');if(!inp||!currentQuest)return;
  if(inp.disabled)return;const ua=inp.value.trim();if(!ua)return;
  isSubmitting=true;inp.disabled=true;const sb=$('subBtn');if(sb)sb.disabled=true;
  updateNumpadSubmitState();
  const correct=answersMatch(ua,currentQuest.a);
  if(correct){inp.classList.add('cf');setTimeout(()=>{try{inp.classList.remove('cf');}catch(e){}},500);handleCorrect();}
  else{inp.classList.add('wf');setTimeout(()=>{try{inp.classList.remove('wf');}catch(e){}},500);handleWrong(false);}
}
function handleCorrect(){
  if(battleEnded||currentScreen!=='battle')return;
  Audio.sfx.correct();
  state.player.combo++;state.player.turnCount=(state.player.turnCount||0)+1;
  if(state.player.combo>state.player.maxCombo)state.player.maxCombo=state.player.combo;
  state.player.tc++;
  const ch=state.player.ch;if(!state.stats[ch])state.stats[ch]={correct:0,wrong:0};state.stats[ch].correct++;
  if(state.player.combo===5||state.player.combo===10||state.player.combo===20){schedule(()=>Audio.sfx.comboMilestone(),250);floatText(window.innerWidth/2,window.innerHeight*0.25,'🔥 COMBO x'+state.player.combo+'!','critdmg');}
  const cd=getClass();const pb=getPetBonus();
  let base=20+state.player.combo*5;
  let dmg=Math.round(base*(cd.dmg||1)*getWeaponMul()*(1+pb.dmg));
  if(state.player.combo>=5&&cd.comboMul)dmg=Math.round(dmg*cd.comboMul);
  if(state.player.combo>=5&&pb.combo)dmg=Math.round(dmg*(1+pb.combo));
  // firstStrike
  const fs=getPassiveValue('firstStrike');
  if(fs>0&&state.player.turnCount===1)dmg=Math.round(dmg*(1+fs));
  // crit
  let cc=0.06+(cd.crit||0)+pb.crit+getPassiveValue('critDmg')*0;
  cc+=(state.permanentBoosts&&state.permanentBoosts.crit)||0;
  if(state.skillTree&&state.skillTree.critDmg)cc+=0;
  let isCrit=Math.random()<cc;
  if(activeEffects.gcrit){isCrit=true;activeEffects.gcrit=false;}
  if(activeEffects.berserk){dmg=Math.round(dmg*2);}
  if(isCrit){dmg=Math.round(dmg*((cd.cmul||3)+getPassiveValue('critDmg')+((state.permanentBoosts&&state.permanentBoosts.cmul)||0)));Audio.sfx.crit();
    const be=$('bEmoji');if(be){be.classList.add('crit');schedule(()=>be.classList.remove('crit'),500);}screenShake();}
  else{const be=$('bEmoji');if(be){be.classList.add('hit');schedule(()=>be.classList.remove('hit'),400);}}
  // shieldBreak
  const sbv=getPassiveValue('shieldBreak');
  if(sbv>0&&state.player.bossShield) dmg=Math.round(dmg*(1+sbv));
  // execute
  const ex=getPassiveValue('execute');
  let executeKill=false;
  if(ex>0&&state.player.bossHp>0){const pct=(state.player.bossHp/dd_useBossMax())*100;if(pct<ex*100)executeKill=true;}
  if(executeKill){dmg=Math.round(state.player.bossHp);}
  // multiHit
  const mh=getPassiveValue('multiHit');
  let hits=1;
  if(mh>0&&Math.random()<mh){hits=2;}
  for(let i=0;i<hits;i++){state.player.bossHp=Math.max(0,state.player.bossHp-dmg);}
  // lifesteal
  const ls=getPassiveValue('lifesteal');
  if(ls>0){const hl=Math.round(dmg*ls);if(hl>0){state.player.hp=Math.min(state.player.maxHp,state.player.hp+hl);floatText(window.innerWidth/2-80,window.innerHeight*0.4,'+'+hl,'heal');}}
  // hpRegen
  const hr=getPassiveValue('hpRegen');
  if(hr>0){state.player.hp=Math.min(state.player.maxHp,state.player.hp+hr);}
  // thorns is applied when taking damage
  // stun
  const st=getPassiveValue('stunChance');
  if(st>0&&Math.random()<st){activeEffects.bossStun=true;floatText(window.innerWidth/2,window.innerHeight*0.3,'💫 บอสสตัน!','heal');}
  // gold
  const gold=Math.round((12+state.player.combo*3+state.player.lv*3+(isCrit?5:0))*getGoldMul());
  state.player.gold+=gold;state.player.score+=Math.round(30+state.player.combo*5);
  const s2=state.stats2||(state.stats2={});
  s2.totalDamage=(s2.totalDamage||0)+dmg;
  if(dmg>(s2.maxDamage||0))s2.maxDamage=dmg;
  const bx=window.innerWidth/2+80,by=window.innerHeight*0.35;
  if(isCrit){floatText(bx,by,'💥 '+dmg+(hits>1?' x'+hits:''),'critdmg');Particles.burst(bx,by,{count:30,speed:6,colors:['#ff006e','#ffe600','#ff8c00']});}
  else{floatText(bx,by,'-'+dmg+(hits>1?' x'+hits:''),'dmg');Particles.burst(bx,by,{count:14,speed:4,colors:['#ffe600','#00f0ff']});}
  floatText(bx,by+30,'+'+gold+'🪙','gold');Audio.sfx.gold();
  if(state.player.combo>=3)Audio.sfx.combo(state.player.combo);
  const fb=$('fbMsg');if(fb){fb.textContent='✅ ถูก! DMG '+dmg+(hits>1?' (x'+hits+')':'')+(isCrit?' 💥CRIT!':'')+' · +'+gold+'🪙';fb.style.color='var(--ng)';}
  if(state.player.combo>=3){const c2=$('comboDisp');if(c2)c2.textContent='🔥 COMBO x'+state.player.combo+'!';}
  updateBattleUI();Save.write(state);
  if(state.player.bossHp<=0){schedule(()=>endBattle(),700);}
  else if(activeEffects.bossStun){activeEffects.bossStun=false;schedule(()=>nextQuestion(),850);}
  else{schedule(()=>{if(battleEnded||currentScreen!=='battle')return;nextQuestion();},850);}
}
function dd_useBossMax(){return state.player.bossMaxHp;}
function handleWrong(timeUp){
  if(battleEnded||currentScreen!=='battle')return;
  Audio.sfx.wrong();
  const ck=getPassiveValue('comboKeep');
  if(ck>0&&Math.random()<ck){floatText(window.innerWidth/2,window.innerHeight*0.3,'🔥 รักษาคอมโบ!','heal');Audio.sfx.passive();}
  else{state.player.combo=0;}
  state.player.tw++;
  const ch=state.player.ch;if(!state.stats[ch])state.stats[ch]={correct:0,wrong:0};state.stats[ch].wrong++;
  if(!state.wrongLog)state.wrongLog=[];
  const inNow=$('ansInp');
  state.wrongLog.unshift({ch,lv:state.player.lv,q:currentQuest?currentQuest.q:'',correct:currentQuest?String(currentQuest.a):'?',hint:currentQuest?(currentQuest.h||''):'',user:timeUp?'(หมดเวลา)':((inNow&&inNow.value)||'(ว่าง)'),time:Date.now()});
  if(state.wrongLog.length>50)state.wrongLog.length=50;
  let dmg=8+state.player.lv*2+(timeUp?6:0);
  const cd=getPassiveValue('critDodge');
  if(cd>0&&Math.random()<cd){floatText(window.innerWidth/2,window.innerHeight*0.4,'💨 หลบคริ!','heal');dmg=Math.round(dmg*0.3);}
  let blocked=false;
  if(activeEffects.dodge){activeEffects.dodge=false;dmg=0;blocked=true;
    const fb=$('fbMsg');if(fb){fb.textContent='💨 หลบได้!';fb.style.color='var(--nb)';}}
  else if(state.player.shield){state.player.shield=false;dmg=0;blocked=true;
    const fb=$('fbMsg');if(fb){fb.textContent='🛡️ ป้องกัน!';fb.style.color='var(--nb)';}}
  else if(state.inv.sh>0&&Math.random()<state.inv.sh*0.025){dmg=0;blocked=true;
    const fb=$('fbMsg');if(fb){fb.textContent='👟 หลบด้วยรองเท้า!';fb.style.color='var(--nb)';}}
  if(!blocked){
    state.player.hp=Math.max(0,state.player.hp-dmg);
    Audio.sfx.hit();
    const pe=$('pEmoji');if(pe){pe.classList.add('hit');schedule(()=>pe.classList.remove('hit'),400);}
    screenShake();Particles.burst(window.innerWidth/2-80,window.innerHeight*0.35,{count:12,speed:3,colors:['#ff006e','#ff4b2b']});
    // thorns
    const th=getPassiveValue('thorns');

function useSkill(slot){

    case'shieldheal':state.player.shield=true;state.player.hp=Math.min(state.player.maxHp,state.player.hp+(skill.heal||25));floatText(window.innerWidth/2,window.innerHeight*0.35,'🛡️ โล่เทพ!','heal');break;
    case'dodge':activeEffects.dodge=true;if(skill.gcrit)activeEffects.gcrit=true;if(skill.comboAdd)state.player.combo+=skill.comboAdd;floatText(window.innerWidth/2,window.innerHeight*0.35,'💨 เตรียมหลบ','miss');break;
    case'drain':{const d=Math.round(30*(skill.mul||2)*getWeaponMul());state.player.bossHp=Math.max(0,state.player.bossHp-d);const hl=Math.round(d*(skill.healPct||0.5));state.player.hp=Math.min(state.player.maxHp,state.player.hp+hl);floatText(window.innerWidth/2,window.innerHeight*0.35,'🩸 '+d+' +'+hl+'HP','critdmg');break;}
    case'berserk':activeEffects.berserk=true;floatText(window.innerWidth/2,window.innerHeight*0.35,'💢 คลั่ง!','critdmg');break;
    case'cboost':activeEffects.cboost=true;if(skill.comboAdd)state.player.combo+=skill.comboAdd;else state.player.combo+=2;floatText(window.innerWidth/2,window.innerHeight*0.35,'⚔️ คอมโบ+!','dmg');break;
    case'dot':activeEffects.dot={dmg:skill.dmg,turns:2};break;
    case'exec25':{if(state.player.bossHp/state.player.bossMaxHp<0.25){state.player.bossHp=0;floatText(window.innerWidth/2,window.innerHeight*0.35,'☠️ ประหาร!','critdmg');}else{state.player.bossHp=Math.max(0,state.player.bossHp-30);}break;}
    case'utility':extraGold=skill.gold||0;break;
    case'sacrifice':{const hp=Math.round(state.player.hp*0.5);state.player.hp-=hp;const d=Math.round(30*(skill.mul||2)*getWeaponMul()+hp);state.player.bossHp=Math.max(0,state.player.bossHp-d);floatText(window.innerWidth/2,window.innerHeight*0.35,'🩸 -'+hp+'HP '+d,'critdmg');break;}

function skipQuestion(){

function useItem(type){

  else if(type==='luckyCharm'){state.player.lucky=true;floatText(window.innerWidth/2,window.innerHeight*0.4,'🍀 โชคดี!','heal');}
  else if(type==='sp'){state.player.hp=state.player.maxHp;state.player.bossHp=Math.max(0,state.player.bossHp-60);Audio.sfx.crit();floatText(window.innerWidth/2,window.innerHeight*0.4,'💜 -60','critdmg');}
  refreshItemButtons();updateBattleUI();Save.write(state);
  if(state.player.bossHp<=0)schedule(()=>endBattle(),400);
}
function screenShake(){const s=$('battleScene');if(!s)return;s.classList.remove('sh');void s.offsetWidth;s.classList.add('sh');setTimeout(()=>{try{s.classList.remove('sh');}catch(e){}},500);}
function endBattle(){
  if(battleEnded)return;battleEnded=true;
  if(skillTickInterval){clearInterval(skillTickInterval);skillTickInterval=null;}
  clearPendingTimeouts();clearModalAutoAdvance();closeModal();

      if(lv===5&&!state.bossKills.includes(ch))state.bossKills.push(ch);
      addExp(Math.round((lv===5?80:25)*getExpMul()));
      // rare drop
      let dropMsg='';
      const lucky=state.player.lucky?0.10:0;
      if(Math.random()<(0.05+lucky)){
        const rareIds=Object.values(SHOP_ITEMS).filter(it=>it.cat==='rare').map(it=>it.id);
        const drop=pick(rareIds);
        if(!state.rareItems)state.rareItems=[];
        if(!state.rareItems.includes(drop)){state.rareItems.push(drop);dropMsg='<div style="color:var(--np);margin-top:8px">🌟 ดรอป: '+SHOP_ITEMS[drop].name+'</div>';}
      }
      state.player.lucky=false;
      Particles.burst(window.innerWidth/2,window.innerHeight/2,{count:60,speed:8});
      Save.write(state);
      showModal('🎉 ชนะ!','<div class="tc"><div style="font-size:56px">🏆</div><div>ได้รับ '+gold+'🪙</div><div>คะแนน +'+(100+lv*50)+'</div><div>EXP +'+(lv===5?80:25)+'</div>'+(lv===5?'<div style="color:var(--np);margin-top:8px">👑 ปราบบอส!</div>':'')+dropMsg+'</div>',[{label:'เยี่ยม!',cls:'btn-g',action:"closeModal();go('chapters')"}]);
    },300);
  }else{
    Audio.sfx.lose();state.player.gold=Math.max(0,state.player.gold-10);Save.write(state);
    showModal('💀 พ่ายแพ้','<div class="tc"><div style="font-size:56px">💀</div><div>เสีย 10🪙</div></div>',[{label:'ลองใหม่',cls:'btn-r',action:"closeModal();go('chapters')"}]);
  }

function addExp(amount){
  state.player.exp+=amount;
  let need=state.player.plv*80+state.player.rebirth*40;
  let safety=0;
  while(state.player.exp>=need&&safety<100){
    safety++;
    state.player.exp-=need;
    state.player.plv++;
    state.player.maxHp=getMaxHp();state.player.hp=state.player.maxHp;
    state.player.skillPoints=(state.player.skillPoints||0)+1;
    need=state.player.plv*80+state.player.rebirth*40;
    Audio.sfx.level();floatText(window.innerWidth/2,window.innerHeight*0.35,'⭐ LEVEL UP! +1SP','heal');
    Particles.burst(window.innerWidth/2,window.innerHeight*0.35,{count:40,speed:7});
  }
}
function startBattle(ch,lv){state.player.ch=ch;state.player.lv=lv;state.player.maxHp=getMaxHp();state.player.hp=state.player.maxHp;state.player.__reviveUsed=false;go('battle');}
function fleeBattle(){if(battleTimer){clearInterval(battleTimer);battleTimer=null;}if(skillTickInterval){clearInterval(skillTickInterval);skillTickInterval=null;}clearPendingTimeouts();clearModalAutoAdvance();closeModal();Audio.stopMusic();hideNumpad();battleSession++;battleEnded=true;state.player.gold=Math.max(0,state.player.gold-10);Save.write(state);go('chapters');}

<script>
"use strict";

    '<div class="mcard" onclick="startPattern()"><span class="me">🧩</span><div class="mi"><div class="mn">Pattern Recognition</div><div class="md">ทายตัวเลขถัดไปในอนุกรม</div></div></div>'+

/* ---------- DUEL (P1 rotated) ---------- */
const DUEL_TIME=60;
function duelGenQ(){const ops=['+','-','×'];const op=ops[Math.floor(Math.random()*3)];let a,b,correct;
if(op==='+'){a=R(10,40);b=R(10,40);correct=a+b;}
else if(op==='-'){a=R(20,50);b=R(1,Math.max(3,a-5));correct=a-b;}
else{a=R(2,9);b=R(2,9);correct=a*b;}
const set={};set[correct]=1;const arr=[correct];let attempts=0;
while(arr.length<4&&attempts<50){attempts++;const delta=R(-6,6);if(delta===0)continue;const v=correct+delta;if(v<0||set[v])continue;set[v]=1;arr.push(v);}
while(arr.length<4){const v2=correct+arr.length+1;if(!set[v2]){set[v2]=1;arr.push(v2);}}
for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
return{a,b,op,correct,opts:arr};}
function startDuel(){
  if(currentDuel&&currentDuel.timer)clearInterval(currentDuel.timer);
  currentDuel={p1:0,p2:0,time:DUEL_TIME,q:duelGenQ(),locked:false,p1Freeze:false,p2Freeze:false,timer:null};
  currentScreen='duel';renderDuel();
  currentDuel.timer=setInterval(()=>{
    if(!currentDuel)return;
    currentDuel.time--;
    const el=$('duelTimer');if(el)el.textContent=currentDuel.time+'s';
    if(currentDuel.time<=0)endDuel();
  },1000);
  Audio.sfx.win();
}
function renderDuel(){
  if(!currentDuel)return;
  const q=currentDuel.q;
  const p1Dis=currentDuel.p1Freeze||currentDuel.locked;
  const p2Dis=currentDuel.p2Freeze||currentDuel.locked;
  const opts1=q.opts.map(v=>'<button class="duel-btn '+(p1Dis?'dis':'')+'" onclick="duelAnswer(1,'+v+')" '+(p1Dis?'disabled':'')+'>'+v+'</button>').join('');
  const opts2=q.opts.map(v=>'<button class="duel-btn '+(p2Dis?'dis':'')+'" onclick="duelAnswer(2,'+v+')" '+(p2Dis?'disabled':'')+'>'+v+'</button>').join('');
  const qHtml=q.a+' '+q.op+' '+q.b+' = ?';
  contentEl.innerHTML=
    '<div class="duel-wrap"><div class="duel-hdr"><span>⏱ <span id="duelTimer">'+currentDuel.time+'s</span></span><span class="bdg bdg-g">แข่งคิดเลขเร็ว</span></div>'+
    '<div class="duel-side duel-p1"><span class="duel-badge">P1 (บน · หมุน)</span><div class="duel-rotate"><div class="duel-name">🔵 P1 (คุณ) — '+currentDuel.p1+' แต้ม</div><div class="duel-q">'+qHtml+'</div><div class="duel-opts">'+opts1+'</div></div></div>'+
    '<div class="duel-side duel-p2"><span class="duel-badge">P2 (ล่าง)</span><div class="duel-name">🔴 P2 (เพื่อน) — '+currentDuel.p2+' แต้ม</div><div class="duel-q">'+qHtml+'</div><div class="duel-opts">'+opts2+'</div></div>'+
    '<button class="btn btn-o wf mt2" onclick="exitDuel()">✖ ออก</button></div>';
  contentEl.scrollTop=0;
}
function endDuel(){
  if(!currentDuel)return;
  if(currentDuel.timer)clearInterval(currentDuel.timer);
  const s1=currentDuel.p1,s2=currentDuel.p2;
  const gold=s1*10;state.player.gold+=gold;Save.write(state);
  let msg;s1>s2?msg='🏆 P1 ชนะ!':s2>s1?msg='🏆 P2 ชนะ!':msg='🤝 เสมอ';
  Audio.sfx.win();
  showModal('⚔️ จบการแข่ง!','<div class="tc"><div style="font-size:48px">🏁</div><div>'+msg+'</div><div class="mt2"><b>P1: '+s1+'</b> · <b>P2: '+s2+'</b></div><div style="color:var(--ny);margin-top:8px">+'+gold+'🪙</div></div>',[{label:'เล่นใหม่',cls:'btn-g',action:'closeModal();startDuel()'},{label:'กลับ',cls:'btn-o',action:"closeModal();currentDuel=null;go('modes')"}]);
}
function duelAnswer(p,v){
  if(!currentDuel||currentDuel.locked)return;
  if(p===1&&currentDuel.p1Freeze)return;
  if(p===2&&currentDuel.p2Freeze)return;
  if(v===currentDuel.q.correct){
    currentDuel.locked=true;
    if(p===1)currentDuel.p1++;else currentDuel.p2++;
    Audio.sfx.correct();
    const y=p===1?window.innerHeight*0.30:window.innerHeight*0.72;
    Particles.burst(window.innerWidth/2,y,{count:30,speed:7,colors:['#39ff14','#ffe600']});
    setTimeout(()=>{if(!currentDuel)return;currentDuel.q=duelGenQ();currentDuel.locked=false;renderDuel();},400);
  }else{
    Audio.sfx.wrong();
    if(p===1)currentDuel.p1Freeze=true;else currentDuel.p2Freeze=true;
    renderDuel();
    setTimeout(()=>{if(!currentDuel)return;if(p===1)currentDuel.p1Freeze=false;else currentDuel.p2Freeze=false;renderDuel();},1200);
  }
}
function exitDuel(){if(!confirm('ออก?'))return;if(currentDuel&&currentDuel.timer)clearInterval(currentDuel.timer);currentDuel=null;go('modes');}

/* ---------- CALCULATOR ---------- */
