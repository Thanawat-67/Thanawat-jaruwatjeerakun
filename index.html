<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Math Quest Ultimate · ม.1-6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --nb:#00f0ff; --np:#ff006e; --nu:#b537f2; --ng:#39ff14; --ny:#ffe600; --no:#ff8c00;
  --bg:#08080f; --bg2:#0f0f1e; --card:#16162a; --card2:#1e1e38;
  --glass:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.14);
  --border-bright:rgba(0,240,255,0.4);
  --tb:#ffffff; --td:#a8a8c8;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
body{
  font-family:'Kanit',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 10%,rgba(0,240,255,0.12) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 20%,rgba(255,0,110,0.10) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 90%,rgba(181,55,242,0.12) 0%,transparent 50%);
  color:var(--tb);min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:stretch;
  overflow:hidden;position:relative;
  user-select:none;-webkit-user-select:none;
}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{
  width:100%;max-width:840px;position:relative;z-index:2;
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  padding-top:var(--st);padding-bottom:var(--sb);
}
.gw{
  background:rgba(15,15,30,0.94);
  overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;flex:1;min-height:0;
  border-bottom:1px solid var(--border);
}
@media(min-width:640px){
  body{padding:14px;align-items:center;}
  .app{height:min(100dvh - 28px,920px);}
  .gw{border-radius:24px;border:1px solid var(--border);box-shadow:0 0 50px rgba(0,240,255,0.15),0 24px 80px rgba(0,0,0,0.8);}
}
/* Header */
.gh{padding:10px 16px;text-align:center;background:linear-gradient(180deg,rgba(0,240,255,0.08),rgba(0,240,255,0.02));border-bottom:1px solid var(--border);flex-shrink:0;position:relative;overflow:hidden;}
.gh::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--nb),transparent);opacity:0.6;animation:scan 4s linear infinite;}
@keyframes scan{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.br{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cb{display:inline-block;background:linear-gradient(135deg,rgba(255,0,110,0.25),rgba(181,55,242,0.20));border:1px solid var(--np);padding:4px 12px;border-radius:14px;font-size:11px;font-weight:700;color:#ff6ba8;letter-spacing:1.5px;box-shadow:0 0 15px rgba(255,0,110,0.35);}
.stg{background:linear-gradient(135deg,rgba(0,240,255,0.15),rgba(181,55,242,0.10));border:1px solid var(--border-bright);color:var(--tb);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;}
.stg:active{transform:scale(0.9);background:rgba(0,240,255,0.3);}
.gt{font-family:'Orbitron',sans-serif;font-size:1.5em;font-weight:900;background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np),var(--nu));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;line-height:1.2;margin-top:3px;filter:drop-shadow(0 0 10px rgba(0,240,255,0.6));}
.sb{color:var(--td);font-size:10px;letter-spacing:1.2px;margin-top:2px;}
/* Content */
.gc{padding:14px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;}
.gc::-webkit-scrollbar{width:6px;}
.gc::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);border-radius:3px;}
.gc::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--nu),var(--nb));border-radius:3px;}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 18px;font-family:'Kanit',sans-serif;font-weight:700;font-size:15px;border:none;border-radius:14px;cursor:pointer;transition:transform 0.12s,box-shadow 0.25s,filter 0.25s;letter-spacing:0.4px;text-align:center;color:#fff;background:linear-gradient(135deg,#00c6ff,#0072ff);box-shadow:0 6px 20px rgba(0,114,255,0.35),inset 0 1px 0 rgba(255,255,255,0.25);touch-action:manipulation;position:relative;overflow:hidden;}
.btn:active{transform:scale(0.96);filter:brightness(0.92);}
.btn:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.btn-g{background:linear-gradient(135deg,#00b09b,#96c93d);box-shadow:0 6px 20px rgba(0,176,155,0.35),inset 0 1px 0 rgba(255,255,255,0.25);}
.btn-r{background:linear-gradient(135deg,#ff416c,#ff4b2b);box-shadow:0 6px 20px rgba(255,65,108,0.35),inset 0 1px 0 rgba(255,255,255,0.25);}
.btn-y{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;box-shadow:0 6px 20px rgba(247,151,30,0.35),inset 0 1px 0 rgba(255,255,255,0.35);}
.btn-gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;box-shadow:0 6px 20px rgba(255,215,0,0.4),inset 0 1px 0 rgba(255,255,255,0.4);}
.btn-p{background:linear-gradient(135deg,#ff006e,#ff4b8b);box-shadow:0 6px 20px rgba(255,0,110,0.35),inset 0 1px 0 rgba(255,255,255,0.25);}
.btn-pur{background:linear-gradient(135deg,#b537f2,#7b2ff7);box-shadow:0 6px 20px rgba(181,55,242,0.35),inset 0 1px 0 rgba(255,255,255,0.25);}
.btn-o{background:linear-gradient(135deg,rgba(0,240,255,0.08),rgba(181,55,242,0.05));border:2px solid var(--border-bright);color:var(--nb);box-shadow:0 0 15px rgba(0,240,255,0.15);}
.btn-o:active{background:rgba(0,240,255,0.2);}
.btn-sm{min-height:46px;padding:10px 14px;font-size:13px;border-radius:11px;}
.btn-xs{min-height:40px;padding:8px 12px;font-size:12px;border-radius:9px;}
/* Stats bar */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(90deg,rgba(0,0,0,0.55),rgba(0,240,255,0.06),rgba(0,0,0,0.55));border-radius:14px;margin-bottom:10px;font-size:13px;color:#e0e0f0;flex-wrap:wrap;gap:6px;border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);}
.sv{font-weight:800;color:var(--nb);text-shadow:0 0 10px rgba(0,240,255,0.7);}
.sg{font-weight:800;color:var(--ny);text-shadow:0 0 10px rgba(255,230,0,0.7);}
.bdg{display:inline-block;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:0.4px;}
.bdg-gold{background:rgba(255,230,0,0.2);color:var(--ny);border:1px solid rgba(255,230,0,0.5);}
.bdg-g{background:rgba(57,255,20,0.2);color:var(--ng);border:1px solid rgba(57,255,20,0.5);}
.bdg-b{background:rgba(0,240,255,0.2);color:var(--nb);border:1px solid rgba(0,240,255,0.5);}
.bdg-r{background:rgba(255,0,110,0.2);color:var(--np);border:1px solid rgba(255,0,110,0.5);}
.bdg-p{background:rgba(181,55,242,0.2);color:var(--nu);border:1px solid rgba(181,55,242,0.5);}
/* Card base */
.card{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;transition:all 0.25s;position:relative;overflow:hidden;}
.card:active{transform:scale(0.985);border-color:var(--border-bright);box-shadow:0 0 20px rgba(0,240,255,0.25);}
/* Headings */
h3{font-size:19px;font-weight:800;color:#fff;text-shadow:0 0 12px rgba(0,240,255,0.5);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(0,240,255,0.25);letter-spacing:0.3px;}
h4{font-size:15px;font-weight:700;color:var(--ny);margin:16px 0 10px;padding:8px 14px;background:linear-gradient(90deg,rgba(255,230,0,0.12),transparent);border-left:4px solid var(--ny);border-radius:8px;letter-spacing:0.4px;text-shadow:0 0 8px rgba(255,230,0,0.4);}
/* Chapter */
.chc{margin-bottom:12px;}
.chh{display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(135deg,rgba(0,240,255,0.06),rgba(181,55,242,0.04));border:2px solid rgba(0,240,255,0.3);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
.chi{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,rgba(0,0,0,0.6),rgba(0,240,255,0.12));border:2px solid;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);}
.chn{flex:1;min-width:0;}
.chname{font-size:15px;font-weight:700;color:#fff;margin-bottom:5px;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,0.9);}
.chprog{font-size:12px;font-weight:700;color:var(--nb);text-shadow:0 0 8px rgba(0,240,255,0.6);margin-bottom:4px;}
.llist{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 0 0 64px;}
.lbtn{min-height:56px;padding:8px 4px;border-radius:12px;border:2px solid rgba(0,240,255,0.4);background:linear-gradient(180deg,rgba(0,240,255,0.15),rgba(0,240,255,0.05));color:#fff;cursor:pointer;font-size:12px;font-weight:700;text-align:center;font-family:'Kanit',sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);transition:all 0.2s;}
.lbtn:active{transform:scale(0.94);}
.lbtn.done{border-color:var(--ng);background:linear-gradient(180deg,rgba(57,255,20,0.25),rgba(57,255,20,0.08));box-shadow:0 0 15px rgba(57,255,20,0.35);}
/* Progress bar */
.pb{background:rgba(0,0,0,0.5);border-radius:6px;height:6px;overflow:hidden;border:1px solid rgba(0,240,255,0.2);}
.pbf{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ng),var(--nb));box-shadow:0 0 10px rgba(0,240,255,0.5);transition:width 0.5s;}
/* Battle */
.bts{background:linear-gradient(135deg,rgba(0,0,0,0.65),rgba(0,240,255,0.05),rgba(0,0,0,0.65));border-radius:16px;padding:14px;border:2px solid var(--border);margin-bottom:12px;text-align:center;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
.bts.sh{animation:sk 0.4s ease;}
@keyframes sk{0%,100%{transform:translate(0,0);}20%{transform:translate(-8px,4px);}40%{transform:translate(8px,-4px);}60%{transform:translate(-5px,-3px);}80%{transform:translate(5px,3px);}}
.ed{font-size:60px;display:inline-block;line-height:1;user-select:none;filter:drop-shadow(0 0 18px rgba(0,240,255,0.5));}
.ed.hit{animation:eh 0.4s ease;}
.ed.crit{animation:ec 0.5s ease-out;}
@keyframes eh{0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);}}
@keyframes ec{0%{transform:scale(1);}30%{transform:scale(1.7) rotate(-12deg);}60%{transform:scale(1.2) rotate(6deg);}100%{transform:scale(1) rotate(0);}}
.crow{display:flex;align-items:center;justify-content:space-around;gap:8px;flex-wrap:wrap;}
.cbat{text-align:center;min-width:100px;flex:1;max-width:140px;}
.cbname{color:#fff;font-weight:700;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,0.9);}
.cbname.boss{color:#ff6ba8;text-shadow:0 0 10px rgba(255,0,110,0.6);}
.hpo{background:linear-gradient(180deg,#0a0a18,#1a1a2e);border-radius:8px;height:14px;overflow:hidden;border:1px solid var(--border);margin-top:6px;box-shadow:inset 0 2px 4px rgba(0,0,0,0.6);}
.hpi{height:100%;border-radius:8px;transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);background:linear-gradient(90deg,#00f0ff,#00c6ff,#00a8ff);box-shadow:0 0 14px rgba(0,240,255,0.7),inset 0 1px 0 rgba(255,255,255,0.4);position:relative;}
.hpi::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.4),transparent);border-radius:8px 8px 0 0;}
.hpi.bh{background:linear-gradient(90deg,#ff006e,#ff4b2b,#ff8c00);box-shadow:0 0 14px rgba(255,0,110,0.7),inset 0 1px 0 rgba(255,255,255,0.4);}
.hpt{font-size:11px;color:#c8c8e0;margin-top:3px;font-weight:600;}
.vs{font-family:'Orbitron',sans-serif;font-weight:900;font-size:24px;color:var(--ny);text-shadow:0 0 18px rgba(255,230,0,0.9);animation:vp 1.6s ease-in-out infinite;}
@keyframes vp{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.tbo{background:linear-gradient(180deg,#0a0a18,#1a1a2e);border-radius:6px;height:10px;overflow:hidden;border:1px solid var(--border);margin-top:10px;box-shadow:inset 0 2px 4px rgba(0,0,0,0.6);}
.tbi{height:100%;border-radius:6px;transition:width 0.15s linear;background:linear-gradient(90deg,var(--ng),var(--ny),var(--no));box-shadow:0 0 12px rgba(255,230,0,0.6);}
.tbt{font-size:12px;color:var(--ny);font-weight:700;text-align:center;margin-top:4px;text-shadow:0 0 10px rgba(255,230,0,0.7);}
/* Question */
.qp{background:linear-gradient(135deg,rgba(0,0,0,0.6),rgba(0,240,255,0.05),rgba(0,0,0,0.6));border-radius:16px;padding:16px;border:2px solid var(--border);margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
.qd{font-size:22px;font-weight:800;color:#fff;text-align:center;margin-bottom:14px;line-height:1.5;min-height:34px;word-break:break-word;text-shadow:0 0 14px rgba(0,240,255,0.4);}
.air{display:flex;gap:10px;}
.ai{flex:1;padding:14px 16px;font-size:18px;font-weight:700;text-align:center;border-radius:12px;border:2px solid var(--border);background:rgba(0,0,0,0.6);color:#fff;outline:none;transition:all 0.25s;font-family:'Kanit',sans-serif;min-width:0;}
.ai:focus{border-color:var(--nb);box-shadow:0 0 20px rgba(0,240,255,0.5),inset 0 0 15px rgba(0,240,255,0.1);}
.ai:disabled{opacity:0.6;}
.ai.cf{border-color:var(--ng)!important;box-shadow:0 0 25px rgba(57,255,20,0.7)!important;background:rgba(57,255,20,0.15)!important;}
.ai.wf{border-color:var(--np)!important;box-shadow:0 0 25px rgba(255,0,110,0.7)!important;background:rgba(255,0,110,0.15)!important;}
.cdisp{text-align:center;font-weight:800;font-size:16px;margin-top:8px;min-height:22px;color:var(--ny);text-shadow:0 0 12px rgba(255,230,0,0.7);}
.fbm{font-size:13px;text-align:center;margin-top:6px;min-height:18px;color:#c8c8e0;font-weight:600;}
/* Numpad */
.npc{flex-shrink:0;background:rgba(10,10,26,0.98);border-top:1px solid var(--border);padding:10px;display:none;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -10px 30px rgba(0,0,0,0.6);}
.npc.active{display:block;}
.npg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:580px;margin:0 auto;}
.npb{min-height:56px;padding:8px;font-size:22px;font-weight:800;font-family:'Orbitron','Kanit',sans-serif;border-radius:12px;border:1px solid var(--border);background:linear-gradient(180deg,rgba(0,240,255,0.12),rgba(0,240,255,0.04));color:#fff;cursor:pointer;transition:transform 0.08s,background 0.15s;touch-action:manipulation;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);}
.npb:active{transform:scale(0.92);background:rgba(0,240,255,0.35);}
.npb.op{background:linear-gradient(180deg,rgba(181,55,242,0.22),rgba(181,55,242,0.08));color:var(--nu);}
.npb.submit{background:linear-gradient(135deg,var(--ng),#00b09b);color:#0a1a0a;font-size:20px;box-shadow:0 0 18px rgba(57,255,20,0.5);}
.npb.back{background:linear-gradient(180deg,rgba(255,0,110,0.22),rgba(255,0,110,0.08));color:var(--np);font-size:20px;}
/* Floating text */
.ft{position:fixed;pointer-events:none;font-weight:900;font-family:'Orbitron','Kanit',sans-serif;z-index:500;text-shadow:0 2px 10px rgba(0,0,0,0.95),0 0 16px currentColor;animation:fu 1.2s ease-out forwards;font-size:26px;white-space:nowrap;}
.ft.crit{font-size:38px;animation:fu 1.3s ease-out forwards,fcr 0.35s ease-out;}
@keyframes fcr{0%{transform:translate(-50%,0) scale(0.4) rotate(-15deg);}50%{transform:translate(-50%,-18px) scale(1.5) rotate(10deg);}100%{transform:translate(-50%,-30px) scale(1.15) rotate(0);}}
.ft.miss{color:#999;font-size:22px;}
.ft.heal{color:var(--ng);}
.ft.dmg{color:var(--ny);}
.ft.critdmg{color:var(--np);text-shadow:0 0 20px var(--np),0 0 35px var(--np);}
.ft.gold{color:#ffd700;font-size:20px;}
@keyframes fu{0%{transform:translate(-50%,0) scale(0.6);opacity:0;}15%{transform:translate(-50%,-14px) scale(1.3);opacity:1;}100%{transform:translate(-50%,-110px) scale(1);opacity:0;}}
/* Start overlay */
.so{position:fixed;inset:0;z-index:9000;background:linear-gradient(135deg,#08080f 0%,#150a25 50%,#0a1525 100%);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity 0.6s;overflow-y:auto;}
.so.hide{opacity:0;pointer-events:none;}
.so::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 30%,rgba(0,240,255,0.15),transparent 50%),radial-gradient(circle at 75% 70%,rgba(255,0,110,0.13),transparent 50%),radial-gradient(circle at 50% 50%,rgba(181,55,242,0.10),transparent 60%);pointer-events:none;animation:bgSh 8s ease-in-out infinite;}
@keyframes bgSh{0%,100%{opacity:0.9;}50%{opacity:1;}}
.sc{max-width:440px;width:100%;background:rgba(18,18,35,0.98);border:2px solid var(--nb);border-radius:26px;padding:36px 28px;box-shadow:0 0 70px rgba(0,240,255,0.4),inset 0 1px 0 rgba(255,255,255,0.1);position:relative;z-index:1;}
.slogo{font-family:'Orbitron',sans-serif;font-size:2.4em;font-weight:900;background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np),var(--nu));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;margin-bottom:6px;filter:drop-shadow(0 0 12px rgba(0,240,255,0.6));}
.ssub{color:var(--td);font-size:13px;margin-bottom:22px;letter-spacing:0.5px;}
.credits{background:linear-gradient(135deg,rgba(255,0,110,0.15),rgba(181,55,242,0.15));border:1px solid var(--np);border-radius:16px;padding:14px 18px;margin-bottom:22px;text-align:center;box-shadow:0 0 25px rgba(255,0,110,0.3);}
.credits-label{font-size:11px;letter-spacing:3px;color:var(--ny);font-weight:700;margin-bottom:5px;text-shadow:0 0 10px rgba(255,230,0,0.6);}
.credits-name{font-size:19px;font-weight:900;background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.5px;font-family:'Orbitron',sans-serif;}
.credits-sub{font-size:11px;color:var(--td);margin-top:3px;}
.sbtn{display:inline-block;min-height:64px;padding:18px 40px;font-size:18px;font-weight:800;border-radius:18px;border:none;background:linear-gradient(135deg,var(--ng),var(--nb));color:#0a1a0a;cursor:pointer;font-family:'Kanit',sans-serif;letter-spacing:2px;box-shadow:0 0 40px rgba(57,255,20,0.55),inset 0 1px 0 rgba(255,255,255,0.5);animation:pg 2s ease-in-out infinite;touch-action:manipulation;}
@keyframes pg{0%,100%{box-shadow:0 0 40px rgba(57,255,20,0.55),inset 0 1px 0 rgba(255,255,255,0.5);}50%{box-shadow:0 0 65px rgba(57,255,20,0.9),inset 0 1px 0 rgba(255,255,255,0.5);}}
.sf{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px;font-size:11px;color:var(--td);}
.sf>span{background:rgba(255,255,255,0.06);padding:5px 12px;border-radius:10px;border:1px solid var(--border);}

<script>
"use strict";
/* ========== AUDIO ENGINE ========== */
const Audio=(()=>{
let ctx=null,mg=null,bg=null,reverb=null,delay=null,filter=null;
let en=true,mo=false,mt=null,ms=0,currentTrack=null;
function init(){
  if(ctx)return;
  try{
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    mg=ctx.createGain();mg.gain.value=0.9;mg.connect(ctx.destination);
    filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=8000;filter.Q.value=0.7;filter.connect(mg);
    const conv=ctx.createConvolver();
    const len=Math.floor(ctx.sampleRate*1.6);
    const imp=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch);for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}}
    conv.buffer=imp;
    const rg=ctx.createGain();rg.gain.value=0.30;conv.connect(rg);rg.connect(mg);reverb=conv;
    delay=ctx.createDelay(0.8);delay.delayTime.value=0.24;
    const dg=ctx.createGain();dg.gain.value=0.16;
    const dfb=ctx.createGain();dfb.gain.value=0.30;
    delay.connect(dfb);dfb.connect(delay);delay.connect(dg);dg.connect(mg);
    bg=ctx.createGain();bg.gain.value=0.18;bg.connect(filter);
  }catch(e){console.warn('Audio init:',e);}
}
function resume(){try{if(ctx&&ctx.state==='suspended')ctx.resume();}catch(e){}}
function tone(f,t,d,v,dest,del,useRev){
  if(!ctx||!en)return;
  try{
    const o=ctx.createOscillator(),g=ctx.createGain();
    const t0=ctx.currentTime+(del||0);
    o.type=t||'sine';o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(v||0.06,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(dest||mg);
    if(useRev&&reverb)g.connect(reverb);
    o.start(t0);o.stop(t0+d+0.02);
  }catch(e){}
}
function superSaw(f,dur,vol,dest){
  if(!ctx||!en)return;
  try{
    const t0=ctx.currentTime,g=ctx.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    g.connect(dest||mg);
    [-14,-7,0,7,14].forEach(dt=>{
      const o=ctx.createOscillator();
      o.type='sawtooth';
      o.frequency.setValueAtTime(f*Math.pow(2,dt/1200),t0);
      o.connect(g);o.start(t0);o.stop(t0+dur+0.02);
    });
    if(reverb)g.connect(reverb);
  }catch(e){}
}
function sweep(f1,f2,t,d,v,dest){
  if(!ctx||!en)return;
  try{
    const o=ctx.createOscillator(),g=ctx.createGain(),t0=ctx.currentTime;
    o.type=t;o.frequency.setValueAtTime(f1,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);
    g.gain.setValueAtTime(v,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(g);g.connect(dest||mg);
    o.start(t0);o.stop(t0+d+0.02);
  }catch(e){}
}
function noise(d,v,freq){
  if(!ctx||!en)return;
  try{
    const b=ctx.createBuffer(1,Math.max(1,Math.floor(ctx.sampleRate*d)),ctx.sampleRate),ch=b.getChannelData(0);
    for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
    const s=ctx.createBufferSource(),g=ctx.createGain();
    s.buffer=b;g.gain.value=v;
    if(freq){const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.5;s.connect(f);f.connect(g);}
    else s.connect(g);
    g.connect(mg);
    if(reverb)g.connect(reverb);
    s.start();
  }catch(e){}
}
const sfx={
  click:()=>tone(700,'sine',0.08,0.10,null,0,true),
  correct:()=>{[659,880,1108,1318].forEach((f,i)=>tone(f,'triangle',0.18,0.12,null,i*0.055,true));superSaw(880,0.3,0.035);},
  wrong:()=>{tone(200,'sawtooth',0.2,0.12);tone(140,'sawtooth',0.28,0.11,null,0.09);noise(0.15,0.06,200);},
  crit:()=>{sweep(500,1800,'square',0.2,0.14);[880,1320,1760].forEach((f,i)=>tone(f,'triangle',0.24,0.11,null,i*0.04,true));noise(0.2,0.07,3000);},
  level:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,'triangle',0.22,0.13,null,i*0.08,true));superSaw(440,0.5,0.045);},
  win:()=>{[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,'triangle',0.25,0.14,null,i*0.09,true));superSaw(523,0.8,0.055);},
  lose:()=>{[420,340,270,200,150].forEach((f,i)=>tone(f,'sawtooth',0.24,0.11,null,i*0.1,true));},
  hit:()=>{noise(0.08,0.09,150);tone(160,'square',0.08,0.09);},
  heal:()=>{tone(880,'sine',0.14,0.10);tone(1320,'sine',0.2,0.10,null,0.06,true);tone(1760,'sine',0.14,0.07,null,0.14,true);},
  gold:()=>{tone(1400,'triangle',0.08,0.09);tone(2100,'triangle',0.12,0.09,null,0.06,true);},
  combo:(n)=>{const b=500+Math.min((n||1)*90,1100);tone(b,'square',0.1,0.09);tone(b*1.5,'square',0.1,0.07,null,0.05,true);},
  skillCast:()=>{sweep(200,900,'sawtooth',0.2,0.11);tone(1200,'square',0.15,0.09,null,0.15,true);},
  shield:()=>{tone(400,'sine',0.2,0.10);tone(600,'sine',0.25,0.09,null,0.08,true);},
  dodge:()=>{sweep(900,300,'sine',0.15,0.10);noise(0.1,0.06,800);},
  tick_low:()=>tone(1800,'square',0.05,0.08),
  bossRoar:()=>{sweep(120,60,'sawtooth',0.5,0.16);noise(0.4,0.11,150);},
  comboMilestone:()=>{[660,880,1100,1320,1760].forEach((f,i)=>tone(f,'square',0.12,0.11,null,i*0.06,true));},
  buttonError:()=>{tone(300,'square',0.1,0.11);tone(200,'square',0.15,0.10,null,0.06);},
  lifesteal:()=>{tone(1200,'sine',0.1,0.09);tone(1600,'sine',0.14,0.08,null,0.05,true);},
  levelUpBig:()=>{[440,554,659,880,1108,1318,1760].forEach((f,i)=>tone(f,'triangle',0.26,0.15,null,i*0.09,true));superSaw(440,0.9,0.055);},
  gachaRoll:()=>{sweep(400,1200,'sine',0.3,0.11);},
  drop:()=>{tone(1800,'triangle',0.12,0.11);tone(2400,'triangle',0.16,0.11,null,0.08,true);},
  rareDrop:()=>{[880,1100,1320,1760,2200].forEach((f,i)=>tone(f,'triangle',0.22,0.13,null,i*0.1,true));},
  levelComplete:()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,'triangle',0.28,0.14,null,i*0.11,true));superSaw(523,1.0,0.065);}
};
const scale=[220,246.94,261.63,293.66,329.63,349.23,392.00,440,493.88,523.25,587.33];
const bass=[110,110,164.81,146.83,110,110,98,130.81];
const trackA={name:'calm',tempo:100,notes:[0,2,4,7,4,2,0,-5]};
const trackB={name:'battle',tempo:130,notes:[0,2,4,5,7,5,4,2]};
const trackC={name:'boss',tempo:150,notes:[0,3,5,7,10,7,5,3]};
function startMusic(tempo,track){
  if(!ctx||mo||!en)return;
  mo=true;ms=0;
  const t=track||trackB;
  const bpm=tempo||t.tempo;
  const stepMs=60000/bpm/2;
  currentTrack=t.name;
  mt=setInterval(()=>{
    if(!ctx||!en)return;
    const s=ms%16;
    const n=t.notes[Math.floor(ms/2)%t.notes.length];
    const f=scale[(n+12)%scale.length];
    if(s%2===0){tone(f,'square',0.16,0.08,bg);tone(f*1.005,'square',0.16,0.06,bg,0.004);}
    if(s%4===0)tone(scale[(n+7+12)%scale.length],'triangle',0.22,0.06,bg);
    if(s%8===2)tone(scale[(n+4+12)%scale.length],'sine',0.2,0.05,bg);
    if(s%4===0)tone(bass[(s/4)%bass.length],'triangle',0.38,0.12,bg);
    if(s%4===0)sweep(140,50,'sine',0.1,0.09);
    if(s%2===1)noise(0.03,0.015,4000);
    if(s===4||s===12){noise(0.05,0.04,800);tone(180,'triangle',0.05,0.04);}
    ms++;
  },stepMs);
}
function stopMusic(){if(mt)clearInterval(mt);mt=null;mo=false;currentTrack=null;}
function setTrack(name){
  if(!en)return;
  const tracks={calm:trackA,battle:trackB,boss:trackC};
  const t=tracks[name];
  if(!t)return;
  stopMusic();
  startMusic(t.tempo,t);
}
function setEnabled(v){en=v;if(mg)mg.gain.value=v?0.9:0;}
return{init,resume,sfx,startMusic,stopMusic,setTrack,setEnabled,isEnabled:()=>en,currentTrack:()=>currentTrack};
})();

/* ========== PARTICLES ========== */
const Particles=(()=>{
const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
let W=0,H=0,dpr=1;
const sparkle=[],trail=[],glow=[],debris=[],stars=[];
const MAX_SPARKLE=200,MAX_TRAIL=120,MAX_GLOW=60,MAX_DEBRIS=150;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  initStars();
}
function initStars(){
  stars.length=0;
  const n=Math.floor(W*H/10000);
  for(let i=0;i<n;i++){
    stars.push({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.6+0.2,
      a:Math.random(),da:(Math.random()*0.025+0.005)*(Math.random()<0.5?-1:1),
      color:['#a0d8ff','#ffd0f0','#d0a0ff','#fff'][Math.floor(Math.random()*4)]
    });
  }
}
function burst(x,y,o){
  o=o||{};
  const n=o.count||20;
  const colors=o.colors||['#00f0ff','#ff006e','#ffe600','#39ff14','#b537f2'];
  const speed=o.speed||4;
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=speed*(0.4+Math.random()*0.9);
    const col=colors[Math.floor(Math.random()*colors.length)];
    const vx=Math.cos(ang)*sp,vy=Math.sin(ang)*sp-(o.upward||0);
    if(sparkle.length<MAX_SPARKLE){
      sparkle.push({x,y,vx,vy,life:1,decay:0.018+Math.random()*0.025,size:o.size||(1.5+Math.random()*3),color:col,gravity:o.gravity!==undefined?o.gravity:0.10});
    }
    if(trail.length<MAX_TRAIL&&i%2===0){
      trail.push({x,y,px:x,py:y,life:1,decay:0.02,size:o.size||2.5,color:col});
    }
    if(glow.length<MAX_GLOW&&i%4===0){
      glow.push({x,y,life:1,decay:0.012,size:(o.size||3)*4,color:col});
    }
    if(debris.length<MAX_DEBRIS&&i%3===0){
      debris.push({x,y,vx:vx*0.7,vy:vy*0.7-1,life:1,decay:0.008,size:1+Math.random()*2,color:col,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.3});
    }
  }
}
function update(){
  for(let i=sparkle.length-1;i>=0;i--){const p=sparkle[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.vx*=0.985;p.vy*=0.985;p.life-=p.decay;if(p.life<=0)sparkle.splice(i,1);}
  for(let i=trail.length-1;i>=0;i--){const p=trail[i];p.px=p.x;p.py=p.y;p.x+=p.vx||0;p.y+=p.vy||0;p.life-=p.decay;if(p.life<=0)trail.splice(i,1);}
  for(let i=glow.length-1;i>=0;i--){const p=glow[i];p.life-=p.decay;p.size+=0.8;if(p.life<=0)glow.splice(i,1);}
  for(let i=debris.length-1;i>=0;i--){const p=debris[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.vx*=0.96;p.vy*=0.96;p.rot+=p.vr;p.life-=p.decay;if(p.life<=0)debris.splice(i,1);}
  for(const s of stars){s.a+=s.da;if(s.a<=0||s.a>=1)s.da=-s.da;s.a=Math.max(0.05,Math.min(1,s.a));}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const s of stars){ctx.globalAlpha=s.a*0.5;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
  for(const p of glow){ctx.globalAlpha=p.life*0.35;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);g.addColorStop(0,p.color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}
  for(const p of sparkle){ctx.globalAlpha=Math.max(0,p.life);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2);g.addColorStop(0,p.color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2,0,Math.PI*2);ctx.fill();}

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a;};
const lcm=(a,b)=>Math.abs(a*b)/(gcd(a,b)||1);
const simplify=(n,d)=>{const g=gcd(n,d)||1;return[n/g,d/g];};
const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true;};
const factorial=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r;};
const nCr=(n,r)=>r>n?0:factorial(n)/(factorial(r)*factorial(n-r));
const nPr=(n,r)=>r>n?0:factorial(n)/factorial(n-r);

function parseFraction(s){s=String(s).trim().replace(/\s+/g,'');const m=s.match(/^(-?\d+)\/(-?\d+)$/);if(m&&parseFloat(m[2])!==0)return parseFloat(m[1])/parseFloat(m[2]);const m2=s.match(/^(-?\d+)$/);if(m2)return parseFloat(s);return null;}
function parsePair(s){const p=String(s).split(',').map(x=>x.trim());if(p.length!==2)return null;const a=parseFloat(p[0]),b=parseFloat(p[1]);if(isNaN(a)||isNaN(b))return null;return[a,b];}
function parseRadical(s){s=String(s).trim().replace(/\s+/g,'');const m=s.match(/^(-?\d*)√(\d+)$/);if(!m)return null;let c;if(m[1]===''||m[1]==='+')c=1;else if(m[1]==='-')c=-1;else c=parseFloat(m[1]);if(isNaN(c))return null;const r=parseFloat(m[2]);if(isNaN(r))return null;return{coef:c,rad:r,value:c*Math.sqrt(r)};}
function safeEval(expr){if(!expr)return null;if(/[√,]/.test(expr))return null;let js=String(expr).replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/−/g,'-');if(!/^[\d\s\+\-\*\/\.\(\)]+$/.test(js))return null;if(!/\d/.test(js))return null;if(/\*{3,}/.test(js))return null;try{const r=Function('"use strict";return ('+js+')')();if(typeof r!=='number'||!isFinite(r))return null;return r;}catch(e){return null;}}
function answersMatch(user,correct){
  if(user===undefined||user===null)return false;
  const ru=String(user).trim(),rc=String(correct).trim();
  if(!ru)return false;
  const u=ru.replace(/\s+/g,''),c=rc.replace(/\s+/g,'');
  const T=0.011;
  if(u.toLowerCase()===c.toLowerCase())return true;
  const ue=safeEval(u),ce=safeEval(c);
  if(ue!==null&&ce!==null&&Math.abs(ue-ce)<=T)return true;
  const un=/√/.test(u)?NaN:parseFloat(u),cn=/√/.test(c)?NaN:parseFloat(c);
  if(!isNaN(un)&&!isNaN(cn)&&Math.abs(un-cn)<=T)return true;
  const uf=parseFraction(u),cf=parseFraction(c);
  if(uf!==null&&cf!==null&&Math.abs(uf-cf)<=T)return true;
  if(uf!==null&&!isNaN(cn)&&Math.abs(uf-cn)<=T)return true;
  if(cf!==null&&!isNaN(un)&&Math.abs(cf-un)<=T)return true;
  const ur=parseRadical(u),cr=parseRadical(c);
  if(ur&&cr&&Math.abs(ur.value-cr.value)<=T)return true;
  if(ur&&!isNaN(cn)&&Math.abs(ur.value-cn)<=T)return true;
  if(cr&&!isNaN(un)&&Math.abs(cr.value-un)<=T)return true;
  if(ur&&ce!==null&&Math.abs(ur.value-ce)<=T)return true;
  if(cr&&ue!==null&&Math.abs(cr.value-ue)<=T)return true;
  const up=parsePair(u),cp=parsePair(c);
  if(up&&cp&&Math.abs(up[0]-cp[0])<=T&&Math.abs(up[1]-cp[1])<=T)return true;
  return false;
}

let skillCD={s1:0,s2:0,s3:0},skillUses={s1:0,s2:0,s3:0},skillTick=null;
let activeFx={},battleSession=0,battleEnded=false,pendingTs=[],modalAuto=null,isSubmitting=false;

function schedule(fn,ms){const id=setTimeout(()=>{pendingTs=pendingTs.filter(t=>t!==id);try{fn();}catch(e){}},ms);pendingTs.push(id);return id;}
function clearTs(){pendingTs.forEach(t=>clearTimeout(t));pendingTs=[];}
function clearModalAuto(){if(modalAuto){clearTimeout(modalAuto);modalAuto=null;}}
function getClass(){return BaseClasses[state.pclass]||AdvanceClasses[state.pclass]||BaseClasses.warrior;}
function getPetBonus(){if(!state.epet||!Pets[state.epet])return{dmg:0,crit:0,combo:0,hp:0};const p=Pets[state.epet];const b={dmg:0,crit:0,combo:0,hp:0};if(p.bonus==='dmg')b.dmg=p.amt;else if(p.bonus==='crit')b.crit=p.amt;else if(p.bonus==='combo')b.combo=p.amt;else if(p.bonus==='hp')b.hp=p.amt;else if(p.bonus==='both'){b.dmg=p.amt;b.crit=p.amt;}else if(p.bonus==='all'){b.dmg=p.amt;b.crit=p.amt;b.combo=p.amt;}return b;}
function getSpecialBonus(){const b={treasureTime:0,treasureCoins:0,amathScore:1,amathRack:0,chessBonus:0};const cd=getClass();if(cd&&cd.special){for(const k in cd.special){if(k==='amathScore')b[k]*=cd.special[k];else if(k==='amathRack')b[k]+=cd.special[k];else b[k]+=cd.special[k];}}if(state.epet&&Pets[state.epet]&&Pets[state.epet].special){const ps=Pets[state.epet].special;for(const k in ps){if(k==='amathScore')b[k]*=ps[k];else if(k==='amathRack')b[k]+=ps[k];else b[k]+=ps[k];}}return b;}
function getSkillEffects(){const ef={dmg:0,hp:0,crit:0,cmul:0,dodge:0,lifesteal:0,reflect:0,exp:0,combo:0,gold:0,time:0};for(const branch in state.skillTree){const nodes=SkillTree[branch].nodes;for(const node of nodes){if(state.skillTree[branch][node.id]){for(const k in node.effect)ef[k]=(ef[k]||0)+node.effect[k];}}}for(const p of state.passives){if(p==='lucky')ef.crit+=0.10;if(p==='scholar')ef.exp+=0.20;if(p==='sniper')ef.dmg+=0.15;if(p==='ironWall')ef.hp+=30;if(p==='timeBender')ef.time+=10;if(p==='coinMagnet')ef.gold+=0.25;if(p==='dodgeMaster')ef.dodge+=0.10;if(p==='critMaster')ef.cmul+=1;if(p==='veteran')ef.exp+=0.50;if(p==='goldRush')ef.gold+=0.50;if(p==='legendary'){ef.dmg+=0.10;ef.crit+=0.10;ef.exp+=0.10;ef.gold+=0.10;}}return ef;}
function getMaxHp(){const se=getSkillEffects();const pb=getPetBonus();return 100+(getClass().hp||0)+(state.player.plv-1)*5+state.inv.s*12+state.inv.h*5+state.inv.a*8+state.inv.p*6+state.inv.belt*10+state.player.rbonus*25+(pb.hp||0)+se.hp;}
function getWeaponMul(){return 1+state.inv.w*0.20;}

const $=id=>document.getElementById(id);
const contentEl=$('gameContent');
const numpadContainer=$('numpadContainer');
const numpadGrid=$('numpadGrid');

function buildNumpad(){const keys=[{k:'7',t:'7'},{k:'8',t:'8'},{k:'9',t:'9'},{k:'/',t:'÷',cls:'op',ins:'/'},{k:'√',t:'√',cls:'op',ins:'√'},{k:'4',t:'4'},{k:'5',t:'5'},{k:'6',t:'6'},{k:'*',t:'×',cls:'op',ins:'×'},{k:'^',t:'^',cls:'op',ins:'^'},{k:'1',t:'1'},{k:'2',t:'2'},{k:'3',t:'3'},{k:'-',t:'−',cls:'op',ins:'-'},{k:'+',t:'+',cls:'op',ins:'+'},{k:'0',t:'0'},{k:'.',t:'.',ins:'.'},{k:',',t:',',cls:'op',ins:','},{k:'back',t:'⌫',cls:'back'},{k:'submit',t:'✓',cls:'submit'}];numpadGrid.innerHTML=keys.map(k=>'<button class="npb '+(k.cls||'')+'" data-key="'+k.k+'" data-ins="'+(k.ins||k.k)+'">'+k.t+'</button>').join('');}
buildNumpad();
numpadGrid.addEventListener('click',e=>{const b=e.target.closest('.npb');if(!b||b.disabled)return;const key=b.dataset.key,ins=b.dataset.ins||key,inp=$('ansInp');if(!inp||inp.disabled)return;Audio.resume();if(key==='back'){inp.value=inp.value.slice(0,-1);}else if(key==='submit'){submitAnswer();return;}else{if(inp.value.length<24)inp.value+=ins;}Audio.sfx.click();updateNumpadSubmitState();},{passive:false});
function updateNumpadSubmitState(){const inp=$('ansInp');if(!inp)return;const btn=numpadGrid.querySelector('[data-key="submit"]');if(!btn)return;btn.disabled=!inp.value.trim()||inp.disabled;}
function showNumpad(s){numpadContainer.classList.toggle('active',!!s);}
function hideNumpad(){numpadContainer.classList.remove('active');}
function showModal(t,b,btns){modalContainer.innerHTML='<div class="mo"><div class="mc"><div class="mt">'+t+'</div><div class="mb">'+b+'</div><div class="fc">'+(btns||[{label:'ตกลง',cls:'btn',action:'closeModal()'}]).map(x=>'<button class="btn '+(x.cls||'')+' wf" onclick="'+(x.action||'closeModal()')+'">'+x.label+'</button>').join('')+'</div></div></div>';}
function closeModal(){modalContainer.innerHTML='';}

function go(screen){
if(battleTimer){clearInterval(battleTimer);battleTimer=null;}
if(skillTick){clearInterval(skillTick);skillTick=null;}
clearTs();clearModalAuto();closeModal();Audio.stopMusic();hideNumpad();isSubmitting=false;
currentScreen=screen;if(screen!=='battle'){battleSession++;battleEnded=false;}
try{switch(screen){
case'menu':renderMenu();break;
case'chapters':renderChapters();break;
case'battle':renderBattle();break;
case'inventory':renderInventory();break;
case'shop':renderShop();break;
case'petshop':renderPetShop();break;
case'gachaPet':renderGacha('pet');break;
case'gachaClass':renderGacha('class');break;
case'upgrade':renderUpgrade();break;
case'class':renderClassSelect();break;
case'rebirth':renderRebirth();break;
case'stats':renderStats();break;
case'settings':renderSettings();break;
case'modes':renderModeMenu();break;
case'skilltree':renderSkillTree();break;
case'afk':renderAFK();break;
case'treasureSetup':renderTreasureSetup();break;
case'treasure':if(window.__treasure)renderTreasure();break;
case'amath':if(amathState)renderAMath();break;
case'chess':if(chessState)renderChess();break;
default:renderMenu();
}}catch(e){console.error('render error:',e);contentEl.innerHTML='<div class="tc" style="padding:40px 20px"><div style="font-size:48px">⚠️</div><div style="margin:16px 0">เกิดข้อผิดพลาด</div><button class="btn mt3" onclick="go(\'menu\')">กลับเมนู</button></div>';}
contentEl.scrollTop=0;}

const wrong=(state.wrongLog||[]).length;

'<button class="btn btn-o wf mt2" onclick="go(\'petshop\')">🐾 สัตว์เลี้ยง</button>'+
'<button class="btn btn-gold wf mt2" onclick="go(\'gachaPet\')">🎰 กาชาสัตว์ (200🪙)</button>'+
'<button class="btn btn-p wf mt2" onclick="go(\'gachaClass\')">💎 กาชาคลาส (500🪙)</button>'+

'<button class="btn btn-r wf mt2" onclick="go(\'rebirth\')">💀 เกิดใหม่</button>'+
'<button class="btn btn-o wf mt2" onclick="go(\'settings\')">⚙️ ตั้งค่า</button>';
}

function renderChapters(){
const grades=['ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'];
let h='<h3>⚔️ แผนที่ · 60 บท</h3>';
grades.forEach(g=>{
h+='<h4>📚 '+g+'</h4>';
const list=Chapters.filter(c=>c.grade===g);
list.forEach(ch=>{
const done=(state.completed[ch.id]||[]).length;
h+='<div class="chc"><div class="chh"><div class="chi" style="border-color:'+ch.color+';color:'+ch.color+'">'+ch.icon+'</div><div class="chn"><div class="chname">บทที่ '+ch.id+': '+ch.name+'</div><div class="chprog">'+done+'/5 ด่าน · บอส '+ch.boss+'</div><div class="pb mt1"><div class="pbf" style="width:'+(done/5*100)+'%"></div></div></div><button class="btn btn-sm btn-o" onclick="showSummary('+ch.id+')">📖</button></div><div class="llist">';
for(let l=1;l<=5;l++){const c=isCompleted(ch.id,l);h+='<button class="lbtn '+(c?'done':'')+'" onclick="startBattle('+ch.id+','+l+')">'+(l===5?'👑':'')+' ด.'+l+'</button>';}
h+='</div></div>';
});});
h+='<button class="btn btn-o wf mt3" onclick="go(\'menu\')">🔙 กลับ</button>';
contentEl.innerHTML=h;
}
function isCompleted(ch,lv){return(state.completed[ch]||[]).includes(lv);}
function showSummary(chId){const ch=Chapters.find(c=>c.id===chId);if(!ch||!ch.summary)return;const s=ch.summary;
showModal('📖 '+ch.name,'<div style="font-size:13px;line-height:1.7;color:#fff"><b style="color:var(--ny)">📌 ภาพรวม:</b> '+s.s+'</div><h4>📐 สูตรสำคัญ</h4>'+s.formulas.map(f=>'<div class="step">'+f+'</div>').join('')+'<h4>💡 เทคนิค</h4>'+s.tips.map(t=>'<div class="step">• '+t+'</div>').join('')+'<h4>⚠️ ตัวอย่าง</h4>'+s.common.map(c=>'<div class="step">• '+c+'</div>').join(''),[{label:'เข้าใจแล้ว',cls:'btn-g',action:'closeModal()'}]);}

function renderBattle(){
const cd=getClass();
const ch=Chapters.find(c=>c.id===state.player.ch)||Chapters[0];
const bEmoji=state.player.lv===5?ch.boss:'👾';
const pe=state.epet&&Pets[state.epet]?'<span style="font-size:14px">'+Pets[state.epet].emoji+'</span>':'';
const s3=cd.s3?'<button class="btn btn-sm btn-pur" id="btnS3" onclick="useSkill(\'s3\')"></button>':'';
contentEl.innerHTML='<div class="bts" id="battleScene"><div class="sbar mb2"><span class="bdg bdg-b">'+ch.grade+' · '+ch.name+' ด.'+state.player.lv+'</span><span class="bdg bdg-r" id="comboBadge">🔥0</span></div><div class="crow"><div class="cbat"><div class="ed" id="pEmoji">'+cd.emoji+'</div><div class="cbname">'+state.player.name+pe+'</div><div class="hpo"><div class="hpi" id="pHp" style="width:100%"></div></div><div class="hpt">❤️ <span id="pHpTxt">0/0</span></div></div><div class="vs">VS</div><div class="cbat"><div class="ed" id="bEmoji">'+bEmoji+'</div><div class="cbname boss">บอส Lv.'+state.player.lv+'</div><div class="hpo"><div class="hpi bh" id="bHp" style="width:100%"></div></div><div class="hpt">❤️ <span id="bHpTxt">0/0</span></div></div></div><div class="tbo"><div class="tbi" id="tBar" style="width:100%"></div></div><div class="tbt" id="tTxt">⏱ 30s</div></div><div class="qp"><div class="qd" id="qTxt">กำลังสร้างโจทย์...</div><div class="air"><input class="ai" id="ansInp" placeholder="พิมพ์คำตอบ" inputmode="none" autocomplete="off"><button class="btn btn-g" id="subBtn" onclick="submitAnswer()" style="min-width:64px">✓</button></div><div class="cdisp" id="comboDisp"></div><div class="fbm" id="fbMsg"></div></div><div class="fr" style="gap:6px"><button class="btn btn-sm btn-y" id="btnS1" onclick="useSkill(\'s1\')"></button><button class="btn btn-sm btn-g" id="btnS2" onclick="useSkill(\'s2\')"></button>'+s3+'<button class="btn btn-sm btn-r" onclick="skipQuestion()">⏩</button></div>'+(state.inv.potion>0?'<button class="btn btn-sm btn-o wf mt2" data-item="potion" onclick="useItem(\'potion\')">🧪 โพชั่น ('+state.inv.potion+')</button>':'')+(state.inv.sp>0?'<button class="btn btn-sm btn-y wf mt1" data-item="sp" onclick="useItem(\'sp\')">💜 ซุปเปอร์ ('+state.inv.sp+')</button>':'')+'<button class="btn btn-sm btn-o wf mt2" onclick="fleeBattle()">🏃 หนี</button>';
setupBattle();showNumpad(true);
Audio.setTrack(state.player.lv===5?'boss':'battle');
}

function setupBattle(){
battleSession++;battleEnded=false;isSubmitting=false;
clearTs();clearModalAuto();
state.player.maxHp=getMaxHp();state.player.hp=state.player.maxHp;state.player.combo=0;state.player.shield=false;
skillCD={s1:0,s2:0,s3:0};skillUses={s1:0,s2:0,s3:0};activeFx={};
state.player.bossMaxHp=150+state.player.ch*20+state.player.lv*50+state.player.rebirth*40;
state.player.bossHp=state.player.bossMaxHp;
if(skillTick){clearInterval(skillTick);}
skillTick=setInterval(()=>{if(currentScreen!=='battle'||battleEnded){clearInterval(skillTick);skillTick=null;return;}updateSkillButtons();},400);
updateBattleUI();updateSkillButtons();nextQuestion();
const inp=$('ansInp');if(inp)inp.addEventListener('input',updateNumpadSubmitState);
updateNumpadSubmitState();
}
function updateBattleUI(){const a=$('pHp'),b=$('bHp'),at=$('pHpTxt'),bt=$('bHpTxt'),c=$('comboBadge');if(!a)return;a.style.width=Math.max(0,(state.player.hp/state.player.maxHp)*100)+'%';b.style.width=Math.max(0,(state.player.bossHp/state.player.bossMaxHp)*100)+'%';at.textContent=Math.max(0,Math.round(state.player.hp))+'/'+state.player.maxHp;bt.textContent=Math.max(0,Math.round(state.player.bossHp))+'/'+state.player.bossMaxHp;c.textContent='🔥'+state.player.combo;}
function updateSkillButtons(){const cd=getClass();const b1=$('btnS1'),b2=$('btnS2'),b3=$('btnS3');if(!b1||!b2)return;const now=Date.now();const r1=Math.max(0,Math.ceil((skillCD.s1-now)/1000)),r2=Math.max(0,Math.ceil((skillCD.s2-now)/1000)),r3=Math.max(0,Math.ceil((skillCD.s3-now)/1000));b1.innerHTML=cd.s1.n+(r1>0?' ⏳'+r1+'s':' ('+cd.s1.cost+'🪙)')+' '+(3-skillUses.s1);b2.innerHTML=cd.s2.n+(r2>0?' ⏳'+r2+'s':' ('+cd.s2.cost+'🪙)')+' '+(3-skillUses.s2);b1.disabled=r1>0||state.player.gold<cd.s1.cost||skillUses.s1>=3;b2.disabled=r2>0||state.player.gold<cd.s2.cost||skillUses.s2>=3;if(b3&&cd.s3){b3.innerHTML=cd.s3.n+(r3>0?' ⏳'+r3+'s':' ('+cd.s3.cost+'🪙)')+' '+(3-skillUses.s3);b3.disabled=r3>0||state.player.gold<cd.s3.cost||skillUses.s3>=3;}}
function startTimer(){if(battleTimer)clearInterval(battleTimer);const ss=battleSession;const se=getSkillEffects();const tt={1:60,2:55,3:50,4:45,5:40};timerMax=(tt[state.player.lv]||60)+se.time;timerLeft=timerMax;const bar=$('tBar'),txt=$('tTxt');if(bar)bar.style.width='100%';if(txt)txt.textContent='⏱ '+timerMax+'s';battleTimer=setInterval(()=>{if(ss!==battleSession||battleEnded){clearInterval(battleTimer);battleTimer=null;return;}timerLeft--;const pct=Math.max(0,(timerLeft/timerMax)*100);if(bar)bar.style.width=pct+'%';if(txt)txt.textContent='⏱ '+Math.max(0,timerLeft)+'s';if(timerLeft<=5&&timerLeft>0)Audio.sfx.tick_low();if(timerLeft<=0){clearInterval(battleTimer);battleTimer=null;timeUp();}},1000);}
function timeUp(){if(battleEnded)return;const inp=$('ansInp'),sb=$('subBtn');if(inp)inp.disabled=true;if(sb)sb.disabled=true;handleWrong(true);}
function nextQuestion(){
if(battleEnded||currentScreen!=='battle')return;
if(state.player.bossHp<=0||state.player.hp<=0){endBattle();return;}
isSubmitting=false;
currentQuest=generateQuestion(state.player.ch,state.player.lv);
const q=$('qTxt');if(q)q.textContent=currentQuest.q;
const inp=$('ansInp');if(inp){inp.value='';inp.disabled=false;inp.className='ai';try{inp.focus();}catch(e){}}
const sb=$('subBtn');if(sb)sb.disabled=false;
const fb=$('fbMsg');if(fb){fb.textContent='';fb.style.color='#c8c8e0';}
const cd=$('comboDisp');if(cd)cd.textContent='';
updateSkillButtons();updateNumpadSubmitState();startTimer();
}
function submitAnswer(){
if(isSubmitting||battleEnded)return;
if(battleTimer){clearInterval(battleTimer);battleTimer=null;}
const inp=$('ansInp');
if(!inp||!currentQuest||inp.disabled)return;
const ua=inp.value.trim();
if(!ua)return;
isSubmitting=true;inp.disabled=true;
const sb=$('subBtn');if(sb)sb.disabled=true;
updateNumpadSubmitState();
const correct=answersMatch(ua,currentQuest.a);
if(correct){inp.classList.add('cf');setTimeout(()=>{try{inp.classList.remove('cf');}catch(e){}},500);handleCorrect();}
else{inp.classList.add('wf');setTimeout(()=>{try{inp.classList.remove('wf');}catch(e){}},500);handleWrong(false);}
}
function handleCorrect(){
if(battleEnded||currentScreen!=='battle')return;
Audio.sfx.correct();
state.player.combo++;
if(state.player.combo>state.player.maxCombo)state.player.maxCombo=state.player.combo;
state.player.tc++;
const ch=state.player.ch;
if(!state.stats[ch])state.stats[ch]={correct:0,wrong:0};
state.stats[ch].correct++;
const se=getSkillEffects();
const cd=getClass();
const pb=getPetBonus();
let base=20+state.player.combo*5;
let dmg=Math.round(base*(cd.dmg||1)*getWeaponMul()*(1+pb.dmg+se.dmg));
if(state.player.combo>=5&&cd.comboMul)dmg=Math.round(dmg*cd.comboMul);
if(state.player.combo>=5&&pb.combo)dmg=Math.round(dmg*(1+pb.combo));
if(state.player.combo>=5&&se.combo)dmg=Math.round(dmg*(1+se.combo));
if(state.player.hp<state.player.maxHp*0.3&&state.passives.includes('berserkP'))dmg=Math.round(dmg*1.5);
if(state.player.combo>=10&&state.passives.includes('comboMaster'))dmg=Math.round(dmg*2);
const cc=0.06+(cd.crit||0)+pb.crit+se.crit+(state.inv.orb?0.20:0)+state.inv.ring*0.03;
let isCrit=Math.random()<cc;
if(activeFx.gcrit){isCrit=true;activeFx.gcrit=false;}
if(isCrit)dmg=Math.round(dmg*(cd.cmul||3)+se.cmul);
state.player.bossHp=Math.max(0,state.player.bossHp-dmg);
if(se.lifesteal>0){const hl=Math.round(dmg*se.lifesteal);state.player.hp=Math.min(state.player.maxHp,state.player.hp+hl);}
if(state.passives.includes('regen')){const hl=Math.round(state.player.maxHp*0.03);state.player.hp=Math.min(state.player.maxHp,state.player.hp+hl);}
const gold=Math.round((12+state.player.combo*3+state.player.lv*3+(isCrit?5:0))*(1+se.gold+state.inv.neck*0.05));
state.player.gold+=gold;
state.player.score+=Math.round(30+state.player.combo*5);
const bx=window.innerWidth/2+80,by=window.innerHeight*0.35;

else{floatText(bx,by,'-'+dmg,'dmg');Particles.burst(bx,by,{count:18,speed:5,colors:['#ffe600','#00f0ff']});}
floatText(bx,by+30,'+'+gold+'🪙','gold');Audio.sfx.gold();
