<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ ตำนานผู้กล้าแห่งจักรวาลคณิตศาสตร์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08081a;
            --surface: #10102a;
            --surface2: #181835;
            --text: #e2e2f0;
            --text2: #a0a0c0;
            --accent: #5b9cf5;
            --accent2: #f59b5b;
            --green: #4ade80;
            --red: #f87171;
            --yellow: #facc15;
            --purple: #c084fc;
            --gold: #f5c842;
            --pink: #f472b6;
            --border: #2a2a48;
            --radius: 14px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 25% 15%, rgba(91, 156, 245, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 80%, rgba(245, 155, 91, 0.04) 0%, transparent 55%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        .main-container {
            width: 100%;
            max-width: 750px;
            position: relative;
            z-index: 1;
        }
        .game-wrapper {
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .game-header {
            padding: 16px 20px;
            text-align: center;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }
        .creator-badge {
            display: inline-block;
            background: rgba(245, 200, 66, 0.12);
            border: 1px solid var(--gold);
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5em;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .subtitle {
            color: var(--text2);
            font-size: 10px;
            letter-spacing: 1px;
        }
        .game-content {
            padding: 14px;
            max-height: 76vh;
            overflow-y: auto;
        }
        .game-content::-webkit-scrollbar {
            width: 4px;
        }
        .game-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-success {
            background: var(--green);
            color: #08081a;
            font-weight: 700;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-warning {
            background: var(--yellow);
            color: #1a1a2e;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .btn-gold {
            background: linear-gradient(135deg, #f5c842, #d4a017);
            color: #1a1a2e;
            font-weight: 700;
        }
        .btn-pink {
            background: var(--pink);
            color: #fff;
        }
        .btn-sm {
            padding: 6px 11px;
            font-size: 10px;
            border-radius: 7px;
        }
        .btn-xs {
            padding: 4px 8px;
            font-size: 9px;
            border-radius: 5px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: var(--surface2);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 11px;
            color: var(--text2);
            flex-wrap: wrap;
            gap: 5px;
        }
        .stat-value {
            font-weight: 700;
            color: var(--accent);
        }
        .stat-gold {
            color: var(--gold);
            font-weight: 700;
        }
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge-gold {
            background: rgba(245, 200, 66, 0.15);
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .badge-green {
            background: rgba(74, 222, 128, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }
        .badge-blue {
            background: rgba(91, 156, 245, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .badge-red {
            background: rgba(248, 113, 113, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }
        .badge-purple {
            background: rgba(192, 132, 252, 0.15);
            color: var(--purple);
            border: 1px solid var(--purple);
        }
        .rank-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 14px;
            display: inline-block;
        }
        .rank-s {
            background: linear-gradient(135deg, #f5c842, #d4a017);
            color: #1a1a2e;
        }
        .rank-a {
            background: #f87171;
            color: #fff;
        }
        .rank-b {
            background: #5b9cf5;
            color: #fff;
        }
        .rank-c {
            background: #5a5a7a;
            color: #fff;
        }
        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .class-card {
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            position: relative;
        }
        .class-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .class-card.selected {
            border-color: var(--green);
            background: rgba(74, 222, 128, 0.05);
        }
        .class-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .class-emoji {
            font-size: 44px;
            display: block;
            margin-bottom: 4px;
        }
        .class-name {
            font-weight: 700;
            color: var(--text);
            font-size: 14px;
        }
        .class-desc {
            font-size: 9px;
            color: var(--text2);
            margin-top: 3px;
            line-height: 1.3;
        }
        .chapter-container {
            margin-bottom: 7px;
        }
        .chapter-header {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .chapter-header:hover {
            border-color: var(--accent);
        }
        .chapter-header.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chapter-icon {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .chapter-info {
            flex: 1;
        }
        .chapter-name {
            font-weight: 600;
            color: var(--text);
            font-size: 12px;
        }
        .chapter-progress {
            font-size: 9px;
            color: var(--text2);
        }
        .level-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 4px 0 0 46px;
        }
        .level-btn {
            padding: 7px 5px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Kanit', sans-serif;
        }
        .level-btn.completed {
            border-color: var(--green);
            background: rgba(74, 222, 128, 0.06);
        }
        .level-btn.locked {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        .level-btn.current {
            border-color: var(--gold);
            background: rgba(245, 200, 66, 0.06);
        }
        .battle-scene {
            background: var(--surface2);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            text-align: center;
            position: relative;
        }
        .emoji-display {
            font-size: 64px;
            display: inline-block;
            transition: transform 0.3s, opacity 0.3s;
            line-height: 1;
            user-select: none;
        }
        .emoji-display.shake {
            animation: emojiShake 0.4s ease-in-out;
        }
        .emoji-display.crit {
            animation: emojiCrit 0.5s ease-out;
        }
        @keyframes emojiShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-7px);
            }
            75% {
                transform: translateX(7px);
            }
        }
        @keyframes emojiCrit {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.7) rotate(-7deg);
            }
            60% {
                transform: scale(1.1) rotate(4deg);
            }
            100% {
                transform: scale(1) rotate(0);
            }
        }
        .combatants-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
            flex-wrap: wrap;
        }
        .combatant {
            text-align: center;
            min-width: 90px;
        }
        .combatant-name {
            color: var(--text);
            font-weight: 600;
            font-size: 12px;
            margin-top: 3px;
        }
        .combatant-name.boss {
            color: var(--red);
        }
        .hp-bar-outer {
            background: #1a1a30;
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 3px;
            width: 100%;
            max-width: 130px;
            margin-left: auto;
            margin-right: auto;
        }
        .hp-bar-inner {
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s;
            background: var(--accent);
        }
        .hp-bar-inner.boss-hp {
            background: var(--red);
        }
        .hp-text {
            font-size: 9px;
            color: var(--text2);
            margin-top: 1px;
        }
        .vs-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 20px;
            color: var(--gold);
        }
        .timer-bar-outer {
            background: #1a1a30;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 8px;
        }
        .timer-bar-inner {
            height: 100%;
            border-radius: 6px;
            transition: width 0.1s linear;
            background: var(--yellow);
        }
        .timer-text {
            font-size: 10px;
            color: var(--yellow);
            font-weight: 700;
            text-align: center;
            margin-top: 2px;
        }
        .question-panel {
            background: var(--surface2);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .question-display {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .answer-input-row {
            display: flex;
            gap: 6px;
        }
        .answer-input {
            flex: 1;
            padding: 10px 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            border-radius: 9px;
            border: 2px solid var(--border);
            background: #0d0d1a;
            color: var(--text);
            outline: none;
            font-family: 'Kanit', sans-serif;
        }
        .answer-input:focus {
            border-color: var(--accent);
        }
        .answer-input.correct-flash {
            border-color: var(--green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }
        .answer-input.wrong-flash {
            border-color: var(--red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }
        .combo-display {
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            margin-top: 6px;
            min-height: 20px;
            color: var(--gold);
        }
        .feedback-msg {
            font-size: 11px;
            text-align: center;
            margin-top: 4px;
            min-height: 14px;
            color: var(--text2);
        }
        .shop-item {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 11px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .gacha-card {
            background: var(--surface2);
            border: 2px solid var(--gold);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }
        .gacha-result {
            font-size: 56px;
            animation: gachaReveal 0.6s ease-out;
        }
        @keyframes gachaReveal {
            0% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.3) rotate(-8deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0);
            }
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow);
        }
        .story-box {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.08), rgba(91, 156, 245, 0.08));
            border: 2px solid var(--purple);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 10px;
            color: var(--text);
            font-style: italic;
            line-height: 1.6;
        }
        .equip-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: all 0.2s;
        }
        .flex-row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 9px;
        }
        .text-lg {
            font-size: 16px;
        }
        .mt-1 {
            margin-top: 3px;
        }
        .mt-2 {
            margin-top: 6px;
        }
        .mt-4 {
            margin-top: 12px;
        }
        .mb-2 {
            margin-bottom: 6px;
        }
        .mb-4 {
            margin-bottom: 12px;
        }
        .w-full {
            width: 100%;
        }
        @media (max-width: 500px) {
            .class-grid {
                grid-template-columns: 1fr;
            }
            .level-list {
                grid-template-columns: 1fr 1fr;
                padding-left: 0;
            }
            .emoji-display {
                font-size: 46px;
            }
            .game-title {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="game-wrapper" id="gameWrapper">
            <div class="game-header">
                <div class="creator-badge">⚡ ตะวันสุดหล่อ ⚡</div>
                <div class="game-title">MATH QUEST</div>
                <div class="subtitle">ตำนานผู้กล้าแห่งจักรวาลคณิตศาสตร์ | ม.1 - ม.6</div>
            </div>
            <div class="game-content" id="gameContent"></div>
        </div>
    </div>
    <div id="modalContainer"></div>
    <script>
        // ============================================
        // 🎮 MATH QUEST - ULTIMATE EDITION v4
        // ============================================
        let audioCtx = null;
        let bgMusicOsc = null;
        let bgMusicGain = null;
        let isMusicPlaying = false;

        function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }

        function playSound(f, t = 'sine', d = 0.14, v = 0.05) {
            try {
                initAudio();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = t;
                o.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(v, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + d);
            } catch (e) {}
        }

        function sfxClick() { playSound(550, 'sine', 0.07, 0.04); }

        function sfxCorrect() { playSound(650, 'triangle', 0.14, 0.07);
            setTimeout(() => playSound(1000, 'triangle', 0.14, 0.07), 90); }

        function sfxWrong() { playSound(130, 'sawtooth', 0.2, 0.04); }

        function sfxCrit() { playSound(300, 'square', 0.2, 0.06);
            setTimeout(() => playSound(750, 'square', 0.2, 0.09), 80); }

        function sfxWin() { [450, 650, 850, 1050].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.18, 0.07), i *
                110)); }

        function sfxPurchase() { playSound(850, 'triangle', 0.25, 0.08); }

        function sfxGacha() { [280, 480, 680, 880, 1080].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.18,
                0.07), i * 70)); }

        function startBgMusic() {
            if (isMusicPlaying) return;
            try {
                initAudio();
                bgMusicGain = audioCtx.createGain();
                bgMusicGain.gain.setValueAtTime(0.012, audioCtx.currentTime);
                bgMusicGain.connect(audioCtx.destination);
                bgMusicOsc = audioCtx.createOscillator();
                bgMusicOsc.type = 'triangle';
                bgMusicOsc.frequency.setValueAtTime(180, audioCtx.currentTime);
                bgMusicOsc.connect(bgMusicGain);
                bgMusicOsc.start();
                isMusicPlaying = true;
                let t = 0;
                const mod = () => {
                    if (!isMusicPlaying) return;
                    t += 0.07;
                    bgMusicOsc.frequency.setValueAtTime(180 + Math.sin(t) * 22, audioCtx.currentTime);
                    if (isMusicPlaying) requestAnimationFrame(mod);
                };
                mod();
            } catch (e) {}
        }

        function stopBgMusic() {
            try {
                if (bgMusicOsc) { bgMusicOsc.stop();
                    bgMusicOsc = null; }
                if (bgMusicGain) { bgMusicGain.disconnect();
                    bgMusicGain = null; }
                isMusicPlaying = false;
            } catch (e) {}
        }

        function spawnSparkle(x, y, emoji = '✨') {
            const s = document.createElement('div');
            s.style.cssText =
                `position:fixed;pointer-events:none;z-index:200;left:${x}px;top:${y}px;font-size:24px;animation:sparkleFloat 1.2s ease-out forwards;`;
            s.textContent = emoji;
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 1200);
        }
        const sparkleStyle = document.createElement('style');
        sparkleStyle.textContent =
            '@keyframes sparkleFloat{0%{transform:translateY(0) scale(0.3);opacity:1}100%{transform:translateY(-140px) scale(1.5);opacity:0}}';
        document.head.appendChild(sparkleStyle);

        function spawnBurst(x, y, n = 12) {
            const e = ['✨', '⭐', '💫', '🌟', '💥', '🔥', '💎', '🎉'];
            for (let i = 0; i < n; i++) setTimeout(() => spawnSparkle(x + (Math.random() - 0.5) * 160, y + (Math.random() -
                0.5) * 100, e[Math.floor(Math.random() * e.length)]), i * 30);
        }

        // ──────────────── GAME DATA ────────────────
        const gradeConfig = {
            1: { name: 'ม.1', chapters: ['จำนวนเต็มและทศนิยม', 'เศษส่วน', 'สมการเชิงเส้น', 'อัตราส่วนและร้อยละ',
                    'เรขาคณิตพื้นฐาน'
                ], icons: ['🔢', '🍕', '⚖️', '📊', '📐'], emoji: '🐣', bossEmoji: '🐢' },
            2: { name: 'ม.2', chapters: ['เลขยกกำลัง', 'พหุนาม', 'การแยกตัวประกอบ', 'ความเท่ากันทุกประการ', 'ทฤษฎีพีทาโกรัส'],
                icons: ['⚡', '📐', '🧩', '🔷', '📏'], emoji: '🐥', bossEmoji: '🐉' },

            } else {
                if (c === 1) { const n = Math.floor(Math.random() * 3) + 2,
                        x = Math.floor(Math.random() * 3) + 2;
                    q = `อนุพันธ์ของ ${n}x^${x} ที่ x=2 คือ?`;
                    a = n * x * (2 ** (x - 1));
                    h = 'd/dx(ax^n)=anx^(n-1)'; } else if (c === 2) { const nums = [Math.floor(Math.random() * 30) + 40, Math
                        .floor(Math.random() * 30) + 50, Math.floor(Math.random() * 30) + 60, Math.floor(Math.random() *
                            20) + 40, Math.floor(Math.random() * 20) + 30
                    ];
                    const s = [...nums].sort((a, b) => a - b);
                    q = `ข้อมูล:${nums.join(',')} จงหามัธยฐาน`;
                    a = s[2];
                    h = 'เรียงแล้วหาค่ากลาง'; } else if (c === 3) { q = 'ไพ่ 52 ใบ จั่ว 1 ใบ ความน่าจะเป็นได้ Ace? (ตอบเศษส่วน)';
                    a = '4/52';
                    h = '4/52=1/13'; } else if (c === 4) { const vals = [Math.floor(Math.random() * 10) + 5, Math.floor(Math
                            .random() * 10) + 10, Math.floor(Math.random() * 10) + 15, Math.floor(Math.random() * 5) + 8
                    ];
                    q = `ข้อมูล:${vals.join(',')} จงหาพิสัย`;
                    a = Math.max(...vals) - Math.min(...vals);
                    h = 'max-min'; } else { q = 'จงหาค่า ∫₀² 2x dx';
                    a = 4;
                    h = '[x²]₀²=4'; }
            }
            return { q, a: a.toString(), h };
        }

        function setupBattle() {
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCD = { s1: 0, s2: 0 };
            skillActive = { gcrit: false, dodge: false, cboost: false, stealth: false, reflect: false, berserk: false,
                drain: false };
            const baseHp = 150 + (player.grade * 40) + (player.chapter * 20) + (player.level * 50) + (player.rebirth * 30);
            player.bossMaxHp = baseHp;
            player.bossHp = baseHp;
            updateBattleUI();
            updateCDUI();
            nextQuestion();
            const inp = document.getElementById('answerInput');
            if (inp) setTimeout(() => inp.focus(), 300);
            showStoryIfNew();
        }

        function showStoryIfNew() {
            const key = `${player.grade}-${player.chapter}-${player.level}`;
            if (!storyShown[key]) {
                storyShown[key] = true;
                saveGame();
                const stories = [
                    '🌅 ณ หมู่บ้านเล็กๆ แห่งหนึ่ง... ผู้กล้าของเราเริ่มต้นการเดินทางทางคณิตศาสตร์',
                    '📚 ในห้องสมุดโบราณ มีตำราเลขยกกำลังซ่อนอยู่...',
                    '⚔️ เมื่อพหุนามปรากฏตัวขึ้น การต่อสู้ที่แท้จริงจึงเริ่มต้น!',
                    '🧩 การแยกตัวประกอบคือกุญแจสู่พลังที่ยิ่งใหญ่...',
                    '🔷 สามเหลี่ยมแห่งความจริงรอการพิสูจน์...',
                    '📏 ทฤษฎีบทพีทาโกรัสจะนำทางเรา...',
                    '🐉 มังกรแห่งเลขยกกำลังปรากฏตัว! จงเตรียมพร้อม!',
                ];
                const idx = (player.grade * 7 + player.chapter * 3 + player.level) % stories.length;
                showStoryBox(stories[idx]);
            }
        }

        function showStoryBox(text) {
            const box = document.getElementById('storyBox');
            if (box) { box.textContent = text;
                box.style.display = 'block';
                setTimeout(() => { if (box) box.style.display = 'none'; }, 4000); }
        }

        function nextQuestion() {
            if (player.bossHp <= 0 || player.hp <= 0) { endBattle(); return; }
            const cd = getCD();
            if (cd.regen && player.hp < player.maxHp) { player.hp = Math.min(player.maxHp, player.hp + cd.regen);
                updateBattleUI(); }
            currentQuestion = genQuestion(player.grade, player.chapter, player.level);
            const qd = document.getElementById('questionDisplay');
            if (qd) qd.innerHTML = currentQuestion.q;
            const inp = document.getElementById('answerInput');
            if (inp) { inp.value = '';
                inp.disabled = false;
                inp.className = 'answer-input';
                setTimeout(() => inp.focus(), 100); }
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('feedbackMsg').textContent = '';
            document.getElementById('comboDisplay').textContent = '';
            updateCDUI();
            startTimer();
        }

        function startTimer() {
            stopTimer();
            const limit = player.level === 3 ? 10 : player.level === 2 ? 13 : 16;
            timerRemaining = limit;
            updateTimerUI(limit);
            timerInterval = setInterval(() => {
                timerRemaining--;
                updateTimerUI(limit);
                if (timerRemaining <= 0) { stopTimer();
                    timeUp(); }
            }, 1000);
        }

        function stopTimer() { if (timerInterval) { clearInterval(timerInterval);
                timerInterval = null; } }

        function updateTimerUI(limit) {
            const bar = document.getElementById('timerBar');
            const txt = document.getElementById('timerText');
            if (bar) bar.style.width = Math.max(0, (timerRemaining / limit) * 100) + '%';
            if (txt) { txt.textContent = `⏱ ${timerRemaining}s`;
                txt.style.color = timerRemaining <= 3 ? 'var(--red)' : 'var(--yellow)'; }
        }

        function timeUp() {
            const inp = document.getElementById('answerInput');
            if (inp) inp.disabled = true;
            document.getElementById('submitBtn').disabled = true;
            handleWrongAnswer(null, true);
        }

        function submitAnswer() {
            stopTimer();
            const inp = document.getElementById('answerInput');
            if (!inp || !currentQuestion) return;
            const ua = inp.value.trim();
            if (ua === '') return;
            inp.disabled = true;
            document.getElementById('submitBtn').disabled = true;
            const ca = currentQuestion.a;
            let correct = ua === ca;
            if (!correct && !isNaN(parseFloat(ua)) && !isNaN(parseFloat(ca))) correct = Math.abs(parseFloat(ua) - parseFloat(
                ca)) < 0.09;
            if (correct) { inp.classList.add('correct-flash');
                setTimeout(() => inp.classList.remove('correct-flash'), 500);
                handleCorrect(inp); } else { inp.classList.add('wrong-flash');
                setTimeout(() => inp.classList.remove('wrong-flash'), 500);
                handleWrongAnswer(inp, false); }
        }

        function handleCorrect(inp) {
            sfxCorrect();
            player.combo++;
            player.tc++;
            if (player.combo > player.maxCombo) player.maxCombo = player.combo;
            const cd = getCD();
            const pb = getPetBonus();
            let dmg = 18 + player.combo * 4;
            dmg = Math.round(dmg * cd.dmgMul * getWeaponMul() * (1 + pb.dmg));
            if (player.combo >= 5 && cd.comboMul) dmg = Math.round(dmg * cd.comboMul);
            if (player.combo >= 5 && pb.combo > 0) dmg = Math.round(dmg * (1 + pb.combo));
            let critC = 0.06 + (cd.critBonus || 0) + pb.crit + (inventory.orb ? 0.2 : 0);
            let isCrit = Math.random() < critC;
            if (skillActive.gcrit) { isCrit = true;
                skillActive.gcrit = false; }
            if (skillActive.stealth) { isCrit = true;
                skillActive.stealth = false; }
            if (skillActive.berserk) dmg = Math.round(dmg * 2);
            if (isCrit) { dmg = Math.round(dmg * (cd.critMul || 3));
                sfxCrit();
                const be = document.getElementById('bossEmoji'); if (be) { be.classList.add('crit');
                    setTimeout(() => be.classList.remove('crit'), 500); } }
            if (skillActive.cboost && isCrit) { dmg = Math.round(dmg * (cd.skill1?.mul || 3));
                skillActive.cboost = false; }
            if (skillActive.drain) { const healAmt = Math.round(dmg * (cd.skill2?.healPct || 0.5));
                player.hp = Math.min(player.maxHp, player.hp + healAmt);
                skillActive.drain = false; }
            player.bossHp = Math.max(0, player.bossHp - dmg);
            const goldEarn = Math.round(5 + player.combo * 2 + player.level);
            addGold(goldEarn);
            player.score += Math.round(20 + player.combo * 4);
            if (inp) { const r = inp.getBoundingClientRect();
                spawnSparkle(r.left + r.width / 2, r.top, isCrit ? '💥' : '⚡'); }
            document.getElementById('feedbackMsg').textContent =
                `✅ถูก! DMG:${dmg}${isCrit?'💥คริ!':''} +${goldEarn}🪙`;
            document.getElementById('feedbackMsg').style.color = 'var(--green)';
            if (player.combo >= 3) { document.getElementById('comboDisplay').textContent = `🔥COMBO x${player.combo}!`;
                document.getElementById('comboBadge').textContent = `🔥${player.combo}`; }
            updateBattleUI();
            reduceCD();
            saveGame();
            setTimeout(nextQuestion, 1000);
        }

        function handleWrongAnswer(inp, isTimeUp) {
            sfxWrong();
            player.combo = 0;
            player.tw++;
            let dmgTaken = 10 + player.level * 3 + (isTimeUp ? 8 : 0);
            const cd = getCD();
            if (skillActive.dodge) { skillActive.dodge = false;
                dmgTaken = 0;
                document.getElementById('feedbackMsg').textContent = '💨หลบได้!'; } else if (skillActive.stealth && Math
                .random() < 0.5) { skillActive.stealth = false;
                dmgTaken = 0;
                document.getElementById('feedbackMsg').textContent = '💨ล่องหนหลบ!'; } else if (player.shield) {
                player.shield = false;
                if (skillActive.reflect) { skillActive.reflect = false;
                    player.bossHp = Math.max(0, player.bossHp - 20);
                    document.getElementById('feedbackMsg').textContent = '🛡️สะท้อน20!'; } else { dmgTaken = 0;
                    document.getElementById('feedbackMsg').textContent = '🛡️ป้องกัน!'; }
            } else if (cd.dodgeChance && Math.random() < cd.dodgeChance) { dmgTaken = 0;
                document.getElementById('feedbackMsg').textContent = '💨หลบอัตโนมัติ!'; } else {
                player.hp = Math.max(0, player.hp - dmgTaken);
                document.getElementById('feedbackMsg').textContent =
                    `❌ผิด!${isTimeUp?'⏱หมดเวลา!':''} คำตอบ:${currentQuestion?.a} (-${dmgTaken}HP)`;
                document.getElementById('feedbackMsg').style.color = 'var(--red)';
            }
            document.getElementById('comboBadge').textContent = '🔥0';
            document.getElementById('comboDisplay').textContent = '';
            updateBattleUI();
            reduceCD();
            saveGame();
            setTimeout(nextQuestion, 1500);
        }

        function reduceCD() { if (skillCD.s1 > 0) skillCD.s1--; if (skillCD.s2 > 0) skillCD.s2--;
            updateCDUI(); }

        function updateCDUI() {
            const cd = getCD();
            const ind = document.getElementById('cdIndicator');
            if (ind) ind.textContent = (skillCD.s1 > 0 ? `${cd.skill1.name} CD${skillCD.s1} ` : '') + (skillCD.s2 > 0 ?
                `${cd.skill2.name} CD${skillCD.s2}` : '');
            const b1 = document.getElementById('btnS1');
            const b2 = document.getElementById('btnS2'); if (b1) b1.disabled = skillCD.s1 > 0 || player.gold < cd.skill1
                .cost; if (b2) b2.disabled = skillCD.s2 > 0 || player.gold < cd.skill2.cost;
        }

        function updateBattleUI() {
            const phb = document.getElementById('playerHpBar'),
                bhb = document.getElementById('bossHpBar');
            const pht = document.getElementById('playerHpText'),
                bht = document.getElementById('bossHpText');
            if (phb) phb.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            if (bhb) bhb.style.width = Math.max(0, (player.bossHp / player.bossMaxHp) * 100) + '%';
            if (pht) pht.textContent = `${player.hp}/${player.maxHp}`;
            if (bht) bht.textContent = `${player.bossHp}/${player.bossMaxHp}`;
            document.getElementById('comboBadge').textContent = `🔥${player.combo}`;
        }

        function useSkill(type) {
            const cd = getCD();
            if (type === 's1') { if (skillCD.s1 > 0 || !spendGold(cd.skill1.cost)) return;
                skillCD.s1 = cd.skill1.cooldown;
                sfxPurchase(); if (cd.skill1.type === 'gcrit') skillActive.gcrit = true; if (cd.skill1.type ===
                    'cboost') skillActive.cboost = true; if (cd.skill1.type === 'dmg') { const bd = Math.round(25 * (cd
                        .skill1.mul || 2));
                    player.bossHp = Math.max(0, player.bossHp - bd);
                    spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 8);
                    updateBattleUI(); } if (cd.skill1.type === 'dmgheal') { const bd = Math.round(25 * (cd.skill1.mul ||
                        2));
                    player.bossHp = Math.max(0, player.bossHp - bd);
                    player.hp = Math.min(player.maxHp, player.hp + (cd.skill1.heal || 30));
                    updateBattleUI(); } } else if (type === 's2') { if (skillCD.s2 > 0 || !spendGold(cd.skill2.cost))
                    return;
                skillCD.s2 = cd.skill2.cooldown;
                sfxPurchase(); if (cd.skill2.type === 'shield') player.shield = true; if (cd.skill2.type ===
                    'reflect') { player.shield = true;
                    skillActive.reflect = true; } if (cd.skill2.type === 'heal') { player.hp = Math.min(player.maxHp,
                        player.hp + cd.skill2.heal);
                    updateBattleUI(); } if (cd.skill2.type === 'dodge') skillActive.dodge = true; if (cd.skill2.type ===
                    'stealth') { skillActive.dodge = true;
                    skillActive.stealth = true; } if (cd.skill2.type === 'ult') { player.hp = player.maxHp;
                    player.bossHp = Math.max(0, player.bossHp - (cd.skill2.dmg || 80));
                    updateBattleUI();
                    spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 18); } if (cd.skill2.type === 'drain')
                    skillActive.drain = true; if (cd.skill2.type === 'berserk') skillActive.berserk = true; if (cd
                    .skill2.type === 'shieldheal') { player.shield = true;
                    player.hp = Math.min(player.maxHp, player.hp + (cd.skill2.heal || 25));
                    updateBattleUI(); } }
            updateCDUI();
            saveGame();
        }

        function skipQuestion() { stopTimer();
            player.hp = Math.max(0, player.hp - 10);
            player.combo = 0;
            updateBattleUI();
            reduceCD();
            document.getElementById('comboBadge').textContent = '🔥0';
            document.getElementById('feedbackMsg').textContent = '⏩ข้าม -10HP'; if (player.hp <= 0) endBattle();
            else nextQuestion(); }

        function usePotion() { if (inventory.potion <= 0) return;
            inventory.potion--;
            player.hp = player.maxHp;
            updateBattleUI();
            saveGame(); }

        function useSuperPotion() { if (inventory.superPotion <= 0) return;
            inventory.superPotion--;
            player.hp = player.maxHp;
            player.bossHp = Math.max(0, player.bossHp - 50);
            updateBattleUI();
            spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 10);
            saveGame(); }

        function endBattle() {
            stopTimer();
            stopBgMusic();
            if (player.bossHp <= 0) {
                sfxWin();
                const goldR = Math.round(30 + player.level * 20 + player.grade * 10);
                addGold(goldR);
                player.score += Math.round(80 + player.level * 40);
                unlockNext(player.grade, player.chapter, player.level);
                saveGame();
                spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 20);
                setTimeout(() => showModal('🎉ชัยชนะ!',
                    `พิชิต ม.${player.grade} บท${player.chapter} ด.${player.level}!\n+${goldR}🪙`,
                    () => renderScreen('grades')), 700);
            } else { player.gold = Math.max(0, player.gold - 15);
                saveGame();
                showModal('💀พ่ายแพ้', 'เสีย15🪙', () => renderScreen('grades')); }
        }

        function startBattle(g, c, l) {
            if (!isUnlocked(g, c, l)) { showModal('🔒', 'ยังปลดล็อคไม่ได้!', null); return; }
            player.grade = g;
            player.chapter = c;
            player.level = l;
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCD = { s1: 0, s2: 0 };
            skillActive = { gcrit: false, dodge: false, cboost: false, stealth: false, reflect: false, berserk: false,
                drain: false };
            renderScreen('battle');
        }

        function flee() { stopTimer();
            stopBgMusic();
            player.gold = Math.max(0, player.gold - 15);
            saveGame();
            renderScreen('grades'); }

        // ──────────────── SHOP & EQUIPMENT ────────────────
        function renderShop() {
            const wp = [0, 400, 900, 1800, 3200, 5500];
            const sp = [0, 350, 800, 1600, 2800, 4800];
            return `
            <h3 style="color:var(--text);text-align:center;">🛒 ร้านค้า</h3>
            <div class="stats-bar mb-4"><span>🪙<span class="stat-gold">${player.gold}</span></span><span>⚔️Lv.${inventory.weapon} 🛡️Lv.${inventory.shield}</span></div>
            <div class="shop-item"><div><b>🧪โพชั่น</b><div class="text-sm">ฟื้นHPเต็ม</div></div><button class="btn btn-sm btn-primary" onclick="buyItem('potion')">100🪙(มี:${inventory.potion})</button></div>
            <div class="shop-item"><div><b>💜ซุปเปอร์โพชั่น</b><div class="text-sm">ฟื้นเต็ม+DMG50</div></div><button class="btn btn-sm btn-primary" onclick="buyItem('sp')">380🪙(มี:${inventory.superPotion})</button></div>
            <div class="shop-item"><div><b>🔮ลูกแก้วคริ</b><div class="text-sm">คริ+20%</div></div><button class="btn btn-sm ${inventory.orb?'btn-success':'btn-primary'}" onclick="buyItem('orb')" ${inventory.orb?'disabled':''}>${inventory.orb?'✅':'900🪙'}</button></div>
            <button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙กลับ</button>`;
        }

        function buyItem(t) {
            const prices = { potion: 100, sp: 380, orb: 900 };
            if (spendGold(prices[t])) { if (t === 'potion') inventory.potion++; else if (t === 'sp') inventory
                .superPotion++; else inventory.orb = true;
                sfxPurchase();
                saveGame();
                renderScreen('shop'); } else showModal('⚠️', 'เหรียญไม่พอ!', null);
        }

        function renderEquipUpgrade() {
            const wCosts = [0, 400, 900, 1800, 3200, 5500];
            const sCosts = [0, 350, 800, 1600, 2800, 4800];
            const wl = inventory.weapon;
            const sl = inventory.shield;
            return `
            <h3 style="color:var(--text);text-align:center;">🔧 อัพเกรดอุปกรณ์</h3>
            <div class="stats-bar mb-4"><span>🪙<span class="stat-gold">${player.gold}</span></span></div>
            <div class="equip-card mb-4">
                <div style="font-size:40px;">⚔️</div>
                <div style="font-weight:700;color:var(--text);">ดาบ Lv.${wl} (DMG+${(wl*20)}%)</div>
                <div class="text-sm" style="color:var(--text2);">Lv.${wl+1}: DMG+${((wl+1)*20)}%</div>
                ${wl<5?`<button class="btn btn-sm btn-primary mt-2" onclick="upgradeEquip('weapon')">อัพเกรด ${wCosts[wl+1]}🪙</button>`:'<span class="badge badge-gold">MAX</span>'}
            </div>
            <div class="equip-card mb-4">
                <div style="font-size:40px;">🛡️</div>
                <div style="font-weight:700;color:var(--text);">โล่ Lv.${sl} (HP+${(sl*12)})</div>
                <div class="text-sm" style="color:var(--text2);">Lv.${sl+1}: HP+${((sl+1)*12)}</div>
                ${sl<5?`<button class="btn btn-sm btn-primary mt-2" onclick="upgradeEquip('shield')">อัพเกรด ${sCosts[sl+1]}🪙</button>`:'<span class="badge badge-gold">MAX</span>'}
            </div>
            <button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙กลับ</button>`;
        }

        function upgradeEquip(t) {
            const costs = t === 'weapon' ? [0, 400, 900, 1800, 3200, 5500] : [0, 350, 800, 1600, 2800, 4800];
            const lv = inventory[t];
            if (lv >= 5) return;
            if (spendGold(costs[lv + 1])) { inventory[t]++; player.maxHp = getMaxHp();
                player.hp = player.maxHp;
                sfxPurchase();
                saveGame();
                renderScreen('equipUpgrade'); } else showModal('⚠️', 'เหรียญไม่พอ!', null);
        }

        function renderPetShop() {
            let h =
                '<h3 style="color:var(--text);text-align:center;">🐾 ร้านสัตว์เลี้ยง</h3><div class="stats-bar mb-4"><span>🪙<span class="stat-gold">'
                 + player.gold + '</span></span></div><div class="class-grid">';
            for (const [k, d] of Object.entries(petDefinitions)) {
                if (!d.shop) continue;
                const owned = ownedPets.includes(k);
                const eq = equippedPet === k;
                h +=
                    `<div class="class-card" style="${!owned?'opacity:0.75':''}"><span class="class-emoji">${d.emoji}</span><div class="class-name">${d.name}</div><div class="class-desc">${d.desc}</div>${owned?`<button class="btn btn-sm ${eq?'btn-success':'btn-outline'} w-full mt-2" onclick="equipPet('${k}')">${eq?'✅ติดตั้ง':'🎯ติดตั้ง'}</button>`:`<button class="btn btn-sm btn-primary w-full mt-2" onclick="buyPet('${k}')">${d.cost}🪙</button>`}</div>`;
            }
            h += '</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙กลับ</button>';
            return h;
        }

        function buyPet(k) {
            const d = petDefinitions[k];
            if (!d || ownedPets.includes(k)) return;
            if (spendGold(d.cost)) { ownedPets.push(k); if (!equippedPet) equippedPet = k;
                sfxPurchase();
                saveGame();
                renderScreen('petShop');
                showModal('🐾', `ได้ ${d.emoji} ${d.name}!`, null); } else showModal('⚠️', 'เหรียญไม่พอ!', null);
        }

        function equipPet(k) {
            if (!ownedPets.includes(k)) return;
            equippedPet = equippedPet === k ? null : k;
            saveGame();
            renderScreen('petShop');
            sfxClick();
        }

        // ──────────────── GACHA ────────────────
        function renderGacha(type) {
            const isPet = type === 'pet';
            const cost = isPet ? 300 : 800;
            const pool = isPet ? gachaPetPool : gachaClassPool;
            const title = isPet ? '🎰 กาชาสัตว์เลี้ยงหายาก' : '💎 กาชาคลาสพิเศษ';
            const desc = isPet ? 'สัตว์เลี้ยงพิเศษที่ไม่พบในร้านค้า!' : 'คลาสในตำนานที่ไม่มีในร้านค้า!';
            return `
            <h3 style="color:var(--text);text-align:center;">${title}</h3>
            <div class="stats-bar mb-4"><span>🪙<span class="stat-gold">${player.gold}</span></span><span>💰${cost}🪙/ครั้ง</span></div>
            <div class="gacha-card">
                <div style="font-size:50px;" id="gachaDisplay">${isPet?'🐾':'💎'}</div>
                <div style="color:var(--text);font-weight:600;" id="gachaResult">${desc}</div>
                <div class="text-sm" style="color:var(--text2);margin:6px 0;">${isPet?'สุ่มสัตว์เลี้ยงหายาก 6 ชนิด':'สุ่มคลาสพิเศษ 3 คลาส'}</div>
                <button class="btn btn-${isPet?'gold':'pink'} w-full" onclick="doGacha('${type}')">🎰 กาชา (${cost}🪙)</button>
            </div>
            <div class="text-sm text-center mt-2" style="color:var(--text2);">ของรางวัลจากการกาชาจะไม่มีทางได้จากร้านค้าทั่วไป!</div>
            <button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙กลับ</button>`;
        }

        function doGacha(type) {
            const cost = type === 'pet' ? 300 : 800;
            if (!spendGold(cost)) { showModal('⚠️', 'เหรียญไม่พอ!', null); return; }
            sfxGacha();
            let reward;
            if (type === 'pet') {
                const pool = gachaPetPool.filter(p => !ownedPets.includes(p));
                if (pool.length === 0) { showModal('🎉', 'มีครบทุกตัวแล้ว!', null);
                    player.gold += cost; return; }
                reward = pool[Math.floor(Math.random() * pool.length)];
                ownedPets.push(reward);
                if (!equippedPet) equippedPet = reward;
                document.getElementById('gachaDisplay').textContent = petDefinitions[reward]?.emoji || '🐾';
                document.getElementById('gachaResult').textContent = 'ได้ ' + (petDefinitions[reward]?.name || reward) + '!';
            } else {
                const pool = gachaClassPool.filter(c => !ownedGachaClasses.includes(c));
                if (pool.length === 0) { showModal('🎉', 'มีครบทุกคลาสแล้ว!', null);
                    player.gold += cost; return; }
                reward = pool[Math.floor(Math.random() * pool.length)];
                ownedGachaClasses.push(reward);
                document.getElementById('gachaDisplay').textContent = gachaClassDefs[reward]?.emoji || '💎';
                document.getElementById('gachaResult').textContent = 'ได้คลาส ' + (gachaClassDefs[reward]?.name || reward) +
                    '!';
            }
            const card = document.querySelector('.gacha-card');
            if (card) { const r = card.getBoundingClientRect();
                spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 14); }
            const disp = document.getElementById('gachaDisplay');
            if (disp) { disp.classList.add('gacha-result');
                setTimeout(() => disp.classList.remove('gacha-result'), 600); }
            saveGame();
        }

        // ──────────────── REBIRTH ────────────────
        function renderRebirth() {
            const allDone = bossDefeated.length >= 30;
            const reqGold = 20000 + player.rebirth * 15000;
            const reqLv = 30 + player.rebirth * 15;
            const canRebirth = allDone && player.gold >= reqGold && player.lv >= reqLv;
            return `
            <h3 style="color:var(--text);text-align:center;">💀 เกิดใหม่ (Rebirth)</h3>
            <div class="story-box">
                🌌 เมื่อผู้กล้าบรรลุถึงขีดสุด... การเกิดใหม่คือหนทางสู่พลังที่แท้จริง<br>
                <span class="text-sm">เกิดใหม่ครั้งที่ ${player.rebirth+1} | โบนัสถาวร: +${player.rebirthBonus*25}HP +${player.rebirthBonus*10}%DMG</span>
            </div>
            <div class="shop-item"><div><b>🏆 ปราบบอสครบ 30+</b></div><span>${allDone?'✅':'❌'} (${bossDefeated.length}/30)</span></div>
            <div class="shop-item"><div><b>🪙 มีเหรียญ ${reqGold.toLocaleString()}</b></div><span>${player.gold>=reqGold?'✅':'❌'}</span></div>
            <div class="shop-item"><div><b>📊 เลเวลถึง ${reqLv}</b></div><span>${player.lv>=reqLv?'✅':'❌'} (Lv.${player.lv})</span></div>
            ${canRebirth?`<button class="btn btn-danger w-full mt-4" onclick="doRebirth()">💀 เกิดใหม่! (รีเซ็ตความคืบหน้าทั้งหมด)</button>
            <div class="text-sm text-center mt-2" style="color:var(--red);">⚠️ ความคืบหน้าทั้งหมดจะถูกรีเซ็ต! เหลือเพียงโบนัสถาวร</div>`:
            `<div class="text-sm text-center mt-2" style="color:var(--red);">ยังไม่ตรงตามเงื่อนไข</div>`}
            <button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙กลับ</button>`;
        }

        function doRebirth() {
            const allDone = bossDefeated.length >= 30;
            const reqGold = 20000 + player.rebirth * 15000;
            const reqLv = 30 + player.rebirth * 15;
            if (!allDone || player.gold < reqGold || player.lv < reqLv) return;
            if (!confirm(
                    `💀 เกิดใหม่ครั้งที่ ${player.rebirth+1}!\n\nความคืบหน้าทั้งหมดจะถูกรีเซ็ต:\n- ด่านที่ผ่านทั้งหมด\n- เลเวลและค่าประสบการณ์\n- เหรียญส่วนเกิน\n\nสิ่งที่คงอยู่:\n- โบนัสถาวร (+${(player.rebirthBonus+1)*25}HP, +${(player.rebirthBonus+1)*10}%DMG)\n- สัตว์เลี้ยงที่ซื้อไว้\n- คลาสที่ปลดล็อค\n- อุปกรณ์\n\nยืนยันการเกิดใหม่?`
                )) return;
            player.rebirth++;
            player.rebirthBonus = player.rebirth;
            player.gold -= reqGold;
            player.lv = 1;
            player.exp = 0;
            player.grade = 1;
            player.chapter = 1;
            player.level = 1;
            player.score = Math.floor(player.score * 0.3);
            completedLevels = {};
            unlockedGrades = [1];
            bossDefeated = [];
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            storyShown = {};
            saveGame();
            spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 30);
            showModal('💀 เกิดใหม่สำเร็จ!',
                `โบนัสถาวร: HP+${player.rebirthBonus*25}, DMG+${player.rebirthBonus*10}%\nเริ่มต้นการเดินทางใหม่อีกครั้ง!`,
                () => renderScreen('menu'));
        }

        // ──────────────── UTILS ────────────────
        function showModal(title, msg, cb) {
            const c = document.getElementById('modalContainer');
            c.innerHTML =
                `<div class="modal-overlay" onclick="closeModal(${cb?'true':'false'})"><div class="modal-content" onclick="event.stopPropagation()"><h3 style="color:var(--accent);margin-bottom:8px;">${title}</h3><p style="color:var(--text);white-space:pre-line;margin-bottom:12px;">${msg}</p><button class="btn btn-primary" onclick="closeModal(${cb?'true':'false'})">ตกลง</button></div></div>`;
            window._mcb = cb;
        }

        function closeModal(hc) {
            document.getElementById('modalContainer').innerHTML = '';
            if ((hc === true || hc === 'true') && window._mcb && typeof window._mcb === 'function') setTimeout(window._mcb,
                150);
            window._mcb = null;
        }

        function changeName() { const n = prompt('ชื่อใหม่:', player.name); if (n && n.trim()) { player.name = n.trim();
                saveGame();
                renderScreen('menu'); } }

        function resetGame() { if (confirm('รีเซ็ตทั้งหมด?')) { localStorage.removeItem('mq_v4');
                location.reload(); } }

        function showLockedMsg() { showModal('🔒', 'ยังไม่ปลดล็อค!', null); }
        document.addEventListener('keydown', e => { if (e.key === 'Enter') { const inp = document.getElementById(
                    'answerInput'); if (inp && document.activeElement === inp) submitAnswer(); } });

        function init() {
            loadGame();
            player.maxHp = getMaxHp();
            if (player.hp > player.maxHp) player.hp = player.maxHp;
            if (!Array.isArray(ownedPets)) ownedPets = [];
            if (!Array.isArray(ownedGachaClasses)) ownedGachaClasses = [];
            if (!Array.isArray(bossDefeated)) bossDefeated = [];
            if (typeof inventory.weapon !== 'number') inventory.weapon = inventory.weapon ? 1 : 0;
            if (typeof inventory.shield !== 'number') inventory.shield = inventory.shield ? 1 : 0;
            renderScreen('menu');
        }
        init();
        console.log('🎮 Math Quest Ultimate v4 - Rebirth Edition Loaded!');
        console.log('⚡ ม.1-ม.6 | 🐾Pet Gacha | 💎Class Gacha | 💀Rebirth | ⚔️Equipment Lv.5 | ⏱Timer');
        console.log('Made by ตะวันสุดหล่อ');
    </script>
</body>
  </html>
