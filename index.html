<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ พิชิตจักรวาลคณิตศาสตร์ ม.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff006e;
            --neon-purple: #b537f2;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --neon-orange: #ff6b35;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(15, 15, 35, 0.95);
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-bright: #ffffff;
            --text-medium: #e0e0f0;
            --text-dim: #b0b0d0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Kanit', sans-serif;
            background: var(--dark-bg);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 110, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(181, 55, 242, 0.06) 0%, transparent 55%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.8);
            }
        }
        .main-container {
            width: 100%;
            max-width: 780px;
            position: relative;
            z-index: 1;
        }
        .game-wrapper {
            background: var(--card-bg);
            border-radius: 24px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25), 0 20px 60px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            backdrop-filter: blur(15px);
        }
        .game-header {
            padding: 14px 20px;
            text-align: center;
            background: rgba(0, 240, 255, 0.04);
            border-bottom: 1px solid var(--glass-border);
        }
        .creator-badge {
            display: inline-block;
            background: rgba(255, 0, 110, 0.18);
            border: 1px solid var(--neon-pink);
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon-pink);
            letter-spacing: 2px;
        }
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.7em;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green), var(--neon-yellow), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .subtitle {
            color: var(--text-dim);
            font-size: 10px;
            letter-spacing: 1px;
        }
        .game-content {
            padding: 14px;
            max-height: 76vh;
            overflow-y: auto;
        }
        .game-content::-webkit-scrollbar {
            width: 5px;
        }
        .game-content::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 3px;
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.5px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.5);
        }
        .btn-success {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #fff;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
        }
        .btn-warning {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-outline:hover {
            background: rgba(0, 240, 255, 0.08);
        }
        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            font-weight: 700;
        }
        .btn-pink {
            background: linear-gradient(135deg, #ff006e, #ff4b8b);
            color: #fff;
        }
        .btn-sm {
            padding: 6px 11px;
            font-size: 10px;
            border-radius: 7px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            margin-bottom: 7px;
            font-size: 11px;
            color: var(--text-medium);
            flex-wrap: wrap;
            gap: 4px;
        }
        .stat-value {
            font-weight: 700;
            color: var(--neon-blue);
        }
        .stat-gold {
            font-weight: 700;
            color: var(--neon-yellow);
        }
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge-gold {
            background: rgba(255, 230, 0, 0.15);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }
        .badge-green {
            background: rgba(57, 255, 20, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }
        .badge-blue {
            background: rgba(0, 240, 255, 0.15);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }
        .badge-red {
            background: rgba(255, 0, 110, 0.15);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }
        .badge-purple {
            background: rgba(181, 55, 242, 0.15);
            color: var(--neon-purple);
            border: 1px solid var(--neon-purple);
        }
        .rank-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 14px;
            display: inline-block;
        }
        .rank-s {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
        }
        .rank-a {
            background: #ff416c;
            color: #fff;
        }
        .rank-b {
            background: #00c6ff;
            color: #fff;
        }
        .rank-c {
            background: #5a5a7a;
            color: #fff;
        }
        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }
        .class-card {
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 14px;
            padding: 13px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            position: relative;
        }
        .class-card:hover {
            border-color: var(--neon-yellow);
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(255, 230, 0, 0.25);
        }
        .class-card.selected {
            border-color: var(--neon-green);
            box-shadow: 0 0 18px rgba(57, 255, 20, 0.35);
            background: rgba(57, 255, 20, 0.08);
        }
        .class-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .class-card.locked:hover {
            transform: none;
            border-color: var(--glass-border);
            box-shadow: none;
        }
        .class-emoji {
            font-size: 44px;
            display: block;
            margin-bottom: 4px;
        }
        .class-name {
            font-weight: 700;
            color: var(--text-bright);
            font-size: 14px;
        }
        .class-desc {
            font-size: 9px;
            color: var(--text-dim);
            margin-top: 3px;
            line-height: 1.3;
        }
        .chapter-container {
            margin-bottom: 7px;
        }
        .chapter-header {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 13px;
            padding: 9px 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 9px;
            transition: all 0.25s;
        }
        .chapter-header:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.15);
        }
        .chapter-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .chapter-info {
            flex: 1;
        }
        .chapter-name {
            font-weight: 600;
            color: var(--text-bright);
            font-size: 12px;
        }
        .chapter-progress {
            font-size: 9px;
            color: var(--text-dim);
        }
        .level-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            padding: 4px 0 0 45px;
        }
        .level-btn {
            padding: 7px 4px;
            border-radius: 7px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-bright);
            cursor: pointer;
            font-size: 9px;
            transition: all 0.25s;
            text-align: center;
            font-family: 'Kanit', sans-serif;
        }
        .level-btn:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.25);
        }
        .level-btn.completed {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.12);
        }
        .level-btn.current {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 10px rgba(255, 230, 0, 0.3);
        }
        .battle-scene {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 14px;
            padding: 15px;
            border: 1px solid var(--glass-border);
            margin-bottom: 9px;
            text-align: center;
            position: relative;
        }
        .emoji-display {
            font-size: 58px;
            display: inline-block;
            transition: transform 0.3s, opacity 0.3s;
            line-height: 1;
            user-select: none;
        }
        .emoji-display.shake {
            animation: emojiShake 0.4s ease-in-out;
        }
        .emoji-display.crit {
            animation: emojiCrit 0.5s ease-out;
        }
        @keyframes emojiShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-7px);
            }
            75% {
                transform: translateX(7px);
            }
        }
        @keyframes emojiCrit {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.7) rotate(-8deg);
            }
            60% {
                transform: scale(1.1) rotate(4deg);
            }
            100% {
                transform: scale(1) rotate(0);
            }
        }
        .combatants-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
            flex-wrap: wrap;
        }
        .combatant {
            text-align: center;
            min-width: 85px;
        }
        .combatant-name {
            color: var(--text-bright);
            font-weight: 600;
            font-size: 12px;
            margin-top: 3px;
        }
        .combatant-name.boss {
            color: var(--neon-pink);
        }
        .hp-bar-outer {
            background: #1a1a2e;
            border-radius: 7px;
            height: 9px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-top: 3px;
            width: 100%;
            max-width: 120px;
            margin-left: auto;
            margin-right: auto;
        }
        .hp-bar-inner {
            height: 100%;
            border-radius: 7px;
            transition: width 0.4s;
            background: linear-gradient(90deg, #00f0ff, #00c6ff);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }
        .hp-bar-inner.boss-hp {
            background: linear-gradient(90deg, #ff006e, #ff4b2b);
            box-shadow: 0 0 8px rgba(255, 0, 110, 0.4);
        }
        .hp-text {
            font-size: 9px;
            color: var(--text-dim);
            margin-top: 1px;
        }
        .vs-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 22px;
            color: var(--neon-yellow);
            text-shadow: 0 0 12px rgba(255, 230, 0, 0.6);
        }
        .timer-bar-outer {
            background: #1a1a2e;
            border-radius: 5px;
            height: 9px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-top: 7px;
        }
        .timer-bar-inner {
            height: 100%;
            border-radius: 5px;
            transition: width 0.1s linear;
            background: var(--neon-yellow);
        }
        .timer-text {
            font-size: 10px;
            color: var(--neon-yellow);
            font-weight: 700;
            text-align: center;
            margin-top: 1px;
        }
        .question-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 13px;
            padding: 14px;
            border: 1px solid var(--glass-border);
            margin-bottom: 9px;
        }
        .question-display {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-bright);
            text-align: center;
            margin-bottom: 9px;
            line-height: 1.5;
        }
        .answer-input-row {
            display: flex;
            gap: 7px;
        }
        .answer-input {
            flex: 1;
            padding: 11px 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            border-radius: 9px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-bright);
            outline: none;
            transition: all 0.25s;
            font-family: 'Kanit', sans-serif;
        }
        .answer-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
        }
        .answer-input:disabled {
            opacity: 0.5;
        }
        .answer-input.correct-flash {
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 18px rgba(57, 255, 20, 0.45) !important;
            background: rgba(57, 255, 20, 0.08) !important;
        }
        .answer-input.wrong-flash {
            border-color: var(--neon-pink) !important;
            box-shadow: 0 0 18px rgba(255, 0, 110, 0.45) !important;
            background: rgba(255, 0, 110, 0.08) !important;
        }
        .combo-display {
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            margin-top: 5px;
            min-height: 18px;
            color: var(--neon-yellow);
        }
        .feedback-msg {
            font-size: 10px;
            text-align: center;
            margin-top: 3px;
            min-height: 14px;
            color: var(--text-dim);
        }
        .shop-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 11px;
            padding: 11px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s;
        }
        .shop-item:hover {
            border-color: var(--neon-purple);
        }
        .gacha-card {
            background: var(--glass);
            border: 2px solid var(--neon-yellow);
            border-radius: 15px;
            padding: 18px;
            text-align: center;
        }
        .gacha-result {
            font-size: 52px;
            animation: gachaReveal 0.6s ease-out;
        }
        @keyframes gachaReveal {
            0% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.3) rotate(-8deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 17px;
            padding: 24px;
            max-width: 420px;
            width: 90%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
            text-align: center;
        }
        .flex-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 9px;
        }
        .mt-1 {
            margin-top: 2px;
        }
        .mt-2 {
            margin-top: 5px;
        }
        .mt-4 {
            margin-top: 11px;
        }
        .mb-2 {
            margin-bottom: 5px;
        }
        .w-full {
            width: 100%;
        }
        .progress-bar {
            background: #1a1a2e;
            border-radius: 5px;
            height: 5px;
            overflow: hidden;
            margin-top: 2px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 5px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            transition: width 0.4s;
        }
        .pet-card {
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 13px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
        }
        .pet-card:hover {
            border-color: var(--neon-purple);
            transform: translateY(-2px);
        }
        .pet-card.equipped {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.06);
        }
        .pet-emoji {
            font-size: 40px;
            display: block;
        }
        .story-box {
            background: linear-gradient(135deg, rgba(181, 55, 242, 0.1), rgba(0, 240, 255, 0.1));
            border: 2px solid var(--neon-purple);
            border-radius: 13px;
            padding: 12px;
            text-align: center;
            margin-bottom: 7px;
            color: var(--text-bright);
            font-style: italic;
            line-height: 1.5;
        }
        .achievement-item,
        .daily-quest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 11px;
        }
        @media (max-width: 600px) {
            .class-grid {
                grid-template-columns: 1fr;
            }
            .level-list {
                grid-template-columns: repeat(3, 1fr);
                padding-left: 0;
            }
            .emoji-display {
                font-size: 42px;
            }
            .game-title {
                font-size: 1.2em;
            }
            .combatants-row {
                gap: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>
    <div class="main-container">
        <div class="game-wrapper" id="gameWrapper">
            <div class="game-header">
                <div class="creator-badge">⚡ ตะวันสุดหล่อ ⚡</div>
                <div class="game-title">MATH QUEST</div>
                <div class="subtitle">พิชิตจักรวาลคณิตศาสตร์ ม.2 | Ultimate Edition</div>
            </div>
            <div class="game-content" id="gameContent"></div>
        </div>
    </div>
    <div id="modalContainer"></div>
    <script>
        // ==================== COMPLETE GAME ENGINE ====================
        let audioCtx = null,
            bgMusicGain = null,
            bgMusicOsc = null,
            isMusicPlaying = false;

        function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }

        function playSound(f, t = 'sine', d = 0.14, v = 0.05) {
            try {
                initAudio();
                const o = audioCtx.createOscillator(),
                    g = audioCtx.createGain();
                o.type = t;
                o.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(v, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + d);
            } catch (e) {}
        }

        function sfxClick() { playSound(600, 'sine', 0.07, 0.04); }

        function sfxCorrect() { playSound(700, 'triangle', 0.14, 0.07);
            setTimeout(() => playSound(1100, 'triangle', 0.14, 0.07), 90); }

        function sfxWrong() { playSound(140, 'sawtooth', 0.2, 0.04); }

        function sfxCrit() { playSound(350, 'square', 0.2, 0.06);
            setTimeout(() => playSound(800, 'square', 0.2, 0.09), 80); }

        function sfxWin() { [500, 700, 900, 1100].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.18, 0.07), i *
                110)); }

        function nextQuestion() { if (player.bossHp <= 0 || player.hp <= 0) { endBattle(); return; } const cd = getCD(); if (

                updateBattleUI(); }
            currentQuestion = genQuestion(player.chapter, player.level);
            document.getElementById('questionDisplay').innerHTML = currentQuestion.q; const inp = document.getElementById(
                'answerInput'); if (inp) { inp.value = '';
                inp.disabled = false;

        function submitAnswer() { stopTimer(); const inp = document.getElementById('answerInput'); if (!inp || !
                currentQuestion) return; const ua = inp.value.trim(); if (ua === '') return;
            inp.disabled = true;
            document.getElementById('submitBtn').disabled = true; const ca = String(currentQuestion.a); let correct = ua ===
                ca; if (!correct && !isNaN(parseFloat(ua)) && !isNaN(parseFloat(ca))) correct = Math.abs(parseFloat(ua) -
                    parseFloat(ca)) < 0.09; if (correct) { inp.classList.add('correct-flash');
                setTimeout(() => inp.classList.remove('correct-flash'), 500);
                handleCorrect(inp); } else { inp.classList.add('wrong-flash');
                setTimeout(() => inp.classList.remove('wrong-flash'), 500);
                handleWrongAnswer(inp, false); } }

        function handleCorrect(inp) { sfxCorrect();
            player.combo++;
            player.tc++; if (player.combo > player.maxCombo) player.maxCombo = player.combo; const cd = getCD(); const pb =
                getPetBonus(); let dmg = 20 + player.combo * 5;
            dmg = Math.round(dmg * cd.dmgMul * getWeaponMul() * (1 + pb.dmg)); if (player.combo >= 5 && cd.comboMul) dmg =
                Math.round(dmg * cd.comboMul); if (player.combo >= 5 && pb.combo > 0) dmg = Math.round(dmg * (1 + pb.combo));
            let critC = 0.06 + (cd.critBonus || 0) + pb.crit + (inventory.orb ? 0.2 : 0); let isCrit = Math.random() <
                critC; if (skillActive.gcrit) { isCrit = true;
                skillActive.gcrit = false; } if (skillActive.stealth) { isCrit = true;
                skillActive.stealth = false; } if (skillActive.berserk) dmg = Math.round(dmg * 2); if (isCrit) { dmg = Math
                    .round(dmg * (cd.critMul || 3));
                sfxCrit(); const be = document.getElementById('bossEmoji'); if (be) { be.classList.add('crit');
                    setTimeout(() => be.classList.remove('crit'), 500); } } if (skillActive.cboost && isCrit) { dmg = Math
                    .round(dmg * (cd.skill1?.mul || 3));
                skillActive.cboost = false; } if (skillActive.drain) { const heal = Math.round(dmg * (cd.skill2?.healPct ||
                        0.5));
                player.hp = Math.min(player.maxHp, player.hp + heal);
                skillActive.drain = false; }
            player.bossHp = Math.max(0, player.bossHp - dmg); const goldEarn = Math.round(12 + player.combo * 3 + player
                .level * 3);
            addGold(goldEarn);
            player.score += Math.round(30 + player.combo * 5);
            updateDailyQuest('correct', 1); if (inp) { const r = inp.getBoundingClientRect();

            document.getElementById('feedbackMsg').textContent =

            document.getElementById('feedbackMsg').style.color = 'var(--neon-green)'; if (player.combo >= 3) { document
                .getElementById('comboDisplay').textContent = `🔥 COMBO x${player.combo}!`;
                document.getElementById('comboBadge').textContent = `🔥${player.combo}`; }
            updateBattleUI();
            reduceCD();
            saveGame();
            checkAchievements();
            setTimeout(nextQuestion, 900); }

        function handleWrongAnswer(inp, isTimeUp) { sfxWrong();
            player.combo = 0;
            player.tw++; let dmgTaken = 8 + player.level * 2 + (isTimeUp ? 6 : 0); const cd = getCD(); if (skillActive
                .dodge) { skillActive.dodge = false;

                    player.bossHp = Math.max(0, player.bossHp - 20);
                    document.getElementById('feedbackMsg').textContent = '🛡️สะท้อน20!'; } else { dmgTaken = 0;
                    document.getElementById('feedbackMsg').textContent = '🛡️ป้องกัน!'; } } else if (getDodgeChance() > 0 &&
                Math.random() < getDodgeChance()) { dmgTaken = 0;
                document.getElementById('feedbackMsg').textContent = '👟หลบด้วยรองเท้า!'; } else { player.hp = Math.max(0,

        function updateCDUI() { const cd = getCD();
            document.getElementById('cdIndicator').textContent = (skillCD.s1 > 0 ?
                `${cd.skill1.name} CD${skillCD.s1} ` : '') + (skillCD.s2 > 0 ?
                `${cd.skill2.name} CD${skillCD.s2}` : '');

                3;

        function useSkill(type) { const cd = getCD(); if (type === 's1') { if (skillCD.s1 > 0 || !spendGold(cd.skill1
                .cost) || skillUseCount.s1 >= 3) return;
                skillUseCount.s1++;
                skillCD.s1 = cd.skill1.cooldown;
                sfxPurchase();
                updateDailyQuest('skill', 1); if (cd.skill1.type === 'gcrit') skillActive.gcrit = true; if (cd.skill1
                    .type === 'cboost') skillActive.cboost = true; if (cd.skill1.type === 'dmg') { const bd = Math.round(
                        30 * (cd.skill1.mul || 2));
                    player.bossHp = Math.max(0, player.bossHp - bd);
                    spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 8);
                    updateBattleUI(); } if (cd.skill1.type === 'dmgheal') { const bd = Math.round(30 * (cd.skill1.mul ||
                        2));
                    player.bossHp = Math.max(0, player.bossHp - bd);
                    player.hp = Math.min(player.maxHp, player.hp + (cd.skill1.heal || 30));
                    updateBattleUI(); } } else if (type === 's2') { if (skillCD.s2 > 0 || !spendGold(cd.skill2.cost) ||
                    skillUseCount.s2 >= 3) return;
                skillUseCount.s2++;
                skillCD.s2 = cd.skill2.cooldown;
                sfxPurchase();
                updateDailyQuest('skill', 1); if (cd.skill2.type === 'shield') player.shield = true; if (cd.skill2.type ===
                    'reflect') { player.shield = true;
                    skillActive.reflect = true; } if (cd.skill2.type === 'heal') { player.hp = Math.min(player.maxHp,
                        player.hp + cd.skill2.heal);
                    updateBattleUI(); } if (cd.skill2.type === 'dodge') skillActive.dodge = true; if (cd.skill2.type ===
                    'stealth') { skillActive.dodge = true;
                    skillActive.stealth = true; } if (cd.skill2.type === 'drain') skillActive.drain = true; if (cd.skill2
                    .type === 'berserk') skillActive.berserk = true; if (cd.skill2.type === 'shieldheal') { player.shield =
                        true;
                    player.hp = Math.min(player.maxHp, player.hp + (cd.skill2.heal || 25));
                    updateBattleUI(); } }
            updateCDUI();
            saveGame(); }

        function skipQuestion() { stopTimer();
            player.hp = Math.max(0, player.hp - 8);
            player.combo = 0;
            updateBattleUI();
            reduceCD();
            document.getElementById('comboBadge').textContent = '🔥0';
            document.getElementById('feedbackMsg').textContent = '⏩ข้าม -8HP'; if (player.hp <= 0) endBattle();
            else nextQuestion(); }

        function reduceCD() { if (skillCD.s1 > 0) skillCD.s1--; if (skillCD.s2 > 0) skillCD.s2--;
            updateCDUI(); }

        function usePotion() { if (inventory.potion <= 0) return;
            inventory.potion--;
            player.hp = player.maxHp;
            updateBattleUI();
            saveGame(); }

        function useSuperPotion() { if (inventory.superPotion <= 0) return;
            inventory.superPotion--;
            player.hp = player.maxHp;
            player.bossHp = Math.max(0, player.bossHp - 50);
            updateBattleUI();
            spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 10);
            saveGame(); }

        function endBattle() { stopTimer();
            stopBgMusic(); if (player.bossHp <= 0) { sfxWin(); const goldR = Math.round(35 + player.level * 25);
                addGold(goldR);
                player.score += Math.round(100 + player.level * 50);
                unlockNext(player.chapter, player.level);
                updateDailyQuest('boss', player.level === 5 ? 1 : 0);
                saveGame();
                spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 20);
                setTimeout(() => showModal('🎉ชัยชนะ!',
                    `พิชิตบทที่ ${player.chapter} ด่าน ${player.level}!\n+${goldR}🪙`, () => renderScreen('chapters')),
                700); } else { player.gold = Math.max(0, player.gold - 10);
                saveGame();
                showModal('💀พ่ายแพ้', 'เสีย 10🪙', () => renderScreen('chapters')); } }

        function startBattle(chapterId, levelId) { player.chapter = chapterId;
            player.level = levelId;
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCD = { s1: 0, s2: 0 };
            skillActive = { gcrit: false, dodge: false, cboost: false, stealth: false, reflect: false, berserk: false,
                drain: false };
            skillUseCount = { s1: 0, s2: 0 };
            renderScreen('battle'); }

        function flee() { stopTimer();
            stopBgMusic();
            player.gold = Math.max(0, player.gold - 10);
            saveGame();
            renderScreen('chapters'); }

        function showModal(title, msg, cb) { document.getElementById('modalContainer').innerHTML =
                `<div class="modal-overlay" onclick="closeModal(${cb?'true':'false'})"><div class="modal-content" onclick="event.stopPropagation()"><h3 style="color:var(--neon-blue);margin-bottom:8px;">${title}</h3><p style="color:var(--text-bright);white-space:pre-line;margin-bottom:12px;">${msg}</p><button class="btn btn-primary" onclick="closeModal(${cb?'true':'false'})">ตกลง</button></div></div>`;
            window._mcb = cb; }

        function closeModal(hc) { document.getElementById('modalContainer').innerHTML = ''; if ((hc === true || hc ===
                'true') && window._mcb && typeof window._mcb === 'function') setTimeout(window._mcb, 150);
            window._mcb = null; }

        function changeName() { const n = prompt('ชื่อใหม่:', player.name); if (n && n.trim()) { player.name = n.trim();
                saveGame();
                renderScreen('menu'); } }

        function resetGame() { if (confirm('รีเซ็ตทั้งหมด?')) { localStorage.removeItem('mq_full_fix');
                localStorage.removeItem('mq_highscores_fix');
                location.reload(); } }

        function showLockedMsg() { showModal('🔒', 'ยังปลดล็อคไม่ได้!', null); }
        document.addEventListener('keydown', e => { if (e.key === 'Enter') { const inp = document.getElementById(
                    'answerInput'); if (inp && document.activeElement === inp) submitAnswer(); } });

        function init() { createStars();
            loadGame();
            player.maxHp = getMaxHp(); if (player.hp > player.maxHp) player.hp = player.maxHp; if (!Array.isArray(
                ownedPets)) ownedPets = []; if (!Array.isArray(ownedGachaClasses)) ownedGachaClasses = [];
            ['weapon', 'shield', 'helmet', 'armor', 'pants', 'shoes'].forEach(k => { if (typeof inventory[k] !==
                'number') inventory[k] = 0; });
            initAchievements();
            generateDailyQuests();
            renderScreen('menu'); }
        init();
    </script>
</body>
  </html>
