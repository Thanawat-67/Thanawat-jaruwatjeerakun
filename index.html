<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ พิชิตจักรวาลคณิตศาสตร์ ม.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff006e;
            --neon-purple: #b537f2;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --neon-orange: #ff6b35;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(15, 15, 35, 0.95);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --warrior-primary: #ff6b35;
            --warrior-secondary: #cc4400;
            --mage-primary: #b537f2;
            --mage-secondary: #7b2ff7;
            --rogue-primary: #39ff14;
            --rogue-secondary: #00b09b;
            --glow-blue: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 0, 110, 0.5);
            --glow-purple: 0 0 20px rgba(181, 55, 242, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #0a0a1a;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 110, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(181, 55, 242, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            90% {
                transform: translateX(-3px);
            }
            20%,
            80% {
                transform: translateX(3px);
            }
            30%,
            70% {
                transform: translateX(-3px);
            }
            40%,
            60% {
                transform: translateX(3px);
            }
            50% {
                transform: translateX(-3px);
            }
        }
        .screen-shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes bossEntrance {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(10deg);
                opacity: 0.7;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        .boss-entrance {
            animation: bossEntrance 0.8s ease-out;
        }

        @keyframes playerVictory {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.3) rotate(-5deg);
            }
            60% {
                transform: scale(1.1) rotate(3deg);
            }
            100% {
                transform: scale(1) rotate(0);
            }
        }
        .player-victory {
            animation: playerVictory 0.8s ease-out;
        }

        @keyframes healGlow {
            0%,
            100% {
                filter: brightness(1) drop-shadow(0 0 5px var(--neon-green));
            }
            50% {
                filter: brightness(1.5) drop-shadow(0 0 20px var(--neon-green));
            }
        }
        .heal-glow {
            animation: healGlow 0.8s ease-in-out;
        }

        @keyframes criticalStrike {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }
            20% {
                transform: scale(1.5);
                filter: brightness(2.5);
            }
            40% {
                transform: scale(0.8);
                filter: brightness(1.8);
            }
            60% {
                transform: scale(1.2);
                filter: brightness(2);
            }
            100% {
                transform: scale(1);
                filter: brightness(1);
            }
        }
        .critical-strike {
            animation: criticalStrike 0.6s ease-out;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: particleFloat 1.5s ease-out forwards;
            font-weight: bold;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-shadow: 0 0 10px currentColor;
        }
        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-60px) scale(1.3) rotate(180deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-120px) scale(0.8) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes bossDefeat {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            30% {
                transform: scale(1.4);
                opacity: 0.7;
            }
            60% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
        .boss-defeated {
            animation: bossDefeat 1s ease-in forwards;
        }

        @keyframes attackShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-12px);
            }
            75% {
                transform: translateX(12px);
            }
        }
        .attacking {
            animation: attackShake 0.3s ease-in-out;
        }
        @keyframes hitFlash {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(2.5) saturate(2);
            }
        }
        .hit {
            animation: hitFlash 0.25s ease-in-out;
        }

        .main-container {
            width: 100%;
            max-width: 750px;
            position: relative;
            z-index: 1;
            padding: 10px;
        }

        .game-wrapper {
            background: var(--card-bg);
            border-radius: 24px;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2), 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            backdrop-filter: blur(20px);
            transition: box-shadow 0.3s;
        }
        .game-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-blue));
            border-radius: 26px;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            background-size: 300% 300%;
        }
        @keyframes borderGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .game-header {
            padding: 20px 25px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
            border-bottom: 1px solid var(--glass-border);
        }
        .creator-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2), rgba(181, 55, 242, 0.2));
            border: 1px solid var(--neon-pink);
            padding: 8px 20px;
            border-radius: 20px;
            margin-bottom: 12px;
            animation: badgePulse 2s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 0, 110, 0.7);
            }
        }
        .creator-badge span {
            font-weight: 700;
            font-size: 13px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green), var(--neon-yellow), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        @keyframes titleShine {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.4);
            }
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .game-content {
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .game-content::-webkit-scrollbar {
            width: 6px;
        }
        .game-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .game-content::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 3px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.6);
        }
        .btn-success {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.6);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-outline:hover {
            background: rgba(0, 240, 255, 0.1);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 11px;
            border-radius: 8px;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .class-card {
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
        }
        .class-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.3);
        }
        .class-card.selected {
            border-color: var(--neon-green);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            background: rgba(57, 255, 20, 0.1);
        }
        .class-icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
        .class-name {
            font-weight: 700;
            color: white;
            font-size: 16px;
        }
        .class-desc {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            line-height: 1.4;
        }

        .chapter-container {
            margin-bottom: 12px;
        }
        .chapter-header {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.08), rgba(181, 55, 242, 0.08));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }
        .chapter-header:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .chapter-header.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chapter-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .chapter-info {
            flex: 1;
        }
        .chapter-name {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }
        .chapter-progress {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        .level-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 8px 0 0 60px;
        }
        .level-btn {
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            text-align: center;
            font-family: 'Kanit', sans-serif;
        }
        .level-btn:hover:not(.locked) {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
            transform: translateY(-2px);
        }
        .level-btn.completed {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.15);
        }
        .level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .level-btn.current {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
            animation: pulseBorder 1.5s ease-in-out infinite;
        }
        @keyframes pulseBorder {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 230, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 230, 0, 0.7);
            }
        }

        .battle-scene {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(15, 15, 35, 0.9) 100%);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .battle-scene::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.5), transparent);
            pointer-events: none;
            z-index: 1;
        }
        .combatants-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: relative;
            z-index: 2;
        }
        .combatant {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .pixel-canvas {
            display: block;
            margin: 0 auto 8px;
            image-rendering: pixelated;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }
        .pixel-canvas.boss-canvas {
            box-shadow: 0 0 25px rgba(255, 0, 110, 0.6);
            animation: bossGlow 1.5s ease-in-out infinite;
        }
        @keyframes bossGlow {
            0%,
            100% {
                box-shadow: 0 0 25px rgba(255, 0, 110, 0.6);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 0, 110, 1);
            }
        }

        .hp-bar-outer {
            background: #1a1a2e;
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 6px;
        }
        .hp-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #00f0ff, #00c6ff);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .hp-bar-inner.boss-hp {
            background: linear-gradient(90deg, #ff006e, #ff4b2b);
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.5);
        }
        .hp-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 3px;
        }

        .vs-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 28px;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.7);
            animation: vsPulse 1s ease-in-out infinite;
        }
        @keyframes vsPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .question-panel {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }
        .question-display {
            font-size: 19px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .answer-input-row {
            display: flex;
            gap: 10px;
        }
        .answer-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: 'Kanit', sans-serif;
        }
        .answer-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .answer-input:disabled {
            opacity: 0.6;
        }
        .answer-input.correct-flash {
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.6) !important;
            background: rgba(57, 255, 20, 0.1) !important;
        }
        .answer-input.wrong-flash {
            border-color: var(--neon-pink) !important;
            box-shadow: 0 0 25px rgba(255, 0, 110, 0.6) !important;
            background: rgba(255, 0, 110, 0.1) !important;
        }

        .combo-display {
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            min-height: 24px;
            font-family: 'Press Start 2P', cursive;
        }
        .combo-display.active {
            color: var(--neon-yellow);
            animation: comboShake 0.5s ease-in-out;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
        }
        @keyframes comboShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            flex-wrap: wrap;
            gap: 5px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-value {
            font-weight: 700;
            color: var(--neon-blue);
        }

        .shop-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .shop-item:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(181, 55, 242, 0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .badge-warning {
            background: rgba(255, 230, 0, 0.2);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);

        // ──────────────── AUDIO ENGINE ────────────────
        let audioCtx = null;
        let bgMusicGain = null;
        let bgMusicOsc = null;
        let isMusicPlaying = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type = 'sine', duration = 0.15, vol = 0.08) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function sfxClick() { playSound(600, 'sine', 0.08, 0.06); }

        function sfxCorrect() { playSound(800, 'triangle', 0.18, 0.1);
            setTimeout(() => playSound(1200, 'triangle', 0.18, 0.1), 120); }

        function sfxWrong() { playSound(150, 'sawtooth', 0.25, 0.06); }

        function sfxCrit() { playSound(400, 'square', 0.25, 0.08);

        function sfxWin() { [600, 800, 1000, 1200].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.22, 0.1), i *

                0.12), i * 100)); }

        function startBgMusic() {
            if (isMusicPlaying) return;
            try {
                initAudio();
                bgMusicGain = audioCtx.createGain();
                bgMusicGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                bgMusicGain.connect(audioCtx.destination);
                bgMusicOsc = audioCtx.createOscillator();
                bgMusicOsc.type = 'triangle';
                bgMusicOsc.frequency.setValueAtTime(220, audioCtx.currentTime);
                bgMusicOsc.connect(bgMusicGain);
                bgMusicOsc.start();
                isMusicPlaying = true;
                let time = 0;
                const modulate = () => {
                    if (!isMusicPlaying) return;
                    time += 0.1;
                    bgMusicOsc.frequency.setValueAtTime(220 + Math.sin(time) * 30, audioCtx.currentTime);
                    if (isMusicPlaying) requestAnimationFrame(modulate);
                };
                modulate();
            } catch (e) {}
        }

        function stopBgMusic() {
            try {
                if (bgMusicOsc) { bgMusicOsc.stop();
                    bgMusicOsc = null; }
                if (bgMusicGain) { bgMusicGain.disconnect();
                    bgMusicGain = null; }
                isMusicPlaying = false;
            } catch (e) {}
        }

        // ──────────────── PIXEL ART ENGINE ────────────────
        function drawPixelCharacter(canvas, pixels, scale = 4, primaryColor = '#00f0ff', secondaryColor = '#005580') {
            const ctx = canvas.getContext('2d');
            const size = 16;
            canvas.width = size * scale;
            canvas.height = size * scale;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = false;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const pixel = (pixels[y] && pixels[y][x] !== undefined) ? pixels[y][x] : 0;
                    if (pixel === 1) { ctx.fillStyle = primaryColor;
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 2) { ctx.fillStyle =
                            secondaryColor;
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 3) { ctx.fillStyle =
                            '#ffffff';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 4) { ctx.fillStyle =
                            '#ffcc00';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 5) { ctx.fillStyle =
                            '#ff4444';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 6) { ctx.fillStyle =
                            '#000000';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 7) { ctx.fillStyle =
                            '#ff8800';
                        ctx.fillRect(x * scale, y * scale, scale, scale); } else if (pixel === 8) { ctx.fillStyle =
                            '#4488ff';
                        ctx.fillRect(x * scale, y * scale, scale, scale); }
                }
            }
        }

        function createAnimatedSprite(canvas, frames, scale = 4, primaryColor = '#00f0ff', secondaryColor = '#005580',
            frameRate = 200) {
            let currentFrame = 0;
            const totalFrames = frames.length;

            function renderFrame() {
                drawPixelCharacter(canvas, frames[currentFrame], scale, primaryColor, secondaryColor);
                currentFrame = (currentFrame + 1) % totalFrames;
            }
            renderFrame();
            return setInterval(renderFrame, frameRate);
        }

            const totalAnswered = player.totalCorrect + player.totalWrong;
            if (totalAnswered === 0) return 'C';
            const accuracy = player.totalCorrect / totalAnswered;
            if (accuracy >= 0.95 && player.score >= 5000 && player.level >= 10) return 'S';
            if (accuracy >= 0.85 && player.score >= 2500) return 'A';
            if (accuracy >= 0.7) return 'B';
            return 'C';

        // ──────────────── SAVE/LOAD SYSTEM ────────────────
        function loadGame() {
            try {
                const saved = JSON.parse(localStorage.getItem('mathquest_tawan_ultimate'));
                if (saved) {
                    player.score = saved.score || 0;
                    player.maxCombo = saved.maxCombo || 0;
                    player.totalCorrect = saved.totalCorrect || 0;
                    player.totalWrong = saved.totalWrong || 0;
                    inventory = saved.inventory || { weapon: false, shield: false, orb: false, potion: 0,
                    superPotion: 0 };
                    analytics = saved.analytics || {};
                    completedLevels = saved.completedLevels || {};
                    unlockedChapters = saved.unlockedChapters || [1];
                    player.name = saved.name || 'ผู้กล้า';
                    playerClass = saved.playerClass || 'warrior';
                    player.level = saved.level || 1;
                    player.exp = saved.exp || 0;
                    player.maxHp = getMaxHp();
                    player.hp = player.maxHp;
                }
                const hs = JSON.parse(localStorage.getItem('mathquest_highscores'));
                if (hs) highScores = hs;
            } catch (e) {}

        function saveGame() {
            const data = {
                score: player.score,
                maxCombo: player.maxCombo,
                totalCorrect: player.totalCorrect,
                totalWrong: player.totalWrong,
                inventory: inventory,
                analytics: analytics,
                completedLevels: completedLevels,
                unlockedChapters: unlockedChapters,
                name: player.name,
                playerClass: playerClass,
                level: player.level,
                exp: player.exp,
            };
            localStorage.setItem('mathquest_tawan_ultimate', JSON.stringify(data));
            updateHighScore();
        }

        function updateHighScore() {
            const existing = highScores.findIndex(h => h.name === player.name);
            if (existing >= 0) {
                if (player.score > highScores[existing].score) {
                    highScores[existing].score = player.score;
                    highScores[existing].class = playerClass;
                    highScores[existing].level = player.level;
                }
            } else {
                highScores.push({
                    name: player.name,
                    score: player.score,
                    class: playerClass,
                    level: player.level,
                    rank: getPlayerRank(),
                });
            }
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 20);
            localStorage.setItem('mathquest_highscores', JSON.stringify(highScores));

                { id: 2, desc: 'ชนะด่านบอส 2 ครั้ง', reward: 250, target: 2, progress: 0, claimed: false,
                type: 'boss_wins' },
                { id: 3, desc: 'ทำคอมโบ 5+ จำนวน 3 ครั้ง', reward: 200, target: 3, progress: 0, claimed: false,
                    type: 'high_combo' },
            ];
            try {
                const saved = JSON.parse(localStorage.getItem('mathquest_daily_quests'));
                if (saved && saved.date === today) dailyQuests = saved.quests;
            } catch (e) {}
            return dailyQuests;
        }

        function saveDailyQuests() {
            localStorage.setItem('mathquest_daily_quests', JSON.stringify({ date: dailyQuestDate, quests: dailyQuests }));
        }

        function updateQuestProgress(type, amount = 1) {
            generateDailyQuests();
            dailyQuests.forEach(q => { if (q.type === type && !q.claimed) q.progress = Math.min(q.target, q.progress +
                    amount); });
            saveDailyQuests();
        }

        function claimQuestReward(questId) {
            const quest = dailyQuests.find(q => q.id === questId);
            if (!quest || quest.claimed || quest.progress < quest.target) return false;
            quest.claimed = true;
            player.score += quest.reward;
            saveDailyQuests();
            saveGame();
            return true;
        }

        // ──────────────── QUESTION GENERATOR ────────────────
        function generateQuestion(chapterId, difficulty) {
            let question, answer, hint;
            const ch = chapterId;
            const diff = difficulty || 1;
            switch (ch) {
                case 1:
                    if (diff <= 1) {
                        const base = Math.floor(Math.random() * 3) + 2,
                            exp1 = Math.floor(Math.random() * 2) + 2,
                            exp2 = Math.floor(Math.random() * 2) + 1;
                        question =
                            `${base}<sup>${exp1}</sup> × ${base}<sup>${exp2}</sup> = ${base}<sup>?</sup> จงหาเลขชี้กำลังที่หายไป`;
                        answer = exp1 + exp2;
                        hint = 'สมบัติ: a^m × a^n = a^(m+n)';
                    } else if (diff === 2) {
                        const base = Math.floor(Math.random() * 3) + 3,
                            exp = Math.floor(Math.random() * 2) + 2;
                        question = `(${base}^${exp})^2 = ${base}^? จงหา ?`;
                        answer = exp * 2;
                        hint = 'สมบัติ: (a^m)^n = a^(m×n)';
                    } else {
                        const base = Math.floor(Math.random() * 4) + 2,
                            exp1 = Math.floor(Math.random() * 3) + 3,
                            exp2 = Math.floor(Math.random() * 2) + 2;
                        question = `${base}^${exp1} ÷ ${base}^${exp2} = ${base}^?`;
                        answer = exp1 - exp2;
                        hint = 'สมบัติ: a^m ÷ a^n = a^(m-n)';
                    }
                    break;
                case 2:
                    if (diff <= 1) {
                        const a = Math.floor(Math.random() * 4) + 2,
                            b = Math.floor(Math.random() * 4) + 1,
                            x = Math.floor(Math.random() * 2) + 2;
                        question = `(${a}x + ${b}) + (${a*2}x - ${b}) เมื่อ x=${x} = ?`;
                        answer = (a * x + b) + (a * 2 * x - b);
                        hint = `แทนค่า x=${x}: (${a}×${x}+${b}) + (${a*2}×${x}-${b})`;
                    } else if (diff === 2) {
                        const a = Math.floor(Math.random() * 3) + 3,
                            b = Math.floor(Math.random() * 3) + 2;
                        question = `(${a}x + ${b})(${a}x - ${b}) เมื่อ x=1 = ?`;
                        answer = (a + b) * (a - b);
                        hint = `แทนค่า x=1: (${a}+${b})(${a}-${b}) = ${a+b}×${a-b}`;
                    } else {
                        const a = Math.floor(Math.random() * 3) + 2,
                            b = Math.floor(Math.random() * 3) + 2,
                            c = Math.floor(Math.random() * 3) + 1;
                        question =
                            `(${a}x² + ${b}x + ${c}) + (${a*2}x² - ${b}x + ${c*2}) เมื่อ x=1 = ?`;
                        answer = (a + b + c) + (a * 2 - b + c * 2);
                        hint = `แทน x=1 แล้วรวมพจน์`;
                    }
                    break;
                case 3:
                    if (diff <= 1) {
                        const n = Math.floor(Math.random() * 5) + 2;
                        question = `x² + ${2*n}x + ${n*n} = (x + ?)²`;
                        answer = n;
                        hint = `(x+a)² = x²+2ax+a² ดังนั้น a=${n}`;
                    } else if (diff === 2) {
                        const n = Math.floor(Math.random() * 5) + 2;
                        question = `x² - ${2*n}x + ${n*n} = (x - ?)²`;
                        answer = n;
                        hint = `(x-a)² = x²-2ax+a² ดังนั้น a=${n}`;
                    } else {
                        const n = Math.floor(Math.random() * 6) + 4;
                        question = `x² - ${n*n} = (x + ${n})(x - ?)`;
                        answer = n;
                        hint = `ผลต่างกำลังสอง: a²-b² = (a+b)(a-b)`;
                    }
                    break;
                case 4:
                    if (diff <= 1) {
                        const side = Math.floor(Math.random() * 8) + 4;
                        question = `สามเหลี่ยมด้านเท่า มีด้านหนึ่งยาว ${side} ซม. ด้านที่เหลือยาวเท่าไร?`;
                        answer = side;
                        hint = 'สามเหลี่ยมด้านเท่า ทุกด้านเท่ากัน';
                    } else if (diff === 2) {
                        const angle = Math.floor(Math.random() * 30) + 40;
                        question =
                            `สามเหลี่ยมหน้าจั่วมีมุมยอด ${angle}° มุมที่ฐานกางมุมละกี่องศา?`;
                        answer = Math.round((180 - angle) / 2);
                        hint = `มุมในสามเหลี่ยมรวม 180°: (180-${angle})÷2`;
                    } else {
                        const a = Math.floor(Math.random() * 5) + 3,
                            b = Math.floor(Math.random() * 5) + 3;
                        question =
                            `สามเหลี่ยมมุมฉากมีด้านประกอบฉาก ${a} และ ${b} หน่วย ด้านที่เหลือยาว?`;
                        answer = Math.round(Math.sqrt(a * a + b * b) * 10) / 10;
                        hint = `c² = ${a}² + ${b}² = ${a*a+b*b}, c=√${a*a+b*b}`;
                    }
                    break;
                case 5:
                    const mult = Math.floor(Math.random() * 2) + diff,
                        leg1 = 3 * mult,
                        leg2 = 4 * mult;
                    question = `สามเหลี่ยมมุมฉากมีด้าน ${leg1} และ ${leg2} หน่วย ด้านตรงข้ามฉากยาว?`;
                    answer = 5 * mult;
                    hint = `c² = ${leg1}²+${leg2}² = ${leg1*leg1+leg2*leg2}, c=${answer}`;
                    break;
                case 6:
                    if (diff <= 1) {
                        const nums = [Math.floor(Math.random() * 20) + 10, Math.floor(Math.random() * 20) + 30, Math
                            .floor(Math.random() * 20) + 50
                        ];
                        question = `ข้อมูล: ${nums.join(', ')} จงหาค่าเฉลี่ย`;
                        answer = Math.round((nums.reduce((s, v) => s + v, 0) / 3) * 10) / 10;
                        hint = `(${nums.join('+')}) ÷ 3`;
                    } else if (diff === 2) {
                        const nums = [Math.floor(Math.random() * 30) + 20, Math.floor(Math.random() * 30) + 40, Math
                            .floor(Math.random() * 30) + 60, Math.floor(Math.random() * 20) + 50, Math.floor(Math
                                .random() * 20) + 30
                        ];
                        const sorted = [...nums].sort((a, b) => a - b);
                        question = `ข้อมูล: ${nums.join(', ')} จงหามัธยฐาน`;
                        answer = sorted[2];
                        hint = `เรียงข้อมูลแล้วหาค่ากลาง: ${sorted.join(', ')}`;
                    } else {
                        const nums = [2, 3, 3, 4, 5, 5, 5, 6, 7, 8];
                        question = `ข้อมูล: ${nums.join(', ')} จงหาฐานนิยม`;
                        answer = 5;
                        hint = 'ฐานนิยมคือค่าที่ซ้ำมากที่สุด';
                    }
                    break;
                case 7:
                    if (diff <= 1) {
                        const r = 3,
                            h = 7;
                        question = `ทรงกระบอก r=${r}, h=${h}, π=22/7 จงหาปริมาตร`;
                        answer = Math.round((22 / 7) * r * r * h);
                        hint = `πr²h = (22/7)×${r}²×${h}`;
                    } else if (diff === 2) {
                        question = `ทอยลูกเต๋า 2 ลูก ความน่าจะเป็นที่ผลรวมเป็น 7 (ตอบเป็นเศษส่วน a/b)`;
                        answer = '1/6';
                        hint = 'คู่ที่รวมได้ 7: (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) = 6/36 = 1/6';
                    } else {
                        const r = Math.floor(Math.random() * 3) + 3,
                            h = Math.floor(Math.random() * 5) + 5;
                        question = `กรวย r=${r}, h=${h}, π=22/7 จงหาปริมาตร (ปัดเศษ)`;
                        answer = Math.round((1 / 3) * (22 / 7) * r * r * h);
                        hint = `⅓πr²h = ⅓×(22/7)×${r}²×${h}`;
                    }
                    break;
                default:
                    question = '5 + 3 × 2 = ?';
                    answer = 11;
                    hint = 'คูณก่อนบวก';
            }
            return { question, answer, hint };
        }

        function renderScreen(screenName) {
            stopAllAnimations();
            const content = document.getElementById('gameContent');
            switch (screenName) {
                case 'menu':
                    content.innerHTML = renderMenu();
                    break;
                case 'classSelect':
                    content.innerHTML = renderClassSelect();
                    break;
                case 'chapters':
                    content.innerHTML = renderChapters();
                    break;
                case 'battle':
                    content.innerHTML = renderBattle();
                    setupBattleSprites();
                    setupBattle();
                    startBgMusic();
                    break;
                case 'shop':
                    content.innerHTML = renderShop();
                    break;
                case 'achievements':
                    content.innerHTML = renderAchievements();
                    break;
                case 'analytics':
                    content.innerHTML = renderAnalytics();
                    break;
                case 'dailyQuests':
                    content.innerHTML = renderDailyQuests();
                    break;
                case 'leaderboard':
                    content.innerHTML = renderLeaderboard();
                    break;
                default:
                    content.innerHTML = renderMenu();

            const colors = getPlayerColors();

                ansInput.disabled = false;
                ansInput.className = 'answer-input';
                setTimeout(() => ansInput.focus(), 100); }
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = false;
            const feedback = document.getElementById('feedbackMsg');
            if (feedback) feedback.textContent = '';
            const comboDisp = document.getElementById('comboDisplay');
            if (comboDisp) { comboDisp.textContent = '';
                comboDisp.classList.remove('active'); }
            updateCooldownUI();
        }

        function submitAnswer() {
            const input = document.getElementById('answerInput');
            if (!input || !currentQuestion) return;
            const userAnswer = input.value.trim();
            if (userAnswer === '') return;
            const correctAnswer = currentQuestion.answer.toString();
            let isCorrect = false;
            if (userAnswer === correctAnswer) isCorrect = true;
            else if (!isNaN(parseFloat(userAnswer)) && !isNaN(parseFloat(correctAnswer))) {
                isCorrect = Math.abs(parseFloat(userAnswer) - parseFloat(correctAnswer)) < 0.09;
            }
            input.disabled = true;
            document.getElementById('submitBtn').disabled = true;
            if (isCorrect) {
                input.classList.add('correct-flash');
                setTimeout(() => input.classList.remove('correct-flash'), 600);
                handleCorrectAnswer(input);
            } else {
                input.classList.add('wrong-flash');
                setTimeout(() => input.classList.remove('wrong-flash'), 600);
                handleWrongAnswer(input);
            }
        }

        function handleCorrectAnswer(inputElement) {
            sfxCorrect();
            player.combo++;
            player.totalCorrect++;
            if (player.combo > player.maxCombo) player.maxCombo = player.combo;
            updateQuestProgress('correct_answers', 1);
            if (player.combo >= 5) updateQuestProgress('high_combo', 1);
            if (!analytics[player.currentChapter]) analytics[player.currentChapter] = { correct: 0, wrong: 0,
            perfect: true };
            analytics[player.currentChapter].correct++;
            const cd = getClassDef();
            let damage = 25 + (player.combo * 5);
            damage = Math.round(damage * cd.baseDamageMultiplier);
            if (player.combo >= 5 && cd.comboBonus) damage = Math.round(damage * cd.comboBonus);
            let critChance = 0.1 + (cd.critChanceBonus || 0);
            if (inventory.orb) critChance += 0.2;
            let isCrit = Math.random() < critChance;
            if (skillActive.guaranteedCrit) { isCrit = true;
                skillActive.guaranteedCrit = false; }
            if (isCrit) {
                damage = Math.round(damage * (cd.critMultiplier || 3));
                sfxCrit();
                const bossCanvas = document.getElementById('bossSprite');
                if (bossCanvas) bossCanvas.classList.add('critical-strike');
                setTimeout(() => { if (bossCanvas) bossCanvas.classList.remove('critical-strike'); }, 600);
            }
            if (inventory.weapon) damage = Math.round(damage * 1.5);
            if (skillActive.critBoost && isCrit) {
                damage = Math.round(damage * (cd.skill1?.multiplier || 3));
                skillActive.critBoost = false;
            }
            player.bossHp = Math.max(0, player.bossHp - damage);
            player.score += 50 + (player.combo * 10);
            const rect = inputElement.getBoundingClientRect();
            spawnParticle(rect.left + rect.width / 2, rect.top, isCrit ? `💥${damage} CRIT!` : `⚡${damage}`,
                isCrit ? '#ffe600' : '#00f0ff');
            const feedback = document.getElementById('feedbackMsg');
            if (feedback) { feedback.textContent = `✅ ถูกต้อง! ดาเมจ ${damage} ${isCrit ? '💥 คริติคอล!' : ''}`;
                feedback.style.color = 'var(--neon-green)'; }
            if (player.combo >= 3) {
                const comboDisp = document.getElementById('comboDisplay');
                if (comboDisp) { comboDisp.textContent = `🔥 COMBO x${player.combo}! 🔥`;
                    comboDisp.classList.add('active'); }
                document.getElementById('comboBadge').textContent = `🔥 คอมโบ: ${player.combo}`;
            }
            const bossCanvas = document.getElementById('bossSprite');
            if (bossCanvas && !isCrit) { bossCanvas.classList.add('hit');
                setTimeout(() => bossCanvas.classList.remove('hit'), 300); }
            const playerCanvas = document.getElementById('playerSprite');
            if (playerCanvas) { playerCanvas.classList.add('attacking');
                setTimeout(() => playerCanvas.classList.remove('attacking'), 300); }
            updateBattleUI();
            reduceCooldowns();
            setTimeout(nextQuestion, 1200);
        }

        function handleWrongAnswer(inputElement) {
            sfxWrong();
            player.combo = 0;
            player.totalWrong++;
            if (analytics[player.currentChapter]) { analytics[player.currentChapter].wrong++;
                analytics[player.currentChapter].perfect = false; }
            let damageTaken = 15 + (player.currentLevel * 3);
            if (skillActive.dodge) {
                skillActive.dodge = false;
                damageTaken = 0;
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent = '💨 หลบหลีกสำเร็จ! ไม่ได้รับดาเมจ';
                    fb.style.color = 'var(--neon-green)'; }
                const playerCanvas = document.getElementById('playerSprite');
                if (playerCanvas) playerCanvas.style.opacity = '0.3';
                setTimeout(() => { if (playerCanvas) playerCanvas.style.opacity = '1'; }, 500);
            } else if (player.shield) {
                player.shield = false;
                damageTaken = 0;
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent = '🛡️ เกราะป้องกันดาเมจไว้ได้!';
                    fb.style.color = 'var(--neon-purple)'; }
            } else {
                player.hp = Math.max(0, player.hp - damageTaken);
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent =
                        `❌ ผิด! คำตอบคือ ${currentQuestion.answer} (-${damageTaken} HP) | 💡 ${currentQuestion.hint}`;
                    fb.style.color = 'var(--neon-pink)'; }
            }
            if (damageTaken > 0) {
                const rect = inputElement.getBoundingClientRect();
                spawnParticle(rect.left + rect.width / 2, rect.top, `-${damageTaken}❤️`, '#ff006e');
                const playerCanvas = document.getElementById('playerSprite');
                if (playerCanvas) { playerCanvas.classList.add('hit');
                    setTimeout(() => playerCanvas.classList.remove('hit'), 300); }
            }
            document.getElementById('comboBadge').textContent = '🔥 คอมโบ: 0';
            updateBattleUI();
            reduceCooldowns();
            setTimeout(nextQuestion, 2000);
        }

        function reduceCooldowns() {
            if (skillCooldowns.skill1 > 0) skillCooldowns.skill1--;
            if (skillCooldowns.skill2 > 0) skillCooldowns.skill2--;
            updateCooldownUI();
        }

        function updateCooldownUI() {
            const indicator = document.getElementById('cooldownIndicator');
            if (!indicator) return;
            const cd = getClassDef();
            let text = '';
            if (skillCooldowns.skill1 > 0) text +=
                `${cd.skill1.name} ติดคูลดาวน์ ${skillCooldowns.skill1} เทิร์น `;
            if (skillCooldowns.skill2 > 0) text +=
                `${cd.skill2.name} ติดคูลดาวน์ ${skillCooldowns.skill2} เทิร์น `;
            indicator.textContent = text;
            const btn1 = document.getElementById('btnSkill1');
            const btn2 = document.getElementById('btnSkill2');
            if (btn1) btn1.disabled = skillCooldowns.skill1 > 0 || player.score < cd.skill1.cost;
            if (btn2) btn2.disabled = skillCooldowns.skill2 > 0 || player.score < cd.skill2.cost;
        }

        function updateBattleUI() {
            const playerHpBar = document.getElementById('playerHpBar');
            const bossHpBar = document.getElementById('bossHpBar');
            const playerHpText = document.getElementById('playerHpText');
            const bossHpText = document.getElementById('bossHpText');
            if (playerHpBar) playerHpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            if (bossHpBar) bossHpBar.style.width = Math.max(0, (player.bossHp / player.bossMaxHp) * 100) + '%';
            if (playerHpText) playerHpText.textContent = `${player.hp}/${player.maxHp}`;
            if (bossHpText) bossHpText.textContent = `${player.bossHp}/${player.bossMaxHp}`;
            document.getElementById('comboBadge').textContent = `🔥 คอมโบ: ${player.combo}`;
        }

        function useSkill(type) {
            const cd = getClassDef();
            if (type === 'skill1') {
                if (skillCooldowns.skill1 > 0) return;
                if (player.score < cd.skill1.cost) { const fb = document.getElementById('feedbackMsg'); if (fb) { fb
                            .textContent = '⚠️ แต้มไม่พอ!';
                        fb.style.color = 'var(--neon-yellow)'; } return; }
                player.score -= cd.skill1.cost;
                skillCooldowns.skill1 = cd.skill1.cooldown;
                sfxSkill();
                if (cd.skill1.type === 'guaranteed_crit') skillActive.guaranteedCrit = true;
                if (cd.skill1.type === 'crit_boost') skillActive.critBoost = true;
                if (cd.skill1.type === 'damage_boost') {
                    const bonusDamage = Math.round(30 * (cd.skill1.multiplier || 2));
                    player.bossHp = Math.max(0, player.bossHp - bonusDamage);
                    const bossCanvas = document.getElementById('bossSprite');
                    if (bossCanvas) { bossCanvas.classList.add('hit');
                        setTimeout(() => bossCanvas.classList.remove('hit'), 300); }
                    screenShake();
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = `${cd.skill1.name}! ดาเมจ ${bonusDamage}`;
                        fb.style.color = 'var(--neon-orange)'; }
                    spawnParticleBurst(window.innerWidth / 2, window.innerHeight / 3, 8, ['⚔️', '💥', '🔥'], ['#ff6b35',
                        '#ff4500', '#ffd700'
                    ]);
                    updateBattleUI();
                }
                saveGame();
            } else if (type === 'skill2') {
                if (skillCooldowns.skill2 > 0) return;
                if (player.score < cd.skill2.cost) { const fb = document.getElementById('feedbackMsg'); if (fb) { fb
                            .textContent = '⚠️ แต้มไม่พอ!';
                        fb.style.color = 'var(--neon-yellow)'; } return; }
                player.score -= cd.skill2.cost;
                skillCooldowns.skill2 = cd.skill2.cooldown;
                sfxSkill();
                if (cd.skill2.type === 'shield') { player.shield = true;
                    updateBattleUI(); }
                if (cd.skill2.type === 'heal') {
                    player.hp = Math.min(player.maxHp, player.hp + cd.skill2.healAmount);
                    updateBattleUI();
                    const playerCanvas = document.getElementById('playerSprite');
                    if (playerCanvas) { playerCanvas.classList.add('heal-glow');
                        setTimeout(() => playerCanvas.classList.remove('heal-glow'), 800); }
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = `💚 ฮีล +${cd.skill2.healAmount} HP!`;
                        fb.style.color = 'var(--neon-green)'; }
                }
                if (cd.skill2.type === 'dodge') skillActive.dodge = true;
                saveGame();
            } else if (type === 'skip') {
                if (player.hp > 15) { player.hp -= 15;
                    player.combo = 0;
                    updateBattleUI();
                    reduceCooldowns();
                    nextQuestion(); const fb = document.getElementById('feedbackMsg'); if (fb) { fb.textContent =
                            '⏩ ข้ามข้อ เสีย 15 HP';
                        fb.style.color = 'var(--neon-orange)'; } }
            }
            updateCooldownUI();
        }

        function usePotion() {
            if (inventory.potion <= 0) return;
            inventory.potion--;
            player.hp = player.maxHp;
            updateBattleUI();
            const playerCanvas = document.getElementById('playerSprite');
            if (playerCanvas) { playerCanvas.classList.add('heal-glow');
                setTimeout(() => playerCanvas.classList.remove('heal-glow'), 800); }
            const fb = document.getElementById('feedbackMsg');
            if (fb) { fb.textContent = '🧪 ใช้โพชั่น! ฟื้นฟู HP เต็ม';
                fb.style.color = 'var(--neon-green)'; }
            saveGame();
        }

        function useSuperPotion() {
            if (inventory.superPotion <= 0) return;
            inventory.superPotion--;
            player.hp = player.maxHp;
            player.bossHp = Math.max(0, player.bossHp - 50);
            updateBattleUI();
            screenShake();
            const bossCanvas = document.getElementById('bossSprite');
            if (bossCanvas) { bossCanvas.classList.add('hit');
                setTimeout(() => bossCanvas.classList.remove('hit'), 300); }
            spawnParticleBurst(window.innerWidth / 2, window.innerHeight / 3, 15, ['💜', '✨', '💥'], ['#b537f2', '#fff',
                '#ff006e'
            ]);
            const fb = document.getElementById('feedbackMsg');
            if (fb) { fb.textContent = '💜 ซุปเปอร์โพชั่น! ฟื้น HP เต็ม + ดาเมจใส่บอส 50!';
                fb.style.color = 'var(--neon-purple)'; }
            saveGame();
        }

        function endBattle() {
            if (player.bossHp <= 0) {
                sfxWin();
                const bossCanvas = document.getElementById('bossSprite');
                if (bossCanvas) bossCanvas.classList.add('boss-defeated');
                const playerCanvas = document.getElementById('playerSprite');
                if (playerCanvas) playerCanvas.classList.add('player-victory');
                screenShake();
                spawnParticleBurst(window.innerWidth / 2, window.innerHeight / 3, 20);
                player.score += 200 + (player.currentLevel * 100);
                unlockNextLevel(player.currentChapter, player.currentLevel);
                if (analytics[player.currentChapter]) analytics[player.currentChapter].completed = true;
                if (player.currentLevel === 3) updateQuestProgress('boss_wins', 1);
                stopBgMusic();
                saveGame();
                setTimeout(() => {
                    stopAllAnimations();
                    showModal('🎉 ชัยชนะ!',
                        `คุณพิชิตด่าน ${player.currentLevel} บทที่ ${player.currentChapter} สำเร็จ!\nได้รับโบนัส ${200 + player.currentLevel * 100} แต้ม`,
                        () => renderScreen('chapters'));
                }, 1000);
            } else if (player.hp <= 0) {
                stopBgMusic();
                saveGame();
                stopAllAnimations();
                showModal('💀 พ่ายแพ้', 'คุณหมดพลังแล้ว! ลองใหม่อีกครั้ง', () => renderScreen('chapters'));
            }
        }

        function startLevel(chapterId, levelId) {
            if (!isLevelUnlocked(chapterId, levelId)) { showModal('🔒 ล็อคอยู่',
                'คุณต้องผ่านด่านก่อนหน้าก่อน!', null); return; }
            player.currentChapter = chapterId;
            player.currentLevel = levelId;
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCooldowns = { skill1: 0, skill2: 0 };
            skillActive = { guaranteedCrit: false, dodge: false, critBoost: false };
            renderScreen('battle');
        }

        function fleeBattle() {
            stopBgMusic();
            stopAllAnimations();
            player.score = Math.max(0, player.score - 30);
            saveGame();
            renderScreen('chapters');
        }

        function buyItem(type) {
            const prices = { weapon: 380, shield: 250, orb: 550, potion: 50, superPotion: 200 };
            if (player.score >= prices[type]) {
                player.score -= prices[type];
                if (type === 'potion') inventory.potion = (inventory.potion || 0) + 1;
                else if (type === 'superPotion') inventory.superPotion = (inventory.superPotion || 0) + 1;
                else inventory[type] = true;
                sfxPurchase();
                saveGame();
                renderScreen('shop');
            } else showModal('⚠️ แต้มไม่พอ', `คุณต้องการ ${prices[type]} แต้ม แต่มี ${player.score} แต้ม`, null);
        }

        function renderAnalytics() {
            let html =
                '<h3 style="color:white;text-align:center;margin-bottom:12px;">📊 วิเคราะห์ผลการเรียน</h3>';
            chapterData.forEach(ch => {
                const data = analytics[ch.id] || { correct: 0, wrong: 0 };
                const total = (data.correct || 0) + (data.wrong || 0);

                html +=
                    `<div class="shop-item"><div><b>${ch.icon} ${ch.name}</b><div class="text-sm" style="color:rgba(255,255,255,0.5);">ถูก ${data.correct || 0} | ผิด ${data.wrong || 0} | <span style="color:${color};font-weight:600;">${rate}%</span>${getChapterProgress(ch.id) >= 100 ? ' | ✅ ผ่านแล้ว' : ''}</div></div><div class="progress-bar" style="width:80px;"><div class="progress-fill" style="width:${rate}%;"></div></div></div>`;
            });
            html += '<button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
            return html;
        }

        function renderLeaderboard() {
            updateHighScore();
            let html =
                '<h3 style="color:white;text-align:center;margin-bottom:12px;">🏆 จัดอันดับผู้กล้า</h3><div class="flex-col" style="gap:6px;">';
            highScores.slice(0, 10).forEach((entry, i) => {
                const rankEmoji = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                const cd = classDefinitions[entry.class] || classDefinitions['warrior'];
                html +=
                    `<div class="shop-item" style="${entry.name === player.name ? 'border-color:var(--neon-yellow);' : ''}"><div><b>${rankEmoji} ${entry.name}</b><span class="badge badge-info ml-1">${cd.icon} ${cd.name}</span><span class="rank-badge rank-${entry.rank?.toLowerCase() || 'c'} ml-1">${entry.rank || 'C'}</span></div><div style="color:var(--neon-yellow);font-weight:700;">⭐ ${entry.score?.toLocaleString() || 0}</div></div>`;
            });
            if (highScores.length === 0) html +=
                '<div class="text-center" style="color:rgba(255,255,255,0.5);">ยังไม่มีผู้กล้าในทำเนียบ</div>';
            html += '</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
            return html;
        }

        function changeName() {
            const newName = prompt('ใส่ชื่อใหม่:', player.name);
            if (newName && newName.trim()) { player.name = newName.trim();
                saveGame();
                renderScreen('menu'); }
        }

        function resetGame() {
            if (confirm('คุณแน่ใจหรือไม่ที่จะรีเซ็ตข้อมูลทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้!')) {
                localStorage.removeItem('mathquest_tawan_ultimate');
                localStorage.removeItem('mathquest_daily_quests');
                localStorage.removeItem('mathquest_highscores');
                player = { name: 'ผู้กล้า', hp: 100, maxHp: 100, score: 0, combo: 0, maxCombo: 0, totalCorrect: 0,
                    totalWrong: 0, shield: false, currentChapter: null, currentLevel: 1, bossHp: 150, bossMaxHp: 150,
                    rank: 'C', exp: 0, level: 1 };
                playerClass = 'warrior';
                inventory = { weapon: false, shield: false, orb: false, potion: 0, superPotion: 0 };
                analytics = {};
                completedLevels = {};
                unlockedChapters = [1];
                skillCooldowns = { skill1: 0, skill2: 0 };
                skillActive = { guaranteedCrit: false, dodge: false, critBoost: false };
                dailyQuests = [];
                dailyQuestDate = '';
                highScores = [];
                player.maxHp = getMaxHp();
                player.hp = player.maxHp;
                renderScreen('menu');
            }
        }

        function showLockedMessage() { showModal('🔒 ยังไม่ปลดล็อค',
            'คุณต้องผ่านด่านทั้งหมดของบทก่อนหน้านี้ก่อน!', null); }

        function showModal(title, message, callback) {
            const container = document.getElementById('modalContainer');
            container.innerHTML =
                `<div class="modal-overlay" onclick="closeModal(${callback ? 'true' : 'false'})"><div class="modal-content" onclick="event.stopPropagation()"><h2 style="color:var(--neon-blue);margin-bottom:12px;">${title}</h2><p style="color:white;white-space:pre-line;margin-bottom:16px;">${message}</p><button class="btn btn-primary" onclick="closeModal(${callback ? 'true' : 'false'})">ตกลง</button></div></div>`;
            window._modalCallback = callback;
        }

        function closeModal(hasCallback) {
            document.getElementById('modalContainer').innerHTML = '';
            if (hasCallback === true || hasCallback === 'true') {
                const cb = window._modalCallback;
                if (cb && typeof cb === 'function') setTimeout(cb, 200);
            }
            window._modalCallback = null;
        }

        function bindGlobalEvents() {
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const answerInput = document.getElementById('answerInput');
                    if (answerInput && document.activeElement === answerInput) submitAnswer();
                }
            });
        }

        // ──────────────── INITIALIZATION ────────────────
        function init() {
            createStars();
            loadGame();
            player.maxHp = getMaxHp();
            if (player.hp > player.maxHp) player.hp = player.maxHp;
            generateDailyQuests();
            renderScreen('menu');
        }

        init();
        console.log('🎮 Math Quest Ultimate Edition Loaded Successfully!');
        console.log('📊 Total features: 7 Chapters × 3 Levels, 3 Classes, Daily Quests, Leaderboard, Pixel Art Engine');
        console.log('⚡ Made by ตะวันสุดหล่อ');
    </script>
</body>
  </html>
