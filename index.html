  * {

    margin: 0;
    padding: 0;
    user-select: none;

  html, body {
    width: 100%;

    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
    touch-action: none;

  #ui-layer {
    position: absolute;
    inset: 0;
    z-index: 10;

    flex-direction: column;
    justify-content: space-between;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    padding: 8px 18px;
    backdrop-filter: blur(16px);

    right: 14px;
    z-index: 25;

// Safe roundRect helper for cross-browser compatibility
function drawRoundedRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, r);
  } else {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
}

// Web Audio Synthesizer
class SoundFX {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  play(freq = 560, dur = 0.08, type = 'sine', vol = 0.06) {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + dur);
  }
  heartbeat() {
    this.play(92, 0.11, 'sine', 0.13);
    setTimeout(() => this.play(74, 0.15, 'sine', 0.1), 110);

function getHeroine() {

// Initialize Ambient Bokeh & Hearts
function initParticles() {
  state.particles = [];
  for (let i = 0; i < 34; i++) {
    state.particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 3 + Math.random() * 10,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -0.35 - Math.random() * 0.65,
      alpha: 0.16 + Math.random() * 0.42,
      kind: Math.random() > 0.7 ? 'heart' : 'bokeh'
    });
  }
}

function spawnInteractionFX(x, y, heartCount = 9) {
  state.ripples.push({ x, y, r: 6, alpha: 0.9 });
  for (let i = 0; i < heartCount; i++) {
    state.particles.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y + (Math.random() - 0.5) * 40,
      r: 6 + Math.random() * 6,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -1.5 - Math.random() * 2.2,
      alpha: 0.95,
      kind: 'heart',
      temp: true
    });
  }
}

function resizeCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
initParticles();

// Build Clean Unified Bottom Action Dock
function renderActionBar() {
  const bar = document.getElementById('action-bar');
  bar.innerHTML = '';

  if (!state.isHMode) {
    const touches = [
      { id: 'head', label: '👋 ลูบหัว' },
      { id: 'lips', label: '💋 จูบริมฝีปาก' },
      { id: 'chest', label: '💞 สัมผัสหน้าอก' },
      { id: 'thighs', label: '🦵 ลูบต้นขา' }
    ];
    touches.forEach(t => {
      const b = document.createElement('button');
      b.className = 'pill-btn';
      b.textContent = t.label;
      b.onclick = (e) => {
        e.stopPropagation();
        triggerTouchZone(t.id, window.innerWidth * 0.5, window.innerHeight * 0.45);
      };
      bar.appendChild(b);
    });
  } else {
    const speeds = [
      { s: 1, label: '🌸 จังหวะช้า' },
      { s: 2, label: '🔥 เร่าร้อน' },
      { s: 3, label: '⚡ รัวเร็ว' }
    ];
    speeds.forEach(sp => {
      const b = document.createElement('button');
      b.className = 'pill-btn' + (state.hSpeed === sp.s ? ' active' : '');
      b.textContent = sp.label;
      b.onclick = (e) => {
        e.stopPropagation();
        state.hSpeed = sp.s;
        sfx.heartbeat();
        const h = getHeroine();
        setDialogueBox(h.fullName, state.hSpeed >= 2 ? h.hFast : h.hSlow, null, true);
        renderActionBar();
      };
      bar.appendChild(b);
    });

    const poseBtn = document.createElement('button');
    poseBtn.className = 'pill-btn';
    poseBtn.textContent = state.hPose === 'normal' ? '🌙 ท่า: โอบกอด' : '🌙 ท่า: ขย่มรักบนตัก';
    poseBtn.onclick = (e) => {
      e.stopPropagation();
      state.hPose = state.hPose === 'normal' ? 'cowgirl' : 'normal';
      state.bLeftVel = -22;
      state.bRightVel = -18;
      sfx.play(610, 0.09, 'triangle', 0.08);
      renderActionBar();
    };
    bar.appendChild(poseBtn);

    const climaxBtn = document.createElement('button');
    climaxBtn.className = 'pill-btn active';
    climaxBtn.textContent = '💦 ปลดปล่อย (Climax)';
    climaxBtn.onclick = (e) => {
      e.stopPropagation();
      triggerClimaxScene();
    };
    bar.appendChild(climaxBtn);
  }
}

function updateHUD() {
  state.love = Math.min(100, Math.max(0, state.love));
  state.lust = Math.min(100, Math.max(0, state.lust));
  state.climax = Math.min(100, Math.max(0, state.climax));

  document.getElementById('txt-love').textContent = `${Math.round(state.love)}%`;
  document.getElementById('fill-love').style.width = `${state.love}%`;
  document.getElementById('txt-lust').textContent = `${Math.round(state.lust)}%`;
  document.getElementById('fill-lust').style.width = `${state.lust}%`;

  const climaxStat = document.getElementById('climax-stat');
  if (state.isHMode) {
    climaxStat.style.display = 'flex';
    document.getElementById('txt-climax').textContent = `${Math.round(state.climax)}%`;
    document.getElementById('fill-climax').style.width = `${state.climax}%`;
    document.getElementById('btn-hmode').textContent = '📖 กลับเนื้อเรื่อง';
    document.getElementById('btn-hmode').classList.add('active');
  } else {
    climaxStat.style.display = 'none';
    document.getElementById('btn-hmode').textContent = '🔥 ฉากรัก (H-Scene)';
    document.getElementById('btn-hmode').classList.remove('active');
  }

  const h = getHeroine();
  document.getElementById('btn-char').textContent = `👸 ${h.shortName}`;
  document.getElementById('btn-outfit').textContent = `👗 ${OUTFITS[state.outfitIdx]}`;
  document.getElementById('btn-camera').textContent = `🔍 ${CAMERAS[state.camIdx]}`;
}

function setDialogueBox(speaker, text, choices = null, isTemporary = false) {
  state.isTempReaction = isTemporary;
  document.getElementById('speaker-badge').textContent = speaker;
  document.getElementById('vn-text').textContent = text;
  const list = document.getElementById('choices-list');
  const prompt = document.getElementById('vn-prompt');
  list.innerHTML = '';

  if (choices && choices.length > 0) {
    prompt.style.display = 'none';
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice-card';
      btn.textContent = c.text;
      btn.onclick = (e) => {
        e.stopPropagation();
        sfx.play(650, 0.08, 'triangle', 0.07);
        if (c.love) state.love += c.love;
        if (c.lust) state.lust += c.lust;
        if (typeof c.outfit === 'number') state.outfitIdx = c.outfit;
        if (c.exp) state.exp = c.exp;
        if (c.startH) {
          enterHScene(c.outfit ?? 3);
        } else if (typeof c.next === 'number') {
          loadStoryStep(c.next);
        }
        updateHUD();
      };
      list.appendChild(btn);
    });
  } else {
    prompt.style.display = 'block';
    prompt.textContent = state.isHMode
      ? 'แตะเรือนร่างนางเอกหรือใช้แถบปุ่มด้านบน ▼'
      : 'คลิกกล่องข้อความเพื่อแสดงตัวเลือกเนื้อเรื่อง ▼';
  }
}

function loadStoryStep(idx) {
  state.isHMode = false;
  const h = getHeroine();
  state.stepIdx = idx % h.steps.length;
  const stepObj = h.steps[state.stepIdx];
  setDialogueBox(h.fullName, stepObj.text, stepObj.choices, false);
  renderActionBar();
  updateHUD();
}

function enterHScene(outfit = 3) {
  state.isHMode = true;
  state.outfitIdx = outfit;
  state.exp = 'aroused';
  state.climax = Math.max(15, state.climax);
  state.bLeftVel = -22;
  state.bRightVel = -18;
  sfx.heartbeat();
  const h = getHeroine();
  setDialogueBox(h.fullName, h.hSlow, null, true);
  renderActionBar();
  updateHUD();
}

function triggerClimaxScene() {
  const h = getHeroine();
  state.whiteFlash = 1.0;
  state.exp = 'climax';
  state.climax = 100;
  state.love = Math.min(100, state.love + 15);
  state.lust = Math.min(100, state.lust + 20);
  state.bLeftVel = -30;
  state.bRightVel = -25;
  sfx.heartbeat();
  spawnInteractionFX(window.innerWidth * 0.5, window.innerHeight * 0.42, 24);

  setDialogueBox(h.fullName, h.hClimax, [
    { text: `🔥 (${PROTAGONIST}) รักเธอต่ออีกยกอย่างเร่าร้อน!`, love: 10, lust: 20, startH: true },
    { text: `🌙 (${PROTAGONIST}) นอนกอดเธอแนบอกฟังเสียงหัวใจ (กลับสู่เนื้อเรื่อง)`, love: 20, lust: 5, outfit: 3, next: 0 }
  ], false);
  updateHUD();
}

function triggerTouchZone(zone, clientX, clientY) {
  const h = getHeroine();
  spawnInteractionFX(clientX, clientY, 9);

  if (zone === 'head') {
    sfx.play(600, 0.09, 'sine', 0.07);
    state.love += 6;
    state.exp = 'smile';
    setDialogueBox(h.fullName, h.touchHead, null, true);
  } else if (zone === 'lips') {
    sfx.play(740, 0.11, 'triangle', 0.08);
    state.love += 8;
    state.lust += 10;
    if (state.isHMode) state.climax += 14;
    state.exp = 'aroused';
    setDialogueBox(h.fullName, h.touchLips, null, true);
  } else if (zone === 'chest') {
    sfx.heartbeat();
    state.lust += 12;
    state.bLeftVel = -26;
    state.bRightVel = -21;
    state.bSquash = 0.26;
    if (state.isHMode) state.climax += 18;
    state.exp = 'aroused';
    setDialogueBox(h.fullName, h.touchChest, null, true);
  } else if (zone === 'thighs') {
    sfx.play(520, 0.1, 'sine', 0.08);
    state.lust += 12;
    if (state.isHMode) state.climax += 15;
    state.exp = 'shy';
    setDialogueBox(h.fullName, h.touchThighs, null, true);
  }

  if (state.isHMode && state.climax >= 100) {
    triggerClimaxScene();
  }
  updateHUD();
}

function drawHeart(x, y, s, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.28);
  ctx.bezierCurveTo(x, y - s * 0.1, x - s, y - s * 0.1, x - s, y + s * 0.42);
  ctx.bezierCurveTo(x - s, y + s * 0.85, x, y + s * 1.15, x, y + s * 1.4);
  ctx.bezierCurveTo(x, y + s * 1.15, x + s, y + s * 0.85, x + s, y + s * 0.42);
  ctx.bezierCurveTo(x + s, y - s * 0.1, x, y - s * 0.1, x, y + s * 0.28);
  ctx.fill();
  ctx.restore();
}

function drawBedroomBackground(w, h) {
  const px = state.lookX * -16;
  const py = state.lookY * -10;

  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0b061a');
  bg.addColorStop(0.48, '#1c0f36');
  bg.addColorStop(1, '#2a0d29');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  // Moonlit Window Glow
  const mx = w * 0.76 + px * 0.6;
  const my = h * 0.22 + py * 0.6;
  const mg = ctx.createRadialGradient(mx, my, 12, mx, my, Math.min(w, h) * 0.44);
  mg.addColorStop(0, 'rgba(255, 245, 255, 0.95)');
  mg.addColorStop(0.2, 'rgba(220, 190, 255, 0.42)');
  mg.addColorStop(0.55, 'rgba(165, 90, 235, 0.14)');
  mg.addColorStop(1, 'rgba(165, 90, 235, 0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, 0, w, h);

  // Silk Pillows & Luxury Bed
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = '#210e2b';
  drawRoundedRect(w * 0.12, h * 0.5, w * 0.76, h * 0.55, 40);
  ctx.fill();

  const pilGrad = ctx.createRadialGradient(w * 0.5, h * 0.62, 18, w * 0.5, h * 0.62, w * 0.3);
  pilGrad.addColorStop(0, '#4c2052');
  pilGrad.addColorStop(1, '#230c29');
  ctx.fillStyle = pilGrad;
  drawRoundedRect(w * 0.22, h * 0.54, w * 0.56, h * 0.34, 55);
  ctx.fill();
  ctx.restore();
}

function drawAnimeHeroine(w, h, time, dt) {
  const hero = getHeroine();

  state.lookX += (state.pointerX - state.lookX) * Math.min(1, dt * 8);
  state.lookY += (state.pointerY - state.lookY) * Math.min(1, dt * 8);

  const freq = state.isHMode ? (state.hSpeed === 1 ? 3.2 : state.hSpeed === 2 ? 6.5 : 11.2) : 1.7;
  const amp = state.isHMode ? (state.hSpeed === 1 ? 9 : state.hSpeed === 2 ? 17 : 26) : 3.2;
  const bounceY = Math.sin(time * freq) * amp;
  const swayX = state.isHMode && state.hPose === 'cowgirl' ? Math.cos(time * freq * 0.5) * 9 : 0;

  // Dual-spring breast physics
  const drive = state.isHMode ? Math.cos(time * freq) * (state.hSpeed * 13) : Math.cos(time * freq) * 1.5;
  const k = 155;
  const damp = 8.5;

  state.bLeftVel += (-k * state.bLeftY - damp * state.bLeftVel + drive) * dt;
  state.bLeftY = Math.max(-26, Math.min(26, state.bLeftY + state.bLeftVel * dt));

  state.bRightVel += (-k * state.bRightY - damp * state.bRightVel + drive * 0.92) * dt;
  state.bRightY = Math.max(-26, Math.min(26, state.bRightY + state.bRightVel * dt));
  state.bSquash *= 0.9;

  let zoom = Math.min(w / 540, h / 760);
  let baseCy = h * 0.45;
  if (state.camIdx === 1) {
    zoom *= 1.38;
    baseCy = h * 0.54;
  } else if (state.camIdx === 2) {
    zoom *= 0.88;
    baseCy = h * 0.41;
  }

  const cx = w * 0.5 + swayX;
  const cy = baseCy + bounceY;

  // Store real-time transform for 100% accurate click/touch hitboxes
  state.lastCenterX = cx;
  state.lastCenterY = cy;
  state.lastZoom = zoom;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(zoom, zoom);

  const lx = state.lookX * 12;
  const ly = state.lookY * 8;

  // 1. Back Long Hair
  if (hero.id !== 'rem') {
    ctx.save();
    ctx.translate(-lx * 0.35, -ly * 0.2);
    const bhGrad = ctx.createLinearGradient(0, -230, 0, 320);
    bhGrad.addColorStop(0, hero.hairTop);
    bhGrad.addColorStop(0.55, hero.hairMid);
    bhGrad.addColorStop(1, hero.hairBot);

    ctx.fillStyle = hero.hairShade;
    ctx.beginPath();
    ctx.moveTo(-102, -135);
    ctx.bezierCurveTo(-175, -10, -190, 180, -138, 340);
    ctx.lineTo(138, 340);
    ctx.bezierCurveTo(190, 180, 175, -10, 102, -135);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = bhGrad;
    ctx.beginPath();
    ctx.moveTo(-96, -140);
    ctx.bezierCurveTo(-162, -15, -172, 165, -120, 325);
    ctx.lineTo(-85, 295);
    ctx.lineTo(-55, 335);
    ctx.lineTo(-15, 305);
    ctx.lineTo(20, 335);
    ctx.lineTo(65, 298);
    ctx.lineTo(120, 325);
    ctx.bezierCurveTo(172, 165, 162, -15, 96, -140);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#32223d';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.restore();
  }

  // 2. Neck, Hourglass Torso, Hips & Thighs
  const skinGrad = ctx.createLinearGradient(0, -70, 0, 340);
  skinGrad.addColorStop(0, hero.skinLight);
  skinGrad.addColorStop(0.55, hero.skinMid);
  skinGrad.addColorStop(1, hero.skinShade);

  ctx.fillStyle = hero.skinMid;
  ctx.beginPath();
  ctx.moveTo(-23, -72);
  ctx.quadraticCurveTo(-21, -25, -30, 4);
  ctx.lineTo(30, 4);
  ctx.quadraticCurveTo(21, -25, 23, -72);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = hero.skinShade;
  ctx.beginPath();
  ctx.ellipse(0, -42, 22, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  const hipSpread = state.hPose === 'cowgirl' ? 26 : 0;
  ctx.fillStyle = skinGrad;
  ctx.beginPath();
  ctx.moveTo(-116, 14);
  ctx.bezierCurveTo(-142, 70, -135, 165, -112, 235);
  ctx.lineTo(-92, 235);
  ctx.bezierCurveTo(-102, 160, -102, 95, -86, 48);
  ctx.bezierCurveTo(-76, 98, -56, 138, -58, 168);
  ctx.bezierCurveTo(-62, 205, -108 - hipSpread, 255, -112 - hipSpread, 360);
  ctx.lineTo(-18, 360);
  ctx.quadraticCurveTo(0, 268, 18, 360);
  ctx.lineTo(112 + hipSpread, 360);
  ctx.bezierCurveTo(108 + hipSpread, 255, 62, 205, 58, 168);
  ctx.bezierCurveTo(56, 138, 76, 98, 86, 48);
  ctx.bezierCurveTo(102, 95, 102, 160, 92, 235);
  ctx.lineTo(112, 235);
  ctx.bezierCurveTo(135, 165, 142, 70, 116, 14);
  ctx.bezierCurveTo(75, -10, -75, -10, -116, 14);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#472531';
  ctx.lineWidth = 2.2;
  ctx.stroke();

  // Collarbone & Navel
  ctx.strokeStyle = '#c98882';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(-72, 8);
  ctx.bezierCurveTo(-45, 18, -22, 16, -9, 11);
  ctx.moveTo(72, 8);
  ctx.bezierCurveTo(45, 18, 22, 16, 9, 11);
  ctx.stroke();

  ctx.fillStyle = '#c9827b';
  ctx.beginPath();
  ctx.ellipse(0, 182, 2.6, 5.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Stockings & Garter Straps
  ctx.save();
  ctx.fillStyle = hero.stocking;
  ctx.beginPath();
  ctx.moveTo(-104 - hipSpread * 0.7, 278);
  ctx.quadraticCurveTo(-60, 292, -18, 282);
  ctx.lineTo(-14, 360);
  ctx.lineTo(-114 - hipSpread, 360);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(18, 282);
  ctx.quadraticCurveTo(60, 292, 104 + hipSpread * 0.7, 278);
  ctx.lineTo(114 + hipSpread, 360);
  ctx.lineTo(14, 360);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = hero.outfitSub;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-104 - hipSpread * 0.7, 278);
  ctx.quadraticCurveTo(-60, 292, -18, 282);
  ctx.moveTo(18, 282);
  ctx.quadraticCurveTo(60, 292, 104 + hipSpread * 0.7, 278);
  ctx.stroke();
  ctx.restore();

  if (state.outfitIdx <= 2) {
    ctx.fillStyle = state.outfitIdx === 2 ? 'rgba(24, 12, 36, 0.85)' : hero.outfitSub;
    ctx.beginPath();
    ctx.moveTo(-84, 218);
    ctx.quadraticCurveTo(0, 242, 84, 218);
    ctx.quadraticCurveTo(36, 265, 0, 285);
    ctx.quadraticCurveTo(-36, 265, -84, 218);
    ctx.closePath();
    ctx.fill();
  }

  // 3. Teardrop Breasts with Dual-Spring Physics
  const drawBreast = (side) => {
    const bOff = side === -1 ? state.bLeftY : state.bRightY;
    const by = 72 + bOff;
    const sq = 1 + state.bSquash * 0.14;

    ctx.save();
    ctx.translate(side * 45, by);
    ctx.scale(sq, 1 / sq);

    ctx.fillStyle = 'rgba(185, 95, 95, 0.38)';
    ctx.beginPath();
    ctx.bezierCurveTo(-side * 42, 12, -side * 38, 64, 0, 64);
    ctx.bezierCurveTo(side * 46, 64, side * 56, 24, side * 48, -6);
    ctx.fill();

    const bGrad = ctx.createRadialGradient(-side * 10, -8, 6, 0, 12, 64);
    bGrad.addColorStop(0, '#fff9f7');
    bGrad.addColorStop(0.55, hero.skinMid);
    bGrad.addColorStop(0.88, hero.skinShade);
    bGrad.addColorStop(1, '#d99389');

    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.moveTo(-side * 42, -32);
    ctx.bezierCurveTo(-side * 46, 4, -side * 44, 52, 0, 54);
    ctx.bezierCurveTo(side * 48, 54, side * 58, 12, side * 38, -28);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#472531';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-side * 41, -6);
    ctx.bezierCurveTo(-side * 44, 46, -side * 10, 54, side * 4, 54);
    ctx.bezierCurveTo(side * 48, 54, side * 56, 12, side * 38, -26);
    ctx.stroke();

    if (state.outfitIdx >= 2) {
      const alpha = state.outfitIdx === 3 ? 0.92 : 0.5;
      const nx = side * 12;
      const ny = 18;
      const ag = ctx.createRadialGradient(nx, ny, 2, nx, ny, 14);
      ag.addColorStop(0, `rgba(245, 95, 130, ${alpha})`);
      ag.addColorStop(0.7, `rgba(255, 145, 168, ${alpha * 0.85})`);
      ag.addColorStop(1, 'rgba(255, 160, 175, 0)');
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.arc(nx, ny, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(225, 60, 105, ${alpha})`;
      ctx.beginPath();
      ctx.arc(nx + side * 1.5, ny, 4.8, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(255, 255, 255, 0.58)';
    ctx.beginPath();
    ctx.ellipse(side * 6, -4, 15, 6.5, side * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  drawBreast(-1);
  drawBreast(1);

  const avgBY = 72 + (state.bLeftY + state.bRightY) * 0.5;
  ctx.strokeStyle = '#5e2936';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(0, avgBY - 18);
  ctx.quadraticCurveTo(-2, avgBY + 14, 0, avgBY + 38);
  ctx.stroke();

  // 4. Outfits Layer
  if (state.outfitIdx === 0) {
    ctx.save();
    ctx.fillStyle = hero.outfitMain;
    ctx.beginPath();
    ctx.moveTo(-88, 36);
    ctx.quadraticCurveTo(-45, avgBY - 25, 0, avgBY + 14);
    ctx.quadraticCurveTo(45, avgBY - 25, 88, 36);
    ctx.lineTo(74, 225);
    ctx.quadraticCurveTo(0, 248, -74, 225);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = hero.outfitSub;
    ctx.lineWidth = 5;
    ctx.stroke();

    if (hero.id === 'emilia') {
      ctx.fillStyle = '#2ecc71';
      ctx.beginPath();
      ctx.moveTo(0, avgBY - 14);
      ctx.lineTo(8, avgBY - 2);
      ctx.lineTo(0, avgBY + 10);
      ctx.lineTo(-8, avgBY - 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  } else if (state.outfitIdx === 1) {
    ctx.save();
    const dg = ctx.createLinearGradient(0, 30, 0, 260);
    dg.addColorStop(0, '#c91e5a');
    dg.addColorStop(1, '#5e0b2c');
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.moveTo(-82, 46);
    ctx.quadraticCurveTo(-45, avgBY - 22, 0, avgBY + 22);
    ctx.quadraticCurveTo(45, avgBY - 22, 82, 46);
    ctx.lineTo(88, 255);
    ctx.quadraticCurveTo(0, 270, -88, 255);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  } else if (state.outfitIdx === 2) {
    ctx.save();
    ctx.fillStyle = 'rgba(20, 10, 34, 0.58)';
    [-1, 1].forEach(s => {
      const bY = 72 + (s === -1 ? state.bLeftY : state.bRightY);
      ctx.beginPath();
      ctx.arc(s * 45, bY + 8, 46, 0.05 * Math.PI, 0.95 * Math.PI);
      ctx.fill();
      ctx.strokeStyle = hero.outfitSub;
      ctx.lineWidth = 3;
      ctx.stroke();
    });
    ctx.restore();
  }

  // 5. Head, Ears, 10-Layer Eyes & Expressions
  ctx.save();
  ctx.translate(lx * 0.65, ly * 0.55 - 122);
  ctx.rotate(state.lookX * 0.05);

  [-1, 1].forEach(s => {
    ctx.fillStyle = hero.skinMid;
    ctx.strokeStyle = '#472531';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (hero.elfEars) {
      ctx.moveTo(s * 68, -6);
      ctx.quadraticCurveTo(s * 108, -28, s * 118, -42);
      ctx.quadraticCurveTo(s * 102, 8, s * 66, 24);
    } else {
      ctx.moveTo(s * 68, -8);
      ctx.quadraticCurveTo(s * 86, -12, s * 82, 12);
      ctx.quadraticCurveTo(s * 76, 24, s * 66, 22);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  const fg = ctx.createLinearGradient(0, -95, 0, 95);
  fg.addColorStop(0, hero.skinLight);
  fg.addColorStop(0.75, hero.skinMid);
  fg.addColorStop(1, '#f5c6ba');
  ctx.fillStyle = fg;
  ctx.strokeStyle = '#472531';
  ctx.lineWidth = 2.3;
  ctx.beginPath();
  ctx.moveTo(-72, -32);
  ctx.bezierCurveTo(-74, 18, -58, 56, -28, 80);
  ctx.quadraticCurveTo(0, 98, 28, 80);
  ctx.bezierCurveTo(58, 56, 74, 18, 72, -32);
  ctx.bezierCurveTo(68, -105, -68, -105, -72, -32);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  const blushAlpha = Math.min(0.88, 0.25 + (state.lust / 100) * 0.45 + (state.isHMode ? 0.25 : 0));
  [-38, 38].forEach(bx => {
    const cg = ctx.createRadialGradient(bx, 28, 2, bx, 28, 28);
    cg.addColorStop(0, `rgba(255, 70, 120, ${blushAlpha})`);
    cg.addColorStop(1, 'rgba(255, 70, 120, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(bx, 28, 28, 0, Math.PI * 2);
    ctx.fill();
  });

  state.blinkTimer += dt;
  if (state.blinkTimer > 3.8) {
    state.isBlinking = true;
    if (state.blinkTimer > 3.94) {
      state.isBlinking = false;
      state.blinkTimer = 0;
    }
  }

  const drawEye = (side) => {
    ctx.save();
    ctx.translate(side * 34, 2);
    if (state.isBlinking || state.exp === 'climax') {
      ctx.strokeStyle = '#2b1222';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 4, 18, 0.12 * Math.PI, 0.88 * Math.PI);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-19, 0);
      ctx.bezierCurveTo(-14, -16, 14, -16, 19, 0);
      ctx.bezierCurveTo(14, 15, -14, 15, -19, 0);
      ctx.closePath();
      ctx.fill();

      const gx = state.lookX * 4.5;
      const gy = state.lookY * 3.5;

      const ig = ctx.createLinearGradient(gx, gy - 14, gx, gy + 14);
      ig.addColorStop(0, hero.eyeTop);
      ig.addColorStop(0.55, hero.eyeMid);
      ig.addColorStop(1, hero.eyeBot);
      ctx.fillStyle = ig;
      ctx.beginPath();
      ctx.ellipse(gx, gy + 1, 13.5, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1a091e';
      ctx.beginPath();
      ctx.arc(gx, gy + 1.5, 5.5, 0, Math.PI * 2);
      ctx.fill();

      if (state.exp === 'aroused' || state.isHMode || state.lust >= 50) {
        drawHeart(gx, gy - 4.5, 6.2, '#ffb3d9', 0.95);
      }

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(gx - 6, gy - 6, 4.8, 3.8, -0.3, 0, Math.PI * 2);
      ctx.arc(gx + 6, gy + 5, 2.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#240d1e';
      ctx.beginPath();
      ctx.moveTo(-22, 2);
      ctx.bezierCurveTo(-15, -18, 15, -18, 22, 2);
      ctx.lineTo(25 * side, -3);
      ctx.bezierCurveTo(14, -22, -14, -22, -22, 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  };

  drawEye(-1);
  drawEye(1);

  // Lips & Mouth
  ctx.save();
  ctx.translate(0, 54);
  if (state.exp === 'smile') {
    ctx.fillStyle = '#e05378';
    ctx.beginPath();
    ctx.arc(0, -2, 10, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.fill();
  } else if (state.exp === 'aroused' || state.isHMode || state.exp === 'climax') {
    const openH = state.exp === 'climax' ? 13 : 9.5 + Math.sin(time * freq) * 2.5;
    ctx.fillStyle = '#7a1938';
    ctx.beginPath();
    ctx.ellipse(0, 2, 10, openH, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff7ca3';
    ctx.beginPath();
    ctx.ellipse(0, 5, 7, openH * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(255, 115, 150, 0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 1, 9, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b84664';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.quadraticCurveTo(0, 3.5, 9, 0);
    ctx.stroke();
  }
  ctx.restore();

  // Front Hair Bangs & Accessories
  const fhGrad = ctx.createLinearGradient(0, -110, 0, 110);
  fhGrad.addColorStop(0, hero.hairTop);
  fhGrad.addColorStop(0.65, hero.hairMid);
  fhGrad.addColorStop(1, hero.hairBot);

  ctx.fillStyle = fhGrad;
  ctx.strokeStyle = '#32223d';
  ctx.lineWidth = 2;

  [-1, 1].forEach(s => {
    ctx.beginPath();
    ctx.moveTo(s * 66, -55);
    ctx.bezierCurveTo(s * 92, 10, s * 86, 95, s * 52, 165);
    ctx.bezierCurveTo(s * 64, 95, s * 62, 25, s * 54, -25);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  ctx.beginPath();
  ctx.moveTo(-76, -35);
  ctx.bezierCurveTo(-68, -108, 68, -108, 76, -35);
  if (hero.id === 'rem') {
    ctx.lineTo(52, 12);
    ctx.lineTo(18, 22);
    ctx.lineTo(4, -18);
    ctx.lineTo(-14, -4);
    ctx.lineTo(-34, -26);
    ctx.lineTo(-56, -6);
  } else {
    ctx.lineTo(56, -6);
    ctx.lineTo(36, -34);
    ctx.lineTo(16, 2);
    ctx.lineTo(0, -28);
    ctx.lineTo(-16, 2);
    ctx.lineTo(-36, -34);
    ctx.lineTo(-56, -6);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  if (hero.id === 'emilia') {
    [-64, 64].forEach(rx => {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(rx, -28, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#9b59b6';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    });
  } else if (hero.id === 'rem') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.arc(0, -26, 68, 1.18 * Math.PI, 1.82 * Math.PI);
    ctx.stroke();
  } else if (hero.id === 'echidna') {
    ctx.fillStyle = '#1b1429';
    ctx.strokeStyle = '#b8ff66';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-54, -36);
    ctx.lineTo(-74, -52);
    ctx.lineTo(-68, -22);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore(); // End Head
  ctx.restore(); // End Heroine
}

function drawParticlesAndRipples(w, h) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.temp) {
      p.alpha -= 0.018;
      if (p.alpha <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
    } else if (p.y < -20) {
      p.y = h + 20;
      p.x = Math.random() * w;
    }

    if (p.kind === 'heart' || state.isHMode) {
      drawHeart(p.x, p.y, p.r * 0.7, '#ff5c9e', p.alpha);
    } else {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = '#ffe6f7';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Visual Touch Feedback Ripples
  for (let i = state.ripples.length - 1; i >= 0; i--) {
    const rp = state.ripples[i];
    rp.r += 2.4;
    rp.alpha -= 0.04;
    if (rp.alpha <= 0) {
      state.ripples.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.strokeStyle = `rgba(255, 130, 190, ${rp.alpha})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// Main Loop
let lastTime = performance.now();
let hVoiceTimer = 0;

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const time = now / 1000;
  const w = window.innerWidth;
  const h = window.innerHeight;

  if (state.isHMode && state.climax < 100) {
    const rate = state.hSpeed === 1 ? 4.2 : state.hSpeed === 2 ? 8.8 : 15.5;
    state.climax = Math.min(100, state.climax + rate * dt);
    document.getElementById('txt-climax').textContent = `${Math.round(state.climax)}%`;
    document.getElementById('fill-climax').style.width = `${state.climax}%`;

    hVoiceTimer += dt;
    if (hVoiceTimer > 4.0) {
      hVoiceTimer = 0;
      const hero = getHeroine();
      setDialogueBox(hero.fullName, state.hSpeed >= 2 ? hero.hFast : hero.hSlow, null, true);
    }

    if (state.climax >= 100) {
      triggerClimaxScene();
    }
  }

  drawBedroomBackground(w, h);
  drawAnimeHeroine(w, h, time, dt);
  drawParticlesAndRipples(w, h);

  if (state.whiteFlash > 0) {
    ctx.fillStyle = `rgba(255, 245, 252, ${state.whiteFlash})`;
    ctx.fillRect(0, 0, w, h);
    state.whiteFlash = Math.max(0, state.whiteFlash - dt * 1.5);
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================================
// RELIABLE INPUT & EVENT HANDLERS (ZERO DEAD CLICKS)
// ============================================================================

window.addEventListener('pointermove', (e) => {
  state.pointerX = (e.clientX / window.innerWidth) * 2 - 1;
  state.pointerY = (e.clientY / window.innerHeight) * 2 - 1;
});

// Direct Canvas Touch / Click using real-time animated transform coordinates
canvas.addEventListener('pointerdown', (e) => {
  const lx = (e.clientX - state.lastCenterX) / state.lastZoom;
  const ly = (e.clientY - state.lastCenterY) / state.lastZoom;

  if (Math.abs(lx) < 135) {
    if (ly >= -230 && ly < -95) {
      triggerTouchZone('head', e.clientX, e.clientY);
      return;
    } else if (ly >= -95 && ly < -25) {
      triggerTouchZone('lips', e.clientX, e.clientY);
      return;
    } else if (ly >= -25 && ly < 145) {
      triggerTouchZone('chest', e.clientX, e.clientY);
      return;
    } else if (ly >= 145 && ly <= 360) {
      triggerTouchZone('thighs', e.clientX, e.clientY);
      return;
    }
  }
  // Clicking outside the body still gives a subtle ripple & restores story choices if interrupted
  spawnInteractionFX(e.clientX, e.clientY, 3);
  if (!state.isHMode && state.isTempReaction) {
    loadStoryStep(state.stepIdx);
  }
});

// Clicking Dialogue Box ALWAYS recovers story choices or advances step
document.getElementById('vn-box').addEventListener('click', () => {
  sfx.play(500, 0.06, 'sine', 0.05);
  if (state.isHMode) {
    triggerTouchZone('chest', window.innerWidth * 0.5, window.innerHeight * 0.48);
    return;
  }
  if (state.isTempReaction) {
    loadStoryStep(state.stepIdx);
  } else {
    loadStoryStep(state.stepIdx + 1);
  }
});

// Top Toolbar Buttons
document.getElementById('btn-char').addEventListener('click', () => {
  state.charIdx = (state.charIdx + 1) % HEROINES.length;
  state.bLeftVel = -18;
  state.bRightVel = -14;
  sfx.play(620, 0.08, 'triangle', 0.08);
  loadStoryStep(0);
});

document.getElementById('btn-outfit').addEventListener('click', () => {
  state.outfitIdx = (state.outfitIdx + 1) % OUTFITS.length;
  state.bLeftVel = -16;
  state.bRightVel = -13;
  sfx.play(550, 0.08, 'sine', 0.07);
  updateHUD();
});

document.getElementById('btn-camera').addEventListener('click', () => {
  state.camIdx = (state.camIdx + 1) % CAMERAS.length;
  sfx.play(580, 0.07, 'sine', 0.06);
  updateHUD();
});

document.getElementById('btn-hmode').addEventListener('click', () => {
  if (state.isHMode) loadStoryStep(state.stepIdx);
  else enterHScene(3);
});

document.getElementById('btn-toggle-ui').addEventListener('click', () => {
  state.uiHidden = !state.uiHidden;
  const uiLayer = document.getElementById('ui-layer');
  uiLayer.style.opacity = state.uiHidden ? '0' : '1';
  uiLayer.style.pointerEvents = 'none';
  // Disable child pointer events when hidden so full screen canvas is touchable
  document.querySelectorAll('#ui-layer .status-pill, #ui-layer .top-actions, #ui-layer #action-bar, #ui-layer #choices-list, #ui-layer #vn-box').forEach(el => {
    el.style.pointerEvents = state.uiHidden ? 'none' : 'auto';
  });
  document.getElementById('btn-toggle-ui').textContent = state.uiHidden ? '👁️ แสดง UI' : '👁️ ซ่อน UI';
});

// Boot Game
loadStoryStep(0);
requestAnimationFrame(gameLoop);
</script>
