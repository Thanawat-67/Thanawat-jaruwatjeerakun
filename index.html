/* ============ HELPER ============ */

/* ============ AUDIO ============ */
var Audio = (function(){
  var ctx = null;
  var enabled = true;
  var musicTimer = null;
  var musicStep = 0;
  
  function init(){
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {
      console.warn('Audio not supported');
    }
  }
  
  function resume(){
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  
  function tone(freq, type, dur, vol, delay){
    if (!ctx || !enabled) return;
    try {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      var t0 = ctx.currentTime + (delay || 0);
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol || 0.08, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    } catch(e) {}
  }
  
  function sfxClick(){ tone(700, 'sine', 0.08, 0.08); }
  function sfxCorrect(){
    tone(659, 'triangle', 0.15, 0.10);
    tone(880, 'triangle', 0.15, 0.10, 0.06);
    tone(1318, 'triangle', 0.2, 0.10, 0.12);
  }
  function sfxWrong(){
    tone(200, 'sawtooth', 0.2, 0.10);
    tone(140, 'sawtooth', 0.25, 0.10, 0.1);
  }
  function sfxCrit(){
    tone(500, 'square', 0.1, 0.12);
    tone(1500, 'square', 0.15, 0.12, 0.05);
    tone(2000, 'square', 0.2, 0.10, 0.1);
  }
  function sfxWin(){
    var notes = [523, 659, 784, 1047, 1319];
    notes.forEach(function(f, i){ tone(f, 'triangle', 0.22, 0.12, i * 0.09); });
  }
  function sfxLose(){
    var notes = [420, 340, 270, 200];
    notes.forEach(function(f, i){ tone(f, 'sawtooth', 0.2, 0.10, i * 0.1); });
  }
  function sfxGold(){
    tone(1400, 'triangle', 0.08, 0.08);
    tone(2100, 'triangle', 0.12, 0.08, 0.06);
  }
  function sfxLevel(){
    var notes = [523, 659, 784, 1047, 1319];
    notes.forEach(function(f, i){ tone(f, 'triangle', 0.2, 0.12, i * 0.08); });
  }
  
  function startMusic(){
    if (!ctx || musicTimer) return;
    musicStep = 0;
    var scale = [220, 262, 330, 392];
    musicTimer = setInterval(function(){
      if (!ctx || !enabled) return;
      var s = musicStep % 16;
      if (s % 2 === 0) {
        var n = scale[Math.floor(musicStep / 4) % scale.length];
        tone(n, 'square', 0.15, 0.03);
      }
      if (s % 4 === 0) {
        tone(110, 'triangle', 0.35, 0.05);
      }
      musicStep++;
    }, 250);
  }
  
  function stopMusic(){
    if (musicTimer) clearInterval(musicTimer);
    musicTimer = null;
  }
  
  function setEnabled(v){
    enabled = v;
  }
  
  return {
    init: init,
    resume: resume,
    click: sfxClick,
    correct: sfxCorrect,
    wrong: sfxWrong,
    crit: sfxCrit,
    win: sfxWin,
    lose: sfxLose,
    gold: sfxGold,
    level: sfxLevel,
    startMusic: startMusic,
    stopMusic: stopMusic,
    setEnabled: setEnabled
  };
})();

/* ============ PARTICLES ============ */
var Particles = (function(){
  var canvas = document.getElementById('bgCanvas');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;
  var particles = [];
  var stars = [];
  
  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    initStars();
  }
  
  function initStars(){
    stars = [];
    var n = Math.floor(W * H / 15000);
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random(),
        da: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? -1 : 1)
      });
    }
  }
  
  function burst(x, y, opts){
    opts = opts || {};
    var n = opts.count || 20;
    var colors = opts.colors || ['#00f0ff', '#ff006e', '#ffe600', '#39ff14'];
    var speed = opts.speed || 5;
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = speed * (0.5 + Math.random() * 0.8);
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        size: 2 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }
  
  function update(){
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= p.decay;
      if (p.life <= 0 || particles.length > 400) {
        particles.splice(i, 1);
      }
    }
    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      s.a += s.da;
      if (s.a <= 0 || s.a >= 1) s.da = -s.da;
    }
  }
  
  function draw(){
    ctx.clearRect(0, 0, W, H);
    
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = Math.max(0.05, Math.min(1, s.a)) * 0.5;
      ctx.fillStyle = '#a0d8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.globalAlpha = 1;
  }
  
  var running = true;
  function loop(){
    if (!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
  }
  
  window.addEventListener('resize', resize);
  resize();
  loop();
  
  return { burst: burst };
})();

/* ============ FLOAT TEXT ============ */
function floatText(x, y, text, cls){
  var el = document.createElement('div');
  el.className = 'ft ' + (cls || '');
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(function(){
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 1200);
}

    };

      return d;
    } catch(e) {

  },

    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(s));
      return true;
    } catch(e) {
      return false;
    }
  },
  clear: function(){
    try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
  }
};

/* ============ HELPERS ============ */
function getClass(){
  return BaseClasses[state.pclass] || AdvanceClasses[state.pclass] || BaseClasses.warrior;
}

function getPetBonus(){
  if (!state.epet || !Pets[state.epet]) return { dmg: 0, crit: 0, combo: 0, hp: 0 };
  var p = Pets[state.epet];
  var b = { dmg: 0, crit: 0, combo: 0, hp: 0 };
  if (p.bonus === 'dmg') b.dmg = p.amt;
  else if (p.bonus === 'crit') b.crit = p.amt;
  else if (p.bonus === 'combo') b.combo = p.amt;
  else if (p.bonus === 'hp') b.hp = p.amt;
  else if (p.bonus === 'both') { b.dmg = p.amt; b.crit = p.amt; }
  else if (p.bonus === 'all') { b.dmg = p.amt; b.crit = p.amt; b.combo = p.amt; }
  return b;
}

function getMaxHp(){
  var pb = getPetBonus();
  return 100 + (getClass().hp || 0) + (state.player.plv - 1) * 5 +
    state.inv.s * 12 + state.inv.h * 5 + state.inv.a * 8 + state.inv.p * 6 + (pb.hp || 0);
}

function getWeaponMul(){
  return 1 + state.inv.w * 0.20;
}

function answersMatch(user, correct){
  if (user === undefined || user === null) return false;
  var u = String(user).trim();
  var c = String(correct).trim();
  if (!u) return false;
  if (u === c) return true;
  var un = parseFloat(u);
  var cn = parseFloat(c);
  if (!isNaN(un) && !isNaN(cn) && Math.abs(un - cn) < 0.01) return true;
  return false;
}

  hideNumpad();

  skillCD = { s1: 0, s2: 0 };
  skillUses = { s1: 0, s2: 0 };
  state.player.bossMaxHp = 150 + state.player.ch * 20 + state.player.lv * 50;
  state.player.bossHp = state.player.bossMaxHp;
  updateBattleUI();
  updateSkillButtons();
  nextQuestion();
}

function updateBattleUI(){
  var pHp = $('pHp'), bHp = $('bHp');
  var pHpTxt = $('pHpTxt'), bHpTxt = $('bHpTxt');
  var comboBadge = $('comboBadge');
  if (!pHp) return;
  pHp.style.width = Math.max(0, (state.player.hp / state.player.maxHp) * 100) + '%';
  bHp.style.width = Math.max(0, (state.player.bossHp / state.player.bossMaxHp) * 100) + '%';
  pHpTxt.textContent = Math.max(0, Math.round(state.player.hp)) + '/' + state.player.maxHp;
  bHpTxt.textContent = Math.max(0, Math.round(state.player.bossHp)) + '/' + state.player.bossMaxHp;
  comboBadge.textContent = state.player.combo;
}

function updateSkillButtons(){
  var cd = getClass();
  var b1 = $('btnS1'), b2 = $('btnS2');
  if (!b1 || !b2) return;
  var now = Date.now();
  var r1 = Math.max(0, Math.ceil((skillCD.s1 - now) / 1000));
  var r2 = Math.max(0, Math.ceil((skillCD.s2 - now) / 1000));
  b1.textContent = cd.s1.n + (r1 > 0 ? ' ⏳' + r1 + 's' : ' (' + cd.s1.cost + '🪙)');
  b2.textContent = cd.s2.n + (r2 > 0 ? ' ⏳' + r2 + 's' : ' (' + cd.s2.cost + '🪙)');
  b1.disabled = r1 > 0 || state.player.gold < cd.s1.cost;
  b2.disabled = r2 > 0 || state.player.gold < cd.s2.cost;
}

function startTimer(){
  if (battleTimer) clearInterval(battleTimer);
  timerMax = state.player.lv === 5 ? 40 : (state.player.lv === 4 ? 45 : 60);
  timerLeft = timerMax;
  var bar = $('tBar'), txt = $('tTxt');
  if (bar) bar.style.width = '100%';
  if (txt) txt.textContent = '⏱ ' + timerMax + 's';
  battleTimer = setInterval(function(){
    if (battleEnded) { clearInterval(battleTimer); battleTimer = null; return; }
    timerLeft--;
    var pct = Math.max(0, (timerLeft / timerMax) * 100);
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = '⏱ ' + Math.max(0, timerLeft) + 's';
    if (timerLeft <= 0) {
      clearInterval(battleTimer);
      battleTimer = null;
      timeUp();
    }
  }, 1000);
}

function timeUp(){
  if (battleEnded) return;
  var inp = $('ansInp'), sb = $('subBtn');
  if (inp) inp.disabled = true;
  if (sb) sb.disabled = true;
  handleWrong(true);
}

function nextQuestion(){
  if (battleEnded || currentScreen !== 'battle') return;
  if (state.player.bossHp <= 0 || state.player.hp <= 0) { endBattle(); return; }
  isSubmitting = false;
  currentQuest = generateQuestion(state.player.ch, state.player.lv);
  var qEl = $('qTxt');
  if (qEl) qEl.textContent = currentQuest.q;
  var inp = $('ansInp');
  if (inp) {
    inp.value = '';
    inp.disabled = false;
    try { inp.focus(); } catch(e) {}
  }
  var sb = $('subBtn');
  if (sb) sb.disabled = false;
  var fb = $('fbMsg');
  if (fb) { fb.textContent = ''; fb.style.color = '#c8c8e0'; }
  var cdisp = $('comboDisp');
  if (cdisp) cdisp.textContent = '';
  updateSkillButtons();
  startTimer();
}

function submitAnswer(){
  if (isSubmitting || battleEnded) return;
  if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
  var inp = $('ansInp');
  if (!inp || !currentQuest) return;
  var ua = inp.value.trim();
  if (!ua) return;
  isSubmitting = true;
  inp.disabled = true;
  var sb = $('subBtn');
  if (sb) sb.disabled = true;
  if (answersMatch(ua, currentQuest.a)) {
    handleCorrect();
  } else {
    handleWrong(false);
  }
}

function handleCorrect(){
  if (battleEnded || currentScreen !== 'battle') return;
  Audio.correct();
  state.player.combo++;
  if (state.player.combo > state.player.maxCombo) state.player.maxCombo = state.player.combo;
  state.player.tc++;
  var ch = state.player.ch;
  if (!state.stats[ch]) state.stats[ch] = { correct: 0, wrong: 0 };
  state.stats[ch].correct++;

  var cd = getClass();
  var pb = getPetBonus();
  var baseDmg = 20 + state.player.combo * 5;
  var dmg = Math.round(baseDmg * (cd.dmg || 1) * getWeaponMul() * (1 + pb.dmg));
  if (state.player.combo >= 5 && pb.combo) dmg = Math.round(dmg * (1 + pb.combo));

  var critChance = 0.06 + (cd.crit || 0) + pb.crit;
  var isCrit = Math.random() < critChance;
  if (isCrit) dmg = Math.round(dmg * (cd.cmul || 3));

  state.player.bossHp = Math.max(0, state.player.bossHp - dmg);
  var gold = Math.round(12 + state.player.combo * 3 + state.player.lv * 3);
  state.player.gold += gold;
  state.player.score += Math.round(30 + state.player.combo * 5);

  var bx = window.innerWidth / 2 + 60;
  var by = window.innerHeight * 0.35;
  if (isCrit) {
    Audio.crit();
    floatText(bx, by, '💥 ' + dmg, 'c');
  } else {
    floatText(bx, by, '-' + dmg, 'd');
  }
  floatText(bx, by + 30, '+' + gold + '🪙', 'h');
  Audio.gold();
  Particles.burst(bx, by, { count: isCrit ? 30 : 15 });

  var fb = $('fbMsg');
  if (fb) {
    fb.textContent = '✅ ถูก! DMG ' + dmg + (isCrit ? ' 💥CRIT!' : '') + ' +' + gold + '🪙';
    fb.style.color = '#39ff14';
  }
  if (state.player.combo >= 3) {
    var c2 = $('comboDisp');
    if (c2) c2.textContent = '🔥 COMBO x' + state.player.combo + '!';
  }
  updateBattleUI();
  reduceCD();

  if (state.player.bossHp <= 0) {
    setTimeout(endBattle, 700);
  } else {
    setTimeout(nextQuestion, 900);
  }
}

function handleWrong(timeUp){
  if (battleEnded || currentScreen !== 'battle') return;
  Audio.wrong();
  state.player.combo = 0;
  state.player.tw++;
  var ch = state.player.ch;
  if (!state.stats[ch]) state.stats[ch] = { correct: 0, wrong: 0 };
  state.stats[ch].wrong++;

  if (!state.wrongLog) state.wrongLog = [];
  var inpNow = $('ansInp');
  state.wrongLog.unshift({
    ch: ch,
    lv: state.player.lv,
    q: currentQuest ? currentQuest.q : '',
    correct: currentQuest ? String(currentQuest.a) : '?',
    hint: currentQuest ? (currentQuest.h || '') : '',
    user: timeUp ? '(หมดเวลา)' : ((inpNow && inpNow.value) || '(ว่าง)'),
    time: Date.now()
  });
  if (state.wrongLog.length > 50) state.wrongLog.length = 50;

  var dmg = 8 + state.player.lv * 2 + (timeUp ? 6 : 0);
  state.player.hp = Math.max(0, state.player.hp - dmg);
  Audio.hit();
  var pE = $('pEmoji');
  if (pE) {
    pE.style.transform = 'translateX(-8px)';
    setTimeout(function(){ pE.style.transform = ''; }, 300);
  }
  var fb = $('fbMsg');
  if (fb) {
    fb.textContent = '❌ ผิด! ' + (timeUp ? '⏱ หมดเวลา ' : '') + 'เฉลย: ' + currentQuest.a + ' (-' + dmg + ' HP)';
    fb.style.color = '#ff6ba8';
  }
  updateBattleUI();
  reduceCD();

  if (state.player.hp <= 0) {
    setTimeout(endBattle, 900);
    return;
  }

  if (currentQuest.h) {
    setTimeout(function(){
      showModal('📖 วิธีทำ',
        '<div>' + currentQuest.q + '</div><div class="step">' + currentQuest.h.replace(/\n/g, '<br>') + '</div><div class="step">คำตอบ: <b style="color:#39ff14">' + currentQuest.a + '</b></div>',
        [{ label: 'เข้าใจแล้ว', cls: 'btn-g', action: 'modalNext()' }]);
    }, 500);
  } else {
    setTimeout(nextQuestion, 1200);
  }
}

function modalNext(){
  closeModal();
  if (battleEnded || currentScreen !== 'battle') return;
  if (state.player.hp <= 0) endBattle();
  else nextQuestion();
}

function reduceCD(){
  if (skillCD.s1 > 0) skillCD.s1 = 0;
  if (skillCD.s2 > 0) skillCD.s2 = 0;
  updateSkillButtons();
}

function useSkill(slot){
  if (battleEnded || currentScreen !== 'battle') return;
  var cd = getClass();
  var skill = cd[slot];
  if (!skill) return;
  if (state.player.gold < skill.cost) { Audio.wrong(); return; }
  state.player.gold -= skill.cost;
  skillCD[slot] = Date.now() + 5000;
  Audio.click();
  Audio.click();
  switch (skill.type) {
    case 'dmg': {
      var d = Math.round(30 * (skill.mul || 2) * getWeaponMul());
      state.player.bossHp = Math.max(0, state.player.bossHp - d);
      floatText(window.innerWidth/2 + 60, window.innerHeight*0.35, '⚔️ ' + d, 'c');
      Particles.burst(window.innerWidth/2 + 60, window.innerHeight*0.35, { count: 20 });
      break;
    }
    case 'gcrit': {
      var d2 = Math.round(50 * getWeaponMul());
      state.player.bossHp = Math.max(0, state.player.bossHp - d2);
      floatText(window.innerWidth/2 + 60, window.innerHeight*0.35, '✨ ' + d2, 'c');
      break;
    }
    case 'shield':
      state.player.shield = true;
      floatText(window.innerWidth/2, window.innerHeight*0.35, '🛡️', 'h');
      break;
    case 'heal':
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + (skill.heal || 30));
      floatText(window.innerWidth/2, window.innerHeight*0.35, '💚 +' + skill.heal, 'h');
      break;
    case 'dmgheal':
      state.player.bossHp = Math.max(0, state.player.bossHp - Math.round(40 * getWeaponMul()));
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + (skill.heal || 30));
      floatText(window.innerWidth/2, window.innerHeight*0.35, '✨ +' + skill.heal, 'h');
      break;
    case 'shieldheal':
      state.player.shield = true;
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + (skill.heal || 25));
      floatText(window.innerWidth/2, window.innerHeight*0.35, '🛡️', 'h');
      break;
    case 'dodge':
      state.player.shield = true;
      floatText(window.innerWidth/2, window.innerHeight*0.35, '💨', 'h');
      break;
    case 'drain':
      state.player.bossHp = Math.max(0, state.player.bossHp - 30);
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + 15);
      break;
    case 'berserk':
      state.player.combo += 2;
      break;
  }
  updateBattleUI();
  updateSkillButtons();
  if (state.player.bossHp <= 0) setTimeout(endBattle, 600);
}

function skipQuestion(){
  if (battleEnded || currentScreen !== 'battle') return;
  if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
  state.player.hp = Math.max(0, state.player.hp - 8);
  state.player.combo = 0;
  updateBattleUI();
  if (state.player.hp <= 0) endBattle();
  else nextQuestion();
}

function fleeBattle(){
  if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
  Audio.stopMusic();
  hideNumpad();
  battleEnded = true;
  state.player.gold = Math.max(0, state.player.gold - 10);
  Save.write(state);
  go('chapters');
}

function endBattle(){
  if (battleEnded) return;
  battleEnded = true;
  if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
  Audio.stopMusic();
  hideNumpad();
  isSubmitting = true;

  if (state.player.bossHp <= 0) {
    Audio.win();
    var gold = Math.round(35 + state.player.lv * 25);
    state.player.gold += gold;
    state.player.score += Math.round(100 + state.player.lv * 50);
    var ch = state.player.ch, lv = state.player.lv;
    if (!state.completed[ch]) state.completed[ch] = [];
    if (state.completed[ch].indexOf(lv) < 0) state.completed[ch].push(lv);
    if (lv === 5 && state.bossKills.indexOf(ch) < 0) state.bossKills.push(ch);
    addExp(lv === 5 ? 80 : 25);
    Particles.burst(window.innerWidth/2, window.innerHeight/2, { count: 60 });
    Save.write(state);
    showModal('🎉 ชนะ!',
      '<div style="text-align:center"><div style="font-size:56px">🏆</div><div>+' + gold + '🪙</div><div>คะแนน +' + (100 + lv * 50) + '</div>' + (lv === 5 ? '<div style="color:#ff6ba8">👑 ปราบบอส!</div>' : '') + '</div>',
      [{ label: 'เยี่ยม!', cls: 'btn-g', action: 'closeModal();go(\'chapters\')' }]);
  } else {
    Audio.lose();
    state.player.gold = Math.max(0, state.player.gold - 10);
    Save.write(state);
    showModal('💀 พ่ายแพ้',
      '<div style="text-align:center"><div style="font-size:56px">💀</div><div>เสีย 10🪙</div></div>',
      [{ label: 'ลองใหม่', cls: 'btn-r', action: 'closeModal();go(\'chapters\')' }]);
  }
}

function addExp(amount){
  state.player.exp += amount;
  var need = state.player.plv * 80;
  while (state.player.exp >= need) {
    state.player.exp -= need;
    state.player.plv++;
    state.player.maxHp = getMaxHp();
    state.player.hp = state.player.maxHp;
    need = state.player.plv * 80;
    Audio.level();
    floatText(window.innerWidth/2, window.innerHeight*0.35, '⭐ LEVEL UP!', 'h');
  }
}

function startBattle(ch, lv){
  state.player.ch = ch;
  state.player.lv = lv;
  state.player.maxHp = getMaxHp();
  state.player.hp = state.player.maxHp;
  go('battle');
}

function renderShop(){
  contentEl.innerHTML =
    '<h3 style="color:#fff;margin-bottom:14px">🛒 ร้านค้า</h3>' +
    '<div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">' +
    '<div><b>🧪 โพชั่น</b><br><span style="font-size:11px;color:#a8a8c8">ฟื้น HP เต็ม</span></div>' +
    '<button class="btn btn-sm btn-g" onclick="buyItem(\'potion\')" style="width:auto">80🪙 (' + state.inv.potion + ')</button>' +
    '</div>' +
    '<div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">' +
    '<div><b>🔮 ลูกแก้ว</b><br><span style="font-size:11px;color:#a8a8c8">คริ +20%</span></div>' +
    '<button class="btn btn-sm" onclick="buyItem(\'orb\')" style="width:auto">700🪙</button>' +
    '</div>' +
    '<button class="btn btn-o" onclick="go(\'menu\')">🔙 กลับ</button>';
}

function buyItem(t){
  var prices = { potion: 80, orb: 700 };
  if (state.player.gold < prices[t]) return;
  state.player.gold -= prices[t];
  if (t === 'potion') state.inv.potion++;
  Audio.gold();
  Save.write(state);
  renderShop();
}

/* ============ CLASS SELECT ============ */
function renderClassSelect(){
  var all = {};
  for (var k in BaseClasses) all[k] = BaseClasses[k];
  for (var k2 in AdvanceClasses) {
    var ac = AdvanceClasses[k2];
    if (state.myGClasses.indexOf(k2) >= 0) all[k2] = ac;
  }
  var h = '<h3 style="color:#fff;margin-bottom:14px">🔄 เลือกคลาส</h3>';
  h += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">';
  for (var kk in all) {
    var d = all[kk];
    var sel = state.pclass === kk;
    h += '<div style="background:linear-gradient(135deg,#16162a,#1e1e38);border:2px solid ' + (sel ? '#39ff14' : 'rgba(255,255,255,0.14)') + ';border-radius:14px;padding:14px;text-align:center;cursor:pointer" onclick="selectClass(\'' + kk + '\')">';
    h += '<div style="font-size:44px;line-height:1">' + d.emoji + '</div>';
    h += '<div style="font-weight:700;font-size:14px;margin-top:6px">' + d.name + '</div>';
    h += '<div style="font-size:11px;color:#a8a8c8;margin-top:4px">' + d.desc + '</div>';
    h += '</div>';
  }
  h += '</div>';
  h += '<button class="btn btn-o" style="margin-top:14px" onclick="go(\'menu\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
}

function selectClass(k){
  var all = {};
  for (var kk in BaseClasses) all[kk] = BaseClasses[kk];
  for (var kk2 in AdvanceClasses) all[kk2] = AdvanceClasses[kk2];
  if (!all[k]) return;
  state.pclass = k;
  state.player.maxHp = getMaxHp();
  state.player.hp = state.player.maxHp;
  Audio.click();
  Save.write(state);
  renderClassSelect();
}

/* ============ PET SHOP ============ */
function renderPetShop(){
  var h = '<h3 style="color:#fff;margin-bottom:14px">🐾 ร้านสัตว์เลี้ยง</h3>';
  h += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">';
  for (var k in Pets) {
    var p = Pets[k];
    if (!p.shop) continue;
    var owned = state.myPets.indexOf(k) >= 0;
    var eq = state.epet === k;
    h += '<div style="background:linear-gradient(135deg,#16162a,#1e1e38);border:2px solid ' + (eq ? '#39ff14' : 'rgba(255,255,255,0.14)') + ';border-radius:14px;padding:12px;text-align:center">';
    h += '<div style="font-size:40px;line-height:1">' + p.emoji + '</div>';
    h += '<div style="font-weight:700;font-size:14px;margin-top:4px">' + p.name + '</div>';
    h += '<div style="font-size:11px;color:#a8a8c8;margin:4px 0">' + p.desc + '</div>';
    if (owned) {
      h += '<button class="btn btn-sm ' + (eq ? 'btn-g' : 'btn-o') + '" onclick="equipPet(\'' + k + '\')" style="width:auto;font-size:11px">' + (eq ? '✅' : '🎯') + '</button>';
    } else {
      h += '<button class="btn btn-sm" onclick="buyPet(\'' + k + '\')" style="width:auto;font-size:11px">' + p.cost + '🪙</button>';
    }
    h += '</div>';
  }
  h += '</div>';
  h += '<button class="btn btn-o" style="margin-top:14px" onclick="go(\'menu\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
}

function buyPet(k){
  var p = Pets[k];
  if (!p || state.myPets.indexOf(k) >= 0) return;
  if (state.player.gold < p.cost) return;
  state.player.gold -= p.cost;
  state.myPets.push(k);
  if (!state.epet) state.epet = k;
  Audio.gold();
  Save.write(state);
  renderPetShop();
}

function equipPet(k){
  if (state.myPets.indexOf(k) < 0) return;
  state.epet = state.epet === k ? null : k;
  Save.write(state);
  renderPetShop();
}

/* ============ UPGRADE ============ */
function renderUpgrade(){
  var h = '<h3 style="color:#fff;margin-bottom:14px">🔧 อัพเกรดอุปกรณ์</h3>';
  for (var k in Equipment) {
    var eq = Equipment[k];
    var lv = state.inv[k];
    var max = lv >= eq.max;
    h += '<div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">';
    h += '<div><b>' + eq.emoji + ' ' + eq.name + ' Lv.' + lv + '</b><br><span style="font-size:11px;color:#a8a8c8">' + eq.eff(lv) + (max ? '' : ' → ' + eq.eff(lv + 1)) + '</span></div>';
    if (max) {
      h += '<span style="color:#ffe600;font-size:12px">MAX</span>';
    } else {
      h += '<button class="btn btn-sm" onclick="doUpgrade(\'' + k + '\')" style="width:auto;font-size:11px">' + eq.costs[lv + 1] + '🪙</button>';
    }
    h += '</div>';
  }
  h += '<button class="btn btn-o" onclick="go(\'menu\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
}

function doUpgrade(t){
  var eq = Equipment[t];
  var lv = state.inv[t];
  if (lv >= eq.max) return;
  var price = eq.costs[lv + 1];
  if (state.player.gold < price) return;
  state.player.gold -= price;
  state.inv[t]++;
  state.player.maxHp = getMaxHp();
  Audio.level();
  Save.write(state);
  renderUpgrade();
}

/* ============ STATS ============ */
function renderStats(){
  var totalC = 0, totalW = 0;
  var h = '<h3 style="color:#fff;margin-bottom:14px">📈 สถิติการเรียน</h3>';
  h += '<div class="bar"><span>✅ ถูก <span class="sv" id="tc">0</span></span><span>❌ ผิด <span class="sv" id="tw">0</span></span></div>';
  var rows = '';
  for (var i = 0; i < Chapters.length; i++) {
    var ch = Chapters[i];
    var s = state.stats[ch.id] || { correct: 0, wrong: 0 };
    totalC += s.correct;
    totalW += s.wrong;
    if (s.correct || s.wrong) {
      rows += '<div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:10px;margin-bottom:6px;font-size:12px">' + ch.icon + ' ' + ch.name + ' — ✅' + s.correct + ' ❌' + s.wrong + '</div>';
    }
  }
  h += '<div class="bar"><span>🔥 คอมโบสูงสุด <span class="sv">' + state.player.maxCombo + '</span></span><span>⭐ Lv.<span class="sv">' + state.player.plv + '</span></span></div>';
  var wc = (state.wrongLog || []).length;
  h += '<button class="btn btn-p" onclick="renderWrongReview()">📝 ทบทวนข้อผิด (' + wc + ')</button>';
  if (rows) h += '<div style="margin-top:12px">' + rows + '</div>';
  h += '<button class="btn btn-o" style="margin-top:14px" onclick="go(\'menu\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
  var tcEl = $('tc'), twEl = $('tw');
  if (tcEl) tcEl.textContent = totalC;
  if (twEl) twEl.textContent = totalW;
}

function renderWrongReview(){
  var log = state.wrongLog || [];
  var h = '<h3 style="color:#fff;margin-bottom:14px">📝 ทบทวนข้อผิด</h3>';
  if (!log.length) {
    h += '<div style="text-align:center;padding:30px;color:#a8a8c8">🎉 ยังไม่มีข้อผิด</div>';
  } else {
    for (var i = 0; i < log.length && i < 30; i++) {
      var it = log[i];
      h += '<div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px">';
      h += '<div style="font-weight:700;color:#fff">' + it.q + '</div>';
      h += '<div style="color:#ff6ba8;margin-top:4px">❌ คุณ: ' + it.user + '</div>';
      h += '<div style="color:#39ff14">✅ เฉลย: ' + it.correct + '</div>';
      if (it.hint) h += '<div style="font-size:11px;color:#a8a8c8;margin-top:4px;border-left:2px solid #00f0ff;padding-left:8px">' + it.hint + '</div>';
      h += '</div>';
    }
  }
  h += '<button class="btn btn-o" onclick="renderStats()">🔙 กลับสถิติ</button>';
  contentEl.innerHTML = h;
}

/* ============ SETTINGS ============ */
function renderSettings(){
  contentEl.innerHTML =
    '<h3 style="color:#fff;margin-bottom:14px">⚙️ ตั้งค่า</h3>' +
    '<div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">' +
    '<span>🔊 เสียง</span>' +
    '<button class="btn btn-sm ' + (state.soundOn ? 'btn-g' : 'btn-o') + '" onclick="toggleSound()" style="width:auto">' + (state.soundOn ? 'เปิด' : 'ปิด') + '</button>' +
    '</div>' +
    '<div style="background:rgba(0,0,0,0.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">' +
    '<span>🗑️ ล้างข้อมูล</span>' +
    '<button class="btn btn-sm btn-r" onclick="resetAll()" style="width:auto">รีเซ็ต</button>' +
    '</div>' +
    '<div style="text-align:center;color:#a8a8c8;font-size:11px;margin-top:20px">จัดทำโดย เด็กชายธนวัฒน์</div>' +
    '<button class="btn btn-o" style="margin-top:14px" onclick="go(\'menu\')">🔙 กลับ</button>';
}

function toggleSound(){
  state.soundOn = !state.soundOn;
  Audio.setEnabled(state.soundOn);
  if (state.soundOn) { Audio.resume(); Audio.click(); }
  Save.write(state);
  renderSettings();
}

function resetAll(){
  if (!confirm('ลบข้อมูลทั้งหมด?')) return;
  Save.clear();
  state = Save.defaultState();
  go('menu');
}

/* ============ NUMPAD ============ */
function buildNumpad(){
  var keys = [
    { k: '7', t: '7' }, { k: '8', t: '8' }, { k: '9', t: '9' }, { k: '/', t: '÷' }, { k: '+', t: '+' },
    { k: '4', t: '4' }, { k: '5', t: '5' }, { k: '6', t: '6' }, { k: '*', t: '×' }, { k: '-', t: '−' },
    { k: '1', t: '1' }, { k: '2', t: '2' }, { k: '3', t: '3' }, { k: '.', t: '.' }, { k: 'back', t: '⌫' },
    { k: '0', t: '0' }, { k: 'submit', t: '✓' }
  ];
  numpadGrid.innerHTML = keys.map(function(k){
    var cls = 'npb';
    if (k.k === 'submit') cls += ' s';
    if (k.k === 'back') cls += ' b';
    return '<button class="' + cls + '" data-key="' + k.k + '">' + k.t + '</button>';
  }).join('');
}

numpadGrid.addEventListener('click', function(e){
  var btn = e.target.closest('.npb');
  if (!btn) return;
  var key = btn.dataset.key;
  var inp = $('ansInp');
  if (!inp || inp.disabled) return;
  Audio.resume();
  if (key === 'back') inp.value = inp.value.slice(0, -1);
  else if (key === 'submit') { submitAnswer(); return; }
  else inp.value += key;
  Audio.click();
}, { passive: false });

function showNumpad(s){ numpadContainer.classList.add('active'); }
function hideNumpad(){ numpadContainer.classList.remove('active'); }

/* ============ BOOT ============ */
function bootGame(){
  contentEl = document.getElementById('gameContent');
  modalContainer = document.getElementById('modalContainer');
  numpadContainer = document.getElementById('numpadContainer');
  numpadGrid = document.getElementById('numpadGrid');

  var loaded = Save.load();
  if (loaded) {
    state = loaded;
    if (!state.wrongLog) state.wrongLog = [];
  }
  state.player.maxHp = getMaxHp();
  if (state.player.hp > state.player.maxHp) state.player.hp = state.player.maxHp;

  buildNumpad();

  Audio.init();
  Audio.setEnabled(state.soundOn !== false);

  var startBtn = document.getElementById('startBtn');
  var overlay = document.getElementById('startOverlay');

  startBtn.addEventListener('click', function(){
    try {
      Audio.resume();
      Audio.init();
      Audio.resume();
      Audio.win();
    } catch(e) {}
    Particles.burst(window.innerWidth / 2, window.innerHeight / 2, { count: 60, speed: 10 });
    overlay.classList.add('hide');
    setTimeout(function(){
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }, 600);
    setTimeout(function(){
      if (state.soundOn) Audio.startMusic();
      go('menu');
    }, 400);
  });

  // Pointer/touch resume audio
  document.addEventListener('pointerdown', function(){ Audio.resume(); });
  document.addEventListener('touchstart', function(){ Audio.resume(); }, { passive: true });

  // Keyboard
  document.addEventListener('keydown', function(e){
    var inp = $('ansInp');
    if (inp && !inp.disabled && document.activeElement === inp && e.key === 'Enter') {
      e.preventDefault();
      submitAnswer();
    }
  });

  // Prevent double-tap zoom on buttons
  var lastTap = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if (now - lastTap <= 300 && e.target.closest('button, .btn, .npb')) {
      e.preventDefault();
    }
    lastTap = now;
  }, { passive: false });

  // Auto-save
  setInterval(function(){ Save.write(state); }, 15000);

  // Save on unload
  window.addEventListener('beforeunload', function(){ Save.write(state); });

  console.log('[MathQuest] Booted — 60 chapters ready');
}

/* Expose globals for inline onclick */
window.go = go;
window.startBattle = startBattle;
window.submitAnswer = submitAnswer;
window.useSkill = useSkill;
window.skipQuestion = skipQuestion;
window.fleeBattle = fleeBattle;
window.closeModal = closeModal;
window.modalNext = modalNext;
window.buyItem = buyItem;
window.selectClass = selectClass;
window.buyPet = buyPet;
window.equipPet = equipPet;
window.doUpgrade = doUpgrade;
window.renderStats = renderStats;
window.renderWrongReview = renderWrongReview;
window.toggleSound = toggleSound;
window.resetAll = resetAll;
window.startBalance = null; // not implemented in this version
window.startGreater = null;

bootGame();
</script>
