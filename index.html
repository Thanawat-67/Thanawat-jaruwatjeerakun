<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ พิชิตจักรวาลคณิตศาสตร์ ม.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff006e;
            --neon-purple: #b537f2;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --neon-orange: #ff6b35;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(15, 15, 35, 0.95);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow-blue: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 0, 110, 0.5);
            --glow-purple: 0 0 20px rgba(181, 55, 242, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #0a0a1a;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 110, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(181, 55, 242, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated stars background */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* Particle effects */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: particleFloat 1.5s ease-out forwards;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-60px) scale(1.3) rotate(180deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-120px) scale(0.8) rotate(360deg);
                opacity: 0;
            }
        }

        .main-container {
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 1;
            padding: 10px;
        }

        .game-wrapper {
            background: var(--card-bg);
            border-radius: 24px;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow:
                0 0 40px rgba(0, 240, 255, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .game-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg,
                    var(--neon-blue),
                    var(--neon-purple),
                    var(--neon-pink),
                    var(--neon-blue));
            border-radius: 26px;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes borderGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .game-header {
            padding: 20px 25px;
            text-align: center;
            background: linear-gradient(180deg,
                    rgba(0, 240, 255, 0.05) 0%,
                    transparent 100%);
            border-bottom: 1px solid var(--glass-border);
        }

        .creator-badge {
            display: inline-block;
            background: linear-gradient(135deg,
                    rgba(255, 0, 110, 0.2),
                    rgba(181, 55, 242, 0.2));
            border: 1px solid var(--neon-pink);
            padding: 8px 20px;
            border-radius: 20px;
            margin-bottom: 12px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 0, 110, 0.7);
            }
        }

        .creator-badge span {
            font-weight: 700;
            font-size: 13px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(90deg,
                    var(--neon-blue),
                    var(--neon-green),
                    var(--neon-yellow),
                    var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            animation: titleShine 2s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes titleShine {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.4);
            }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .game-content {
            padding: 20px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .game-content::-webkit-scrollbar {
            width: 6px;
        }

        .game-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .game-content::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 3px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::after {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.6);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
        }

        .btn-outline:hover {
            background: rgba(0, 240, 255, 0.1);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 11px;
            border-radius: 8px;
        }

        /* Level cards */
        .level-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .level-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .level-card:hover {
            transform: translateX(5px);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            background: rgba(0, 240, 255, 0.05);
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(50%);
        }

        .level-card.completed {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }

        .level-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .level-info {
            flex: 1;
        }

        .level-name {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }

        .level-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .level-status {
            font-size: 20px;
        }

        /* Battle scene */
        .battle-scene {
            background: linear-gradient(180deg,
                    rgba(0, 0, 0, 0.8) 0%,
                    rgba(15, 15, 35, 0.9) 100%);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }

        .combatants-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .combatant {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        .avatar-container.boss {
            border-color: var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.5);
            animation: bossFloat 2s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes bossFloat {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-15px) scale(1.05);
            }
        }

        .hp-bar-outer {
            background: #1a1a2e;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hp-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #00f0ff, #00c6ff);
        }

        .hp-bar-inner.boss-hp {
            background: linear-gradient(90deg, #ff006e, #ff4b2b);
        }

        .hp-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        .vs-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.5);
            animation: vsPulse 1s ease-in-out infinite;
        }

        @keyframes vsPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .question-panel {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }

        .question-display {
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .answer-input-row {
            display: flex;
            gap: 10px;
        }

        .answer-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: 'Kanit', sans-serif;
        }

        .answer-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .combo-display {
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }

        .combo-display.active {
            color: var(--neon-yellow);
            animation: comboShake 0.5s ease-in-out;
        }

        @keyframes comboShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-value {
            font-weight: 700;
            color: var(--neon-blue);
        }

        .shop-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .shop-item:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(181, 55, 242, 0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .badge-warning {
            background: rgba(255, 230, 0, 0.2);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }

        .badge-success {
            background: rgba(57, 255, 20, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .badge-info {
            background: rgba(0, 240, 255, 0.2);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 11px;
        }
        .text-lg {
            font-size: 18px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-4 {
            margin-top: 16px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-4 {
            margin-bottom: 16px;
        }
        .w-full {
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Stars background -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Game Container -->
    <div class="main-container">
        <div class="game-wrapper">
            <!-- Header -->
            <div class="game-header">
                <div class="creator-badge">
                    <span>⚡ ทำโดย ตะวันสุดหล่อ ⚡</span>
                </div>
                <div class="game-title">MATH QUEST</div>
                <div class="subtitle">พิชิตจักรวาลคณิตศาสตร์ ม.2</div>
            </div>

            <!-- Content -->
            <div class="game-content" id="gameContent">
                <!-- Dynamic content rendered here -->
            </div>
        </div>
    </div>

    <!-- Modal container -->
    <div id="modalContainer"></div>

    <script>
        // ============================================
        // 🎮 MATH QUEST - ตะวันสุดหล่อ พิชิตคณิต ม.2
        // ============================================

        // Audio context for sound effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(freq, type = 'sine', duration = 0.15, vol = 0.1) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 2, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Silently fail if audio not supported
            }
        }

        function sfxClick() { playSound(600, 'sine', 0.1, 0.08); }

        function sfxCorrect() { playSound(800, 'triangle', 0.2, 0.12);
            setTimeout(() => playSound(1200, 'triangle', 0.2, 0.12), 150); }

        function sfxWrong() { playSound(150, 'sawtooth', 0.3, 0.08); }

        function sfxCrit() { playSound(400, 'square', 0.3, 0.1);
            setTimeout(() => playSound(900, 'square', 0.3, 0.15), 120); }

        function sfxWin() {
            [600, 800, 1000, 1200].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.25, 0.12), i * 150));
        }

        // Stars background
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--delay', (Math.random() * 5) + 's');
                container.appendChild(star);
            }
        }

        // Floating particle effect
        function spawnParticle(x, y, text, color) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = text;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.color = color;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1500);
        }

        // ============================================
        // GAME DATA
        // ============================================

        const chapters = [
            { id: 1, name: 'บทที่ 1: เลขยกกำลัง', icon: '⚡', desc: 'สมบัติของเลขยกกำลัง การคูณและหาร', color: '#00f0ff',
                topic: 'exponents' },
            { id: 2, name: 'บทที่ 2: พหุนาม', icon: '📐', desc: 'การบวก ลบ คูณ หารพหุนาม', color: '#39ff14', topic: 'polynomials' },
            { id: 3, name: 'บทที่ 3: การแยกตัวประกอบ', icon: '🧩', desc: 'กำลังสองสมบูรณ์ ผลต่างกำลังสอง', color: '#b537f2',
                topic: 'factorization' },
            { id: 4, name: 'บทที่ 4: ความเท่ากันทุกประการ', icon: '🔷', desc: 'สามเหลี่ยมเท่ากันทุกประการ', color: '#ff6b35',
                topic: 'congruence' },
            { id: 5, name: 'บทที่ 5: ทฤษฎีบทพีทาโกรัส', icon: '📏', desc: 'c² = a² + b²', color: '#ffe600', topic: 'pythagoras' },
            { id: 6, name: 'บทที่ 6: สถิติ', icon: '📊', desc: 'ค่าเฉลี่ย มัธยฐาน ฐานนิยม', color: '#ff006e', topic: 'statistics' },
            { id: 7, name: 'บทที่ 7: ปริมาตรและความน่าจะเป็น', icon: '🎲', desc: 'ทรงกระบอก กรวย ความน่าจะเป็น', color: '#00b09b',
                topic: 'volume_probability' },
        ];

        // ============================================
        // GAME LOGIC
        // ============================================

        function generateQuestion(chapterId) {
            const ch = chapterId;
            let question, answer, hint;

            switch (ch) {
                case 1: // Exponents
                    const base = Math.floor(Math.random() * 4) + 2;
                    const exp1 = Math.floor(Math.random() * 3) + 2;
                    const exp2 = Math.floor(Math.random() * 3) + 1;
                    question = `${base}<sup>${exp1}</sup> × ${base}<sup>${exp2}</sup> = ${base}<sup>?</sup> จงหาเลขชี้กำลังที่หายไป`;
                    answer = exp1 + exp2;
                    hint = 'สมบัติเลขยกกำลัง: a^m × a^n = a^(m+n)';
                    break;
                case 2: // Polynomials
                    const a = Math.floor(Math.random() * 5) + 2;
                    const b = Math.floor(Math.random() * 5) + 1;
                    const x = Math.floor(Math.random() * 3) + 2;
                    question =
                        `(${a}x + ${b}) + (${a * 2}x - ${b}) เมื่อ x = ${x} มีค่าเท่าไร?`;
                    answer = (a * x + b) + (a * 2 * x - b);
                    hint = `แทนค่า x = ${x} แล้วคำนวณ: (${a}×${x}+${b}) + (${a*2}×${x}-${b})`;
                    break;
                case 3: // Factorization
                    const n = Math.floor(Math.random() * 6) + 3;
                    question = `x² + ${2*n}x + ${n*n} = (x + ?)² จงหาค่า ?`;
                    answer = n;
                    hint = `กำลังสองสมบูรณ์: (x + a)² = x² + 2ax + a² ดังนั้น ? = ${n}`;
                    break;
                case 4: // Congruence
                    const side = Math.floor(Math.random() * 8) + 4;
                    question =
                        `สามเหลี่ยมด้านเท่ามีด้านหนึ่งยาว ${side} ซม. ด้านที่เหลือยาวเท่าไร?`;
                    answer = side;
                    hint = 'สามเหลี่ยมด้านเท่า ทุกด้านยาวเท่ากัน';
                    break;
                case 5: // Pythagoras
                    const mult = Math.floor(Math.random() * 3) + 1;
                    const leg1 = 3 * mult;
                    const leg2 = 4 * mult;
                    question =
                        `สามเหลี่ยมมุมฉากมีด้านประกอบฉาก ${leg1} และ ${leg2} หน่วย ด้านตรงข้ามมุมฉากยาวเท่าไร?`;
                    answer = 5 * mult;
                    hint = `c² = ${leg1}² + ${leg2}² = ${leg1*leg1} + ${leg2*leg2} = ${leg1*leg1+leg2*leg2} ดังนั้น c = ${answer}`;
                    break;
                case 6: // Statistics
                    const nums = [Math.floor(Math.random() * 20) + 10, Math.floor(Math.random() * 20) + 30, Math
                        .floor(Math.random() * 20) + 50
                    ];
                    question = `ข้อมูล: ${nums.join(', ')} จงหาค่าเฉลี่ย (ตอบเป็นทศนิยม 1 ตำแหน่ง)`;
                    answer = Math.round((nums.reduce((s, v) => s + v, 0) / 3) * 10) / 10;
                    hint =
                        `ค่าเฉลี่ย = (${nums.join(' + ')}) ÷ 3 = ${nums.reduce((s,v)=>s+v,0)} ÷ 3 = ${answer}`;
                    break;
                case 7: // Volume & Probability
                    if (Math.random() < 0.5) {
                        const r = 3;
                        const h = 7;
                        question =
                            `ทรงกระบอกมีรัศมี ${r} หน่วย สูง ${h} หน่วย มีปริมาตรเท่าไร? (ใช้ π = 22/7)`;
                        answer = Math.round((22 / 7) * r * r * h);
                        hint = `ปริมาตรทรงกระบอก = πr²h = (22/7) × ${r}² × ${h}`;
                    } else {
                        question = `ทอยลูกเต๋า 1 ลูก ความน่าจะเป็นที่จะได้เลขคู่คือเท่าไร? (ตอบเป็นเศษส่วน a/b)`;
                        answer = '1/2';
                        hint = 'เลขคู่บนลูกเต๋า: 2, 4, 6 = 3 แบบ จากทั้งหมด 6 แบบ = 3/6 = 1/2';
                    }
                    break;
                default:
                    question = '5 + 3 × 2 = ?';
                    answer = 11;
                    hint = 'คูณก่อนบวก: 3×2=6, 5+6=11';
            }
            return { question, answer, hint };
        }

        let currentQuestion = null;

        function setupBattle() {
            player.hp = player.maxHp;
            player.bossHp = player.bossMaxHp;
            player.combo = 0;
            player.shield = inventory.shield; // Auto-shield at start if purchased
            updateBattleUI();
            nextQuestion();
            document.getElementById('answerInput')?.focus();
        }

        function nextQuestion() {
            if (player.bossHp <= 0 || player.hp <= 0) {
                endBattle();
                return;
            }
            currentQuestion = generateQuestion(player.currentChapter);
            const qDisplay = document.getElementById('questionDisplay');
            if (qDisplay) qDisplay.innerHTML = currentQuestion.question;
            const ansInput = document.getElementById('answerInput');
            if (ansInput) {
                ansInput.value = '';
                ansInput.disabled = false;
                ansInput.focus();
            }
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = false;
            const feedback = document.getElementById('feedbackMsg');
            if (feedback) feedback.textContent = '';
            document.getElementById('comboDisplay').textContent = '';
            document.getElementById('comboDisplay').classList.remove('active');
        }

        function submitAnswer() {
            const input = document.getElementById('answerInput');
            if (!input || !currentQuestion) return;
            const userAnswer = input.value.trim();
            if (userAnswer === '') return;

            const correctAnswer = currentQuestion.answer.toString();
            // Check if answer matches (handle fractions, decimals, integers)
            let isCorrect = false;
            if (userAnswer === correctAnswer) {
                isCorrect = true;
            } else if (!isNaN(parseFloat(userAnswer)) && !isNaN(parseFloat(correctAnswer))) {
                isCorrect = Math.abs(parseFloat(userAnswer) - parseFloat(correctAnswer)) < 0.09;
            }

            input.disabled = true;
            document.getElementById('submitBtn').disabled = true;

            if (isCorrect) {
                handleCorrectAnswer(input);
            } else {
                handleWrongAnswer(input);
            }
        }

        function handleCorrectAnswer(inputElement) {
            sfxCorrect();
            player.combo++;
            player.totalCorrect++;
            if (player.combo > player.maxCombo) player.maxCombo = player.combo;

            // Track analytics
            if (!analytics[player.currentChapter]) {
                analytics[player.currentChapter] = { correct: 0, wrong: 0, completed: false, perfect: true };
            }
            analytics[player.currentChapter].correct++;

            // Calculate damage
            let damage = 25 + (player.combo * 5);
            if (inventory.weapon) damage = Math.floor(damage * 1.5);
            if (player.combo >= 5) damage = Math.floor(damage * 1.3);

            // Critical hit
            let critChance = 0.1;
            if (inventory.orb) critChance = 0.35;
            const isCrit = Math.random() < critChance;
            if (isCrit) {
                damage *= 3;
                sfxCrit();
            }

            player.bossHp = Math.max(0, player.bossHp - damage);
            player.score += 50 + (player.combo * 10);

            // Show effects
            const rect = inputElement.getBoundingClientRect();
            spawnParticle(rect.left + rect.width / 2, rect.top, isCrit ? `💥${damage} CRIT!` : `⚡${damage}`,
                isCrit ? '#ffe600' : '#00f0ff');

            document.getElementById('feedbackMsg').textContent =
                `✅ ถูกต้อง! ทำดาเมจ ${damage} ${isCrit ? '💥 คริติคอล!' : ''}`;
            document.getElementById('feedbackMsg').style.color = 'var(--neon-green)';

            // Combo display
            if (player.combo >= 3) {
                const comboDisp = document.getElementById('comboDisplay');
                comboDisp.textContent = `🔥 COMBO x${player.combo}! 🔥`;
                comboDisp.classList.add('active');
                document.getElementById('comboBadge').textContent = `🔥 คอมโบ: ${player.combo}`;
            }

            updateBattleUI();
            setTimeout(nextQuestion, 1200);
        }

        function handleWrongAnswer(inputElement) {
            sfxWrong();
            player.combo = 0;
            player.totalWrong++;
            if (analytics[player.currentChapter]) {
                analytics[player.currentChapter].wrong++;
                analytics[player.currentChapter].perfect = false;
            }

            // Shield protection
            let damageTaken = 15;
            if (player.shield) {
                player.shield = false;
                damageTaken = 0;
                document.getElementById('feedbackMsg').textContent = '🛡️ เกราะพลาสม่าป้องกันดาเมจไว้ได้!';
                document.getElementById('feedbackMsg').style.color = 'var(--neon-purple)';
            } else {
                player.hp = Math.max(0, player.hp - damageTaken);
                document.getElementById('feedbackMsg').textContent =
                    `❌ ผิด! คำตอบคือ ${currentQuestion.answer} โดนสวนกลับ ${damageTaken} ดาเมจ`;
                document.getElementById('feedbackMsg').style.color = 'var(--neon-pink)';
            }

            // Show hint
            document.getElementById('feedbackMsg').textContent += ` | 💡 ${currentQuestion.hint}`;

            const rect = inputElement.getBoundingClientRect();
            if (damageTaken > 0) {
                spawnParticle(rect.left + rect.width / 2, rect.top, `-${damageTaken}❤️`, '#ff006e');
            }

            document.getElementById('comboBadge').textContent = '🔥 คอมโบ: 0';
            updateBattleUI();
            setTimeout(nextQuestion, 2000);
        }

        function updateBattleUI() {
            const playerHpBar = document.getElementById('playerHpBar');
            const bossHpBar = document.getElementById('bossHpBar');
            const playerHpText = document.getElementById('playerHpText');
            const bossHpText = document.getElementById('bossHpText');

            if (playerHpBar) playerHpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            if (bossHpBar) bossHpBar.style.width = Math.max(0, (player.bossHp / player.bossMaxHp) * 100) + '%';
            if (playerHpText) playerHpText.textContent = `${player.hp}/${player.maxHp}`;
            if (bossHpText) bossHpText.textContent = `${player.bossHp}/${player.bossMaxHp}`;

            // Update combo badge
            document.getElementById('comboBadge').textContent = `🔥 คอมโบ: ${player.combo}`;
        }

        function endBattle() {
            if (player.bossHp <= 0) {
                // Victory!
                sfxWin();
                player.score += 300;
                if (analytics[player.currentChapter]) {
                    analytics[player.currentChapter].completed = true;
                }
                // Unlock next chapter
                const nextChapter = player.currentChapter + 1;
                if (nextChapter <= 7 && !unlockedChapters.includes(nextChapter)) {
                    unlockedChapters.push(nextChapter);
                }
                saveGame();
                showModal('🎉 ชัยชนะ!',
                    `คุณปราบบอสบทที่ ${player.currentChapter} สำเร็จ!\nได้รับโบนัส 300 แต้ม\nคะแนนรวม: ${player.score.toLocaleString()}`,
                    () => renderScreen('chapters'));
            } else if (player.hp <= 0) {
                // Defeat
                saveGame();
                showModal('💀 พ่ายแพ้', 'คุณหมดพลังแล้ว! ลองใหม่อีกครั้ง', () => renderScreen('chapters'));
            }
        }

        function startChapter(chapterId) {
            if (!unlockedChapters.includes(chapterId)) {
                showModal('🔒 ล็อคอยู่', 'คุณต้องผ่านบทก่อนหน้าก่อน!', null);
                return;
            }
            player.currentChapter = chapterId;
            player.bossMaxHp = 120 + (chapterId * 20);
            player.bossHp = player.bossMaxHp;
            player.hp = player.maxHp;
            player.combo = 0;
            renderScreen('battle');
        }

        function useSkill(type) {
            if (type === 'heal' && player.score >= 40) {
                player.score -= 40;
                player.hp = Math.min(player.maxHp, player.hp + 50);
                updateBattleUI();
                const btn = document.getElementById('btnHeal');
                spawnParticle(btn.getBoundingClientRect().left + 50, btn.getBoundingClientRect().top, '+50❤️',
                    '#39ff14');
                document.getElementById('feedbackMsg').textContent = '🧪 ฟื้นฟูพลัง +50 HP!';
                document.getElementById('feedbackMsg').style.color = 'var(--neon-green)';
                saveGame();
            } else if (type === 'shield' && player.score >= 50 && !player.shield) {
                player.score -= 50;
                player.shield = true;
                document.getElementById('feedbackMsg').textContent = '🛡️ เปิดเกราะป้องกันแล้ว!';
                document.getElementById('feedbackMsg').style.color = 'var(--neon-purple)';
                saveGame();
            } else if (type === 'skip') {
                if (player.hp > 10) {
                    player.hp -= 10;
                    player.combo = 0;
                    updateBattleUI();
                    nextQuestion();
                    document.getElementById('feedbackMsg').textContent = '⏩ ข้ามข้อ เสีย 10 HP';
                    document.getElementById('feedbackMsg').style.color = 'var(--neon-orange)';
                }
            } else {
                document.getElementById('feedbackMsg').textContent = '⚠️ แต้มไม่พอหรือมีเกราะอยู่แล้ว!';
                document.getElementById('feedbackMsg').style.color = 'var(--neon-yellow)';
            }
        }

        function fleeBattle() {
            player.score = Math.max(0, player.score - 50);
            saveGame();
            renderScreen('chapters');
        }

        function buyItem(type) {
            const prices = { weapon: 380, shield: 250, orb: 550 };
            if (player.score >= prices[type] && !inventory[type]) {
                player.score -= prices[type];
                inventory[type] = true;
                if (type === 'shield') player.shield = true;
                saveGame();
                sfxCorrect();
                renderScreen('shop');
            }
        }

        function changeName() {
            const newName = prompt('ใส่ชื่อใหม่:', player.name);
            if (newName && newName.trim()) {
                player.name = newName.trim();
                saveGame();
                renderScreen('menu');
            }
        }

        function resetGame() {
            if (confirm('คุณแน่ใจหรือไม่ที่จะรีเซ็ตข้อมูลทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้!')) {
                localStorage.removeItem('mathquest_tawan_save');
                player = {
                    name: 'ผู้กล้า',
                    hp: 100,
                    maxHp: 100,
                    score: 0,
                    combo: 0,
                    maxCombo: 0,
                    totalCorrect: 0,
                    totalWrong: 0,
                    shield: false,
                    weapon: false,
                    critBoost: false,
                    currentChapter: null,
                    bossHp: 150,
                    bossMaxHp: 150,
                };
                analytics = {};
                inventory = { weapon: false, shield: false, orb: false };
                achievements = {};
                unlockedChapters = [1];
                renderScreen('menu');
            }
        }

        function showLockedMessage() {
            showModal('🔒 ยังไม่ปลดล็อค', 'คุณต้องผ่านบทก่อนหน้านี้ก่อนจึงจะเล่นบทนี้ได้!', null);
        }

        function showModal(title, message, callback) {
            const container = document.getElementById('modalContainer');
            container.innerHTML = `
            <div class="modal-overlay" onclick="closeModal(${callback ? 'true' : 'false'})">
                <div class="modal-content" onclick="event.stopPropagation()">
                    <h2 style="color:var(--neon-blue); margin-bottom:12px;">${title}</h2>
                    <p style="color:white; white-space:pre-line; margin-bottom:16px;">${message}</p>
                    <button class="btn btn-primary" onclick="closeModal(${callback ? 'true' : 'false'})">ตกลง</button>
                </div>
            </div>`;
            // Store callback
            window._modalCallback = callback;
        }

        function closeModal(hasCallback) {
            document.getElementById('modalContainer').innerHTML = '';
            if (hasCallback === true || hasCallback === 'true') {
                const cb = window._modalCallback;
                if (cb && typeof cb === 'function') {
                    setTimeout(cb, 200);
                }
            }
            window._modalCallback = null;
        }

        function bindEvents() {
            // Global keyboard shortcut
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const answerInput = document.getElementById('answerInput');
                    if (answerInput && document.activeElement === answerInput) {
                        submitAnswer();
                    }
                }
            });
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            createStars();
            loadGame();
            renderScreen('menu');
        }

        // Start the game
        init();
    </script>
</body>
  </html>
