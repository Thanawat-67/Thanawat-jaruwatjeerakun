/* -------- DUEL -------- */
MG.Duel = (function(){
  let s = null, timerId = null;

  function genQ(){
    const op = U.pick(['+','-','×']);
    let a, b, correct;
    if(op==='+'){a=U.R(10,40);b=U.R(10,40);correct=a+b;}
    else if(op==='-'){a=U.R(20,50);b=U.R(1,Math.max(3,a-5));correct=a-b;}
    else{a=U.R(2,9);b=U.R(2,9);correct=a*b;}
    const opts = [correct], seen = {}; seen[correct] = 1;
    let guard = 0;
    while(opts.length < 4 && guard++ < 100){
      const d = U.R(-6,6);
      if(d===0) continue;
      const v = correct + d;
      if(v < 0 || seen[v]) continue;
      seen[v] = 1; opts.push(v);
    }
    while(opts.length < 4){
      let v = correct + opts.length + 10;
      while(seen[v]) v++;
      seen[v] = 1; opts.push(v);
    }
    return {a,b,op,correct,opts:U.shuffle(opts)};
  }

  function start(){
    cleanup();
    s = {p1:0, p2:0, time:60, q:genQ(), locked:false, p1F:false, p2F:false};
    timerId = setInterval(() => {
      if(!s){clearInterval(timerId); timerId = null; return;}
      s.time--;
      const el = document.getElementById('duelTimer');
      if(el) el.textContent = s.time + 's';
      if(s.time <= 0){
        clearInterval(timerId); timerId = null;
        finish();
      }
    }, 1000);
  }

  function cleanup(){
    if(timerId){clearInterval(timerId); timerId = null;}
    s = null;
  }

  function answer(p, v){
    if(!s || s.locked) return;
    if(p===1 && s.p1F) return;
    if(p===2 && s.p2F) return;
    if(v === s.q.correct){
      s.locked = true;
      if(p===1) s.p1++; else s.p2++;
      MQ.Audio.sfx.correct();
      setTimeout(() => {
        if(!s) return;
        s.q = genQ(); s.locked = false;
        MQ.Router.go('duel');
      }, 400);
    } else {
      MQ.Audio.sfx.wrong();
      if(p===1) s.p1F = true; else s.p2F = true;
      MQ.Router.go('duel');
      setTimeout(() => {
        if(!s) return;
        if(p===1) s.p1F = false; else s.p2F = false;
        MQ.Router.go('duel');
      }, 1200);
    }
  }

  function finish(){
    if(!s) return;
    const s1 = s.p1, s2 = s.p2;
    const reward = s1 * 10;
    st().player.gold += reward;
    MQ.State.save();
    MQ._trackMiniWin('duel');
    MQ.Audio.sfx.win();
    const msg = s1>s2 ? '🏆 P1 ชนะ!' : s2>s1 ? '🏆 P2 ชนะ!' : '🤝 เสมอ!';
    cleanup();
    MQ.UI.modal('⚔️ จบการแข่ง', `
      <div class="tc">
        <div style="font-size:56px;">🏁</div>
        <div style="font-weight:700;margin-top:12px;font-size:18px;">${msg}</div>
        <div style="margin-top:8px;">P1: ${s1} · P2: ${s2}</div>
        <div style="color:var(--ny);margin-top:8px;font-weight:700;">+${reward}🪙</div>
      </div>
    `, [
      {label:'🔁 เล่นใหม่',cls:'btn-g',action:"MQ.UI.closeModal();MQ.MiniGames.Duel.start();MQ.Router.go('duel')"},
      {label:'🏠 กลับ',cls:'btn-o',action:"MQ.UI.closeModal();MQ.Router.go('modes')"}
    ]);
  }

  function render(content){
    if(!s) start();
    if(!s){content.innerHTML = '<div class="tc">⏳...</div>'; return;}
    const q = s.q;
    const qHtml = q.a + ' ' + q.op + ' ' + q.b + ' = ?';
    const optsFor = (p, dis) => q.opts.map(v =>
      `<button class="btn ${dis?'':'btn-o'}" style="min-height:52px;font-size:18px;font-weight:700;font-family:'Orbitron',sans-serif;" onclick="MQ.MiniGames.Duel.answer(${p},${v})" ${dis?'disabled':''}>${v}</button>`
    ).join('');
    const p1Dis = s.p1F || s.locked;
    const p2Dis = s.p2F || s.locked;
    content.innerHTML = `
      <div class="sbar">
        <span>⏱<span id="duelTimer" class="sv">${s.time}s</span></span>
        <span class="bdg bdg-b">P1: ${s.p1}</span>
        <span class="bdg bdg-r">P2: ${s.p2}</span>
      </div>
      <div style="background:linear-gradient(180deg,rgba(0,240,255,0.08),transparent);border:2px solid var(--nb);border-radius:16px;padding:14px;margin-bottom:10px;transform:rotate(180deg);">
        <div style="text-align:center;font-size:12px;font-weight:700;color:var(--nb);margin-bottom:6px;">🔵 P1 (บน)</div>
        <div style="text-align:center;font-size:26px;font-weight:900;font-family:'Orbitron',sans-serif;margin:8px 0;">${qHtml}</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;">${optsFor(1, p1Dis)}</div>
      </div>
      <div style="background:linear-gradient(0deg,rgba(255,0,110,0.08),transparent);border:2px solid var(--np);border-radius:16px;padding:14px;">
        <div style="text-align:center;font-size:12px;font-weight:700;color:var(--np);margin-bottom:6px;">🔴 P2 (ล่าง)</div>
        <div style="text-align:center;font-size:26px;font-weight:900;font-family:'Orbitron',sans-serif;margin:8px 0;">${qHtml}</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;">${optsFor(2, p2Dis)}</div>
      </div>
      <button class="btn btn-o wf mt2" onclick="MQ.Router.go('modes')">✖ ออก</button>
    `;
  }

  return {start, cleanup, answer, render};
})();

/* -------- TARGET 24 -------- */
MG.Target24 = (function(){
  let s = null;

  function canMake24(nums){
    if(nums.length === 1) return Math.abs(nums[0] - 24) < 0.001;
    for(let i = 0; i < nums.length; i++){
      for(let j = 0; j < nums.length; j++){
        if(i === j) continue;
        const a = nums[i], b = nums[j];
        const rest = nums.filter((_, k) => k !== i && k !== j);
        const results = [a+b, a-b, a*b];
        if(b !== 0) results.push(a/b);
        for(const r of results){
          if(!isFinite(r)) continue;
          if(canMake24([...rest, r])) return true;
        }
      }
    }
    return false;
  }

  function genNums(){
    for(let i = 0; i < 200; i++){
      const nums = [U.R(1,10), U.R(1,10), U.R(1,10), U.R(1,10)];
      if(canMake24(nums)) return nums;
    }
    return [1,2,3,4];
  }

  function start(){
    s = {round:1, maxRounds:3, score:0, nums:genNums(), used:[false,false,false,false], expr:[]};
  }

  function cleanup(){s = null;}

  function pickNum(i){
    if(!s || s.used[i]) return;
    const last = s.expr[s.expr.length-1];
    if(last && last.type === 'num') return;
    s.used[i] = true;
    s.expr.push({type:'num', idx:i, val:s.nums[i]});
    MQ.Audio.sfx.click();
    MQ.Router.go('target24');
  }

  function addOp(op){
    if(!s) return;
    const last = s.expr[s.expr.length-1];
    if(op === '('){
      s.expr.push({type:'op', val:'('});
    } else if(op === ')'){
      if(!last || (last.type === 'num' || last.val === ')')) s.expr.push({type:'op', val:')'});
    } else {
      if(!last || last.type !== 'num') return;
      s.expr.push({type:'op', val:op});
    }
    MQ.Audio.sfx.click();
    MQ.Router.go('target24');
  }

  function undo(){
    if(!s) return;
    const t = s.expr.pop();
    if(!t) return;
    if(t.type === 'num') s.used[t.idx] = false;
    MQ.Audio.sfx.click();
    MQ.Router.go('target24');
  }

  function submit(){
    if(!s) return;
    if(!s.used.every(x => x)){
      MQ.UI.floatCenter('❗ ใช้ครบ 4 ตัว','critdmg');
      return;
    }
    const str = s.expr.map(t => t.val).join('');
    const js = str.replace(/×/g,'*').replace(/÷/g,'/');
    let v;
    try{v = Function('return (' + js + ')')();}
    catch(e){MQ.UI.floatCenter('❌ ผิดรูปแบบ','critdmg'); return;}
    if(!isFinite(v)){MQ.UI.floatCenter('❌ ผิดรูปแบบ','critdmg'); return;}
    if(Math.abs(v - 24) < 0.001){
      MQ.Audio.sfx.correct();
      s.score += 20;
      st().player.gold += 80;
      MQ.State.save();
      s.round++;
      if(s.round > s.maxRounds){
        MQ._trackMiniWin('target24');
        const sc = s.score;
        cleanup();
        MQ.UI.modal('🏆 จบ!', `<div class="tc"><div style="font-size:56px;">🏆</div><div style="margin-top:8px;">คะแนน: ${sc}</div><div style="color:var(--ny);margin-top:8px;">+240🪙</div></div>`, [
          {label:'🔁 ใหม่',cls:'btn-g',action:"MQ.UI.closeModal();MQ.MiniGames.Target24.start();MQ.Router.go('target24')"},
          {label:'🏠 กลับ',cls:'btn-o',action:"MQ.UI.closeModal();MQ.Router.go('modes')"}
        ]);
      } else {
        s.nums = genNums();
        s.used = [false,false,false,false];
        s.expr = [];
        MQ.Router.go('target24');
      }
    } else {
      MQ.Audio.sfx.wrong();
      MQ.UI.floatCenter('❌ ' + v.toFixed(2) + ' ≠ 24','critdmg');
    }
  }

  function render(content){
    if(!s) start();
    if(!s) return;
    const numsHtml = s.nums.map((n, i) =>
      `<div style="aspect-ratio:1;background:linear-gradient(135deg,rgba(0,240,255,0.2),rgba(181,55,242,0.15));border:2px solid var(--nb);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:32px;font-weight:900;cursor:pointer;${s.used[i]?'opacity:0.3;background:rgba(0,0,0,0.3);border-color:var(--gb);cursor:not-allowed;':''}" onclick="MQ.MiniGames.Target24.pickNum(${i})">${n}</div>`
    ).join('');
    const exprHtml = s.expr.length
      ? s.expr.map(t => `<span style="display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;border-radius:8px;background:${t.type==='op'?'rgba(181,55,242,0.15)':'rgba(0,240,255,0.1)'};border:1px solid ${t.type==='op'?'rgba(181,55,242,0.4)':'rgba(0,240,255,0.3)'};font-family:'Orbitron',sans-serif;font-weight:700;${t.type==='op'?'color:var(--nu);':''}">${t.val}</span>`).join('')
      : '<span style="color:var(--td);font-size:13px;">กดตัวเลข → operator → ตัวเลข...</span>';
    content.innerHTML = `
      <h3>🎲 Target 24</h3>
      <div class="sbar">
        <span>รอบ<span class="sv">${s.round}/${s.maxRounds}</span></span>
        <span>คะแนน<span class="sg">${s.score}</span></span>
      </div>
      <div class="si col" style="padding:16px;">

/* -------- PATTERN -------- */
MG.Pattern = (function(){
  let s = null;

  function genQ(){
    const type = U.pick(['arith','geom','square','fib']);
    if(type === 'arith'){
      const a = U.R(1,15), d = U.R(2,9);
      return {seq:[a, a+d, a+2*d, a+3*d], next: a+4*d};
    }
    if(type === 'geom'){
      const a = U.R(1,5), r = U.R(2,3);
      return {seq:[a, a*r, a*r*r, a*r*r*r], next: a*r*r*r*r};
    }
    if(type === 'square'){
      const start = U.R(1,5);
      return {seq:[start*start,(start+1)*(start+1),(start+2)*(start+2),(start+3)*(start+3)], next:(start+4)*(start+4)};
    }
    const a = U.R(1,5), b = U.R(1,5);
    return {seq:[a, b, a+b, a+2*b], next: 2*a+3*b};
  }

  function start(){s = {round:1, maxRounds:5, score:0, cur:genQ()};}
  function cleanup(){s = null;}

  function submit(){
    if(!s) return;
    const inp = document.getElementById('patInp');
    if(!inp) return;
    const v = inp.value.trim();
    if(!v) return;
    if(MQ.Checker.match(v, String(s.cur.next))){
      MQ.Audio.sfx.correct();
      s.score += 10;
      st().player.gold += 30;
      MQ.State.save();
      s.round++;
      if(s.round > s.maxRounds){
        MQ._trackMiniWin('pattern');
        const sc = s.score;
        cleanup();
        MQ.UI.modal('🏆 จบ!', `<div class="tc"><div style="font-size:56px;">🏆</div><div style="margin-top:8px;">คะแนน: ${sc}</div><div style="color:var(--ny);margin-top:8px;">+150🪙</div></div>`, [
          {label:'🔁 ใหม่',cls:'btn-g',action:"MQ.UI.closeModal();MQ.MiniGames.Pattern.start();MQ.Router.go('pattern')"},
          {label:'🏠 กลับ',cls:'btn-o',action:"MQ.UI.closeModal();MQ.Router.go('modes')"}
        ]);
      } else {
        s.cur = genQ();
        MQ.Router.go('pattern');
      }
    } else {
      MQ.Audio.sfx.wrong();
      MQ.UI.floatCenter('❌ เฉลย: ' + s.cur.next,'critdmg');
      setTimeout(() => {
        if(!s) return;
        s.cur = genQ();
        MQ.Router.go('pattern');
      }, 1100);
    }
  }

  function render(content){
    if(!s) start();
    if(!s) return;
    const seqHtml = s.cur.seq.map(n =>
      `<div style="min-width:52px;height:52px;padding:0 10px;background:linear-gradient(135deg,rgba(0,240,255,0.2),rgba(181,55,242,0.15));border:2px solid var(--nb);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;">${n}</div>`
    ).join('') + `<div style="min-width:52px;height:52px;padding:0 10px;background:rgba(255,230,0,0.15);border:2px solid var(--ny);color:var(--ny);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;">?</div>`;
    content.innerHTML = `
      <h3>🧩 Pattern</h3>
      <div class="sbar">
        <span>รอบ<span class="sv">${s.round}/${s.maxRounds}</span></span>
        <span>คะแนน<span class="sg">${s.score}</span></span>
      </div>
      <div class="si col" style="padding:16px;">
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;">${seqHtml}</div>
        <div style="display:flex;gap:8px;">
          <input id="patInp" type="text" inputmode="numeric" placeholder="ตัวเลข" style="flex:1;padding:14px;font-size:20px;text-align:center;border-radius:10px;border:2px solid var(--gb);background:rgba(0,0,0,0.5);color:var(--tb);font-family:'Orbitron',sans-serif;font-weight:700;">
          <button class="btn btn-g" onclick="MQ.MiniGames.Pattern.submit()" style="min-width:64px;min-height:52px;font-size:20px;">✓</button>
        </div>
      </div>
      <button class="btn btn-o wf mt2" onclick="MQ.Router.go('modes')">✖ ออก</button>
    `;
    const inp = document.getElementById('patInp');
    if(inp){
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter'){e.preventDefault(); MG.Pattern.submit();}
      });
      setTimeout(() => inp.focus(), 100);
    }
  }

  return {start, cleanup, submit, render};
})();

/* -------- GREATER / LESSER -------- */
MG.GreaterLesser = (function(){
  let s = null;

  function genCmp(){
    const types = [
      () => {const a=U.R(1,20),b=U.R(1,20),c=U.R(1,20);return{L:a+b,R:c,eL:a+'+'+b,eR:String(c)};},
      () => {const a=U.R(2,12),b=U.R(2,12);return{L:a*b,R:a+b,eL:a+'×'+b,eR:a+'+'+b};},
      () => {const a=U.R(2,9),b=U.R(2,9);return{L:a*a,R:b*b,eL:a+'²',eR:b+'²'};},
      () => {const a=U.R(2,9),b=U.R(2,9);return{L:a*a+b,R:b*b+a,eL:a+'²+'+b,eR:b+'²+'+a};}
    ];
    return U.pick(types)();
  }

  function start(){s = {round:1, maxRounds:8, score:0, cur:genCmp()};}
  function cleanup(){s = null;}

  function answer(op){
    if(!s) return;
    const c = s.cur;
    const correct = c.L < c.R ? '<' : c.L > c.R ? '>' : '=';
    if(op === correct){
      MQ.Audio.sfx.correct();
      s.score += 10;
      st().player.gold += 15;
      MQ.State.save();
      s.round++;
      if(s.round > s.maxRounds){
        MQ._trackMiniWin('greaterLesser');
        const sc = s.score;
        cleanup();
        MQ.UI.modal('🏆 จบ!', `<div class="tc"><div style="font-size:56px;">🏆</div><div style="margin-top:8px;">คะแนน: ${sc}</div><div style="color:var(--ny);margin-top:8px;">+120🪙</div></div>`, [

          {label:'🏠 กลับ',cls:'btn-o',action:"MQ.UI.closeModal();MQ.Router.go('modes')"}
        ]);
      } else {
        s.cur = genCmp();
        MQ.Router.go('greaterLesser');
      }
    } else {
      MQ.Audio.sfx.wrong();
      MQ.UI.floatCenter('❌ ต้องเป็น ' + correct,'critdmg');
    }
  }

  function render(content){
    if(!s) start();
    if(!s) return;
    const c = s.cur;
    content.innerHTML = `
      <h3>🎯 Greater / Lesser</h3>
      <div class="sbar">
        <span>รอบ<span class="sv">${s.round}/${s.maxRounds}</span></span>
        <span>คะแนน<span class="sg">${s.score}</span></span>
      </div>
      <div class="si col" style="padding:16px;">
        <div style="display:flex;gap:10px;align-items:center;justify-content:center;width:100%;margin-bottom:14px;">
          <div style="flex:1;padding:18px;background:rgba(0,0,0,0.4);border:2px solid var(--gb);border-radius:12px;text-align:center;font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;">${c.eL}</div>
          <div style="font-size:28px;color:var(--ny);font-weight:900;">?</div>
          <div style="flex:1;padding:18px;background:rgba(0,0,0,0.4);border:2px solid var(--gb);border-radius:12px;text-align:center;font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;">${c.eR}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto;">
          <button onclick="MQ.MiniGames.GreaterLesser.answer('<')" style="min-height:60px;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;border-radius:12px;border:2px solid var(--gb);background:rgba(0,0,0,0.4);color:var(--tb);cursor:pointer;">&lt;</button>
          <button onclick="MQ.MiniGames.GreaterLesser.answer('=')" style="min-height:60px;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;border-radius:12px;border:2px solid var(--gb);background:rgba(0,0,0,0.4);color:var(--tb);cursor:pointer;">=</button>
          <button onclick="MQ.MiniGames.GreaterLesser.answer('>')" style="min-height:60px;font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;border-radius:12px;border:2px solid var(--gb);background:rgba(0,0,0,0.4);color:var(--tb);cursor:pointer;">&gt;</button>

      <button class="btn btn-o wf mt2" onclick="MQ.Router.go('modes')">✖ ออก</button>
    `;

  return {start, cleanup, answer, render};
})();

  _sfxOrig[k] = MQ.Audio.sfx[k];
  MQ.Audio.sfx[k] = function(){
    const v = st().settings.vol;
    if(v.master * v.sfx <= 0.01) return;
    return _sfxOrig[k].apply(this, arguments);

});

};

/* ============================================================
   7. DATE HELPERS
   ============================================================ */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

/* ============================================================
   8. DAILY LOGIN
   ============================================================ */
const DAILY_REWARDS = [
  {day:1, icon:'🪙', gold:100, sp:0},
  {day:2, icon:'🪙', gold:150, sp:0},
  {day:3, icon:'💎', gold:200, sp:1},
  {day:4, icon:'🪙', gold:250, sp:0},
  {day:5, icon:'💎', gold:350, sp:1},
  {day:6, icon:'🪙', gold:500, sp:1},
  {day:7, icon:'👑', gold:1000, sp:3}
];

MQ.Daily = {
  getInfo(){
    const d = st().meta.daily;
    const today = todayStr();
    const canClaim = d.lastDate !== today;
    const continues = d.lastDate === yesterdayStr();
    const nextDay = canClaim ? (continues ? Math.min(d.streak+1, 7) : 1) : d.streak;
    return {canClaim, streak:d.streak, nextDay, today};
  },
  claim(){
    const s = st();
    const d = s.meta.daily;
    const today = todayStr();
    if(d.lastDate === today) return null;
    const info = this.getInfo();
    const day = info.nextDay;
    const reward = DAILY_REWARDS[day-1];
    s.player.gold += reward.gold;
    if(reward.sp) s.player.skillPoints += reward.sp;
    d.lastDate = today;
    d.streak = day;
    d.claimed[today] = day;
    MQ.Save.write(s);
    MQ.Audio.sfx.win();
    MQ.Particles.burst(window.innerWidth/2, window.innerHeight/2, {count:60, speed:9, colors:['#ffd700','#ffe600','#39ff14']});
    if(MQ.Achievements) setTimeout(() => MQ.Achievements.check(), 400);
    return reward;
  },
  render(content){
    const info = this.getInfo();
    let grid = '';
    for(let i = 0; i < 7; i++){
      const r = DAILY_REWARDS[i];
      const claimed = i < info.streak;
      const isToday = i === info.streak - 1 && info.streak > 0;
      const willBeToday = info.canClaim && i === info.nextDay - 1;
      let cls = 'p10-day';
      if(claimed) cls += ' claimed';
      if(isToday || willBeToday) cls += ' today';
      grid += `<div class="${cls}">
        <div class="p10-day-num">วันที่ ${i+1}</div>
        <div class="p10-day-icon">${r.icon}</div>
        <div class="p10-day-reward">${r.gold}🪙${r.sp?'+'+r.sp+'SP':''}</div>
      </div>`;
    }
    content.innerHTML = `
      <h3>🎁 Daily Login</h3>
      <div class="sbar"><span>🔥 Streak<span class="sv">${info.streak} วัน</span></span></div>
      <div class="si col" style="padding:16px;">
        <div class="tc" style="margin-bottom:8px;font-size:13px;color:var(--td);">เซ็นชื่อรายวัน รับรางวัล 7 วัน</div>
        <div class="p10-daily-grid">${grid}</div>
        ${info.canClaim
          ? `<button class="btn btn-g wf" onclick="window.__mq_claimDaily()" style="min-height:54px;font-size:15px;margin-top:8px;">🎁 รับรางวัลวันที่ ${info.nextDay}</button>`
          : `<button class="btn wf" disabled style="min-height:54px;margin-top:8px;">✅ รับแล้ววันนี้ — กลับมาพรุ่งนี้!</button>`}
      </div>
      <button class="btn btn-o wf mt2" onclick="MQ.Router.go('home')">🔙 กลับ</button>
    `;
  }
};
MQ.Router.register('daily', c => MQ.Daily.render(c));

  const r = MQ.Daily.claim();

  MQ.UI.modal('🎁 รับรางวัล!', `

const QUEST_POOL = [
  {id:'win_3',     desc:'ชนะการต่อสู้ 3 ครั้ง',    icon:'⚔️', target:3,   reward:{gold:100}, track:'win'},
  {id:'answer_20', desc:'ตอบถูก 20 ข้อ',           icon:'✅', target:20,  reward:{gold:120}, track:'correct'},
  {id:'combo_5',   desc:'ถึง combo 5',              icon:'🔥', target:1,   reward:{gold:80},  track:'combo5'},
  {id:'skill_3',   desc:'ใช้สกิล 3 ครั้ง',          icon:'⚡', target:3,   reward:{gold:90},  track:'skill'},
  {id:'crit_5',    desc:'ติดคริ 5 ครั้ง',            icon:'💥', target:5,   reward:{gold:100}, track:'crit'},
  {id:'minigame_1',desc:'เล่นมินิเกม 1 รอบ',         icon:'🎮', target:1,   reward:{gold:70},  track:'minigame'},
  {id:'boss_1',    desc:'ปราบบอส 1 ตัว',             icon:'👑', target:1,   reward:{gold:150}, track:'boss'},
  {id:'gold_500',  desc:'หาเงินได้ 500 ทอง',         icon:'💰', target:500, reward:{gold:100}, track:'gold'}
];

MQ.Quests = {
  ensureToday(){
    const today = todayStr();
    const q = st().meta.quests;
    if(q.date === today) return;
    const picked = U.shuffle(QUEST_POOL).slice(0, 3);
    q.date = today;
    q.list = picked.map(p => ({...p, progress:0, done:false}));
    q.claimed = [];
    MQ.Save.write(st());
  },
  track(type, amount){
    amount = amount || 1;
    const q = st().meta.quests;
    if(!q || !q.list || q.date !== todayStr()) return;
    let changed = false;
    q.list.forEach(quest => {
      if(quest.done) return;
      if(quest.track !== type) return;
      quest.progress = Math.min(quest.target, (quest.progress||0) + amount);
      if(quest.progress >= quest.target){
        quest.done = true;
        changed = true;
        MQ.UI.floatCenter('🎯 ' + quest.icon + ' เควสสำเร็จ!', 'heal');
      }
    });
    if(changed) MQ.Save.write(st());
  },
  claim(id){
    const q = st().meta.quests;
    const quest = q.list.find(x => x.id === id);
    if(!quest || !quest.done || q.claimed.indexOf(id) > -1) return;
    q.claimed.push(id);
    st().player.gold += quest.reward.gold;
    MQ.Audio.sfx.win();
    MQ.Save.write(st());
    MQ.Router.go('quests');
    if(MQ.Achievements) setTimeout(() => MQ.Achievements.check(), 200);
  },
  render(content){
    this.ensureToday();
    const q = st().meta.quests;
    let list = q.list.map(quest => {
      const claimed = q.claimed.indexOf(quest.id) > -1;
      const pct = Math.round(quest.progress / quest.target * 100);
      const cls = claimed ? 'p10-quest claimed' : (quest.done ? 'p10-quest done' : 'p10-quest');
      return `<div class="${cls}">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <span style="font-size:18px;">${quest.icon}</span>
            <span style="font-weight:700;font-size:13px;margin-left:6px;">${U.esc(quest.desc)}</span>
          </div>
          ${claimed
            ? '<span class="bdg bdg-gold">✅ รับแล้ว</span>'
            : quest.done
              ? `<button class="btn btn-xs btn-g" onclick="MQ.Quests.claim('${quest.id}')">รับ +${quest.reward.gold}🪙</button>`
              : `<span style="font-size:11px;color:var(--td);">${quest.progress}/${quest.target}</span>`}
        </div>
        <div class="pb" style="margin-top:6px;"><div class="pbf" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    content.innerHTML = `
      <h3>📋 Daily Quest</h3>
      <div class="sbar">
        <span>📅 <span class="sv">${q.date}</span></span>
        <span>✅ <span class="sg">${q.claimed.length}/${q.list.length}</span></span>
      </div>
      <div style="margin-top:10px;">${list}</div>
      <button class="btn btn-o wf mt3" onclick="MQ.Router.go('home')">🔙 กลับ</button>
    `;
  }
};
MQ.Router.register('quests', c => MQ.Quests.render(c));

/* ============================================================
   10. QUEST TRACKING HOOKS
   ============================================================ */

// Track: correct + combo5 (wrap _handleCorrect)
const _origHC4 = MQ.Battle._handleCorrect;
MQ.Battle._handleCorrect = function(){
  const beforeCombo = st().player.combo;
  const r = _origHC4.call(this);
  const afterCombo = st().player.combo;
  if(afterCombo > beforeCombo){
    MQ.Quests.track('correct', 1);
    if(afterCombo === 5) MQ.Quests.track('combo5', 1);
  }
  return r;
};

// Track: skill (wrap useSkill)
const _origSkill4 = MQ.Battle.useSkill;
MQ.Battle.useSkill = function(slot){
  const r = _origSkill4.call(this, slot);
  // Only track if actually used (not blocked by CD/gold)
  MQ.Quests.track('skill', 1);
  return r;
};

// Track: crit (wrap sfx.crit — but only while in battle)
const _origCrit4 = MQ.Audio.sfx.crit;
MQ.Audio.sfx.crit = function(){
  if(MQ.Battle && MQ.Battle.active && !MQ.Battle._ended){
    MQ.Quests.track('crit', 1);
  }
  return _origCrit4.apply(this, arguments);
};

// Track: minigame (wrap MQ._trackMiniWin from Block 3)

window.__mq_setVol = function(type, val){
  const v = Math.max(0, Math.min(1, parseInt(val)/100));
  st().settings.vol[type] = v;
  MQ.State.save();
  // Update slider visual
  document.querySelectorAll('.p10-slider').forEach(sl => sl.style.setProperty('--val', sl.value + '%'));
  // Update label
  const si = document.querySelectorAll('.si.col');
  const idx = type === 'master' ? 0 : type === 'sfx' ? 1 : 2;
  if(si[idx]){
    const spans = si[idx].querySelectorAll('span');
    if(spans.length >= 2) spans[1].textContent = Math.round(v*100) + '%';
  }
  // Apply master mute
  if(type === 'master'){
    const enabled = v > 0.01 && st().settings.soundOn;
    MQ.Audio.setEnabled(enabled);
  }
  if(type === 'music'){
    if(v <= 0.01) MQ.Audio.stopMusic();
  }
};

(function(){
'use strict';

const st = () => MQ.State.data;

/* ============================================================
   🔴 CRITICAL FIX #1: REBIRTH DOUBLE HP BONUS
   Block 2 เพิ่ม passiveBoosts.hp += 25
   Block 1 getMaxHp() บวก rebirth*25 อยู่แล้ว
   → wrap เพื่อหัก 25 ที่ซ้ำซ้อนออก
   ============================================================ */
const _origConfirmRebirth = window.__mq_confirmRebirth;
if(_origConfirmRebirth){
  window.__mq_confirmRebirth = function(){
    const s = st();
    const rebirthBefore = s.player.rebirth;
    const hpBoostBefore = s.character.passiveBoosts.hp || 0;
    _origConfirmRebirth.call(this);
    // ถ้า rebirth สำเร็จจริง → Block 2 เพิ่ม passiveBoosts.hp +25
    if(s.player.rebirth > rebirthBefore && (s.character.passiveBoosts.hp || 0) > hpBoostBefore){
      s.character.passiveBoosts.hp = Math.max(0, (s.character.passiveBoosts.hp || 0) - 25);
      s.player.maxHp = MQ.Char.getMaxHp();
      if(s.player.hp > s.player.maxHp) s.player.hp = s.player.maxHp;
      MQ.Save.write(s);
    }
  };
}

/* ============================================================
   🔴 CRITICAL FIX #2: QUEST SKILL FALSE TRACK
   Block 4 wrap useSkill track ทุกครั้ง แม้ CD อยู่/เงินไม่พอ
   → wrap เพื่อ undo track ถ้าใช้ไม่จริง
   ============================================================ */
const _prevUseSkill = MQ.Battle.useSkill;
MQ.Battle.useSkill = function(slot){
  const s = st();
  const goldBefore = s.player.gold;
  const cdBefore = (this._skillCD && this._skillCD[slot]) || 0;

  const r = _prevUseSkill.call(this, slot); // Block 4 → Block 1 → Block 4 track

  const goldAfter = s.player.gold;
  const cdAfter = (this._skillCD && this._skillCD[slot]) || 0;
  const actuallyUsed = (goldBefore !== goldAfter) || (cdBefore !== cdAfter);

  if(!actuallyUsed){
    // Block 4 track ไปแล้ว → undo
    const q = s.meta.quests;
    if(q && q.list){
      q.list.forEach(quest => {
        if(quest.track === 'skill' && quest.progress > 0){
          quest.progress = Math.max(0, quest.progress - 1);
          if(quest.progress < quest.target) quest.done = false;
        }
      });
      MQ.Save.write(s);
    }
  }
  return r;
};

/* ============================================================
   🔴 CRITICAL FIX #3 + 🟡 FIX #11: NO_DAMAGE FALSE POSITIVE + CRITDODGE
   ============================================================ */
// Track _tookDamage flag ใน _handleWrong + critDodge ทำงาน
const _prevHandleWrong = MQ.Battle._handleWrong;
MQ.Battle._handleWrong = function(timedOut){
  const s = st();
  const hpBefore = s.player.hp;

  // 🟡 Fix #11: critDodge ทำงานจริง — หลบดาเมจโดยใช้ shield mechanism
  const cd = MQ.Char.getPassiveValue('critDodge');
  if(cd > 0 && !(s.player.shieldHits > 0) && Math.random() < cd){
    s.player.shieldHits = 1; // ให้ block ผ่าน shield
    MQ.UI.floatCenter('💨 หลบ!', 'heal');
  }

  const r = _prevHandleWrong.call(this, timedOut);

  if(s.player.hp < hpBefore) this._tookDamage = true;
  return r;
};

// Reset flag ตอน setup
const _prevSetup = MQ.Battle.setup;
MQ.Battle.setup = function(ch, stage){
  this._tookDamage = false;
  return _prevSetup.call(this, ch, stage);
};

// Wrap end → ยกเลิก noDamage ถ้าโดนตีจริง
const _prevEnd = MQ.Battle.end;
MQ.Battle.end = function(won){
  const s = st();
  const before = s.meta.tracked.battlesNoDamage;
  const r = _prevEnd.call(this, won);
  if(won && this._tookDamage && s.meta.tracked.battlesNoDamage > before){
    s.meta.tracked.battlesNoDamage--;
    MQ.Save.write(s);
  }
  return r;
};

/* ============================================================
   🟠 FIX #4: CONSUMABLE MODAL + TIMER PAUSE
   เปิด modal ระหว่าง timer เดิน → timer หมด → modal ค้าง
   → หยุด timer ระหว่างเปิด, resume เมื่อปิด
   ============================================================ */
const _prevOpenConsumables = window.__mq_openConsumables;
window.__mq_openConsumables = function(){
  if(!MQ.Battle.active || MQ.Battle._ended) return;

  // หยุด timer ชั่วคราว
  const hadTimer = !!MQ.Battle.timerId;
  const savedLeft = MQ.Battle.timerLeft;
  if(MQ.Battle.timerId){
    clearInterval(MQ.Battle.timerId);
    MQ.Battle.timerId = null;
  }

  _prevOpenConsumables.call(this);

  // รอ DOM update แล้วเช็คว่า modal ขึ้นจริง
  setTimeout(() => {
    const mc = document.getElementById('modalContainer');
    const hasModal = mc && mc.querySelector('.mo');

    if(!hasModal){
      // ไม่มีไอเทม → modal ไม่ขึ้น → resume timer ทันที
      if(MQ.Battle.active && !MQ.Battle._ended && hadTimer && !MQ.Battle.timerId){
        MQ.Battle.timerLeft = savedLeft;
        MQ.Battle._startTimer && MQ.Battle._startTimer();
      }
      return;
    }

    // modal ขึ้น → observe จนปิด
    const observer = new MutationObserver(() => {
      if(!mc.querySelector('.mo')){
        observer.disconnect();
        // resume timer ถ้า battle ยัง active
        if(MQ.Battle.active && !MQ.Battle._ended && !MQ.Battle.timerId){
          MQ.Battle.timerLeft = savedLeft;
          MQ.Battle._startTimer && MQ.Battle._startTimer();
        }
      }
    });
    observer.observe(mc, {childList: true, subtree: true});
  }, 50);
};

/* ============================================================
   🟠 FIX #5: MUSIC VOLUME LIVE UPDATE
   เปลี่ยน slider ระหว่างเล่น → restart music ให้ gain ใหม่
   ============================================================ */

const SLOT_KEYS = ['mathquest_v10_slot1', 'mathquest_v10_slot2'];

MQ.SaveSlot = {
  save(n){
    if(n < 1 || n > 2) return {ok:false};
    try{
      const json = JSON.stringify(MQ.State.data);
      localStorage.setItem(SLOT_KEYS[n-1], json);
      return {ok:true, size: Math.round(json.length/1024) + ' KB'};
    }catch(e){return {ok:false};}
  },
  load(n){
    if(n < 1 || n > 2) return {ok:false, reason:'invalid'};
    try{
      const raw = localStorage.getItem(SLOT_KEYS[n-1]);
      if(!raw) return {ok:false, reason:'empty'};
      const data = JSON.parse(raw);
      if(!MQ.Save.validate(data)) return {ok:false, reason:'invalid'};
      MQ.State.data = data;
      MQ.Save.write(data);
      return {ok:true};
    }catch(e){return {ok:false, reason:'error'};}
  },
  delete(n){
    if(n < 1 || n > 2) return;
    try{localStorage.removeItem(SLOT_KEYS[n-1]);}catch(e){}
  },
  info(n){
    if(n < 1 || n > 2) return {empty:true};
    try{
      const raw = localStorage.getItem(SLOT_KEYS[n-1]);
      if(!raw) return {empty:true};
      const d = JSON.parse(raw);
      const B = MQ.Content.BaseClasses[d.character.class];
      const A = MQ.Content.AdvanceClasses[d.character.class];
      const clsName = B ? B.name : (A ? A.name : d.character.class);
      return {
        empty: false,
        level: d.player.level,
        class: clsName,
        gold: d.player.gold,
        rebirth: d.player.rebirth,

};

const _origStartTimer = MQ.Battle._startTimer;
MQ.Battle._startTimer = function(){
  const saved = this._resumeTimerLeft;
  this._resumeTimerLeft = null;
  _origStartTimer.call(this);
  if(saved !== null && saved !== undefined && saved >= 0){
    this.timerLeft = saved;

  if(MQ.Battle.timerId){clearInterval(MQ.Battle.timerId);MQ.Battle.timerId = null;}

<script>
// === PHASE 10.4 START: Root Cause Fix — Timer Double-Resume + Cleanup ===
(function(){
'use strict';
const st = () => MQ.State.data;

/* ============================================================
   🔴 FIX A+F: TIMER DOUBLE-RESUME (Root Cause)
   
   ปัญหาที่แท้จริง:
   - Phase 10.1 observer × 1
   - Phase 10.2 observer × 1  
   - Phase 10.3 observer × 1
   → 3 observers ทำงานพร้อมกันตอน modal close
   → _startTimer ถูกเรียก 3 ครั้ง
   → ครั้งที่ 2-3 reset timerLeft = timerMax (BUG!)
   
   แก้ที่ _startTimer ระดับล่างสุด:
   - Debounce 150ms (กันเรียกซ้ำในหน้าต่างสั้น)
   - Preserve timerLeft ถ้ามี _resumeTimerLeft ค้าง
   - Guard flag _timerRunning
   ============================================================ */
const _prevStartTimer4 = MQ.Battle._startTimer;
MQ.Battle._startTimer = function(){
  // Debounce: ถ้าเพิ่งเริ่มภายใน 150ms → ไม่เริ่มซ้ำ
  const now = Date.now();
  if(this._lastTimerStartAt && now - this._lastTimerStartAt < 150){
    // เก็บ savedLeft ไว้เป็น fallback ถ้ามี
    if(this._resumeTimerLeft != null){
      // ไม่ทำอะไร — debounce
    }
    return;
  }
  this._lastTimerStartAt = now;

  // Clear timer เก่า (idempotent)
  if(this.timerId){
    clearInterval(this.timerId);
    this.timerId = null;
  }

  // Consume saved
  const saved = this._resumeTimerLeft;
  this._resumeTimerLeft = null;

  // เรียก chain เดิม
  _prevStartTimer4.call(this);

  // Restore ถ้ามี saved (ครั้งแรกเท่านั้น)
  if(saved !== null && saved !== undefined && saved >= 0){
    this.timerLeft = saved;
    if(this._updateTimerUI) this._updateTimerUI();
  }
};

// Reset debounce ตอน setup (battle ใหม่)
const _prevSetup4 = MQ.Battle.setup;
MQ.Battle.setup = function(ch, stage){
  this._lastTimerStartAt = null;
  this._resumeTimerLeft = null;
  return _prevSetup4.call(this, ch, stage);
};

/* ============================================================
   🔴 FIX: SINGLE OBSERVER — override __mq_openConsumables
   ใช้ single source observer + token กันซ้ำ
   ============================================================ */
// Token ใหม่ทุกครั้งที่เปิด
MQ.Battle._consToken = 0;

window.__mq_openConsumables = function(){
  if(!MQ.Battle.active || MQ.Battle._ended || MQ.Battle.isSubmitting) return;

  // Pause timer (ถ้ามี)
  const hadTimer = !!MQ.Battle.timerId;
  const savedLeft = MQ.Battle.timerLeft;
  if(MQ.Battle.timerId){
    clearInterval(MQ.Battle.timerId);
    MQ.Battle.timerId = null;

  // Token กัน observer เก่า
  const myToken = ++MQ.Battle._consToken;

  // สร้าง modal เอง (ไม่เรียก 10.1/10.2 เพื่อตัด observer เก่า)
  const s = st();

  for(const id in s.inventory.consumables){
    const cnt = s.inventory.consumables[id];
    if(cnt > 0 && MQ.SHOP_ITEMS[id] && MQ.SHOP_ITEMS[id].cat === 'consumable'){
      items.push({id, cnt, item: MQ.SHOP_ITEMS[id]});
    }
  }

  if(!items.length){
    MQ.UI.floatCenter('❗ ไม่มีไอเทม','critdmg');
    // Resume timer ทันที
    if(MQ.Battle.active && !MQ.Battle._ended && hadTimer){
      MQ.Battle._resumeTimerLeft = savedLeft;
      MQ.Battle._startTimer();
    }
    return;
  }

  const body = items.map(e => `
    <div class="si" style="margin-bottom:6px;">
      <span>${e.item.name} <span class="bdg bdg-b" style="font-size:9px;">×${e.cnt}</span></span>
      <button class="btn btn-sm btn-g" onclick="window.__mq_useConsumable('${e.id}')">ใช้</button>
    </div>
  `).join('');

  MQ.UI.modal('🧪 เลือกไอเทม', body, [{label:'ปิด',cls:'btn-o',action:'MQ.UI.closeModal()'}]);

  // Single watcher ที่รู้ token
  const mc = document.getElementById('modalContainer');
  const watcher = setInterval(() => {
    if(!mc.querySelector('.mo')){
      clearInterval(watcher);
      // ถ้า token เปลี่ยนแล้ว (เปิด modal ใหม่) → ไม่ต้อง resume
      if(MQ.Battle._consToken !== myToken) return;
      if(MQ.Battle.active && !MQ.Battle._ended && !MQ.Battle.timerId && hadTimer){
        MQ.Battle._resumeTimerLeft = savedLeft;
        MQ.Battle._startTimer();
      }
    }
  }, 80);
};
