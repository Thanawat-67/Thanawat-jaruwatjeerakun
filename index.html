<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Math Quest ม.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--neon-blue:#00f0ff;--neon-pink:#ff006e;--neon-purple:#b537f2;--neon-green:#39ff14;--neon-yellow:#ffe600;--neon-orange:#ff8c00;--dark-bg:#0a0a1a;--card-bg:rgba(15,15,35,0.92);--glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.14);--text-bright:#fff;--text-dim:#b0b0d0;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior:none;}
body{font-family:'Kanit',sans-serif;background:var(--dark-bg);background-image:radial-gradient(ellipse at 20% 10%,rgba(0,240,255,0.08) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(255,0,110,0.07) 0%,transparent 55%),radial-gradient(ellipse at 50% 90%,rgba(181,55,242,0.08) 0%,transparent 55%);color:var(--text-bright);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:stretch;padding:0;overflow:hidden;position:relative;user-select:none;-webkit-user-select:none;}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.app{width:100%;max-width:820px;position:relative;z-index:2;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);}
.game-wrapper{background:var(--card-bg);overflow:hidden;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);display:flex;flex-direction:column;flex:1;min-height:0;border-bottom:1px solid var(--glass-border);}
@media(min-width:640px){body{padding:12px;align-items:center;}.app{height:min(100dvh - 24px,900px);}.game-wrapper{border-radius:22px;border:1px solid var(--glass-border);box-shadow:0 0 30px rgba(0,240,255,0.18),0 20px 60px rgba(0,0,0,0.7);}}
.game-header{padding:8px 14px;text-align:center;background:rgba(0,240,255,0.04);border-bottom:1px solid var(--glass-border);flex-shrink:0;position:relative;}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.creator-badge{display:inline-block;background:rgba(255,0,110,0.18);border:1px solid var(--neon-pink);padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;color:var(--neon-pink);letter-spacing:1.5px;}
.sound-toggle{background:transparent;border:1px solid var(--glass-border);color:var(--text-bright);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;}
.game-title{font-family:'Orbitron',sans-serif;font-size:1.35em;font-weight:900;background:linear-gradient(90deg,var(--neon-blue),var(--neon-green),var(--neon-yellow),var(--neon-pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;line-height:1.15;margin-top:2px;}
.subtitle{color:var(--text-dim);font-size:9px;letter-spacing:1px;}
.game-content{padding:12px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;}
.game-content::-webkit-scrollbar{width:4px;}
.game-content::-webkit-scrollbar-thumb{background:var(--neon-purple);border-radius:3px;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:12px;cursor:pointer;transition:transform 0.12s,box-shadow 0.2s,filter 0.2s;letter-spacing:0.4px;text-align:center;color:#fff;background:linear-gradient(135deg,#00c6ff,#0072ff);box-shadow:0 4px 15px rgba(0,114,255,0.28);touch-action:manipulation;position:relative;}
.btn:active{transform:scale(0.96);filter:brightness(0.95);}
.btn:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.btn-green{background:linear-gradient(135deg,#00b09b,#96c93d);box-shadow:0 4px 15px rgba(0,176,155,0.28);}
.btn-red{background:linear-gradient(135deg,#ff416c,#ff4b2b);box-shadow:0 4px 15px rgba(255,65,108,0.28);}
.btn-yellow{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;box-shadow:0 4px 15px rgba(247,151,30,0.28);}
.btn-gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;box-shadow:0 4px 15px rgba(255,215,0,0.28);}
.btn-pink{background:linear-gradient(135deg,#ff006e,#ff4b8b);box-shadow:0 4px 15px rgba(255,0,110,0.28);}
.btn-purple{background:linear-gradient(135deg,#b537f2,#7b2ff7);box-shadow:0 4px 15px rgba(181,55,242,0.28);}
.btn-outline{background:transparent;border:2px solid var(--neon-blue);color:var(--neon-blue);box-shadow:none;}
.btn-outline:active{background:rgba(0,240,255,0.12);}
.btn-sm{min-height:42px;padding:8px 12px;font-size:12px;border-radius:10px;}
.btn-xs{min-height:36px;padding:5px 9px;font-size:11px;border-radius:8px;}
.stats-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,0.4);border-radius:12px;margin-bottom:8px;font-size:12px;color:#e0e0f0;flex-wrap:wrap;gap:4px;border:1px solid var(--glass-border);}
.stat-value{font-weight:700;color:var(--neon-blue);}
.stat-gold{font-weight:700;color:var(--neon-yellow);}
.badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:0.4px;}
.badge-gold{background:rgba(255,230,0,0.15);color:var(--neon-yellow);border:1px solid rgba(255,230,0,0.4);}
.badge-green{background:rgba(57,255,20,0.15);color:var(--neon-green);border:1px solid rgba(57,255,20,0.4);}
.badge-blue{background:rgba(0,240,255,0.15);color:var(--neon-blue);border:1px solid rgba(0,240,255,0.4);}
.badge-red{background:rgba(255,0,110,0.15);color:var(--neon-pink);border:1px solid rgba(255,0,110,0.4);}
.class-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.class-card{background:var(--glass);border:2px solid var(--glass-border);border-radius:14px;padding:12px 10px;cursor:pointer;transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;text-align:center;position:relative;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.class-card:active{transform:scale(0.97);}
.class-card.selected{border-color:var(--neon-green);background:rgba(57,255,20,0.08);box-shadow:0 0 18px rgba(57,255,20,0.25);}
.class-card.locked{opacity:0.55;}
.class-emoji{font-size:40px;display:block;margin-bottom:2px;line-height:1;}
.class-name{font-weight:700;color:var(--text-bright);font-size:14px;}
.class-desc{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.35;}
.chapter-container{margin-bottom:8px;}
.chapter-header{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all 0.2s;}
.chapter-header:active{transform:scale(0.98);border-color:var(--neon-blue);}
.chapter-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);flex-shrink:0;}
.chapter-info{flex:1;min-width:0;}
.chapter-name{font-weight:600;color:var(--text-bright);font-size:13px;}
.chapter-progress{font-size:10px;color:var(--text-dim);}
.level-list{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 0 0 50px;}
.level-btn{min-height:44px;padding:6px 4px;border-radius:9px;border:1px solid var(--glass-border);background:rgba(0,0,0,0.35);color:var(--text-bright);cursor:pointer;font-size:11px;transition:all 0.2s;text-align:center;font-family:'Kanit',sans-serif;font-weight:600;}
.level-btn.completed{border-color:var(--neon-green);background:rgba(57,255,20,0.12);}
.battle-scene{background:rgba(0,0,0,0.5);border-radius:14px;padding:12px;border:1px solid var(--glass-border);margin-bottom:10px;text-align:center;position:relative;overflow:hidden;}
.battle-scene.shake{animation:screenShake 0.4s ease;}
@keyframes screenShake{0%,100%{transform:translate(0,0);}20%{transform:translate(-6px,3px);}40%{transform:translate(6px,-3px);}60%{transform:translate(-4px,-2px);}80%{transform:translate(4px,2px);}}
.emoji-display{font-size:54px;display:inline-block;transition:transform 0.3s;line-height:1;user-select:none;}
.emoji-display.hit{animation:emojiHit 0.4s ease;}
.emoji-display.crit{animation:emojiCrit 0.5s ease-out;}
@keyframes emojiHit{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes emojiCrit{0%{transform:scale(1);}30%{transform:scale(1.6) rotate(-10deg);}60%{transform:scale(1.15) rotate(5deg);}100%{transform:scale(1) rotate(0);}}
.combatants-row{display:flex;align-items:center;justify-content:space-around;gap:8px;flex-wrap:wrap;}
.combatant{text-align:center;min-width:95px;flex:1;max-width:130px;}
.combatant-name{color:var(--text-bright);font-weight:600;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.combatant-name.boss{color:var(--neon-pink);}
.hp-bar-outer{background:#1a1a2e;border-radius:7px;height:10px;overflow:hidden;border:1px solid var(--glass-border);margin-top:4px;width:100%;}
.hp-bar-inner{height:100%;border-radius:7px;transition:width 0.4s ease;background:linear-gradient(90deg,#00f0ff,#00c6ff);box-shadow:0 0 8px rgba(0,240,255,0.5);}
.hp-bar-inner.boss-hp{background:linear-gradient(90deg,#ff006e,#ff4b2b);box-shadow:0 0 8px rgba(255,0,110,0.5);}
.hp-text{font-size:10px;color:var(--text-dim);margin-top:2px;}
.vs-badge{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;color:var(--neon-yellow);text-shadow:0 0 12px rgba(255,230,0,0.6);}
.timer-bar-outer{background:#1a1a2e;border-radius:5px;height:9px;overflow:hidden;border:1px solid var(--glass-border);margin-top:8px;}
.timer-bar-inner{height:100%;border-radius:5px;transition:width 0.15s linear;background:linear-gradient(90deg,var(--neon-green),var(--neon-yellow),var(--neon-orange));}
.timer-text{font-size:11px;color:var(--neon-yellow);font-weight:700;text-align:center;margin-top:3px;}
.question-panel{background:rgba(0,0,0,0.5);border-radius:14px;padding:14px;border:1px solid var(--glass-border);margin-bottom:10px;}
.question-display{font-size:20px;font-weight:700;color:var(--text-bright);text-align:center;margin-bottom:10px;line-height:1.5;min-height:30px;word-break:break-word;}
.answer-input-row{display:flex;gap:8px;}
.answer-input{flex:1;padding:12px 14px;font-size:16px;font-weight:600;text-align:center;border-radius:10px;border:2px solid var(--glass-border);background:rgba(0,0,0,0.5);color:var(--text-bright);outline:none;transition:border-color 0.2s,box-shadow 0.2s;font-family:'Kanit',sans-serif;min-width:0;}
.answer-input:focus{border-color:var(--neon-blue);box-shadow:0 0 14px rgba(0,240,255,0.25);}
.answer-input:disabled{opacity:0.6;}
.answer-input.correct-flash{border-color:var(--neon-green)!important;box-shadow:0 0 18px rgba(57,255,20,0.5)!important;background:rgba(57,255,20,0.1)!important;}
.answer-input.wrong-flash{border-color:var(--neon-pink)!important;box-shadow:0 0 18px rgba(255,0,110,0.5)!important;background:rgba(255,0,110,0.1)!important;}
.combo-display{text-align:center;font-weight:700;font-size:15px;margin-top:6px;min-height:20px;color:var(--neon-yellow);text-shadow:0 0 10px rgba(255,230,0,0.5);}
.feedback-msg{font-size:12px;text-align:center;margin-top:4px;min-height:16px;color:var(--text-dim);}
.shop-item{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:border-color 0.2s;}
.gacha-card{background:var(--glass);border:2px solid var(--neon-yellow);border-radius:16px;padding:20px;text-align:center;box-shadow:0 0 25px rgba(255,230,0,0.2);}
.gacha-result{font-size:56px;animation:gachaReveal 0.6s ease-out;line-height:1;}
@keyframes gachaReveal{0%{transform:scale(0) rotate(180deg);opacity:0;}60%{transform:scale(1.3) rotate(-8deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
.pet-card{background:var(--glass);border:2px solid var(--glass-border);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all 0.2s;width:100%;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.pet-card.equipped{border-color:var(--neon-green);background:rgba(57,255,20,0.08);box-shadow:0 0 15px rgba(57,255,20,0.25);}
.pet-emoji{font-size:38px;display:block;line-height:1;}
.numpad-container{flex-shrink:0;background:rgba(10,10,26,0.96);border-top:1px solid var(--glass-border);padding:8px;display:none;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);}
.numpad-container.active{display:block;}
.numpad-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:560px;margin:0 auto;}
.numpad-btn{min-height:52px;padding:8px;font-size:20px;font-weight:700;font-family:'Orbitron','Kanit',sans-serif;border-radius:10px;border:1px solid var(--glass-border);background:rgba(0,240,255,0.08);color:var(--text-bright);cursor:pointer;transition:transform 0.08s,background 0.15s;touch-action:manipulation;user-select:none;}
.numpad-btn:active{transform:scale(0.94);background:rgba(0,240,255,0.25);}
.numpad-btn.op{background:rgba(181,55,242,0.15);color:var(--neon-purple);}
.numpad-btn.submit{background:linear-gradient(135deg,var(--neon-green),#00b09b);color:#0a1a0a;font-size:18px;}
.numpad-btn.back{background:rgba(255,0,110,0.15);color:var(--neon-pink);font-size:18px;}
.float-text{position:fixed;pointer-events:none;font-weight:900;font-family:'Orbitron','Kanit',sans-serif;z-index:500;text-shadow:0 2px 8px rgba(0,0,0,0.9),0 0 12px currentColor;animation:floatUp 1.1s ease-out forwards;font-size:24px;white-space:nowrap;}
.float-text.crit{font-size:34px;}
.float-text.miss{color:#888;font-size:20px;}
.float-text.heal{color:var(--neon-green);}
.float-text.dmg{color:var(--neon-yellow);}
.float-text.critdmg{color:var(--neon-pink);}
.float-text.gold{color:#ffd700;font-size:18px;}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(0.6);opacity:0;}15%{transform:translate(-50%,-10px) scale(1.2);opacity:1;}100%{transform:translate(-50%,-90px) scale(1);opacity:0;}}
.start-overlay{position:fixed;inset:0;z-index:9000;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2a 50%,#0a1a2a 100%);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;transition:opacity 0.4s;}
.start-overlay.hide{opacity:0;pointer-events:none;}
.start-content{max-width:400px;width:100%;background:var(--card-bg);border:2px solid var(--neon-blue);border-radius:24px;padding:32px 24px;box-shadow:0 0 50px rgba(0,240,255,0.3);}
.start-logo{font-family:'Orbitron',sans-serif;font-size:2em;font-weight:900;background:linear-gradient(90deg,var(--neon-blue),var(--neon-green),var(--neon-yellow),var(--neon-pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;margin-bottom:4px;}
.start-sub{color:var(--text-dim);font-size:12px;margin-bottom:20px;}
.start-btn{display:inline-block;min-height:56px;padding:14px 32px;font-size:16px;font-weight:700;border-radius:14px;border:none;background:linear-gradient(135deg,var(--neon-green),var(--neon-blue));color:#0a1a0a;cursor:pointer;font-family:'Kanit',sans-serif;letter-spacing:1.5px;box-shadow:0 0 30px rgba(57,255,20,0.4);animation:pulseGlow 2s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 30px rgba(57,255,20,0.4);}50%{box-shadow:0 0 50px rgba(57,255,20,0.7);}}
.start-features{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--text-dim);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:3000;padding:20px;backdrop-filter:blur(5px);animation:fadeIn 0.25s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-content{background:var(--card-bg);border-radius:20px;padding:22px;max-width:440px;width:100%;border:2px solid var(--neon-blue);box-shadow:0 0 40px rgba(0,240,255,0.28);text-align:center;max-height:85vh;overflow-y:auto;}
.modal-title{font-size:20px;font-weight:700;margin-bottom:10px;}
.modal-body{font-size:14px;color:var(--text-dim);line-height:1.55;margin-bottom:16px;text-align:left;}
.modal-body .step{padding:6px 10px;background:rgba(0,240,255,0.08);border-left:3px solid var(--neon-blue);border-radius:4px;margin:6px 0;color:var(--text-bright);font-size:13px;}
.flex-row{display:flex;gap:8px;flex-wrap:wrap;}
.flex-col{display:flex;flex-direction:column;gap:8px;}
.text-center{text-align:center;}
.text-sm{font-size:11px;}
.mt-1{margin-top:4px;}.mt-2{margin-top:8px;}.mt-3{margin-top:12px;}.mt-4{margin-top:16px;}
.mb-2{margin-bottom:8px;}
.w-full{width:100%;}
.progress-bar{background:#1a1a2e;border-radius:5px;height:5px;overflow:hidden;margin-top:3px;}
.progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--neon-green),var(--neon-blue));transition:width 0.4s;}
h3{font-size:18px;margin-bottom:10px;color:var(--text-bright);}
.calc-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:2500;padding:16px;backdrop-filter:blur(8px);animation:fadeIn 0.2s;}
.calc-panel{background:var(--card-bg);border:2px solid var(--neon-blue);border-radius:18px;padding:16px;max-width:360px;width:100%;box-shadow:0 0 40px rgba(0,240,255,0.35);}
.calc-display{background:rgba(0,0,0,0.75);color:var(--neon-green);font-family:'Orbitron',monospace;font-size:26px;font-weight:700;text-align:right;padding:12px 14px;border-radius:12px;margin-bottom:10px;min-height:56px;word-break:break-all;border:1px solid var(--glass-border);}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.calc-btn{min-height:52px;font-size:19px;font-weight:700;font-family:'Orbitron','Kanit',sans-serif;border:1px solid var(--glass-border);border-radius:10px;background:rgba(0,240,255,0.08);color:var(--text-bright);cursor:pointer;transition:transform 0.08s,background 0.15s;touch-action:manipulation;}
.calc-btn:active{transform:scale(0.94);background:rgba(0,240,255,0.25);}
.calc-btn.op{background:rgba(181,55,242,0.15);color:var(--neon-purple);}
.calc-btn.eq{background:linear-gradient(135deg,var(--neon-green),#00b09b);color:#0a1a0a;grid-column:span 2;}
.calc-btn.span2{grid-column:span 2;}
.calc-actions{display:flex;gap:6px;}
.calc-actions .btn{flex:1;}
.calc-fab{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--neon-green),#00b09b);color:#0a1a0a;border:none;border-radius:10px;padding:6px 10px;font-family:'Kanit',sans-serif;font-weight:700;font-size:11px;cursor:pointer;z-index:10;box-shadow:0 0 12px rgba(57,255,20,0.4);}
.treasure-panel{background:rgba(0,0,0,0.5);border:1px solid var(--glass-border);border-radius:14px;padding:12px;margin-bottom:8px;}
.treasure-target{text-align:center;font-family:'Orbitron',sans-serif;font-size:34px;font-weight:900;color:var(--neon-yellow);text-shadow:0 0 20px rgba(255,230,0,0.6);margin-bottom:8px;letter-spacing:2px;}
.treasure-equation{background:rgba(0,0,0,0.6);border:1px dashed var(--glass-border);border-radius:10px;padding:10px;min-height:48px;text-align:center;font-size:18px;font-weight:700;color:var(--text-bright);margin-bottom:8px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;}
.eq-slot{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 6px;border-radius:6px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);font-family:'Orbitron',sans-serif;font-weight:700;}

.tile.coin{background:linear-gradient(135deg,rgba(255,215,0,0.3),rgba(255,170,0,0.2));border-color:var(--neon-yellow);color:var(--neon-yellow);font-size:19px;}

.pvp-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:1px;}

.chess-puzzle{background:rgba(255,230,0,0.08);border:2px solid var(--neon-yellow);border-radius:12px;padding:12px;margin-bottom:8px;text-align:center;}

.chess-info{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,0.4);border-radius:10px;margin-bottom:8px;font-size:12px;flex-wrap:wrap;gap:6px;}
.lb-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.lb-tab{min-height:44px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim);font-family:'Kanit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.lb-tab.active{background:rgba(0,240,255,0.15);border-color:var(--neon-blue);color:var(--neon-blue);box-shadow:0 0 12px rgba(0,240,255,0.3);}
.stat-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.stat-card .label{font-size:12px;color:var(--text-dim);}
.stat-card .value{font-size:16px;font-weight:700;color:var(--neon-blue);font-family:'Orbitron',sans-serif;}
@media(max-width:480px){.game-content{padding:8px;}.game-header{padding:6px 10px;}.game-title{font-size:1.05em;}.creator-badge{font-size:9px;padding:2px 8px;}.btn{min-height:44px;font-size:13px;padding:8px 14px;}.btn-sm{min-height:40px;font-size:11px;padding:6px 10px;}.numpad-btn{min-height:44px;font-size:17px;padding:4px;}.numpad-grid{gap:4px;}.numpad-container{padding:6px;}.stats-bar{font-size:11px;padding:6px 10px;}.question-display{font-size:17px;}.emoji-display{font-size:42px;}.combatant{min-width:75px;}.badge{font-size:9px;padding:2px 7px;}h3{font-size:16px;}.class-emoji{font-size:32px;}.level-list{grid-template-columns:repeat(5,1fr);padding-left:0;}}

<body>
<canvas id="bgCanvas"></canvas>
<div class="start-overlay" id="startOverlay">
  <div class="start-content">
    <div class="start-logo">MATH QUEST</div>
    <div class="start-sub">พิชิตจักรวาลคณิตศาสตร์ ม.2</div>
    <button class="start-btn" id="startBtn">▶ TAP TO START</button>
    <div class="start-features"><span>10 บท</span><span>6 คลาส</span><span>สัตว์เลี้ยง</span><span>เสียงครบ</span></div>
  </div>
</div>
<div class="app">
  <div class="game-wrapper">
    <div class="game-header">
      <div class="brand-row">
        <span class="creator-badge">⚡ ตะวันสุดหล่อ ⚡</span>
        <button class="sound-toggle" id="soundToggle">🔊</button>
      </div>
      <div class="game-title">MATH QUEST</div>
      <div class="subtitle">ULTIMATE EDITION | ม.2</div>
    </div>
    <div class="game-content" id="gameContent"></div>
    <div class="numpad-container" id="numpadContainer"><div class="numpad-grid" id="numpadGrid"></div></div>
  </div>
</div>
<div id="modalContainer"></div><script>
"use strict";
const BaseClasses = {
  warrior:{ id:'warrior', name:'นักรบ', emoji:'🦸', desc:'DMG+35% HP+20\n⚔️ ฟันดาบ · 🛡️ ตั้งรับ', hp:20, dmg:1.35, crit:0, cmul:3, s1:{ n:'⚔️ ฟันดาบ', cd:3, cost:12, type:'dmg', mul:2 }, s2:{ n:'🛡️ ตั้งรับ', cd:4, cost:10, type:'shield' } },
  mage:{ id:'mage', name:'จอมเวทย์', emoji:'🧙', desc:'CRIT+25% CMUL×4\n🔥 ลูกไฟ · 💚 ฮีล', hp:0, dmg:1, crit:0.25, cmul:4, s1:{ n:'🔥 ลูกไฟ', cd:4, cost:14, type:'gcrit', mul:2.5 }, s2:{ n:'💚 ฮีล', cd:3, cost:12, type:'heal', heal:45 } },
  rogue:{ id:'rogue', name:'โจร', emoji:'🥷', desc:'CRIT+15% คอมโบ1.5×\n🗡️ ลอบ · 💨 หลบ', hp:-8, dmg:1, crit:0.15, cmul:3, comboMul:1.5, s1:{ n:'🗡️ ลอบ', cd:3, cost:13, type:'cboost', mul:3 }, s2:{ n:'💨 หลบ', cd:5, cost:15, type:'dodge' } }
};
const AdvanceClasses = {
  paladin:{ id:'paladin', name:'พาลาดิน', emoji:'🛡️', desc:'HP+60 DMG+25%\n✨ แสง · 🛡️ โล่เทพ', unlock:10, hp:60, dmg:1.25, crit:0.05, cmul:3, s1:{ n:'✨ แสง', cd:3, cost:18, type:'dmgheal', mul:2, heal:30 }, s2:{ n:'🛡️ โล่เทพ', cd:4, cost:16, type:'shieldheal', heal:25 } },
  necromancer:{ id:'necromancer', name:'เนโคร', emoji:'🧟', desc:'CRIT+40% CMUL×6\n👻 วิญญาณ · 💀 ดูดเลือด', unlock:10, hp:-15, dmg:1, crit:0.4, cmul:6, s1:{ n:'👻 วิญญาณ', cd:4, cost:20, type:'gcrit', mul:3.5 }, s2:{ n:'💀 ดูดเลือด', cd:3, cost:18, type:'drain', mul:2, healPct:0.5 } },
  berserker:{ id:'berserker', name:'เบอร์เซิร์ก', emoji:'💢', desc:'DMG+70% HP-20\n💢 คลั่ง · ⚡ สู้ตาย', unlock:10, hp:-20, dmg:1.7, crit:0.1, cmul:3, s1:{ n:'💢 คลั่ง', cd:3, cost:16, type:'dmg', mul:4 }, s2:{ n:'⚡ สู้ตาย', cd:4, cost:12, type:'berserk' } }
};
const Pets = {
  dog:{ id:'dog', name:'สุนัข', emoji:'🐕', cost:100, bonus:'dmg', amt:0.10, desc:'ดาเมจ +10%', shop:true },
  cat:{ id:'cat', name:'แมว', emoji:'🐱', cost:100, bonus:'crit', amt:0.08, desc:'คริ +8%', shop:true },
  fox:{ id:'fox', name:'จิ้งจอก', emoji:'🦊', cost:180, bonus:'combo', amt:0.50, desc:'คอมโบ +50%', shop:true },
  phoenix:{ id:'phoenix', name:'ฟีนิกซ์', emoji:'🦅', cost:300, bonus:'both', amt:0.12, desc:'DMG+12% คริ+12%', shop:true },
  dragon:{ id:'dragon', name:'มังกรน้อย', emoji:'🐉', cost:500, bonus:'all', amt:0.18, desc:'+18% ทุกอย่าง', shop:true },
  unicorn:{ id:'unicorn', name:'ยูนิคอร์น', emoji:'🦄', bonus:'both', amt:0.20, desc:'DMG+20% คริ+20%' },
  phking:{ id:'phking', name:'ราชาฟีนิกซ์', emoji:'🔥', bonus:'all', amt:0.25, desc:'+25% ทุกอย่าง' },
  wolf:{ id:'wolf', name:'หมาป่า', emoji:'🐺', bonus:'dmg', amt:0.30, desc:'ดาเมจ +30%' },
  angel:{ id:'angel', name:'แมวเทวา', emoji:'😇', bonus:'crit', amt:0.22, desc:'คริ +22%' },
  demon:{ id:'demon', name:'จิ้งจอกปีศาจ', emoji:'👹', bonus:'combo', amt:1.20, desc:'คอมโบ +120%' },
  cosmic:{ id:'cosmic', name:'มังกรจักรวาล', emoji:'🌌', bonus:'all', amt:0.35, desc:'+35% ทุกอย่าง' }
};
const GachaPets = ['unicorn','phking','wolf','angel','demon','cosmic'];
const GachaClasses = ['paladin','necromancer','berserker'];

let state = Save.defaultState();
let currentQuest = null;
let battleTimer = null;
let timerLeft = 0, timerMax = 30;
let skillCooldownUntil = { s1:0, s2:0 };
let skillUses = { s1:0, s2:0 };
let skillTickInterval = null;
let activeEffects = {};
let currentScreen = 'menu';
let battleSession = 0;
let battleEnded = false;
let pendingTimeouts = [];
let modalAutoAdvanceId = null;
let isSubmitting = false;

function schedule(fn, ms) {
  const id = setTimeout(() => { pendingTimeouts = pendingTimeouts.filter(t => t !== id); try { fn(); } catch (e) {} }, ms);
  pendingTimeouts.push(id);
  return id;
}
function clearPendingTimeouts() { pendingTimeouts.forEach(t => clearTimeout(t)); pendingTimeouts = []; }
function clearModalAutoAdvance() { if (modalAutoAdvanceId) { clearTimeout(modalAutoAdvanceId); modalAutoAdvanceId = null; } }
function getClass() { return BaseClasses[state.pclass] || AdvanceClasses[state.pclass] || BaseClasses.warrior; }
function getPetBonus() {
  if (!state.epet || !Pets[state.epet]) return { dmg:0, crit:0, combo:0 };
  const p = Pets[state.epet];
  const b = { dmg:0, crit:0, combo:0 };
  if (p.bonus === 'dmg') b.dmg = p.amt;
  else if (p.bonus === 'crit') b.crit = p.amt;
  else if (p.bonus === 'combo') b.combo = p.amt;
  else if (p.bonus === 'both') { b.dmg = p.amt; b.crit = p.amt; }
  else if (p.bonus === 'all') { b.dmg = p.amt; b.crit = p.amt; b.combo = p.amt; }
  return b;
}
function getMaxHp() { return 100 + (getClass().hp || 0) + (state.player.plv-1)*5 + state.inv.s*12 + state.inv.h*5 + state.inv.a*8 + state.inv.p*6 + state.player.rbonus*25; }
function getWeaponMul() { return 1 + state.inv.w * 0.20; }

const $ = id => document.getElementById(id);
const contentEl = $('gameContent');
const numpadContainer = $('numpadContainer');
const numpadGrid = $('numpadGrid');
const modalContainer = $('modalContainer');

function buildNumpad() {
  const keys = [
    { k:'7', t:'7' }, { k:'8', t:'8' }, { k:'9', t:'9' }, { k:'/', t:'÷', cls:'op', insert:'/' }, { k:'√', t:'√', cls:'op', insert:'√' },
    { k:'4', t:'4' }, { k:'5', t:'5' }, { k:'6', t:'6' }, { k:'*', t:'×', cls:'op', insert:'×' }, { k:'^', t:'^', cls:'op', insert:'^' },
    { k:'1', t:'1' }, { k:'2', t:'2' }, { k:'3', t:'3' }, { k:'-', t:'−', cls:'op', insert:'-' }, { k:'+', t:'+', cls:'op', insert:'+' },
    { k:'0', t:'0' }, { k:'.', t:'.', insert:'.' }, { k:',', t:',', cls:'op', insert:',' }, { k:'back', t:'⌫', cls:'back' }, { k:'submit', t:'✓', cls:'submit' }
  ];
  numpadGrid.innerHTML = keys.map(k => `<button class="numpad-btn ${k.cls || ''}" data-key="${k.k}" data-insert="${k.insert || k.k}" aria-label="${k.t}">${k.t}</button>`).join('');
}
buildNumpad();

numpadGrid.addEventListener('click', e => {
  const btn = e.target.closest('.numpad-btn');
  if (!btn || btn.disabled) return;
  const key = btn.dataset.key;
  const insert = btn.dataset.insert || key;
  const inp = $('ansInp');
  if (!inp || inp.disabled) return;
  Audio.resume();
  if (key === 'back') { inp.value = inp.value.slice(0, -1); }
  else if (key === 'submit') { submitAnswer(); return; }
  else { if (inp.value.length < 24) inp.value += insert; }
  Audio.sfx.click();
  updateNumpadSubmitState();
}, { passive:false });

function updateNumpadSubmitState() {
  const inp = $('ansInp');
  if (!inp) return;
  const btn = numpadGrid ? numpadGrid.querySelector('[data-key="submit"]') : null;
  if (!btn) return;
  btn.disabled = !inp.value.trim() || inp.disabled;
}
function showNumpad(show) { numpadContainer.classList.toggle('active', !!show); }
function hideNumpad() { numpadContainer.classList.remove('active'); }

function showModal(title, bodyHTML, buttons) {
  modalContainer.innerHTML = `<div class="modal-overlay"><div class="modal-content"><div class="modal-title">${title}</div><div class="modal-body">${bodyHTML}</div><div class="flex-col">${(buttons || [{ label:'ตกลง', cls:'btn', action:'closeModal()' }]).map(b => `<button class="btn ${b.cls||''} w-full" onclick="${b.action||'closeModal()'}">${b.label}</button>`).join('')}</div></div></div>`;
}
function closeModal() { modalContainer.innerHTML = ''; }

function go(screen) {
  if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
  if (skillTickInterval) { clearInterval(skillTickInterval); skillTickInterval = null; }
  clearPendingTimeouts();
  clearModalAutoAdvance();
  closeModal();
  Audio.stopMusic();
  hideNumpad();
  isSubmitting = false;
  currentScreen = screen;
  if (screen !== 'battle') { battleSession++; battleEnded = false; }
  try {
    switch (screen) {
      case 'menu': renderMenu(); break;
      case 'chapters': renderChapters(); break;
      case 'battle': renderBattle(); break;
      case 'inventory': renderInventory(); break;
      case 'shop': renderShop(); break;
      case 'petshop': renderPetShop(); break;
      case 'gachaPet': renderGacha('pet'); break;
      case 'gachaClass': renderGacha('class'); break;
      case 'upgrade': renderUpgrade(); break;
      case 'class': renderClassSelect(); break;
      case 'rebirth': renderRebirth(); break;
      case 'stats': renderStats(); break;
      case 'settings': renderSettings(); break;
      case 'modes': renderModeMenu(); break;
      case 'treasureSetup': renderTreasureSetup(); break;
      case 'treasure': if (window.treasure) window.renderTreasure(); break;
      default: renderMenu();
    }
  } catch (e) { contentEl.innerHTML = '<div class="text-center" style="padding:30px">เกิดข้อผิดพลาด <button class="btn mt-3" onclick="go(\'menu\')">กลับเมนู</button></div>'; }
  contentEl.scrollTop = 0;
}

function renderMenu() {
  const cd = getClass();
  const petInfo = state.epet && Pets[state.epet] ? Pets[state.epet].emoji + ' ' + Pets[state.epet].name : 'ไม่มี';
  const totalCompleted = Object.values(state.completed).reduce((a, arr) => a + ((arr && arr.length) || 0), 0);
  const wrongCount = (state.wrongLog || []).length;
  contentEl.innerHTML = `
    <div class="text-center mb-2" style="font-size:14px"><b>${cd.emoji} ${cd.name}</b> <span class="badge badge-blue">เกิดใหม่ ${state.player.rebirth}</span></div>
    <div class="stats-bar"><span>⭐ <span class="stat-value">${state.player.score}</span></span><span>🪙 <span class="stat-gold">${state.player.gold}</span></span><span>📊 Lv.<span class="stat-value">${state.player.plv}</span></span><span>🔥 <span class="stat-value">${state.player.maxCombo}</span></span></div>
    <div class="stats-bar"><span>🎯 ${totalCompleted}/50 ด่าน</span><span>👑 ${state.bossKills.length}/10 บอส</span><span>🐾 ${petInfo}</span></div>
    <div class="progress-bar mb-2"><div class="progress-fill" style="width:${(totalCompleted/50)*100}%"></div></div>
    <button class="btn btn-green w-full" onclick="go('chapters')">⚔️ ผจญภัย</button>
    <button class="btn btn-purple w-full mt-2" onclick="go('modes')">🎮 โหมดพิเศษ</button>
    <button class="btn btn-outline w-full mt-2" onclick="go('inventory')">🎒 กระเป๋า</button>
    <button class="btn btn-yellow w-full mt-2" onclick="go('shop')">🛒 ร้านค้า</button>
    <button class="btn btn-outline w-full mt-2" onclick="go('petshop')">🐾 ร้านสัตว์เลี้ยง</button>
    <button class="btn btn-gold w-full mt-2" onclick="go('gachaPet')">🎰 กาชาสัตว์เลี้ยง (200🪙)</button>
    <button class="btn btn-pink w-full mt-2" onclick="go('gachaClass')">💎 กาชาคลาส (500🪙)</button>
    <button class="btn btn-outline w-full mt-2" onclick="go('upgrade')">🔧 อัพเกรดอุปกรณ์</button>
    <button class="btn btn-outline w-full mt-2" onclick="go('class')">🔄 เปลี่ยนคลาส</button>
    <button class="btn btn-outline w-full mt-2" onclick="go('stats')">📈 สถิติการเรียน (ผิด:${wrongCount})</button>
    <button class="btn btn-red w-full mt-2" onclick="go('rebirth')">💀 เกิดใหม่</button>
    <button class="btn btn-outline w-full mt-2" onclick="go('settings')">⚙️ ตั้งค่า</button>
  `;
}

function renderChapters() {
  let h = '<h3>⚔️ แผนที่การเรียนรู้</h3>';
  Chapters.forEach(ch => {
    const done = (state.completed[ch.id] || []).length;
    h += `<div class="chapter-container"><div class="chapter-header" onclick="toggleChapter(${ch.id})"><div class="chapter-icon" style="border-color:${ch.color};color:${ch.color}">${ch.icon}</div><div class="chapter-info"><div class="chapter-name">บทที่ ${ch.id}: ${ch.name}</div><div class="chapter-progress">${done}/5 ด่าน · บอส ${ch.boss}</div><div class="progress-bar"><div class="progress-fill" style="width:${(done/5)*100}%"></div></div></div></div><div class="level-list" id="ch-${ch.id}" style="display:none">${[1,2,3,4,5].map(l => { const c = isCompleted(ch.id, l); return `<button class="level-btn ${c?'completed':''}" onclick="event.stopPropagation();startBattle(${ch.id},${l})">ด.${l}${l===5?'👑':''}</button>`; }).join('')}</div></div>`;
  });
  h += '<button class="btn btn-outline w-full mt-3" onclick="go(\'menu\')">🔙 กลับ</button>';
  contentEl.innerHTML = h;
}
function toggleChapter(id) { const el = $('ch-' + id); if (el) el.style.display = el.style.display === 'none' ? 'grid' : 'none'; }
function isCompleted(ch, lv) { return (state.completed[ch] || []).includes(lv); }

function renderBattle() {
  const cd = getClass();
  const ch = Chapters.find(c => c.id === state.player.ch) || Chapters[0];
  const bossEmoji = state.player.lv === 5 ? ch.boss : '👾';
  const petEmoji = state.epet && Pets[state.epet] ? `<span style="font-size:14px">${Pets[state.epet].emoji}</span>` : '';
  contentEl.innerHTML = `
    <div class="battle-scene" id="battleScene">
      <div class="stats-bar mb-2"><span class="badge badge-blue">${ch.icon} ${ch.name} ด.${state.player.lv}</span><span class="badge badge-red" id="comboBadge">🔥0</span></div>
      <div class="combatants-row">
        <div class="combatant"><div class="emoji-display" id="pEmoji">${cd.emoji}</div><div class="combatant-name">${state.player.name}${petEmoji}</div><div class="hp-bar-outer"><div class="hp-bar-inner" id="pHp" style="width:100%"></div></div><div class="hp-text">❤️ <span id="pHpTxt">0/0</span></div></div>
        <div class="vs-badge">VS</div>
        <div class="combatant"><div class="emoji-display" id="bEmoji">${bossEmoji}</div><div class="combatant-name boss">บอส Lv.${state.player.lv}</div><div class="hp-bar-outer"><div class="hp-bar-inner boss-hp" id="bHp" style="width:100%"></div></div><div class="hp-text">❤️ <span id="bHpTxt">0/0</span></div></div>
      </div>
      <div class="timer-bar-outer"><div class="timer-bar-inner" id="tBar" style="width:100%"></div></div>
      <div class="timer-text" id="tTxt">⏱ 30s</div>
      <button class="calc-fab" id="calcBtn" onclick="openCalculator()">🧮 คิดเลข (5🪙)</button>
    </div>
    <div class="question-panel">
      <div class="question-display" id="qTxt">กำลังสร้างโจทย์...</div>
      <div class="answer-input-row"><input class="answer-input" id="ansInp" placeholder="พิมพ์คำตอบ" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn btn-green" id="subBtn" onclick="submitAnswer()" style="min-width:60px">✓</button></div>
      <div class="combo-display" id="comboDisp"></div>
      <div class="feedback-msg" id="fbMsg"></div>
    </div>
    <div class="flex-row" style="gap:6px"><button class="btn btn-sm btn-yellow" id="btnS1" onclick="useSkill('s1')"></button><button class="btn btn-sm btn-green" id="btnS2" onclick="useSkill('s2')"></button><button class="btn btn-sm btn-red" onclick="skipQuestion()">⏩ ข้าม</button></div>
    ${state.inv.potion > 0 ? `<button class="btn btn-sm btn-outline w-full mt-2" data-item="potion" onclick="useItem('potion')">🧪 โพชั่น (${state.inv.potion})</button>` : ''}
    ${state.inv.sp > 0 ? `<button class="btn btn-sm btn-yellow w-full mt-1" data-item="sp" onclick="useItem('sp')">💜 ซุปเปอร์ (${state.inv.sp})</button>` : ''}
    <button class="btn btn-sm btn-outline w-full mt-2" onclick="fleeBattle()">🏃 หนี</button>
  `;
  setupBattle();
  showNumpad(true);
  Audio.startMusic(state.player.lv === 5 ? 130 : 110);
}

function setupBattle() {
  battleSession++;
  battleEnded = false;
  isSubmitting = false;
  clearPendingTimeouts();
  clearModalAutoAdvance();
  state.player.maxHp = getMaxHp();
  state.player.hp = state.player.maxHp;
  state.player.combo = 0;
  state.player.shield = false;
  skillCooldownUntil = { s1:0, s2:0 };
  skillUses = { s1:0, s2:0 };
  activeEffects = {};
  state.player.bossMaxHp = 150 + state.player.ch * 20 + state.player.lv * 50 + state.player.rebirth * 40;
  state.player.bossHp = state.player.bossMaxHp;
  if (skillTickInterval) { clearInterval(skillTickInterval); skillTickInterval = null; }
  skillTickInterval = setInterval(() => {
    if (currentScreen !== 'battle' || battleEnded) { if (skillTickInterval) { clearInterval(skillTickInterval); skillTickInterval = null; } return; }
    updateSkillButtons();
  }, 400);
  updateBattleUI();
  updateSkillButtons();
  nextQuestion();
  const inp = $('ansInp');
  if (inp) inp.addEventListener('input', updateNumpadSubmitState);
  updateNumpadSubmitState();
}

function updateBattleUI() {
  const pHp = $('pHp'), bHp = $('bHp');
  const pHpTxt = $('pHpTxt'), bHpTxt = $('bHpTxt');
  const comboBadge = $('comboBadge');
  if (!pHp) return;
  pHp.style.width = Math.max(0, (state.player.hp / state.player.maxHp) * 100) + '%';
  bHp.style.width = Math.max(0, (state.player.bossHp / state.player.bossMaxHp) * 100) + '%';
  pHpTxt.textContent = `${Math.max(0, Math.round(state.player.hp))}/${state.player.maxHp}`;
  bHpTxt.textContent = `${Math.max(0, Math.round(state.player.bossHp))}/${state.player.bossMaxHp}`;
  comboBadge.textContent = `🔥${state.player.combo}`;
}

function updateSkillButtons() {
  const cd = getClass();
  const b1 = $('btnS1'), b2 = $('btnS2');
  if (!b1 || !b2) return;
  const now = Date.now();
  const rem1 = Math.max(0, Math.ceil((skillCooldownUntil.s1 - now) / 1000));
  const rem2 = Math.max(0, Math.ceil((skillCooldownUntil.s2 - now) / 1000));
  const info1 = rem1 > 0 ? ` ⏳${rem1}s` : ` (${cd.s1.cost}🪙)`;
  const info2 = rem2 > 0 ? ` ⏳${rem2}s` : ` (${cd.s2.cost}🪙)`;
  b1.innerHTML = `${cd.s1.n}${info1} <span id="s1cnt">${3-skillUses.s1}</span>`;
  b2.innerHTML = `${cd.s2.n}${info2} <span id="s2cnt">${3-skillUses.s2}</span>`;
  b1.disabled = rem1 > 0 || state.player.gold < cd.s1.cost || skillUses.s1 >= 3;
  b2.disabled = rem2 > 0 || state.player.gold < cd.s2.cost || skillUses.s2 >= 3;
}

function startTimer() {
  if (battleTimer) clearInterval(battleTimer);
  const sessionAtStart = battleSession;
  const timerTable = { 1:60, 2:55, 3:50, 4:45, 5:40 };
  timerMax = timerTable[state.player.lv] || 60;
  timerLeft = timerMax;
  const bar = $('tBar'), txt = $('tTxt');
  if (bar) bar.style.width = '100%';
  if (txt) txt.textContent = `⏱ ${timerMax}s`;
  battleTimer = setInterval(() => {
    if (sessionAtStart !== battleSession || battleEnded) { clearInterval(battleTimer); battleTimer = null; return; }
    timerLeft--;
    const pct = Math.max(0, (timerLeft / timerMax) * 100);
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = `⏱ ${Math.max(0, timerLeft)}s`;
    if (timerLeft <= 5 && timerLeft > 0) Audio.sfx.tick_low();
    if (timerLeft <= 0) { clearInterval(battleTimer); battleTimer = null; timeUp(); }
  }, 1000);
}

function timeUp() {
  if (battleEnded) return;
  const inp = $('ansInp'), sb = $('subBtn');
  if (inp) inp.disabled = true;
  if (sb) sb.disabled = true;
  handleWrong(true);
}

function nextQuestion() {
  if (battleEnded || currentScreen !== 'battle') return;
  if (state.player.bossHp <= 0 || state.player.hp <= 0) { endBattle(); return; }
  isSubmitting = false;
  currentQuest = generateQuestion(state.player.ch, state.player.lv);
  const qEl = $('qTxt');
  if (qEl) qEl.textContent = currentQuest.q;
  const inp = $('ansInp');
  if (inp) { inp.value = ''; inp.disabled = false; inp.className = 'answer-input'; try { inp.focus(); } catch(e){} }
  const sb = $('subBtn');
  if (sb) sb.disabled = false;
  const fb = $('fbMsg');
  if (fb) { fb.textContent = ''; fb.style.color = 'var(--text-dim)'; }
  const cd = $('comboDisp');
  if (cd) cd.textContent = '';
  updateSkillButtons();
  updateNumpadSubmitState();
  startTimer();
}

function submitAnswer() {
  if (isSubmitting || battleEnded) return;
  if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
  const inp = $('ansInp');
  if (!inp || !currentQuest) return;
  if (inp.disabled) return;
  const ua = inp.value.trim();
  if (!ua) return;
  isSubmitting = true;
  inp.disabled = true;
  const sb = $('subBtn');
  if (sb) sb.disabled = true;
  updateNumpadSubmitState();
  const correct = answersMatch(ua, currentQuest.a);
  if (correct) {
    inp.classList.add('correct-flash');
    setTimeout(() => { try { inp.classList.remove('correct-flash'); } catch(e){} }, 500);
    handleCorrect();
  } else {
    inp.classList.add('wrong-flash');
    setTimeout(() => { try { inp.classList.remove('wrong-flash'); } catch(e){} }, 500);
    handleWrong(false);
  }
}

function handleCorrect() {
  if (battleEnded || currentScreen !== 'battle') return;
  Audio.sfx.correct();
  state.player.combo++;
  if (state.player.combo > state.player.maxCombo) state.player.maxCombo = state.player.combo;
  state.player.tc++;
  const ch = state.player.ch;
  if (!state.stats[ch]) state.stats[ch] = { correct:0, wrong:0 };
  state.stats[ch].correct++;
  if (state.player.combo === 5 || state.player.combo === 10 || state.player.combo === 20) {
    schedule(() => Audio.sfx.comboMilestone(), 250);
    floatText(window.innerWidth/2, window.innerHeight*0.25, `🔥 COMBO x${state.player.combo}!`, 'critdmg');
  }
  const cd = getClass();
  const pb = getPetBonus();
  let baseDmg = 20 + state.player.combo * 5;
  let dmg = Math.round(baseDmg * (cd.dmg || 1) * getWeaponMul() * (1 + pb.dmg));
  if (state.player.combo >= 5 && cd.comboMul) dmg = Math.round(dmg * cd.comboMul);
  if (state.player.combo >= 5 && pb.combo) dmg = Math.round(dmg * (1 + pb.combo));
  const critChance = 0.06 + (cd.crit || 0) + pb.crit + (state.inv.orb ? 0.20 : 0);
  let isCrit = Math.random() < critChance;
  if (activeEffects.gcrit) { isCrit = true; activeEffects.gcrit = false; }
  if (activeEffects.berserk) { dmg = Math.round(dmg * 2); }
  if (isCrit) {
    dmg = Math.round(dmg * (cd.cmul || 3));
    Audio.sfx.crit();
    const bE = $('bEmoji');
    if (bE) { bE.classList.add('crit'); schedule(() => bE.classList.remove('crit'), 500); }
    screenShake();
  } else {
    const bE = $('bEmoji');
    if (bE) { bE.classList.add('hit'); schedule(() => bE.classList.remove('hit'), 400); }
  }
  state.player.bossHp = Math.max(0, state.player.bossHp - dmg);
  const gold = Math.round(12 + state.player.combo * 3 + state.player.lv * 3 + (isCrit ? 5 : 0));
  state.player.gold += gold;
  state.player.score += Math.round(30 + state.player.combo * 5);
  const bx = window.innerWidth / 2 + 80;
  const by = window.innerHeight * 0.35;
  if (isCrit) {
    floatText(bx, by, `💥 ${dmg}`, 'critdmg');
    Particles.burst(bx, by, { count: 30, speed: 6, colors: ['#ff006e','#ffe600','#ff8c00'] });
  } else {
    floatText(bx, by, `-${dmg}`, 'dmg');
    Particles.burst(bx, by, { count: 14, speed: 4, colors: ['#ffe600','#00f0ff'] });
  }
  floatText(bx, by + 30, `+${gold}🪙`, 'gold');
  Audio.sfx.gold();
  if (state.player.combo >= 3) Audio.sfx.combo(state.player.combo);
  const fb = $('fbMsg');
  if (fb) { fb.textContent = `✅ ถูก! DMG ${dmg}${isCrit?' 💥CRIT!':''} · +${gold}🪙`; fb.style.color = 'var(--neon-green)'; }
  if (state.player.combo >= 3) { const cd2 = $('comboDisp'); if (cd2) cd2.textContent = `🔥 COMBO x${state.player.combo}!`; }
  updateBattleUI();
  Save.write(state);
  if (state.player.bossHp <= 0) { schedule(() => endBattle(), 700); }
  else { schedule(() => { if (battleEnded || currentScreen !== 'battle') return; nextQuestion(); }, 850); }
}

function handleWrong(timeUp) {
  if (battleEnded || currentScreen !== 'battle') return;
  Audio.sfx.wrong();
  state.player.combo = 0;
  state.player.tw++;
  const ch = state.player.ch;
  if (!state.stats[ch]) state.stats[ch] = { correct:0, wrong:0 };
  state.stats[ch].wrong++;
  if (!state.wrongLog) state.wrongLog = [];
  const inpNow = $('ansInp');
  state.wrongLog.unshift({ ch, lv: state.player.lv, q: currentQuest ? currentQuest.q : '', correct: currentQuest ? String(currentQuest.a) : '?', hint: currentQuest ? (currentQuest.h || '') : '', user: timeUp ? '(หมดเวลา)' : ((inpNow && inpNow.value) || '(ว่าง)'), time: Date.now() });
  if (state.wrongLog.length > 50) state.wrongLog.length = 50;
  let dmg = 8 + state.player.lv * 2 + (timeUp ? 6 : 0);
  let blocked = false;
  if (activeEffects.dodge) { activeEffects.dodge = false; dmg = 0; blocked = true; const fb = $('fbMsg'); if (fb) { fb.textContent = '💨 หลบได้!'; fb.style.color = 'var(--neon-blue)'; } }
  else if (state.player.shield) {
    state.player.shield = false;
    if (activeEffects.reflect) { activeEffects.reflect = false; state.player.bossHp = Math.max(0, state.player.bossHp - 25); const fb = $('fbMsg'); if (fb) { fb.textContent = '🛡️ สะท้อน 25!'; fb.style.color = 'var(--neon-blue)'; } blocked = true; dmg = 0; }
    else { dmg = 0; blocked = true; const fb = $('fbMsg'); if (fb) { fb.textContent = '🛡️ ป้องกันได้!'; fb.style.color = 'var(--neon-blue)'; } }
  } else if (state.inv.sh > 0 && Math.random() < state.inv.sh * 0.025) { dmg = 0; blocked = true; const fb = $('fbMsg'); if (fb) { fb.textContent = '👟 หลบด้วยรองเท้า!'; fb.style.color = 'var(--neon-blue)'; } }
  if (!blocked) {
    state.player.hp = Math.max(0, state.player.hp - dmg);
    Audio.sfx.hit();
    const pE = $('pEmoji');
    if (pE) { pE.classList.add('hit'); schedule(() => pE.classList.remove('hit'), 400); }
    screenShake();
    Particles.burst(window.innerWidth/2 - 80, window.innerHeight * 0.35, { count: 12, speed: 3, colors: ['#ff006e','#ff4b2b'] });
    const fb = $('fbMsg');
    if (fb) { fb.textContent = `❌ ผิด!${timeUp?' ⏱ หมดเวลา':''} เฉลย: ${currentQuest.a} · -${dmg} HP`; fb.style.color = 'var(--neon-pink)'; }
  }
  const cb = $('comboBadge'); if (cb) cb.textContent = '🔥0';
  const cdsp = $('comboDisp'); if (cdsp) cdsp.textContent = '';
  updateBattleUI();
  Save.write(state);
  if (state.player.hp <= 0) { schedule(() => endBattle(), blocked ? 700 : 900); return; }
  if (currentQuest && currentQuest.h) {
    schedule(() => {
      if (battleEnded || currentScreen !== 'battle') return;
      showModal('📖 วิธีทำ', `<div>${currentQuest.q}</div><div class="step">${currentQuest.h}</div><div class="step">คำตอบ: <b style="color:var(--neon-green)">${currentQuest.a}</b></div>`, [{ label:'เข้าใจแล้ว ▶', cls:'btn-green', action:'modalNextQuestion()' }]);
      clearModalAutoAdvance();
      modalAutoAdvanceId = setTimeout(() => { if (modalContainer.innerHTML) modalNextQuestion(); }, 7000);
    }, 400);
  } else {
    schedule(() => { if (battleEnded || currentScreen !== 'battle') return; nextQuestion(); }, blocked ? 900 : 1400);
  }
}

function modalNextQuestion() {
  clearModalAutoAdvance();
  closeModal();
  if (battleEnded || currentScreen !== 'battle') return;
  if (state.player.hp <= 0) endBattle();
  else nextQuestion();
}

function useSkill(slot) {
  if (battleEnded || currentScreen !== 'battle') return;
  const cd = getClass();
  const skill = cd[slot];
  if (!skill) return;
  const now = Date.now();
  if (skillCooldownUntil[slot] > now || skillUses[slot] >= 3) return;
  if (state.player.gold < skill.cost) { Audio.sfx.buttonError(); floatText(window.innerWidth/2, window.innerHeight*0.5, 'เหรียญไม่พอ!', 'miss'); return; }
  state.player.gold -= skill.cost;
  skillCooldownUntil[slot] = now + 5000;
  skillUses[slot]++;
  Audio.sfx.click();
  Audio.sfx.skillCast();
  if (skill.type === 'shield' || skill.type === 'shieldheal') Audio.sfx.shield();
  if (skill.type === 'dodge') Audio.sfx.dodge();
  if (skill.type === 'heal' || skill.type === 'dmgheal') Audio.sfx.heal();
  switch (skill.type) {

    '<div class="stat-card"><div><div style="font-weight:700">🧮 A-Math</div><div class="label">Solo: ' + (d.amath.solo || 0) + ' · PvP: ' + (d.amath.pvp || 0) + '</div></div></div>' +
    '<div class="stat-card"><div><div style="font-weight:700">♟️ Math Chess</div><div class="label">Solo: ' + (d.chess.solo || 0) + ' · PvP: ' + (d.chess.pvp || 0) + '</div></div></div>' +
    '<button class="btn btn-red w-full mt-3" onclick="clearSpecialStats()">🗑️ ล้างสถิติ</button>' +
    '<button class="btn btn-outline w-full mt-2" onclick="go(\'menu\')">🔙 กลับ</button>';
  contentEl.scrollTop = 0;
}
function clearSpecialStats() {
  if (!confirm('ล้างสถิติ?')) return;
  try { localStorage.removeItem('mq_special_v1'); } catch (e) {}
  renderSpecialStats();
}

function bootGame() {
  const loaded = Save.load();
  if (loaded) {
    state = loaded;
    if (!state.wrongLog) state.wrongLog = [];
  }
  state.player.maxHp = getMaxHp();
  if (state.player.hp > state.player.maxHp) state.player.hp = state.player.maxHp;
  Particles.start();
  Audio.init();
  Audio.setEnabled(state.soundOn !== false);
  const sToggle = $('soundToggle');
  sToggle.textContent = state.soundOn !== false ? '🔊' : '🔇';
  sToggle.addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    Audio.setEnabled(state.soundOn);
    if (state.soundOn) { Audio.resume(); Audio.sfx.click(); }
    sToggle.textContent = state.soundOn ? '🔊' : '🔇';
    Save.write(state);
  });
  setInterval(() => Save.write(state), 15000);
  const overlay = $('startOverlay');
  const startBtn = $('startBtn');
  startBtn.addEventListener('click', () => {
    try { Audio.resume(); Audio.init(); Audio.sfx.win(); } catch (e) {}
    Particles.burst(window.innerWidth/2, window.innerHeight/2, { count: 50, speed: 7, colors: ['#00f0ff','#39ff14','#ffe600','#ff006e','#b537f2'] });
    overlay.classList.add('hide');
    setTimeout(() => { try { overlay.remove(); } catch (e) {} }, 500);
    setTimeout(() => { if (currentScreen === 'menu' && state.soundOn) Audio.startMusic(100); }, 300);
    go('menu');
  });
  document.addEventListener('keydown', e => {
    const inp = $('ansInp');
    if (inp && !inp.disabled && document.activeElement === inp) {
      if (e.key === 'Enter') { e.preventDefault(); submitAnswer(); }
    }
    if (e.key === 'Escape' && modalContainer.innerHTML) {
      if (currentScreen === 'battle' && currentQuest && currentQuest.h) modalNextQuestion();
      else closeModal();
    }
  });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      if (e.target.closest('button, .btn, input, .numpad-btn')) e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive:false });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) Audio.stopMusic();
    else {
      Audio.resume();
      if (currentScreen === 'menu' && state.soundOn) Audio.startMusic(100);
    }
  });
  window.addEventListener('beforeunload', () => { try { Save.write(state); } catch (e) {} });
}
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.numpad-btn, .btn, .level-btn, .pet-card, .class-card, .amath-tile, .chess-cell, .op-btn, .tile')) e.preventDefault();
});
bootGame();
</script>
</body>
</html>
