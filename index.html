<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Math Quest v10 — Ultimate Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --nb:#00f0ff;--np:#ff006e;--nu:#b537f2;--ng:#39ff14;--ny:#ffe600;
  --bg:#0a0a1a;--cb:rgba(15,15,35,0.92);
  --g:rgba(255,255,255,0.06);--gb:rgba(255,255,255,0.14);
  --tb:#fff;--td:#b0b0d0;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(0.34,1.56,0.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Kanit',sans-serif;background:var(--bg);color:var(--tb);
  min-height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* MESH BACKGROUND */
body::before{content:'';position:fixed;inset:-50%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 30%,rgba(0,240,255,0.18) 0%,transparent 40%),
    radial-gradient(circle at 80% 20%,rgba(255,0,110,0.15) 0%,transparent 40%),
    radial-gradient(circle at 50% 80%,rgba(181,55,242,0.15) 0%,transparent 45%),
    radial-gradient(circle at 90% 90%,rgba(57,255,20,0.10) 0%,transparent 40%);
  animation:mesh 24s ease-in-out infinite alternate;will-change:transform;}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,240,255,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,0.035) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);}
@keyframes mesh{0%{transform:rotate(0) scale(1);}50%{transform:rotate(8deg) scale(1.08);}100%{transform:rotate(-6deg) scale(1.05);}}

/* ORBS */
#orbLayer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.35;will-change:transform;}
.orb1{width:220px;height:220px;top:-60px;left:-60px;background:radial-gradient(circle,#00f0ff,transparent 70%);animation:of1 22s ease-in-out infinite;}
.orb2{width:260px;height:260px;bottom:-80px;right:-80px;background:radial-gradient(circle,#ff006e,transparent 70%);animation:of2 28s ease-in-out infinite;}
.orb3{width:180px;height:180px;top:40%;right:-60px;opacity:0.25;background:radial-gradient(circle,#b537f2,transparent 70%);animation:of3 25s ease-in-out infinite;}
@keyframes of1{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(80px,40px) scale(1.15);}66%{transform:translate(40px,120px) scale(0.9);}}
@keyframes of2{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(-100px,-60px) scale(1.1);}66%{transform:translate(-40px,-140px) scale(0.95);}}
@keyframes of3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-60px,80px) scale(1.2);}}

/* APP */
.app{position:relative;z-index:2;display:flex;flex-direction:column;height:100dvh;padding-top:var(--st);}
.gw{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(15,15,35,0.82),rgba(10,10,26,0.94));
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08),inset 0 0 40px rgba(0,240,255,0.04),0 20px 60px rgba(0,0,0,0.5);}

/* HEADER */
.gh{padding:10px 16px 12px;background:linear-gradient(180deg,rgba(0,240,255,0.08),transparent);
  border-bottom:1px solid var(--gb);flex-shrink:0;position:relative;}
.gh::after{content:'';position:absolute;bottom:-1px;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--nb),transparent);
  box-shadow:0 0 12px var(--nb);opacity:0.6;animation:dp 3s ease-in-out infinite;}
@keyframes dp{0%,100%{opacity:0.35;}50%{opacity:0.85;}}
.br{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cb{display:inline-block;background:rgba(255,0,110,0.18);border:1px solid var(--np);
  padding:4px 12px;border-radius:12px;font-size:10px;font-weight:700;color:var(--np);letter-spacing:1.5px;}
.stg{background:rgba(255,255,255,0.05);border:1px solid var(--gb);color:var(--tb);
  width:40px;height:40px;border-radius:12px;font-size:18px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform 0.12s var(--ease);}
.stg:active{transform:scale(0.9);}
.gt{font-family:'Orbitron',sans-serif;font-size:1.4em;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np));
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;line-height:1.15;margin-top:2px;text-align:center;
  filter:drop-shadow(0 0 20px rgba(0,240,255,0.4));animation:ts 4s linear infinite;}
@keyframes ts{0%{background-position:0% center;}100%{background-position:200% center;}}
.sb{color:var(--td);font-size:9px;letter-spacing:1px;text-align:center;margin-top:4px;}

/* CONTENT */
.gc{padding:14px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding-bottom:calc(85px + var(--sb));}
.gc::-webkit-scrollbar{width:4px;}
.gc::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--nb),var(--nu));border-radius:3px;}
#gameContent>*{animation:cf 0.4s var(--ease) backwards;}
#gameContent>*:nth-child(1){animation-delay:0s;}
#gameContent>*:nth-child(2){animation-delay:0.04s;}
#gameContent>*:nth-child(3){animation-delay:0.08s;}
#gameContent>*:nth-child(n+4){animation-delay:0.12s;}
@keyframes cf{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* BUTTONS */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;padding:10px 18px;font-weight:600;font-size:14px;
  border-radius:12px;color:#fff;background:linear-gradient(135deg,#00c6ff,#0072ff);
  box-shadow:0 4px 15px rgba(0,114,255,0.28),inset 0 1px 0 rgba(255,255,255,0.25);
  transition:transform 0.12s var(--ease),box-shadow 0.25s ease,filter 0.2s ease;
  touch-action:manipulation;}
.btn::before{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.35),transparent);
  transform:skewX(-20deg);animation:bs 3.2s ease-in-out infinite;pointer-events:none;}
@keyframes bs{0%,55%{left:-120%;}75%,100%{left:130%;}}
.btn:active{transform:scale(0.95) translateY(1px);}
.btn:disabled{opacity:0.4;pointer-events:none;filter:grayscale(0.4);}
.btn:disabled::before{display:none;}
.btn-g{background:linear-gradient(135deg,#00b09b,#96c93d);}
.btn-r{background:linear-gradient(135deg,#ff416c,#ff4b2b);}
.btn-y{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e;}
.btn-gold{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;}
.btn-p{background:linear-gradient(135deg,#ff006e,#ff4b8b);}
.btn-pur{background:linear-gradient(135deg,#b537f2,#7b2ff7);}
.btn-o{background:rgba(0,240,255,0.06);border:1.5px solid var(--nb);color:var(--nb);box-shadow:0 0 16px rgba(0,240,255,0.15);}
.btn-o::before{display:none;}
.btn-sm{min-height:42px;padding:8px 14px;font-size:12px;border-radius:10px;}
.btn-xs{min-height:36px;padding:5px 10px;font-size:11px;border-radius:8px;}

/* SURFACES */
.si,.ccard,.pcard,.mcard,.sbar,.qp,.bts,.tp,.hero-card{
  position:relative;
  background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02)),rgba(10,10,26,0.4);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.10),inset 0 -1px 0 rgba(0,0,0,0.2),0 4px 16px rgba(0,0,0,0.25);
  transition:transform 0.2s var(--ease),box-shadow 0.3s ease;}
.si{border:1px solid var(--gb);border-radius:12px;padding:14px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;}
.si.col{flex-direction:column;align-items:stretch;}
.hero-card{border:1.5px solid rgba(0,240,255,0.4);border-radius:20px;padding:20px 18px;
  margin-bottom:14px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 0 30px rgba(0,240,255,0.15);}

/* BADGES */
.bdg{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),0 0 8px currentColor;text-shadow:0 0 8px currentColor;}
.bdg-gold{background:rgba(255,230,0,0.15);color:var(--ny);border:1px solid rgba(255,230,0,0.4);}
.bdg-g{background:rgba(57,255,20,0.15);color:var(--ng);border:1px solid rgba(57,255,20,0.4);}
.bdg-b{background:rgba(0,240,255,0.15);color:var(--nb);border:1px solid rgba(0,240,255,0.4);}
.bdg-r{background:rgba(255,0,110,0.15);color:var(--np);border:1px solid rgba(255,0,110,0.4);}
.bdg-p{background:rgba(181,55,242,0.15);color:var(--nu);border:1px solid rgba(181,55,242,0.4);}

/* STAT BAR */
.sbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  padding:10px 14px;border:1px solid var(--gb);border-radius:12px;margin-bottom:10px;font-size:13px;}
.sv{font-weight:700;color:var(--nb);margin-left:4px;}
.sg{font-weight:700;color:var(--ny);margin-left:4px;}

/* PROGRESS */
.pb{background:rgba(0,0,0,0.45);border-radius:5px;height:6px;overflow:hidden;margin-top:4px;}
.pbf{height:100%;background:linear-gradient(90deg,var(--ng),var(--nb));border-radius:5px;
  box-shadow:0 0 10px rgba(57,255,20,0.6);transition:width 0.4s var(--ease);}

/* GRID */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.mgrid{display:grid;grid-template-columns:1fr;gap:10px;}

/* CARD */
.ccard{border:2px solid var(--gb);border-radius:16px;padding:14px 10px;text-align:center;
  min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.ccard.sel{border-color:var(--ng);background:rgba(57,255,20,0.08);box-shadow:0 0 24px rgba(57,255,20,0.35);}
.ccard.lk{opacity:0.55;}
.cemoji{font-size:40px;line-height:1;}
.cname{font-weight:700;font-size:14px;margin-top:6px;}
.cdesc{font-size:11px;color:var(--td);margin-top:4px;line-height:1.4;}

.mcard{border:1.5px solid var(--gb);border-radius:16px;padding:16px;
  display:flex;gap:14px;align-items:center;cursor:pointer;}
.mcard:active{transform:scale(0.97);}
.mcard .me{font-size:42px;flex-shrink:0;filter:drop-shadow(0 0 12px currentColor);}
.mcard .mi{flex:1;min-width:0;}
.mcard .mn{font-weight:700;font-size:16px;}
.mcard .md{font-size:12px;color:var(--td);margin-top:2px;}

/* NUMPAD */
.npc{flex-shrink:0;background:rgba(10,10,26,0.96);border-top:1px solid var(--gb);
  padding:10px 8px calc(10px + var(--sb));display:none;}
.npc.active{display:block;}
.npg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px;margin:0 auto;}
.npb{min-height:52px;padding:8px;font-size:20px;font-weight:700;
  font-family:'Orbitron','Kanit',sans-serif;border-radius:10px;border:1px solid var(--gb);
  background:rgba(0,240,255,0.08);color:var(--tb);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),inset 0 -2px 0 rgba(0,0,0,0.3);
  transition:transform 0.1s var(--ease),box-shadow 0.2s,background 0.2s;}
.npb:active{transform:scale(0.93);background:rgba(0,240,255,0.28);}
.npb.op{background:rgba(181,55,242,0.15);color:var(--nu);}
.npb.submit{background:linear-gradient(135deg,var(--ng),#00b09b);color:#0a1a0a;font-size:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),0 4px 16px rgba(57,255,20,0.4);}
.npb.back{background:rgba(255,0,110,0.15);color:var(--np);font-size:18px;}

/* TAB BAR */
.tab-bar{display:flex;justify-content:space-around;align-items:center;
  background:linear-gradient(180deg,rgba(10,10,26,0.92),rgba(5,5,15,0.98));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,240,255,0.2);
  box-shadow:0 -8px 30px rgba(0,0,0,0.5);
  padding:8px 0 calc(8px + var(--sb));
  position:absolute;bottom:0;left:0;right:0;z-index:1000;}
.tab{flex:1;padding:4px 0;text-align:center;color:var(--td);
  transition:color 0.2s,transform 0.15s;position:relative;cursor:pointer;}
.tab.active{color:var(--nb);text-shadow:0 0 12px var(--nb);}
.tab.active::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:32px;height:3px;background:var(--nb);border-radius:2px;
  box-shadow:0 0 12px var(--nb);animation:ti 2s ease-in-out infinite;}
@keyframes ti{0%,100%{opacity:0.7;width:32px;}50%{opacity:1;width:44px;}}
.tab .ti{font-size:22px;line-height:1;}
.tab .tt2{font-size:10px;font-weight:600;margin-top:2px;}

/* START OVERLAY */
.so{position:fixed;inset:0;z-index:9000;
  background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2a 50%,#0a1a2a 100%);
  display:flex;align-items:center;justify-content:center;padding:20px;
  transition:opacity 0.4s,transform 0.4s;}
.so.hide{opacity:0;pointer-events:none;transform:scale(1.1);}
.sc{max-width:400px;width:100%;background:var(--cb);border:2px solid var(--nb);
  border-radius:24px;padding:36px 26px;text-align:center;position:relative;
  box-shadow:0 0 80px rgba(0,240,255,0.5),0 0 120px rgba(181,55,242,0.3),
    0 30px 80px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.2);
  animation:scIn 0.8s var(--ease);}
@keyframes scIn{0%{transform:scale(0.6) rotate(-5deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
.slogo{font-family:'Orbitron',sans-serif;font-size:2.1em;font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,var(--nb),var(--ng),var(--ny),var(--np));
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(0,240,255,0.5));
  animation:ts 3s linear infinite;}
.ssub{color:var(--td);font-size:13px;margin:6px 0 24px;letter-spacing:1px;}
.sbtn{display:inline-block;min-height:58px;padding:15px 36px;
  font-size:16px;font-weight:700;letter-spacing:1.5px;border-radius:14px;
  background:linear-gradient(135deg,var(--ng),var(--nb));color:#0a1a0a;
  position:relative;overflow:hidden;
  box-shadow:0 0 40px rgba(57,255,20,0.5),inset 0 2px 0 rgba(255,255,255,0.4);
  animation:sbp 2s ease-in-out infinite;transition:transform 0.12s var(--ease);}
.sbtn:active{transform:scale(0.95);}
@keyframes sbp{0%,100%{box-shadow:0 0 30px rgba(57,255,20,0.4),inset 0 2px 0 rgba(255,255,255,0.4);}
  50%{box-shadow:0 0 60px rgba(57,255,20,0.8),inset 0 2px 0 rgba(255,255,255,0.5);}}
.sf{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  margin-top:22px;font-size:11px;color:var(--td);}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;justify-content:center;align-items:center;z-index:3000;padding:20px;
  animation:mf 0.25s ease;}
.mc{background:var(--cb);border-radius:20px;padding:24px 22px;max-width:440px;width:100%;
  border:2px solid var(--nb);text-align:center;max-height:85vh;overflow-y:auto;
  animation:mp 0.4s var(--ease);
  box-shadow:0 0 60px rgba(0,240,255,0.4),0 20px 60px rgba(0,0,0,0.6);}
.mt{font-size:20px;font-weight:700;margin-bottom:12px;}
.mb{font-size:14px;color:var(--td);line-height:1.55;margin-bottom:18px;text-align:left;}
.fc{display:flex;flex-direction:column;gap:8px;}
@keyframes mf{from{opacity:0;}to{opacity:1;}}
@keyframes mp{0%{transform:scale(0.7) translateY(30px);opacity:0;}100%{transform:scale(1) translateY(0);opacity:1;}}

/* FLOAT TEXT */
.ft{position:fixed;pointer-events:none;font-weight:900;font-family:'Orbitron','Kanit',sans-serif;
  z-index:500;text-shadow:0 2px 8px rgba(0,0,0,0.9),0 0 12px currentColor;
  font-size:24px;white-space:nowrap;animation:fu 1.1s var(--ease) forwards;
  filter:drop-shadow(0 0 8px currentColor);}
.ft.crit{font-size:34px;}
.ft.heal{color:var(--ng);}
.ft.dmg{color:var(--ny);}
.ft.critdmg{color:var(--np);}
.ft.gold{color:#ffd700;font-size:18px;}
@keyframes fu{0%{transform:translate(-50%,0) scale(0.5);opacity:0;}
  20%{transform:translate(-50%,-15px) scale(1.25);opacity:1;}
  100%{transform:translate(-50%,-100px) scale(1);opacity:0;}}

/* BATTLE */
.ed{font-size:54px;display:inline-block;line-height:1;transition:transform 0.3s;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6));}
.ed.hit{animation:eh 0.4s ease;}
.ed.critpop{animation:ec 0.5s ease-out;}
@keyframes eh{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
@keyframes ec{0%{transform:scale(1);}30%{transform:scale(1.5) rotate(-8deg);}60%{transform:scale(1.1) rotate(4deg);}100%{transform:scale(1);}}
.hpo{background:#1a1a2e;border-radius:7px;height:10px;overflow:hidden;border:1px solid var(--gb);
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.5);}
.hpi{height:100%;border-radius:7px;transition:width 0.4s;
  background:linear-gradient(90deg,#00f0ff,#00b8ff);}
.hpi.bh{background:linear-gradient(90deg,#ff006e,#ff4b2b);}
.tbo{background:#1a1a2e;border-radius:5px;height:9px;overflow:hidden;border:1px solid var(--gb);margin-top:8px;}
.tbi{height:100%;border-radius:5px;transition:width 0.15s linear;
  background:linear-gradient(90deg,var(--ng),var(--ny));}
.qd{font-size:20px;font-weight:700;text-align:center;margin-bottom:10px;line-height:1.5;
  min-height:30px;word-break:break-word;}
.ai{flex:1;padding:12px 14px;font-size:16px;font-weight:600;text-align:center;
  border-radius:10px;border:2px solid var(--gb);background:rgba(0,0,0,0.5);color:var(--tb);outline:none;}
.ai.cf{border-color:var(--ng);background:rgba(57,255,20,0.1);box-shadow:0 0 20px rgba(57,255,20,0.6);}
.ai.wf{border-color:var(--np);background:rgba(255,0,110,0.1);box-shadow:0 0 20px rgba(255,0,110,0.6);}

/* MISC */
h3{font-size:18px;margin-bottom:12px;}
.tc{text-align:center;}
.ts{font-size:11px;}
.mt2{margin-top:8px;}
.mt3{margin-top:14px;}
.wf{width:100%;}
.mb2{margin-bottom:8px;}
.tb-shake{animation:eh 0.4s ease;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
  .orb{animation:none !important;}
}
@media (max-width:480px){
  .gc{padding:10px;padding-bottom:calc(85px + var(--sb));}
  .gt{font-size:1.1em;}
  .btn{min-height:44px;font-size:13px;padding:8px 14px;}
  .npb{min-height:44px;font-size:17px;}
  .ed{font-size:42px;}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="orbLayer" aria-hidden="true">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
</div>

<div class="so" id="startOverlay">
  <div class="sc">
    <div class="slogo">MATH QUEST</div>

/* ==================== AUDIO ==================== */
MQ.Audio = (function(){
  let ctx=null, mg=null, bg=null, en=true, mt=null, ms=0;
  function init(){
    if(ctx)return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      mg=ctx.createGain(); mg.gain.value=0.85; mg.connect(ctx.destination);
      bg=ctx.createGain(); bg.gain.value=0.18; bg.connect(mg);
    }catch(e){}
  }
  function resume(){try{if(ctx&&ctx.state==='suspended')ctx.resume();}catch(e){}}
  function tone(f,t,d,v,del,dest){
    if(!ctx||!en)return;
    try{
      const t0=ctx.currentTime+(del||0);
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=t||'sine'; o.frequency.setValueAtTime(f,t0);
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(v||0.06,t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
      o.connect(g); g.connect(dest||mg);
      o.start(t0); o.stop(t0+d+0.02);
    }catch(e){}
  }
  function sweep(f1,f2,t,d,v){
    if(!ctx||!en)return;
    try{
      const t0=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=t||'sine';
      o.frequency.setValueAtTime(f1,t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);
      g.gain.setValueAtTime(v,t0);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
      o.connect(g); g.connect(mg);
      o.start(t0); o.stop(t0+d+0.02);
    }catch(e){}
  }
  function noise(d,v){
    if(!ctx||!en)return;
    try{
      const b=ctx.createBuffer(1,Math.max(1,Math.floor(ctx.sampleRate*d)),ctx.sampleRate);
      const ch=b.getChannelData(0);
      for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
      const s=ctx.createBufferSource(), g=ctx.createGain();
      s.buffer=b; g.gain.value=v;
      s.connect(g); g.connect(mg); s.start();
    }catch(e){}
  }
  const sfx={
    click:()=>tone(600,'sine',0.06,0.08),
    correct:()=>{tone(700,'triangle',0.12,0.10);tone(1050,'triangle',0.14,0.10,0.07);tone(1400,'sine',0.16,0.07,0.14);},
    wrong:()=>{tone(220,'sawtooth',0.16,0.10);tone(150,'sawtooth',0.24,0.10,0.10);},
    crit:()=>{sweep(500,1400,'square',0.16,0.14);tone(1800,'square',0.22,0.11,0.1);noise(0.16,0.06);},
    level:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,'triangle',0.2,0.12,i*0.08)),
    win:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,'triangle',0.22,0.13,i*0.09)),
    lose:()=>[420,340,270,200,150].forEach((f,i)=>tone(f,'sawtooth',0.22,0.10,i*0.1)),
    hit:()=>{noise(0.08,0.08);tone(160,'square',0.08,0.08);},
    heal:()=>{tone(880,'sine',0.14,0.09);tone(1320,'sine',0.2,0.09,0.06);tone(1760,'sine',0.14,0.06,0.14);},
    gold:()=>{tone(1400,'triangle',0.08,0.08);tone(2100,'triangle',0.12,0.08,0.06);},
    combo:(n)=>{const b=500+Math.min((n||1)*90,1100);tone(b,'square',0.1,0.08);tone(b*1.5,'square',0.1,0.06,0.05);},
    skill:()=>{sweep(200,900,'sawtooth',0.2,0.10);tone(1200,'square',0.15,0.08,0.15);},
    shield:()=>{tone(400,'sine',0.2,0.09);tone(600,'sine',0.25,0.08,0.08);},
    err:()=>{tone(300,'square',0.1,0.10);tone(200,'square',0.15,0.09,0.06);},
    tick_low:()=>tone(1800,'square',0.05,0.07)
  };
  const scale=[220,246.94,261.63,293.66,329.63,349.23,392.00,440,493.88];
  const bass=[110,110,164.81,146.83,110,110,98,130.81];
  function startMusic(bpm){
    if(!ctx||!en)return;
    ms=0;
    const stepMs=60000/(bpm||110)/2;
    if(mt)clearInterval(mt);
    mt=setInterval(()=>{
      if(!ctx||!en)return;
      const s=ms%16;
      if(s%2===0){const i=(s/2)%scale.length;tone(scale[(i*3)%scale.length],'square',0.18,0.10,0,bg);}
      if(s%4===0)tone(scale[(s*5)%scale.length],'triangle',0.24,0.08,0,bg);
      if(s%8===2)tone(scale[(s*2+4)%scale.length],'sine',0.2,0.06,0,bg);
      if(s%4===0)tone(bass[(s/4)%bass.length],'triangle',0.42,0.14,0,bg);
      if(s%2===1)noise(0.035,0.020);
      ms++;
    },stepMs);
  }
  function stopMusic(){if(mt)clearInterval(mt);mt=null;}
  function setEnabled(v){en=!!v;if(mg)mg.gain.value=en?0.85:0;}
  return {init,resume,sfx,startMusic,stopMusic,setEnabled,isEnabled:()=>en};
})();

/* ==================== PARTICLES ==================== */
MQ.Particles = (function(){
  const c=document.getElementById('bgCanvas'), cx=c.getContext('2d');
  let W=0,H=0,dpr=1;
  const p=[], st=[];
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    c.width=W*dpr; c.height=H*dpr;
    c.style.width=W+'px'; c.style.height=H+'px';
    cx.setTransform(dpr,0,0,dpr,0,0);
    st.length=0;
    const n=Math.floor(W*H/12000);
    for(let i=0;i<n;i++)st.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,a:Math.random(),da:(Math.random()*0.02+0.005)*(Math.random()<0.5?-1:1)});
  }
  function burst(x,y,o){
    o=o||{};
    const n=o.count||20;
    const co=o.colors||['#00f0ff','#ff006e','#ffe600','#39ff14','#b537f2'];
    for(let i=0;i<n;i++){
      if(p.length>=300)break;
      const an=Math.random()*Math.PI*2, sp=(o.speed||4)*(0.5+Math.random()*0.8);
      p.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:1,decay:0.015+Math.random()*0.02,
        size:2+Math.random()*3,color:co[Math.floor(Math.random()*co.length)],g:0.08});
    }
  }
  function loop(){
    cx.clearRect(0,0,W,H);
    for(const s of st){
      s.a+=s.da; if(s.a<=0||s.a>=1)s.da=-s.da;
      s.a=Math.max(0.05,Math.min(1,s.a));
      cx.beginPath(); cx.fillStyle='rgba(180,220,255,'+(s.a*0.5)+')';
      cx.arc(s.x,s.y,s.r,0,Math.PI*2); cx.fill();
    }
    for(let i=p.length-1;i>=0;i--){
      const q=p[i];
      q.x+=q.vx; q.y+=q.vy; q.vy+=q.g; q.vx*=0.985; q.vy*=0.985; q.life-=q.decay;
      if(q.life<=0){p.splice(i,1);continue;}
      cx.globalAlpha=Math.max(0,q.life);
      const g=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.size*1.8);
      g.addColorStop(0,q.color); g.addColorStop(1,'transparent');
      cx.fillStyle=g; cx.beginPath(); cx.arc(q.x,q.y,q.size*1.8,0,Math.PI*2); cx.fill();
    }
    cx.globalAlpha=1;
    requestAnimationFrame(loop);
  }
  function start(){resize();window.addEventListener('resize',resize,{passive:true});loop();}
  return {start,burst};
})();

MQ.UI = (function(){
  const mc = document.getElementById('modalContainer');
  function modal(title, body, buttons){
    buttons = buttons || [{label:'ตกลง',cls:'btn',action:'MQ.UI.closeModal()'}];
    mc.innerHTML = `<div class="mo"><div class="mc"><div class="mt">${title}</div><div class="mb">${body}</div><div class="fc">${buttons.map(b=>`<button class="btn ${b.cls||''}" onclick="${b.action||'MQ.UI.closeModal()'}">${b.label}</button>`).join('')}</div></div></div>`;
  }
  function closeModal(){mc.innerHTML='';}
  function floatText(x,y,text,cls){
    const el=document.createElement('div');
    el.className='ft '+(cls||'');
    el.textContent=text;
    el.style.left=x+'px'; el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>{try{el.remove();}catch(e){}},1200);
  }
  function floatCenter(text,cls){
    floatText(window.innerWidth/2,window.innerHeight*0.35,text,cls);
  }
  function installRipple(){
    document.addEventListener('pointerdown',e=>{
      const btn=e.target.closest('.btn,.npb,.sbtn,.mcard,.ccard,.stg,.tab');
      if(!btn||btn.disabled)return;
      const r=btn.getBoundingClientRect();
      const size=Math.max(r.width,r.height);
      const ripple=document.createElement('span');
      ripple.style.cssText=[
        'position:absolute','border-radius:50%','pointer-events:none',
        'background:radial-gradient(circle,rgba(255,255,255,0.5),transparent 70%)',
        'width:'+size+'px','height:'+size+'px',
        'left:'+(e.clientX-r.left-size/2)+'px',
        'top:'+(e.clientY-r.top-size/2)+'px',
        'transform:scale(0)','opacity:1',
        'transition:transform 0.55s ease,opacity 0.55s ease'
      ].join(';');
      if(getComputedStyle(btn).position==='static')btn.style.position='relative';
      btn.style.overflow='hidden';
      btn.appendChild(ripple);
      requestAnimationFrame(()=>{ripple.style.transform='scale(2.2)';ripple.style.opacity='0';});
      setTimeout(()=>{try{ripple.remove();}catch(e){}},600);
    },{passive:true});
  }
  function installHaptic(){
    document.addEventListener('pointerdown',e=>{
      if(!MQ.State.data||!MQ.State.data.settings.haptic)return;
      const btn=e.target.closest('.btn,.npb,.sbtn');
      if(!btn||btn.disabled)return;
      if(navigator.vibrate)try{navigator.vibrate(6);}catch(err){}
    },{passive:true});
  }
  return {modal,closeModal,floatText,floatCenter,installRipple,installHaptic};
})();

MQ.Router = (function(){

MQ.Numpad = (function(){
  const container=document.getElementById('numpadContainer');
  const grid=document.getElementById('numpadGrid');
  let targetInput=null;
  const KEYS=[
    {k:'7',t:'7'},{k:'8',t:'8'},{k:'9',t:'9'},{k:'/',t:'÷',cls:'op',ins:'/'},{k:'√',t:'√',cls:'op',ins:'√'},
    {k:'4',t:'4'},{k:'5',t:'5'},{k:'6',t:'6'},{k:'*',t:'×',cls:'op',ins:'×'},{k:'^',t:'^',cls:'op',ins:'^'},
    {k:'1',t:'1'},{k:'2',t:'2'},{k:'3',t:'3'},{k:'-',t:'−',cls:'op',ins:'-'},{k:'+',t:'+',cls:'op',ins:'+'},
    {k:'0',t:'0'},{k:'.',t:'.',ins:'.'},{k:',',t:',',cls:'op',ins:','},{k:'back',t:'⌫',cls:'back'},{k:'submit',t:'✓',cls:'submit'}
  ];
  function build(){
    grid.innerHTML=KEYS.map(k=>`<button class="npb ${k.cls||''}" data-key="${k.k}" data-ins="${k.ins||k.k}">${k.t}</button>`).join('');
  }
  function updateSubmit(){
    const btn=grid.querySelector('[data-key="submit"]');
    if(!btn)return;
    btn.disabled=!targetInput||!targetInput.value.trim()||targetInput.disabled;
  }
  function show(inputEl){
    targetInput=inputEl||null;
    container.classList.add('active');
    if(inputEl){
      if(!inputEl._npBound){
        inputEl._npBound=true;
        inputEl.addEventListener('input',updateSubmit);
        inputEl.addEventListener('keydown',e=>{
          if(e.key==='Enter'){e.preventDefault();if(MQ.Numpad.onSubmit)MQ.Numpad.onSubmit();}
        });
      }
    }
    updateSubmit();
  }
  function hide(){container.classList.remove('active');targetInput=null;}
  function init(){
    build();
    grid.addEventListener('click',e=>{
      const b=e.target.closest('.npb');
      if(!b||b.disabled)return;
      MQ.Audio.resume();
      const key=b.dataset.key, ins=b.dataset.ins;
      if(key==='submit'){if(MQ.Numpad.onSubmit)MQ.Numpad.onSubmit();MQ.Audio.sfx.click();return;}
      if(!targetInput||targetInput.disabled)return;
      if(key==='back')targetInput.value=targetInput.value.slice(0,-1);
      else if(targetInput.value.length<24)targetInput.value+=ins;
      MQ.Audio.sfx.click();
      updateSubmit();
    });
  }
  return {init,show,hide,updateSubmit,onSubmit:null};
})();

/* ==================== ANSWER CHECKER ==================== */
MQ.Checker = (function(){
  function frac(s){const m=String(s).replace(/\s+/g,'').match(/^(-?\d+)\/(-?\d+)$/);if(m&&parseFloat(m[2])!==0)return parseFloat(m[1])/parseFloat(m[2]);return null;}
  function sqrt(s){
    const m=String(s).replace(/\s+/g,'').match(/^(-?\d*)√(\d+)$/);
    if(!m)return null;
    let c; if(m[1]===''||m[1]==='+')c=1; else if(m[1]==='-')c=-1; else c=parseFloat(m[1]);
    if(isNaN(c))return null;
    const r=parseFloat(m[2]);
    return isNaN(r)?null:c*Math.sqrt(r);
  }
  function ev(expr){
    if(!expr)return null;
    const js=String(expr).replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/−/g,'-');
    if(/[√,]/.test(js))return null;
    if(!/^[\d\s+\-*/.()]+$/.test(js))return null;
    if(!/\d/.test(js))return null;
    try{const r=Function('"use strict";return ('+js+')')();return (typeof r==='number'&&isFinite(r))?r:null;}
    catch(e){return null;}
  }
  function match(user,correct){
    if(user==null)return false;
    const u=String(user).trim().replace(/\s+/g,'');
    const c=String(correct).trim().replace(/\s+/g,'');
    if(!u)return false;
    if(u.toLowerCase()===c.toLowerCase())return true;
    const T=0.011;
    const un=parseFloat(u), cn=parseFloat(c);
    if(!isNaN(un)&&!isNaN(cn)&&Math.abs(un-cn)<=T)return true;
    const uf=frac(u), cf=frac(c);
    if(uf!==null&&cf!==null&&Math.abs(uf-cf)<=T)return true;
    if(uf!==null&&!isNaN(cn)&&Math.abs(uf-cn)<=T)return true;
    if(cf!==null&&!isNaN(un)&&Math.abs(cf-un)<=T)return true;
    const us=sqrt(u), cs=sqrt(c);
    if(us!==null&&cs!==null&&Math.abs(us-cs)<=T)return true;
    if(us!==null&&!isNaN(cn)&&Math.abs(us-cn)<=T)return true;
    if(cs!==null&&!isNaN(un)&&Math.abs(cs-un)<=T)return true;
    const ue=ev(u), ce=ev(c);
    if(ue!==null&&ce!==null&&Math.abs(ue-ce)<=T)return true;
    return false;
  }
  return {match};
})();

/* ==================== CHAR SYSTEM ==================== */
const Char = MQ.Char = (function(){
  const st = () => MQ.State.data;

  function getClass(){
    const id = st().character.class;
    return Content.BaseClasses[id] || Content.AdvanceClasses[id] || Content.BaseClasses.warrior;
  }
  function getPetBonus(){
    const pid = st().character.pet;
    const out = {dmg:0, crit:0, combo:0, hp:0};
    if(!pid||!Content.Pets[pid])return out;
    const p = Content.Pets[pid];
    const lv = st().character.petLevels[pid] || 1;
    const mult = 1 + (lv-1)*0.2;
    const a = p.amt * mult;
    if(p.bonus==='dmg')out.dmg=a;
    else if(p.bonus==='crit')out.crit=a;
    else if(p.bonus==='combo')out.combo=a;
    else if(p.bonus==='hp')out.hp=a;
    else if(p.bonus==='both'){out.dmg=a;out.crit=a;}
    else if(p.bonus==='all'){out.dmg=a;out.crit=a;out.combo=a;}
    return out;
  }
  function getTotalPassive(pid){
    let t = 0;
    const cls = getClass();
    if(cls.passives&&cls.passives[pid])t+=cls.passives[pid];
    const eq = st().inventory.equipment;
    for(const slot in Content.EQUIP){
      const lv = eq[slot]||0;
      (Content.EQUIP[slot].passives||[]).forEach(p=>{
        if(lv>=p[0]&&p[1]===pid)t++;
      });
    }
    if(st().character.skillTree[pid])t += st().character.skillTree[pid];
    const def = Content.PASSIVES[pid];
    return Math.min(t, def?def.max:99);
  }
  function getPassiveValue(pid){
    const lv = getTotalPassive(pid);
    const def = Content.PASSIVES[pid];
    // Rare item: phoenixFeather — revive 50%
    if(pid==='revive' && st().inventory.rareItems.indexOf('phoenixFeather')>-1){
      return Math.max(lv>0?lv*def.per:0, 0.5);
    }
    return (!def||lv<=0)?0:lv*def.per;
  }
  function getMaxHp(){
    const cls = getClass();
    const pb = getPetBonus();
    const eq = st().inventory.equipment;
    return 100 + (cls.hp||0) + (st().player.level-1)*5
      + eq.s*12 + eq.h*5 + eq.a*8 + eq.p*6
      + pb.hp + (st().character.passiveBoosts.hp||0)
      + (st().player.rebirth*25);
  }
  function getWeaponMul(){return 1 + (st().inventory.equipment.w||0)*0.2;}
  function getDamageMul(){
    let m = (getClass().dmg||1) * getWeaponMul() * (1 + getPetBonus().dmg);
    if(st().inventory.rareItems.indexOf('ancientSword')>-1)m *= 1.5;
    return m;
  }
  function getGoldMul(){return 1 + getPassiveValue('goldBonus') + (st().character.passiveBoosts.gold||0);}
  function getExpMul(){return 1 + getPassiveValue('expBonus') + (st().character.passiveBoosts.exp||0);}
  function getTimeBonus(){return getPassiveValue('timeBonus') + (st().character.passiveBoosts.time||0);}
  function getCritChance(){
    // Note: crit charge is separate — see consumeCritCharge
    return 0.06 + (getClass().crit||0) + getPetBonus().crit + (st().character.passiveBoosts.crit||0);
  }
  function getCritMul(){return (getClass().cmul||3) + getPassiveValue('critDmg') + (st().character.passiveBoosts.cmul||0);}
  function getPlayerDamage(){
    const base = 15 + st().player.combo * 3;
    return Math.round(base * getDamageMul());
  }
  function addExp(amount){
    const p = st().player;
    p.exp += Math.round(amount * getExpMul());
    let need = p.level * 80, safety = 0;
    while(p.exp>=need && safety<50){
      safety++;
      p.exp -= need;
      p.level++;
      p.skillPoints++;
      need = p.level * 80;
      MQ.Audio.sfx.level();
      MQ.UI.floatCenter('⭐ LV UP!','heal');
    }
  }
  // Crit charge (elixir) — แยกจาก getCritChance เพื่อไม่ให้ decrement ซ้ำ
  let _critCharges = 0;
  function addCritCharge(){_critCharges++;}
  function consumeCritCharge(){
    if(_critCharges>0){_critCharges--;return true;}
    return false;
  }
  function resetCritCharges(){_critCharges=0;}
  function describePet(pet, lv){
    const mult = 1 + (lv-1)*0.2;
    const pct = v => Math.round(v*mult*100) + '%';
    switch(pet.bonus){
      case 'dmg': return 'DMG+' + pct(pet.amt);
      case 'crit': return 'CRIT+' + pct(pet.amt);
      case 'combo': return 'COMBO+' + pct(pet.amt);
      case 'hp': return 'HP+' + Math.round(pet.amt*mult);
      case 'both': return 'DMG+' + pct(pet.amt) + ' CRIT+' + pct(pet.amt);
      case 'all': return '+' + pct(pet.amt) + ' ทุกอย่าง';
    }
    return '';
  }
  return {
    getClass, getPetBonus, getTotalPassive, getPassiveValue,
    getMaxHp, getWeaponMul, getDamageMul, getGoldMul, getExpMul, getTimeBonus,
    getCritChance, getCritMul, getPlayerDamage, addExp,
    addCritCharge, consumeCritCharge, resetCritCharges, describePet
  };
})();

/* ==================== BATTLE ENGINE ==================== */
const Battle = MQ.Battle = (function(){
  const st = () => MQ.State.data;
  const B = {
    active: false,
    chapter: 1, stage: 1,
    bossHp: 0, bossMaxHp: 0,
    currentQ: null,
    timerLeft: 0, timerMax: 0, timerId: null,
    isSubmitting: false,
    _ended: false,
    _skillCD: {s1:0, s2:0},

    /* -------- START -------- */
    start(ch, stage){
      const s = st();
      // Reset
      this.active = true;
      this._ended = false;
      this.isSubmitting = false;
      this.chapter = ch;
      this.stage = stage;
      this._skillCD = {s1:0, s2:0};
      s.player.hp = Char.getMaxHp();
      s.player.combo = 0;
      s.player.shieldHits = Char.getTotalPassive('shieldStart');
      s.player._reviveUsed = false;
      Char.resetCritCharges();

      // Boss HP
      const baseHp = 80 + ch*40 + stage*60;
      this.bossMaxHp = stage === 5 ? Math.round(baseHp*1.8) : baseHp;
      this.bossHp = this.bossMaxHp;

      // Boss intro (blocks timer)
      if(stage === 5 && s.settings.animations){
        this._showBossIntro(ch, ()=>{
          this._startTimer();
          this.nextQuestion();
        });
      } else {
        this._startTimer();
        this.nextQuestion();
      }
    },

    _showBossIntro(chId, done){
      const ch = Content.Chapters.find(c=>c.id===chId);
      if(!ch){done();return;}
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:9500;background:radial-gradient(circle at 50% 50%,rgba(255,0,110,0.3),rgba(0,0,0,0.95));display:flex;flex-direction:column;align-items:center;justify-content:center;';
      ov.innerHTML = `
        <div style="font-size:120px;filter:drop-shadow(0 0 40px rgba(255,0,110,0.9));animation:ec 0.6s ease;">${ch.boss}</div>
        <div style="font-family:Orbitron,sans-serif;font-size:26px;font-weight:900;color:var(--np);text-shadow:0 0 20px var(--np);margin-top:20px;text-align:center;padding:0 20px;">บท ${ch.id}: ${ch.name}</div>
        <div id="p8count" style="font-family:Orbitron,sans-serif;font-size:80px;font-weight:900;color:var(--ny);text-shadow:0 0 40px var(--ny);margin-top:30px;">3</div>
      `;
      document.body.appendChild(ov);
      MQ.Audio.sfx.hit();
      let count = 3;
      const iv = setInterval(()=>{
        count--;
        const el = document.getElementById('p8count');
        if(el)el.textContent = count>0 ? count : 'GO!';
        MQ.Audio.sfx.click();
        if(count<=0){
          clearInterval(iv);
          MQ.Audio.sfx.win();
          setTimeout(()=>{
            ov.style.transition='opacity 0.3s';
            ov.style.opacity='0';
            setTimeout(()=>{try{ov.remove();}catch(e){};done();},350);
          },400);
        }
      },700);
    },

    /* -------- TIMER -------- */
    _startTimer(){
      if(this.timerId){clearInterval(this.timerId);this.timerId=null;}
      const base = {1:60,2:55,3:50,4:45,5:40}[this.stage] || 60;
      this.timerMax = base + Char.getTimeBonus();
      this.timerLeft = this.timerMax;
      this._updateTimerUI();
      this.timerId = setInterval(()=>{
        if(!this.active||this._ended){clearInterval(this.timerId);this.timerId=null;return;}
        this.timerLeft--;
        this._updateTimerUI();
        if(this.timerLeft<=5&&this.timerLeft>0)MQ.Audio.sfx.tick_low();
        if(this.timerLeft<=0){
          clearInterval(this.timerId);this.timerId=null;
          this._handleWrong(true);
        }
      },1000);
    },
    _updateTimerUI(){
      const pct = Math.max(0, this.timerLeft/this.timerMax*100);
      const bar = document.getElementById('timerBar');
      const txt = document.getElementById('timerTxt');
      if(bar)bar.style.width = pct+'%';
      if(txt)txt.textContent = '⏱ ' + Math.max(0,this.timerLeft) + 's';
    },

    /* -------- NEXT QUESTION -------- */
    nextQuestion(){
      if(!this.active||this._ended)return;
      if(this.bossHp<=0)return;
      if(st().player.hp<=0)return;
      this.isSubmitting = false;
      this.currentQ = Content.generateQuestion(this.chapter);
      const qEl = document.getElementById('qText');
      if(qEl)qEl.textContent = this.currentQ.q;
      const inp = document.getElementById('answerInp');
      if(inp){inp.value='';inp.disabled=false;inp.className='ai';inp.removeAttribute('readonly');}
      const fb = document.getElementById('feedbackMsg');
      if(fb){fb.textContent='';fb.style.color='var(--td)';}
      MQ.Numpad.updateSubmit();
      this._startTimer();
      this._updateBattleUI();
    },

    /* -------- SUBMIT -------- */
    submit(){
      if(!this.active||this._ended||this.isSubmitting)return;
      const inp = document.getElementById('answerInp');
      if(!inp||inp.disabled)return;
      const val = inp.value.trim();
      if(!val)return;
      this.isSubmitting = true;
      inp.disabled = true;
      inp.setAttribute('readonly','readonly');
      if(this.timerId){clearInterval(this.timerId);this.timerId=null;}
      const ok = MQ.Checker.match(val, this.currentQ.a);
      if(ok){inp.classList.add('cf');this._handleCorrect();}
      else{inp.classList.add('wf');this._handleWrong(false);}
    },

    /* -------- CORRECT -------- */
    _handleCorrect(){
      const s = st();
      MQ.Audio.sfx.correct();
      s.player.correct++;
      s.player.combo++;
      if(s.player.combo > s.player.maxCombo) s.player.maxCombo = s.player.combo;
      if(!s.progress.stats[this.chapter]) s.progress.stats[this.chapter] = {correct:0,wrong:0};
      s.progress.stats[this.chapter].correct++;

      // Damage
      let dmg = Char.getPlayerDamage();
      const fs = Char.getPassiveValue('firstStrike');
      if(fs>0 && s.player.combo===1) dmg = Math.round(dmg*(1+fs));

      let isCrit = false;
      if(Char.consumeCritCharge()) isCrit = true;
      else if(Math.random() < Char.getCritChance()) isCrit = true;
      if(isCrit) dmg = Math.round(dmg * Char.getCritMul());

      const mh = Char.getPassiveValue('multiHit');
      let hits = (mh>0 && Math.random()<mh) ? 2 : 1;
      let totalDmg = dmg * hits;

      const ex = Char.getPassiveValue('execute');
      if(ex>0 && this.bossHp>0 && this.bossHp/this.bossMaxHp < ex) totalDmg = this.bossHp;

      this.bossHp = Math.max(0, this.bossHp - totalDmg);

      // Lifesteal
      const ls = Char.getPassiveValue('lifesteal');
      if(ls>0){
        const heal = Math.round(totalDmg*ls);
        if(heal>0){
          s.player.hp = Math.min(Char.getMaxHp(), s.player.hp + heal);
          const pEl = document.getElementById('pEmoji');
          if(pEl){const r=pEl.getBoundingClientRect();MQ.UI.floatText(r.left+r.width/2, r.top+r.height/2, '+'+heal, 'heal');}
        }
      }
      // HP regen
      const hr = Char.getPassiveValue('hpRegen');
      if(hr>0) s.player.hp = Math.min(Char.getMaxHp(), s.player.hp + hr);

      // UI feedback
      const bEl = document.getElementById('bEmoji');
      if(bEl){
        bEl.classList.remove('hit','critpop');
        void bEl.offsetWidth;
        bEl.classList.add(isCrit?'critpop':'hit');
        const r = bEl.getBoundingClientRect();
        MQ.UI.floatText(r.left+r.width/2, r.top+r.height/2, (isCrit?'💥 ':'-')+totalDmg+(hits>1?'×'+hits:''), isCrit?'critdmg':'dmg');
        if(isCrit)MQ.Particles.burst(r.left+r.width/2, r.top+r.height/2, {count:25, speed:6, colors:['#ff006e','#ffe600','#ff416c']});
      }
      if(isCrit)MQ.Audio.sfx.crit();
      if([5,10,15,20].includes(s.player.combo)){
        MQ.Audio.sfx.combo(s.player.combo);
        MQ.UI.floatCenter('🔥 COMBO x'+s.player.combo, 'crit');
      }
      MQ.Audio.sfx.gold();

      const fb = document.getElementById('feedbackMsg');
      if(fb){
        fb.textContent = '✅ ถูก! DMG '+totalDmg+(isCrit?' 💥':'')+(hits>1?' ×'+hits:'');
        fb.style.color = 'var(--ng)';
      }
      this._updateBattleUI();
      MQ.State.save();

      if(this.bossHp<=0){
        setTimeout(()=>this.end(true), 700);
        return;
      }
      // Stun
      const sc = Char.getPassiveValue('stunChance');
      if(sc>0 && Math.random()<sc){
        MQ.UI.floatCenter('💫 สตัน!', 'heal');
        setTimeout(()=>this.nextQuestion(), 1200);
      } else {
        setTimeout(()=>this.nextQuestion(), 850);
      }
    },

    /* -------- WRONG -------- */
    _handleWrong(timedOut){
      const s = st();
      const ck = Char.getPassiveValue('comboKeep');
      if(!(ck>0 && Math.random()<ck)) s.player.combo = 0;
      s.player.wrong++;
      if(!s.progress.stats[this.chapter]) s.progress.stats[this.chapter] = {correct:0,wrong:0};
      s.progress.stats[this.chapter].wrong++;

      // Shield block
      if(s.player.shieldHits>0){
        s.player.shieldHits--;
        MQ.Audio.sfx.shield();
        const fb = document.getElementById('feedbackMsg');
        if(fb){fb.textContent='🛡️ โล่กัน! เฉลย: '+this.currentQ.a+' (เหลือ '+s.player.shieldHits+')';fb.style.color='var(--nb)';}
        MQ.UI.floatCenter('🛡️ บล็อก','heal');
        this._updateBattleUI();
        setTimeout(()=>this.nextQuestion(), 900);
        return;
      }

      let dmg = 8 + this.chapter*2 + (timedOut?5:0);
      // Dodge
      const shLv = s.inventory.equipment.sh || 0;
      if(shLv>0 && Math.random()<shLv*0.025){
        dmg = 0;
        MQ.UI.floatCenter('💨 หลบ!', 'heal');
      }

      const hpBefore = s.player.hp;
      s.player.hp = Math.max(0, s.player.hp - dmg);
      const taken = hpBefore - s.player.hp;

      if(taken>0){
        MQ.Audio.sfx.wrong();
        MQ.Audio.sfx.hit();
        const scene = document.getElementById('battleScene');
        if(scene){scene.classList.remove('tb-shake');void scene.offsetWidth;scene.classList.add('tb-shake');}
        const pEl = document.getElementById('pEmoji');
        if(pEl){
          const r = pEl.getBoundingClientRect();
          MQ.UI.floatText(r.left+r.width/2, r.top+r.height/2, '-'+dmg+' HP', 'critdmg');
          MQ.Particles.burst(r.left+r.width/2, r.top+r.height/2, {count:12, speed:3, colors:['#ff006e','#ff4b2b']});
        }
        // Thorns
        const th = Char.getPassiveValue('thorns');
        if(th>0 && this.bossHp>0){
          const refl = Math.round(taken*th);
          if(refl>0){
            this.bossHp = Math.max(0, this.bossHp - refl);
            const bEl = document.getElementById('bEmoji');
            if(bEl){const r=bEl.getBoundingClientRect();MQ.UI.floatText(r.left+r.width/2, r.top+r.height/2, '🌵-'+refl, 'dmg');}
          }
        }
      }

      const fb = document.getElementById('feedbackMsg');
      if(fb){
        fb.textContent = (timedOut?'❌ หมดเวลา ':'❌ ผิด ')+'เฉลย: '+this.currentQ.a+(taken>0?' (-'+taken+'HP)':' (หลบ!)');
        fb.style.color = 'var(--np)';
      }
      this._updateBattleUI();
      MQ.State.save();

      if(s.player.hp<=0){
        // Revive
        const rv = Char.getPassiveValue('revive');
        if(rv>0 && !s.player._reviveUsed){
          s.player.hp = Math.max(1, Math.round(Char.getMaxHp()*rv));
          s.player._reviveUsed = true;
          MQ.Audio.sfx.heal();
          MQ.UI.floatCenter('✨ คืนชีพ!','heal');
          this._updateBattleUI();
          setTimeout(()=>this.nextQuestion(), 1300);
          return;
        }
        setTimeout(()=>this.end(false), 900);
        return;
      }
      setTimeout(()=>this.nextQuestion(), timedOut?1200:1500);
    },

    /* -------- SKILL -------- */
    useSkill(slot){
      if(!this.active||this._ended||this.isSubmitting)return;
      const cls = Char.getClass();
      const idx = slot==='s1' ? 0 : 1;
      const sid = cls.skills[idx];
      const skill = Content.SKILLS[sid];
      if(!skill)return;
      const now = Date.now();
      if(this._skillCD[slot] > now) return;
      const s = st();
      // Mana passive: ฟรีโอกาส
      const free = Char.getPassiveValue('mana');
      let cost = skill.cost;
      if(free>0 && Math.random()<free){cost=0;MQ.UI.floatCenter('💧 ฟรี!','heal');}
      if(s.player.gold < cost){MQ.Audio.sfx.err();return;}
      s.player.gold -= cost;
      this._skillCD[slot] = now + skill.cd*1000;
      MQ.Audio.sfx.skill();

      const btn = document.getElementById(slot==='s1'?'skill1Btn':'skill2Btn');
      if(btn){
        btn.disabled = true;
        const orig = btn.textContent;
        btn.textContent = '⏳ '+skill.cd+'s';
        setTimeout(()=>{if(btn){btn.disabled=false;btn.textContent=orig;}}, skill.cd*1000);
      }

      const maxHp = Char.getMaxHp();
      const wm = Char.getWeaponMul();
      switch(skill.type){
        case 'dmg': {
          const d = Math.round(30*(skill.mul||2)*wm);
          this.bossHp = Math.max(0, this.bossHp - d);
          MQ.UI.floatCenter('⚔️'+d,'critdmg');
          break;
        }
        case 'gcrit': {
          const d = Math.round(30*(skill.mul||2.5)*wm*Char.getCritMul());
          this.bossHp = Math.max(0, this.bossHp - d);
          MQ.UI.floatCenter('💥'+d,'critdmg');
          break;
        }
        case 'shield': {
          s.player.shieldHits = (s.player.shieldHits||0) + 1;
          MQ.UI.floatCenter('🛡️ +1','heal');
          break;
        }
        case 'heal': {
          const h = skill.heal||30;
          s.player.hp = Math.min(maxHp, s.player.hp + h);
          MQ.UI.floatCenter('💚+'+h,'heal');
          break;
        }
        case 'dmgheal': {
          const d = Math.round(30*(skill.mul||2));
          this.bossHp = Math.max(0, this.bossHp - d);
          s.player.hp = Math.min(maxHp, s.player.hp + (skill.heal||30));
          MQ.UI.floatCenter('✨','heal');
          break;
        }
        case 'shieldheal': {
          s.player.shieldHits = (s.player.shieldHits||0) + 1;
          s.player.hp = Math.min(maxHp, s.player.hp + (skill.heal||25));
          MQ.UI.floatCenter('🛡️💚','heal');
          break;
        }
        case 'drain': {
          const d = Math.round(30*(skill.mul||2));
          this.bossHp = Math.max(0, this.bossHp - d);
          s.player.hp = Math.min(maxHp, s.player.hp + Math.round(d*(skill.healPct||0.5)));
          MQ.UI.floatCenter('👻','heal');
          break;
        }
      }
      this._updateBattleUI();
      MQ.State.save();
      if(this.bossHp<=0) setTimeout(()=>this.end(true), 600);
    },

    /* -------- FLEE -------- */
    flee(){
      if(!this.active)return;
      const s = st();
      s.player.gold = Math.max(0, s.player.gold - 10);
      MQ.State.save();
      this._cleanup();
      MQ.Router.go('chapters');
    },

    /* -------- CLEANUP (ไม่คำนวณรางวัล) -------- */
    _cleanup(){
      this.active = false;
      this._ended = true;
      if(this.timerId){clearInterval(this.timerId);this.timerId=null;}
      MQ.Audio.stopMusic();
      MQ.Numpad.hide();
      MQ.Numpad.onSubmit = null;
    },

    /* -------- UPDATE UI -------- */
    _updateBattleUI(){
      const s = st();
      const maxHp = Char.getMaxHp();
      const pBar = document.getElementById('pHpBar');
      const pTxt = document.getElementById('pHpTxt');
      if(pBar)pBar.style.width = Math.max(0,s.player.hp/maxHp*100)+'%';
      if(pTxt)pTxt.textContent = Math.max(0,Math.round(s.player.hp))+'/'+maxHp;
      const bBar = document.getElementById('bHpBar');
      const bTxt = document.getElementById('bHpTxt');
      if(bBar)bBar.style.width = Math.max(0,this.bossHp/this.bossMaxHp*100)+'%';
      if(bTxt)bTxt.textContent = Math.max(0,Math.round(this.bossHp))+'/'+this.bossMaxHp;
      const cBadge = document.getElementById('comboBadge');
      if(cBadge)cBadge.textContent = '🔥 '+s.player.combo;
    },

    /* ============================================================
       ⭐⭐⭐ SINGLE SOURCE OF TRUTH — END BATTLE ⭐⭐⭐
       คำนวณ multiplier, track, achievement ทั้งหมดที่นี่
       ============================================================ */
    end(won){
      if(this._ended)return;
      this._ended = true;
      this.active = false;
      if(this.timerId){clearInterval(this.timerId);this.timerId=null;}
      MQ.Audio.stopMusic();
      MQ.Numpad.hide();
      MQ.Numpad.onSubmit = null;

      const s = st();
      const chapter = this.chapter, stage = this.stage;

      if(won){
        MQ.Audio.sfx.win();

        // ⭐ คำนวณรางวัลพร้อม multiplier
        const baseGold = 30 + stage*15 + chapter*10;
        const baseExp = 20 + chapter*5 + stage*3;
        const gold = Math.round(baseGold * Char.getGoldMul());
        const exp = Math.round(baseExp * Char.getExpMul());

        s.player.gold += gold;
        s.player.score += 50 + chapter*10 + stage*5;
        Char.addExp(exp);

        // Progress
        if(!s.progress.completed[chapter]) s.progress.completed[chapter] = [];
        if(s.progress.completed[chapter].indexOf(stage)<0) s.progress.completed[chapter].push(stage);
        if(stage===5 && s.progress.bossKills.indexOf(chapter)<0) s.progress.bossKills.push(chapter);

        // Track (ทำครั้งเดียว — ตรวจ _ended flag ด้านบน)
        s.meta.tracked.battlesWon++;
        if(s.player.hp === Char.getMaxHp()) s.meta.tracked.battlesNoDamage++;

        // Quest tracking
        if(MQ.Quests){
          MQ.Quests.track('win', 1);
          if(stage===5) MQ.Quests.track('boss', 1);
          MQ.Quests.track('gold', gold);
        }

        // History + Leaderboard (ที่เดียว)
        if(MQ.History){
          MQ.History.add({chapter, stage, win:true, date:Date.now()});
        }
        if(MQ.Leaderboard){
          MQ.Leaderboard.add({
            score: s.player.score,
            gold: s.player.gold,
            level: s.player.level,
            class: s.character.class,
            win: true
          });
        }

        MQ.State.save();
        MQ.Particles.burst(window.innerWidth/2, window.innerHeight/2, {count:80, speed:10, colors:['#ffd700','#ffe600','#39ff14','#00f0ff']});
        if(MQ.Polish && s.settings.animations) MQ.Polish.showVictory();

        const ch = Content.Chapters.find(c=>c.id===chapter) || {name:'?'};
        setTimeout(()=>{
          MQ.UI.modal('🏆 ชนะ!',
            `<div class="tc">
              <div style="font-size:64px;filter:drop-shadow(0 0 20px rgba(255,215,0,0.6));">🏆</div>
              <div style="margin-top:12px;font-size:14px;">ผ่านบท ${chapter}: ${U.esc(ch.name)} ด่าน ${stage}</div>
              <div style="margin-top:8px;color:var(--ny);font-weight:700;">+${U.fmt(gold)} 🪙</div>
              <div style="color:var(--ng);font-size:12px;">+${exp} EXP</div>
            </div>`,
            [
              {label:'⚔️ ต่อ',cls:'btn-g',action:"MQ.UI.closeModal();MQ.Router.go('chapters')"},
              {label:'🏠 เมนู',cls:'btn-o',action:"MQ.UI.closeModal();MQ.Router.go('home')"}
            ]
          );
        }, 800);
      } else {
        MQ.Audio.sfx.lose();
        const pen = Math.min(s.player.gold, 10);
        s.player.gold -= pen;
        if(MQ.History){
          MQ.History.add({chapter, stage, win:false, date:Date.now()});
        }
        MQ.State.save();
        setTimeout(()=>{
          MQ.UI.modal('💀 พ่ายแพ้',
            `<div class="tc">
              <div style="font-size:64px;filter:drop-shadow(0 0 20px rgba(255,0,110,0.6));">💀</div>
              <div style="margin-top:12px;font-size:14px;">HP หมด!</div>
              <div style="margin-top:8px;color:var(--np);">-${pen} 🪙</div>
            </div>`,
            [
              {label:'🔄 ลองใหม่',cls:'btn-r',action:`MQ.UI.closeModal();MQ.Router.go('battle', { ch:${chapter}, stage:${stage} })`},
              {label:'⚔️ กลับ',cls:'btn-o',action:"MQ.UI.closeModal();MQ.Router.go('chapters')"}
            ]
          );
        }, 500);
      }
      setTimeout(()=>{if(MQ.Achievements&&MQ.Achievements.check)MQ.Achievements.check();}, 200);
    }
  };
  return B;
})();

// SETTINGS
MQ.Router.register('set', function(content){
  const s = MQ.State.data.settings;
  content.innerHTML = `
    <h3>⚙️ ตั้งค่า</h3>
    <div class="si"><span>🔊 เสียง</span><button class="btn btn-sm ${s.soundOn?'btn-g':'btn-o'}" onclick="window.__mq_toggleSound()">${s.soundOn?'เปิด':'ปิด'}</button></div>

    <div class="si"><span>✨ แอนิเมชั่น</span><button class="btn btn-sm ${s.animations?'btn-g':'btn-o'}" onclick="window.__mq_toggleAnim()">${s.animations?'เปิด':'ปิด'}</button></div>

    <div class="si"><span>🗑️ รีเซ็ต</span><button class="btn btn-sm btn-r" onclick="window.__mq_reset()">ลบทั้งหมด</button></div>

/* ==================== SETTINGS ACTIONS ==================== */
window.__mq_toggleSound = function(){
  const s = MQ.State.data.settings;
  s.soundOn = !s.soundOn;
  MQ.Audio.setEnabled(s.soundOn);
  if(s.soundOn){MQ.Audio.resume();MQ.Audio.sfx.click();}
  const btn = document.getElementById('soundToggle');
  if(btn)btn.textContent = s.soundOn?'🔊':'🔇';
  MQ.State.save();
  MQ.Router.go('set');
};
window.__mq_toggleHaptic = function(){
  const s = MQ.State.data.settings;
  s.haptic = !s.haptic;
  MQ.State.save();
  MQ.Router.go('set');
};
window.__mq_toggleAnim = function(){
  const s = MQ.State.data.settings;
  s.animations = !s.animations;
  MQ.State.save();
  MQ.Router.go('set');
};
window.__mq_export = function(){
  try{
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(MQ.State.data))));
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(b64).then(()=>MQ.UI.modal('📤 สำเร็จ','คัดลอกแล้ว',[{label:'ตกลง',cls:'btn-g'}])).catch(()=>prompt('คัดลอก:',b64));
    }else prompt('คัดลอก:',b64);
  }catch(e){MQ.UI.modal('❌','ไม่สำเร็จ',[{label:'ปิด',cls:'btn-o'}]);}
};
window.__mq_import = function(){
  const b64 = prompt('วางข้อมูล:');
  if(!b64)return;
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(b64.trim()))));
    if(!MQ.Save.validate(d)){MQ.UI.modal('❌','ไม่ถูกต้อง',[{label:'ปิด',cls:'btn-o'}]);return;}
    MQ.State.data = d;
    MQ.State.save();
    MQ.UI.modal('✅','โหลดแล้ว',[{label:'ตกลง',cls:'btn-g',action:"MQ.UI.closeModal();MQ.Router.go('home')"}]);
  }catch(e){MQ.UI.modal('❌','ไม่สำเร็จ',[{label:'ปิด',cls:'btn-o'}]);}
};
window.__mq_reset = function(){
  MQ.UI.modal('⚠️ ยืนยัน?','ลบเซฟทั้งหมด?',[
    {label:'❌ ยกเลิก',cls:'btn-o',action:'MQ.UI.closeModal()'},
    {label:'🗑️ ลบ',cls:'btn-r',action:'MQ.Save.clear();location.reload();'}
  ]);
};

/* ==================== PLACEHOLDER SCREENS (Block 2-4 จะมาเติม) ==================== */
['shop','lib','class','upgrade','petupgrade','skilltree','petshop','inventory','stats','modes','rebirth','leaderboard','history','kb','achievements','daily','quests'].forEach(name => {
  MQ.Router.register(name, function(content){
    content.innerHTML = `<h3>🚧 ${name}</h3><div class="tc" style="padding:40px;"><div style="font-size:48px;">🚧</div><div style="color:var(--td);margin-top:12px;">จะมาใน Block ถัดไป</div></div><button class="btn btn-o wf mt3" onclick="MQ.Router.go('home')">🔙 กลับ</button>`;
  });
});

/* ==================== BOOT ==================== */
MQ.Boot = (function(){
  function init(){
    let data = MQ.Save.load();
    if(!data){data = MQ.Save.defaultState();MQ.Save.write(data);}
    MQ.State.data = data;
    MQ.Audio.setEnabled(data.settings.soundOn);
    MQ.Particles.start();
    MQ.Audio.init();
    MQ.UI.installRipple();
    MQ.UI.installHaptic();
    MQ.Numpad.init();

    // Sound toggle
    const sb = document.getElementById('soundToggle');
    if(sb){
      sb.textContent = data.settings.soundOn ? '🔊' : '🔇';
      sb.addEventListener('click',()=>{
        const s = MQ.State.data.settings;
        s.soundOn = !s.soundOn;
        MQ.Audio.setEnabled(s.soundOn);
        if(s.soundOn){MQ.Audio.resume();MQ.Audio.sfx.click();}
        sb.textContent = s.soundOn?'🔊':'🔇';
        MQ.State.save();
      });
    }

    // Tab bar
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click',()=>{
        const map = {home:'home',char:'char',shop:'shop',lib:'lib',set:'set'};
        const t = map[tab.dataset.tab];
        if(t){MQ.Audio.sfx.click();MQ.Router.go(t);}
      });
    });

    // Version tag
    const vTag = document.getElementById('versionTag');
    if(vTag)vTag.textContent = 'v'+MQ.VERSION;

    // Start button
    const so = document.getElementById('startOverlay');
    const sbtn = document.getElementById('startBtn');
    if(sbtn && so){
      sbtn.addEventListener('click',()=>{
        try{MQ.Audio.resume();MQ.Audio.sfx.win();}catch(e){}
        MQ.Particles.burst(window.innerWidth/2, window.innerHeight/2, {count:60, speed:8});
        so.classList.add('hide');
        setTimeout(()=>{try{so.remove();}catch(e){}},500);
        if(MQ.State.data.settings.soundOn) setTimeout(()=>MQ.Audio.startMusic(100),300);
        MQ.Router.go('home');
      });
    }

    // Auto-save
    setInterval(()=>MQ.State.save(), 15000);
    window.addEventListener('beforeunload',()=>{
      MQ.State.save();
      if(MQ.Battle&&MQ.Battle.active){return '';}
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)MQ.State.save();
    });

    console.log('%c✅ MQ v'+MQ.VERSION+' — BLOCK 1 READY (Gameplay Core)','color:#00f0ff;font-weight:bold;');
    console.log('%c🎮 Home · Chapters · Battle · Char · Settings = พร้อมเล่น','color:#39ff14;font-weight:bold;');
  }
  return {init};
})();

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',MQ.Boot.init);
else MQ.Boot.init();

})();
</script>
<script>
// === BLOCK 2 START: Shop · Consumables · Rebirth · Character Management ===
(function(){
'use strict';
const U = MQ.Utils;
const st = () => MQ.State.data;
const C = MQ.Char;
const B = MQ.Battle;
const Cont = MQ.Content;

/* ============================================================
   1. SHOP ITEMS DATA
   ============================================================ */
const SHOP_ITEMS = MQ.SHOP_ITEMS = {
  // CONSUMABLES
  hpSmall:{name:'❤️ ยาเล็ก',cost:30,cat:'consumable',desc:'ฟื้น 30 HP'},
  hpMed:{name:'❤️‍🩹 ยากลาง',cost:60,cat:'consumable',desc:'ฟื้น 60 HP'},

  // PERMANENT BOOSTS
  orbGold:{name:'💎 ลูกแก้วเศรษฐี',cost:600,cat:'boost',desc:'ทอง+15% ถาวร',boost:{gold:0.15}},
  orbCrit:{name:'💥 ลูกแก้วคริ',cost:700,cat:'boost',desc:'CRIT+20% ถาวร',boost:{crit:0.2}},
  orbLife:{name:'💗 ลูกแก้วชีพ',cost:750,cat:'boost',desc:'HP+25 ถาวร',boost:{hp:25}},
  orbTime:{name:'⏱️ ลูกแก้วเวลา',cost:800,cat:'boost',desc:'เวลา+3s ถาวร',boost:{time:3}},
  orbCmul:{name:'🔥 ลูกแก้วคริแรง',cost:900,cat:'boost',desc:'CMUL+1 ถาวร',boost:{cmul:1}},
  // RARE ITEMS
  ancientSword:{name:'🗡️ ดาบโบราณ',cost:2000,cat:'rare',desc:'DMG ×1.5 ถาวร'},

};

/* ============================================================
   2. SHOP SCREEN
   ============================================================ */
let _shopTab = 'consumable';

MQ.Router.register('shop', function(content){
  const s = st();
  const tabs = {consumable:'🧪 ไอเทม', boost:'💎 ถาวร', rare:'🌟 หายาก'};
  let html = `
    <h3>🛒 ร้านค้า</h3>
    <div class="sbar"><span>🪙<span class="sg">${U.fmt(s.player.gold)}</span></span></div>
    <div style="display:flex;gap:4px;margin-bottom:12px;">
      ${Object.keys(tabs).map(k=>`<button class="btn btn-xs ${_shopTab===k?'btn-g':'btn-o'}" style="flex:1;" onclick="window.__mq_shopTab('${k}')">${tabs[k]}</button>`).join('')}
    </div>`;

  for(const id in SHOP_ITEMS){
    const it = SHOP_ITEMS[id];
    if(it.cat !== _shopTab) continue;

    let owned = '', canBuy = true;
    if(it.cat === 'consumable'){
      const cnt = s.inventory.consumables[id] || 0;
      if(cnt > 0) owned = `<span class="bdg bdg-b">มี ×${cnt}</span>`;
    } else if(it.cat === 'boost'){
      if(s.character.purchasedBoosts.indexOf(id) > -1){
        owned = '<span class="bdg bdg-g">✅ ซื้อแล้ว</span>';
        canBuy = false;
      }
    } else if(it.cat === 'rare'){
      if(s.inventory.rareItems.indexOf(id) > -1){
        owned = '<span class="bdg bdg-gold">✅ มีแล้ว</span>';
        canBuy = false;
      }
    }

    const canAfford = s.player.gold >= it.cost;
    const btnCls = !canBuy ? 'btn-o' : (canAfford ? 'btn-y' : 'btn-o');

    html += `<div class="si">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:14px;">${it.name}</div>
        <div style="font-size:11px;color:var(--td);margin-top:2px;">${it.desc}</div>
        <div style="margin-top:4px;">${owned}</div>
      </div>
      ${canBuy ? `<button class="btn btn-sm ${btnCls}" onclick="window.__mq_buyItem('${id}')" ${!canAfford?'disabled':''}>${U.fmt(it.cost)}🪙</button>` : '<span class="bdg bdg-g">✓</span>'}
    </div>`;
  }

  html += `<button class="btn btn-o wf mt3" onclick="MQ.Router.go('home')">🔙 กลับ</button>`;
  content.innerHTML = html;
});

window.__mq_shopTab = function(tab){
  _shopTab = tab;
  MQ.Audio.sfx.click();
  MQ.Router.go('shop');
};

window.__mq_buyItem = function(id){
  const it = SHOP_ITEMS[id];
  if(!it) return;
  const s = st();
  if(s.player.gold < it.cost){MQ.Audio.sfx.err(); return;}

  if(it.cat === 'consumable'){
    s.player.gold -= it.cost;
    s.inventory.consumables[id] = (s.inventory.consumables[id] || 0) + 1;
  } else if(it.cat === 'boost'){
    if(s.character.purchasedBoosts.indexOf(id) > -1){MQ.Audio.sfx.err(); return;}
    s.player.gold -= it.cost;
    s.character.purchasedBoosts.push(id);
    if(it.boost){
      for(const k in it.boost){
        s.character.passiveBoosts[k] = (s.character.passiveBoosts[k] || 0) + it.boost[k];
      }
    }
  } else if(it.cat === 'rare'){
    if(s.inventory.rareItems.indexOf(id) > -1){MQ.Audio.sfx.err(); return;}
    s.player.gold -= it.cost;
    s.inventory.rareItems.push(id);
  }

  MQ.Audio.sfx.gold();
  MQ.State.save();
  MQ.Router.go('shop');
};

/* ============================================================
   3. BATTLE CONSUMABLE INJECTION + USE
   ============================================================ */
// Inject button after battle renders
const _prevGo2 = MQ.Router.go;
MQ.Router.go = function(name, params){
  const r = _prevGo2.call(this, name, params);
  if(name === 'battle'){
    setTimeout(injectBattleConsumable, 60);
  }
  return r;
};

function injectBattleConsumable(){
  if(document.getElementById('consumableBtn')) return;
  const fleeBtn = document.querySelector('button[onclick*="MQ.Battle.flee"]');
  if(!fleeBtn) return;
  const row = fleeBtn.parentElement;
  if(!row) return;
  const btn = document.createElement('button');
  btn.id = 'consumableBtn';
  btn.className = 'btn btn-sm btn-pur';
  btn.style.flex = '1';
  btn.textContent = '🧪 ไอเทม';
  btn.onclick = () => window.__mq_openConsumables();
  row.appendChild(btn);
}

window.__mq_openConsumables = function(){
  if(!B.active || B._ended || B.isSubmitting) return;
  const s = st();
  const items = [];
  for(const id in s.inventory.consumables){
    const cnt = s.inventory.consumables[id];
    if(cnt > 0 && SHOP_ITEMS[id] && SHOP_ITEMS[id].cat === 'consumable'){
      items.push({id, cnt, item:SHOP_ITEMS[id]});
    }
  }
  if(!items.length){
    MQ.UI.floatCenter('❗ ไม่มีไอเทม','critdmg');
    return;
  }
  const body = items.map(e => `
    <div class="si" style="margin-bottom:6px;">
      <span>${e.item.name} <span class="bdg bdg-b" style="font-size:9px;">×${e.cnt}</span></span>
      <button class="btn btn-sm btn-g" onclick="window.__mq_useConsumable('${e.id}')">ใช้</button>
    </div>
  `).join('');
  MQ.UI.modal('🧪 เลือกไอเทม', body, [{label:'ปิด',cls:'btn-o',action:'MQ.UI.closeModal()'}]);
};

window.__mq_useConsumable = function(id){
  if(!B.active || B._ended || B.isSubmitting) return;
  const s = st();
  const cnt = s.inventory.consumables[id];
  if(!cnt || cnt <= 0) return;
  const it = SHOP_ITEMS[id];
  if(!it || it.cat !== 'consumable') return;

  const maxHp = C.getMaxHp();
  let msg = '', used = false, bossDied = false;

  switch(id){
    case 'hpSmall':
      s.player.hp = Math.min(maxHp, s.player.hp + 30);
      msg = '❤️ +30 HP'; used = true; break;
    case 'hpMed':
      s.player.hp = Math.min(maxHp, s.player.hp + 60);
      msg = '❤️‍🩹 +60 HP'; used = true; break;
    case 'potion':
      s.player.hp = maxHp;
      msg = '💚 ฟื้นเต็ม'; used = true; break;
    case 'timePotion':
      B.timerLeft += 20;
      msg = '⏳ +20 วิ'; used = true; break;
    case 'elixir':
      s.player.hp = maxHp;
      C.addCritCharge();
      msg = '🧴 ฟื้นเต็ม + คริถัดไป!'; used = true; break;
    case 'goldPouch': {
      const g = U.R(100, 500);
      s.player.gold += g;
      msg = '💰 +' + g + '🪙'; used = true; break;
    }
    case 'bomb':
      if(B.bossHp > 0){
        B.bossHp = Math.max(0, B.bossHp - 100);
        msg = '💣 ดาเมจ 100';
        if(B.bossHp <= 0) bossDied = true;
      }
      used = true; break;
    case 'sp':
      s.player.hp = maxHp;
      if(B.bossHp > 0){
        B.bossHp = Math.max(0, B.bossHp - 60);
        msg = '💜 ฟื้นเต็ม + ดาเมจ 60';
        if(B.bossHp <= 0) bossDied = true;
      } else msg = '💜 ฟื้นเต็ม';
      used = true; break;
  }

  if(!used) return;

  s.inventory.consumables[id]--;
  if(s.inventory.consumables[id] <= 0) delete s.inventory.consumables[id];

  MQ.Audio.sfx.heal();
  MQ.UI.closeModal();
  MQ.UI.floatCenter(msg, 'heal');

  // Refresh UI
  B._updateBattleUI();
  if(id === 'timePotion') B._updateTimerUI();

  MQ.State.save();

  // Boss died from consumable → end() handles all rewards properly
  if(bossDied){
    setTimeout(() => B.end(true), 400);
  }
};

        • ความคืบหน้าด่าน, บอส<br>

        • Skill Tree
      </div>
      <div style="font-weight:700;color:var(--ng);margin:10px 0 6px;">✅ จะเก็บไว้</div>
      <div style="font-size:12px;color:var(--td);line-height:1.7;">
        • สัตว์เลี้ยง + คลาสที่ปลดล็อค<br>
        • ลูกแก้ว Boost ถาวร<br>
        • ไอเทมหายาก (ดาบ, ขนนก)<br>
        • Rebirth bonus
      </div>
    </div>
    ${canRebirth
      ? `<button class="btn btn-r wf mt3" style="min-height:56px;font-size:16px;" onclick="window.__mq_doRebirth()">💀 เกิดใหม่!</button>`
      : `<button class="btn wf mt3" style="min-height:56px;" disabled>🔒 ยังไม่พร้อม</button>`}
    <button class="btn btn-o wf mt2" onclick="MQ.Router.go('char')">🔙 กลับ</button>
  `;
});

window.__mq_doRebirth = function(){
  const s = st();
  const cost = 15000 + s.player.rebirth * 10000;
  const reqLevel = 25 + s.player.rebirth * 10;
  if(s.progress.bossKills.length < 10 || s.player.gold < cost || s.player.level < reqLevel){
    MQ.Audio.sfx.err();
    return;
  }
  MQ.UI.modal('⚠️ ยืนยันเกิดใหม่?', `

window.__mq_confirmRebirth = function(){
  const s = st();
  const cost = 15000 + s.player.rebirth * 10000;
  const reqLevel = 25 + s.player.rebirth * 10;
  if(s.progress.bossKills.length < 10 || s.player.gold < cost || s.player.level < reqLevel){
    MQ.UI.closeModal();
    MQ.Audio.sfx.err();
    return;
  }
  MQ.UI.closeModal();

  // Deduct + increment
  s.player.gold -= cost;
  s.player.rebirth++;

  // Reset player
  s.player.level = 1;
  s.player.exp = 0;
  s.player.skillPoints = 0;
  s.player.combo = 0;
  s.player.score = Math.round(s.player.score * 0.3);

  // Reset progress
  s.progress.completed = {};
  s.progress.bossKills = [];
  s.progress.stats = {};

  // Reset equipment + skill tree
  s.inventory.equipment = {w:0,s:0,h:0,a:0,p:0,sh:0};
  s.character.skillTree = {};

  // NOTE: rebirth bonus อยู่ใน getMaxHp() แล้ว (rebirth * 25)
  // ไม่ต้อง +passiveBoosts.hp ซ้ำ

  s.player.maxHp = C.getMaxHp();
  s.player.hp = s.player.maxHp;

  MQ.Audio.sfx.level();
  MQ.State.save();
  MQ.Particles.burst(window.innerWidth/2, window.innerHeight/2, {count:100, speed:12, colors:['#ff006e','#b537f2','#ffe600','#00f0ff']});

  MQ.UI.modal('🌟 เกิดใหม่สำเร็จ!', `
    <div class="tc">
      <div style="font-size:72px;filter:drop-shadow(0 0 30px rgba(255,0,110,0.7));">🌟</div>
      <div style="font-weight:700;font-size:20px;margin-top:12px;color:var(--ny);">REBIRTH ${s.player.rebirth}</div>
      <div style="font-size:14px;color:var(--ng);margin-top:8px;">+25 HP ถาวร</div>
      <div style="font-size:12px;color:var(--td);margin-top:6px;">HP สูงสุดใหม่: ${s.player.maxHp}</div>

  `, [{label:'🚀 เริ่มใหม่',cls:'btn-g',action:"MQ.UI.closeModal();MQ.Router.go('home')"}]);
};

const toastQueue = [];
let toastActive = false;

function showToast(ach){
  toastQueue.push(ach);
  if(!toastActive) processToastQueue();
}

function processToastQueue(){
  if(!toastQueue.length){toastActive = false; return;}
  toastActive = true;
  const ach = toastQueue.shift();
  const el = document.createElement('div');
  el.className = 'mqToast';
  let rewardStr = '';
  if(ach.reward.gold) rewardStr += '+' + ach.reward.gold + '🪙';
  if(ach.reward.sp) rewardStr += (rewardStr ? '<br>' : '') + '+' + ach.reward.sp + 'SP';

      <div class="mqToastName">${U.esc(ach.name)}</div>
      <div class="mqToastDesc">${U.esc(ach.desc)}</div>
    </div>
    <div class="mqToastReward">${rewardStr}</div>
  `;
  toastWrap.appendChild(el);

  const dismiss = () => {
    if(el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => {
      try{el.remove();}catch(e){}
      processToastQueue();
    }, 400);
  };
  el.onclick = dismiss;
  setTimeout(dismiss, 3500);
}

/* ============================================================
   3. ACHIEVEMENT CHECK (throttled)
   ============================================================ */
let _achChecking = false;
let _achPending = false;

function checkAchievements(){
  if(_achChecking){_achPending = true; return;}
  _achChecking = true;
  try{
    const s = st();
    if(!s.meta.achievements) s.meta.achievements = [];
    let changed = false;
    for(const id in ACH){
      if(s.meta.achievements.indexOf(id) > -1) continue;
      let ok = false;
      try{ok = ACH[id].check(s);}catch(e){}
      if(!ok) continue;
      s.meta.achievements.push(id);
      const r = ACH[id].reward || {};
      if(r.gold) s.player.gold += r.gold;
      if(r.sp) s.player.skillPoints += r.sp;
      showToast(ACH[id]);
      changed = true;
    }
    if(changed) MQ.Save.write(s);
  } finally {
    _achChecking = false;
    if(_achPending){_achPending = false; setTimeout(checkAchievements, 50);}
  }
}

};
