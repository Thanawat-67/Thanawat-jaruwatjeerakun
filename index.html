<script>
"use strict";
/* ============================================================
   MQ-EX PART 1: CORE MODULE
   คลังโจทย์ ม.ต้น (คณิต + วิทย์) — Framework
   วางต่อจากสคริปต์สุดท้ายของเกม
   ============================================================ */
(function(){
if(window.MQEX && window.MQEX.ready){
  console.warn('MQ-EX Core already loaded');
  return;
}

/* ============================================================
   [1] NAMESPACE
   ============================================================ */
window.MQEX = window.MQEX || {
  version:'1.0',
  ready:false,
  chapters:{},   /* บทเรียนทั้งหมด (เพิ่มใน Part 2-6) */
  progress:{},   /* บทที่อ่านแล้ว/ทำแล้ว */
  storage:{
    progressKey:'mqex_progress_v1'
  },
  config:{
    readBonus:20,      /* ทองจากการอ่านครั้งแรก */
    quizPerQuestion:15, /* ทองต่อข้อตอบถูก */
    quizPassBonus:100  /* โบนัสทำ quiz ผ่าน */
  }
};

var MQEX = window.MQEX;

/* ============================================================
   [2] HELPERS
   ============================================================ */
function gs(){try{return (typeof state!=='undefined')?state:null;}catch(e){return null;}}
function save(){try{var s=gs();if(s&&typeof Save!=='undefined'&&Save.write)Save.write(s);}catch(e){}}
function sfx(n){try{if(typeof Audio!=='undefined'&&Audio.sfx&&Audio.sfx[n])Audio.sfx[n]();}catch(e){}}
function ft(x,y,t,c){try{if(typeof floatText==='function')floatText(x,y,t,c);}catch(e){}}
function modal(t,b,btns){try{if(typeof showModal==='function'){showModal(t,b,btns);return true;}}catch(e){}return false;}
function closeM(){try{if(typeof closeModal==='function')closeModal();}catch(e){}}
function goS(s){try{if(typeof go==='function')go(s);}catch(e){}}
function addGold(n){
  try{
    var s=gs();if(!s||!s.player)return 0;
    var m=1;try{if(typeof getGoldMul==='function')m=getGoldMul();}catch(e){}
    var g=Math.round(n*m);
    s.player.gold+=g;save();return g;
  }catch(e){return 0;}
}

/* ============================================================
   [3] PROGRESS STORAGE
   ============================================================ */
function loadProgress(){
  try{
    var d=JSON.parse(localStorage.getItem(MQEX.storage.progressKey)||'{}');
    if(d&&typeof d==='object'){
      MQEX.progress={
        read:d.read||{},     /* {chapterId: timestamp} */
        quiz:d.quiz||{},     /* {chapterId: {score, total, at}} */
        stats:d.stats||{read:0,quizDone:0,correct:0,wrong:0}
      };
    }
  }catch(e){
    MQEX.progress={read:{},quiz:{},stats:{read:0,quizDone:0,correct:0,wrong:0}};
  }
}
function saveProgress(){
  try{localStorage.setItem(MQEX.storage.progressKey,JSON.stringify(MQEX.progress));}catch(e){}
}
function markRead(chId){
  var p=MQEX.progress;
  if(!p.read[chId]){
    p.read[chId]=Date.now();
    p.stats.read=(p.stats.read||0)+1;
    saveProgress();
    return true;   /* ครั้งแรก */
  }
  return false;
}
function markQuiz(chId,score,total){
  var p=MQEX.progress;
  var prev=p.quiz[chId];
  if(!prev || score>prev.score){
    p.quiz[chId]={score:score,total:total,at:Date.now()};
  }
  if(!prev)p.stats.quizDone=(p.stats.quizDone||0)+1;
  saveProgress();
}
function isRead(chId){return !!MQEX.progress.read[chId];}
function isQuizDone(chId){return !!MQEX.progress.quiz[chId];}
function getQuizBest(chId){return MQEX.progress.quiz[chId]||null;}
loadProgress();

/* ============================================================
   [4] CHAPTER REGISTRY
   ============================================================ */
/* ใช้ลงทะเบียนบทเรียนจาก Part 2-6 */
MQEX.registerChapter = function(ch){
  if(!ch||!ch.id)return false;
  MQEX.chapters[ch.id]=ch;
  return true;
};
MQEX.registerChapters = function(arr){
  if(!Array.isArray(arr))return 0;
  var n=0;
  arr.forEach(function(ch){if(MQEX.registerChapter(ch))n++;});
  return n;
};
MQEX.getChapters = function(subject,grade){
  var out=[];
  for(var id in MQEX.chapters){
    var ch=MQEX.chapters[id];
    if(subject && ch.subject!==subject)continue;
    if(grade && ch.grade!==grade)continue;
    out.push(ch);
  }
  out.sort(function(a,b){
    if(a.grade!==b.grade)return a.grade-b.grade;
    if(a.term!==b.term)return a.term-b.term;
    return (a.number||0)-(b.number||0);
  });
  return out;
};

/* ============================================================
   [5] UI — SCREENS
   ============================================================ */
var _screen='';  /* 'subject' | 'grade' | 'list' | 'reader' | 'quiz' */
var _ctx={subject:'',grade:0,chId:'',qIdx:0,score:0,answers:[]};

function getEl(){
  try{return document.getElementById('gameContent');}catch(e){return null;}
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- SCREEN: วิชา ---------- */
function showSubjectMenu(subject){
  _screen='list';_ctx.subject=subject;_ctx.grade=0;
  var el=getEl();if(!el)return;
  var title=subject==='math'?'📐 คณิตศาสตร์ ม.ต้น':'🔬 วิทยาศาสตร์ ม.ต้น';
  var subj=subject==='math'?'math':'sci';
  var h='<h3>'+title+'</h3>';
  h+='<div class="ts mb2" style="color:#b0b0d0">เลือกชั้นปีเพื่อดูบทเรียน</div>';

  /* stats bar */
  var st=MQEX.progress.stats||{};
  h+='<div class="sbar"><span>📖 อ่านแล้ว <span class="sv">'+(st.read||0)+'</span></span>'+
     '<span>🎯 ทำ quiz <span class="sv">'+(st.quizDone||0)+'</span></span></div>';

  /* grades */
  for(var g=1;g<=3;g++){
    var chs=MQEX.getChapters(subject,g);
    var total=chs.length;
    var readCount=0,quizCount=0;
    chs.forEach(function(c){if(isRead(c.id))readCount++;if(isQuizDone(c.id))quizCount++;});
    var pct=total>0?Math.round(readCount/total*100):0;
    h+='<div class="si col" onclick="window.__mqexGrade(\''+subject+'\','+g+')" style="cursor:pointer;margin-bottom:10px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<div><b style="font-size:16px">ม.'+g+'</b>';
    h+='<div class="ts" style="color:#b0b0d0">'+total+' บท · อ่าน '+readCount+' · quiz '+quizCount+'</div></div>';
    h+='<div style="font-size:24px;color:#00f0ff">▶</div>';
    h+='</div>';
    h+='<div class="pb" style="margin-top:8px"><div class="pbf" style="width:'+pct+'%"></div></div>';
    h+='</div>';
  }

  h+='<div class="mt3" style="display:flex;gap:8px">';
  h+='<button class="btn btn-o wf" onclick="window.__mqexMain()">◀ เปลี่ยนวิชา</button>';
  h+='<button class="btn btn-o wf" onclick="window.__mqexHome()">🔙 เมนูหลัก</button>';
  h+='</div>';
  el.innerHTML=h;
  el.scrollTop=0;
  sfx('click');
}

function showGradeChapters(subject,grade){

  h+='<div class="mt3" style="display:flex;gap:8px">';

/* ---------- SCREEN: Quiz ---------- */
function startQuiz(chId){
  var ch=MQEX.chapters[chId];
  if(!ch||!ch.problems||!ch.problems.length){alert('บทนี้ไม่มีแบบทดสอบ');return;}
  _screen='quiz';
  _ctx.chId=chId;
  _ctx.qIdx=0;
  _ctx.score=0;
  _ctx.answers=[];
  showQuizQuestion();
}

function showQuizQuestion(){
  var el=getEl();if(!el)return;
  var ch=MQEX.chapters[_ctx.chId];
  if(!ch)return;

  if(_ctx.qIdx>=ch.problems.length){
    showQuizResult();
    return;
  }

  var p=ch.problems[_ctx.qIdx];
  var h='<h3>🎯 '+esc(ch.title)+'</h3>';
  h+='<div class="sbar"><span>ข้อ <span class="sv">'+(_ctx.qIdx+1)+'/'+ch.problems.length+'</span></span>'+
     '<span>ถูก <span class="sg">'+_ctx.score+'</span></span></div>';

  h+='<div class="qp">';
  h+='<div class="qd">'+esc(p.q)+'</div>';
  h+='<div class="air">';
  h+='<input class="ai" id="mqexAns" placeholder="พิมพ์คำตอบ" autocomplete="off" inputmode="text">';
  h+='<button class="btn btn-g" onclick="window.__mqexSubmit()" style="min-width:60px">✓</button>';
  h+='</div>';
  h+='<div class="fbm" id="mqexFb"></div>';
  h+='</div>';

  h+='<div style="display:flex;gap:6px">';
  h+='<button class="btn btn-y" style="flex:1" onclick="window.__mqexHint()">💡 คำใบ้</button>';
  h+='<button class="btn btn-r" style="flex:1" onclick="window.__mqexSkip()">⏭ ข้าม</button>';
  h+='<button class="btn btn-o" style="flex:1" onclick="window.__mqexExitQuiz()">✖ ออก</button>';
  h+='</div>';

  el.innerHTML=h;
  el.scrollTop=0;

  setTimeout(function(){
    var i=document.getElementById('mqexAns');
    if(i){
      i.focus();
      i.addEventListener('keydown',function(e){
        if(e.key==='Enter'){e.preventDefault();window.__mqexSubmit();}
      });
    }
  },100);
}

function matchAnswer(user,correct){
  try{
    if(typeof answersMatch==='function')return answersMatch(user,correct);
  }catch(e){}
  var u=String(user||'').trim().toLowerCase().replace(/\s+/g,'');
  var c=String(correct||'').trim().toLowerCase().replace(/\s+/g,'');
  return u===c;
}

function submitQuizAnswer(){
  if(_screen!=='quiz')return;
  var inp=document.getElementById('mqexAns');
  if(!inp||inp.disabled)return;
  var v=inp.value.trim();
  if(!v)return;

  var ch=MQEX.chapters[_ctx.chId];
  var p=ch.problems[_ctx.qIdx];
  var ok=matchAnswer(v,p.a);
  inp.disabled=true;

  var fb=document.getElementById('mqexFb');
  if(ok){
    _ctx.score++;
    _ctx.answers.push({ok:true,user:v});
    var g=addGold(MQEX.config.quizPerQuestion);
    sfx('correct');
    if(fb){fb.textContent='✅ ถูก! +'+g+'🪙';fb.style.color='var(--ng)';}
    try{if(typeof Particles!=='undefined'&&Particles.burst)
      Particles.burst(window.innerWidth/2,window.innerHeight*0.4,{count:15,speed:5});
    }catch(e){}
  }else{
    _ctx.answers.push({ok:false,user:v,correct:p.a});
    sfx('wrong');
    if(fb){fb.textContent='❌ เฉลย: '+p.a+(p.h?' ('+p.h+')':'');fb.style.color='var(--np)';}
  }

  /* track stats */
  try{
    var s=gs();
    if(s&&s.player){
      if(ok)s.player.tc=(s.player.tc||0)+1;
      else s.player.tw=(s.player.tw||0)+1;
      save();
    }
  }catch(e){}

  setTimeout(function(){
    _ctx.qIdx++;
    showQuizQuestion();
  },ok?700:1600);
}

function skipQuizQuestion(){
  if(_screen!=='quiz')return;
  var ch=MQEX.chapters[_ctx.chId];
  var p=ch.problems[_ctx.qIdx];
  _ctx.answers.push({ok:false,skip:true,correct:p.a});
  sfx('click');
  _ctx.qIdx++;
  showQuizQuestion();
}

function hintQuiz(){
  if(_screen!=='quiz')return;
  var ch=MQEX.chapters[_ctx.chId];
  var p=ch.problems[_ctx.qIdx];
  if(p.h){
    ft(window.innerWidth/2,window.innerHeight*0.3,'💡 '+p.h,'heal');
  }else{
    ft(window.innerWidth/2,window.innerHeight*0.3,'💡 ไม่มีคำใบ้','miss');
  }
}

function exitQuiz(){
  if(!confirm('ออกจากแบบทดสอบ?'))return;
  _screen='';
  showChapter(_ctx.chId);
}

function showQuizResult(){
  var el=getEl();if(!el)return;
  var ch=MQEX.chapters[_ctx.chId];
  if(!ch)return;

  var total=ch.problems.length;
  var score=_ctx.score;
  var pct=Math.round(score/total*100);

  markQuiz(_ctx.chId,score,total);

  /* bonus if pass */
  var bonusMsg='';
  if(pct>=70){
    var g=addGold(MQEX.config.quizPassBonus);
    bonusMsg='<div style="color:#ffe600;margin-top:6px">🎁 โบนัสผ่าน: +'+g+'🪙</div>';
    sfx('win');
  }else{
    sfx('lose');
  }

  var grade=pct>=90?'S':pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F';
  var gradeColor=pct>=80?'#39ff14':pct>=60?'#ffe600':'#ff006e';

  var h='<h3>🎯 ผลสอบ</h3>';
  h+='<div class="gc2" style="background:var(--g);border:2px solid var(--ny);border-radius:16px;padding:24px;text-align:center">';
  h+='<div style="font-size:72px;font-weight:900;color:'+gradeColor+';font-family:Orbitron,sans-serif">'+grade+'</div>';
  h+='<div style="font-size:32px;font-weight:900;margin:12px 0">'+score+'/'+total+'</div>';
  h+='<div style="font-size:14px;color:#b0b0d0">'+pct+'%</div>';
  h+=bonusMsg;
  h+='</div>';

  /* answer breakdown */
  h+='<div class="tp mt3"><div style="font-weight:700;color:#00f0ff;margin-bottom:6px">📋 รายละเอียด</div>';
  _ctx.answers.forEach(function(a,i){
    var icon=a.ok?'✅':a.skip?'⏭':'❌';
    var color=a.ok?'#39ff14':a.skip?'#b0b0d0':'#ff006e';
    var q=ch.problems[i]?ch.problems[i].q:'?';
    h+='<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:12px">';
    h+='<span style="color:'+color+'">'+icon+'</span> '+(i+1)+'. '+esc(q);
    if(!a.ok&&a.correct)h+='<span style="color:#39ff14;margin-left:6px">→ '+esc(a.correct)+'</span>';
    h+='</div>';
  });
  h+='</div>';

  h+='<div class="mt3" style="display:flex;gap:8px">';
  h+='<button class="btn btn-g wf" onclick="window.__mqexStartQuiz(\''+ch.id+'\')">🔄 ทำใหม่</button>';
  h+='<button class="btn btn-o wf" onclick="window.__mqexOpen(\''+ch.id+'\')">📖 อ่านทบทวน</button>';
  h+='</div>';
  h+='<button class="btn btn-o wf mt2" onclick="window.__mqexSubject(\''+ch.subject+'\')">◀ กลับ</button>';

  el.innerHTML=h;
  el.scrollTop=0;
}

/* ---------- MAIN MENU ---------- */
function showMainMenu(){
  _screen='subject';
  var el=getEl();if(!el)return;

  var st=MQEX.progress.stats||{};
  var chs=Object.keys(MQEX.chapters).length;

  var h='<h3>📚 คลังโจทย์ ม.ต้น</h3>';
  h+='<div class="sbar"><span>📖 บททั้งหมด <span class="sv">'+chs+'</span></span>'+
     '<span>🎯 ทำแล้ว <span class="sg">'+(st.quizDone||0)+'</span></span></div>';

  if(chs===0){
    h+='<div class="si tc" style="padding:30px;color:#b0b0d0">⚠️ ยังไม่มีบทเรียน<br><span class="ts">กรุณาโหลด Part 2-6</span></div>';
  }else{
    /* two subjects */
    ['math','sci'].forEach(function(subj){
      var isMath=subj==='math';
      var subjChs=MQEX.getChapters(subj);
      var readCount=0,quizCount=0;
      subjChs.forEach(function(c){if(isRead(c.id))readCount++;if(isQuizDone(c.id))quizCount++;});

      h+='<div class="tp" onclick="window.__mqexSubject(\''+subj+'\')" style="cursor:pointer">';

      h+='<div style="flex:1;margin-left:10px">';
      h+='<div style="font-weight:700;font-size:16px">'+(isMath?'คณิตศาสตร์':'วิทยาศาสตร์')+' ม.ต้น</div>';
      h+='<div class="ts" style="color:#b0b0d0">'+subjChs.length+' บท · อ่าน '+readCount+' · quiz '+quizCount+'</div>';
      h+='</div>';
      h+='<div style="font-size:24px;color:#00f0ff">▶</div>';
      h+='</div>';
      h+='<div class="pb" style="margin-top:8px"><div class="pbf" style="width:'+pct+'%"></div></div>';
      h+='</div>';

  /* stats detail */
  if(chs>0){
    h+='<div class="tp mt3"><div style="font-weight:700;color:#b537f2;margin-bottom:6px">📊 สถิติของคุณ</div>';

    h+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span>🎯 ทำ quiz</span><b>'+(st.quizDone||0)+' บท</b></div>';
    h+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span>✅ ตอบถูก</span><b style="color:#39ff14">'+(st.correct||0)+'</b></div>';
    h+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span>❌ ตอบผิด</span><b style="color:#ff006e">'+(st.wrong||0)+'</b></div>';
    h+='</div>';
  }

  h+='<button class="btn btn-o wf mt3" onclick="window.__mqexHome()">🔙 เมนูหลักเกม</button>';

  el.scrollTop=0;

function goHome(){
  _screen='';
  _ctx={};
  try{if(typeof go==='function')go('menu');}catch(e){}
}

window.__mqexHint = hintQuiz;
window.__mqexExitQuiz = exitQuiz;

/* ============================================================
   [7] MENU INJECTION — เพิ่ม 2 ปุ่ม (dedup)
   ============================================================ */
function injectMenu(){
  var el=getEl();if(!el)return;
  if(typeof currentScreen!=='undefined' && currentScreen!=='menu')return;

  /* ตรวจว่ามีปุ่มเก่าอยู่ไหม — ถ้ามีข้าม (ห้ามซ้ำ) */
  if(el.querySelector('#mqexBtnMath'))return;

  /* หาปุ่ม back ของเมนู (ตัวสุดท้าย) */
  var back=el.querySelector('button:last-of-type');

  function addBtn(id,txt,cls,fn){
    if(document.getElementById(id))return;
    var b=document.createElement('button');
    b.id=id;
    b.className='btn '+cls+' wf mt2';
    b.textContent=txt;
    b.onclick=fn;
    if(back && back.parentNode===el)el.insertBefore(b,back);
    else el.appendChild(b);
  }

  /* ตรวจว่ามีบทหรือยัง */
  var chs=Object.keys(MQEX.chapters).length;
  var suffix=chs===0?'':(' ('+chs+' บท)');

  addBtn('mqexBtnMath','📐 คณิต ม.ต้น'+suffix,'btn-g',function(){showSubjectMenu('math');});
  addBtn('mqexBtnSci','🔬 วิทย์ ม.ต้น'+suffix,'btn-g',function(){showSubjectMenu('sci');});
}

/* Hook renderMenu — wrap ครั้งเดียว */
try{
  if(typeof renderMenu==='function'){
    if(!window.__mqexMenuHooked){
      window.__mqexMenuHooked=true;
      var _orig=renderMenu;
      window.renderMenu=function(){
        _orig.apply(this,arguments);
        setTimeout(injectMenu,80);
        setTimeout(injectMenu,300);
      };
    }
  }
}catch(e){}

/* Safety net — รันทุก 2 วิ (กันกรณี renderMenu ไม่ทำงาน) */
setInterval(injectMenu,2000);

console.info('   API: __mqexMain(), __mqexSubject(), __mqexOpen()');
})();

/* ----- ฟังก์ชันสถิติรวม ----- */
window.__mqexStats = function(){
  var el = document.getElementById('gameContent');
  if(!el) return;

  var stats = MQEX.progress.stats || {read:0,quizDone:0,correct:0,wrong:0};

  /* นับจำนวนบททั้งสิ้น */
  var totalCh = Object.keys(MQEX.chapters).length;
  var mathCh = MQEX.getChapters('math').length;
  var sciCh = MQEX.getChapters('sci').length;

  /* นับที่อ่านแล้วแยกวิชา */
  var mathRead = 0, sciRead = 0, mathQuiz = 0, sciQuiz = 0;
  MQEX.getChapters('math').forEach(function(c){
    if(MQEX.progress.read[c.id]) mathRead++;
    if(MQEX.progress.quiz[c.id]) mathQuiz++;
  });
  MQEX.getChapters('sci').forEach(function(c){
    if(MQEX.progress.read[c.id]) sciRead++;
    if(MQEX.progress.quiz[c.id]) sciQuiz++;
  });

  /* คำนวณคะแนน quiz รวม */
  var totalScore = 0, totalMax = 0;
  for(var cid in MQEX.progress.quiz){
    var q = MQEX.progress.quiz[cid];
    totalScore += q.score || 0;
    totalMax += q.total || 0;
  }
  var accPct = totalMax > 0 ? Math.round(totalScore/totalMax*100) : 0;

  var h='<h3>📊 สถิติคลังโจทย์</h3>';

  /* ภาพรวม */
  h+='<div class="tp" style="background:linear-gradient(135deg,rgba(0,240,255,0.1),rgba(181,55,242,0.1));border-color:#00f0ff">';
  h+='<div class="tc" style="font-size:14px;font-weight:700;margin-bottom:8px">📚 ภาพรวม</div>';
  h+='<div class="sbar" style="background:rgba(0,0,0,0.3);margin:0">';
  h+='<span>📖 บท <span class="sv">'+totalCh+'</span></span>';
  h+='<span>📐 '+mathCh+'</span>';
  h+='<span>🔬 '+sciCh+'</span>';
  h+='</div></div>';

  /* progress bar อ่าน */
  var readPct = totalCh > 0 ? Math.round(stats.read/totalCh*100) : 0;
  h+='<div class="tp"><div style="font-weight:700;color:#00f0ff;margin-bottom:6px">📖 อ่านบทเรียน</div>';
  h+='<div class="pb"><div class="pbf" style="width:'+readPct+'%"></div></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px">';
  h+='<span>'+stats.read+'/'+totalCh+' บท</span><b>'+readPct+'%</b></div></div>';

  /* progress bar quiz */
  var quizPct = totalCh > 0 ? Math.round(stats.quizDone/totalCh*100) : 0;
  h+='<div class="tp"><div style="font-weight:700;color:#ffe600;margin-bottom:6px">🎯 ทำแบบทดสอบ</div>';
  h+='<div class="pb"><div class="pbf" style="width:'+quizPct+'%"></div></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px">';
  h+='<span>'+stats.quizDone+'/'+totalCh+' บท</span><b>'+quizPct+'%</b></div></div>';

  /* accuracy */
  h+='<div class="tp"><div style="font-weight:700;color:#39ff14;margin-bottom:6px">✅ ความแม่นยำ</div>';
  h+='<div class="pb"><div class="pbf" style="width:'+accPct+'%"></div></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px">';
  h+='<span>ตอบถูก '+totalScore+'/'+totalMax+'</span><b>'+accPct+'%</b></div></div>';

  /* แยกวิชา */
  h+='<h3 class="mt3" style="font-size:14px;color:#00f0ff">📐 คณิต ม.ต้น</h3>';
  h+='<div class="si"><span>📖 อ่าน</span><b>'+mathRead+'/'+mathCh+'</b></div>';
  h+='<div class="si"><span>🎯 ทำ quiz</span><b>'+mathQuiz+'/'+mathCh+'</b></div>';

  h+='<h3 class="mt3" style="font-size:14px;color:#39ff14">🔬 วิทย์ ม.ต้น</h3>';
  h+='<div class="si"><span>📖 อ่าน</span><b>'+sciRead+'/'+sciCh+'</b></div>';
  h+='<div class="si"><span>🎯 ทำ quiz</span><b>'+sciQuiz+'/'+sciCh+'</b></div>';

  /* Action buttons */
  h+='<button class="btn btn-g wf mt3" onclick="window.__mqexMain()">📚 กลับหน้าหลัก</button>';
  h+='<button class="btn btn-y wf mt2" onclick="window.__mqexSearch()">🔍 ค้นหาบทเรียน</button>';
  h+='<button class="btn btn-r wf mt2" onclick="window.__mqexResetConfirm()">🗑️ รีเซ็ต progress</button>';

  el.innerHTML = h;
  el.scrollTop = 0;
};

/* ----- ค้นหาบทเรียน ----- */
window.__mqexSearch = function(){
  var el = document.getElementById('gameContent');
  if(!el) return;
  var h='<h3>🔍 ค้นหาบทเรียน</h3>';
  h+='<div class="tp">';
  h+='<input id="mqexSearchInp" type="text" placeholder="พิมพ์คำค้น..." '+
    'style="width:100%;padding:12px;font-size:14px;border-radius:10px;border:2px solid #00f0ff;background:rgba(0,0,0,0.5);color:#fff;font-family:Kanit" autocomplete="off">';
  h+='<div class="ts mt2" style="color:#b0b0d0">ค้นหาจากชื่อบท หรือคำอธิบาย</div>';
  h+='</div>';
  h+='<div id="mqexSearchResults"></div>';
  h+='<button class="btn btn-o wf mt3" onclick="window.__mqexStats()">◀ กลับสถิติ</button>';
  el.innerHTML = h;

  var inp = document.getElementById('mqexSearchInp');
  if(inp){
    inp.focus();
    inp.addEventListener('input', function(){
      var q = inp.value.trim().toLowerCase();
      var results = document.getElementById('mqexSearchResults');
      if(!results) return;
      if(!q){results.innerHTML='';return;}
      var found = [];
      for(var id in MQEX.chapters){
        var c = MQEX.chapters[id];
        var text = (c.title+' '+c.def+' '+(c.formulas||[]).join(' ')).toLowerCase();
        if(text.indexOf(q)>-1) found.push(c);
      }
      if(!found.length){
        results.innerHTML = '<div class="si tc" style="color:#b0b0d0;padding:20px">ไม่พบผลลัพธ์</div>';
        return;
      }
      var rh = '<div class="ts mb2" style="color:#b0b0d0">พบ '+found.length+' บท</div>';
      found.slice(0,20).forEach(function(c){
        var icon = c.subject==='math'?'📐':'🔬';
        rh += '<div class="si" onclick="window.__mqexOpen(\''+c.id+'\')" style="cursor:pointer">'+
          '<div style="flex:1"><b>'+icon+' '+c.title+'</b>'+
          '<div class="ts" style="color:#b0b0d0">ม.'+c.grade+' · เทอม '+c.term+' · บท '+c.number+'</div></div>'+
          '<span style="color:#00f0ff">▶</span></div>';
      });
      results.innerHTML = rh;
    });
  }
  el.scrollTop = 0;
};

/* ----- รีเซ็ต progress ----- */
window.__mqexResetConfirm = function(){
  if(!confirm('ล้าง progress ทั้งหมด?\n(บทที่อ่านแล้ว + คะแนน quiz)')) return;
  try{localStorage.removeItem(MQEX.storage.progressKey);}catch(e){}
  MQEX.progress = {read:{},quiz:{},stats:{read:0,quizDone:0,correct:0,wrong:0}};
  alert('✅ รีเซ็ตแล้ว');
  window.__mqexStats();
};

/* ============================================================
   PATCH — เพิ่มปุ่ม Stats ในหน้า MQEX Main
   ============================================================ */
(function patchMainMenu(){
  /* รอ core พร้อม */
  var tryPatch = setInterval(function(){
    var el = document.getElementById('gameContent');
    if(!el) return;
    /* ตรวจว่าอยู่ในหน้า MQEX Main ไหม — ดูจากหัวข้อ */
    var heading = el.querySelector('h3');
    if(!heading || heading.textContent.indexOf('คลังโจทย์')<0) return;
    /* ตรวจว่ามีปุ่ม Stats อยู่แล้วไหม */
    if(document.getElementById('mqexStatsBtn')) return;
    /* เพิ่มปุ่ม Stats ที่ด้านบน */
    var firstTp = el.querySelector('.tp') || el.querySelector('.sbar');
    if(!firstTp) return;
    var btn = document.createElement('button');
    btn.id = 'mqexStatsBtn';
    btn.className = 'btn btn-pur wf mb2';
    btn.textContent = '📊 ดูสถิติ + ค้นหา';
    btn.onclick = window.__mqexStats;
    firstTp.parentNode.insertBefore(btn, firstTp);
  }, 800);
  /* เคลียร์ interval หลัง 30 วิ (ไม่จำเป็นต้องรันตลอด) */
  setTimeout(function(){clearInterval(tryPatch);},30000);
})();
