<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Math Quest: ตะวันสุดหล่อ พิชิตจักรวาลคณิตศาสตร์ ม.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-blue: #00f0ff; --neon-pink: #ff006e; --neon-purple: #b537f2;
      --neon-green: #39ff14; --neon-yellow: #ffe600; --neon-orange: #ff6b35;
      --dark-bg: #0a0a1a; --card-bg: rgba(15, 15, 35, 0.95);
      --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
      --text-bright: #ffffff; --text-medium: #e0e0f0; --text-dim: #b0b0d0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Kanit', sans-serif;
      background: #0a0a1a;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(255, 0, 110, 0.08) 0%, transparent 50%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden;
    }
    .main-container { width: 100%; max-width: 750px; padding: 10px; }
    .game-wrapper {
      background: var(--card-bg); border-radius: 24px; border: 2px solid var(--glass-border);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2); overflow: hidden; backdrop-filter: blur(20px);
    }
    .game-header { padding: 15px 20px; text-align: center; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border); }
    .creator-badge { display:inline-block; background:rgba(255,0,110,0.2); border:1px solid var(--neon-pink); padding:6px 16px; border-radius:16px; margin-bottom:6px; font-size:12px; font-weight:700; color:var(--neon-pink); }
    .game-title { font-family:'Orbitron',sans-serif; font-size:1.8em; font-weight:900; background:linear-gradient(90deg,var(--neon-blue),var(--neon-green),var(--neon-yellow),var(--neon-pink)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .subtitle { color:var(--text-dim); font-size:11px; }
    .game-content { padding: 16px; max-height: 78vh; overflow-y: auto; }
    .game-content::-webkit-scrollbar { width: 6px; } .game-content::-webkit-scrollbar-thumb { background:var(--neon-purple); border-radius:3px; }
    .btn {
      display:inline-block; padding:10px 18px; font-family:'Kanit',sans-serif; font-weight:600; font-size:13px;
      border:none; border-radius:10px; cursor:pointer; transition:all 0.3s; letter-spacing:0.5px; text-align:center;
    }
    .btn-primary { background:linear-gradient(135deg,#00c6ff,#0072ff); color:#fff; }
    .btn-success { background:linear-gradient(135deg,#00b09b,#96c93d); color:#fff; }
    .btn-danger { background:linear-gradient(135deg,#ff416c,#ff4b2b); color:#fff; }
    .btn-warning { background:linear-gradient(135deg,#f7971e,#ffd200); color:#1a1a2e; }
    .btn-outline { background:transparent; border:2px solid var(--neon-blue); color:var(--neon-blue); }
    .btn-gold { background:linear-gradient(135deg,#ffd700,#ffaa00); color:#1a1a2e; font-weight:700; }
    .btn-pink { background:linear-gradient(135deg,#ff006e,#ff4b8b); color:#fff; }
    .btn-sm { padding:7px 12px; font-size:11px; border-radius:7px; }
    .btn:disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }
    .stats-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:rgba(0,0,0,0.4); border-radius:10px; margin-bottom:8px; font-size:12px; color:var(--text-medium); flex-wrap:wrap; gap:5px; }
    .stat-value { font-weight:700; color:var(--neon-blue); } .stat-gold { font-weight:700; color:var(--neon-yellow); }
    .badge { display:inline-block; padding:4px 10px; border-radius:12px; font-size:10px; font-weight:600; }
    .badge-gold { background:rgba(255,230,0,0.15); color:var(--neon-yellow); border:1px solid var(--neon-yellow); }
    .badge-green { background:rgba(57,255,20,0.15); color:var(--neon-green); border:1px solid var(--neon-green); }
    .badge-blue { background:rgba(0,240,255,0.15); color:var(--neon-blue); border:1px solid var(--neon-blue); }
    .class-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .class-card { background:var(--glass); border:2px solid var(--glass-border); border-radius:14px; padding:14px; cursor:pointer; transition:all 0.3s; text-align:center; }
    .class-card:hover { border-color:var(--neon-yellow); transform:translateY(-3px); }
    .class-card.selected { border-color:var(--neon-green); background:rgba(57,255,20,0.1); }
    .class-card.locked { opacity:0.5; cursor:not-allowed; } .class-card.locked:hover { transform:none; border-color:var(--glass-border); }
    .class-emoji { font-size:48px; display:block; margin-bottom:6px; }
    .class-name { font-weight:700; color:var(--text-bright); font-size:15px; }
    .class-desc { font-size:10px; color:var(--text-dim); margin-top:4px; line-height:1.4; }
    .chapter-container { margin-bottom:8px; }
    .chapter-header { background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:all 0.3s; }
    .chapter-header:hover { border-color:var(--neon-blue); }
    .chapter-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.2); flex-shrink:0; }
    .chapter-info { flex:1; } .chapter-name { font-weight:600; color:var(--text-bright); font-size:13px; }
    .chapter-progress { font-size:10px; color:var(--text-dim); }
    .level-list { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:5px 0 0 50px; }
    .level-btn { padding:8px 6px; border-radius:8px; border:1px solid var(--glass-border); background:rgba(0,0,0,0.3); color:var(--text-bright); cursor:pointer; font-size:10px; transition:all 0.3s; text-align:center; font-family:'Kanit',sans-serif; }
    .level-btn:hover { border-color:var(--neon-green); } .level-btn.completed { border-color:var(--neon-green); background:rgba(57,255,20,0.15); }
    .level-btn.current { border-color:var(--neon-yellow); }
    .battle-scene { background:rgba(0,0,0,0.5); border-radius:14px; padding:16px; border:1px solid var(--glass-border); margin-bottom:10px; text-align:center; }
    .emoji-display { font-size:60px; display:inline-block; transition:transform 0.3s; }
    .emoji-display.shake { animation:emojiShake 0.4s ease-in-out; } .emoji-display.crit { animation:emojiCrit 0.5s ease-out; }
    @keyframes emojiShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    @keyframes emojiCrit { 0%{transform:scale(1)} 30%{transform:scale(1.8) rotate(-10deg)} 60%{transform:scale(1.1) rotate(5deg)} 100%{transform:scale(1)} }
    .combatants-row { display:flex; align-items:center; justify-content:space-around; gap:10px; flex-wrap:wrap; }
    .combatant { text-align:center; min-width:90px; } .combatant-name { color:var(--text-bright); font-weight:600; font-size:13px; margin-top:4px; } .combatant-name.boss { color:var(--neon-pink); }
    .hp-bar-outer { background:#1a1a2e; border-radius:8px; height:10px; overflow:hidden; border:1px solid var(--glass-border); margin-top:4px; width:100%; max-width:130px; margin:0 auto; }
    .hp-bar-inner { height:100%; border-radius:8px; transition:width 0.4s; background:linear-gradient(90deg,#00f0ff,#00c6ff); box-shadow:0 0 10px rgba(0,240,255,0.5); }
    .hp-bar-inner.boss-hp { background:linear-gradient(90deg,#ff006e,#ff4b2b); box-shadow:0 0 10px rgba(255,0,110,0.5); }
    .hp-text { font-size:10px; color:var(--text-dim); margin-top:2px; }
    .vs-badge { font-family:'Orbitron',sans-serif; font-weight:900; font-size:24px; color:var(--neon-yellow); text-shadow:0 0 15px rgba(255,230,0,0.7); }
    .timer-bar-outer { background:#1a1a2e; border-radius:6px; height:10px; overflow:hidden; border:1px solid var(--glass-border); margin-top:8px; }
    .timer-bar-inner { height:100%; border-radius:6px; transition:width 0.1s linear; background:var(--neon-yellow); }
    .timer-text { font-size:11px; color:var(--neon-yellow); font-weight:700; text-align:center; margin-top:2px; }
    .question-panel { background:rgba(0,0,0,0.5); border-radius:14px; padding:16px; border:1px solid var(--glass-border); margin-bottom:10px; }
    .question-display { font-size:18px; font-weight:700; color:var(--text-bright); text-align:center; margin-bottom:10px; line-height:1.6; }
    .answer-input-row { display:flex; gap:8px; } .answer-input { flex:1; padding:12px 16px; font-size:17px; font-weight:600; text-align:center; border-radius:10px; border:2px solid var(--glass-border); background:rgba(0,0,0,0.5); color:var(--text-bright); outline:none; font-family:'Kanit',sans-serif; }
    .answer-input:focus { border-color:var(--neon-blue); box-shadow:0 0 15px rgba(0,240,255,0.3); }
    .combo-display { text-align:center; font-weight:700; font-size:14px; margin-top:6px; min-height:20px; color:var(--neon-yellow); }
    .feedback-msg { font-size:11px; text-align:center; margin-top:4px; min-height:15px; color:var(--text-dim); }
    .shop-item { background:var(--glass); border:1px solid var(--glass-border); border-radius:12px; padding:12px; margin-bottom:7px; display:flex; justify-content:space-between; align-items:center; }
    .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center; z-index:1000; }
    .modal-content { background:var(--card-bg); border-radius:18px; padding:26px; max-width:440px; width:90%; border:2px solid var(--neon-blue); text-align:center; }
    .flex-row { display:flex; gap:7px; flex-wrap:wrap; } .flex-col { display:flex; flex-direction:column; gap:6px; }
    .text-sm { font-size:10px; } .mt-1 { margin-top:3px; } .mt-2 { margin-top:6px; } .mt-4 { margin-top:12px; } .w-full { width:100%; }
    @media (max-width:600px) { .class-grid { grid-template-columns:1fr; } .level-list { grid-template-columns:1fr 1fr; padding-left:0; } .emoji-display { font-size:44px; } .game-title { font-size:1.2em; } }
  </style>
</head>
<body>
<div class="main-container">
  <div class="game-wrapper">
    <div class="game-header">
      <div class="creator-badge">⚡ ตะวันสุดหล่อ ⚡</div>
      <div class="game-title">MATH QUEST</div>
      <div class="subtitle">พิชิตจักรวาลคณิตศาสตร์ ม.2 | Stable Edition</div>
    </div>
    <div class="game-content" id="gameContent"></div>
  </div>
</div>
<div id="modalContainer"></div>
<script>
  // ─── AUDIO ENGINE ──────────────────────────────
  let audioCtx = null, bgMusicGain = null, bgMusicOsc = null, isMusicPlaying = false;
  function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  function playSound(f,t='sine',d=0.14,v=0.05){ try{ initAudio(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t; o.frequency.setValueAtTime(f,audioCtx.currentTime); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); } catch(e){} }
  function sfxClick(){ playSound(600,'sine',0.07,0.04); } function sfxCorrect(){ playSound(700,'triangle',0.14,0.07); setTimeout(()=>playSound(1100,'triangle',0.14,0.07),90); }
  function sfxWrong(){ playSound(140,'sawtooth',0.2,0.04); } function sfxCrit(){ playSound(350,'square',0.2,0.06); setTimeout(()=>playSound(800,'square',0.2,0.09),80); }
  function sfxWin(){ [500,700,900,1100].forEach((f,i)=>setTimeout(()=>playSound(f,'triangle',0.18,0.07),i*110)); }
  function sfxPurchase(){ playSound(900,'triangle',0.25,0.08); } function sfxGacha(){ [300,500,700,900,1100].forEach((f,i)=>setTimeout(()=>playSound(f,'triangle',0.18,0.07),i*70)); }
  function startBgMusic(){ if(isMusicPlaying) return; try{ initAudio(); bgMusicGain=audioCtx.createGain(); bgMusicGain.gain.setValueAtTime(0.012,audioCtx.currentTime); bgMusicGain.connect(audioCtx.destination); bgMusicOsc=audioCtx.createOscillator(); bgMusicOsc.type='triangle'; bgMusicOsc.frequency.setValueAtTime(200,audioCtx.currentTime); bgMusicOsc.connect(bgMusicGain); bgMusicOsc.start(); isMusicPlaying=true; let t=0; const mod=()=>{ if(!isMusicPlaying) return; t+=0.08; bgMusicOsc.frequency.setValueAtTime(200+Math.sin(t)*25,audioCtx.currentTime); if(isMusicPlaying) requestAnimationFrame(mod); }; mod(); } catch(e){} }
  function stopBgMusic(){ try{ if(bgMusicOsc){ bgMusicOsc.stop(); bgMusicOsc=null; } if(bgMusicGain){ bgMusicGain.disconnect(); bgMusicGain=null; } isMusicPlaying=false; } catch(e){} }

  // ─── GAME DATA ──────────────────────────────
  const chapterData = [
    { id:1, name:'บทที่ 1: เลขยกกำลัง', icon:'⚡', bossEmoji:'🐉' },
    { id:2, name:'บทที่ 2: พหุนาม', icon:'📐', bossEmoji:'🧙‍♂️' },
    { id:3, name:'บทที่ 3: แยกตัวประกอบ', icon:'🧩', bossEmoji:'🤖' },
    { id:4, name:'บทที่ 4: ความเท่ากันทุกประการ', icon:'🔷', bossEmoji:'👾' },
    { id:5, name:'บทที่ 5: พีทาโกรัส', icon:'📏', bossEmoji:'💀' },
    { id:6, name:'บทที่ 6: สถิติ', icon:'📊', bossEmoji:'🦊' },
    { id:7, name:'บทที่ 7: ปริมาตรและความน่าจะเป็น', icon:'🎲', bossEmoji:'🐲' }
  ];

  const classDefs = {
    warrior: { name:'นักรบ', emoji:'🦸', desc:'DMG+35% HP+20\n⚔️สกิล1:ฟันดาบ(DMG×2)\n🛡️สกิล2:ตั้งรับ', hpBonus:20, dmgMul:1.35, skill1:{name:'⚔️ฟันดาบ',cd:3,type:'dmg',mul:2,cost:12}, skill2:{name:'🛡️ตั้งรับ',cd:4,type:'shield',cost:10} },
    mage: { name:'จอมเวทย์', emoji:'🧙', desc:'คริ+25% คริดาเมจ4x\n🔥สกิล1:ลูกไฟ(คริ)\n💚สกิล2:ฮีล(+45)', hpBonus:0, dmgMul:1.0, critBonus:0.25, critMul:4, skill1:{name:'🔥ลูกไฟ',cd:4,type:'gcrit',mul:2.5,cost:14}, skill2:{name:'💚ฮีล',cd:3,type:'heal',heal:45,cost:12} },
    rogue: { name:'โจร', emoji:'🥷', desc:'คริ+15% คอมโบ×1.5\n🗡️สกิล1:ลอบสังหาร\n💨สกิล2:หลบหลีก', hpBonus:-8, dmgMul:1.0, critBonus:0.15, comboMul:1.5, skill1:{name:'🗡️ลอบสังหาร',cd:3,type:'cboost',mul:3,cost:13}, skill2:{name:'💨หลบหลีก',cd:5,type:'dodge',cost:15} }
  };
  const gachaClassDefs = {
    paladin: { name:'พาลาดิน', emoji:'🛡️', desc:'HP+60 DMG+25%\n✨สกิล1:แสงศักดิ์สิทธิ์\n🛡️สกิล2:โล่เทพ', hpBonus:60, dmgMul:1.25, skill1:{name:'✨แสงศักดิ์สิทธิ์',cd:3,type:'dmgheal',mul:2,heal:30,cost:18}, skill2:{name:'🛡️โล่เทพ',cd:4,type:'shieldheal',heal:25,cost:16} }
  };

  const petDefs = {
    dog: { name:'สุนัข', emoji:'🐕', cost:120, bonus:'dmg', amt:0.1, desc:'ดาเมจ +10%', shop:true },
    cat: { name:'แมวนำโชค', emoji:'🐱', cost:120, bonus:'crit', amt:0.08, desc:'คริติคอล +8%', shop:true },
    fox: { name:'จิ้งจอก', emoji:'🦊', cost:200, bonus:'combo', amt:0.6, desc:'คอมโบแรงขึ้น 60%', shop:true },
    phoenix: { name:'ฟีนิกซ์', emoji:'🦅', cost:350, bonus:'both', amt:0.12, desc:'DMG+12% คริ+12%', shop:true },
    dragon_pet: { name:'มังกรน้อย', emoji:'🐉', cost:600, bonus:'all', amt:0.18, desc:'DMG+18% คริ+18% คอมโบ+80%', shop:true },
    unicorn: { name:'ยูนิคอร์น', emoji:'🦄', bonus:'both', amt:0.2, desc:'DMG+20% คริ+20%', shop:false },
    shadow_wolf: { name:'หมาป่าเงา', emoji:'🐺', bonus:'dmg', amt:0.3, desc:'ดาเมจ +30%', shop:false },
  };
  const gachaPetPool = ['unicorn','shadow_wolf','phoenix_king','angel_cat','demon_fox','cosmic_dragon']; // บางตัวไม่มี def แต่ไม่เป็นไร
  const gachaClassPool = ['paladin','necromancer','berserker'];

  // ─── PLAYER STATE ──────────────────────────────
  let player = { name:'ผู้กล้า', hp:100, maxHp:100, score:0, gold:100, combo:0, maxCombo:0, tc:0, tw:0, shield:false, chapter:1, level:1, bossHp:200, bossMaxHp:200, exp:0, lv:1, rebirth:0, rebirthBonus:0 };
  let playerClass = 'warrior';
  let equippedPet = null;
  let inventory = { weapon:0, shield:0, helmet:0, armor:0, pants:0, shoes:0, orb:false, potion:0, superPotion:0 };
  let ownedPets = [], ownedGachaClasses = [], completedLevels = {}, bossDefeated = [];
  let skillCD = { s1:0, s2:0 }, skillActive = { gcrit:false, dodge:false, cboost:false, reflect:false, berserk:false }, skillUseCount = { s1:0, s2:0 };
  let timerInterval = null, timerRemaining = 0, currentQuestion = null, storyShown = {}, highScores = [];

  function getCD(){ const all = {...classDefs, ...gachaClassDefs}; return all[playerClass] || classDefs['warrior']; }
  function getMaxHp(){ return 100 + (getCD().hpBonus||0) + (player.lv-1)*5 + inventory.shield*12 + inventory.helmet*5 + inventory.armor*8 + inventory.pants*6 + player.rebirthBonus*25; }
  function getDodgeChance(){ return inventory.shoes * 0.025; }
  function getPetBonus(){ if(!equippedPet||!petDefs[equippedPet]) return {dmg:0,crit:0,combo:0}; const p=petDefs[equippedPet]; const b={dmg:0,crit:0,combo:0}; if(p.bonus==='dmg')b.dmg=p.amt; if(p.bonus==='crit')b.crit=p.amt; if(p.bonus==='combo')b.combo=p.amt; if(p.bonus==='both'){b.dmg=p.amt;b.crit=p.amt;} if(p.bonus==='all'){b.dmg=p.amt;b.crit=p.amt;b.combo=p.amt;} return b; }
  function getWeaponMul(){ return 1 + inventory.weapon*0.2; }

  function loadGame(){
    try{
      const s=JSON.parse(localStorage.getItem('mq_stable'));
      if(s){ player=s.player||player; playerClass=s.playerClass||'warrior'; equippedPet=s.equippedPet||null; inventory=s.inventory||inventory; ownedPets=s.ownedPets||[]; ownedGachaClasses=s.ownedGachaClasses||[]; completedLevels=s.completedLevels||{}; bossDefeated=s.bossDefeated||[]; storyShown=s.storyShown||{}; player.maxHp=getMaxHp(); if(player.hp>player.maxHp)player.hp=player.maxHp; }
      const hs=JSON.parse(localStorage.getItem('mq_highscores_stable')); if(hs)highScores=hs;
    }catch(e){}
  }
  function saveGame(){
    localStorage.setItem('mq_stable',JSON.stringify({player:player,playerClass,equippedPet,inventory,ownedPets,ownedGachaClasses,completedLevels,bossDefeated,storyShown}));
    updateHighScore();
  }
  function updateHighScore(){
    const exist=highScores.findIndex(h=>h.name===player.name);
    if(exist>=0){ if(player.score>highScores[exist].score){ highScores[exist].score=player.score; highScores[exist].class=playerClass; } }
    else highScores.push({name:player.name,score:player.score,class:playerClass});
    highScores.sort((a,b)=>b.score-a.score); highScores=highScores.slice(0,10);
    localStorage.setItem('mq_highscores_stable',JSON.stringify(highScores));
  }
  function addExp(amt){ player.exp+=amt; const need=player.lv*80+player.rebirth*40; if(player.exp>=need){ player.exp-=need; player.lv++; player.maxHp=getMaxHp(); player.hp=player.maxHp; } }
  function addGold(amt){ player.gold+=amt; } function spendGold(amt){ if(player.gold>=amt){ player.gold-=amt; return true; } return false; }
  function isCompleted(ch,l){ return completedLevels[ch]?.includes(l); }
  function unlockNext(ch,l){ if(!completedLevels[ch])completedLevels[ch]=[]; if(!completedLevels[ch].includes(l))completedLevels[ch].push(l); if(l===3&&!bossDefeated.includes(ch))bossDefeated.push(ch); addExp(l===3?50:15); saveGame(); }

  // ─── QUESTION GENERATOR (FIXED) ─────────────────
  function r(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function genQuestion(chapterId, difficulty){
    const ch = chapterId; const d = difficulty||1;
    let q='', a='', h='';
    if(ch===1){
      if(d===1){ const b=r(2,4), e1=r(2,3), e2=r(1,2); q=`${b}<sup>${e1}</sup> × ${b}<sup>${e2}</sup> = ${b}<sup>?</sup>`; a=e1+e2; h='a^m × a^n = a^(m+n)'; }
      else if(d===2){ const b=r(2,5), e=r(2,3); q=`(${b}<sup>${e}</sup>)<sup>2</sup> = ${b}<sup>?</sup>`; a=e*2; h='(a^m)^n = a^(m×n)'; }
      else { const b=r(2,4), e1=r(3,4), e2=r(1,2); q=`${b}<sup>${e1}</sup> ÷ ${b}<sup>${e2}</sup> = ${b}<sup>?</sup>`; a=e1-e2; h='a^m ÷ a^n = a^(m-n)'; }
    } else if(ch===2){
      const a1=r(2,5), b1=r(1,5), x=r(1,3);
      if(d<=1){ q=`(${a1}x + ${b1}) + (${a1*2}x - ${b1}) เมื่อ x=${x} = ?`; a=(a1*x+b1)+(a1*2*x-b1); }
      else if(d===2){ const a2=r(3,5), b2=r(2,4); q=`(${a2}x + ${b2})(${a2}x - ${b2}) เมื่อ x=1 = ?`; a=(a2+b2)*(a2-b2); }
      else { const a3=r(2,4), b3=r(1,3), c3=r(1,2); q=`(${a3}x² + ${b3}x + ${c3}) + (${a3*2}x² - ${b3}x + ${c3*2}) เมื่อ x=1 = ?`; a=(a3+b3+c3)+(a3*2-b3+c3*2); }
    } else if(ch===3){
      const n=r(2,5);
      if(d<=1){ q=`x² + ${2*n}x + ${n*n} = (x + ?)²`; a=n; }
      else if(d===2){ q=`x² - ${2*n}x + ${n*n} = (x - ?)²`; a=n; }
      else { const m=r(3,6); q=`x² - ${m*m} = (x + ${m})(x - ?)`; a=m; }
    } else if(ch===4){
      if(d<=1){ const s=r(4,10); q=`สามเหลี่ยมด้านเท่า ด้าน=${s} ซม. ด้านอื่นยาว?`; a=s; }
      else if(d===2){ const ang=r(40,70); q=`สามเหลี่ยมหน้าจั่วมีมุมยอด ${ang}° มุมฐาน=?`; a=Math.round((180-ang)/2); }
      else { const a1=r(3,6), b1=r(3,6); const c=Math.sqrt(a1*a1+b1*b1); q=`สามเหลี่ยมมุมฉากด้าน ${a1},${b1} ด้านฉาก=?`; a=Math.round(c*10)/10; }
    } else if(ch===5){
      if(d<=1){ const m=r(1,2); q=`สามเหลี่ยมด้าน ${3*m},${4*m} ด้านฉาก=?`; a=5*m; }
      else { const l1=r(5,8), l2=r(5,10); const c=Math.sqrt(l1*l1+l2*l2); q=`ด้านฉากของสามเหลี่ยมที่มีด้าน ${l1},${l2} คือ?`; a=Math.round(c*10)/10; }
    } else if(ch===6){
      const nums=[r(10,30),r(20,50),r(30,60)];
      if(d<=1){ const avg=Math.round((nums[0]+nums[1]+nums[2])/3*10)/10; q=`ค่าเฉลี่ยของ ${nums.join(', ')} = ?`; a=avg; }
      else { const nums2=[r(20,40),r(30,60),r(40,80),r(25,55),r(15,45)].sort((a,b)=>a-b); q=`มัธยฐานของ ${nums2.join(', ')} = ?`; a=nums2[2]; }
    } else {
      if(d<=1){ const r1=r(2,4), h1=r(5,10); q=`ทรงกระบอก r=${r1}, h=${h1}, π≈3.14 ปริมาตร=?`; a=Math.round(3.14*r1*r1*h1); }
      else { q='ทอยลูกเต๋า 2 ลูก ผลรวม=7 ความน่าจะเป็น? (ตอบ a/b)'; a='1/6'; }
    }
    return {q, a:String(a), h};
  }

  // ─── SCREEN RENDERERS ─────────────────────────
  function renderScreen(name){
    stopTimer();
    const c = document.getElementById('gameContent');
    if(name==='menu') c.innerHTML = renderMenu();
    else if(name==='classSelect') c.innerHTML = renderClassSelect();
    else if(name==='chapters') c.innerHTML = renderChapters();
    else if(name==='battle') { c.innerHTML = renderBattle(); setupBattle(); startBgMusic(); }
    else if(name==='shop') c.innerHTML = renderShop();
    else if(name==='petShop') c.innerHTML = renderPetShop();
    else if(name==='gachaPet') c.innerHTML = renderGacha('pet');
    else if(name==='gachaClass') c.innerHTML = renderGacha('class');
    else if(name==='equipUpgrade') c.innerHTML = renderEquipUpgrade();
    else if(name==='inventory') c.innerHTML = renderInventory();
    else if(name==='leaderboard') c.innerHTML = renderLeaderboard();
    else c.innerHTML = renderMenu();
  }

  function renderMenu(){
    stopBgMusic();
    const cd=getCD(); const petInfo=equippedPet&&petDefs[equippedPet]?petDefs[equippedPet].emoji+' '+petDefs[equippedPet].name:'ไม่มี';
    return `<div class="flex-col" style="gap:7px;">
      <div style="text-align:center;color:var(--text-bright);font-size:15px;">🎮 ${player.name} | ${cd.emoji} ${cd.name} <span class="badge badge-blue">เกิดใหม่:${player.rebirth}</span></div>
      <div class="stats-bar"><span>⭐${player.score.toLocaleString()}</span><span>🪙<span class="stat-gold">${player.gold}</span></span><span>Lv.<span class="stat-value">${player.lv}</span></span><span>🐾${petInfo}</span></div>
      <button class="btn btn-primary w-full" onclick="renderScreen('chapters')">⚔️ เข้าสู่การผจญภัย</button>
      <button class="btn btn-outline w-full" onclick="renderScreen('inventory')">🎒 กระเป๋า</button>
      <button class="btn btn-outline w-full" onclick="renderScreen('shop')">🛒 ร้านค้า</button>
      <button class="btn btn-outline w-full" onclick="renderScreen('petShop')">🐾 ร้านสัตว์เลี้ยง</button>
      <button class="btn btn-gold w-full" onclick="renderScreen('gachaPet')">🎰 กาชาสัตว์เลี้ยง (250🪙)</button>
      <button class="btn btn-pink w-full" onclick="renderScreen('gachaClass')">💎 กาชาคลาส (600🪙)</button>
      <button class="btn btn-outline w-full" onclick="renderScreen('equipUpgrade')">🔧 อัพเกรดอุปกรณ์</button>
      <button class="btn btn-outline w-full" onclick="renderScreen('classSelect')">🔄 เปลี่ยนคลาส</button>
      <button class="btn btn-outline w-full" onclick="renderScreen('leaderboard')">🏆 ลีดเดอร์บอร์ด</button>
      <div class="flex-row" style="justify-content:center;gap:4px;"><button class="btn btn-sm btn-outline" onclick="changeName()">✏️ชื่อ</button><button class="btn btn-sm btn-danger" onclick="resetGame()">🔄รีเซ็ต</button></div>
    </div>`;
  }

  function renderInventory(){
    const cd=getCD(); let h='<h3 style="color:var(--text-bright);text-align:center;">🎒 กระเป๋า</h3>';
    h+=`<div class="shop-item"><b>🦸 คลาส:</b> ${cd.emoji} ${cd.name}</div>`;
    h+=`<div class="shop-item"><b>🐾 สัตว์เลี้ยง:</b> ${equippedPet&&petDefs[equippedPet]?petDefs[equippedPet].emoji+' '+petDefs[equippedPet].name:'ไม่มี'}</div>`;
    h+=`<div class="shop-item">⚔️ดาบ Lv.${inventory.weapon} <span class="text-sm">(DMG+${inventory.weapon*20}%)</span></div>`;
    h+=`<div class="shop-item">🛡️โล่ Lv.${inventory.shield} <span class="text-sm">(HP+${inventory.shield*12})</span></div>`;
    h+=`<div class="shop-item">⛑️หมวก Lv.${inventory.helmet} <span class="text-sm">(HP+${inventory.helmet*5})</span></div>`;
    h+=`<div class="shop-item">👕เกราะ Lv.${inventory.armor} <span class="text-sm">(HP+${inventory.armor*8})</span></div>`;
    h+=`<div class="shop-item">👖กางเกง Lv.${inventory.pants} <span class="text-sm">(HP+${inventory.pants*6})</span></div>`;
    h+=`<div class="shop-item">👟รองเท้า Lv.${inventory.shoes} <span class="text-sm">(หลบ ${(inventory.shoes*2.5).toFixed(1)}%)</span></div>`;
    h+=`<button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙 กลับ</button>`;
    return h;
  }

  function renderClassSelect(){
    let h='<h3 style="color:var(--text-bright);text-align:center;">🎭 เลือกคลาส</h3><div class="class-grid">';
    const all={...classDefs}; ownedGachaClasses.forEach(k=>{ if(gachaClassDefs[k]) all[k]=gachaClassDefs[k]; });
    for(const[k,d] of Object.entries(all)){
      const unlocked = d.unlock ? bossDefeated.includes(d.unlock.chapter) : true;
      h+=`<div class="class-card ${playerClass===k?'selected':''} ${!unlocked?'locked':''}" onclick="${unlocked?`selectClass('${k}')`:'showLockedMsg()'}"><span class="class-emoji">${d.emoji}</span><div class="class-name">${d.name}</div><div class="class-desc">${d.desc.replace(/\n/g,'<br>')}</div>${playerClass===k?'<span class="badge badge-green">✅</span>':''}</div>`;
    }
    h+='</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
    return h;
  }
  function selectClass(k){ const all={...classDefs,...gachaClassDefs}; if(!all[k]) return; playerClass=k; player.maxHp=getMaxHp(); player.hp=player.maxHp; saveGame(); renderScreen('classSelect'); sfxClick(); }

  function renderChapters(){
    let h='<div class="flex-col" style="gap:6px;">';
    chapterData.forEach(ch=>{
      const prog=(completedLevels[ch.id]||[]).length;
      h+=`<div class="chapter-container"><div class="chapter-header" onclick="toggleChapterDetail(${ch.id})"><div class="chapter-icon">${ch.icon}</div><div class="chapter-info"><div class="chapter-name">${ch.name}</div><div class="chapter-progress">ผ่าน ${prog}/3 ด่าน</div></div><span>${prog>=3?'✅':'🔓'}</span></div><div class="level-list" id="levelList-${ch.id}" style="display:none;">${[1,2,3].map(l=>`<button class="level-btn ${isCompleted(ch.id,l)?'completed':'current'}" onclick="startBattle(${ch.id},${l})">ด.${l}${l===3?'👑':''}</button>`).join('')}</div></div>`;
    });
    h+='</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
    return h;
  }
  function toggleChapterDetail(id){ const el=document.getElementById('levelList-'+id); if(el) el.style.display=el.style.display==='none'?'grid':'none'; }

  function renderBattle(){
    const cd=getCD(); const ch=chapterData.find(c=>c.id===player.chapter)||chapterData[0];
    const bossEmoji=player.level===3?ch.bossEmoji:'👾'; const petInfo=equippedPet&&petDefs[equippedPet]?petDefs[equippedPet].emoji:'';
    const timeLimit = player.level===3?30:25;
    return `<div class="battle-scene">
      <div class="stats-bar mb-2"><span class="badge badge-blue">${ch.icon} ${ch.name} ด.${player.level}</span><span class="badge badge-gold" id="comboBadge">🔥0</span></div>
      <div class="combatants-row"><div class="combatant"><div class="emoji-display" id="playerEmoji">${cd.emoji}</div><div class="combatant-name">${player.name}${petInfo?'🐾'+petInfo:''}</div><div class="hp-bar-outer"><div class="hp-bar-inner" id="playerHpBar" style="width:100%;"></div></div><div class="hp-text">❤️<span id="playerHpText">${player.hp}/${player.maxHp}</span></div></div><div class="vs-badge">VS</div><div class="combatant"><div class="emoji-display" id="bossEmoji">${bossEmoji}</div><div class="combatant-name boss">บอส</div><div class="hp-bar-outer"><div class="hp-bar-inner boss-hp" id="bossHpBar" style="width:100%;"></div></div><div class="hp-text">❤️<span id="bossHpText">${player.bossHp}/${player.bossMaxHp}</span></div></div></div>
      <div class="timer-bar-outer mt-2"><div class="timer-bar-inner" id="timerBar" style="width:100%;"></div></div><div class="timer-text" id="timerText">⏱ ${timeLimit}s</div>
    </div>
    <div class="question-panel"><div class="question-display" id="questionDisplay">...</div><div class="answer-input-row"><input class="answer-input" id="answerInput" placeholder="พิมพ์คำตอบ..." autocomplete="off"><button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">⚡</button></div><div class="combo-display" id="comboDisplay"></div><div class="feedback-msg" id="feedbackMsg"></div></div>
    <div class="flex-row" style="gap:5px;"><button class="btn btn-sm btn-warning" onclick="useSkill('s1')" id="btnS1">${cd.skill1.name}(${cd.skill1.cost}🪙) <span id="s1Count">3</span></button><button class="btn btn-sm btn-success" onclick="useSkill('s2')" id="btnS2">${cd.skill2.name}(${cd.skill2.cost}🪙) <span id="s2Count">3</span></button><button class="btn btn-sm btn-danger" onclick="skipQuestion()">⏩ข้าม</button></div>
    <div class="text-sm text-center mt-1" style="color:var(--text-dim);" id="cdIndicator"></div>
    ${inventory.potion>0?`<button class="btn btn-sm btn-outline w-full mt-2" onclick="usePotion()">🧪โพชั่น(${inventory.potion})</button>`:''}
    ${inventory.superPotion>0?`<button class="btn btn-sm btn-warning w-full mt-1" onclick="useSuperPotion()">💜ซุปเปอร์(${inventory.superPotion})</button>`:''}
    <button class="btn btn-outline w-full mt-2" onclick="flee()">🏃หนี</button>`;
  }

  function setupBattle(){
    player.hp=player.maxHp; player.combo=0; player.shield=false; skillCD={s1:0,s2:0}; skillActive={gcrit:false,dodge:false,cboost:false,reflect:false,berserk:false}; skillUseCount={s1:0,s2:0};
    const baseHp=180+player.chapter*30+player.level*60+player.rebirth*40; player.bossMaxHp=baseHp; player.bossHp=baseHp;
    updateBattleUI(); updateCDUI(); nextQuestion();
    document.getElementById('answerInput').focus();
  }

  function nextQuestion(){
    if(player.bossHp<=0||player.hp<=0){ endBattle(); return; }
    const cd=getCD(); if(cd.regen&&player.hp<player.maxHp){ player.hp=Math.min(player.maxHp,player.hp+cd.regen); updateBattleUI(); }
    currentQuestion=genQuestion(player.chapter,player.level);
    document.getElementById('questionDisplay').innerHTML=currentQuestion.q;
    const inp=document.getElementById('answerInput'); inp.value=''; inp.disabled=false; inp.className='answer-input'; inp.focus();
    document.getElementById('submitBtn').disabled=false;
    document.getElementById('feedbackMsg').textContent=''; document.getElementById('comboDisplay').textContent='';
    updateCDUI(); startTimer();
  }

  function startTimer(){ stopTimer(); const limit=player.level===3?30:25; timerRemaining=limit; updateTimerUI(limit); timerInterval=setInterval(()=>{ timerRemaining--; updateTimerUI(limit); if(timerRemaining<=0){ stopTimer(); timeUp(); } },1000); }
  function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
  function updateTimerUI(limit){ const bar=document.getElementById('timerBar'), txt=document.getElementById('timerText'); if(bar)bar.style.width=Math.max(0,(timerRemaining/limit)*100)+'%'; if(txt){ txt.textContent=`⏱ ${timerRemaining}s`; txt.style.color=timerRemaining<=5?'var(--neon-pink)':'var(--neon-yellow)'; } }
  function timeUp(){ document.getElementById('answerInput').disabled=true; document.getElementById('submitBtn').disabled=true; handleWrongAnswer(null,true); }

  function submitAnswer(){
    stopTimer(); const inp=document.getElementById('answerInput'); if(!inp||!currentQuestion) return;
    const ua=inp.value.trim(); if(ua==='') return;
    inp.disabled=true; document.getElementById('submitBtn').disabled=true;
    const ca=String(currentQuestion.a); let correct=ua===ca;
    if(!correct&&!isNaN(parseFloat(ua))&&!isNaN(parseFloat(ca))) correct=Math.abs(parseFloat(ua)-parseFloat(ca))<0.09;
    if(correct){ inp.classList.add('correct-flash'); setTimeout(()=>inp.classList.remove('correct-flash'),500); handleCorrect(inp); }
    else { inp.classList.add('wrong-flash'); setTimeout(()=>inp.classList.remove('wrong-flash'),500); handleWrongAnswer(inp,false); }
  }

  function handleCorrect(inp){
    sfxCorrect(); player.combo++; player.tc++; if(player.combo>player.maxCombo)player.maxCombo=player.combo;
    const cd=getCD(); const pb=getPetBonus();
    let dmg=20+player.combo*5; dmg=Math.round(dmg*cd.dmgMul*getWeaponMul()*(1+pb.dmg));
    if(player.combo>=5&&cd.comboMul)dmg=Math.round(dmg*cd.comboMul); if(player.combo>=5&&pb.combo>0)dmg=Math.round(dmg*(1+pb.combo));
    let critC=0.06+(cd.critBonus||0)+pb.crit+(inventory.orb?0.2:0); let isCrit=Math.random()<critC;
    if(skillActive.gcrit){ isCrit=true; skillActive.gcrit=false; } if(skillActive.berserk)dmg=Math.round(dmg*2);
    if(isCrit){ dmg=Math.round(dmg*(cd.critMul||3)); sfxCrit(); document.getElementById('bossEmoji')?.classList.add('crit'); setTimeout(()=>document.getElementById('bossEmoji')?.classList.remove('crit'),500); }
    if(skillActive.cboost&&isCrit){ dmg=Math.round(dmg*(cd.skill1?.mul||3)); skillActive.cboost=false; }
    player.bossHp=Math.max(0,player.bossHp-dmg); const goldEarn=Math.round(15+player.combo*3+player.level*3); addGold(goldEarn); player.score+=Math.round(40+player.combo*5);
    document.getElementById('feedbackMsg').textContent=`✅ถูก! DMG:${dmg}${isCrit?'💥คริ!':''} | +${goldEarn}🪙`; document.getElementById('feedbackMsg').style.color='var(--neon-green)';
    if(player.combo>=3){ document.getElementById('comboDisplay').textContent=`🔥 COMBO x${player.combo}!`; document.getElementById('comboBadge').textContent=`🔥${player.combo}`; }
    updateBattleUI(); reduceCD(); saveGame(); setTimeout(nextQuestion,900);
  }

  function handleWrongAnswer(inp,isTimeUp){
    sfxWrong(); player.combo=0; player.tw++; let dmgTaken=8+player.level*2+(isTimeUp?6:0);
    if(skillActive.dodge){ skillActive.dodge=false; dmgTaken=0; document.getElementById('feedbackMsg').textContent='💨หลบได้!'; }
    else if(player.shield){ player.shield=false; if(skillActive.reflect){ skillActive.reflect=false; player.bossHp=Math.max(0,player.bossHp-20); document.getElementById('feedbackMsg').textContent='🛡️สะท้อน20!'; } else { dmgTaken=0; document.getElementById('feedbackMsg').textContent='🛡️ป้องกัน!'; } }
    else if(getDodgeChance()>0&&Math.random()<getDodgeChance()){ dmgTaken=0; document.getElementById('feedbackMsg').textContent='👟หลบด้วยรองเท้า!'; }
    else { player.hp=Math.max(0,player.hp-dmgTaken); document.getElementById('feedbackMsg').textContent=`❌ผิด!${isTimeUp?'⏱หมดเวลา!':''} ตอบ:${currentQuestion?.a} (-${dmgTaken}HP)`; document.getElementById('feedbackMsg').style.color='var(--neon-pink)'; }
    document.getElementById('comboBadge').textContent='🔥0'; document.getElementById('comboDisplay').textContent='';
    updateBattleUI(); reduceCD(); saveGame(); setTimeout(nextQuestion,1400);
  }

  function reduceCD(){ if(skillCD.s1>0)skillCD.s1--; if(skillCD.s2>0)skillCD.s2--; updateCDUI(); }
  function updateCDUI(){ const cd=getCD(); document.getElementById('cdIndicator').textContent=(skillCD.s1>0?`${cd.skill1.name} CD${skillCD.s1} `:'')+(skillCD.s2>0?`${cd.skill2.name} CD${skillCD.s2}`:''); document.getElementById('btnS1').disabled=skillCD.s1>0||player.gold<cd.skill1.cost||skillUseCount.s1>=3; document.getElementById('btnS2').disabled=skillCD.s2>0||player.gold<cd.skill2.cost||skillUseCount.s2>=3; document.getElementById('s1Count').textContent=3-skillUseCount.s1; document.getElementById('s2Count').textContent=3-skillUseCount.s2; }
  function updateBattleUI(){ document.getElementById('playerHpBar').style.width=Math.max(0,(player.hp/player.maxHp)*100)+'%'; document.getElementById('bossHpBar').style.width=Math.max(0,(player.bossHp/player.bossMaxHp)*100)+'%'; document.getElementById('playerHpText').textContent=`${player.hp}/${player.maxHp}`; document.getElementById('bossHpText').textContent=`${player.bossHp}/${player.bossMaxHp}`; document.getElementById('comboBadge').textContent=`🔥${player.combo}`; }

  function useSkill(type){ const cd=getCD(); if(type==='s1'){ if(skillCD.s1>0||!spendGold(cd.skill1.cost)||skillUseCount.s1>=3)return; skillUseCount.s1++; skillCD.s1=cd.skill1.cooldown; sfxPurchase(); if(cd.skill1.type==='gcrit')skillActive.gcrit=true; if(cd.skill1.type==='cboost')skillActive.cboost=true; if(cd.skill1.type==='dmg'){ const bd=Math.round(30*(cd.skill1.mul||2)); player.bossHp=Math.max(0,player.bossHp-bd); updateBattleUI(); } } else if(type==='s2'){ if(skillCD.s2>0||!spendGold(cd.skill2.cost)||skillUseCount.s2>=3)return; skillUseCount.s2++; skillCD.s2=cd.skill2.cooldown; sfxPurchase(); if(cd.skill2.type==='shield')player.shield=true; if(cd.skill2.type==='reflect'){ player.shield=true; skillActive.reflect=true; } if(cd.skill2.type==='heal'){ player.hp=Math.min(player.maxHp,player.hp+cd.skill2.heal); updateBattleUI(); } if(cd.skill2.type==='dodge')skillActive.dodge=true; if(cd.skill2.type==='berserk')skillActive.berserk=true; } updateCDUI(); saveGame(); }
  function skipQuestion(){ stopTimer(); player.hp=Math.max(0,player.hp-8); player.combo=0; updateBattleUI(); reduceCD(); document.getElementById('comboBadge').textContent='🔥0'; if(player.hp<=0)endBattle(); else nextQuestion(); }
  function usePotion(){ if(inventory.potion<=0)return; inventory.potion--; player.hp=player.maxHp; updateBattleUI(); saveGame(); }
  function useSuperPotion(){ if(inventory.superPotion<=0)return; inventory.superPotion--; player.hp=player.maxHp; player.bossHp=Math.max(0,player.bossHp-50); updateBattleUI(); saveGame(); }
  function endBattle(){ stopTimer(); stopBgMusic(); if(player.bossHp<=0){ sfxWin(); const goldR=Math.round(40+player.level*30); addGold(goldR); player.score+=Math.round(120+player.level*60); unlockNext(player.chapter,player.level); saveGame(); setTimeout(()=>showModal('🎉ชัยชนะ!',`พิชิตบทที่ ${player.chapter} ด่าน ${player.level}!\n+${goldR}🪙`,()=>renderScreen('chapters')),700); } else { player.gold=Math.max(0,player.gold-10); saveGame(); showModal('💀พ่ายแพ้','เสีย 10🪙',()=>renderScreen('chapters')); } }
  function startBattle(chapterId,levelId){ player.chapter=chapterId; player.level=levelId; player.maxHp=getMaxHp(); player.hp=player.maxHp; player.combo=0; player.shield=false; skillCD={s1:0,s2:0}; skillActive={gcrit:false,dodge:false,cboost:false,reflect:false,berserk:false}; skillUseCount={s1:0,s2:0}; renderScreen('battle'); }
  function flee(){ stopTimer(); stopBgMusic(); player.gold=Math.max(0,player.gold-10); saveGame(); renderScreen('chapters'); }

  // ─── SHOP & UPGRADES ─────────────────────────
  function renderShop(){ return `<h3 style="color:var(--text-bright);text-align:center;">🛒 ร้านค้า</h3><div class="stats-bar"><span>🪙<span class="stat-gold">${player.gold}</span></span></div><div class="shop-item"><div><b>🧪 โพชั่น</b><div class="text-sm">ฟื้น HP เต็ม</div></div><button class="btn btn-sm btn-primary" onclick="buyItem('potion')">80🪙(มี:${inventory.potion})</button></div><div class="shop-item"><div><b>💜 ซุปเปอร์โพชั่น</b><div class="text-sm">ฟื้นเต็ม+DMG50</div></div><button class="btn btn-sm btn-primary" onclick="buyItem('sp')">300🪙(มี:${inventory.superPotion})</button></div><div class="shop-item"><div><b>🔮 ลูกแก้วคริ</b><div class="text-sm">คริ+20%</div></div><button class="btn btn-sm ${inventory.orb?'btn-success':'btn-primary'}" onclick="buyItem('orb')" ${inventory.orb?'disabled':''}>${inventory.orb?'✅':'700🪙'}</button></div><button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙กลับ</button>`; }
  function buyItem(t){ const prices={potion:80,sp:300,orb:700}; if(spendGold(prices[t])){ if(t==='potion')inventory.potion++; else if(t==='sp')inventory.superPotion++; else inventory.orb=true; sfxPurchase(); saveGame(); renderScreen('shop'); } else showModal('⚠️','เหรียญไม่พอ!',null); }
  function renderEquipUpgrade(){ const costs={weapon:[0,300,700,1400,2500,4500],shield:[0,250,600,1200,2200,4000],helmet:[0,200,500,1000,1800,3200],armor:[0,300,700,1400,2500,4500],pants:[0,250,600,1200,2200,4000],shoes:[0,350,800,1600,3000,5000]}; const names={weapon:'⚔️ดาบ',shield:'🛡️โล่',helmet:'⛑️หมวก',armor:'👕เกราะ',pants:'👖กางเกง',shoes:'👟รองเท้า'}; const eff={weapon:l=>`DMG+${l*20}%`,shield:l=>`HP+${l*12}`,helmet:l=>`HP+${l*5}`,armor:l=>`HP+${l*8}`,pants:l=>`HP+${l*6}`,shoes:l=>`หลบ ${(l*2.5).toFixed(1)}%`}; let h='<h3 style="color:var(--text-bright);text-align:center;">🔧 อัพเกรด</h3><div class="stats-bar"><span>🪙<span class="stat-gold">'+player.gold+'</span></span></div>'; for(const[k,name]of Object.entries(names)){ const lv=inventory[k]; h+=`<div class="shop-item"><div><b>${name} Lv.${lv}</b><div class="text-sm">${eff[k](lv)} → Lv.${lv+1}: ${eff[k](lv+1)}</div></div>${lv<5?`<button class="btn btn-sm btn-primary" onclick="upgradeEquip('${k}')">${costs[k][lv+1]}🪙</button>`:'<span class="badge badge-gold">MAX</span>'}</div>`; } h+='<button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙กลับ</button>'; return h; }
  function upgradeEquip(t){ const costs={weapon:[0,300,700,1400,2500,4500],shield:[0,250,600,1200,2200,4000],helmet:[0,200,500,1000,1800,3200],armor:[0,300,700,1400,2500,4500],pants:[0,250,600,1200,2200,4000],shoes:[0,350,800,1600,3000,5000]}; const lv=inventory[t]; if(lv>=5||!spendGold(costs[t][lv+1])){ showModal('⚠️','ไม่สามารถอัพเกรดได้',null); return; } inventory[t]++; player.maxHp=getMaxHp(); player.hp=player.maxHp; sfxPurchase(); saveGame(); renderScreen('equipUpgrade'); }

  function renderPetShop(){ let h='<h3 style="color:var(--text-bright);text-align:center;">🐾 ร้านสัตว์เลี้ยง</h3><div class="stats-bar"><span>🪙<span class="stat-gold">'+player.gold+'</span></span></div><div class="class-grid">'; for(const[k,d]of Object.entries(petDefs)){ if(!d.shop)continue; const owned=ownedPets.includes(k); const eq=equippedPet===k; h+=`<div class="class-card"><span class="class-emoji">${d.emoji}</span><div class="class-name">${d.name}</div><div class="class-desc">${d.desc}</div>${owned?`<button class="btn btn-sm ${eq?'btn-success':'btn-outline'} w-full mt-2" onclick="equipPet('${k}')">${eq?'✅ติดตั้ง':'🎯ติดตั้ง'}</button>`:`<button class="btn btn-sm btn-primary w-full mt-2" onclick="buyPet('${k}')">${d.cost}🪙</button>`}</div>`; } h+='</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙กลับ</button>'; return h; }
  function buyPet(k){ const d=petDefs[k]; if(!d||ownedPets.includes(k))return; if(spendGold(d.cost)){ ownedPets.push(k); if(!equippedPet)equippedPet=k; sfxPurchase(); saveGame(); renderScreen('petShop'); showModal('🐾',`ได้ ${d.emoji} ${d.name}!`,null); } else showModal('⚠️','เหรียญไม่พอ!',null); }
  function equipPet(k){ if(!ownedPets.includes(k))return; equippedPet=equippedPet===k?null:k; saveGame(); renderScreen('petShop'); sfxClick(); }

  function renderGacha(type){ const isPet=type==='pet'; const cost=isPet?250:600; return `<h3 style="color:var(--text-bright);text-align:center;">${isPet?'🎰 กาชาสัตว์เลี้ยง':'💎 กาชาคลาส'}</h3><div class="stats-bar"><span>🪙<span class="stat-gold">${player.gold}</span></span></div><div class="gacha-card" style="border-color:var(--neon-yellow);"><div style="font-size:50px;" id="gachaDisplay">${isPet?'🐾':'💎'}</div><button class="btn btn-${isPet?'gold':'pink'} w-full mt-2" onclick="doGacha('${type}')">🎰 กาชา (${cost}🪙)</button></div><button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙กลับ</button>`; }
  function doGacha(type){ const cost=type==='pet'?250:600; if(!spendGold(cost)){ showModal('⚠️','เหรียญไม่พอ!',null); return; } sfxGacha(); if(type==='pet'){ const pool=gachaPetPool.filter(p=>!ownedPets.includes(p)); if(pool.length===0){ player.gold+=cost; showModal('🎉','มีครบทุกตัวแล้ว!',null); return; } const reward=pool[Math.floor(Math.random()*pool.length)]; ownedPets.push(reward); if(!equippedPet)equippedPet=reward; document.getElementById('gachaDisplay').textContent=petDefs[reward]?.emoji||'🐾'; } else { const pool=gachaClassPool.filter(c=>!ownedGachaClasses.includes(c)); if(pool.length===0){ player.gold+=cost; showModal('🎉','มีครบทุกคลาสแล้ว!',null); return; } const reward=pool[Math.floor(Math.random()*pool.length)]; ownedGachaClasses.push(reward); document.getElementById('gachaDisplay').textContent=gachaClassDefs[reward]?.emoji||'💎'; } saveGame(); }

  function renderLeaderboard(){ updateHighScore(); let h='<h3 style="color:var(--text-bright);text-align:center;">🏆 ลีดเดอร์บอร์ด</h3>'; highScores.forEach((e,i)=>{ const cd=classDefs[e.class]||{emoji:'🦸'}; h+=`<div class="shop-item"><div>${i+1}. ${e.name} <span class="badge badge-blue">${cd.emoji}</span></div><div style="color:var(--neon-yellow);">⭐${e.score.toLocaleString()}</div></div>`; }); h+='<button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙กลับ</button>'; return h; }

  function showModal(title,msg,cb){ document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="closeModal(${cb?'true':'false'})"><div class="modal-content" onclick="event.stopPropagation()"><h3 style="color:var(--neon-blue);">${title}</h3><p style="color:var(--text-bright);white-space:pre-line;">${msg}</p><button class="btn btn-primary" onclick="closeModal(${cb?'true':'false'})">ตกลง</button></div></div>`; window._mcb=cb; }
  function closeModal(hc){ document.getElementById('modalContainer').innerHTML=''; if((hc===true||hc==='true')&&window._mcb)setTimeout(window._mcb,150); window._mcb=null; }
  function changeName(){ const n=prompt('ชื่อใหม่:',player.name); if(n&&n.trim()){ player.name=n.trim(); saveGame(); renderScreen('menu'); } }
  function resetGame(){ if(confirm('รีเซ็ตทั้งหมด?')){ localStorage.removeItem('mq_stable'); localStorage.removeItem('mq_highscores_stable'); location.reload(); } }
  function showLockedMsg(){ showModal('🔒','ยังปลดล็อคไม่ได้!',null); }
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const inp=document.getElementById('answerInput'); if(inp&&document.activeElement===inp)submitAnswer(); } });

  function init(){ loadGame(); player.maxHp=getMaxHp(); if(player.hp>player.maxHp)player.hp=player.maxHp; renderScreen('menu'); }
  init();
</script>
</body>
</html>
