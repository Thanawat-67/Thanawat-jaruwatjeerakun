<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>Sakura After Hours - 2D Anime Dating Sim</title>
<style>
  :root {
    --pink: #ff5c8d;
    --pink-glow: rgba(255, 92, 141, 0.55);
    --purple: #b565ff;
    --bg-dark: rgba(16, 10, 24, 0.88);
    --border-light: rgba(255, 180, 210, 0.35);
    --text-main: #fff5f8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0612;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text-main);
  }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
  }

  /* Top HUD */
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
    gap: 10px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--bg-dark);
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 10px 14px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    pointer-events: auto;
    min-width: 210px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
    gap: 10px;
  }

  .stat-row:last-child {
    margin-bottom: 0;
  }

  .bar-bg {
    flex: 1;
    height: 8px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  .fill-affection { background: linear-gradient(90deg, #ff7eb3, #ff3d77); }
  .fill-lust { background: linear-gradient(90deg, #c471f5, #fa71cd); }
  .fill-pleasure { background: linear-gradient(90deg, #ff9a44, #ff2a6d); }

  .top-controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    pointer-events: auto;
  }

  .btn-ui {
    background: var(--bg-dark);
    color: var(--text-main);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
  }

  .btn-ui:hover, .btn-ui.active {
    background: var(--pink);
    border-color: #fff;
    box-shadow: 0 0 12px var(--pink-glow);
  }

  /* Intimate Control Panel */
  #intimate-panel {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-dark);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 15;
    width: 170px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
  }

  .panel-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ff9ebb;
    text-align: center;
    margin-bottom: 2px;
    font-weight: 700;
  }

  /* Bottom Dialogue & Choice Box */
  #dialogue-wrapper {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(860px, 94vw);
    z-index: 12;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #choices-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .choice-btn {
    background: rgba(24, 14, 38, 0.92);
    border: 1px solid rgba(255, 130, 175, 0.5);
    color: #fff;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    backdrop-filter: blur(8px);

    padding: 18px 22px;

    cursor: pointer;

    color: #ffeef4;

    right: 18px;
    bottom: 12px;
    font-size: 12px;
    color: #ff9ebb;
    animation: pulse 1.2s infinite;
  }

  #touch-hint {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-dark);
    border: 1px solid var(--border-light);

    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 12;

  }

  @keyframes pulse {

// Audio Synthesizer (Web Audio API)
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq = 520, duration = 0.08, type = 'sine', gainVal = 0.06) {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + duration);
  }
  playHeartbeat() {
    this.playTone(95, 0.12, 'sine', 0.12);
    setTimeout(() => this.playTone(75, 0.16, 'sine', 0.09), 110);
  }
}

  for (let i = 0; i < 32; i++) {
    state.particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 2 + Math.random() * 5,
      vx: -0.3 + Math.random() * 0.6,
      vy: -0.4 - Math.random() * 0.8,
      alpha: 0.25 + Math.random() * 0.55,
      type: Math.random() > 0.35 ? 'circle' : 'heart'

  }

function setDialogue(speaker, text, choices = null) {

  const choicesEl = document.getElementById('choices-container');
  const nextInd = document.getElementById('next-indicator');

  if (choices && choices.length > 0) {
    nextInd.style.display = 'none';
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = c.text;
      btn.onclick = (e) => {
        e.stopPropagation();

// Background Renderer
function drawBackground(w, h, time) {
  let grad = ctx.createLinearGradient(0, 0, 0, h);
  if (state.sceneBg === 'room') {
    grad.addColorStop(0, '#1b1429');
    grad.addColorStop(1, '#331c38');
  } else if (state.sceneBg === 'balcony') {
    grad.addColorStop(0, '#090d26');
    grad.addColorStop(0.6, '#1c1842');
    grad.addColorStop(1, '#311b47');
  } else {
    // Candlelit Bedroom
    grad.addColorStop(0, '#240b1f');
    grad.addColorStop(0.5, '#471232');
    grad.addColorStop(1, '#1a0612');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Ambient Glow / Moon / Candlelight
  const glowX = state.sceneBg === 'balcony' ? w * 0.78 : w * 0.5;
  const glowY = state.sceneBg === 'balcony' ? h * 0.22 : h * 0.38;
  const glowR = Math.min(w, h) * (state.isHMode ? 0.55 + Math.sin(time * 6) * 0.04 : 0.45);
  const rad = ctx.createRadialGradient(glowX, glowY, 10, glowX, glowY, glowR);

  if (state.sceneBg === 'balcony') {
    rad.addColorStop(0, 'rgba(255, 240, 200, 0.35)');
    rad.addColorStop(1, 'rgba(255, 240, 200, 0)');
  } else {
    rad.addColorStop(0, 'rgba(255, 95, 150, 0.32)');
    rad.addColorStop(1, 'rgba(255, 60, 120, 0)');
  }
  ctx.fillStyle = rad;
  ctx.fillRect(0, 0, w, h);

  // Bed headboard / Window silhouette
  ctx.save();
  if (state.sceneBg === 'bedroom') {
    ctx.fillStyle = 'rgba(25, 6, 20, 0.65)';
    ctx.beginPath();
    ctx.roundRect(w * 0.15, h * 0.45, w * 0.7, h * 0.55, 30);
    ctx.fill();
  } else if (state.sceneBg === 'balcony') {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, h * 0.68);
    ctx.lineTo(w, h * 0.68);
    ctx.stroke();
  }
  ctx.restore();
}

// Helper for Heart Shape
function drawHeart(x, y, size, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.3);
  ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.45);
  ctx.bezierCurveTo(x - size, y + size * 0.9, x, y + size * 1.15, x, y + size * 1.4);
  ctx.bezierCurveTo(x, y + size * 1.15, x + size, y + size * 0.9, x + size, y + size * 0.45);
  ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
  ctx.fill();
  ctx.restore();
}

    ctx.beginPath();
    ctx.ellipse(0, 3, 12, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff85ad';
    ctx.beginPath();
    ctx.ellipse(0, 9, 7, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Soft shy lips
    ctx.strokeStyle = '#cc527a';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.quadraticCurveTo(0, 4, 8, 0);
    ctx.stroke();
  }
  ctx.restore();

  // Sweat drops in H-Mode
  if (state.isHMode || state.lust >= 50) {
    ctx.fillStyle = 'rgba(220, 245, 255, 0.75)';
    ctx.beginPath();
    ctx.ellipse(54, -72, 2.5, 5, 0.2, 0, Math.PI * 2);
    ctx.ellipse(-22, 22, 2.5, 5, -0.1, 0, Math.PI * 2);
    ctx.fill();
  }

  // Front Hair Bangs & Side Locks
  ctx.fillStyle = hairGrad;
  ctx.beginPath();
  ctx.moveTo(-82, -135);
  ctx.quadraticCurveTo(-55, -215, 0, -218);
  ctx.quadraticCurveTo(55, -215, 82, -135);
  // Bang spikes across forehead
  ctx.lineTo(62, -105);
  ctx.lineTo(44, -138);
  ctx.lineTo(18, -98);
  ctx.lineTo(0, -135);
  ctx.lineTo(-18, -98);
  ctx.lineTo(-44, -138);
  ctx.lineTo(-62, -105);
  ctx.closePath();
  ctx.fill();

  // Hair Crown Highlight Halo
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, -142, 56, 1.2 * Math.PI, 1.8 * Math.PI);
  ctx.stroke();

  ctx.restore(); // End Head
  ctx.restore(); // End Heroine
}

// Render Floating Sakura & Heart Particles
function drawParticles(w, h) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.temp) {
      p.alpha -= 0.016;
      if (p.alpha <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
    } else {
      if (p.y < -20) {
        p.y = h + 20;
        p.x = Math.random() * w;
      }
    }

    if (p.type === 'heart' || state.isHMode) {
      drawHeart(p.x, p.y, p.r, '#ff6b9d', p.alpha);
    } else {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = '#ffb8d1';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// Main Loop
let lastTime = performance.now();
let hDialogueTimer = 0;

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const time = now / 1000;
  const w = window.innerWidth;
  const h = window.innerHeight;

  // Automatic Pleasure Gain in H-Mode
  if (state.isHMode && state.pleasure < 100) {
    const rate = state.hPace === 1 ? 3.5 : state.hPace === 2 ? 7.5 : 14.0;
    state.pleasure = Math.min(100, state.pleasure + rate * dt);
    document.getElementById('val-pleasure').textContent = `${Math.round(state.pleasure)}%`;
    document.getElementById('bar-pleasure').style.width = `${state.pleasure}%`;

    hDialogueTimer += dt;
    if (hDialogueTimer > 4.2) {
      hDialogueTimer = 0;
      const pool = state.hPace === 1 ? H_LINES.slow : state.hPace === 2 ? H_LINES.normal : H_LINES.fast;
      const line = pool[Math.floor(Math.random() * pool.length)];
      setDialogue('ไอริ (Airi)', line);
    }

    if (state.pleasure >= 100) {
      triggerClimax();
    }
  }

  drawBackground(w, h, time);
  drawAnimeHeroine(w, h, time, dt);
  drawParticles(w, h);

  // Pink Romance Vignette in H-Mode
  if (state.isHMode) {
    const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, w * 0.25, w * 0.5, h * 0.5, w * 0.75);
    vig.addColorStop(0, 'rgba(255, 60, 130, 0)');
    vig.addColorStop(1, `rgba(255, 40, 110, ${0.18 + Math.sin(time * 5) * 0.06})`);
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);
  }

  // Climax White Flash
  if (state.whiteFlash > 0) {
    ctx.fillStyle = `rgba(255, 245, 250, ${state.whiteFlash})`;
    ctx.fillRect(0, 0, w, h);
    state.whiteFlash = Math.max(0, state.whiteFlash - dt * 1.4);
  }

  requestAnimationFrame(gameLoop);
}

// Canvas Direct Touch / Click Detection on Heroine Body
canvas.addEventListener('pointerdown', (e) => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const cx = w * 0.5;
  const cy = h * 0.47;
  const scale = Math.min(w / 520, h / 720);

  const localX = (e.clientX - cx) / scale;
  const localY = (e.clientY - cy) / scale;

  if (Math.abs(localX) < 95) {
    if (localY >= -210 && localY < -95) {
      interactZone('head', e.clientX, e.clientY);
      return;
    } else if (localY >= -95 && localY < -20) {
      interactZone('lips', e.clientX, e.clientY);
      return;
    } else if (localY >= -20 && localY <= 150) {
      interactZone('chest', e.clientX, e.clientY);
      return;
    }
  }
});

// Dialogue Box Advance Click
document.getElementById('dialogue-box').addEventListener('click', () => {
  if (state.isHMode) return;
  const node = STORY_NODES[state.nodeId];
  if (node && node.next && !node.choices) {
    sfx.playTone(480, 0.06, 'sine', 0.05);
    loadStoryNode(node.next);
  }
});

// UI Buttons Wiring
document.querySelectorAll('#touch-hint .btn-ui').forEach(btn => {
  btn.addEventListener('click', () => interactZone(btn.dataset.zone));
});

document.querySelectorAll('#intimate-panel .btn-ui[data-pace]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#intimate-panel .btn-ui[data-pace]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.hPace = parseInt(btn.dataset.pace, 10);
    sfx.playHeartbeat();
    const pool = state.hPace === 1 ? H_LINES.slow : state.hPace === 2 ? H_LINES.normal : H_LINES.fast;
    setDialogue('ไอริ (Airi)', pool[0]);
  });
});

document.querySelectorAll('#intimate-panel .btn-ui[data-pose]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#intimate-panel .btn-ui[data-pose]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.hPose = btn.dataset.pose;
    state.breastVelY = -16;
    sfx.playTone(610, 0.1, 'triangle', 0.08);
    setDialogue(
      'ไอริ (Airi)',
      state.hPose === 'cowgirl'
        ? '"อื้อออ... ให้พี่เป็นฝ่ายขยับอยู่ข้างบนตัวเธอแบบนี้... ลึกสุดใจเลยค่ะ!"'
        : '"กอดพี่ไว้แน่นๆ แบบนี้แหละค่ะ... มองตาพี่ตอนที่เรารวมเป็นหนึ่งเดียวกันนะ..."'
    );
  });
});

document.getElementById('btn-climax').addEventListener('click', triggerClimax);

document.getElementById('btn-outfit').addEventListener('click', () => {
  state.outfitIndex = (state.outfitIndex + 1) % OUTFITS.length;
  state.breastVelY = -12;
  sfx.playTone(540, 0.08, 'sine', 0.06);
  updateHUD();
});

document.getElementById('btn-hmode').addEventListener('click', () => {
  if (state.isHMode) {
    loadStoryNode(state.nodeId || 'intro_1');
  } else {
    enterHMode(3);
  }
});

document.getElementById('btn-save').addEventListener('click', () => {
  const savePayload = {
    affection: state.affection,
    lust: state.lust,
    outfitIndex: state.outfitIndex,
    nodeId: state.nodeId
  };
  localStorage.setItem('sakura_2d_save', JSON.stringify(savePayload));
  sfx.playTone(760, 0.1, 'sine', 0.08);
  setDialogue('ระบบ', '💾 บันทึกความคืบหน้าเรียบร้อยแล้ว!');
});

document.getElementById('btn-load').addEventListener('click', () => {
  const raw = localStorage.getItem('sakura_2d_save');
  if (!raw) {
    setDialogue('ระบบ', '⚠️ ยังไม่มีข้อมูลที่บันทึกไว้');
    return;
  }
  const data = JSON.parse(raw);
  state.affection = data.affection ?? 25;
  state.lust = data.lust ?? 15;
  state.outfitIndex = data.outfitIndex ?? 0;
  loadStoryNode(data.nodeId || 'intro_1');
  sfx.playTone(680, 0.1, 'sine', 0.08);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  state.affection = 25;
  state.lust = 15;
  state.pleasure = 0;
  state.outfitIndex = 0;
  loadStoryNode('intro_1');
});

// Boot Game
loadStoryNode('intro_1');
requestAnimationFrame(gameLoop);
</script>
</body>
