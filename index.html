<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math RPG M.2: Ultimate Edition by Tawan</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Chakra Petch', 'Kanit', sans-serif; user-select: none; }
        body {
            background: #020205; color: #fff; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 10px; overflow-x: hidden;
        }
        .shake { animation: shakeEffect 0.3s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-8px, 5px); }
            50% { transform: translate(8px, -5px); }
            75% { transform: translate(-5px, -5px); }
        }
        .game-card {
            background: linear-gradient(145deg, rgba(12,12,25,0.98), rgba(4,4,10,0.99));
            border: 2px solid #00ffcc; border-radius: 24px; padding: 18px; width: 100%; max-width: 480px;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.3); text-align: center; position: relative;
        }
        .creator-tag {
            background: rgba(0, 255, 204, 0.1); border: 1px dashed #00ffcc; color: #00ffcc;
            font-size: 12px; font-weight: bold; padding: 5px; border-radius: 8px; margin-bottom: 10px;
            letter-spacing: 1px; text-transform: uppercase;
        }
        .sound-btn {
            position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1);
            border: 1px solid #00ffcc; color: #00ffcc; border-radius: 50%; width: 36px; height: 36px;
            cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        h1, h2 { text-shadow: 0 0 10px #00ffcc; margin: 8px 0; }
        .btn {
            background: linear-gradient(90deg, #ff0055, #ff5000); border: none; color: white; padding: 10px;
            font-size: 14px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin: 4px 0;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); text-transform: uppercase; transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-class { background: linear-gradient(90deg, #7928CA, #B800FF); font-size: 12px; padding: 7px; text-align: left; padding-left: 12px; }
        .btn-diff { background: linear-gradient(90deg, #0070F3, #00FFCC); color: #000; font-weight: 700; margin: 3px 0; padding: 8px; font-size: 13px; }
        .btn-sec { background: linear-gradient(90deg, #00b09b, #96c93d); color: #000; box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4); }
        
        .battle-arena {
            display: flex; justify-content: space-between; align-items: center; margin: 10px 0;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(0,255,204,0.3); border-radius: 16px; padding: 10px;
        }
        .combatant { width: 45%; text-align: center; }
        
        /* ดีไซน์บอสและตัวละครแบบเต็มตัว/อลังการขึ้น */
        .full-avatar {
            width: 70px; height: 90px; margin: 0 auto; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 38px; background: radial-gradient(circle, rgba(0,255,204,0.2) 0%, rgba(0,0,0,0.9) 80%);
            border: 2px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.4); position: relative; animation: float 3s infinite ease-in-out;
        }
        .boss-full-avatar {
            border-color: #ff0055; box-shadow: 0 0 15px rgba(255,0,85,0.5);
            background: radial-gradient(circle, rgba(255,0,85,0.25) 0%, rgba(0,0,0,0.9) 80%);
            animation: bossAnim 2.5s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes bossAnim { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .hp-container { background: #111; border: 1px solid #444; border-radius: 8px; padding: 2px; margin-top: 5px; position: relative; }
        .hp-bar { background: linear-gradient(90deg, #00ffcc, #0070F3); height: 12px; border-radius: 6px; width: 100%; transition: width 0.4s ease; }
        .boss-hp-bar { background: linear-gradient(90deg, #ff0055, #ff5000); }
        .hp-text { font-size: 9px; font-weight: bold; margin-top: 2px; color: #aaa; }

        .timer-container { background: #111; border: 1px solid #00ffcc; border-radius: 8px; height: 6px; width: 100%; overflow: hidden; margin: 6px 0; }
        .timer-bar { background: #00ffcc; height: 100%; width: 100%; transition: width 1s linear; }

        .math-box { background: rgba(0,0,0,0.7); border: 1px solid #00ffcc; border-radius: 14px; padding: 10px; margin: 8px 0; }
        .math-expr { font-size: 18px; color: #fff; text-shadow: 0 0 10px #00ffcc; font-weight: bold; }

        input[type="number"], input[type="text"] {
            width: 80%; padding: 8px; font-size: 16px; text-align: center; border-radius: 12px;
            border: 2px solid #00ffcc; background: #080810; color: #00ffcc; outline: none; margin-bottom: 6px; font-weight: bold;
        }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; background: rgba(0, 255, 204, 0.15); border: 1px solid #00ffcc; color: #00ffcc; font-size: 10px; }
        .hint-box { background: rgba(255, 0, 85, 0.15); border: 1px dashed #ff0055; border-radius: 10px; padding: 8px; margin-top: 6px; font-size: 11px; color: #ff99bb; text-align: left; max-height: 120px; overflow-y: auto; }
        .scroll-area { max-height: 280px; overflow-y: auto; padding-right: 4px; }
        
        .skill-bar { display: flex; gap: 5px; margin-bottom: 6px; }
        .skill-btn { flex: 1; background: linear-gradient(90deg, #333, #555); border: 1px solid #00ffcc; color: #fff; font-size: 10px; padding: 6px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .skill-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #555; }
        
        table { width: 100%; font-size: 11px; border-collapse: collapse; margin-top: 6px; }
        th, td { border: 1px solid rgba(0,255,204,0.3); padding: 5px; text-align: center; }
        th { background: rgba(0,255,204,0.2); color: #00ffcc; }
    </style>
</head>
<body>

<div class="game-card" id="game-card">
    <div class="creator-tag">🎮 พัฒนาโดย Tawan</div>
    <button class="sound-btn" id="sound-btn" onclick="toggleAudio()">🔊</button>

    <!-- หน้าแรกกรอกชื่อ -->
    <div id="screen-login">
        <h2>🚀 MATH RPG M.2</h2>
        <p style="color:#aaa; font-size:11px; margin-bottom: 10px;">ผจญภัยคณิตศาสตร์ ม.2 ฉบับสมบูรณ์</p>
        <input type="text" id="player-username" placeholder="พิมพ์ชื่อของคุณ..." maxlength="15">
        <button class="btn" onclick="goToClassSelect()">⚔️ เข้าสู่เกม</button>
        <button class="btn btn-sec" onclick="showLeaderboard()">🏆 ตารางคะแนนสูงสุด</button>
    </div>

    <!-- ตารางคะแนน -->
    <div id="screen-leaderboard" style="display:none;">
        <h2>🏆 HALL OF FAME</h2>
        <div class="scroll-area">
            <table id="leaderboard-table">
                <tr><th>อันดับ</th><th>ชื่อ</th><th>อาชีพ</th><th>ด่าน</th><th>คะแนน</th></tr>
            </table>
        </div>
        <button class="btn" style="margin-top: 10px;" onclick="backToLogin()">🔙 กลับหน้าแรก</button>
    </div>

    <!-- เลือก 24 อาชีพที่มีพลังพิเศษสมจริง -->
    <div id="screen-class" style="display:none;">
        <h2>⚔️ SELECT HERO (24 CLASSES)</h2>
        <p style="color:#aaa; font-size:11px; margin-bottom: 6px;">ทุกคลาสมีสกิลพิเศษเฉพาะตัวไม่ซ้ำกัน</p>
        <div class="scroll-area" id="class-list-container"></div>
        <button class="btn btn-sec" style="margin-top:6px;" onclick="backToLogin()">🔙 เปลี่ยนชื่อ</button>
    </div>

    <!-- เลือกระดับ 100 เลเวล ม.2 ครบทุกบท -->
    <div id="screen-diff" style="display:none;">
        <h2>🎯 SELECT LEVEL (1-100)</h2>
        <div class="badge" id="class-badge" style="margin-bottom: 6px;"></div>
        <div class="scroll-area" id="level-list"></div>
        <button class="btn btn-sec" style="margin-top:6px;" onclick="backToClassSelect()">🔙 เปลี่ยนอาชีพ</button>
    </div>

    <!-- หน้าจอต่อสู้หลัก -->
    <div id="screen-battle" style="display:none;">
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #00ffcc; margin-bottom: 2px;">
            <span id="level-badge" class="badge">LV 1</span>
            <span id="combo-badge" class="badge">🔥 COMBO: 0</span>
        </div>
        
        <div class="battle-arena">
            <div class="combatant">
                <div class="full-avatar" id="player-avatar">🛡️</div>
                <div style="font-size: 10px; font-weight: bold; margin-top: 3px;" id="player-name-lbl">HERO</div>
                <div class="hp-container">
                    <div class="hp-bar" id="player-hp-bar"></div>
                </div>
                <div class="hp-text" id="player-hp-text">HP: 100/100</div>
            </div>

            <div style="font-size: 16px; font-weight: bold; color: #ff0055;">VS</div>

            <div class="combatant">
                <div class="full-avatar boss-full-avatar" id="boss-icon">👺</div>
                <div style="font-size: 10px; font-weight: bold; margin-top: 3px; color:#ff0055;" id="boss-name">BOSS</div>
                <div class="hp-container">
                    <div class="hp-bar boss-hp-bar" id="hp-bar"></div>
                </div>
                <div class="hp-text" id="hp-text">HP: 100/100</div>
            </div>
        </div>

        <div class="skill-bar">
            <button class="skill-btn" id="skill-heal" onclick="useSkillHeal()">❤️ ฮีล (50p)</button>
            <button class="skill-btn" id="skill-shield" onclick="useSkillShield()">🛡️ โล่ป้อง</button>
            <button class="skill-btn" id="skill-skip" onclick="useSkillSkip()">⚡ ข้ามข้อ (-10HP)</button>
        </div>

        <div style="font-size:10px; color:#aaa; margin-top:2px;">⏱️ เวลาคิด (4 นาทีต่อข้อ):</div>
        <div class="timer-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>

        <div class="math-box">
            <div class="math-expr" id="math-problem">2² = ?</div>
        </div>

        <input type="number" id="player-answer" placeholder="ใส่คำตอบ" onkeydown="if(event.key==='Enter') attack()">
        <button class="btn" onclick="attack()">⚡ โจมตี!</button>
        
        <div id="log-msg" style="margin-top: 4px; font-weight: bold; font-size: 11px;"></div>
        <div id="hint-msg" class="hint-box" style="display:none;"></div>
    </div>
</div>

<script>
    let audioCtx = null;
    let soundEnabled = true;
    let bgmInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!soundEnabled) return;
        initAudio();
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            let now = audioCtx.currentTime;
            
            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(250, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'crit') {
                osc.type = 'square'; osc.frequency.setValueAtTime(700, now); osc.frequency.setValueAtTime(1100, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.linearRampToValueAtTime(60, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
            }
        } catch(e){}
    }

    function startBGM() {
        if (bgmInterval) return;
        const notes = [220, 247, 261, 293, 329, 349, 392];
        bgmInterval = setInterval(() => {
            if (!soundEnabled || !audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                let now = audioCtx.currentTime;
                osc.type = 'sine';
                let note = notes[Math.floor(Math.random() * notes.length)];
                osc.frequency.setValueAtTime(note, now);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.8);
            } catch(e){}
        }, 2000);
    }

    function toggleAudio() {
        initAudio();
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        if(soundEnabled) startBGM();
    }

    // 24 คลาสที่ปรับปรุงความสามารถให้มีประโยชน์จริงทุกตัว
    const classData = [
        { id: 'warrior', name: 'Warrior (นักรบเหล็กไหล)', icon: '🛡️🗡️', desc: 'พลังโจมตีรุนแรงเพิ่มขึ้น +35%' },
        { id: 'mage', name: 'Mage (จอมเวทอัคคี)', icon: '🔮🔥', desc: 'สะสมมานาโจมตีแรงทวีคูณทุก 3 คอมโบ' },
        { id: 'rogue', name: 'Rogue (โจรเงาโลหิต)', icon: '🗡️🥷', desc: 'โอกาสติดคริติคอล x3 สูงมากเป็นพิเศษ' },
        { id: 'paladin', name: 'Paladin (อัศวินผู้พิทักษ์)', icon: '🛡️✨', desc: 'พลังชีวิตเริ่มต้นสูงถึง 180 HP' },
        { id: 'alchemist', name: 'Alchemist (นักแปรธาตุ)', icon: '🧪💰', desc: 'ได้รับคะแนนสะสมและคอมโบไวขึ้น 2 เท่า' },
        { id: 'archer', name: 'Archer (พลธนูทิพย์)', icon: '🏹🎯', desc: 'ยิงแม่นยำ เพิ่มโบนัสดาเมจคงที่ +15' },
        { id: 'necromancer', name: 'Necromancer (เนโครแมนเซอร์)', icon: '💀👻', desc: 'มีโอกาสชุบชีวิตตัวเองเมื่อ HP หมด 1 ครั้ง' },
        { id: 'berserker', name: 'Berserker (คลั่งสงคราม)', icon: '🪓🔥', desc: 'ยิ่ง HP น้อยลง ดาเมจยิ่งทวีคูณมหาศาล' },
        { id: 'monk', name: 'Monk (นักบวชสมาธิ)', icon: '🧘💫', desc: 'ลดเวลาคิดผิดพลาด ป้องกันการหัก HP เกินจริง' },
        { id: 'assassin', name: 'Assassin (นักฆ่าเงาทมิฬ)', icon: '🥷⚡', desc: 'ลอบสังหารจุดอ่อนบอส สร้างดาเมจทะลุเกราะ' },
        { id: 'priest', name: 'Priest (นักบุญแห่งแสง)', icon: '✨💖', desc: 'ฟื้นฟู +10 HP ทุกครั้งที่ตอบคำถามถูก' },
        { id: 'wizard', name: 'Wizard (มหาบัณฑิตสูตรคำนวณ)', icon: '📜📐', desc: 'ผู้เชี่ยวชาญสูตรคณิตศาสตร์ ลดความซับซ้อนโจทย์' },
        { id: 'ninja', name: 'Ninja (นินจาวายุ)', icon: '💨🗡️', desc: 'ความเร็วสูง หลบหลีกการโจมตีสวนได้บ่อย' },
        { id: 'samurai', name: 'Samurai (ซามูไรวิญญาณ)', icon: '🥋⚔️', desc: 'โจมตีฉับพลันด้วยวิถีดาบเดียวคมกริบ' },
        { id: 'pirate', name: 'Pirate (โจรสลัดเจ็ดคาบสมุทร)', icon: '🏴‍☠️🪙', desc: 'สุ่มโบนัสดาเมจมหาศาลทุกการโจมตี' },
        { id: 'viking', name: 'Viking (ไวกิ้งผู้ดุร้าย)', icon: '🪓🛡️', desc: 'พละกำลังทำลายล้างบอสขั้นสูงสุด' },
        { id: 'druid', name: 'Druid (ดรูอิดพฤกษา)', icon: '🌿🍃', desc: 'พลังธรรมชาติฟื้นฟู HP ต่อเนื่องทุกเทิร์น' },
        { id: 'sorcerer', name: 'Sorcerer (นักเวทสายฟ้า)', icon: '⚡🔮', desc: 'สายฟ้าฟาดสร้างดาเมจใส่บอสสองเท่า' },
        { id: 'warlock', name: 'Warlock (วอร์ล็อคมืด)', icon: '👁️🖤', desc: 'คำสาปบอสให้รับความเสียหายเพิ่มขึ้น 20%' },
        { id: 'templar', name: 'Templar (เทมพลาร์เกราะทอง)', icon: '⚜️🛡️', desc: 'เกราะเหล็กกล้าลดดาเมจที่ได้รับลงครึ่งหนึ่ง' },
        { id: 'sniper', name: 'Sniper (พลซุ่มยิงระยะไกล)', icon: '🎯🔭', desc: 'คำนวณแม่นยำไร้ที่ติ คริติคอลแม่นยำ' },
        { id: 'beastmaster', name: 'Beastmaster (เจ้าแห่งอสูรป่า)', icon: '🐺🐾', desc: 'พรรคพวกสัตว์ป่าช่วยกระโจนโจมตีเสริม' },
        { id: 'chronomancer', name: 'Chronomancer (ผู้ควบคุมเวลา)', icon: '⏳⏰', desc: 'เวลาคิดต่อข้อเพิ่มขึ้นพิเศษ' },
        { id: 'elementalist', name: 'Elementalist (ปรมาจารย์ธาตุ)', icon: '🔥💧🌪️', desc: 'พลังธาตุผสมผสานทำลายล้างล้างบาง' }
    ];

    let playerName = "Player";
    let playerClass = '', currentLevel = 1;
    let bossHp = 100, maxBossHp = 100;
    let playerHp = 100, maxPlayerHp = 100;
    let currentAns = 0, currentHint = "";
    let shieldActive = false, comboCount = 0, score = 0;
    let timerInterval = null, timeLeft = 240;
    let usedQuestions = new Set();
    let hasRevived = false;

    window.onload = function() {
        const classContainer = document.getElementById('class-list-container');
        classData.forEach(cls => {
            let btn = document.createElement('button');
            btn.className = 'btn btn-class';
            btn.innerHTML = `${cls.icon} <b>${cls.name}</b><br><span style="font-size:10px; color:#ddd;">${cls.desc}</span>`;
            btn.onclick = () => selectClass(cls.id);
            classContainer.appendChild(btn);
        });

        const levelList = document.getElementById('level-list');
        for(let i=1; i<=100; i++) {
            let btn = document.createElement('button');
            btn.className = 'btn btn-diff';
            btn.innerText = `ระดับ ${i}: ${getLevelTheme(i)}`;
            btn.onclick = () => startGame(i);
            levelList.appendChild(btn);
        }
    }

    // บทเรียนครบทุกหัวข้อวิชาคณิตศาสตร์ ม.2 ฉบับสมบูรณ์
    function getLevelTheme(lvl) {
        if(lvl <= 20) return "บทที่ 1: เลขยกกำลัง (สมบัติ, สัญกรณ์วิทยาศาสตร์)";
        if(lvl <= 40) return "บทที่ 2: ความเท่ากันทุกประการ (รูปสามเหลี่ยม, การพิสูจน์)";
        if(lvl <= 60) return "บทที่ 3: เส้นขนาน (มุมแย้ง, มุมภายใน, เส้นตัด)";
        if(lvl <= 80) return "บทที่ 4: การแยกตัวประกอบของพหุนามดีกรีสอง";
        if(lvl <= 95) return "บทที่ 5: สถิติ (ฮิสโทแกรม, ค่ากลางข้อมูล)";
        return "บทที่ 6: ทฤษฎีบทพีทาโกรัสและข้อสอบเข้า ม.4 ขั้นสูง";
    }

    function goToClassSelect() {
        let nameInput = document.getElementById('player-username').value.trim();
        if(nameInput !== "") playerName = nameInput;
        initAudio(); startBGM(); playSound('click');
        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('screen-class').style.display = 'block';
    }

    function backToLogin() {
        playSound('click');
        document.getElementById('screen-class').style.display = 'none';
        document.getElementById('screen-leaderboard').style.display = 'none';
        document.getElementById('screen-login').style.display = 'block';
    }

    function backToClassSelect() {
        playSound('click');
        document.getElementById('screen-diff').style.display = 'none';
        document.getElementById('screen-class').style.display = 'block';
    }

    function showLeaderboard() {
        playSound('click');
        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('screen-leaderboard').style.display = 'block';
        
        let lbData = JSON.parse(localStorage.getItem('math_rpg_scores_v2') || '[]');
        lbData.sort((a, b) => b.score - a.score);
        
        let tableHtml = `<tr><th>อันดับ</th><th>ชื่อ</th><th>อาชีพ</th><th>ด่าน</th><th>คะแนน</th></tr>`;
        if(lbData.length === 0) {
            tableHtml += `<tr><td colspan="5" style="color:#aaa;">ยังไม่มีบันทึกคะแนน</td></tr>`;
        } else {
            lbData.forEach((item, index) => {
                tableHtml += `<tr><td>${index+1}</td><td>${item.name}</td><td>${item.className}</td><td>${item.level}</td><td>${item.score}</td></tr>`;
            });
        }
        document.getElementById('leaderboard-table').innerHTML = tableHtml;
    }

    function saveScoreToLeaderboard() {
        let lbData = JSON.parse(localStorage.getItem('math_rpg_scores_v2') || '[]');
        let foundIndex = lbData.findIndex(item => item.name === playerName);
        if(foundIndex >= 0) {
            if(score > lbData[foundIndex].score) {
                lbData[foundIndex].score = score;
                lbData[foundIndex].level = currentLevel;
                lbData[foundIndex].className = playerClass;
            }
        } else {
            lbData.push({ name: playerName, className: playerClass, level: currentLevel, score: score });
        }
        localStorage.setItem('math_rpg_scores_v2', JSON.stringify(lbData));
    }

    function selectClass(clsId) {
        playSound('click');
        playerClass = clsId;
        if(clsId === 'mage') shieldActive = true;
        document.getElementById('screen-class').style.display = 'none';
        document.getElementById('screen-diff').style.display = 'block';
        
        const found = classData.find(c => c.id === clsId);
        document.getElementById('class-badge').innerText = `HERO: ${found ? found.name : clsId}`;
        document.getElementById('player-name-lbl').innerText = playerName;
        document.getElementById('player-avatar').innerHTML = `<div style="font-size:26px;">${found ? found.icon.split(' ')[0] : '🛡️'}</div><div style="font-size:9px; color:#00ffcc;">${playerName.substring(0,6)}</div>`;
    }

    function startGame(lvl) {
        playSound('click');
        currentLevel = lvl;
        comboCount = 0;
        score = 0;
        hasRevived = false;
        usedQuestions.clear();
        document.getElementById('screen-diff').style.display = 'none';
        document.getElementById('screen-battle').style.display = 'block';
        
        maxBossHp = 60 + (lvl * 15);
        bossHp = maxBossHp;
        
        maxPlayerHp = (playerClass === 'paladin') ? 180 : 100;
        playerHp = maxPlayerHp;
        
        const bossAvatars = ['👹', '👺', '🐉', '💀', '👽', '🤖', '👻', '👾', '🦖', '🌌'];
        let chosenAvatar = bossAvatars[(lvl - 1) % bossAvatars.length];
        document.getElementById('boss-icon').innerHTML = `<div style="font-size:26px;">${chosenAvatar}</div><div style="font-size:9px; color:#ff0055;">LV.${lvl}</div>`;
        document.getElementById('boss-name').innerText = `BOSS ${lvl}`;
        document.getElementById('level-badge').innerText = `LV ${lvl}`;
        
        updateHpUI();
        nextQuestion();
    }

    function updateHpUI() {
        const bossPct = Math.max(0, (bossHp / maxBossHp) * 100);
        document.getElementById('hp-bar').style.width = bossPct + '%';
        document.getElementById('hp-text').innerText = `HP: ${bossHp} / ${maxBossHp}`;

        const playerPct = Math.max(0, (playerHp / maxPlayerHp) * 100);
        document.getElementById('player-hp-bar').style.width = playerPct + '%';
        document.getElementById('player-hp-text').innerText = `HP: ${playerHp} / ${maxPlayerHp}`;

        document.getElementById('combo-badge').innerText = `🔥 COMBO: ${comboCount} | ⭐ SCORE: ${score}`;
    }

    // ตัวสร้างโจทย์ครอบคลุมเนื้อหา ม.2 ทั้ง 6 บท
    function generateProblem(lvl) {
        let expr = "", ans = 0, hint = "";
        let attempts = 0;

        do {
            attempts++;
            if(lvl <= 20) {
                // บทที่ 1: เลขยกกำลังและสัญกรณ์วิทยาศาสตร์
                let b = Math.floor(Math.random() * 5) + 2;
                let p1 = Math.floor(Math.random() * 3) + 1;
                let p2 = Math.floor(Math.random() * 3) + 1;
                if(Math.random() > 0.5) {
                    expr = `${b}^${p1} × ${b}^${p2}`;
                    ans = Math.pow(b, p1 + p2);
                    hint = `💡 **เลขยกกำลัง (คูณ):** ฐานเหมือนกันคูณกัน นำเลขชี้กำลังมาบวกกัน\n• วิธีทำ: ${b}^(${p1}+${p2}) = ${ans}`;
                } else {
                    expr = `${b}^${p1+p2} ÷ ${b}^${p1}`;
                    ans = Math.pow(b, p2);
                    hint = `💡 **เลขยกกำลัง (หาร):** ฐานเหมือนกันหารกัน นำเลขชี้กำลังมาลบกัน\n• วิธีทำ: ${b}^(${p1+p2}-${p1}) = ${ans}`;
                }
            }
            else if(lvl <= 40) {
                // บทที่ 2: ความเท่ากันทุกประการ (มุมภายใน/ความยาวสามเหลี่ยม)
                let baseSide = Math.floor(Math.random() * 8) + 3;
                let scale = Math.floor(Math.random() * 3) + 2;
                expr = `สามเหลี่ยมเท่ากันทุกประการ ด้านประกอบยาว ${baseSide} และสเกล ${scale} ด้านสมนัยยาวเท่าใด`;
                ans = baseSide * scale;
                hint = `💡 **ความเท่ากันทุกประการ:** รูปสามเหลี่ยมที่เท่ากันทุกประการ ด้านคู่ที่สมนัยกันจะยาวเท่ากัน\n• วิธีทำ: ${baseSide} × ${scale} = ${ans}`;
            }
            else if(lvl <= 60) {
                // บทที่ 3: เส้นขนานและมุมแย้ง
                let angle = Math.floor(Math.random() * 60) + 40;
                expr = `เส้นขนานมีมุมภายในข้างเดียวกันของเส้นตัดขวางเท่ากับ ${angle}° มุมแย้งภายในอีกมุมคือ`;
                ans = 180 - angle;
                hint = `💡 **เส้นขนานและมุมแย้ง:** ขนาดของมุมภายในที่อยู่บนข้างเดียวกันของเส้นตัดขวางรวมกันเท่ากับ 180°\n• วิธีทำ: 180° - ${angle}° = ${ans}°`;
            }
            else if(lvl <= 80) {
                // บทที่ 4: การแยกตัวประกอบพหุนามดีกรีสอง
                let m = Math.floor(Math.random() * 4) + 1;
                let n = Math.floor(Math.random() * 4) + 1;
                let sum = m + n, prod = m * n;
                expr = `x² + ${sum}x + ${prod} แยกตัวประกอบได้ (x + ?)(x + ${n}) ค่า ? คือ`;
                ans = m;
                hint = `💡 **แยกตัวประกอบพหุนาม:** หาจำนวนสองจำนวนที่คูณกันได้ ${prod} และบวกกันได้ ${sum}\n• วิธีทำ: คือ ${m} และ ${n} ดังนั้นค่า ? คือ ${m}`;
            }
            else if(lvl <= 95) {
                // บทที่ 5: สถิติ (ค่าเฉลี่ยเลขคณิต)
                let a = Math.floor(Math.random() * 10) + 10;
                let b = Math.floor(Math.random() * 10) + 20;
                let c = Math.floor(Math.random() * 10) + 30;
                expr = `ข้อมูลชุดหนึ่งคือ ${a}, ${b}, ${c} จงหาค่าเฉลี่ยเลขคณิต`;
                ans = Math.round((a + b + c) / 3);
                hint = `💡 **ค่าเฉลี่ยเลขคณิต:** ผลรวมของข้อมูลทั้งหมดหารด้วยจำนวนข้อมูล\n• วิธีทำ: (${a} + ${b} + ${c}) / 3 = ${ans}`;
            }
            else {
                // บทที่ 6: พีทาโกรัสขั้นสูง
                const triples = [[3,4,5], [6,8,10], [5,12,13], [9,12,15], [7,24,25]];
                let t = triples[Math.floor(Math.random() * triples.length)];
                expr = `สามเหลี่ยมมุมฉาก มีด้านประกอบมุมฉาก ${t[0]*2} และ ${t[1]*2} ด้านตรงข้ามมุมฉากยาว`;
                ans = t[2] * 2;
                hint = `💡 **ทฤษฎีบทพีทาโกรัส:** c² = a² + b²\n• วิธีทำ: ด้านตรงข้ามมุมฉากคือ ${ans}`;
            }

            if (!usedQuestions.has(expr) || attempts > 15) {
                usedQuestions.add(expr);
                break;
            }
        } while (true);

        return { expr, ans, hint };
    }

    function nextQuestion() {
        const prob = generateProblem(currentLevel);
        document.getElementById('math-problem').innerText = prob.expr + " = ?";
        currentAns = prob.ans;
        currentHint = prob.hint;
        document.getElementById('player-answer').value = '';
        document.getElementById('hint-msg').style.display = 'none';

        clearInterval(timerInterval);
        timeLeft = 240;
        updateTimerUI();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOutPenalty();
            }
        }, 1000);
    }

    function updateTimerUI() {
        const pct = (timeLeft / 240) * 100;
        document.getElementById('timer-bar').style.width = pct + '%';
    }

    function timeOutPenalty() {
        playSound('wrong');
        comboCount = 0;
        playerHp -= 5;
        updateHpUI();
        document.getElementById('log-msg').innerText = '⏰ หมดเวลา! บอสโจมตีสวน (-5 HP)!';
        document.getElementById('log-msg').style.color = '#ff0055';
        checkGameOver();
        if(playerHp > 0) nextQuestion();
    }

    function checkGameOver() {
        if(playerHp <= 0) {
            if(playerClass === 'necromancer' && !hasRevived) {
                hasRevived = true;
                playerHp = 50;
                updateHpUI();
                playSound('crit');
                document.getElementById('log-msg').innerText = '💀 เนโครแมนเซอร์ใช้มนตร์ดำฟื้นคืนชีพ 50 HP!';
                document.getElementById('log-msg').style.color = '#B800FF';
                return;
            }
            playerHp = 0;
            updateHpUI();
            clearInterval(timerInterval);
            saveScoreToLeaderboard();
            setTimeout(() => {
                alert(`💀 พลังชีวิตหมด! คะแนนสะสมของคุณ: ${score} บันทึกลงตารางคะแนนเรียบร้อย`);
                document.getElementById('screen-battle').style.display = 'none';
                document.getElementById('screen-diff').style.display = 'block';
            }, 300);
        }
    }

    function useSkillHeal() {
        if(score >= 50) {
            score -= 50;
            playerHp = Math.min(maxPlayerHp, playerHp + 35);
            playSound('crit');
            updateHpUI();
            document.getElementById('log-msg').innerText = '❤️ ใช้สกิลฮีลสำเร็จ! ฟื้นฟู +35 HP';
            document.getElementById('log-msg').style.color = '#00ffcc';
        } else {
            playSound('wrong');
            alert('❌ คะแนนสะสมไม่พอ (ต้องการ 50 คะแนน)');
        }
    }

    function useSkillShield() {
        shieldActive = true;
        playSound('click');
        document.getElementById('log-msg').innerText = '🛡️ เปิดใช้งานเกราะเวทมนตร์ป้องกันความเสียหาย!';
        document.getElementById('log-msg').style.color = '#B800FF';
    }

    function useSkillSkip() {
        playSound('wrong');
        if(playerHp <= 10) {
            alert('❌ พลังชีวิตเหลือน้อยเกินไป ไม่สามารถข้ามข้อได้!');
            return;
        }
        playerHp -= 10;
        comboCount = 0;
        updateHpUI();
        document.getElementById('log-msg').innerText = '⚡ ข้ามข้อสำเร็จ! เสียสละ -10 HP เปลี่ยนข้อใหม่';
        document.getElementById('log-msg').style.color = '#ff5000';
        checkGameOver();
        if(playerHp > 0) nextQuestion();
    }

    function attack() {
        clearInterval(timerInterval);
        const input = document.getElementById('player-answer').value;
        const log = document.getElementById('log-msg');
        const hintBox = document.getElementById('hint-msg');
        const card = document.getElementById('game-card');

        if(input === '') {
            log.innerText = '⚠️ กรุณาใส่คำตอบก่อนโจมตี หรือใช้สกิลข้ามข้อ!';
            log.style.color = '#ff5000';
            return;
        }

        if(parseInt(input) === currentAns) {
            comboCount += (playerClass === 'alchemist' ? 2 : 1);
            score += 10 + (comboCount * 2);
            let baseDmg = (Math.floor(Math.random() * 8) + 15) + (comboCount * 3);
            
            if(playerClass === 'warrior') baseDmg = Math.floor(baseDmg * 1.35);
            if(playerClass === 'archer') baseDmg += 15;
            if(playerClass === 'priest') playerHp = Math.min(maxPlayerHp, playerHp + 10);
            if(playerClass === 'sorcerer') baseDmg *= 2;

            if(playerClass === 'rogue' && Math.random() < 0.55) {
                baseDmg = Math.floor(baseDmg * 3);
                playSound('crit');
                log.innerText = `🔥 CRITICAL COMBO x${comboCount}! สร้างดาเมจมหาศาล ${baseDmg}!`;
            } else {
                playSound('hit');
                log.innerText = `💥 ถูกต้อง! โจมตีใส่บอส ${baseDmg} ดาเมจ!`;
            }
            log.style.color = '#00ffcc';

            bossHp -= baseDmg;
            if(bossHp <= 0) {
                bossHp = 0;
                updateHpUI();
                saveScoreToLeaderboard();
                setTimeout(() => {
                    alert(`🎉 ยินดีด้วย! คุณเคลียร์ "ระดับ ${currentLevel}" สำเร็จแล้ว! คะแนนรวม: ${score}`);
                    document.getElementById('screen-battle').style.display = 'none';
                    document.getElementById('screen-diff').style.display = 'block';
                }, 300);
                return;
            }
            updateHpUI();
            nextQuestion();
        } else {
            playSound('wrong');
            comboCount = 0;
            
            if(shieldActive) {
                shieldActive = false;
                updateHpUI();
                log.innerText = '🛡️ เกราะเวทมนตร์ป้องกันความเสียหายจากการตอบผิดไว้ได้!';
                log.style.color = '#B800FF';
                nextQuestion();
            } else {
                let damageTaken = (playerClass === 'templar') ? 3 : 5;
                playerHp -= damageTaken;
                updateHpUI();
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 300);
                checkGameOver();

                log.innerText = `❌ ตอบผิด! (-${damageTaken} HP) ศึกษาคำอธิบายด้านล่างแล้วแก้ตัวใหม่`;
                log.style.color = '#ff0055';
                hintBox.innerHTML = currentHint;
                hintBox.style.display = 'block';
                setTimeout(() => { if(playerHp > 0) nextQuestion(); }, 6000);
            }
        }
    }
</script>
</body>
</html>
