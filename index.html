<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ ม.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root{--b:#00f0ff;--p:#ff006e;--pu:#b537f2;--g:#39ff14;--y:#ffe600;--db:#0a0a1a;--bg:rgba(15,15,35,0.95);--gl:rgba(255,255,255,0.06);--bo:rgba(255,255,255,0.12);--t:#fff;--d:#b0b0d0}*{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Kanit',sans-serif;background:var(--db);background-image:radial-gradient(ellipse at 20% 50%,rgba(0,240,255,0.06) 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(255,0,110,0.06) 0%,transparent 55%),radial-gradient(ellipse at 50% 80%,rgba(181,55,242,0.06) 0%,transparent 55%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
        .main{width:100%;max-width:780px;z-index:1}.wrap{background:var(--bg);border-radius:22px;border:2px solid var(--bo);box-shadow:0 0 30px rgba(0,240,255,0.25),0 20px 60px rgba(0,0,0,0.7);overflow:hidden;backdrop-filter:blur(15px)}
        .head{padding:14px 20px;text-align:center;background:rgba(0,240,255,0.04);border-bottom:1px solid var(--bo)}.badge-c{display:inline-block;background:rgba(255,0,110,0.18);border:1px solid var(--p);padding:5px 14px;border-radius:16px;font-size:11px;font-weight:700;color:var(--p)}.title{font-family:'Orbitron';font-size:1.7em;font-weight:900;background:linear-gradient(90deg,var(--b),var(--g),var(--y),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:4px}.sub{color:var(--d);font-size:10px}
        .cont{padding:14px;max-height:75vh;overflow-y:auto}.cont::-webkit-scrollbar{width:5px}.cont::-webkit-scrollbar-thumb{background:var(--pu);border-radius:3px}
        .btn{display:inline-block;padding:9px 16px;font-family:'Kanit';font-weight:600;font-size:12px;border:none;border-radius:9px;cursor:pointer;transition:0.2s;letter-spacing:0.5px;text-align:center}.btn:disabled{opacity:0.4;pointer-events:none}
        .bp{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff}.bs{background:linear-gradient(135deg,#00b09b,#96c93d);color:#fff}.bd{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff}.bw{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e}.bo{background:transparent;border:2px solid var(--b);color:var(--b)}.bg{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;font-weight:700}.bpk{background:linear-gradient(135deg,#ff006e,#ff4b8b);color:#fff}.bsm{padding:5px 10px;font-size:10px}
        .st{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,0.4);border-radius:9px;margin-bottom:7px;font-size:11px;color:var(--d);gap:4px}.sv{font-weight:700;color:var(--b)}.sg{color:var(--y);font-weight:700}
        .badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:9px}.badge-g{background:rgba(255,230,0,0.15);color:var(--y);border:1px solid var(--y)}.badge-b{background:rgba(0,240,255,0.15);color:var(--b);border:1px solid var(--b)}.badge-r{background:rgba(255,0,110,0.15);color:var(--p);border:1px solid var(--p)}.badge-gr{background:rgba(57,255,20,0.15);color:var(--g);border:1px solid var(--g)}
        .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:var(--gl);border:2px solid var(--bo);border-radius:13px;padding:12px;cursor:pointer;text-align:center}.card:hover{border-color:var(--y);transform:translateY(-2px)}.sel{border-color:var(--g);background:rgba(57,255,20,0.08)}.emoji{font-size:42px}.name{font-weight:700;color:var(--t);font-size:14px}.desc{font-size:9px;color:var(--d)}
        .ch{margin-bottom:7px}.ch-h{background:var(--gl);border:1px solid var(--bo);border-radius:12px;padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:8px}.ch-h:hover{border-color:var(--b)}.ch-i{font-size:18px;width:34px;height:34px;background:rgba(0,0,0,0.4);border-radius:8px;display:flex;align-items:center;justify-content:center}.ch-n{font-weight:600;color:var(--t);font-size:12px;flex:1}
        .lv-l{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-left:40px;margin-top:4px}.lv-b{padding:6px 3px;border-radius:6px;border:1px solid var(--bo);background:rgba(0,0,0,0.3);color:var(--t);font-size:9px;cursor:pointer}.lv-b.done{border-color:var(--g);background:rgba(57,255,20,0.1)}
        .btl{background:rgba(0,0,0,0.5);border-radius:13px;padding:14px;border:1px solid var(--bo);margin-bottom:8px;text-align:center}.big{font-size:56px;transition:0.3s}.shake{animation:sh 0.4s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.crit{animation:cr 0.5s}@keyframes cr{0%{transform:scale(1)}30%{transform:scale(1.7) rotate(-6deg)}100%{transform:scale(1)}}.hp-o{background:#1a1a2e;border-radius:6px;height:8px;overflow:hidden;border:1px solid var(--bo);margin-top:3px;width:120px;margin:auto}.hp-i{height:100%;transition:0.4s;background:linear-gradient(90deg,#00f0ff,#00c6ff)}.hp-b{background:linear-gradient(90deg,#ff006e,#ff4b2b)}.hp-t{font-size:9px;color:var(--d)}.vs{font-family:'Orbitron';font-size:20px;color:var(--y);font-weight:900}
        .qp{background:rgba(0,0,0,0.5);border-radius:12px;padding:12px;border:1px solid var(--bo);margin-bottom:8px}.qt{font-size:16px;font-weight:700;color:var(--t);text-align:center;margin-bottom:8px}.inp-r{display:flex;gap:6px}.inp{flex:1;padding:10px 12px;font-size:15px;font-weight:600;text-align:center;border-radius:8px;border:2px solid var(--bo);background:#0d0d1a;color:var(--t);outline:none;font-family:'Kanit'}.inp:focus{border-color:var(--b)}.inp.cf{border-color:var(--g)!important;background:rgba(57,255,20,0.08)}.inp.wf{border-color:var(--p)!important;background:rgba(255,0,110,0.08)}.combo{font-weight:700;font-size:12px;color:var(--y);min-height:18px}.fb{font-size:10px;color:var(--d);min-height:14px}
        .item{background:var(--gl);border:1px solid var(--bo);border-radius:10px;padding:10px;margin-bottom:5px;display:flex;justify-content:space-between}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:1000}.modal-b{background:var(--bg);border-radius:16px;padding:22px;max-width:400px;width:90%;border:2px solid var(--b);text-align:center;box-shadow:0 0 30px rgba(0,240,255,0.3)}
        @media(max-width:600px){.g2{grid-template-columns:1fr}.lv-l{grid-template-columns:repeat(3,1fr);padding-left:0}.big{font-size:42px}.title{font-size:1.2em}}
    </style>
</head>
<body>
<div class="main"><div class="wrap" id="wrap"><div class="head"><div class="badge-c">⚡ ตะวันสุดหล่อ ⚡</div><div class="title">MATH QUEST</div><div class="sub">พิชิตจักรวาลคณิตศาสตร์ ม.2</div></div><div class="cont" id="content"></div></div></div>
<div id="modal"></div>
<script>
// ===== ENGINE =====
let ac=null,bg=null,bo=null,mp=false;
function ia(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();}
function ps(f,t='sine',d=0.12,v=0.04){try{ia();let o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function sfxc(){ps(600,'sine',0.06)}function sfxok(){ps(700,'triangle',0.12);setTimeout(()=>ps(1100,'triangle',0.12),80)}function sfxno(){ps(140,'sawtooth',0.18)}function sfxcr(){ps(350,'square',0.18);setTimeout(()=>ps(800,'square',0.18),80)}function sfxw(){[500,700,900,1100].forEach((f,i)=>setTimeout(()=>ps(f,'triangle',0.16),i*100))}
function mplay(){if(mp)return;ia();bg=ac.createGain();bg.gain.value=0.02;bg.connect(ac.destination);bo=ac.createOscillator();bo.type='triangle';bo.frequency.value=220;bo.connect(bg);bo.start();mp=true}
function mstop(){if(bo){bo.stop();bo=null}if(bg){bg.disconnect();bg=null}mp=false}
// DATA
const chaps=[{id:1,n:'จำนวนเต็ม',icon:'🔢',boss:'🐢'},{id:2,n:'เศษส่วน',icon:'🍕',boss:'🐉'},{id:3,n:'เลขยกกำลัง',icon:'⚡',boss:'🐲'},{id:4,n:'พหุนาม',icon:'📐',boss:'🧙‍♂️'},{id:5,n:'แยกตัวประกอบ',icon:'🧩',boss:'🤖'},{id:6,n:'สมการ',icon:'⚖️',boss:'👾'},{id:7,n:'อัตราส่วน',icon:'📊',boss:'🦊'},{id:8,n:'ความเท่ากัน',icon:'🔷',boss:'💀'},{id:9,n:'พีทาโกรัส',icon:'📏',boss:'🐺'},{id:10,n:'สถิติ',icon:'🎲',boss:'👑'}];
const cls={warrior:{n:'นักรบ',e:'🦸',d:'DMG+35% HP+20',hp:20,dmg:1.35,s1:{n:'⚔️ฟันดาบ',cd:3,t:'dmg',mul:2,cost:12},s2:{n:'🛡️ตั้งรับ',cd:4,t:'shield',cost:10}},mage:{n:'จอมเวทย์',e:'🧙',d:'คริ+25%',hp:0,dmg:1,crit:0.25,cmul:4,s1:{n:'🔥ลูกไฟ',cd:4,t:'gcrit',mul:2.5,cost:14},s2:{n:'💚ฮีล',cd:3,t:'heal',heal:45,cost:12}},rogue:{n:'โจร',e:'🥷',d:'คริ+15% คอมโบ1.5x',hp:-8,dmg:1,crit:0.15,combo:1.5,s1:{n:'🗡️ลอบ',cd:3,t:'cboost',mul:3,cost:13},s2:{n:'💨หลบ',cd:5,t:'dodge',cost:15}}};
const gcls={paladin:{n:'พาลาดิน',e:'🛡️',d:'HP+60 DMG+25%',hp:60,dmg:1.25,s1:{n:'✨แสง',cd:3,t:'dmgheal',mul:2,heal:30,cost:18},s2:{n:'🛡️โล่เทพ',cd:4,t:'shieldheal',heal:25,cost:16}},necromancer:{n:'เนโคร',e:'🧟',d:'คริ+40%',hp:-15,dmg:1,crit:0.4,cmul:6,s1:{n:'👻วิญญาณ',cd:4,t:'gcrit',mul:3.5,cost:20},s2:{n:'💀ดูด',cd:3,t:'drain',mul:2,healPct:0.5,cost:18}},berserker:{n:'เบอร์เซิร์ก',e:'💢',d:'DMG+70%',hp:-20,dmg:1.7,s1:{n:'💢คลั่ง',cd:3,t:'dmg',mul:4,cost:16},s2:{n:'⚡สู้ตาย',cd:4,t:'berserk',mul:2,cost:12}}};
const pets={dog:{n:'สุนัข',e:'🐕',cost:100,bonus:'dmg',amt:0.1,desc:'ดาเมจ+10%',shop:1},cat:{n:'แมว',e:'🐱',cost:100,bonus:'crit',amt:0.08,desc:'คริ+8%',shop:1},fox:{n:'จิ้งจอก',e:'🦊',cost:180,bonus:'combo',amt:0.5,desc:'คอมโบ+50%',shop:1},phoenix:{n:'ฟีนิกซ์',e:'🦅',cost:300,bonus:'both',amt:0.12,desc:'DMG+12% คริ+12%',shop:1},dragon:{n:'มังกรน้อย',e:'🐉',cost:500,bonus:'all',amt:0.18,desc:'+18%/+18%/+80%',shop:1},uni:{n:'ยูนิคอร์น',e:'🦄',bonus:'both',amt:0.2,desc:'DMG+20% คริ+20%'},phking:{n:'ราชาฟีนิกซ์',e:'🔥',bonus:'all',amt:0.25,desc:'+25%/+25%/+120%'},wolf:{n:'หมาป่า',e:'🐺',bonus:'dmg',amt:0.3,desc:'ดาเมจ+30%'},angel:{n:'แมวเทวา',e:'😇',bonus:'crit',amt:0.22,desc:'คริ+22%'},demon:{n:'จิ้งจอกปีศาจ',e:'👹',bonus:'combo',amt:1.2,desc:'คอมโบ+120%'},cosmic:{n:'มังกรจักรวาล',e:'🌌',bonus:'all',amt:0.35,desc:'+35%/+35%/+200%'}};
// STATE
let p={name:'ผู้กล้า',hp:100,mhp:100,score:0,gold:80,combo:0,mcombo:0,tc:0,tw:0,shield:false,ch:1,lv:1,bhp:200,bmhp:200,exp:0,plv:1,rebirth:0,rbonus:0};
let pcls='warrior',epet=null,inv={w:0,s:0,h:0,a:0,p:0,sh:0,orb:false,potion:0,sp:0};
let myPets=[],myGcls=[],done={},bkill=[],scd={s1:0,s2:0},act={gcrit:0,dodge:0,cboost:0,stealth:0,reflect:0,berserk:0,drain:0},ucnt={s1:0,s2:0},timer=null,tLeft=0,quest=null;
function getC(){return{...cls,...gcls}[pcls]||cls.warrior}
function getMHP(){return 100+(getC().hp||0)+(p.plv-1)*5+inv.s*12+inv.h*5+inv.a*8+inv.p*6+p.rbonus*25}
function getPetB(){if(!epet||!pets[epet])return{dmg:0,crit:0,combo:0};let p=pets[epet],b={dmg:0,crit:0,combo:0};if(p.bonus=='dmg')b.dmg=p.amt;if(p.bonus=='crit')b.crit=p.amt;if(p.bonus=='combo')b.combo=p.amt;if(p.bonus=='both'){b.dmg=p.amt;b.crit=p.amt}if(p.bonus=='all'){b.dmg=p.amt;b.crit=p.amt;b.combo=p.amt}return b}
function wpMul(){return 1+inv.w*0.2}
function load(){try{let s=JSON.parse(localStorage.getItem('mq2'));if(s){p=s.p;pcls=s.pcls;epet=s.epet;inv=s.inv;myPets=s.myPets||[];myGcls=s.myGcls||[];done=s.done||{};bkill=s.bkill||[];p.mhp=getMHP();if(p.hp>p.mhp)p.hp=p.mhp}}catch(e){}}
function save(){localStorage.setItem('mq2',JSON.stringify({p,pcls,epet,inv,myPets,myGcls:myGcls,done,bkill}))}
function addExp(a){p.exp+=a;let need=p.plv*80+p.rebirth*40;if(p.exp>=need){p.exp-=need;p.plv++;p.mhp=getMHP();p.hp=p.mhp}}
function addGold(a){p.gold+=a}
function useGold(a){if(p.gold>=a){p.gold-=a;return true}return false}
// SCREENS
function scr(n){if(timer)clearInterval(timer);let c=document.getElementById('content');let screens={menu:menu,chap:chap,classSel:classSel,inv:inv,shop:shop,pet:pet,gpet:()=>gacha('pet'),gclass:()=>gacha('class'),equip:equip,battle:()=>{c.innerHTML=battleHTML();setup();mplay()},rebirth:rebirth,lead:lead,ach:ach,dq:dq};if(screens[n])c.innerHTML=screens[n]();else c.innerHTML=menu()}
function menu(){mstop();let cd=getC();let pi=epet&&pets[epet]?pets[epet].e+' '+pets[epet].n:'ไม่มี';return `<div class="flex-col" style="gap:6px"><div class="st"><span>⭐${p.score}</span><span>🪙<span class="sg">${p.gold}</span></span><span>Lv.<span class="sv">${p.plv}</span></span></div><div class="st"><span>⚔️${inv.w}</span><span>🛡️${inv.s}</span><span>⛑️${inv.h}</span><span>👕${inv.a}</span><span>👖${inv.p}</span><span>👟${inv.sh}</span></div><p style="color:var(--t)">🐾 ${pi} | ${cd.e} ${cd.n}</p><button class="btn bp w-full" onclick="scr('chap')">⚔️ ผจญภัย</button><button class="btn bo w-full" onclick="scr('inv')">🎒 กระเป๋า</button><button class="btn bo w-full" onclick="scr('shop')">🛒 ร้านค้า</button><button class="btn bo w-full" onclick="scr('pet')">🐾 ร้านสัตว์เลี้ยง</button><button class="btn bg w-full" onclick="scr('gpet')">🎰 กาชาสัตว์ 200🪙</button><button class="btn bpk w-full" onclick="scr('gclass')">💎 กาชาคลาส 500🪙</button><button class="btn bo w-full" onclick="scr('equip')">🔧 อัพเกรด</button><button class="btn bo w-full" onclick="scr('classSel')">🔄 เปลี่ยนคลาส</button><button class="btn bo w-full" onclick="scr('ach')">🏅 ความสำเร็จ</button><button class="btn bo w-full" onclick="scr('lead')">🏆 ลีดเดอร์บอร์ด</button><button class="btn bd w-full" onclick="scr('rebirth')">💀 เกิดใหม่</button></div>`}
function chap(){let h='';chaps.forEach(ch=>{let prog=(done[ch.id]||[]).length;h+=`<div class="ch"><div class="ch-h" onclick="tgl(${ch.id})"><div class="ch-i">${ch.icon}</div><span class="ch-n">${ch.n} (${prog}/5)</span></div><div id="ch-${ch.id}" style="display:none" class="lv-l">${[1,2,3,4,5].map(l=>`<button class="lv-b ${(done[ch.id]||[]).includes(l)?'done':''}" onclick="startB(${ch.id},${l})">ด.${l}${l==5?'👑':''}</button>`).join('')}</div></div>`});return h+'<button class="btn bo w-full mt-4" onclick="scr(\'menu\')">🔙</button>'}
function tgl(id){let el=document.getElementById('ch-'+id);el.style.display=el.style.display=='none'?'grid':'none'}
function classSel(){let h='<h3 style="color:var(--t)">เลือกคลาส</h3><div class="g2">';let all={...cls};myGcls.forEach(k=>{if(gcls[k])all[k]=gcls[k]});for(let[k,d]of Object.entries(all)){let unl=!d.unlock||bkill.includes(d.unlock);h+=`<div class="card ${pcls==k?'sel':''}" onclick="${unl?`selCls('${k}')`:'showLock()'}"><span class="emoji">${d.e}</span><div class="name">${d.n}</div><div class="desc">${d.d}</div></div>`}h+='</div><button class="btn bo w-full mt-4" onclick="scr(\'menu\')">🔙</button>';return h}
function selCls(k){let all={...cls,...gcls};if(!all[k])return;let d=cls[k]||gcls[k];if(d.unlock&&!bkill.includes(d.unlock))return;pcls=k;p.mhp=getMHP();p.hp=p.mhp;save();scr('classSel')}
function inv(){let cd=getC();let pi=epet?pets[epet].e+' '+pets[epet].n:'ไม่มี';return `<h3 style="color:var(--t)">🎒 กระเป๋า</h3><div class="item"><b>🦸 ${cd.e} ${cd.n}</b></div><div class="item"><b>🐾 ${pi}</b></div><div class="item">⚔️ดาบ Lv.${inv.w} (DMG+${inv.w*20}%)</div><div class="item">🛡️โล่ Lv.${inv.s} (HP+${inv.s*12})</div><div class="item">⛑️หมวก Lv.${inv.h} (HP+${inv.h*5})</div><div class="item">👕เกราะ Lv.${inv.a} (HP+${inv.a*8})</div><div class="item">👖กางเกง Lv.${inv.p} (HP+${inv.p*6})</div><div class="item">👟รองเท้า Lv.${inv.sh} (หลบ ${(inv.sh*2.5).toFixed(1)}%)</div><div class="item">🔮ลูกแก้ว: ${inv.orb?'✅': '❌'} | 🧪${inv.potion} 💜${inv.sp}</div><h4>🐾 สัตว์เลี้ยง</h4>${myPets.map(p=>`<div class="item"><span>${pets[p].e} ${pets[p].n}</span><span class="desc">${pets[p].desc}</span></div>`).join('')||'<p>ไม่มี</p>'}<button class="btn bo w-full mt-4" onclick="scr(\'menu\')">🔙</button>`}
function shop(){return `<h3 style="color:var(--t)">🛒 ร้านค้า</h3><div class="item"><b>🧪 โพชั่น</b><span>ฟื้น HP เต็ม</span><button class="btn bp bsm" onclick="buy('potion')">80🪙 (${inv.potion})</button></div><div class="item"><b>💜 ซุปเปอร์โพชั่น</b><span>ฟื้นเต็ม+DMG50</span><button class="btn bp bsm" onclick="buy('sp')">300🪙 (${inv.sp})</button></div><div class="item"><b>🔮 ลูกแก้วคริ</b><span>คริ+20%</span><button class="btn bp bsm" onclick="buy('orb')" ${inv.orb?'disabled':''}>${inv.orb?'✅':'700🪙'}</button></div><button class="btn bo w-full mt-4" onclick="scr('menu')">🔙</button>`}
function buy(t){let pr={potion:80,sp:300,orb:700};if(useGold(pr[t])){if(t=='potion')inv.potion++;else if(t=='sp')inv.sp++;else inv.orb=true;sfxc();save();scr('shop')}else alert('เหรียญไม่พอ')}
function equip(){let costs={w:[0,300,700,1400,2500,4500],s:[0,250,600,1200,2200,4000],h:[0,200,500,1000,1800,3200],a:[0,300,700,1400,2500,4500],p:[0,250,600,1200,2200,4000],sh:[0,350,800,1600,3000,5000]};let names={w:'⚔️ดาบ',s:'🛡️โล่',h:'⛑️หมวก',a:'👕เกราะ',p:'👖กางเกง',sh:'👟รองเท้า'};let eff={w:l=>`DMG+${l*20}%`,s:l=>`HP+${l*12}`,h:l=>`HP+${l*5}`,a:l=>`HP+${l*8}`,p:l=>`HP+${l*6}`,sh:l=>`หลบ ${(l*2.5).toFixed(1)}%`};let h='<h3 style="color:var(--t)">🔧 อัพเกรด</h3>';for(let[k,n]of Object.entries(names)){let lv=inv[k];h+=`<div class="item"><div><b>${n} Lv.${lv}</b><br><span class="desc">${eff[k](lv)} → ${lv<5?eff[k](lv+1):'MAX'}</span></div>${lv<5?`<button class="btn bp bsm" onclick="upg('${k}')">${costs[k][lv+1]}🪙</button>`:'<span class="badge badge-g">MAX</span>'}</div>`}h+='<button class="btn bo w-full mt-4" onclick="scr(\'menu\')">🔙</button>';return h}
function upg(t){let costs={w:[0,300,700,1400,2500,4500],s:[0,250,600,1200,2200,4000],h:[0,200,500,1000,1800,3200],a:[0,300,700,1400,2500,4500],p:[0,250,600,1200,2200,4000],sh:[0,350,800,1600,3000,5000]};let lv=inv[t];if(lv<5&&useGold(costs[t][lv+1])){inv[t]++;p.mhp=getMHP();p.hp=p.mhp;save();scr('equip')}else alert('เหรียญไม่พอหรือMAX')}
function pet(){let h='<h3 style="color:var(--t)">🐾 ร้านสัตว์เลี้ยง</h3><div class="g2">';for(let[k,d]of Object.entries(pets)){if(!d.shop)continue;let own=myPets.includes(k),eq=epet==k;h+=`<div class="card ${eq?'sel':''}"><span class="emoji">${d.e}</span><div class="name">${d.n}</div><div class="desc">${d.desc}</div>${own?`<button class="btn bsm ${eq?'bs':'bo'}" onclick="eqPet('${k}')">${eq?'✅':'🎯'}</button>`:`<button class="btn bp bsm" onclick="buyPet('${k}')">${d.cost}🪙</button>`}</div>`}h+='</div><button class="btn bo w-full mt-4" onclick="scr(\'menu\')">🔙</button>';return h}
function buyPet(k){let d=pets[k];if(!d||myPets.includes(k))return;if(useGold(d.cost)){myPets.push(k);if(!epet)epet=k;sfxc();save();scr('pet')}else alert('เหรียญไม่พอ')}
function eqPet(k){if(!myPets.includes(k))return;epet=epet==k?null:k;save();scr('pet')}
function gacha(t){let isPet=t=='pet',cost=isPet?200:500;return `<h3 style="color:var(--t)">${isPet?'🎰 กาชาสัตว์':'💎 กาชาคลาส'}</h3><div class="gacha" style="background:var(--gl);border:2px solid var(--y);border-radius:14px;padding:18px;text-align:center"><div style="font-size:50px" id="gd">${isPet?'🐾':'💎'}</div><p id="gr" style="color:var(--t)">สุ่มของหายาก!</p><button class="btn ${isPet?'bg':'bpk'} w-full" onclick="doGacha('${t}')">🎰 ${cost}🪙</button></div><button class="btn bo w-full mt-4" onclick="scr('menu')">🔙</button>`}
function doGacha(t){let isPet=t=='pet',cost=isPet?200:500;if(!useGold(cost)){alert('เหรียญไม่พอ');return}sfxc();if(isPet){let pool=Object.keys(pets).filter(p=>!pets[p].shop&&!myPets.includes(p));if(!pool.length){p.gold+=cost;alert('มีครบแล้ว');return}let r=pool[Math.floor(Math.random()*pool.length)];myPets.push(r);if(!epet)epet=r;document.getElementById('gd').textContent=pets[r].e;document.getElementById('gr').textContent=pets[r].n}else{let pool=['paladin','necromancer','berserker'].filter(c=>!myGcls.includes(c));if(!pool.length){p.gold+=cost;alert('มีครบแล้ว');return}let r=pool[Math.floor(Math.random()*pool.length)];myGcls.push(r);document.getElementById('gd').textContent=gcls[r].e;document.getElementById('gr').textContent=gcls[r].n}save()}
function rebirth(){let all=bkill.length>=10,reqG=15000+p.rebirth*10000,reqL=25+p.rebirth*10,can=all&&p.gold>=reqG&&p.plv>=reqL;return `<h3 style="color:var(--t)">💀 เกิดใหม่</h3><div class="story">🌌 เกิดใหม่ครั้งที่ ${p.rebirth+1}</div><div class="item">บอส 10+ ${all?'✅':'❌'} (${bkill.length})</div><div class="item">เงิน ${reqG} ${p.gold>=reqG?'✅':'❌'}</div><div class="item">Lv ${reqL}+ ${p.plv>=reqL?'✅':'❌'}</div>${can?`<button class="btn bd w-full" onclick="doRebirth()">💀เกิดใหม่</button>`:'<p>ยังไม่พร้อม</p>'}<button class="btn bo w-full mt-4" onclick="scr(\'menu\')">🔙</button>`}
function doRebirth(){if(!(bkill.length>=10&&p.gold>=15000+p.rebirth*10000&&p.plv>=25+p.rebirth*10))return;if(!confirm('รีเซ็ต?'))return;p.rebirth++;p.rbonus=p.rebirth;p.gold-=15000+p.rebirth*10000;p.plv=1;p.exp=0;p.ch=1;p.lv=1;p.score*=0.3;done={};bkill=[];p.mhp=getMHP();p.hp=p.mhp;save();alert('เกิดใหม่สำเร็จ');scr('menu')}
function lead(){let h='<h3 style="color:var(--t)">🏆 ลีดเดอร์บอร์ด</h3>';let scores=JSON.parse(localStorage.getItem('mq_lead')||'[]');scores.sort((a,b)=>b.score-a.score);scores.slice(0,10).forEach((e,i)=>{h+=`<div class="item"><span>${i+1}. ${e.name}</span><span>⭐${e.score}</span></div>`});h+='<button class="btn bo w-full mt-4" onclick="scr(\'menu\')">🔙</button>';return h}
function ach(){return `<h3 style="color:var(--t)">🏅 ความสำเร็จ</h3><div class="item">🏆 ชนะด่านแรก ${done[1]?'✅':''}</div><div class="item">🔥 คอมโบสูงสุด ${p.mcombo>=10?'✅':''}</div><div class="item">👑 ปราบบอส 10 ${bkill.length>=10?'✅':''}</div><button class="btn bo w-full mt-4" onclick="scr('menu')">🔙</button>`}
function dq(){return `<h3 style="color:var(--t)">📋 เควสรายวัน</h3><p>ยังไม่มีเควส (เพิ่มภายหลัง)</p><button class="btn bo w-full mt-4" onclick="scr('menu')">🔙</button>`}
// BATTLE
function battleHTML(){let cd=getC(),ch=chaps.find(c=>c.id==p.ch)||chaps[0],bossE=p.lv==5?ch.boss:'👾';let limit=p.lv==5?25:p.lv==4?28:30;return `<div class="btl"><div class="st"><span class="badge badge-b">${ch.icon} ${ch.n} ด.${p.lv}</span><span class="badge badge-g" id="cb">🔥0</span></div><div style="display:flex;justify-content:space-around"><div><div class="big" id="pe">${cd.e}</div><p style="color:var(--t)">${p.name}</p><div class="hp-o"><div class="hp-i" id="ph" style="width:100%"></div></div><span class="hp-t" id="pht">${p.hp}/${p.mhp}</span></div><div class="vs">VS</div><div><div class="big" id="be">${bossE}</div><p style="color:var(--p)">บอส</p><div class="hp-o"><div class="hp-i hp-b" id="bh" style="width:100%"></div></div><span class="hp-t" id="bht">${p.bhp}/${p.bmhp}</span></div></div><div class="timer-bar" style="background:#1a1a2e;height:8px;border-radius:4px;margin-top:5px"><div id="tb" style="height:100%;background:var(--y);width:100%;transition:0.1s"></div></div><div class="timer-text" id="tt">⏱ ${limit}s</div></div><div class="qp"><div class="qt" id="qt">...</div><div class="inp-r"><input class="inp" id="ai" placeholder="ตอบ..." autocomplete="off"><button class="btn bp" id="sb" onclick="submitA()">⚡</button></div><div class="combo" id="cdsp"></div><div class="fb" id="fb"></div></div><div style="display:flex;gap:5px"><button class="btn bw bsm" id="bs1" onclick="useS('s1')">${cd.s1.n}(${cd.s1.cost}) <span id="s1c">3</span></button><button class="btn bs bsm" id="bs2" onclick="useS('s2')">${cd.s2.n}(${cd.s2.cost}) <span id="s2c">3</span></button><button class="btn bd bsm" onclick="skipQ()">⏩</button></div>${inv.potion>0?`<button class="btn bo bsm w-full mt-1" onclick="usePot()">🧪 (${inv.potion})</button>`:''}${inv.sp>0?`<button class="btn bw bsm w-full mt-1" onclick="useSP()">💜 (${inv.sp})</button>`:''}<button class="btn bo w-full mt-2" onclick="flee()">🏃หนี</button>`}
function setup(){p.hp=p.mhp;p.combo=0;p.shield=false;scd={s1:0,s2:0};act={};ucnt={s1:0,s2:0};p.bmhp=150+p.ch*20+p.lv*50+p.rebirth*40;p.bhp=p.bmhp;updateUI();updateCD();nextQ();document.getElementById('ai')?.focus()}
function updateUI(){document.getElementById('ph').style.width=Math.max(0,(p.hp/p.mhp)*100)+'%';document.getElementById('bh').style.width=Math.max(0,(p.bhp/p.bmhp)*100)+'%';document.getElementById('pht').textContent=`${p.hp}/${p.mhp}`;document.getElementById('bht').textContent=`${p.bhp}/${p.bmhp}`;document.getElementById('cb').textContent=`🔥${p.combo}`}
function startTimer(){let limit=p.lv==5?25:p.lv==4?28:30;tLeft=limit;document.getElementById('tb').style.width='100%';document.getElementById('tt').textContent=`⏱ ${limit}s`;timer=setInterval(()=>{tLeft--;document.getElementById('tb').style.width=Math.max(0,(tLeft/limit)*100)+'%';document.getElementById('tt').textContent=`⏱ ${tLeft}s`;if(tLeft<=0){clearInterval(timer);timeUp()}},1000)}
function timeUp(){document.getElementById('ai').disabled=true;document.getElementById('sb').disabled=true;handleWrong(null,true)}
// ===== QUESTIONS =====
const QDB = {
  1:[()=>{let a=Math.floor(Math.random()*30)-15,b=Math.floor(Math.random()*20)-10;return{q:`${a} + (${b}) = ?`,a:a+b}},()=>{let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*5)+1;return{q:`(${a} × ${b}) + ${a*2} = ?`,a:a*b+a*2}},()=>{let a=Math.floor(Math.random()*20)+5;return{q:`${a} ÷ 4 = ? (2 ตำแหน่ง)`,a:(a/4).toFixed(2)}}],
  2:[()=>{let n=Math.floor(Math.random()*5)+2,d=Math.floor(Math.random()*5)+3;return{q:`${n}/${d} + ${n*2}/${d} = ? (a/b)`,a:`${n+n*2}/${d}`}},()=>{let n=Math.floor(Math.random()*5)+1,d=Math.floor(Math.random()*4)+5;return{q:`ทศนิยม ${n}/${d} = ? (2 ตำแหน่ง)`,a:(n/d).toFixed(2)}}],
  3:[()=>{let b=Math.floor(Math.random()*3)+2,e=Math.floor(Math.random()*2)+2;return{q:`${b}^${e} = ?`,a:Math.pow(b,e)}},()=>{let b=Math.floor(Math.random()*2)+2;return{q:`${b}^3 × ${b}^2 = ${b}^?`,a:5}}],
  4:[()=>{let a=Math.floor(Math.random()*4)+2;return{q:`2x + ${a}x เมื่อ x=1 = ?`,a:2+a}}],
  5:[()=>{let n=Math.floor(Math.random()*5)+2;return{q:`x² + ${2*n}x + ${n*n} = (x + ?)²`,a:n}}],
  6:[()=>{let x=Math.floor(Math.random()*8)+2,b=Math.floor(Math.random()*10)+5;return{q:`x + ${b} = ${x+b} จงหา x`,a:x}}],
  7:[()=>{let p=Math.floor(Math.random()*30)+10;return{q:`${p}% ของ 200 = ?`,a:p*2}}],
  8:[()=>{let s=Math.floor(Math.random()*8)+4;return{q:`สามเหลี่ยมด้านเท่า ด้าน=${s} ซม. ด้านอื่น?`,a:s}}],
  9:[()=>{return{q:'สามเหลี่ยมด้าน 3,4 ด้านตรงข้ามฉาก?',a:5}}],
  10:[()=>{let nums=[Math.floor(Math.random()*20)+10,Math.floor(Math.random()*20)+20,Math.floor(Math.random()*20)+30];return{q:`ค่าเฉลี่ย ${nums.join(',')} = ?`,a:Math.round((nums[0]+nums[1]+nums[2])/3)}}]
};
function genQ(ch,lv){let pool=QDB[ch]||QDB[1];if(!pool||!pool.length)return{q:'5+3=?',a:8};let f=pool[Math.floor(Math.random()*pool.length)];let r=f();r.h=r.h||'';return r}
function nextQ(){if(p.bhp<=0||p.hp<=0){endBattle();return}let cd=getC();if(cd.regen&&p.hp<p.mhp){p.hp=Math.min(p.mhp,p.hp+cd.regen);updateUI()}quest=genQ(p.ch,p.lv);document.getElementById('qt').innerHTML=quest.q;let inp=document.getElementById('ai');inp.value='';inp.disabled=false;inp.className='inp';inp.focus();document.getElementById('sb').disabled=false;document.getElementById('fb').textContent='';document.getElementById('cdsp').textContent='';updateCD();startTimer()}
function submitA(){clearInterval(timer);let inp=document.getElementById('ai'),ua=inp.value.trim();if(!ua||!quest)return;inp.disabled=true;document.getElementById('sb').disabled=true;let ca=String(quest.a),correct=ua==ca||(!isNaN(ua)&&!isNaN(ca)&&Math.abs(parseFloat(ua)-parseFloat(ca))<0.09);if(correct){inp.classList.add('cf');setTimeout(()=>inp.classList.remove('cf'),500);handleCorrect(inp)}else{inp.classList.add('wf');setTimeout(()=>inp.classList.remove('wf'),500);handleWrong(inp,false)}}
function handleCorrect(inp){sfxok();p.combo++;p.tc++;if(p.combo>p.mcombo)p.mcombo=p.combo;let cd=getC(),pb=getPetB();let dmg=20+p.combo*5;dmg=Math.round(dmg*cd.dmg*wpMul()*(1+pb.dmg));if(p.combo>=5&&cd.combo)dmg=Math.round(dmg*cd.combo);let critC=0.06+(cd.crit||0)+pb.crit+(inv.orb?0.2:0);let isCrit=Math.random()<critC;if(act.gcrit){isCrit=true;act.gcrit=false}if(act.berserk)dmg=Math.round(dmg*2);if(isCrit){dmg=Math.round(dmg*(cd.cmul||3));sfxcr();document.getElementById('be').classList.add('crit');setTimeout(()=>document.getElementById('be').classList.remove('crit'),500)}p.bhp=Math.max(0,p.bhp-dmg);let gold=Math.round(12+p.combo*3+p.lv*3);addGold(gold);p.score+=Math.round(30+p.combo*5);document.getElementById('fb').textContent=`✅ถูก! DMG:${dmg}${isCrit?'💥':''} +${gold}🪙`;document.getElementById('fb').style.color='var(--g)';if(p.combo>=3){document.getElementById('cdsp').textContent=`🔥 COMBO x${p.combo}!`;document.getElementById('cb').textContent=`🔥${p.combo}`}updateUI();reduceCD();save();setTimeout(nextQ,900)}
function handleWrong(inp,timeUp){sfxno();p.combo=0;p.tw++;let dmg=8+p.lv*2+(timeUp?6:0);if(act.dodge){act.dodge=false;dmg=0;document.getElementById('fb').textContent='💨หลบ'}else if(p.shield){p.shield=false;if(act.reflect){act.reflect=false;p.bhp=Math.max(0,p.bhp-20);document.getElementById('fb').textContent='🛡️สะท้อน20'}else{dmg=0;document.getElementById('fb').textContent='🛡️ป้องกัน'}}else if(inv.sh*0.025>0&&Math.random()<inv.sh*0.025){dmg=0;document.getElementById('fb').textContent='👟หลบ'}else{p.hp=Math.max(0,p.hp-dmg);document.getElementById('fb').textContent=`❌ผิด! ตอบ:${quest?.a} (-${dmg}HP)`;document.getElementById('fb').style.color='var(--p)'}document.getElementById('cb').textContent='🔥0';document.getElementById('cdsp').textContent='';updateUI();reduceCD();save();setTimeout(nextQ,1400)}
function reduceCD(){if(scd.s1>0)scd.s1--;if(scd.s2>0)scd.s2--;updateCD()}
function updateCD(){let cd=getC();document.getElementById('bs1').disabled=scd.s1>0||p.gold<cd.s1.cost||ucnt.s1>=3;document.getElementById('bs2').disabled=scd.s2>0||p.gold<cd.s2.cost||ucnt.s2>=3;document.getElementById('s1c').textContent=3-ucnt.s1;document.getElementById('s2c').textContent=3-ucnt.s2}
function useS(t){let cd=getC();if(t=='s1'){if(scd.s1>0||ucnt.s1>=3||!useGold(cd.s1.cost))return;ucnt.s1++;scd.s1=cd.s1.cd;sfxc();if(cd.s1.t=='gcrit')act.gcrit=true;if(cd.s1.t=='cboost')act.cboost=true;if(cd.s1.t=='dmg'){let d=Math.round(30*(cd.s1.mul||2));p.bhp=Math.max(0,p.bhp-d);updateUI()}if(cd.s1.t=='dmgheal'){let d=Math.round(30*(cd.s1.mul||2));p.bhp=Math.max(0,p.bhp-d);p.hp=Math.min(p.mhp,p.hp+(cd.s1.heal||30));updateUI()}}else{if(scd.s2>0||ucnt.s2>=3||!useGold(cd.s2.cost))return;ucnt.s2++;scd.s2=cd.s2.cd;sfxc();if(cd.s2.t=='shield')p.shield=true;if(cd.s2.t=='reflect'){p.shield=true;act.reflect=true}if(cd.s2.t=='heal'){p.hp=Math.min(p.mhp,p.hp+cd.s2.heal);updateUI()}if(cd.s2.t=='dodge')act.dodge=true;if(cd.s2.t=='stealth'){act.dodge=true;act.stealth=true}if(cd.s2.t=='drain')act.drain=true;if(cd.s2.t=='berserk')act.berserk=true;if(cd.s2.t=='shieldheal'){p.shield=true;p.hp=Math.min(p.mhp,p.hp+(cd.s2.heal||25));updateUI()}}updateCD();save()}
function skipQ(){clearInterval(timer);p.hp=Math.max(0,p.hp-8);p.combo=0;updateUI();reduceCD();document.getElementById('cb').textContent='🔥0';if(p.hp<=0)endBattle();else nextQ()}
function usePot(){if(inv.potion>0){inv.potion--;p.hp=p.mhp;updateUI();save()}}
function useSP(){if(inv.sp>0){inv.sp--;p.hp=p.mhp;p.bhp=Math.max(0,p.bhp-50);updateUI();save()}}
function endBattle(){clearInterval(timer);mstop();if(p.bhp<=0){sfxw();let g=Math.round(35+p.lv*25);addGold(g);p.score+=Math.round(100+p.lv*50);if(!done[p.ch])done[p.ch]=[];if(!done[p.ch].includes(p.lv))done[p.ch].push(p.lv);if(p.lv==5&&!bkill.includes(p.ch))bkill.push(p.ch);addExp(p.lv==5?60:15);save();setTimeout(()=>alert(`🎉 ชนะ! +${g}🪙`),500);scr('chap')}else{p.gold=Math.max(0,p.gold-10);save();alert('💀 พ่ายแพ้');scr('chap')}}
function startB(ch,lv){p.ch=ch;p.lv=lv;p.mhp=getMHP();p.hp=p.mhp;scr('battle')}
function flee(){clearInterval(timer);mstop();p.gold=Math.max(0,p.gold-10);save();scr('chap')}
function showLock(){alert('🔒 ยังปลดล็อคไม่ได้')}
document.addEventListener('keydown',e=>{if(e.key=='Enter'){let inp=document.getElementById('ai');if(inp&&document.activeElement==inp)submitA()}});
load();p.mhp=getMHP();scr('menu');
</script>
</body>
</html>
