<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest ม.2 ตะวันสุดหล่อ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root{--neon-blue:#00f0ff;--neon-pink:#ff006e;--neon-purple:#b537f2;--neon-green:#39ff14;--neon-yellow:#ffe600;--dark-bg:#0a0a1a;--card:rgba(15,15,35,0.95);--glass:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.12);--text:#fff;--dim:#b0b0d0}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Kanit',sans-serif;background:var(--dark-bg);background-image:radial-gradient(ellipse at 20% 50%,rgba(0,240,255,0.06),transparent 55%),radial-gradient(ellipse at 80% 20%,rgba(255,0,110,0.06),transparent 55%),radial-gradient(ellipse at 50% 80%,rgba(181,55,242,0.06),transparent 55%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
        .main{width:100%;max-width:780px;z-index:1}
        .wrapper{background:var(--card);border-radius:22px;border:2px solid var(--border);box-shadow:0 0 30px rgba(0,240,255,0.2);overflow:hidden;backdrop-filter:blur(15px)}
        .header{padding:14px 20px;text-align:center;background:rgba(0,240,255,0.04);border-bottom:1px solid var(--border)}
        .badge-creator{display:inline-block;background:rgba(255,0,110,0.18);border:1px solid var(--neon-pink);padding:5px 14px;border-radius:16px;font-size:11px;font-weight:700;color:var(--neon-pink);letter-spacing:2px}
        .title{font-family:'Orbitron',sans-serif;font-size:1.7em;font-weight:900;background:linear-gradient(90deg,var(--neon-blue),var(--neon-green),var(--neon-yellow),var(--neon-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:4px}
        .sub{color:var(--dim);font-size:10px}
        .content{padding:14px;max-height:75vh;overflow-y:auto}
        .content::-webkit-scrollbar{width:5px}.content::-webkit-scrollbar-thumb{background:var(--neon-purple);border-radius:3px}
        .btn{display:inline-block;padding:9px 16px;font-family:'Kanit',sans-serif;font-weight:600;font-size:12px;border:none;border-radius:9px;cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;text-align:center}
        .btn:disabled{opacity:0.4;pointer-events:none}
        .btn-p{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff}.btn-p:hover{transform:translateY(-1px)}
        .btn-s{background:linear-gradient(135deg,#00b09b,#96c93d);color:#fff}
        .btn-d{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff}
        .btn-w{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e}
        .btn-o{background:transparent;border:2px solid var(--neon-blue);color:var(--neon-blue)}
        .btn-g{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#1a1a2e;font-weight:700}
        .btn-pk{background:linear-gradient(135deg,#ff006e,#ff4b8b);color:#fff}
        .btn-sm{padding:5px 10px;font-size:10px;border-radius:6px}
        .stat-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,0.4);border-radius:9px;margin-bottom:7px;font-size:11px;color:var(--dim);gap:4px;flex-wrap:wrap}
        .stat-val{font-weight:700;color:var(--neon-blue)}.gold{color:var(--neon-yellow);font-weight:700}
        .badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:600}
        .badge-g{background:rgba(255,230,0,0.15);color:var(--neon-yellow);border:1px solid var(--neon-yellow)}
        .badge-b{background:rgba(0,240,255,0.15);color:var(--neon-blue);border:1px solid var(--neon-blue)}
        .badge-r{background:rgba(255,0,110,0.15);color:var(--neon-pink);border:1px solid var(--neon-pink)}
        .badge-gr{background:rgba(57,255,20,0.15);color:var(--neon-green);border:1px solid var(--neon-green)}
        .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
        .card{background:var(--glass);border:2px solid var(--border);border-radius:13px;padding:12px;cursor:pointer;transition:all 0.2s;text-align:center}
        .card:hover{border-color:var(--neon-yellow);transform:translateY(-2px)}.card.sel{border-color:var(--neon-green);background:rgba(57,255,20,0.08)}
        .emoji{font-size:42px;display:block;margin-bottom:4px}.name{font-weight:700;color:var(--text);font-size:14px}.desc{font-size:9px;color:var(--dim);margin-top:2px;line-height:1.3}
        .ch-header{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:4px}
        .ch-header:hover{border-color:var(--neon-blue)}.ch-icon{font-size:18px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);border-radius:8px}.ch-name{font-weight:600;color:var(--text);font-size:12px;flex:1}
        .lv-list{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-left:40px;margin-top:4px}.lv-btn{padding:6px 3px;border-radius:6px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--text);cursor:pointer;font-size:9px;text-align:center}.lv-btn.done{border-color:var(--neon-green);background:rgba(57,255,20,0.1)}
        .battle{background:rgba(0,0,0,0.5);border-radius:13px;padding:14px;border:1px solid var(--border);margin-bottom:8px;text-align:center}.big-emoji{font-size:56px;display:inline-block;transition:transform 0.3s}
        .shake{animation:sh 0.4s ease}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
        .crit{animation:cr 0.5s ease}@keyframes cr{0%{transform:scale(1)}30%{transform:scale(1.7) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
        .hp-outer{background:#1a1a2e;border-radius:6px;height:8px;overflow:hidden;border:1px solid var(--border);margin-top:3px;width:120px;margin:auto}.hp-inner{height:100%;border-radius:6px;transition:width 0.4s;background:linear-gradient(90deg,#00f0ff,#00c6ff)}.hp-boss{background:linear-gradient(90deg,#ff006e,#ff4b2b)}.hp-txt{font-size:9px;color:var(--dim)}
        .vs{font-family:'Orbitron',sans-serif;font-size:20px;color:var(--neon-yellow);font-weight:900}.timer-bar{background:#1a1a2e;border-radius:4px;height:8px;margin-top:5px}.timer-fill{height:100%;border-radius:4px;background:var(--neon-yellow);transition:width 0.1s linear}.timer-txt{font-size:9px;color:var(--neon-yellow)}
        .q-panel{background:rgba(0,0,0,0.5);border-radius:12px;padding:12px;border:1px solid var(--border);margin-bottom:8px}.q-text{font-size:16px;font-weight:700;color:var(--text);text-align:center;margin-bottom:8px;line-height:1.5}
        .inp-row{display:flex;gap:6px}.inp{flex:1;padding:10px 12px;font-size:15px;font-weight:600;text-align:center;border-radius:8px;border:2px solid var(--border);background:#0d0d1a;color:var(--text);outline:none;font-family:'Kanit',sans-serif}.inp:focus{border-color:var(--neon-blue)}.inp.c-flash{border-color:var(--neon-green)!important;background:rgba(57,255,20,0.08)}.inp.w-flash{border-color:var(--neon-pink)!important;background:rgba(255,0,110,0.08)}
        .combo{text-align:center;font-weight:700;font-size:12px;color:var(--neon-yellow);min-height:18px}.fb{font-size:10px;text-align:center;color:var(--dim);min-height:14px}
        .item{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:1000}
        .modal-box{background:var(--card);border-radius:16px;padding:22px;max-width:400px;width:90%;border:2px solid var(--neon-blue);text-align:center;box-shadow:0 0 30px rgba(0,240,255,0.3)}
        @media(max-width:600px){.grid2{grid-template-columns:1fr}.lv-list{grid-template-columns:repeat(3,1fr);padding-left:0}.big-emoji{font-size:42px}.title{font-size:1.2em}}
    </style>
</head>
<body>
<div class="main">
    <div class="wrapper" id="wrapper">
        <div class="header"><div class="badge-creator">⚡ ตะวันสุดหล่อ ⚡</div><div class="title">MATH QUEST</div><div class="sub">พิชิตจักรวาลคณิตศาสตร์ ม.2</div></div>
        <div class="content" id="content"></div>
    </div>
</div>
<div id="modal"></div>
<script>
// ==================== ENGINE ====================
let audioCtx, bgGain, bgOsc, musicOn=false;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function play(f,t='sine',d=0.12,v=0.04){try{initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function sfxClick(){play(600,'sine',0.06)}function sfxOk(){play(700,'triangle',0.12);setTimeout(()=>play(1100,'triangle',0.12),80)}function sfxNo(){play(140,'sawtooth',0.18)}function sfxCrit(){play(350,'square',0.18);setTimeout(()=>play(800,'square',0.18),80)}function sfxWin(){[500,700,900,1100].forEach((f,i)=>setTimeout(()=>play(f,'triangle',0.16),i*100))}
function musicOn(){if(musicOn)return;initAudio();bgGain=audioCtx.createGain();bgGain.gain.value=0.02;bgGain.connect(audioCtx.destination);bgOsc=audioCtx.createOscillator();bgOsc.type='triangle';bgOsc.frequency.value=220;bgOsc.connect(bgGain);bgOsc.start();musicOn=true}
function musicOff(){if(bgOsc){bgOsc.stop();bgOsc=null}if(bgGain){bgGain.disconnect();bgGain=null}musicOn=false}
// DATA
const chapters=[{id:1,n:'จำนวนเต็ม',icon:'🔢',boss:'🐢'},{id:2,n:'เศษส่วน',icon:'🍕',boss:'🐉'},{id:3,n:'เลขยกกำลัง',icon:'⚡',boss:'🐲'},{id:4,n:'พหุนาม',icon:'📐',boss:'🧙‍♂️'},{id:5,n:'แยกตัวประกอบ',icon:'🧩',boss:'🤖'},{id:6,n:'สมการ',icon:'⚖️',boss:'👾'},{id:7,n:'อัตราส่วน',icon:'📊',boss:'🦊'},{id:8,n:'ความเท่ากัน',icon:'🔷',boss:'💀'},{id:9,n:'พีทาโกรัส',icon:'📏',boss:'🐺'},{id:10,n:'สถิติ/ความน่าจะเป็น',icon:'🎲',boss:'👑'}];
const classes={warrior:{n:'นักรบ',e:'🦸',d:'ดาเมจ+35% HP+20',hp:20,dmg:1.35,s1:{n:'⚔️ฟันดาบ',cd:3,t:'dmg',mul:2,cost:12},s2:{n:'🛡️ตั้งรับ',cd:4,t:'shield',cost:10}},mage:{n:'จอมเวทย์',e:'🧙',d:'คริ+25%',hp:0,dmg:1,crit:0.25,cmul:4,s1:{n:'🔥ลูกไฟ',cd:4,t:'gcrit',mul:2.5,cost:14},s2:{n:'💚ฮีล',cd:3,t:'heal',heal:45,cost:12}},rogue:{n:'โจร',e:'🥷',d:'คริ+15% คอมโบ1.5x',hp:-8,dmg:1,crit:0.15,combo:1.5,s1:{n:'🗡️ลอบ',cd:3,t:'cboost',mul:3,cost:13},s2:{n:'💨หลบ',cd:5,t:'dodge',cost:15}}};
const gachaC={paladin:{n:'พาลาดิน',e:'🛡️',d:'HP+60 DMG+25%',hp:60,dmg:1.25,s1:{n:'✨แสง',cd:3,t:'dmgheal',mul:2,heal:30,cost:18},s2:{n:'🛡️โล่เทพ',cd:4,t:'shieldheal',heal:25,cost:16}},necromancer:{n:'เนโคร',e:'🧟',d:'คริ+40%',hp:-15,dmg:1,crit:0.4,cmul:6,s1:{n:'👻วิญญาณ',cd:4,t:'gcrit',mul:3.5,cost:20},s2:{n:'💀ดูด',cd:3,t:'drain',mul:2,healPct:0.5,cost:18}},berserker:{n:'เบอร์เซิร์ก',e:'💢',d:'DMG+70%',hp:-20,dmg:1.7,s1:{n:'💢คลั่ง',cd:3,t:'dmg',mul:4,cost:16},s2:{n:'⚡สู้ตาย',cd:4,t:'berserk',mul:2,cost:12}}};
const pets={dog:{n:'สุนัข',e:'🐕',cost:100,bonus:'dmg',amt:0.1,desc:'ดาเมจ+10%',shop:1},cat:{n:'แมว',e:'🐱',cost:100,bonus:'crit',amt:0.08,desc:'คริ+8%',shop:1},fox:{n:'จิ้งจอก',e:'🦊',cost:180,bonus:'combo',amt:0.5,desc:'คอมโบ+50%',shop:1},phoenix:{n:'ฟีนิกซ์',e:'🦅',cost:300,bonus:'both',amt:0.12,desc:'DMG+12% คริ+12%',shop:1},dragon:{n:'มังกรน้อย',e:'🐉',cost:500,bonus:'all',amt:0.18,desc:'DMG+18% คริ+18% คอมโบ+80%',shop:1},uni:{n:'ยูนิคอร์น',e:'🦄',bonus:'both',amt:0.2,desc:'DMG+20% คริ+20%'},phking:{n:'ราชาฟีนิกซ์',e:'🔥',bonus:'all',amt:0.25,desc:'+25%/+25%/+120%'},wolf:{n:'หมาป่า',e:'🐺',bonus:'dmg',amt:0.3,desc:'ดาเมจ+30%'},angel:{n:'แมวเทวา',e:'😇',bonus:'crit',amt:0.22,desc:'คริ+22%'},demon:{n:'จิ้งจอกปีศาจ',e:'👹',bonus:'combo',amt:1.2,desc:'คอมโบ+120%'},cosmic:{n:'มังกรจักรวาล',e:'🌌',bonus:'all',amt:0.35,desc:'+35%/+35%/+200%'}};
// PLAYER STATE
let player={name:'ผู้กล้า',hp:100,maxHp:100,score:0,gold:80,combo:0,maxCombo:0,tc:0,tw:0,shield:false,ch:1,lv:1,bossHp:200,bossMaxHp:200,exp:0,plv:1,rebirth:0,rbonus:0};
let pclass='warrior', epet=null, inv={weapon:0,shield:0,helm:0,armor:0,pants:0,shoes:0,orb:false,potion:0,sp:0};
let myPets=[],myGachaClass=[],done={},bossKill=[],cd={s1:0,s2:0},active={gcrit:0,dodge:0,cboost:0,stealth:0,reflect:0,berserk:0,drain:0},useCnt={s1:0,s2:0},timer=null,tLeft=0,quest=null;
function getC(){return{...classes,...gachaC}[pclass]||classes.warrior}
function getMaxHp(){return 100+(getC().hp||0)+(player.plv-1)*5+inv.shield*12+inv.helm*5+inv.armor*8+inv.pants*6+player.rbonus*25}
function getPetB(){if(!epet||!pets[epet])return{dmg:0,crit:0,combo:0};let p=pets[epet],b={dmg:0,crit:0,combo:0};if(p.bonus=='dmg')b.dmg=p.amt;if(p.bonus=='crit')b.crit=p.amt;if(p.bonus=='combo')b.combo=p.amt;if(p.bonus=='both'){b.dmg=p.amt;b.crit=p.amt}if(p.bonus=='all'){b.dmg=p.amt;b.crit=p.amt;b.combo=p.amt}return b}
function wpMul(){return 1+inv.weapon*0.2}
// SAVE
function load(){try{let s=JSON.parse(localStorage.getItem('mq2'));if(s){player=s.player;pclass=s.pclass;epet=s.epet;inv=s.inv;myPets=s.myPets||[];myGachaClass=s.myGC||[];done=s.done||{};bossKill=s.bk||[];player.maxHp=getMaxHp();if(player.hp>player.maxHp)player.hp=player.maxHp}}catch(e){}}
function save(){localStorage.setItem('mq2',JSON.stringify({player,pclass,epet,inv,myPets,myGC:myGachaClass,done,bk:bossKill}))}
function addExp(a){player.exp+=a;let need=player.plv*80+player.rebirth*40;if(player.exp>=need){player.exp-=need;player.plv++;player.maxHp=getMaxHp();player.hp=player.maxHp}}
function addGold(a){player.gold+=a}
function useGold(a){if(player.gold>=a){player.gold-=a;return true}return false}
// SCREENS
function scr(n){if(timer)clearInterval(timer);let c=document.getElementById('content');if(n=='menu')c.innerHTML=menu();else if(n=='chap')c.innerHTML=chaps();else if(n=='battle'){c.innerHTML=battleHTML();setupBattle();musicOn()}else if(n=='shop')c.innerHTML=shop();else if(n=='petshop')c.innerHTML=petShop();else if(n=='gpet')c.innerHTML=gacha('pet');else if(n=='gclass')c.innerHTML=gacha('class');else if(n=='equip')c.innerHTML=equip();else if(n=='inv')c.innerHTML=inventory();else if(n=='class')c.innerHTML=classSel();else c.innerHTML=menu()}
function menu(){musicOff();let cd=getC();let petT=epet&&pets[epet]?pets[epet].e+' '+pets[epet].n:'ไม่มี';return `<div class="flex-col" style="gap:6px"><div class="stat-bar"><span>⭐${player.score}</span><span>🪙<span class="gold">${player.gold}</span></span><span>Lv.<span class="stat-val">${player.plv}</span></span></div><div class="stat-bar"><span>⚔️${inv.weapon}</span><span>🛡️${inv.shield}</span><span>⛑️${inv.helm}</span><span>👕${inv.armor}</span><span>👖${inv.pants}</span><span>👟${inv.shoes}</span></div><p style="color:var(--text)">🐾 ${petT} | ${cd.e} ${cd.n}</p><button class="btn btn-p w-full" onclick="scr('chap')">⚔️ ผจญภัย</button><button class="btn btn-o w-full" onclick="scr('inv')">🎒 กระเป๋า</button><button class="btn btn-o w-full" onclick="scr('shop')">🛒 ร้านค้า</button><button class="btn btn-o w-full" onclick="scr('petshop')">🐾 ร้านสัตว์เลี้ยง</button><button class="btn btn-g w-full" onclick="scr('gpet')">🎰 กาชาสัตว์เลี้ยง 200🪙</button><button class="btn btn-pk w-full" onclick="scr('gclass')">💎 กาชาคลาส 500🪙</button><button class="btn btn-o w-full" onclick="scr('equip')">🔧 อัพเกรด</button><button class="btn btn-o w-full" onclick="scr('class')">🔄 เปลี่ยนคลาส</button></div>`}
function chaps(){let h='';chapters.forEach(ch=>{let prog=(done[ch.id]||[]).length;h+=`<div class="ch-header" onclick="tglChap(${ch.id})"><span class="ch-icon">${ch.icon}</span><span class="ch-name">${ch.n} (${prog}/5)</span></div><div id="ch-${ch.id}" style="display:none" class="lv-list">${[1,2,3,4,5].map(l=>`<button class="lv-btn ${(done[ch.id]||[]).includes(l)?'done':''}" onclick="startBattle(${ch.id},${l})">ด.${l}${l==5?'👑':''}</button>`).join('')}</div>`});return h+'<button class="btn btn-o w-full mt-4" onclick="scr(\'menu\')">🔙</button>'}
function tglChap(id){let el=document.getElementById('ch-'+id);el.style.display=el.style.display=='none'?'grid':'none'}
function classSel(){let h='<h3 style="color:var(--text)">เลือกคลาส</h3><div class="grid2">';let all={...classes};myGachaClass.forEach(k=>{if(gachaC[k])all[k]=gachaC[k]});for(let[k,d]of Object.entries(all)){let unl=!d.unlock||bossKill.includes(d.unlock);h+=`<div class="card ${pclass==k?'sel':''}" onclick="${unl?`selClass('${k}')`:'showLock()'}"><span class="emoji">${d.e}</span><div class="name">${d.n}</div><div class="desc">${d.d}</div></div>`}h+='</div><button class="btn btn-o w-full mt-4" onclick="scr(\'menu\')">🔙</button>';return h}
function selClass(k){let all={...classes,...gachaC};if(!all[k])return;let d=classes[k]||gachaC[k];if(d.unlock&&!bossKill.includes(d.unlock))return;pclass=k;player.maxHp=getMaxHp();player.hp=player.maxHp;save();scr('class')}

function genQ(ch,lv){
  let pool = questionsDB[ch] || questionsDB[1];
  let pick = pool[Math.floor(Math.random() * pool.length)]();
  pick.h = pick.h || '';
  return pick;
}

function setupBattle(){
  player.hp=player.maxHp; player.combo=0; player.shield=false; cd={s1:0,s2:0}; active={}; useCnt={s1:0,s2:0};
  player.bossMaxHp=150+player.ch*20+player.lv*50+player.rebirth*40; player.bossHp=player.bossMaxHp;

function updateUI(){
  document.getElementById('pHp').style.width=Math.max(0,(player.hp/player.maxHp)*100)+'%';
  document.getElementById('bHp').style.width=Math.max(0,(player.bossHp/player.bossMaxHp)*100)+'%';
  document.getElementById('pHpTxt').textContent=`${player.hp}/${player.maxHp}`;
  document.getElementById('bHpTxt').textContent=`${player.bossHp}/${player.bossMaxHp}`;
  document.getElementById('comboBadge').textContent=`🔥${player.combo}`;
}
function startTimer(){
  let limit=player.lv==5?25:player.lv==4?28:30; tLeft=limit;
  document.getElementById('tBar').style.width='100%'; document.getElementById('tTxt').textContent=`⏱ ${limit}s`;
  timer=setInterval(()=>{tLeft--;document.getElementById('tBar').style.width=Math.max(0,(tLeft/limit)*100)+'%';document.getElementById('tTxt').textContent=`⏱ ${tLeft}s`;if(tLeft<=0){clearInterval(timer);timeUp()}},1000);
}
function timeUp(){document.getElementById('ansInp').disabled=true;document.getElementById('subBtn').disabled=true;handleWrong(null,true)}
function nextQ(){
  if(player.bossHp<=0||player.hp<=0){endBattle();return}
  let cd=getC(); if(cd.regen&&player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+cd.regen);updateUI()}
  quest=genQ(player.ch,player.lv); document.getElementById('qText').innerHTML=quest.q;
  let inp=document.getElementById('ansInp'); inp.value=''; inp.disabled=false; inp.className='inp'; inp.focus();
  document.getElementById('subBtn').disabled=false; document.getElementById('fbMsg').textContent=''; document.getElementById('comboDisp').textContent='';
  updateCD(); startTimer();
}
function submitAnswer(){
  clearInterval(timer); let inp=document.getElementById('ansInp'), ua=inp.value.trim(); if(!ua||!quest)return;
  inp.disabled=true; document.getElementById('subBtn').disabled=true;
  let ca=String(quest.a), correct=ua==ca||(!isNaN(ua)&&!isNaN(ca)&&Math.abs(parseFloat(ua)-parseFloat(ca))<0.09);
  if(correct){inp.classList.add('c-flash');setTimeout(()=>inp.classList.remove('c-flash'),500);handleCorrect(inp)}
  else{inp.classList.add('w-flash');setTimeout(()=>inp.classList.remove('w-flash'),500);handleWrong(inp,false)}
}
function handleCorrect(inp){
  sfxOk(); player.combo++; player.tc++; if(player.combo>player.maxCombo)player.maxCombo=player.combo;
  let cd=getC(), pb=getPetB(); let dmg=20+player.combo*5;
  dmg=Math.round(dmg*cd.dmg*wpMul()*(1+pb.dmg));
  if(player.combo>=5&&cd.combo)dmg=Math.round(dmg*cd.combo);
  if(player.combo>=5&&pb.combo)dmg=Math.round(dmg*(1+pb.combo));
  let critChance=0.06+(cd.crit||0)+pb.crit+(inv.orb?0.2:0); let isCrit=Math.random()<critChance;
  if(active.gcrit){isCrit=true;active.gcrit=false} if(active.stealth){isCrit=true;active.stealth=false}
  if(active.berserk)dmg=Math.round(dmg*2);
  if(isCrit){dmg=Math.round(dmg*(cd.cmul||3));sfxCrit();document.getElementById('bEmoji').classList.add('crit');setTimeout(()=>document.getElementById('bEmoji').classList.remove('crit'),500)}
  if(active.cboost&&isCrit){dmg=Math.round(dmg*(cd.s1?.mul||3));active.cboost=false}
  player.bossHp=Math.max(0,player.bossHp-dmg); let gold=Math.round(12+player.combo*3+player.lv*3); addGold(gold); player.score+=Math.round(30+player.combo*5);
  document.getElementById('fbMsg').textContent=`✅ถูก! DMG:${dmg}${isCrit?'💥คริ!':''} +${gold}🪙`; document.getElementById('fbMsg').style.color='var(--neon-green)';
  if(player.combo>=3){document.getElementById('comboDisp').textContent=`🔥 COMBO x${player.combo}!`; document.getElementById('comboBadge').textContent=`🔥${player.combo}`}
  updateUI(); reduceCD(); save();
  if(inp){let r=inp.getBoundingClientRect(); spawnSparkle(r.left+r.width/2,r.top,isCrit?'💥':'⚡')}
  setTimeout(nextQ,900);
}
function handleWrong(inp,timeUp){
  sfxNo(); player.combo=0; player.tw++; let dmg=8+player.lv*2+(timeUp?6:0);
  if(active.dodge){active.dodge=false;dmg=0;document.getElementById('fbMsg').textContent='💨หลบ!'}
  else if(player.shield){player.shield=false;if(active.reflect){active.reflect=false;player.bossHp=Math.max(0,player.bossHp-20);document.getElementById('fbMsg').textContent='🛡️สะท้อน20'}else{dmg=0;document.getElementById('fbMsg').textContent='🛡️ป้องกัน'}}
  else if(inv.shoes*0.025>0&&Math.random()<inv.shoes*0.025){dmg=0;document.getElementById('fbMsg').textContent='👟หลบ'}
  else{player.hp=Math.max(0,player.hp-dmg);document.getElementById('fbMsg').textContent=`❌ผิด!${timeUp?'⏱หมดเวลา!':''} ตอบ:${quest?.a} (-${dmg}HP)`;document.getElementById('fbMsg').style.color='var(--neon-pink)'}
  document.getElementById('comboBadge').textContent='🔥0'; document.getElementById('comboDisp').textContent='';
  updateUI(); reduceCD(); save(); setTimeout(nextQ,1400);
}
function reduceCD(){if(cd.s1>0)cd.s1--;if(cd.s2>0)cd.s2--;updateCD()}
function updateCD(){
  let c=getC(); document.getElementById('btnS1').disabled=cd.s1>0||player.gold<c.s1.cost||useCnt.s1>=3;
  document.getElementById('btnS2').disabled=cd.s2>0||player.gold<c.s2.cost||useCnt.s2>=3;
  document.getElementById('s1cnt').textContent=3-useCnt.s1; document.getElementById('s2cnt').textContent=3-useCnt.s2;
}
function useSkill(t){
  let c=getC(); if(t=='s1'){if(cd.s1>0||useCnt.s1>=3||!useGold(c.s1.cost))return; useCnt.s1++; cd.s1=c.s1.cd; sfxClick(); if(c.s1.t=='gcrit')active.gcrit=true; if(c.s1.t=='cboost')active.cboost=true; if(c.s1.t=='dmg'){let d=Math.round(30*(c.s1.mul||2));player.bossHp=Math.max(0,player.bossHp-d);updateUI()} if(c.s1.t=='dmgheal'){let d=Math.round(30*(c.s1.mul||2));player.bossHp=Math.max(0,player.bossHp-d);player.hp=Math.min(player.maxHp,player.hp+(c.s1.heal||30));updateUI()}}
  else{if(cd.s2>0||useCnt.s2>=3||!useGold(c.s2.cost))return; useCnt.s2++; cd.s2=c.s2.cd; sfxClick(); if(c.s2.t=='shield')player.shield=true; if(c.s2.t=='reflect'){player.shield=true;active.reflect=true} if(c.s2.t=='heal'){player.hp=Math.min(player.maxHp,player.hp+c.s2.heal);updateUI()} if(c.s2.t=='dodge')active.dodge=true; if(c.s2.t=='stealth'){active.dodge=true;active.stealth=true} if(c.s2.t=='drain')active.drain=true; if(c.s2.t=='berserk')active.berserk=true; if(c.s2.t=='shieldheal'){player.shield=true;player.hp=Math.min(player.maxHp,player.hp+(c.s2.heal||25));updateUI()}}
  updateCD(); save();
}
function skipQ(){clearInterval(timer);player.hp=Math.max(0,player.hp-8);player.combo=0;updateUI();reduceCD();document.getElementById('comboBadge').textContent='🔥0';document.getElementById('fbMsg').textContent='⏩ข้าม -8HP';if(player.hp<=0)endBattle();else nextQ()}
function usePot(){if(inv.potion>0){inv.potion--;player.hp=player.maxHp;updateUI();save()}}
function useSPot(){if(inv.sp>0){inv.sp--;player.hp=player.maxHp;player.bossHp=Math.max(0,player.bossHp-50);updateUI();save()}}
function endBattle(){
  clearInterval(timer); musicOff();
  if(player.bossHp<=0){sfxWin();let gold=Math.round(35+player.lv*25);addGold(gold);player.score+=Math.round(100+player.lv*50);
    if(!done[player.ch])done[player.ch]=[];if(!done[player.ch].includes(player.lv))done[player.ch].push(player.lv);
    if(player.lv==5&&!bossKill.includes(player.ch))bossKill.push(player.ch); addExp(player.lv==5?60:15); save();
    setTimeout(()=>alert(`🎉 ชนะ! +${gold}🪙`),500); scr('chap');}
  else{player.gold=Math.max(0,player.gold-10);save();alert('💀 พ่ายแพ้ เสีย 10🪙');scr('chap')}
}
function startBattle(ch,lv){player.ch=ch;player.lv=lv;player.maxHp=getMaxHp();player.hp=player.maxHp;scr('battle')}
function flee(){clearInterval(timer);musicOff();player.gold=Math.max(0,player.gold-10);save();scr('chap')}
function spawnSparkle(x,y,t){let s=document.createElement('div');s.style.cssText=`position:fixed;pointer-events:none;z-index:200;left:${x}px;top:${y}px;font-size:24px;animation:sparkleFloat 1s ease-out forwards;color:var(--neon-yellow)`;s.textContent=t;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}
document.addEventListener('keydown',e=>{if(e.key=='Enter'){let inp=document.getElementById('ansInp');if(inp&&document.activeElement==inp)submitAnswer()}});
load();player.maxHp=getMaxHp();scr('menu');
</script>
</body>
  </html>
