    position: absolute;

    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }

    gap: 10px;

    background: var(--glass);

class AudioFX {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  tone(freq = 540, dur = 0.09, type = 'sine', vol = 0.06) {
    this.init();
    if (!this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, this.ctx.currentTime);
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g);
    g.connect(this.ctx.destination);
    o.start();
    o.stop(this.ctx.currentTime + dur);
  }
  heartbeat() {
    this.tone(90, 0.12, 'sine', 0.13);
    setTimeout(() => this.tone(72, 0.16, 'sine', 0.10), 115);
  }
}

  const nextInd = document.getElementById('vn-next');

      b.className = 'choice-item';
      b.textContent = ch.label;

function renderParticles(w, h) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.temp) {
      p.alpha -= 0.016;
      if (p.alpha <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
    } else if (p.y < -20) {
      p.y = h + 20;
      p.x = Math.random() * w;
    }

    if (p.kind === 'heart' || state.isHMode) {
      drawHeartShape(p.x, p.y, p.r * 0.7, '#ff5c9e', p.alpha);
    } else {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r);
      g.addColorStop(0, '#fff0fa');
      g.addColorStop(1, 'rgba(255, 160, 220, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// Main Animation Loop
let lastTime = performance.now();
let hVoiceTimer = 0;

function animate(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const time = now / 1000;
  const w = window.innerWidth;
  const h = window.innerHeight;

  if (state.isHMode && state.ecstasy < 100) {
    const gain = state.hSpeed === 1 ? 4.0 : state.hSpeed === 2 ? 8.5 : 15.0;
    state.ecstasy = Math.min(100, state.ecstasy + gain * dt);
    document.getElementById('lbl-ecstasy').textContent = `${Math.round(state.ecstasy)}%`;
    document.getElementById('bar-ecstasy').style.width = `${state.ecstasy}%`;

    hVoiceTimer += dt;
    if (hVoiceTimer > 4.0) {
      hVoiceTimer = 0;
      const hero = currentHeroine();
      showDialogue(hero.name, state.hSpeed >= 2 ? hero.hFast : hero.hSlow);
    }

    if (state.ecstasy >= 100) {
      triggerClimax();
    }
  }

  drawMoonlitBedroomCG(w, h, time);
  drawAnimeHeroineCG(w, h, time, dt);
  renderParticles(w, h);

  // Pink Heat Vignette in H-Mode
  if (state.isHMode) {
    const v = ctx.createRadialGradient(w * 0.5, h * 0.5, w * 0.25, w * 0.5, h * 0.5, w * 0.72);
    v.addColorStop(0, 'rgba(255, 50, 120, 0)');
    v.addColorStop(1, `rgba(255, 40, 115, ${0.22 + Math.sin(time * 6) * 0.06})`);
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, w, h);
  }

  // Climax White Screen Flash
  if (state.whiteFlash > 0) {
    ctx.fillStyle = `rgba(255, 245, 252, ${state.whiteFlash})`;
    ctx.fillRect(0, 0, w, h);
    state.whiteFlash = Math.max(0, state.whiteFlash - dt * 1.5);
  }

  requestAnimationFrame(animate);
}

// Direct Body Touch Hitboxes on Canvas
canvas.addEventListener('pointerdown', (e) => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  let zoom = Math.min(w / 540, h / 760);
  let centerY = h * 0.45;
  if (state.zoomMode === 1) { zoom *= 1.38; centerY = h * 0.54; }
  else if (state.zoomMode === 2) { zoom *= 0.88; centerY = h * 0.41; }

  const lx = (e.clientX - w * 0.5) / zoom;
  const ly = (e.clientY - centerY) / zoom;

  if (Math.abs(lx) < 120) {
    if (ly >= -220 && ly < -95) {
      triggerTouch('head', e.clientX, e.clientY);
    } else if (ly >= -95 && ly < -30) {
      triggerTouch('lips', e.clientX, e.clientY);
    } else if (ly >= -30 && ly < 140) {
      triggerTouch('chest', e.clientX, e.clientY);
    } else if (ly >= 140 && ly <= 360) {
      triggerTouch('thighs', e.clientX, e.clientY);
    }
  }
});

});

document.getElementById('btn-zoom').addEventListener('click', () => {
  state.zoomMode = (state.zoomMode + 1) % 3;
  sfx.tone(580, 0.07, 'sine', 0.06);
  updateHUD();
});

document.getElementById('btn-hscene').addEventListener('click', () => {
  if (state.isHMode) runStoryStep(0);
  else startHScene(3);
});

document.getElementById('btn-hide-ui').addEventListener('click', () => {
  state.uiHidden = !state.uiHidden;
  document.getElementById('bottom-area').style.opacity = state.uiHidden ? '0' : '1';
  document.getElementById('bottom-area').style.pointerEvents = state.uiHidden ? 'none' : 'auto';
  document.getElementById('btn-hide-ui').textContent = state.uiHidden ? '👁️ แสดงข้อความ' : '👁️ ซ่อนข้อความ';
});

document.querySelectorAll('#left-panel .btn').forEach(btn => {
  btn.addEventListener('click', () => triggerTouch(btn.dataset.touch));
});

document.querySelectorAll('#right-panel .btn[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#right-panel .btn[data-speed]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.hSpeed = parseInt(btn.dataset.speed, 10);
    sfx.heartbeat();
    const hero = currentHeroine();
    showDialogue(hero.name, state.hSpeed >= 2 ? hero.hFast : hero.hSlow);
  });
});

document.querySelectorAll('#right-panel .btn[data-pose]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#right-panel .btn[data-pose]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.hPose = btn.dataset.pose;
    state.bLeftVel = -22;
    state.bRightVel = -18;
    sfx.tone(600, 0.1, 'triangle', 0.08);
  });
});

document.getElementById('btn-climax').addEventListener('click', triggerClimax);

// Boot
runStoryStep(0);
requestAnimationFrame(animate);
</script>
</body>
</html>
