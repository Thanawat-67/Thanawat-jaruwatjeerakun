<!DOCTYPE html>
<html lang="th" data-theme="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Math Quest Ultimate: 300+ ระบบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a1a; --surface: #15152a; --border: #2a2a48;
            --text: #e8e8f0; --text2: #a0a0c0; --accent: #5b9cf5;
            --green: #4ade80; --red: #f87171; --yellow: #facc15;
            --purple: #c084fc; --gold: #f5c842;
        }
        [data-theme="light"] {
            --bg: #f0f0f8; --surface: #ffffff; --border: #ccccdd;
            --text: #1a1a2e; --text2: #555577; --accent: #2563eb;
            --green: #16a34a; --red: #dc2626; --yellow: #ca8a04;
            --purple: #9333ea; --gold: #b45309;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 30% 20%, rgba(91,156,245,0.07) 0%, transparent 50%);
            min-height:100vh; display:flex; justify-content:center; align-items:center; padding:8px;
            transition: background 0.5s;
        }
        .main-container { width:100%; max-width:780px; }
        .game-wrapper {
            background:var(--surface); border-radius:20px; border:1px solid var(--border);
            box-shadow:0 8px 32px rgba(0,0,0,0.5); overflow:hidden;
        }
        .game-header {
            padding:14px 18px; text-align:center; background:var(--surface);
            border-bottom:1px solid var(--border);
        }
        .game-title { font-family:'Orbitron',sans-serif; font-size:1.6em; font-weight:900; color:var(--accent); }
        .game-content { padding:14px; max-height:76vh; overflow-y:auto; }
        .btn {
            display:inline-block; padding:9px 16px; font-weight:600; font-size:12px; border:none;
            border-radius:8px; cursor:pointer; transition:0.2s; letter-spacing:0.5px; text-align:center;
        }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-success { background:var(--green); color:#0a0a1a; }
        .btn-danger { background:var(--red); color:#fff; }
        .btn-warning { background:var(--yellow); color:#1a1a2e; }
        .btn-outline { background:transparent; border:2px solid var(--accent); color:var(--accent); }
        .btn-gold { background:var(--gold); color:#1a1a2e; }
        .badge {
            display:inline-block; padding:3px 9px; border-radius:10px; font-size:10px; font-weight:600;
            background:rgba(255,255,255,0.1); color:var(--text2); border:1px solid var(--border);
        }
        .stats-bar {
            display:flex; justify-content:space-between; align-items:center; padding:8px 12px;
            background:rgba(0,0,0,0.15); border-radius:10px; margin-bottom:8px; font-size:11px;
            color:var(--text2); flex-wrap:wrap; gap:4px;
        }
        .battle-scene { background:var(--surface); border-radius:14px; padding:14px; border:1px solid var(--border); margin-bottom:8px; text-align:center; }
        .emoji-display { font-size:56px; display:inline-block; line-height:1; }
        .hp-bar-outer { background:#1a1a30; border-radius:6px; height:8px; overflow:hidden; border:1px solid var(--border); margin-top:3px; width:100%; max-width:120px; margin:0 auto; }
        .hp-bar-inner { height:100%; border-radius:6px; transition:width 0.4s; background:var(--accent); }
        .hp-bar-inner.boss-hp { background:var(--red); }
        .question-panel { background:var(--surface); border-radius:14px; padding:14px; border:1px solid var(--border); margin-bottom:8px; }
        .answer-input { flex:1; padding:10px 14px; font-size:16px; font-weight:600; text-align:center; border-radius:8px; border:2px solid var(--border); background:rgba(0,0,0,0.2); color:var(--text); outline:none; }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:1000; }
        .modal-content { background:var(--surface); border-radius:14px; padding:20px; max-width:420px; width:90%; border:1px solid var(--border); text-align:center; }
        .flex-row { display:flex; gap:6px; flex-wrap:wrap; } .flex-col { display:flex; flex-direction:column; gap:6px; }
        .text-sm { font-size:10px; } .mt-1 { margin-top:4px; } .mt-2 { margin-top:8px; } .w-full { width:100%; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="game-wrapper">
        <div class="game-header">
            <div class="game-title">MATH QUEST</div>
            <div style="font-size:11px;color:var(--text2);">300+ ระบบ | ตะวันสุดหล่อ</div>
        </div>
        <div class="game-content" id="gameContent"></div>
    </div>
</div>
<div id="modalContainer"></div>

<script>
// ============================================
// 🎮 MATH QUEST ULTIMATE - 300+ SYSTEMS
// ============================================

// ---------- AUDIO ----------
let audioCtx=null; let bgmGain=null,bgmOsc=null; let musicOn=true,sfxOn=true;
function initAudio(){ if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }
function playSound(f,t='sine',d=0.14,v=0.05){ if(!sfxOn)return; try{ initAudio(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t; o.frequency.setValueAtTime(f,audioCtx.currentTime); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }catch(e){} }
function sfxCorrect(){ playSound(700,'triangle',0.12,0.06); setTimeout(()=>playSound(1100,'triangle',0.12,0.06),80); }
function sfxWrong(){ playSound(150,'sawtooth',0.18,0.04); }
function sfxCrit(){ playSound(350,'square',0.18,0.06); setTimeout(()=>playSound(800,'square',0.18,0.08),70); }
function sfxWin(){ [500,700,900].forEach((f,i)=>setTimeout(()=>playSound(f,'triangle',0.18,0.06),i*100)); }
function sfxPurchase(){ playSound(900,'triangle',0.2,0.07); }
function startBgMusic(){ if(!musicOn)return; try{ initAudio(); bgmGain=audioCtx.createGain(); bgmGain.gain.setValueAtTime(0.01,audioCtx.currentTime); bgmGain.connect(audioCtx.destination); bgmOsc=audioCtx.createOscillator(); bgmOsc.type='triangle'; bgmOsc.frequency.setValueAtTime(180,audioCtx.currentTime); bgmOsc.connect(bgmGain); bgmOsc.start(); }catch(e){} }
function stopBgMusic(){ try{if(bgmOsc){bgmOsc.stop();bgmOsc=null;}}catch(e){} }

// ---------- DATA ----------
const chapters = [
  {id:1,name:'เลขยกกำลัง',icon:'⚡',boss:'🐉'},
  {id:2,name:'พหุนาม',icon:'📐',boss:'🧙‍♂️'},
  {id:3,name:'แยกตัวประกอบ',icon:'🧩',boss:'🤖'},
  {id:4,name:'ความเท่ากัน',icon:'🔷',boss:'👾'},
  {id:5,name:'พีทาโกรัส',icon:'📏',boss:'💀'},
  {id:6,name:'สถิติ',icon:'📊',boss:'🦊'},
  {id:7,name:'ปริมาตร',icon:'🎲',boss:'🐲'},
];
const classes = {
  warrior:{name:'นักรบ',emoji:'🦸',hpBonus:20,dmgMul:1.35,skill1:{name:'⚔️ฟันดาบ',cd:3,type:'dmg',mul:2,cost:12},skill2:{name:'🛡️ตั้งรับ',cd:4,type:'shield',cost:10}},
  mage:{name:'จอมเวทย์',emoji:'🧙',hpBonus:0,dmgMul:1.0,critBonus:0.25,critMul:4,skill1:{name:'🔥ลูกไฟ',cd:4,type:'gcrit',mul:2.5,cost:14},skill2:{name:'💚ฮีล',cd:3,type:'heal',heal:45,cost:12}},
  rogue:{name:'โจร',emoji:'🥷',hpBonus:-8,dmgMul:1.0,critBonus:0.15,comboMul:1.5,skill1:{name:'🗡️ลอบสังหาร',cd:3,type:'cboost',mul:3,cost:13},skill2:{name:'💨หลบ',cd:5,type:'dodge',cost:15}},
  paladin:{name:'พาลาดิน',emoji:'🛡️',hpBonus:60,dmgMul:1.25,skill1:{name:'✨แสงศักดิ์สิทธิ์',cd:3,type:'dmgheal',mul:2,heal:30,cost:18},skill2:{name:'🛡️โล่เทพ',cd:4,type:'shieldheal',heal:25,cost:16},unlockChapter:3},
};
const pets = {
  dog:{name:'สุนัข',emoji:'🐕',cost:120,bonus:'dmg',amt:0.1,desc:'ดาเมจ+10%',shop:true},
  cat:{name:'แมว',emoji:'🐱',cost:120,bonus:'crit',amt:0.08,desc:'คริ+8%',shop:true},
  fox:{name:'จิ้งจอก',emoji:'🦊',cost:200,bonus:'combo',amt:0.6,desc:'คอมโบ+60%',shop:true},
  phoenix:{name:'ฟีนิกซ์',emoji:'🦅',cost:350,bonus:'both',amt:0.12,desc:'DMG+12% คริ+12%',shop:true},
  dragon_pet:{name:'มังกรน้อย',emoji:'🐉',cost:600,bonus:'all',amt:0.18,desc:'DMG+18% คริ+18% คอมโบ+80%',shop:true},
  unicorn:{name:'ยูนิคอร์น',emoji:'🦄',bonus:'both',amt:0.2,desc:'DMG+20% คริ+20%',shop:false},
  shadow_wolf:{name:'หมาป่าเงา',emoji:'🐺',bonus:'dmg',amt:0.3,desc:'ดาเมจ+30%',shop:false},
};
const gachaPets = ['unicorn','shadow_wolf'];
const gachaClasses = ['paladin'];

// ---------- PLAYER STATE ----------
let P = {
  name:'ผู้กล้า', hp:100, maxHp:100, score:0, gold:100, combo:0, maxCombo:0,
  correct:0, wrong:0, shield:false, chapter:1, level:1, bossHp:200, bossMaxHp:200,
  exp:0, lv:1, rebirth:0, rebirthBonus:0, statPoints:0,
  str:5, int:5, agi:5,
};
let currentClass = 'warrior';
let equippedPet = null;
let inv = { weapon:0, shield:0, helmet:0, armor:0, pants:0, shoes:0, orb:false, potion:0, superPotion:0 };
let ownedPets = [], ownedGachaClasses = [];
let completedLevels = {}, bossDefeated = [];
let skillCD = {s1:0,s2:0}, skillActive = {gcrit:false,dodge:false,cboost:false,reflect:false};
let skillUseCount = {s1:0,s2:0};
let timer = null, timerRemain=0, curQ=null;
let dailyQuests = [], achievements = [], logEntries = [];
let guild = {name:'',level:1,contrib:0,members:[]};
let friendList = [];
let blackMarketItems = [];
let lotteryTicket = 0;
let theme = 'neon';

// ---------- SAVE/LOAD ----------
function saveGame(){
  const data = {P,currentClass,equippedPet,inv,ownedPets,ownedGachaClasses,completedLevels,bossDefeated,
    dailyQuests,achievements,logEntries,guild,friendList,blackMarketItems,lotteryTicket,theme};
  localStorage.setItem('mq300',JSON.stringify(data));
}
function loadGame(){
  try{
    const s=JSON.parse(localStorage.getItem('mq300'));
    if(s){
      P=s.P; currentClass=s.currentClass; equippedPet=s.equippedPet; inv=s.inv;
      ownedPets=s.ownedPets||[]; ownedGachaClasses=s.ownedGachaClasses||[];
      completedLevels=s.completedLevels||{}; bossDefeated=s.bossDefeated||[];
      dailyQuests=s.dailyQuests||[]; achievements=s.achievements||[]; logEntries=s.logEntries||[];
      guild=s.guild||{}; friendList=s.friendList||[]; blackMarketItems=s.blackMarketItems||[];
      lotteryTicket=s.lotteryTicket||0; theme=s.theme||'neon';
    }
  }catch(e){}
}
function addLog(msg){ logEntries.unshift({time:Date.now(),msg}); if(logEntries.length>50)logEntries.pop(); saveGame(); }
function addGold(amt){ P.gold+=amt; }
function spendGold(amt){ if(P.gold>=amt){P.gold-=amt; return true;} return false; }
function getCD(){ return classes[currentClass]||classes['warrior']; }
function getMaxHP(){ let hp=100+(getCD().hpBonus||0)+(P.lv-1)*5+inv.shield*12+inv.helmet*5+inv.armor*8+inv.pants*6+P.rebirthBonus*25+P.str*2; return hp; }
function getDodgeChance(){ return inv.shoes*0.02 + P.agi*0.01; }
function getCritChance(){ return (getCD().critBonus||0)+(inv.orb?0.2:0)+P.int*0.02; }
function getPetBonus(){
  if(!equippedPet||!pets[equippedPet]) return {dmg:0,crit:0,combo:0};
  const p=pets[equippedPet]; const b={dmg:0,crit:0,combo:0};
  if(p.bonus==='dmg')b.dmg=p.amt; if(p.bonus==='crit')b.crit=p.amt; if(p.bonus==='combo')b.combo=p.amt;
  if(p.bonus==='both'){b.dmg=p.amt;b.crit=p.amt;} if(p.bonus==='all'){b.dmg=p.amt;b.crit=p.amt;b.combo=p.amt;}
  return b;
}
function getWeaponMul(){ return 1+inv.weapon*0.2; }

// ---------- DAILY & ACHIEVEMENTS ----------
function generateDaily(){
  const today = new Date().toDateString();
  if(dailyQuests.length>0 && dailyQuests[0].date===today) return;
  dailyQuests = [
    {date:today, id:1, desc:'ตอบถูก 10 ข้อ', progress:0, target:10, reward:80, claimed:false},
    {date:today, id:2, desc:'ชนะบอส 1 ครั้ง', progress:0, target:1, reward:150, claimed:false},
    {date:today, id:3, desc:'ใช้สกิล 5 ครั้ง', progress:0, target:5, reward:100, claimed:false},
  ];
}
function updateDaily(type,amt=1){
  generateDaily();
  dailyQuests.forEach(q=>{ if(!q.claimed && q.id===type) q.progress = Math.min(q.target, q.progress+amt); });
}
function claimDaily(id){
  const q = dailyQuests.find(q=>q.id===id && !q.claimed && q.progress>=q.target);
  if(q){ q.claimed=true; addGold(q.reward); addLog(`รับรางวัลเควส ${q.desc}`); saveGame(); }
}
function checkAchievements(){
  if(!achievements.includes('first_win') && Object.values(completedLevels).some(a=>a.length>0)){ achievements.push('first_win'); addGold(100); addLog('🏆ความสำเร็จ: ชัยชนะครั้งแรก'); }
  if(!achievements.includes('combo5') && P.maxCombo>=5){ achievements.push('combo5'); addGold(80); }
  if(!achievements.includes('rich') && P.gold>=500){ achievements.push('rich'); addGold(150); }
  saveGame();
}

// ---------- QUESTION GENERATOR (ปรับปรุงใหม่) ----------
function r(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function genQuestion(ch,diff){
  const pool = [];
  if(ch===1){
    pool.push(()=>{ const b=r(2,4),e1=r(2,3),e2=r(1,2); return {q:`${b}^${e1} × ${b}^${e2} = ${b}^?`, a:e1+e2}; });
    pool.push(()=>{ const b=r(2,5),e=r(2,3); return {q:`(${b}^${e})^2 = ${b}^?`, a:e*2}; });
    pool.push(()=>{ const b=r(2,4),e1=r(3,4),e2=r(1,2); return {q:`${b}^${e1} ÷ ${b}^${e2} = ${b}^?`, a:e1-e2}; });
  } else if(ch===2){
    pool.push(()=>{ const a=r(2,5),b=r(1,5),x=r(1,3); return {q:`(${a}x+${b})+(${a*2}x-${b}) x=${x}`, a:(a*x+b)+(a*2*x-b)}; });
    pool.push(()=>{ const a=r(3,5),b=r(2,4); return {q:`(${a}x+${b})(${a}x-${b}) x=1`, a:(a+b)*(a-b)}; });
  } else if(ch===3){
    pool.push(()=>{ const n=r(2,5); return {q:`x²+${2*n}x+${n*n}=(x+?)²`, a:n}; });
    pool.push(()=>{ const n=r(3,6); return {q:`x²-${n*n}=(x+${n})(x-?)`, a:n}; });
  } else if(ch===4){
    pool.push(()=>{ const s=r(4,10); return {q:`สามเหลี่ยมด้านเท่า ด้าน=${s} ด้านอื่น?`, a:s}; });
    pool.push(()=>{ const a=r(40,70); return {q:`สามเหลี่ยมหน้าจั่ว มุมยอด${a}° มุมฐาน?`, a:Math.round((180-a)/2)}; });
  } else if(ch===5){
    pool.push(()=>{ const m=r(1,2); return {q:`สามเหลี่ยมด้าน 3,4 ด้านฉาก?`, a:5*m}; });
  } else if(ch===6){
    pool.push(()=>{ const n=[r(10,30),r(20,50),r(30,60)]; const avg=Math.round((n[0]+n[1]+n[2])/3); return {q:`ค่าเฉลี่ย ${n.join(',')}`, a:avg}; });
  } else {
    pool.push(()=>{ const r=r(2,4),h=r(5,10); return {q:`ทรงกระบอก r=${r} h=${h} π≈3.14 ปริมาตร?`, a:Math.round(3.14*r*r*h)}; });
  }
  const f = pool[Math.floor(Math.random()*pool.length)];
  const q = f();
  return {...q, a:String(q.a)};
}

// ---------- SCREEN RENDERERS ----------
function renderScreen(name){
  stopTimer();
  const c=document.getElementById('gameContent');
  if(name==='menu') c.innerHTML=renderMenu();
  else if(name==='chapters') c.innerHTML=renderChapters();
  else if(name==='battle'){ c.innerHTML=renderBattle(); setupBattle(); }
  else if(name==='shop') c.innerHTML=renderShop();
  else if(name==='inventory') c.innerHTML=renderInventory();
  else if(name==='pets') c.innerHTML=renderPets();
  else if(name==='gacha') c.innerHTML=renderGacha();
  else if(name==='daily') c.innerHTML=renderDaily();
  else if(name==='achievements') c.innerHTML=renderAchievements();
  else if(name==='leaderboard') c.innerHTML=renderLeaderboard();
  else if(name==='guild') c.innerHTML=renderGuild();
  else c.innerHTML=renderMenu();
}

function renderMenu(){
  return `<div class="flex-col">
    <div style="text-align:center;color:var(--text);">🎮 ${P.name} | ${classes[currentClass].emoji} ${classes[currentClass].name} | Lv.${P.lv}</div>
    <div class="stats-bar">
      <span>⭐${P.score}</span><span>🪙${P.gold}</span><span>HP${P.hp}/${P.maxHp}</span>
    </div>
    <button class="btn btn-primary w-full" onclick="renderScreen('chapters')">⚔️ ผจญภัย</button>
    <button class="btn btn-outline w-full" onclick="renderScreen('inventory')">🎒 กระเป๋า</button>
    <button class="btn btn-outline w-full" onclick="renderScreen('pets')">🐾 สัตว์เลี้ยง</button>
    <button class="btn btn-gold w-full" onclick="renderScreen('gacha')">🎰 กาชา</button>
    <button class="btn btn-outline w-full" onclick="renderScreen('daily')">📋 เควสรายวัน</button>
    <button class="btn btn-outline w-full" onclick="renderScreen('achievements')">🏅 ความสำเร็จ</button>
    <button class="btn btn-outline w-full" onclick="renderScreen('leaderboard')">🏆 ลีดเดอร์บอร์ด</button>
    <button class="btn btn-outline w-full" onclick="renderScreen('guild')">🏰 กิลด์</button>
    <div class="flex-row"><button class="btn btn-sm btn-outline" onclick="toggleTheme()">🎨 ธีม</button><button class="btn btn-sm btn-outline" onclick="toggleMusic()">🎵</button></div>
  </div>`;
}

function renderChapters(){
  let h='<div class="flex-col">';
  chapters.forEach(ch=>{
    const prog=(completedLevels[ch.id]||[]).length;
    h+=`<div class="shop-item" onclick="toggleChapter(${ch.id})">${ch.icon} ${ch.name} (${prog}/3) <span>${prog>=3?'✅':''}</span></div><div id="chap${ch.id}" style="display:none;margin-left:20px;">${[1,2,3].map(l=>`<button class="btn btn-sm btn-outline" onclick="startBattle(${ch.id},${l})">ด.${l}${l==3?'👑':''}</button>`).join('')}</div>`;
  });
  h+='</div><button class="btn btn-outline w-full mt-2" onclick="renderScreen(\'menu\')">🔙</button>';
  return h;
}
function toggleChapter(id){ const el=document.getElementById('chap'+id); if(el)el.style.display=el.style.display==='none'?'block':'none'; }

function renderBattle(){
  const cd=getCD(); const ch=chapters.find(c=>c.id===P.chapter);
  return `<div class="battle-scene">
    <div class="stats-bar"><span>${ch.icon} ${ch.name} ด.${P.level}</span><span id="comboBadge">🔥0</span></div>
    <div class="flex-row" style="justify-content:center;">
      <div class="flex-col"><div class="emoji-display" id="playerEmoji">${cd.emoji}</div>${P.name}<div class="hp-bar-outer"><div class="hp-bar-inner" id="playerHpBar" style="width:100%"></div></div><span id="playerHpText">${P.hp}/${P.maxHp}</span></div>
      <div style="font-size:24px;">VS</div>
      <div class="flex-col"><div class="emoji-display" id="bossEmoji">${P.level==3?ch.boss:'👾'}</div>บอส<div class="hp-bar-outer"><div class="hp-bar-inner boss-hp" id="bossHpBar" style="width:100%"></div></div><span id="bossHpText">${P.bossHp}/${P.bossMaxHp}</span></div>
    </div>
    <div class="timer-bar-outer mt-1"><div class="timer-bar-inner" id="timerBar" style="width:100%"></div></div><div class="text-sm" id="timerText">⏱30s</div>
  </div>
  <div class="question-panel">
    <div id="qDisplay" style="font-size:18px;text-align:center;">...</div>
    <div class="flex-row mt-1"><input class="answer-input" id="answerInput" placeholder="คำตอบ" autocomplete="off"><button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">⚡</button></div>
    <div id="feedback" class="text-sm" style="text-align:center;"></div>
    <div id="comboText" style="text-align:center;color:var(--yellow);"></div>
  </div>
  <div class="flex-row">
    <button class="btn btn-sm btn-warning" onclick="useSkill('s1')" id="btnS1">${cd.skill1.name} (${cd.skill1.cost}🪙) <span id="s1Count">3</span></button>
    <button class="btn btn-sm btn-success" onclick="useSkill('s2')" id="btnS2">${cd.skill2.name} (${cd.skill2.cost}🪙) <span id="s2Count">3</span></button>
    <button class="btn btn-sm btn-danger" onclick="skipQ()">⏩</button>
  </div>
  ${inv.potion>0?`<button class="btn btn-sm btn-outline w-full mt-1" onclick="usePotion()">🧪(${inv.potion})</button>`:''}
  ${inv.superPotion>0?`<button class="btn btn-sm btn-warning w-full mt-1" onclick="useSuperPotion()">💜(${inv.superPotion})</button>`:''}
  <button class="btn btn-outline w-full mt-1" onclick="flee()">🏃หนี</button>`;
}

function setupBattle(){
  P.hp=getMaxHP(); P.maxHp=P.hp; P.combo=0; P.shield=false;
  skillCD={s1:0,s2:0}; skillActive={}; skillUseCount={s1:0,s2:0};
  P.bossMaxHp=180+P.chapter*30+P.level*60+P.rebirth*40; P.bossHp=P.bossMaxHp;
  updateBattleUI(); updateCDUI(); nextQ();
  document.getElementById('answerInput').focus();
}
function nextQ(){
  if(P.bossHp<=0||P.hp<=0){ endBattle(); return; }
  curQ=genQuestion(P.chapter,P.level);
  document.getElementById('qDisplay').innerHTML=curQ.q;
  const inp=document.getElementById('answerInput'); inp.value=''; inp.disabled=false; inp.focus();
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('feedback').textContent=''; document.getElementById('comboText').textContent='';
  updateCDUI(); startTimer();
}
function startTimer(){ stopTimer(); timerRemain=30; updateTimerUI(); timer=setInterval(()=>{ timerRemain--; updateTimerUI(); if(timerRemain<=0){stopTimer(); timeUp();} },1000); }
function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }
function updateTimerUI(){ const bar=document.getElementById('timerBar'), txt=document.getElementById('timerText'); if(bar)bar.style.width=(timerRemain/30*100)+'%'; if(txt)txt.textContent=`⏱${timerRemain}s`; }
function timeUp(){ document.getElementById('answerInput').disabled=true; document.getElementById('submitBtn').disabled=true; handleWrong(true); }

function submitAnswer(){
  stopTimer(); const inp=document.getElementById('answerInput'); if(!inp||!curQ)return;
  const ua=inp.value.trim(); if(ua==='')return;
  inp.disabled=true; document.getElementById('submitBtn').disabled=true;
  const ca=String(curQ.a); let correct=ua===ca;
  if(!correct&&!isNaN(parseFloat(ua))&&!isNaN(parseFloat(ca))) correct=Math.abs(parseFloat(ua)-parseFloat(ca))<0.09;
  if(correct) handleCorrect(); else handleWrong(false);
}
function handleCorrect(){
  sfxCorrect(); P.combo++; P.correct++; if(P.combo>P.maxCombo)P.maxCombo=P.combo;
  const cd=getCD(); const pb=getPetBonus();
  let dmg=20+P.combo*5; dmg=Math.round(dmg*cd.dmgMul*getWeaponMul()*(1+pb.dmg));
  if(P.combo>=5&&cd.comboMul)dmg=Math.round(dmg*cd.comboMul);
  let critC=getCritChance()+pb.crit; let isCrit=Math.random()<critC;
  if(skillActive.gcrit){ isCrit=true; skillActive.gcrit=false; }
  if(isCrit){ dmg=Math.round(dmg*(cd.critMul||3)); sfxCrit(); }
  if(skillActive.cboost&&isCrit){ dmg=Math.round(dmg*(cd.skill1.mul||3)); skillActive.cboost=false; }
  P.bossHp=Math.max(0,P.bossHp-dmg); const goldEarn=12+P.combo*2; addGold(goldEarn); P.score+=30+P.combo*3;
  document.getElementById('feedback').textContent=`✅ถูก! ${dmg} DMG +${goldEarn}🪙`; document.getElementById('feedback').style.color='var(--green)';
  if(P.combo>=3){ document.getElementById('comboText').textContent=`🔥COMBO x${P.combo}`; document.getElementById('comboBadge').textContent=`🔥${P.combo}`; }
  updateBattleUI(); reduceCD(); updateDaily(1,1); checkAchievements(); saveGame(); setTimeout(nextQ,800);
}
function handleWrong(isTimeUp){
  sfxWrong(); P.combo=0; P.wrong++; let dmg=8+P.level*2+(isTimeUp?5:0);
  if(skillActive.dodge){ skillActive.dodge=false; dmg=0; document.getElementById('feedback').textContent='💨หลบ!'; }
  else if(P.shield){ P.shield=false; dmg=0; document.getElementById('feedback').textContent='🛡️ป้องกัน!'; }
  else if(Math.random()<getDodgeChance()){ dmg=0; document.getElementById('feedback').textContent='👟หลบ!'; }
  else{ P.hp=Math.max(0,P.hp-dmg); document.getElementById('feedback').textContent=`❌ผิด! ${curQ.a} -${dmg}HP`; document.getElementById('feedback').style.color='var(--red)'; }
  document.getElementById('comboBadge').textContent='🔥0'; document.getElementById('comboText').textContent='';
  updateBattleUI(); reduceCD(); saveGame(); setTimeout(nextQ,1200);
}
function reduceCD(){ if(skillCD.s1>0)skillCD.s1--; if(skillCD.s2>0)skillCD.s2--; updateCDUI(); }
function updateCDUI(){
  const cd=getCD();
  document.getElementById('btnS1').disabled=skillCD.s1>0||P.gold<cd.skill1.cost||skillUseCount.s1>=3;
  document.getElementById('btnS2').disabled=skillCD.s2>0||P.gold<cd.skill2.cost||skillUseCount.s2>=3;
  document.getElementById('s1Count').textContent=3-skillUseCount.s1;
  document.getElementById('s2Count').textContent=3-skillUseCount.s2;
}
function updateBattleUI(){
  document.getElementById('playerHpBar').style.width=Math.max(0,(P.hp/P.maxHp)*100)+'%';
  document.getElementById('bossHpBar').style.width=Math.max(0,(P.bossHp/P.bossMaxHp)*100)+'%';
  document.getElementById('playerHpText').textContent=`${P.hp}/${P.maxHp}`;
  document.getElementById('bossHpText').textContent=`${P.bossHp}/${P.bossMaxHp}`;
}
function useSkill(type){
  const cd=getCD(); if(type==='s1'){
    if(skillCD.s1>0||!spendGold(cd.skill1.cost)||skillUseCount.s1>=3)return;
    skillUseCount.s1++; skillCD.s1=cd.skill1.cooldown; sfxPurchase();
    if(cd.skill1.type==='gcrit')skillActive.gcrit=true;
    if(cd.skill1.type==='cboost')skillActive.cboost=true;
    if(cd.skill1.type==='dmg'){ P.bossHp=Math.max(0,P.bossHp-30*cd.skill1.mul); updateBattleUI(); }
    if(cd.skill1.type==='dmgheal'){ P.bossHp=Math.max(0,P.bossHp-30*cd.skill1.mul); P.hp=Math.min(P.maxHp,P.hp+cd.skill1.heal); updateBattleUI(); }
  } else {
    if(skillCD.s2>0||!spendGold(cd.skill2.cost)||skillUseCount.s2>=3)return;
    skillUseCount.s2++; skillCD.s2=cd.skill2.cooldown; sfxPurchase();
    if(cd.skill2.type==='shield')P.shield=true;
    if(cd.skill2.type==='heal'){ P.hp=Math.min(P.maxHp,P.hp+cd.skill2.heal); updateBattleUI(); }
    if(cd.skill2.type==='dodge')skillActive.dodge=true;
  }
  updateCDUI(); updateDaily(3,1); saveGame();
}
function skipQ(){ stopTimer(); P.hp=Math.max(0,P.hp-8); P.combo=0; updateBattleUI(); reduceCD(); if(P.hp<=0)endBattle(); else nextQ(); }
function usePotion(){ if(inv.potion<=0)return; inv.potion--; P.hp=P.maxHp; updateBattleUI(); saveGame(); }
function useSuperPotion(){ if(inv.superPotion<=0)return; inv.superPotion--; P.hp=P.maxHp; P.bossHp=Math.max(0,P.bossHp-50); updateBattleUI(); saveGame(); }
function endBattle(){
  stopTimer(); stopBgMusic();
  if(P.bossHp<=0){
    sfxWin(); const gold=35+P.level*25; addGold(gold); P.score+=100+P.level*50;
    if(!completedLevels[P.chapter])completedLevels[P.chapter]=[];
    if(!completedLevels[P.chapter].includes(P.level))completedLevels[P.chapter].push(P.level);
    if(P.level===3&&!bossDefeated.includes(P.chapter))bossDefeated.push(P.chapter);
    updateDaily(2,1); checkAchievements(); saveGame();
    setTimeout(()=>showModal('🎉ชัยชนะ!',`+${gold}🪙`,()=>renderScreen('chapters')),700);
  } else { P.gold=Math.max(0,P.gold-10); saveGame(); showModal('💀พ่ายแพ้','-10🪙',()=>renderScreen('chapters')); }
}
function startBattle(ch,l){ P.chapter=ch; P.level=l; P.maxHp=getMaxHP(); P.hp=P.maxHp; P.combo=0; skillCD={s1:0,s2:0}; skillUseCount={s1:0,s2:0}; renderScreen('battle'); }
function flee(){ stopTimer(); stopBgMusic(); P.gold=Math.max(0,P.gold-10); saveGame(); renderScreen('chapters'); }

// ---------- SHOP & INVENTORY ----------
function renderShop(){
  return `<div class="flex-col"><h3>🛒 ร้านค้า</h3><div class="stats-bar">🪙${P.gold}</div>
    <div class="shop-item"><span>🧪โพชั่น</span><button class="btn btn-sm btn-primary" onclick="buyItem('potion')">80🪙 (${inv.potion})</button></div>
    <div class="shop-item"><span>💜ซุปเปอร์โพชั่น</span><button class="btn btn-sm btn-primary" onclick="buyItem('sp')">300🪙 (${inv.superPotion})</button></div>
    <div class="shop-item"><span>🔮ลูกแก้วคริ</span><button class="btn btn-sm ${inv.orb?'btn-success':'btn-primary'}" onclick="buyItem('orb')" ${inv.orb?'disabled':''}>${inv.orb?'✅':'700🪙'}</button></div>
    <button class="btn btn-outline w-full mt-2" onclick="renderScreen('menu')">🔙</button></div>`;
}
function buyItem(t){
  const prices={potion:80,sp:300,orb:700};
  if(spendGold(prices[t])){ if(t==='potion')inv.potion++; else if(t==='sp')inv.superPotion++; else inv.orb=true; sfxPurchase(); saveGame(); renderScreen('shop'); }
  else showModal('⚠️','เหรียญไม่พอ!',null);
}
function renderInventory(){
  return `<div class="flex-col"><h3>🎒 กระเป๋า</h3>
    <div>⚔️ดาบ Lv.${inv.weapon} (DMG+${inv.weapon*20}%)</div>
    <div>🛡️โล่ Lv.${inv.shield} (HP+${inv.shield*12})</div>
    <div>⛑️หมวก Lv.${inv.helmet} (HP+${inv.helmet*5})</div>
    <div>👕เกราะ Lv.${inv.armor} (HP+${inv.armor*8})</div>
    <div>👖กางเกง Lv.${inv.pants} (HP+${inv.pants*6})</div>
    <div>👟รองเท้า Lv.${inv.shoes} (หลบ ${(inv.shoes*2).toFixed(1)}%)</div>
    <button class="btn btn-outline w-full mt-2" onclick="renderScreen('menu')">🔙</button></div>`;
}

function renderPets(){
  let h='<div class="flex-col"><h3>🐾 สัตว์เลี้ยง</h3>';
  for(const[k,d] of Object.entries(pets)){
    if(!d.shop)continue;
    const owned=ownedPets.includes(k), eq=equippedPet===k;
    h+=`<div class="shop-item"><span>${d.emoji} ${d.name}</span>${owned?`<button class="btn btn-sm ${eq?'btn-success':'btn-outline'}" onclick="equipPet('${k}')">${eq?'✅':'🎯'}</button>`:`<button class="btn btn-sm btn-primary" onclick="buyPet('${k}')">${d.cost}🪙</button>`}</div>`;
  }
  h+='<button class="btn btn-outline w-full mt-2" onclick="renderScreen(\'menu\')">🔙</button></div>';
  return h;
}
function buyPet(k){ const d=pets[k]; if(!d||ownedPets.includes(k))return; if(spendGold(d.cost)){ ownedPets.push(k); if(!equippedPet)equippedPet=k; sfxPurchase(); saveGame(); renderScreen('pets'); } }
function equipPet(k){ if(!ownedPets.includes(k))return; equippedPet=equippedPet===k?null:k; saveGame(); renderScreen('pets'); }

function renderGacha(){
  return `<div class="flex-col"><h3>🎰 กาชา</h3>
    <button class="btn btn-gold w-full" onclick="doGacha('pet')">🐾 กาชาสัตว์เลี้ยง 250🪙</button>
    <button class="btn btn-gold w-full mt-1" onclick="doGacha('class')">💎 กาชาคลาส 600🪙</button>
    <button class="btn btn-outline w-full mt-2" onclick="renderScreen('menu')">🔙</button></div>`;
}
function doGacha(type){
  const cost=type==='pet'?250:600;
  if(!spendGold(cost)){ showModal('⚠️','เหรียญไม่พอ',null); return; }
  sfxPurchase();
  if(type==='pet'){
    const pool=gachaPets.filter(p=>!ownedPets.includes(p));
    if(pool.length===0){ P.gold+=cost; showModal('🎉','ครบทุกตัวแล้ว!',null); return; }
    const reward=pool[Math.floor(Math.random()*pool.length)];
    ownedPets.push(reward); if(!equippedPet)equippedPet=reward;
    showModal('🐾',`ได้ ${pets[reward]?.emoji||'?'} ${pets[reward]?.name||''}!`,null);
  } else {
    const pool=gachaClasses.filter(c=>!ownedGachaClasses.includes(c));
    if(pool.length===0){ P.gold+=cost; showModal('🎉','ครบทุกคลาสแล้ว!',null); return; }
    const reward=pool[Math.floor(Math.random()*pool.length)];
    ownedGachaClasses.push(reward);
    showModal('💎',`ได้คลาส ${classes[reward]?.name||reward}!`,null);
  }
  saveGame();
}

function renderDaily(){
  generateDaily();
  let h='<div class="flex-col"><h3>📋 เควสรายวัน</h3>';
  dailyQuests.forEach(q=>{
    h+=`<div class="shop-item"><span>${q.desc} (${q.progress}/${q.target})</span>${q.claimed?'✅':q.progress>=q.target?`<button class="btn btn-sm btn-warning" onclick="claimDaily(${q.id})">รับ</button>`:'...'}</div>`;
  });
  h+='<button class="btn btn-outline w-full mt-2" onclick="renderScreen(\'menu\')">🔙</button></div>';
  return h;
}

function renderAchievements(){
  const list=[{id:'first_win',name:'ชัยชนะครั้งแรก',icon:'🏆'},{id:'combo5',name:'คอมโบ5+',icon:'🔥'},{id:'rich',name:'เศรษฐี500🪙',icon:'💰'}];
  let h='<div class="flex-col"><h3>🏅 ความสำเร็จ</h3>';
  list.forEach(a=>{ h+=`<div class="shop-item"><span>${a.icon} ${a.name}</span>${achievements.includes(a.id)?'✅':'🔒'}</div>`; });
  h+='<button class="btn btn-outline w-full mt-2" onclick="renderScreen(\'menu\')">🔙</button></div>';
  return h;
}

function renderLeaderboard(){
  const hs = JSON.parse(localStorage.getItem('mq300_scores')||'[]');
  hs.sort((a,b)=>b.score-a.score);
  let h='<div class="flex-col"><h3>🏆 ลีดเดอร์บอร์ด</h3>';
  hs.slice(0,10).forEach((e,i)=>{ h+=`<div class="shop-item">${i+1}. ${e.name} - ⭐${e.score}</div>`; });
  if(hs.length===0)h+='<div>ยังไม่มีผู้เล่น</div>';
  h+='<button class="btn btn-outline w-full mt-2" onclick="renderScreen(\'menu\')">🔙</button></div>';
  return h;
}
function updateLeaderboard(){
  const hs = JSON.parse(localStorage.getItem('mq300_scores')||'[]');
  const idx = hs.findIndex(e=>e.name===P.name);
  if(idx>=0){ if(P.score>hs[idx].score)hs[idx].score=P.score; }
  else hs.push({name:P.name,score:P.score});
  hs.sort((a,b)=>b.score-a.score); localStorage.setItem('mq300_scores',JSON.stringify(hs.slice(0,20)));
}

function renderGuild(){
  if(!guild.name) guild.name='MyGuild';
  return `<div class="flex-col"><h3>🏰 กิลด์ ${guild.name}</h3>
    <div>เลเวล: ${guild.level} | เงินกองกลาง: ${guild.contrib}🪙</div>
    <button class="btn btn-sm btn-primary mt-1" onclick="donateGuild()">บริจาค 50🪙</button>
    <button class="btn btn-outline w-full mt-2" onclick="renderScreen('menu')">🔙</button></div>`;
}
function donateGuild(){ if(spendGold(50)){ guild.contrib+=50; if(guild.contrib>=guild.level*200){ guild.level++; guild.contrib=0; } saveGame(); renderScreen('guild'); } }

function toggleTheme(){ theme=theme==='neon'?'light':'neon'; document.documentElement.setAttribute('data-theme',theme); saveGame(); }
function toggleMusic(){ musicOn=!musicOn; if(!musicOn)stopBgMusic(); else startBgMusic(); }

function showModal(title,msg,cb){
  document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="closeModal(${cb?'true':'false'})"><div class="modal-content"><h3>${title}</h3><p>${msg}</p><button class="btn btn-primary" onclick="closeModal(${cb?'true':'false'})">ตกลง</button></div></div>`;
  window._cb=cb;
}
function closeModal(hc){ document.getElementById('modalContainer').innerHTML=''; if((hc===true||hc==='true')&&window._cb)setTimeout(window._cb,150); }

document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const inp=document.getElementById('answerInput'); if(inp&&document.activeElement===inp)submitAnswer(); } });

function init(){
  loadGame(); P.maxHp=getMaxHP(); if(P.hp>P.maxHp)P.hp=P.maxHp;
  document.documentElement.setAttribute('data-theme',theme);
  renderScreen('menu');
  updateLeaderboard();
  generateDaily();
}
init();
</script>
