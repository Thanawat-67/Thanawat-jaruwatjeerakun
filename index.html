      // === AUDIO ENGINE ===
let audioCtx = null, bgMusicGain = null, bgMusicOsc = null, isMusicPlaying = false;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(f, t = 'sine', d = 0.14, v = 0.05) {
    try {
        initAudio(); const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    } catch (e) {}
}
function sfxClick() { playSound(600, 'sine', 0.07, 0.04); }
function sfxCorrect() { playSound(700, 'triangle', 0.14, 0.07); setTimeout(() => playSound(1100, 'triangle', 0.14, 0.07), 90); }
function sfxWrong() { playSound(140, 'sawtooth', 0.2, 0.04); }
function sfxCrit() { playSound(350, 'square', 0.2, 0.06); setTimeout(() => playSound(800, 'square', 0.2, 0.09), 80); }
function sfxWin() { [500, 700, 900, 1100].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.18, 0.07), i * 110)); }
function sfxPurchase() { playSound(900, 'triangle', 0.25, 0.08); }
function sfxGacha() { [300, 500, 700, 900, 1100].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.18, 0.07), i * 70)); }
function startBgMusic() {
    if (isMusicPlaying) return;
    try {
        initAudio(); bgMusicGain = audioCtx.createGain(); bgMusicGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        bgMusicGain.connect(audioCtx.destination); bgMusicOsc = audioCtx.createOscillator(); bgMusicOsc.type = 'triangle';
        bgMusicOsc.frequency.setValueAtTime(200, audioCtx.currentTime); bgMusicOsc.connect(bgMusicGain); bgMusicOsc.start();
        isMusicPlaying = true; let t = 0;
        const mod = () => { if (!isMusicPlaying) return; t += 0.08; bgMusicOsc.frequency.setValueAtTime(200 + Math.sin(t) * 25, audioCtx.currentTime); if (isMusicPlaying) requestAnimationFrame(mod); };
        mod();
    } catch (e) {}
}
function stopBgMusic() { try { if (bgMusicOsc) { bgMusicOsc.stop(); bgMusicOsc = null; } if (bgMusicGain) { bgMusicGain.disconnect(); bgMusicGain = null; } isMusicPlaying = false; } catch (e) {} }
function createStars() { const c = document.getElementById('starsContainer'); for (let i = 0; i < 120; i++) { const s = document.createElement('div'); s.className = 'star'; const sz = Math.random() * 3 + 1; s.style.width = sz + 'px'; s.style.height = sz + 'px'; s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.setProperty('--duration', (Math.random() * 3 + 2) + 's'); s.style.setProperty('--delay', (Math.random() * 5) + 's'); c.appendChild(s); } }
function spawnParticle(x, y, text, color) { const p = document.createElement('div'); p.className = 'particle'; p.textContent = text; p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.color = color; document.body.appendChild(p); setTimeout(() => p.remove(), 1500); }
function spawnBurst(x, y, n = 10) { const e = ['✨', '⭐', '💫', '🌟', '💥', '🔥', '💎', '🎉']; for (let i = 0; i < n; i++) setTimeout(() => spawnParticle(x + (Math.random() - 0.5) * 180, y + (Math.random() - 0.5) * 120, e[Math.floor(Math.random() * e.length)], '#ffe600'), i * 30); }

function loadGame() {

            player = { ...player, ...s.player }; playerClass = s.playerClass || 'warrior'; equippedPet = s.equippedPet || null;

            player.maxHp = getMaxHp(); if (player.hp > player.maxHp) player.hp = player.maxHp;
        }
        const hs = JSON.parse(localStorage.getItem('mq_highscores_ext'));
        if (hs) highScores = hs;
    } catch (e) {}
}
function saveGame() {
    localStorage.setItem('mq_extended', JSON.stringify({ player, playerClass, equippedPet, inventory, ownedPets, ownedGachaClasses, completedLevels, bossDefeated, storyShown }));

}
function updateHighScore() {
    const exist = highScores.findIndex(h => h.name === player.name);
    if (exist >= 0) { if (player.score > highScores[exist].score) { highScores[exist].score = player.score; highScores[exist].class = playerClass; highScores[exist].lv = player.lv; } }
    else highScores.push({ name: player.name, score: player.score, class: playerClass, lv: player.lv });
    highScores.sort((a, b) => b.score - a.score); highScores = highScores.slice(0, 20);
    localStorage.setItem('mq_highscores_ext', JSON.stringify(highScores));
}

function addGold(amt) { player.gold += amt; }

function genQuestion(chapterId, difficulty) {
    const ch = chapterId; const d = difficulty;
    // จำนวนเต็มและทศนิยม
    if (ch === 1) {
        if (d <= 2) { const n1 = Math.floor(Math.random() * 30) - 15, n2 = Math.floor(Math.random() * 20) - 10; return { q: `${n1} + (${n2}) = ?`, a: n1 + n2, h: 'บวกจำนวนเต็ม' }; }
        else if (d <= 4) { const a = Math.floor(Math.random() * 10) + 1, b = Math.floor(Math.random() * 5) + 1; return { q: `(${a} × ${b}) + ${a*2} = ?`, a: a * b + a * 2, h: 'คูณก่อนบวก' }; }
        else { const a = Math.floor(Math.random() * 20) + 5; return { q: `${a} ÷ 4 = ? (ตอบทศนิยม 2 ตำแหน่ง)`, a: (a / 4).toFixed(2), h: 'หารและปัดเศษ' }; }
    }
    // เศษส่วนและทศนิยม
    if (ch === 2) {
        if (d <= 2) { const num = Math.floor(Math.random() * 5) + 2, den = Math.floor(Math.random() * 5) + 3; return { q: `${num}/${den} + ${num*2}/${den} = ? (ตอบ a/b)`, a: `${num + num*2}/${den}`, h: 'เศษส่วนส่วนเท่ากัน' }; }
        else if (d <= 4) { const num = Math.floor(Math.random() * 5) + 1, den = Math.floor(Math.random() * 4) + 5; return { q: `ทศนิยมของ ${num}/${den} = ? (ตอบ 2 ตำแหน่ง)`, a: (num / den).toFixed(2), h: 'หารตัวเลข' }; }
        else { const a = Math.floor(Math.random() * 5) + 3, b = Math.floor(Math.random() * 3) + 2; return { q: `(${a}/${b}) × (${b}/${a}) = ?`, a: 1, h: 'เศษส่วนกลับกัน' }; }
    }
    // เลขยกกำลัง
    if (ch === 3) {
        if (d <= 2) { const base = Math.floor(Math.random() * 3) + 2, exp = Math.floor(Math.random() * 2) + 2; return { q: `${base}^${exp} = ?`, a: Math.pow(base, exp), h: 'คำนวณเลขยกกำลัง' }; }
        else if (d <= 4) { const base = Math.floor(Math.random() * 2) + 2; return { q: `${base}^3 × ${base}^2 = ${base}^?`, a: 5, h: 'a^m × a^n = a^(m+n)' }; }
        else { const base = Math.floor(Math.random() * 3) + 2; return { q: `(${base}^3)^2 = ${base}^?`, a: 6, h: '(a^m)^n = a^(m*n)' }; }
    }
    // พหุนาม
    if (ch === 4) {
        if (d <= 2) { const a = Math.floor(Math.random() * 4) + 2, x = 1; return { q: `2x + ${a}x เมื่อ x=1 = ?`, a: 2 + a, h: 'รวมพจน์เหมือน' }; }
        else if (d <= 4) { const a = Math.floor(Math.random() * 3) + 2, b = Math.floor(Math.random() * 3) + 1; return { q: `(${a}x + ${b}) + (${a*2}x - ${b}) เมื่อ x=1 = ?`, a: (a + b) + (a * 2 - b), h: 'รวมพจน์และแทนค่า' }; }
        else { const a = Math.floor(Math.random() * 3) + 2, b = Math.floor(Math.random() * 3) + 1; return { q: `(${a}x + ${b})(${a}x - ${b}) เมื่อ x=1 = ?`, a: (a + b) * (a - b), h: 'ผลต่างกำลังสอง' }; }
    }
    // การแยกตัวประกอบ
    if (ch === 5) {
        if (d <= 2) { const n = Math.floor(Math.random() * 5) + 2; return { q: `x² + ${2*n}x + ${n*n} = (x + ?)²`, a: n, h: '(x+a)² = x²+2ax+a²' }; }
        else if (d <= 4) { const n = Math.floor(Math.random() * 5) + 2; return { q: `x² - ${2*n}x + ${n*n} = (x - ?)²`, a: n, h: '(x-a)²' }; }
        else { const n = Math.floor(Math.random() * 5) + 3; return { q: `x² - ${n*n} = (x + ${n})(x - ?)`, a: n, h: 'ผลต่างกำลังสอง: a²-b²=(a+b)(a-b)' }; }
    }
    // สมการเชิงเส้น
    if (ch === 6) {
        if (d <= 2) { const x = Math.floor(Math.random() * 8) + 2, b = Math.floor(Math.random() * 10) + 5; return { q: `x + ${b} = ${x+b} จงหา x`, a: x, h: 'แก้สมการ' }; }
        else if (d <= 4) { const a = Math.floor(Math.random() * 3) + 2, b = Math.floor(Math.random() * 5) + 1, c = Math.floor(Math.random() * 10) + 5; return { q: `${a}x + ${b} = ${c} จงหา x`, a: (c - b) / a, h: 'ย้ายข้างสมการ' }; }
        else { const x = Math.floor(Math.random() * 5) + 3, y = Math.floor(Math.random() * 5) + 1; return { q: `2x + y = ${2*x+y}, x - y = ${x-y} จงหา x`, a: x, h: 'แก้ระบบสมการ' }; }
    }
    // อัตราส่วนและร้อยละ
    if (ch === 7) {
        if (d <= 2) { const p = Math.floor(Math.random() * 30) + 10; return { q: `${p}% ของ 200 = ?`, a: p * 2, h: 'ร้อยละของจำนวน' }; }
        else if (d <= 4) { const part = Math.floor(Math.random() * 30) + 10, whole = Math.floor(Math.random() * 30) + 50; return { q: `${part} จาก ${whole} คิดเป็นกี่ %? (ปัดเศษ)`, a: Math.round(part / whole * 100), h: '(ส่วน/ทั้งหมด)×100' }; }
        else { const a = Math.floor(Math.random() * 5) + 2, b = Math.floor(Math.random() * 5) + 3; return { q: `อัตราส่วน ${a}:${b} ถ้าฝั่งแรกมี ${a*3} ฝั่งที่สองมี?`, a: b * 3, h: 'อัตราส่วนที่เท่ากัน' }; }
    }
    // ความเท่ากันทุกประการ
    if (ch === 8) {
        if (d <= 2) { const side = Math.floor(Math.random() * 8) + 4; return { q: `สามเหลี่ยมด้านเท่ามีด้านหนึ่งยาว ${side} ซม. ด้านอื่นยาว?`, a: side, h: 'ทุกด้านเท่ากัน' }; }
        else if (d <= 4) { const ang = Math.floor(Math.random() * 30) + 40; return { q: `สามเหลี่ยมหน้าจั่วมีมุมยอด ${ang}° มุมที่ฐานกาง?`, a: Math.round((180 - ang) / 2), h: '(180-มุมยอด)/2' }; }
        else { const a = Math.floor(Math.random() * 5) + 3, b = Math.floor(Math.random() * 5) + 3; return { q: `สามเหลี่ยมมุมฉากด้าน ${a},${b} ด้านตรงข้ามฉาก?`, a: Math.sqrt(a*a + b*b).toFixed(1), h: 'c² = a²+b²' }; }
    }
    // ทฤษฎีบทพีทาโกรัส
    if (ch === 9) {
        if (d <= 2) { return { q: `สามเหลี่ยมด้าน 3,4 ด้านตรงข้ามฉาก?`, a: 5, h: 'สามเหลี่ยม 3-4-5' }; }
        else if (d <= 4) { const m = Math.floor(Math.random() * 2) + 1; return { q: `สามเหลี่ยมด้าน ${3*m},${4*m} ด้านตรงข้ามฉาก?`, a: 5 * m, h: 'สามเหลี่ยม 3-4-5 เท่า' }; }
        else { const a = Math.floor(Math.random() * 6) + 5, b = Math.floor(Math.random() * 4) + 6; return { q: `สามเหลี่ยมมุมฉากด้าน ${a},${b} ด้านที่สาม?`, a: Math.sqrt(a*a + b*b).toFixed(1), h: 'c = √(a²+b²)' }; }

    if (ch === 10) {

        else if (d <= 4) { const nums = [Math.floor(Math.random()*20)+20, Math.floor(Math.random()*20)+30, Math.floor(Math.random()*20)+40, Math.floor(Math.random()*20)+25, Math.floor(Math.random()*20)+35]; nums.sort((a,b)=>a-b); return { q: `มัธยฐานของ ${nums.join(',')} = ?`, a: nums[2], h: 'ค่ากลางเมื่อเรียงลำดับ' }; }

    }
    return { q: '5 + 3 = ?', a: 8, h: 'บวกเลข' };

function nextQuestion() {
    if (player.bossHp <= 0 || player.hp <= 0) { endBattle(); return; }
    const cd = getCD();
    if (cd.regen && player.hp < player.maxHp) { player.hp = Math.min(player.maxHp, player.hp + cd.regen); updateBattleUI(); }
    currentQuestion = genQuestion(player.chapter, player.level);
    const qd = document.getElementById('questionDisplay'); if (qd) qd.innerHTML = currentQuestion.q;
    const inp = document.getElementById('answerInput'); if (inp) { inp.value = ''; inp.disabled = false; inp.className = 'answer-input'; setTimeout(() => inp.focus(), 100); }
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('feedbackMsg').textContent = '';
    document.getElementById('comboDisplay').textContent = '';
    updateCDUI();
    startTimer();
}

function submitAnswer() {
    stopTimer();
    const inp = document.getElementById('answerInput'); if (!inp || !currentQuestion) return;
    const ua = inp.value.trim(); if (ua === '') return;
    inp.disabled = true; document.getElementById('submitBtn').disabled = true;
    const ca = String(currentQuestion.a);
    let correct = ua === ca;
    if (!correct && !isNaN(parseFloat(ua)) && !isNaN(parseFloat(ca))) correct = Math.abs(parseFloat(ua) - parseFloat(ca)) < 0.09;
    if (correct) { inp.classList.add('correct-flash'); setTimeout(() => inp.classList.remove('correct-flash'), 500); handleCorrect(inp); }
    else { inp.classList.add('wrong-flash'); setTimeout(() => inp.classList.remove('wrong-flash'), 500); handleWrongAnswer(inp, false); }
}

function handleCorrect(inp) {
    sfxCorrect(); player.combo++; player.tc++;
    if (player.combo > player.maxCombo) player.maxCombo = player.combo;
    const cd = getCD(); const pb = getPetBonus();
    let dmg = 20 + player.combo * 5;
    dmg = Math.round(dmg * cd.dmgMul * getWeaponMul() * (1 + pb.dmg));
    if (player.combo >= 5 && cd.comboMul) dmg = Math.round(dmg * cd.comboMul);
    if (player.combo >= 5 && pb.combo > 0) dmg = Math.round(dmg * (1 + pb.combo));
    let critC = 0.06 + (cd.critBonus || 0) + pb.crit + (inventory.orb ? 0.2 : 0);
    let isCrit = Math.random() < critC;
    if (skillActive.gcrit) { isCrit = true; skillActive.gcrit = false; }
    if (skillActive.stealth) { isCrit = true; skillActive.stealth = false; }
    if (skillActive.berserk) dmg = Math.round(dmg * 2);
    if (isCrit) { dmg = Math.round(dmg * (cd.critMul || 3)); sfxCrit(); const be = document.getElementById('bossEmoji'); if (be) { be.classList.add('crit'); setTimeout(() => be.classList.remove('crit'), 500); } }
    if (skillActive.cboost && isCrit) { dmg = Math.round(dmg * (cd.skill1?.mul || 3)); skillActive.cboost = false; }
    if (skillActive.drain) { const heal = Math.round(dmg * (cd.skill2?.healPct || 0.5)); player.hp = Math.min(player.maxHp, player.hp + heal); skillActive.drain = false; }
    player.bossHp = Math.max(0, player.bossHp - dmg);
    const goldEarn = Math.round(12 + player.combo * 3 + player.level * 3);
    addGold(goldEarn); player.score += Math.round(30 + player.combo * 5);
    if (inp) { const r = inp.getBoundingClientRect(); spawnParticle(r.left + r.width / 2, r.top, isCrit ? '💥CRIT!' : '⚡', isCrit ? '#ffe600' : '#00f0ff'); }
    document.getElementById('feedbackMsg').textContent = `✅ถูก! DMG:${dmg}${isCrit?'💥คริ!':''} | +${goldEarn}🪙`;
    document.getElementById('feedbackMsg').style.color = 'var(--neon-green)';
    if (player.combo >= 3) { document.getElementById('comboDisplay').textContent = `🔥 COMBO x${player.combo}!`; document.getElementById('comboBadge').textContent = `🔥${player.combo}`; }
    updateBattleUI(); reduceCD(); saveGame();
    setTimeout(nextQuestion, 900);
}

function handleWrongAnswer(inp, isTimeUp) {
    sfxWrong(); player.combo = 0; player.tw++;
    let dmgTaken = 8 + player.level * 2 + (isTimeUp ? 6 : 0);
    const cd = getCD();
    if (skillActive.dodge) { skillActive.dodge = false; dmgTaken = 0; document.getElementById('feedbackMsg').textContent = '💨หลบได้!'; }
    else if (skillActive.stealth && Math.random() < 0.5) { skillActive.stealth = false; dmgTaken = 0; document.getElementById('feedbackMsg').textContent = '💨ล่องหนหลบ!'; }
    else if (player.shield) { player.shield = false; if (skillActive.reflect) { skillActive.reflect = false; player.bossHp = Math.max(0, player.bossHp - 20); document.getElementById('feedbackMsg').textContent = '🛡️สะท้อน20!'; } else { dmgTaken = 0; document.getElementById('feedbackMsg').textContent = '🛡️ป้องกัน!'; } }
    else if (getDodgeChance() > 0 && Math.random() < getDodgeChance()) { dmgTaken = 0; document.getElementById('feedbackMsg').textContent = '👟หลบด้วยรองเท้า!'; }
    else { player.hp = Math.max(0, player.hp - dmgTaken); document.getElementById('feedbackMsg').textContent = `❌ผิด!${isTimeUp?'⏱หมดเวลา!':''} ตอบ:${currentQuestion?.a} (-${dmgTaken}HP)`; document.getElementById('feedbackMsg').style.color = 'var(--neon-pink)'; }
    document.getElementById('comboBadge').textContent = '🔥0'; document.getElementById('comboDisplay').textContent = '';
    updateBattleUI(); reduceCD(); saveGame();
    setTimeout(nextQuestion, 1400);
}

function updateBattleUI() {
    document.getElementById('playerHpBar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
    document.getElementById('bossHpBar').style.width = Math.max(0, (player.bossHp / player.bossMaxHp) * 100) + '%';
    document.getElementById('playerHpText').textContent = `${player.hp}/${player.maxHp}`;
    document.getElementById('bossHpText').textContent = `${player.bossHp}/${player.bossMaxHp}`;
    document.getElementById('comboBadge').textContent = `🔥${player.combo}`;
}
function updateCDUI() {
    const cd = getCD();
    document.getElementById('cdIndicator').textContent = (skillCD.s1 > 0 ? `${cd.skill1.name} CD${skillCD.s1} ` : '') + (skillCD.s2 > 0 ? `${cd.skill2.name} CD${skillCD.s2}` : '');
    document.getElementById('btnS1').disabled = skillCD.s1 > 0 || player.gold < cd.skill1.cost || skillUseCount.s1 >= 3;
    document.getElementById('btnS2').disabled = skillCD.s2 > 0 || player.gold < cd.skill2.cost || skillUseCount.s2 >= 3;
    document.getElementById('s1Count').textContent = 3 - skillUseCount.s1;
    document.getElementById('s2Count').textContent = 3 - skillUseCount.s2;
}

function useSkill(type) {
    const cd = getCD();
    if (type === 's1') { if (skillCD.s1 > 0 || !spendGold(cd.skill1.cost) || skillUseCount.s1 >= 3) return; skillUseCount.s1++; skillCD.s1 = cd.skill1.cooldown; sfxPurchase();
        if (cd.skill1.type === 'gcrit') skillActive.gcrit = true; if (cd.skill1.type === 'cboost') skillActive.cboost = true;
        if (cd.skill1.type === 'dmg') { const bd = Math.round(30 * (cd.skill1.mul || 2)); player.bossHp = Math.max(0, player.bossHp - bd); spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 8); updateBattleUI(); }
        if (cd.skill1.type === 'dmgheal') { const bd = Math.round(30 * (cd.skill1.mul || 2)); player.bossHp = Math.max(0, player.bossHp - bd); player.hp = Math.min(player.maxHp, player.hp + (cd.skill1.heal || 30)); updateBattleUI(); }
    } else if (type === 's2') { if (skillCD.s2 > 0 || !spendGold(cd.skill2.cost) || skillUseCount.s2 >= 3) return; skillUseCount.s2++; skillCD.s2 = cd.skill2.cooldown; sfxPurchase();
        if (cd.skill2.type === 'shield') player.shield = true; if (cd.skill2.type === 'reflect') { player.shield = true; skillActive.reflect = true; }
        if (cd.skill2.type === 'heal') { player.hp = Math.min(player.maxHp, player.hp + cd.skill2.heal); updateBattleUI(); }
        if (cd.skill2.type === 'dodge') skillActive.dodge = true; if (cd.skill2.type === 'stealth') { skillActive.dodge = true; skillActive.stealth = true; }
        if (cd.skill2.type === 'drain') skillActive.drain = true; if (cd.skill2.type === 'berserk') skillActive.berserk = true;
        if (cd.skill2.type === 'shieldheal') { player.shield = true; player.hp = Math.min(player.maxHp, player.hp + (cd.skill2.heal || 25)); updateBattleUI(); }
    }
    updateCDUI(); saveGame();
}

function skipQuestion() { stopTimer(); player.hp = Math.max(0, player.hp - 8); player.combo = 0; updateBattleUI(); reduceCD(); document.getElementById('comboBadge').textContent = '🔥0'; document.getElementById('feedbackMsg').textContent = '⏩ข้าม -8HP'; if (player.hp <= 0) endBattle(); else nextQuestion(); }
function reduceCD() { if (skillCD.s1 > 0) skillCD.s1--; if (skillCD.s2 > 0) skillCD.s2--; updateCDUI(); }

function usePotion() { if (inventory.potion <= 0) return; inventory.potion--; player.hp = player.maxHp; updateBattleUI(); saveGame(); }
function useSuperPotion() { if (inventory.superPotion <= 0) return; inventory.superPotion--; player.hp = player.maxHp; player.bossHp = Math.max(0, player.bossHp - 50); updateBattleUI(); spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 10); saveGame(); }

function endBattle() {
    stopTimer(); stopBgMusic();
    if (player.bossHp <= 0) { sfxWin(); const goldR = Math.round(35 + player.level * 25); addGold(goldR); player.score += Math.round(100 + player.level * 50); unlockNext(player.chapter, player.level); saveGame(); spawnBurst(window.innerWidth / 2, window.innerHeight / 3, 20); setTimeout(() => showModal('🎉ชัยชนะ!', `พิชิตบทที่ ${player.chapter} ด่าน ${player.level}!\n+${goldR}🪙`, () => renderScreen('chapters')), 700); }
    else { player.gold = Math.max(0, player.gold - 10); saveGame(); showModal('💀พ่ายแพ้', 'เสีย 10🪙', () => renderScreen('chapters')); }
}
function startBattle(chapterId, levelId) { player.chapter = chapterId; player.level = levelId; player.maxHp = getMaxHp(); player.hp = player.maxHp; player.combo = 0; player.shield = false; skillCD = { s1: 0, s2: 0 }; skillActive = { gcrit: false, dodge: false, cboost: false, stealth: false, reflect: false, berserk: false, drain: false }; skillUseCount = { s1: 0, s2: 0 }; renderScreen('battle'); }
function flee() { stopTimer(); stopBgMusic(); player.gold = Math.max(0, player.gold - 10); saveGame(); renderScreen('chapters'); }
