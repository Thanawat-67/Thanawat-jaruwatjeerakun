<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ พิชิตจักรวาลคณิตศาสตร์ ม.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff006e;
            --neon-purple: #b537f2;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --neon-orange: #ff6b35;
            --dark-bg: #0a0a1a;
            --card-bg: rgba(15, 15, 35, 0.95);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --warrior-primary: #ff6b35;
            --warrior-secondary: #cc4400;
            --mage-primary: #b537f2;
            --mage-secondary: #7b2ff7;
            --rogue-primary: #39ff14;
            --rogue-secondary: #00b09b;
            --glow-blue: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 0, 110, 0.5);
            --glow-purple: 0 0 20px rgba(181, 55, 242, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #0a0a1a;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 110, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(181, 55, 242, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            90% {
                transform: translateX(-3px);
            }
            20%,
            80% {
                transform: translateX(3px);
            }
            30%,
            70% {
                transform: translateX(-3px);
            }
            40%,
            60% {
                transform: translateX(3px);
            }
            50% {
                transform: translateX(-3px);
            }
        }

        .screen-shake {
            animation: shake 0.5s ease-in-out;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        @keyframes attackShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-12px);
            }
            75% {
                transform: translateX(12px);
            }
        }
        .attacking {
            animation: attackShake 0.3s ease-in-out;
        }

        @keyframes hitFlash {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(2.5) saturate(2);
            }
        }
        .hit {
            animation: hitFlash 0.25s ease-in-out;
        }

        @keyframes bossDefeat {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.5;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
        .boss-defeated {
            animation: bossDefeat 0.8s ease-in forwards;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: particleFloat 1.5s ease-out forwards;
            font-weight: bold;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            text-shadow: 0 0 10px currentColor;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-60px) scale(1.3) rotate(180deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-120px) scale(0.8) rotate(360deg);
                opacity: 0;
            }
        }

        .main-container {
            width: 100%;
            max-width: 750px;
            position: relative;
            z-index: 1;
            padding: 10px;
        }

        .game-wrapper {
            background: var(--card-bg);
            border-radius: 24px;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2), 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            backdrop-filter: blur(20px);
            transition: box-shadow 0.3s;
        }

        .game-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-blue));
            border-radius: 26px;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            background-size: 300% 300%;
        }

        @keyframes borderGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .game-header {
            padding: 20px 25px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
            border-bottom: 1px solid var(--glass-border);
        }

        .creator-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 0, 110, 0.2), rgba(181, 55, 242, 0.2));
            border: 1px solid var(--neon-pink);
            padding: 8px 20px;
            border-radius: 20px;
            margin-bottom: 12px;
            animation: badgePulse 2s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 110, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 0, 110, 0.7);
            }
        }
        .creator-badge span {
            font-weight: 700;
            font-size: 13px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green), var(--neon-yellow), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 2s ease-in-out infinite;
            letter-spacing: 2px;
        }
        @keyframes titleShine {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.4);
            }
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .game-content {
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .game-content::-webkit-scrollbar {
            width: 6px;
        }
        .game-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .game-content::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 3px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.6);
        }
        .btn-success {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.6);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-outline:hover {
            background: rgba(0, 240, 255, 0.1);
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 11px;
            border-radius: 8px;
        }

        /* Class selection */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .class-card {
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
        }
        .class-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.3);
        }
        .class-card.selected {
            border-color: var(--neon-green);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.4);
            background: rgba(57, 255, 20, 0.1);
        }
        .class-icon {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }
        .class-name {
            font-weight: 700;
            color: white;
            font-size: 16px;
        }
        .class-desc {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            line-height: 1.4;
        }

        /* Chapter cards */
        .chapter-container {
            margin-bottom: 12px;
        }
        .chapter-header {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.08), rgba(181, 55, 242, 0.08));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }
        .chapter-header:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .chapter-header.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chapter-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        .chapter-info {
            flex: 1;
        }
        .chapter-name {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }
        .chapter-progress {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        .level-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 8px 0 0 60px;
        }
        .level-btn {
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            text-align: center;
            font-family: 'Kanit', sans-serif;
        }
        .level-btn:hover:not(.locked) {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
            transform: translateY(-2px);
        }
        .level-btn.completed {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.15);
        }
        .level-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .level-btn.current {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
            animation: pulseBorder 1.5s ease-in-out infinite;
        }
        @keyframes pulseBorder {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 230, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 230, 0, 0.7);
            }
        }

        /* Battle scene */
        .battle-scene {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(15, 15, 35, 0.9) 100%);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .battle-scene::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.5), transparent);
            pointer-events: none;
            z-index: 1;
        }
        .combatants-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: relative;
            z-index: 2;
        }
        .combatant {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .pixel-canvas {
            display: block;
            margin: 0 auto 8px;
            image-rendering: pixelated;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }
        .pixel-canvas.boss-canvas {
            box-shadow: 0 0 25px rgba(255, 0, 110, 0.6);
            animation: bossGlow 1.5s ease-in-out infinite;
        }
        @keyframes bossGlow {
            0%,
            100% {
                box-shadow: 0 0 25px rgba(255, 0, 110, 0.6);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 0, 110, 1);
            }
        }

        .hp-bar-outer {
            background: #1a1a2e;
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 6px;
        }
        .hp-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #00f0ff, #00c6ff);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .hp-bar-inner.boss-hp {
            background: linear-gradient(90deg, #ff006e, #ff4b2b);
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.5);
        }
        .hp-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 3px;
        }

        .vs-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 28px;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.7);
            animation: vsPulse 1s ease-in-out infinite;
        }
        @keyframes vsPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .question-panel {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }
        .question-display {
            font-size: 19px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .answer-input-row {
            display: flex;
            gap: 10px;
        }
        .answer-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: 'Kanit', sans-serif;
        }
        .answer-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .answer-input:disabled {
            opacity: 0.6;
        }

        .combo-display {
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            min-height: 24px;
            font-family: 'Press Start 2P', cursive;
        }
        .combo-display.active {
            color: var(--neon-yellow);
            animation: comboShake 0.5s ease-in-out;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
        }
        @keyframes comboShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            flex-wrap: wrap;
            gap: 5px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-value {
            font-weight: 700;
            color: var(--neon-blue);
        }

        .shop-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .shop-item:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(181, 55, 242, 0.2);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .badge-warning {
            background: rgba(255, 230, 0, 0.2);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
        }
        .badge-success {
            background: rgba(57, 255, 20, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }
        .badge-info {
            background: rgba(0, 240, 255, 0.2);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
        }
        .badge-danger {
            background: rgba(255, 0, 110, 0.2);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
        }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 11px;
        }
        .text-lg {
            font-size: 18px;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-4 {
            margin-top: 16px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-4 {
            margin-bottom: 16px;
        }
        .w-full {
            width: 100%;
        }
        .progress-bar {
            background: #1a1a2e;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            transition: width 0.5s;
        }
        .skill-cooldown-indicator {
            font-size: 10px;
            color: var(--neon-yellow);
            text-align: center;
            margin-top: 2px;
            min-height: 14px;
        }

        @media (max-width: 600px) {
            .class-grid {
                grid-template-columns: 1fr;
            }
            .level-list {
                grid-template-columns: 1fr 1fr;
                padding-left: 0;
            }
            .combatants-row {
                flex-direction: column;
                gap: 5px;
            }
            .vs-badge {

            try {

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }
