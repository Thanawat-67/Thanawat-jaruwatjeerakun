<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest: ตะวันสุดหล่อ พิชิตจักรวาลคณิตศาสตร์ ม.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d1a;
            --surface: #15152a;
            --surface2: #1c1c35;
            --text: #e8e8f0;
            --text2: #b0b0c0;
            --accent: #5b9cf5;
            --accent2: #f59b5b;
            --green: #5cdb8b;
            --red: #f55b6c;
            --yellow: #f5d75b;
            --purple: #a78bfa;
            --gold: #f5c842;
            --border: #2a2a45;
            --radius: 14px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(91, 156, 245, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(245, 155, 91, 0.04) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .main-container {
            width: 100%;
            max-width: 720px;
            position: relative;
            z-index: 1;
        }
        .game-wrapper {
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .game-header {
            padding: 18px 20px;
            text-align: center;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }
        .creator-badge {
            display: inline-block;
            background: rgba(245, 200, 66, 0.12);
            border: 1px solid var(--gold);
            padding: 6px 16px;
            border-radius: 16px;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6em;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 2px;
        }
        .subtitle {
            color: var(--text2);
            font-size: 11px;
            margin-top: 3px;
            letter-spacing: 1px;
        }
        .game-content {
            padding: 16px;
            max-height: 78vh;
            overflow-y: auto;
        }
        .game-content::-webkit-scrollbar {
            width: 5px;
        }
        .game-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .game-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .btn {
            display: inline-block;
            padding: 11px 20px;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 13px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: #6aadf8;
            transform: translateY(-1px);
        }
        .btn-success {
            background: var(--green);
            color: #0d0d1a;
        }
        .btn-success:hover {
            background: #6de89a;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-danger:hover {
            background: #f76b7a;
        }
        .btn-warning {
            background: var(--yellow);
            color: #1a1a2e;
        }
        .btn-warning:hover {
            background: #f7e06b;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover {
            background: rgba(91, 156, 245, 0.08);
        }
        .btn-sm {
            padding: 7px 13px;
            font-size: 11px;
            border-radius: 7px;
        }
        .btn-xs {
            padding: 5px 10px;
            font-size: 10px;
            border-radius: 6px;
        }
        .btn-gold {
            background: linear-gradient(135deg, #f5c842, #e0a800);
            color: #1a1a2e;
            font-weight: 700;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--surface2);
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text2);
            flex-wrap: wrap;
            gap: 6px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-value {
            font-weight: 700;
            color: var(--accent);
        }
        .stat-gold {
            color: var(--gold);
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge-gold {
            background: rgba(245, 200, 66, 0.15);
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .badge-green {
            background: rgba(92, 219, 139, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }
        .badge-blue {
            background: rgba(91, 156, 245, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .badge-red {
            background: rgba(245, 91, 108, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }
        .badge-purple {
            background: rgba(167, 139, 250, 0.15);
            color: var(--purple);
            border: 1px solid var(--purple);
        }

        .rank-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 16px;
            display: inline-block;
        }
        .rank-s {
            background: linear-gradient(135deg, #f5c842, #e0a800);
            color: #1a1a2e;
        }
        .rank-a {
            background: #f55b6c;
            color: #fff;
        }
        .rank-b {
            background: #5b9cf5;
            color: #fff;
        }
        .rank-c {
            background: #5a5a7a;
            color: #fff;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .class-card {
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            position: relative;
        }
        .class-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .class-card.selected {
            border-color: var(--green);
            background: rgba(92, 219, 139, 0.06);
        }
        .class-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--border);
        }
        .class-card.locked:hover {
            transform: none;
            border-color: var(--border);
        }
        .class-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 6px;
        }
        .class-name {
            font-weight: 700;
            color: var(--text);
            font-size: 15px;
        }
        .class-desc {
            font-size: 10px;
            color: var(--text2);
            margin-top: 4px;
            line-height: 1.4;
        }
        .class-lock-info {
            font-size: 10px;
            color: var(--red);
            margin-top: 4px;
        }

        .chapter-container {
            margin-bottom: 10px;
        }
        .chapter-header {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .chapter-header:hover {
            border-color: var(--accent);
        }
        .chapter-header.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chapter-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .chapter-info {
            flex: 1;
        }
        .chapter-name {
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
        }
        .chapter-progress {
            font-size: 10px;
            color: var(--text2);
        }
        .level-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            padding: 6px 0 0 52px;
        }
        .level-btn {
            padding: 9px 7px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Kanit', sans-serif;
        }
        .level-btn:hover:not(.locked) {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .level-btn.completed {
            border-color: var(--green);
            background: rgba(92, 219, 139, 0.08);
        }
        .level-btn.locked {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        .level-btn.current {
            border-color: var(--gold);
            background: rgba(245, 200, 66, 0.08);
        }

        .battle-scene {
            background: var(--surface2);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            text-align: center;
            position: relative;
        }
        .emoji-display {
            font-size: 72px;
            display: inline-block;
            transition: transform 0.3s, opacity 0.3s;
            line-height: 1;
            user-select: none;
        }
        .emoji-display.shake {
            animation: emojiShake 0.4s ease-in-out;
        }
        .emoji-display.crit {
            animation: emojiCrit 0.5s ease-out;
        }
        .emoji-display.heal {
            animation: emojiHeal 0.6s ease-in-out;
        }
        @keyframes emojiShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            75% {
                transform: translateX(8px);
            }
        }
        @keyframes emojiCrit {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.6) rotate(-8deg);
            }
            60% {
                transform: scale(1.1) rotate(4deg);
            }
            100% {
                transform: scale(1) rotate(0);
            }
        }
        @keyframes emojiHeal {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.6) drop-shadow(0 0 16px #5cdb8b);
            }
        }
        .combatants-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 10px;
            flex-wrap: wrap;
        }
        .combatant {
            text-align: center;
            min-width: 100px;
        }
        .combatant-name {
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
            margin-top: 4px;
        }
        .combatant-name.boss {
            color: var(--red);
        }
        .hp-bar-outer {
            background: #1a1a30;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 4px;
            width: 100%;
            max-width: 140px;
            margin-left: auto;
            margin-right: auto;
        }
        .hp-bar-inner {
            height: 100%;
            border-radius: 8px;
            transition: width 0.4s;
            background: var(--accent);
        }
        .hp-bar-inner.boss-hp {
            background: var(--red);
        }
        .hp-text {
            font-size: 10px;
            color: var(--text2);
            margin-top: 2px;
        }
        .vs-badge {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 22px;
            color: var(--gold);
        }
        .pet-indicator {
            font-size: 11px;
            color: var(--purple);
            margin-top: 3px;
            font-weight: 600;
        }

        .question-panel {
            background: var(--surface2);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .question-display {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .answer-input-row {
            display: flex;
            gap: 8px;
        }
        .answer-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: #0d0d1a;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
            font-family: 'Kanit', sans-serif;
        }
        .answer-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 156, 245, 0.15);
        }
        .answer-input:disabled {
            opacity: 0.5;
        }
        .answer-input.correct-flash {
            border-color: var(--green) !important;
            background: rgba(92, 219, 139, 0.08) !important;
        }
        .answer-input.wrong-flash {
            border-color: var(--red) !important;
            background: rgba(245, 91, 108, 0.08) !important;
        }

        .combo-display {
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            margin-top: 8px;
            min-height: 22px;
            color: var(--gold);
        }
        .feedback-msg {
            font-size: 12px;
            text-align: center;
            margin-top: 6px;
            min-height: 16px;
            color: var(--text2);
        }

        .shop-item {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .shop-item:hover {
            border-color: var(--accent);
        }
        .pet-card {
            display: inline-block;
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .pet-card:hover {
            border-color: var(--purple);
            transform: translateY(-2px);
        }
        .pet-card.equipped {
            border-color: var(--green);
            background: rgba(92, 219, 139, 0.06);
        }
        .pet-emoji {
            font-size: 44px;
            display: block;
        }
        .gacha-card {
            background: var(--surface2);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }
        .gacha-result {
            font-size: 64px;
            animation: gachaReveal 0.6s ease-out;
        }
        @keyframes gachaReveal {
            0% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.3) rotate(-10deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }
        .gacha-sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            animation: sparkleFloat 1.2s ease-out forwards;
            font-size: 28px;
        }
        @keyframes sparkleFloat {
            0% {
                transform: translateY(0) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translateY(-160px) scale(1.5);
                opacity: 0;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--surface);
            border-radius: 18px;
            padding: 26px;
            max-width: 440px;
            width: 90%;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: var(--shadow);
        }

        .flex-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .text-center {
            text-align: center;
        }
        .text-sm {
            font-size: 10px;
        }
        .text-lg {
            font-size: 17px;
        }
        .mt-1 {
            margin-top: 4px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-4 {
            margin-top: 14px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-4 {
            margin-bottom: 14px;
        }
        .w-full {
            width: 100%;
        }
        .progress-bar {
            background: #1a1a30;
            border-radius: 6px;
            height: 6px;
            overflow: hidden;
            margin-top: 3px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 6px;
            background: var(--accent);
            transition: width 0.4s;
        }

        @media (max-width: 500px) {
            .class-grid {
                grid-template-columns: 1fr;
            }
            .level-list {
                grid-template-columns: 1fr 1fr;
                padding-left: 0;
            }
            .emoji-display {
                font-size: 52px;
            }
            .game-title {
                font-size: 1.2em;
            }
            .combatants-row {
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="game-wrapper" id="gameWrapper">
            <div class="game-header">
                <div class="creator-badge">⚡ ทำโดย ตะวันสุดหล่อ ⚡</div>
                <div class="game-title">MATH QUEST</div>
                <div class="subtitle">พิชิตจักรวาลคณิตศาสตร์ ม.2 | Ultimate Edition</div>
            </div>
            <div class="game-content" id="gameContent"></div>
        </div>
    </div>
    <div id="modalContainer"></div>

    <script>
        // ============================================
        // 🎮 MATH QUEST - ULTIMATE EDITION
        // ============================================
        // Features: Pets, Gacha, Emoji Characters, Boss Classes
        // ============================================

        // ──────────────── AUDIO ENGINE ────────────────
        let audioCtx = null;
        let bgMusicGain = null;
        let bgMusicOsc = null;
        let isMusicPlaying = false;

        function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }

        function playSound(freq, type = 'sine', duration = 0.15, vol = 0.06) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function sfxClick() { playSound(600, 'sine', 0.08, 0.05); }

        function sfxCorrect() { playSound(700, 'triangle', 0.16, 0.08);
            setTimeout(() => playSound(1100, 'triangle', 0.16, 0.08), 100); }

        function sfxWrong() { playSound(140, 'sawtooth', 0.22, 0.05); }

        function sfxCrit() { playSound(350, 'square', 0.22, 0.07);
            setTimeout(() => playSound(800, 'square', 0.22, 0.1), 90); }

        function sfxWin() { [500, 700, 900, 1100].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.2, 0.08), i *
                120)); }

        function sfxSkill() { playSound(450, 'triangle', 0.18, 0.06);
            setTimeout(() => playSound(650, 'triangle', 0.18, 0.06), 90); }

        function sfxPurchase() { playSound(900, 'triangle', 0.28, 0.1); }

        function sfxGacha() { [300, 500, 700, 900, 1100].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.2, 0.08),
                i * 80)); }

        function sfxLevelUp() { [350, 550, 750, 950, 1150].forEach((f, i) => setTimeout(() => playSound(f, 'triangle', 0.22,
                0.1), i * 90)); }

        function startBgMusic() {
            if (isMusicPlaying) return;
            try {
                initAudio();
                bgMusicGain = audioCtx.createGain();
                bgMusicGain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                bgMusicGain.connect(audioCtx.destination);
                bgMusicOsc = audioCtx.createOscillator();
                bgMusicOsc.type = 'triangle';
                bgMusicOsc.frequency.setValueAtTime(200, audioCtx.currentTime);
                bgMusicOsc.connect(bgMusicGain);
                bgMusicOsc.start();
                isMusicPlaying = true;
                let time = 0;
                const modulate = () => {
                    if (!isMusicPlaying) return;
                    time += 0.08;
                    bgMusicOsc.frequency.setValueAtTime(200 + Math.sin(time) * 25, audioCtx.currentTime);
                    if (isMusicPlaying) requestAnimationFrame(modulate);
                };
                modulate();
            } catch (e) {}
        }

        function stopBgMusic() {
            try {

        // ──────────────── QUESTION GENERATOR ────────────────
        function generateQuestion(chapterId, difficulty) {
            let question, answer, hint;
            const ch = chapterId;
            const diff = difficulty || 1;
            switch (ch) {
                case 1:
                    if (diff <= 1) { const base = Math.floor(Math.random() * 3) + 2,
                            exp1 = Math.floor(Math.random() * 2) + 2,
                            exp2 = Math.floor(Math.random() * 2) + 1;
                        question =
                            `${base}<sup>${exp1}</sup> × ${base}<sup>${exp2}</sup> = ${base}<sup>?</sup> จงหาเลขชี้กำลัง`;
                        answer = exp1 + exp2;
                        hint = 'a^m × a^n = a^(m+n)'; } else if (diff === 2) { const base = Math.floor(Math.random() * 3) + 3,
                            exp = Math.floor(Math.random() * 2) + 2;
                        question = `(${base}^${exp})^2 = ${base}^?`;
                        answer = exp * 2;
                        hint = '(a^m)^n = a^(m×n)'; } else { const base = Math.floor(Math.random() * 4) + 2,
                            exp1 = Math.floor(Math.random() * 3) + 3,
                            exp2 = Math.floor(Math.random() * 2) + 2;
                        question = `${base}^${exp1} ÷ ${base}^${exp2} = ${base}^?`;
                        answer = exp1 - exp2;
                        hint = 'a^m ÷ a^n = a^(m-n)'; }
                    break;
                case 2:
                    if (diff <= 1) { const a = Math.floor(Math.random() * 4) + 2,
                            b = Math.floor(Math.random() * 4) + 1,
                            x = Math.floor(Math.random() * 2) + 2;
                        question = `(${a}x + ${b}) + (${a*2}x - ${b}) เมื่อ x=${x} = ?`;
                        answer = (a * x + b) + (a * 2 * x - b);
                        hint = `แทน x=${x}`; } else if (diff === 2) { const a = Math.floor(Math.random() * 3) + 3,
                            b = Math.floor(Math.random() * 3) + 2;
                        question = `(${a}x + ${b})(${a}x - ${b}) เมื่อ x=1 = ?`;
                        answer = (a + b) * (a - b);
                        hint = `(${a}+${b})(${a}-${b})`; } else { const a = Math.floor(Math.random() * 3) + 2,
                            b = Math.floor(Math.random() * 3) + 2,
                            c = Math.floor(Math.random() * 3) + 1;
                        question =
                            `(${a}x² + ${b}x + ${c}) + (${a*2}x² - ${b}x + ${c*2}) เมื่อ x=1 = ?`;
                        answer = (a + b + c) + (a * 2 - b + c * 2);
                        hint = 'แทน x=1 แล้วรวมพจน์'; }
                    break;
                case 3:
                    if (diff <= 1) { const n = Math.floor(Math.random() * 5) + 2;
                        question = `x² + ${2*n}x + ${n*n} = (x + ?)²`;
                        answer = n;
                        hint = `(x+a)² = x²+2ax+a²`; } else if (diff === 2) { const n = Math.floor(Math.random() * 5) + 2;
                        question = `x² - ${2*n}x + ${n*n} = (x - ?)²`;
                        answer = n;
                        hint = `(x-a)² = x²-2ax+a²`; } else { const n = Math.floor(Math.random() * 6) + 4;
                        question = `x² - ${n*n} = (x + ${n})(x - ?)`;
                        answer = n;
                        hint = 'ผลต่างกำลังสอง'; }
                    break;
                case 4:
                    if (diff <= 1) { const side = Math.floor(Math.random() * 8) + 4;
                        question = `สามเหลี่ยมด้านเท่า มีด้านหนึ่งยาว ${side} ซม. ด้านที่เหลือยาว?`;
                        answer = side;
                        hint = 'ทุกด้านเท่ากัน'; } else if (diff === 2) { const angle = Math.floor(Math.random() * 30) + 40;
                        question = `สามเหลี่ยมหน้าจั่วมีมุมยอด ${angle}° มุมที่ฐานกาง?`;
                        answer = Math.round((180 - angle) / 2);
                        hint = `(180-${angle})÷2`; } else { const a = Math.floor(Math.random() * 5) + 3,
                            b = Math.floor(Math.random() * 5) + 3;
                        question = `สามเหลี่ยมมุมฉากมีด้าน ${a} และ ${b} หน่วย ด้านที่เหลือ?`;
                        answer = Math.round(Math.sqrt(a * a + b * b) * 10) / 10;
                        hint = `c² = ${a}²+${b}²`; }
                    break;
                case 5:
                    const mult = Math.floor(Math.random() * 2) + diff,
                        leg1 = 3 * mult,
                        leg2 = 4 * mult;
                    question = `สามเหลี่ยมมุมฉากมีด้าน ${leg1} และ ${leg2} หน่วย ด้านตรงข้ามฉาก?`;
                    answer = 5 * mult;
                    hint = `c² = ${leg1}²+${leg2}²`;
                    break;
                case 6:
                    if (diff <= 1) { const nums = [Math.floor(Math.random() * 20) + 10, Math.floor(Math.random() * 20) + 30,
                            Math.floor(Math.random() * 20) + 50
                        ];
                        question = `ข้อมูล: ${nums.join(', ')} จงหาค่าเฉลี่ย`;
                        answer = Math.round((nums.reduce((s, v) => s + v, 0) / 3) * 10) / 10;
                        hint = 'ผลรวม ÷ จำนวน'; } else if (diff === 2) { const nums = [Math.floor(Math.random() * 30) + 20, Math
                            .floor(Math.random() * 30) + 40, Math.floor(Math.random() * 30) + 60, Math.floor(Math.random() *
                                20) + 50, Math.floor(Math.random() * 20) + 30
                        ];
                        const sorted = [...nums].sort((a, b) => a - b);
                        question = `ข้อมูล: ${nums.join(', ')} จงหามัธยฐาน`;
                        answer = sorted[2];
                        hint = `เรียง: ${sorted.join(', ')}`; } else { question =
                            'ข้อมูล: 2,3,3,4,5,5,5,6,7,8 จงหาฐานนิยม';
                        answer = 5;
                        hint = 'ค่าที่ซ้ำมากที่สุด'; }
                    break;
                case 7:
                    if (diff <= 1) { const r = 3,
                            h = 7;
                        question = `ทรงกระบอก r=${r}, h=${h}, π=22/7 จงหาปริมาตร`;
                        answer = Math.round((22 / 7) * r * r * h);
                        hint = 'πr²h'; } else if (diff === 2) { question =
                            'ทอยลูกเต๋า 2 ลูก ความน่าจะเป็นผลรวม 7 (ตอบ a/b)';
                        answer = '1/6';
                        hint = '6/36 = 1/6'; } else { const r = Math.floor(Math.random() * 3) + 3,
                            h = Math.floor(Math.random() * 5) + 5;
                        question = `กรวย r=${r}, h=${h}, π=22/7 จงหาปริมาตร`;
                        answer = Math.round((1 / 3) * (22 / 7) * r * r * h);
                        hint = '⅓πr²h'; }
                    break;
                default:
                    question = '5 + 3 × 2 = ?';
                    answer = 11;
                    hint = 'คูณก่อนบวก';
            }
            return { question, answer, hint };
        }

        // ──────────────── SCREEN RENDERERS ────────────────
        function renderScreen(screenName) {
            const content = document.getElementById('gameContent');
            switch (screenName) {
                case 'menu':
                    content.innerHTML = renderMenu();
                    break;
                case 'classSelect':
                    content.innerHTML = renderClassSelect();
                    break;
                case 'chapters':
                    content.innerHTML = renderChapters();
                    break;
                case 'battle':
                    content.innerHTML = renderBattle();
                    setupBattle();
                    startBgMusic();
                    break;
                case 'shop':
                    content.innerHTML = renderShop();
                    break;
                case 'petShop':
                    content.innerHTML = renderPetShop();
                    break;

                    break;
                case 'achievements':
                    content.innerHTML = renderAchievements();
                    break;
                case 'leaderboard':
                    content.innerHTML = renderLeaderboard();
                    break;

            }
        }

        function renderClassSelect() {
            let html =
                '<h3 style="color:var(--text);text-align:center;margin-bottom:10px;">🎭 เลือกคลาส</h3><div class="class-grid">';
            for (const [key, def] of Object.entries(classDefinitions)) {
                const unlocked = isClassUnlocked(key);
                const lockInfo = !unlocked && def.unlockRequirement ?
                    `🔒 ต้องชนะบอสบทที่ ${def.unlockRequirement.chapter}` : '';
                html += `
                <div class="class-card ${playerClass === key ? 'selected' : ''} ${!unlocked ? 'locked' : ''}"
                     onclick="${unlocked ? `selectClass('${key}')` : 'showLockedClassMessage()'}">
                    <span class="class-emoji">${def.emoji}</span>
                    <div class="class-name">${def.name}</div>
                    <div class="class-desc">${def.desc.replace(/\n/g, '<br>')}</div>
                    ${playerClass === key ? '<span class="badge badge-green mt-1">✅ ใช้งาน</span>' : ''}
                    ${!unlocked ? `<div class="class-lock-info">${lockInfo}</div>` : ''}
                </div>`;
            }
            html +=
                '</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
            return html;
        }

        function selectClass(key) {
            if (!isClassUnlocked(key)) { showModal('🔒 ล็อค', 'คุณยังไม่สามารถใช้คลาสนี้ได้!', null); return; }
            playerClass = key;
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            saveGame();
            renderScreen('classSelect');
            sfxClick();
        }

        function showLockedClassMessage() { showModal('🔒 คลาสถูกล็อค',
            'คุณต้องเอาชนะบอสที่กำหนดเพื่อปลดล็อคคลาสนี้!', null); }

        function renderChapters() {
            let html = '<div class="flex-col" style="gap:7px;">';

                const unlocked = unlockedChapters.includes(ch.id);
                const progress = getChapterProgress(ch.id);
                html += `
                <div class="chapter-container">
                    <div class="chapter-header ${!unlocked ? 'locked' : ''}" onclick="${unlocked ? `toggleChapterDetail(${ch.id})` : 'showLockedMessage()'}">
                        <div class="chapter-icon">${ch.icon}</div>
                        <div class="chapter-info">
                            <div class="chapter-name">${ch.name}</div>
                            <div class="chapter-progress">${unlocked ? `ผ่าน ${completedLevels[ch.id]?.length||0}/3 ด่าน` : '🔒 ยังไม่ปลดล็อค'}</div>
                            ${unlocked ? `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%;"></div></div>` : ''}
                        </div>
                        <span style="font-size:18px;">${unlocked ? (progress>=100?'✅':'🔓') : '🔒'}</span>
                    </div>
                    <div class="level-list" id="levelList-${ch.id}" style="display:none;">

                            const lvlUnlocked = isLevelUnlocked(ch.id, lv);
                            const lvlCompleted = isLevelCompleted(ch.id, lv);

                            <button class="level-btn ${lvlCompleted?'completed':''} ${!lvlUnlocked?'locked':''} ${lvlUnlocked&&!lvlCompleted?'current':''}"

                                <div class="text-sm">${lv===3?'BOSS':lv===1?'ง่าย':'ปานกลาง'}</div>
                                ${lvlCompleted?'✅':''}
                            </button>`;
                        }).join('')}
                    </div>
                </div>`;
            });
            html +=
                '</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
            return html;
        }

        function toggleChapterDetail(chapterId) {
            const list = document.getElementById('levelList-' + chapterId);
            if (list) list.style.display = list.style.display === 'none' ? 'grid' : 'none';
        }

        // ──────────────── BATTLE SYSTEM (EMOJI-BASED) ────────────────
        function renderBattle() {
            const ch = chapterData.find(c => c.id === player.currentChapter) || chapterData[0];
            const isBossLevel = player.currentLevel === 3;
            const cd = getClassDef();
            const petInfo = equippedPet && petDefinitions[equippedPet] ?
                `${petDefinitions[equippedPet].emoji} ${petDefinitions[equippedPet].name}` : '';
            return `
            <div class="battle-scene">
                <div class="stats-bar mb-4">
                    <span class="badge badge-blue">${ch.icon} ${ch.name} ด.${player.currentLevel} ${isBossLevel?'👑':''}</span>
                    <span class="badge badge-gold" id="comboBadge">🔥 คอมโบ: 0</span>
                    <span>🪙 <span class="stat-gold">${player.gold}</span></span>
                </div>
                <div class="combatants-row">
                    <div class="combatant">
                        <div class="emoji-display" id="playerEmoji">${getPlayerEmoji()}</div>
                        <div class="combatant-name">${player.name} Lv.${player.level}</div>
                        ${petInfo ? `<div class="pet-indicator">🐾 ${petInfo}</div>` : ''}
                        <div class="hp-bar-outer"><div class="hp-bar-inner" id="playerHpBar" style="width:100%;"></div></div>
                        <div class="hp-text">❤️ <span id="playerHpText">${player.hp}/${player.maxHp}</span></div>
                        ${player.shield?'<div class="badge badge-blue mt-1">🛡️ เกราะ</div>':''}
                        ${skillActive.dodge?'<div class="badge badge-green mt-1">💨 หลบหลีก</div>':''}
                        ${skillActive.reflectShield?'<div class="badge badge-purple mt-1">🛡️ สะท้อน</div>':''}
                    </div>
                    <div class="vs-badge">VS</div>
                    <div class="combatant">
                        <div class="emoji-display" id="bossEmoji">${getBossEmoji(player.currentChapter||1)}</div>
                        <div class="combatant-name boss">${ch.bossEmoji} บอสบทที่ ${player.currentChapter}</div>
                        <div class="hp-bar-outer"><div class="hp-bar-inner boss-hp" id="bossHpBar" style="width:100%;"></div></div>
                        <div class="hp-text">❤️ <span id="bossHpText">${player.bossHp}/${player.bossMaxHp}</span></div>
                        ${isBossLevel?'<div class="badge badge-red mt-1">🔥 RAGE</div>':''}
                    </div>
                </div>
            </div>

                <div class="question-display" id="questionDisplay">กำลังโหลดโจทย์...</div>

                    <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">⚡ โจมตี!</button>
                </div>
                <div class="combo-display" id="comboDisplay"></div>
                <div class="feedback-msg" id="feedbackMsg"></div>
            </div>
            <div class="flex-row" style="gap:6px;">
                <button class="btn btn-sm btn-warning" onclick="useSkill('skill1')" id="btnSkill1">${cd.skill1.name} (${cd.skill1.cost}🪙)</button>
                <button class="btn btn-sm btn-success" onclick="useSkill('skill2')" id="btnSkill2">${cd.skill2.name} (${cd.skill2.cost}🪙)</button>
                <button class="btn btn-sm btn-danger" onclick="useSkill('skip')" id="btnSkip">⏩ ข้าม (-12HP)</button>
            </div>
            <div class="text-sm text-center mt-1" style="color:var(--text2);min-height:16px;" id="cooldownIndicator"></div>
            ${inventory.potion > 0 ? `<button class="btn btn-sm btn-outline w-full mt-2" onclick="usePotion()">🧪 ใช้โพชั่น (เหลือ ${inventory.potion})</button>` : ''}
            ${inventory.superPotion > 0 ? `<button class="btn btn-sm btn-warning w-full mt-1" onclick="useSuperPotion()">💜 ซุปเปอร์โพชั่น (เหลือ ${inventory.superPotion})</button>` : ''}
            <button class="btn btn-outline w-full mt-2" onclick="fleeBattle()">🏃 หนี (-20🪙)</button>`;
        }

        function setupBattle() {
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCooldowns = { skill1: 0, skill2: 0 };
            skillActive = { guaranteedCrit: false, dodge: false, critBoost: false, stealth: false,
            reflectShield: false };
            const bossBaseHp = 100 + (player.currentChapter * 15) + (player.currentLevel * 25);
            player.bossMaxHp = bossBaseHp;
            player.bossHp = bossBaseHp;
            updateBattleUI();
            updateCooldownUI();
            nextQuestion();
            const input = document.getElementById('answerInput');
            if (input) setTimeout(() => input.focus(), 300);
        }

        function nextQuestion() {
            if (player.bossHp <= 0 || player.hp <= 0) { endBattle(); return; }
            currentQuestion = generateQuestion(player.currentChapter, player.currentLevel);
            const qDisplay = document.getElementById('questionDisplay');
            if (qDisplay) qDisplay.innerHTML = currentQuestion.question;
            const ansInput = document.getElementById('answerInput');
            if (ansInput) { ansInput.value = '';
                ansInput.disabled = false;
                ansInput.className = 'answer-input';
                setTimeout(() => ansInput.focus(), 100); }
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = false;
            const feedback = document.getElementById('feedbackMsg');
            if (feedback) feedback.textContent = '';
            const comboDisp = document.getElementById('comboDisplay');
            if (comboDisp) comboDisp.textContent = '';
            updateCooldownUI();
            const cd = getClassDef();
            if (cd.regenPerTurn && player.hp < player.maxHp) {
                player.hp = Math.min(player.maxHp, player.hp + cd.regenPerTurn);
                updateBattleUI();
            }
        }

        function submitAnswer() {
            const input = document.getElementById('answerInput');
            if (!input || !currentQuestion) return;
            const userAnswer = input.value.trim();
            if (userAnswer === '') return;
            const correctAnswer = currentQuestion.answer.toString();
            let isCorrect = false;
            if (userAnswer === correctAnswer) isCorrect = true;
            else if (!isNaN(parseFloat(userAnswer)) && !isNaN(parseFloat(correctAnswer))) {
                isCorrect = Math.abs(parseFloat(userAnswer) - parseFloat(correctAnswer)) < 0.09;
            }
            input.disabled = true;
            document.getElementById('submitBtn').disabled = true;
            if (isCorrect) {
                input.classList.add('correct-flash');
                setTimeout(() => input.classList.remove('correct-flash'), 500);
                handleCorrectAnswer(input);
            } else {
                input.classList.add('wrong-flash');
                setTimeout(() => input.classList.remove('wrong-flash'), 500);
                handleWrongAnswer(input);
            }
        }

        function handleCorrectAnswer(inputElement) {
            sfxCorrect();
            player.combo++;
            player.totalCorrect++;
            if (player.combo > player.maxCombo) player.maxCombo = player.combo;
            const cd = getClassDef();
            const petBonus = getPetBonus();
            let damage = 20 + (player.combo * 4);
            damage = Math.round(damage * cd.baseDamageMultiplier);
            damage = Math.round(damage * (1 + petBonus.damage));
            if (player.combo >= 5 && cd.comboBonus) damage = Math.round(damage * cd.comboBonus);
            if (player.combo >= 5 && petBonus.combo > 0) damage = Math.round(damage * (1 + petBonus.combo));
            let critChance = 0.08 + (cd.critChanceBonus || 0) + petBonus.crit;
            if (inventory.orb) critChance += 0.2;
            let isCrit = Math.random() < critChance;
            if (skillActive.guaranteedCrit) { isCrit = true;
                skillActive.guaranteedCrit = false; }
            if (skillActive.stealth) { isCrit = true;
                skillActive.stealth = false; }
            if (isCrit) {
                damage = Math.round(damage * (cd.critMultiplier || 3));
                sfxCrit();
                const bossEl = document.getElementById('bossEmoji');
                if (bossEl) { bossEl.classList.add('crit');
                    setTimeout(() => bossEl.classList.remove('crit'), 500); }
            }
            if (inventory.weapon) damage = Math.round(damage * 1.5);
            if (skillActive.critBoost && isCrit) {
                damage = Math.round(damage * (cd.skill1?.multiplier || 3));
                skillActive.critBoost = false;
            }
            player.bossHp = Math.max(0, player.bossHp - damage);
            const goldEarned = Math.round(6 + (player.combo * 2) + (player.currentLevel * 2));
            addGold(goldEarned);
            player.score += Math.round(25 + (player.combo * 5));
            const rect = inputElement.getBoundingClientRect();
            spawnSparkle(rect.left + rect.width / 2, rect.top, isCrit ? '💥' : '⚡');
            const feedback = document.getElementById('feedbackMsg');
            if (feedback) { feedback.textContent =
                    `✅ ถูก! ดาเมจ ${damage} ${isCrit?'💥คริ!':''} | +${goldEarned}🪙`;
                feedback.style.color = 'var(--green)'; }
            if (player.combo >= 3) {
                document.getElementById('comboDisplay').textContent = `🔥 COMBO x${player.combo}!`;
                document.getElementById('comboBadge').textContent = `🔥 คอมโบ: ${player.combo}`;
            }
            const playerEl = document.getElementById('playerEmoji');
            if (playerEl && !isCrit) { playerEl.classList.add('shake');
                setTimeout(() => playerEl.classList.remove('shake'), 400); }
            const bossEl2 = document.getElementById('bossEmoji');
            if (bossEl2 && !isCrit) { bossEl2.classList.add('shake');
                setTimeout(() => bossEl2.classList.remove('shake'), 400); }
            updateBattleUI();
            reduceCooldowns();
            saveGame();
            setTimeout(nextQuestion, 1100);
        }

        function handleWrongAnswer(inputElement) {
            sfxWrong();
            player.combo = 0;
            player.totalWrong++;
            let damageTaken = 12 + (player.currentLevel * 3);
            const cd = getClassDef();
            if (skillActive.dodge) {
                skillActive.dodge = false;
                damageTaken = 0;
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent = '💨 หลบหลีกสำเร็จ!';
                    fb.style.color = 'var(--green)'; }
            } else if (skillActive.stealth && Math.random() < 0.5) {
                damageTaken = 0;
                skillActive.stealth = false;
                const fb = document.getElementById('feedbackMsg');
                if (fb) { fb.textContent = '💨 ล่องหน! หลบได้';
                    fb.style.color = 'var(--purple)'; }
            } else if (player.shield) {
                player.shield = false;
                if (skillActive.reflectShield) {
                    skillActive.reflectShield = false;
                    player.bossHp = Math.max(0, player.bossHp - 20);
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = '🛡️ สะท้อน! ดาเมจกลับ 20!';
                        fb.style.color = 'var(--purple)'; }
                } else {
                    damageTaken = 0;
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = '🛡️ เกราะป้องกันไว้!';
                        fb.style.color = 'var(--accent)'; }
                }
            } else {
                if (cd.dodgeChance && Math.random() < cd.dodgeChance) {
                    damageTaken = 0;
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent = '💨 หลบอัตโนมัติ!';
                        fb.style.color = 'var(--green)'; }
                } else {
                    player.hp = Math.max(0, player.hp - damageTaken);
                    const fb = document.getElementById('feedbackMsg');
                    if (fb) { fb.textContent =
                            `❌ ผิด! คำตอบคือ ${currentQuestion.answer} (-${damageTaken} HP) | 💡 ${currentQuestion.hint}`;
                        fb.style.color = 'var(--red)'; }
                }
            }
            if (damageTaken > 0) {
                const playerEl = document.getElementById('playerEmoji');
                if (playerEl) { playerEl.classList.add('shake');
                    setTimeout(() => playerEl.classList.remove('shake'), 400); }
                spawnSparkle(window.innerWidth / 2 - 40, window.innerHeight / 3, '💔');
            }
            document.getElementById('comboBadge').textContent = '🔥 คอมโบ: 0';
            document.getElementById('comboDisplay').textContent = '';
            updateBattleUI();
            reduceCooldowns();
            saveGame();
            setTimeout(nextQuestion, 1800);
        }

        function reduceCooldowns() {
            if (skillCooldowns.skill1 > 0) skillCooldowns.skill1--;
            if (skillCooldowns.skill2 > 0) skillCooldowns.skill2--;
            updateCooldownUI();
        }

        function updateCooldownUI() {
            const indicator = document.getElementById('cooldownIndicator');
            if (!indicator) return;
            const cd = getClassDef();
            let text = '';
            if (skillCooldowns.skill1 > 0) text +=
                `${cd.skill1.name} CD ${skillCooldowns.skill1} เทิร์น `;
            if (skillCooldowns.skill2 > 0) text +=
                `${cd.skill2.name} CD ${skillCooldowns.skill2} เทิร์น `;
            indicator.textContent = text;
            const btn1 = document.getElementById('btnSkill1');
            const btn2 = document.getElementById('btnSkill2');
            if (btn1) btn1.disabled = skillCooldowns.skill1 > 0 || player.gold < cd.skill1.cost;
            if (btn2) btn2.disabled = skillCooldowns.skill2 > 0 || player.gold < cd.skill2.cost;
        }

        function updateBattleUI() {
            const playerHpBar = document.getElementById('playerHpBar');
            const bossHpBar = document.getElementById('bossHpBar');
            const playerHpText = document.getElementById('playerHpText');
            const bossHpText = document.getElementById('bossHpText');
            if (playerHpBar) playerHpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            if (bossHpBar) bossHpBar.style.width = Math.max(0, (player.bossHp / player.bossMaxHp) * 100) + '%';
            if (playerHpText) playerHpText.textContent = `${player.hp}/${player.maxHp}`;
            if (bossHpText) bossHpText.textContent = `${player.bossHp}/${player.bossMaxHp}`;
            const comboBadge = document.getElementById('comboBadge');
            if (comboBadge) comboBadge.textContent = `🔥 คอมโบ: ${player.combo}`;
        }

        function useSkill(type) {
            const cd = getClassDef();
            if (type === 'skill1') {
                if (skillCooldowns.skill1 > 0) return;
                if (!spendGold(cd.skill1.cost)) { showFeedbackMsg('⚠️ เหรียญไม่พอ!'); return; }
                skillCooldowns.skill1 = cd.skill1.cooldown;
                sfxSkill();
                if (cd.skill1.type === 'guaranteed_crit') skillActive.guaranteedCrit = true;
                if (cd.skill1.type === 'crit_boost') skillActive.critBoost = true;
                if (cd.skill1.type === 'damage_boost') {
                    const bonusDamage = Math.round(25 * (cd.skill1.multiplier || 2));
                    player.bossHp = Math.max(0, player.bossHp - bonusDamage);
                    const bossEl = document.getElementById('bossEmoji');
                    if (bossEl) { bossEl.classList.add('shake');
                        setTimeout(() => bossEl.classList.remove('shake'), 400); }
                    spawnSparkleBurst(window.innerWidth / 2, window.innerHeight / 3, 8);
                    showFeedbackMsg(`${cd.skill1.name}! ดาเมจ ${bonusDamage}`, 'var(--gold)');
                    updateBattleUI();
                }
                saveGame();
            } else if (type === 'skill2') {
                if (skillCooldowns.skill2 > 0) return;
                if (!spendGold(cd.skill2.cost)) { showFeedbackMsg('⚠️ เหรียญไม่พอ!'); return; }
                skillCooldowns.skill2 = cd.skill2.cooldown;
                sfxSkill();
                if (cd.skill2.type === 'shield') { player.shield = true;
                    updateBattleUI(); }
                if (cd.skill2.type === 'reflect_shield') { player.shield = true;
                    skillActive.reflectShield = true;
                    updateBattleUI(); }
                if (cd.skill2.type === 'heal') {
                    player.hp = Math.min(player.maxHp, player.hp + cd.skill2.healAmount);
                    updateBattleUI();
                    const playerEl = document.getElementById('playerEmoji');
                    if (playerEl) { playerEl.classList.add('heal');
                        setTimeout(() => playerEl.classList.remove('heal'), 600); }
                    showFeedbackMsg(`💚 ฮีล +${cd.skill2.healAmount} HP!`, 'var(--green)');
                }
                if (cd.skill2.type === 'dodge') skillActive.dodge = true;
                if (cd.skill2.type === 'stealth') { skillActive.dodge = true;
                    skillActive.stealth = true; }
                if (cd.skill2.type === 'ultimate') {
                    player.hp = player.maxHp;
                    player.bossHp = Math.max(0, player.bossHp - (cd.skill2.damageAmount || 80));
                    updateBattleUI();
                    spawnSparkleBurst(window.innerWidth / 2, window.innerHeight / 3, 20);
                    showFeedbackMsg('🐲 คลื่นมังกร! ฟื้นเต็ม + ดาเมจ 80!', 'var(--purple)');
                }
                saveGame();
            } else if (type === 'skip') {
                if (player.hp > 12) {
                    player.hp -= 12;
                    player.combo = 0;
                    updateBattleUI();
                    reduceCooldowns();
                    nextQuestion();
                    showFeedbackMsg('⏩ ข้ามข้อ เสีย 12 HP', 'var(--gold)');
                }
            }
            updateCooldownUI();
        }

        function showFeedbackMsg(msg, color = 'var(--text2)') {
            const fb = document.getElementById('feedbackMsg');
            if (fb) { fb.textContent = msg;
                fb.style.color = color; }
        }

        function usePotion() {
            if (inventory.potion <= 0) return;
            inventory.potion--;
            player.hp = player.maxHp;
            updateBattleUI();
            const playerEl = document.getElementById('playerEmoji');
            if (playerEl) { playerEl.classList.add('heal');
                setTimeout(() => playerEl.classList.remove('heal'), 600); }
            showFeedbackMsg('🧪 ใช้โพชั่น! ฟื้น HP เต็ม', 'var(--green)');
            saveGame();
        }

        function useSuperPotion() {
            if (inventory.superPotion <= 0) return;
            inventory.superPotion--;
            player.hp = player.maxHp;
            player.bossHp = Math.max(0, player.bossHp - 50);
            updateBattleUI();
            const bossEl = document.getElementById('bossEmoji');
            if (bossEl) { bossEl.classList.add('shake');
                setTimeout(() => bossEl.classList.remove('shake'), 400); }
            spawnSparkleBurst(window.innerWidth / 2, window.innerHeight / 3, 12);
            showFeedbackMsg('💜 ซุปเปอร์โพชั่น! ฟื้นเต็ม + ดาเมจ 50!', 'var(--purple)');
            saveGame();
        }

        function endBattle() {
            if (player.bossHp <= 0) {
                sfxWin();
                const bossEl = document.getElementById('bossEmoji');
                if (bossEl) bossEl.style.opacity = '0';
                const playerEl = document.getElementById('playerEmoji');
                if (playerEl) { playerEl.style.transform = 'scale(1.3)';
                    setTimeout(() => { if (playerEl) playerEl.style.transform = 'scale(1)'; }, 600); }
                spawnSparkleBurst(window.innerWidth / 2, window.innerHeight / 3, 20);
                const goldReward = Math.round(40 + (player.currentLevel * 25) + (player.currentChapter * 10));
                addGold(goldReward);
                player.score += Math.round(100 + (player.currentLevel * 50));
                unlockNextLevel(player.currentChapter, player.currentLevel);
                if (player.currentLevel === 3 && !bossDefeatedChapters.includes(player.currentChapter)) {
                    bossDefeatedChapters.push(player.currentChapter);
                }
                stopBgMusic();
                saveGame();
                setTimeout(() => {
                    showModal('🎉 ชัยชนะ!',
                        `พิชิตด่าน ${player.currentLevel} บทที่ ${player.currentChapter} สำเร็จ!\nได้รับ ${goldReward}🪙 โบนัส`,
                        () => renderScreen('chapters'));
                }, 800);
            } else if (player.hp <= 0) {
                stopBgMusic();
                player.gold = Math.max(0, player.gold - 15);
                saveGame();
                showModal('💀 พ่ายแพ้', 'หมดพลัง! เสีย 15🪙 ลองใหม่', () => renderScreen('chapters'));
            }
        }

        function startLevel(chapterId, levelId) {
            if (!isLevelUnlocked(chapterId, levelId)) { showModal('🔒 ล็อค', 'ผ่านด่านก่อนหน้าก่อน!', null); return; }
            player.currentChapter = chapterId;
            player.currentLevel = levelId;
            player.maxHp = getMaxHp();
            player.hp = player.maxHp;
            player.combo = 0;
            player.shield = false;
            skillCooldowns = { skill1: 0, skill2: 0 };
            skillActive = { guaranteedCrit: false, dodge: false, critBoost: false, stealth: false,
            reflectShield: false };
            renderScreen('battle');
        }

        function fleeBattle() {
            stopBgMusic();
            player.gold = Math.max(0, player.gold - 20);
            saveGame();
            renderScreen('chapters');
        }

        // ──────────────── GACHA SYSTEM ────────────────
        function renderGacha() {
            return `
            <h3 style="color:var(--text);text-align:center;margin-bottom:10px;">🎰 กาชาเสี่ยงโชค</h3>
            <div class="stats-bar mb-4"><span>🪙 เหรียญ: <span class="stat-gold">${player.gold.toLocaleString()}</span></span><span>💰 100🪙 / ครั้ง</span></div>
            <div class="gacha-card" id="gachaCard">
                <div style="font-size:56px;margin-bottom:8px;" id="gachaDisplay">🎰</div>
                <div style="color:var(--text);font-weight:600;margin-bottom:4px;" id="gachaResultText">ลองเสี่ยงโชคดูสิ!</div>
                <div class="text-sm" style="color:var(--text2);margin-bottom:10px;">ลุ้นรับเหรียญ โพชั่น ไอเทม หรือสัตว์เลี้ยงหายาก!</div>
                <button class="btn btn-gold w-full" id="gachaBtn" onclick="doGacha()">🎰 กาชา 1 ครั้ง (100🪙)</button>
                <button class="btn btn-sm btn-outline w-full mt-2" onclick="doGacha(5)">🎰 กาชา 5 ครั้ง (450🪙)</button>
            </div>
            <div class="text-sm text-center mt-2" style="color:var(--text2);">
                อัตรา: ทั่วไป 45% | ไม่ธรรมดา 28% | หายาก 17% | Epic 7% | Legendary 3%
            </div>
            <button class="btn btn-outline w-full mt-4" onclick="renderScreen('menu')">🔙 กลับ</button>`;
        }

        function doGacha(times = 1) {
            const cost = times === 5 ? 450 : 100;
            if (!spendGold(cost)) { showModal('⚠️ เหรียญไม่พอ',
                    `ต้องการ ${cost}🪙 แต่มี ${player.gold}🪙`, null); return; }
            sfxGacha();
            const results = [];
            for (let i = 0; i < times; i++) {
                const reward = pullGacha();
                results.push(reward);
                applyGachaReward(reward);
            }
            saveGame();
            const lastResult = results[results.length - 1];
            const display = document.getElementById('gachaDisplay');
            const resultText = document.getElementById('gachaResultText');
            const gachaBtn = document.getElementById('gachaBtn');
            if (display && lastResult) {
                display.textContent = lastResult.emoji;
                display.classList.add('gacha-result');
                setTimeout(() => display.classList.remove('gacha-result'), 600);
            }
            if (resultText && lastResult) {
                resultText.textContent =
                    `${lastResult.name} (${lastResult.rarity.toUpperCase()})${times>1?` และอีก ${times-1} รางวัล`:''}`;
            }
            if (gachaBtn) gachaBtn.textContent = `🎰 กาชา 1 ครั้ง (100🪙) | เหลือ ${player.gold}🪙`;
            const card = document.getElementById('gachaCard');
            if (card) {
                const rect = card.getBoundingClientRect();
                spawnSparkleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 14);
            }
        }

        function pullGacha() {
            const totalWeight = gachaPool.reduce((s, r) => s + r.weight, 0);
            let roll = Math.random() * totalWeight;
            let selectedRarity = gachaPool[0];
            for (const rarity of gachaPool) {
                roll -= rarity.weight;
                if (roll <= 0) { selectedRarity = rarity; break; }
            }
            const rewards = selectedRarity.rewards;
            const reward = rewards[Math.floor(Math.random() * rewards.length)];
            return { ...reward, rarity: selectedRarity.rarity };
        }

        function applyGachaReward(reward) {
            switch (reward.type) {
                case 'gold':
                    addGold(reward.amount);
                    break;
                case 'potion':
                    inventory.potion = (inventory.potion || 0) + reward.amount;
                    break;
                case 'superPotion':
                    inventory.superPotion = (inventory.superPotion || 0) + reward.amount;
                    break;
                case 'orb':
                    inventory.orb = true;
                    break;
                case 'weapon':
                    inventory.weapon = true;
                    break;
                case 'shield':
                    inventory.shield = true;
                    break;
                case 'pet':
                    if (reward.petId && !ownedPets.includes(reward.petId)) {
                        ownedPets.push(reward.petId);
                        if (!equippedPet) equippedPet = reward.petId;
                    }
                    break;
            }
        }

            if (highScores.length === 0) html +=
                '<div class="text-center" style="color:var(--text2);">ยังไม่มีผู้กล้าในทำเนียบ</div>';
            html += '</div><button class="btn btn-outline w-full mt-4" onclick="renderScreen(\'menu\')">🔙 กลับ</button>';
            return html;
        }

        function changeName() {
            const newName = prompt('ใส่ชื่อใหม่:', player.name);
            if (newName && newName.trim()) { player.name = newName.trim();
                saveGame();
                renderScreen('menu'); }
        }

        function resetGame() {
            if (confirm('รีเซ็ตข้อมูลทั้งหมด? ไม่สามารถย้อนกลับได้!')) {
                localStorage.removeItem('mathquest_tawan_v3');
                localStorage.removeItem('mathquest_highscores_v3');
                player = { name: 'ผู้กล้า', hp: 100, maxHp: 100, score: 0, gold: 50, combo: 0, maxCombo: 0,
                    totalCorrect: 0, totalWrong: 0, shield: false, currentChapter: null, currentLevel: 1,
                    bossHp: 150, bossMaxHp: 150, rank: 'C', exp: 0, level: 1 };
                playerClass = 'warrior';
                equippedPet = null;
                inventory = { weapon: false, shield: false, orb: false, potion: 0, superPotion: 0 };
                ownedPets = [];
                analytics = {};
                completedLevels = {};
                unlockedChapters = [1];
                bossDefeatedChapters = [];
                skillCooldowns = { skill1: 0, skill2: 0 };
                skillActive = { guaranteedCrit: false, dodge: false, critBoost: false, stealth: false,
                reflectShield: false };
                highScores = [];
                player.maxHp = getMaxHp();
                player.hp = player.maxHp;
                renderScreen('menu');
            }
        }

        function showLockedMessage() { showModal('🔒 ยังไม่ปลดล็อค', 'ผ่านบทก่อนหน้านี้ก่อน!', null); }

        function showModal(title, message, callback) {
            const container = document.getElementById('modalContainer');
            container.innerHTML =
                `<div class="modal-overlay" onclick="closeModal(${callback?'true':'false'})"><div class="modal-content" onclick="event.stopPropagation()"><h3 style="color:var(--accent);margin-bottom:10px;">${title}</h3><p style="color:var(--text);white-space:pre-line;margin-bottom:14px;">${message}</p><button class="btn btn-primary" onclick="closeModal(${callback?'true':'false'})">ตกลง</button></div></div>`;
            window._modalCallback = callback;
        }

        function closeModal(hasCallback) {
            document.getElementById('modalContainer').innerHTML = '';
            if (hasCallback === true || hasCallback === 'true') {
                const cb = window._modalCallback;
                if (cb && typeof cb === 'function') setTimeout(cb, 150);
            }
            window._modalCallback = null;
        }

        // ──────────────── EVENT HANDLERS ────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const answerInput = document.getElementById('answerInput');
                if (answerInput && document.activeElement === answerInput) submitAnswer();
            }
        });

        // ──────────────── INIT ────────────────
        function init() {
            loadGame();
            player.maxHp = getMaxHp();
            if (player.hp > player.maxHp) player.hp = player.maxHp;
            if (player.gold === undefined || player.gold === null) player.gold = 50;
            if (!Array.isArray(ownedPets)) ownedPets = [];
            if (!Array.isArray(bossDefeatedChapters)) bossDefeatedChapters = [];
            renderScreen('menu');
        }

        init();
        console.log('🎮 Math Quest Ultimate v3 - Emoji Edition Loaded!');
        console.log('🐾 Pets | 🎰 Gacha | 😎 Emoji Characters | 👑 Boss Classes | 🪙 Hard Economy');
        console.log('⚡ Made by ตะวันสุดหล่อ');
    </script>
</body>
  </html>
